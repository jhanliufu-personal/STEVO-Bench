# World-model registry for StateWMBench generation pipeline.
#
# Each entry under `models` configures one world model.
# The orchestrator (run_world_models.py) reads this file and instantiates
# the appropriate adapter for each requested model.
#
# Common fields (all models):
#   type                 "api" or "local"
#   prompt_field         Which prompts.* YAML key to use as the text prompt.
#                        Use "video_WM" for models that take a single text prompt.
#                        Use "camera_WM" for models that accept camera control separately.
#   camera_control_field Which camera_control.* YAML sub-key to extract and pass as
#                        --camera_control to the script (or null for none).
#
# API model fields:
#   provider             Adapter identifier. Currently supported: "google_veo".
#   api_key_env          Environment variable that holds the API key.
#   model_id             Model version string (passed to the API).
#   poll_interval        Seconds between status-poll attempts (Veo is async).
#   timeout              Max seconds to wait for one video before giving up.
#
# Local model fields:
#   repo_path            Absolute path to the model's local repository clone.
#                        *** Update these paths for your machine. ***
#   script               Wrapper script path relative to repo_path.
#                        The script must accept the standard arg contract:
#                          --prompt TEXT
#                          --output PATH
#                          --init_frame PATH   (optional)
#                          --camera_control STRING  (optional)
#   extra_args              List of additional CLI args forwarded verbatim.
#   camera_control_default  Fallback camera-control string used when a task has no
#                           camera_control value for this model (null = pass nothing).

models:

  veo:
    type: api
    provider: google_veo
    prompt_field: video_WM
    camera_control_field: null
    model_id: veo-3.1-fast-generate-preview
    # model_id: veo-3.1-generate-preview
    api_key_env: GOOGLE_API_KEY
    # api_key_env: GOOGLE_ZIQI_KEY
    poll_interval: 10
    timeout: 600
    seconds: 8
    # max requests per minute (null = unlimited)
    rpm_limit: 5

  HY-WorldPlay:
    type: local
    prompt_field: camera_WM
    camera_control_field: HY-WorldPlay
    # on paros
    repo_path: /data/jhan/StateWMBench/HY-WorldPlay
    script: run_single.sh
    extra_args: []
    rpm_limit: null
    # Matches the length of the standard pan (s-3, right-20, left-20 = 43 latents).
    camera_control_default: "s-3, right-10, left-20, right-10"
    n_gpu: 8

  sora:
    type: api
    provider: openai_sora
    prompt_field: video_WM
    camera_control_field: null
    api_key_env: SORA_API_KEY
    model_id: sora-2-pro
    # Output resolution ("WxH"). The init_frame is auto-resized to match.
    # Supported 16:9 options: 1280x720, 1920x1080
    size: "1280x720"
    seconds: 4
    poll_interval: 20
    timeout: 900
    rpm_limit: null

  sora_pro:
    type: api
    provider: openai_sora
    prompt_field: video_WM
    camera_control_field: null
    api_key_env: SORA_API_KEY
    model_id: sora-2
    # Output resolution ("WxH"). The init_frame is auto-resized to match.
    # Supported 16:9 options: 1280x720, 1920x1080
    size: "1280x720"
    seconds: 8
    poll_interval: 20
    timeout: 900
    rpm_limit: null

  LingBot:
    type: local
    runner_class: lingbot
    prompt_field: camera_WM
    camera_control_field: lingbot
    # on paros
    repo_path: /data/jhan/StateWMBench/lingbot-world      
    script: run_single.sh
    extra_args: []
    rpm_limit: null
    # Pre-computed action folders (run precompute_lingbot_actions.py to generate)
    lingbot_actions_root: generation/world_models/lingbot_actions
    # Fallback when a task has lingbot: null — same pan as the standard HY-WorldPlay default
    camera_control_default: "s-3, right-10, left-20, right-10"
    n_gpu: 8

  wan22:
    type: local
    prompt_field: video_WM
    camera_control_field: null
    repo_path: /home/ubuntu/wan/Wan2.2
    script: run_single.sh
    extra_args: []
    rpm_limit: null
    n_gpu: 8
