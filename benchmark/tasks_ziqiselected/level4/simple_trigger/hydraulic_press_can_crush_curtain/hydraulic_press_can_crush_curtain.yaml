id: hydraulic_press_can_crush_curtain
level: 4
category: structural_transformation
transformation_type: irreversible_deformation (crushing)
prompts:
  image_gen_prompt: An upright, full aluminum soda can sits centered on the metal plate of a hydraulic
    press. The top press plate is moving down and is just touching the top of the can.
  video_WM: While the hydraulic press descends, a heavy curtain drops from the ceiling between the camera and the can, completely blocking the can and hydraulic press from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: The hydraulic press descends.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a silver aluminum soda can positioned vertically
    in the center of a hydraulic press. The can is intact and cylindrical. It sits on a textured metal
    bottom plate. A heavy, thick metal top plate is positioned just above the can, barely touching it.
    In the background, there are hydraulic hoses, a pressure gauge on the right, and the greasy, industrial
    metal frame of the machine.
  init2final_edit_prompt: Edit the given image so that the heavy top plate of the press is positioned
    significantly lower, reducing the vertical gap between the plates. The silver aluminum can between
    the plates should be vertically compressed, appearing crushed, flattened, and crumpled with visible
    buckling and folds in its metal surface.
  rationale: The prompt describes the hydraulic press plate moving downward continuously to crush the
    can. While the camera rotates away and then back to the original view, time passes, allowing the press
    to exert force and significantly compress the object. Therefore, in the final frame, the top plate
    must be lower than in the initial frame, and the can must have undergone irreversible structural deformation
    (crushing/buckling) due to the physical pressure.
  questions:
  - id: plate_position_lower
    question: Is the top metal plate positioned lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the top plate relative to the background or bottom
      plate.
  - id: can_compressed_height
    question: Is the overall height of the soda can reduced compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The can should be shorter due to crushing.
  - id: can_deformation_buckling
    question: Does the can show visible buckling, folding, or crumpling of its metal surface?
    answer_type: yes_no
    notes_for_judge: Look for irregular surfaces indicating structural failure, as opposed to the smooth
      cylinder in the start.
  - id: gap_reduction
    question: Is the vertical distance between the top and bottom press plates smaller than initially?
    answer_type: yes_no
    notes_for_judge: The space containing the can must be smaller.
  - id: structural_integrity_loss
    question: Has the can lost its original perfect cylindrical shape?
    answer_type: yes_no
    notes_for_judge: It should look deformed.
  - id: width_expansion
    question: Does the can appear wider or bulged outward due to the vertical compression?
    answer_type: yes_no
    notes_for_judge: Crushing a cylinder vertically usually forces material outwards.
  - id: background_consistency_gauge
    question: Is the pressure gauge in the background still visible (or partially visible) in roughly
      the same location?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for the camera returning to the original angle.
  - id: background_consistency_hoses
    question: Are the black hydraulic hoses in the background still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
