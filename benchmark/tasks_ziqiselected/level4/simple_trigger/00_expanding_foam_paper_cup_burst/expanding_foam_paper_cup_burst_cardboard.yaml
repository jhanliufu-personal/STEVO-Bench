id: expanding_foam_paper_cup_burst_06
level: 4
category: structural_transformation
tags: []
variant_of: expanding_foam_paper_cup_burst
variation_type: dynamic_condition
variation_description: The cup is replaced by a wide shallow bowl, allowing lateral expansion without
  pressure buildup.
changes:
  occlusion_method: null
  dynamic_conditions: Container changed to a wide, open bowl.
  expected_outcome_change: Foam forms a wide mound; no burst due to lack of confinement
prompts:
  init_frame_edit_prompt: Edit the image to replace the paper cup with a wide, shallow plastic mixing
    bowl.
  video_WM: While the hand keeps pressing the trigger, a piece of cardboard is held up in front of the camera view, completely blocking the bowl and spray can from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the cardboard is lowered. The camera remains stationary; no scene cuts; no new people or objects enter the scene. removed. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: The hand keeps pressing the trigger.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a workbench covered in clear plastic sheeting
    with dried foam residue. In the center, a translucent white plastic mixing bowl sits empty. A gloved
    hand (wearing a grey glove) holds a can of 'Great Stuff' expanding foam with a red straw nozzle positioned
    over the bowl. In the background, there is a wooden structure, a hammer, a clamp, and a screwdriver.
  init2final_edit_prompt: Edit the given image to show a mound of yellow, puffy expanding polyurethane
    foam inside the white plastic bowl. The foam should appear textured and expanded, filling a significant
    portion of the bowl's interior volume. The foam should look like it has settled and grown within the
    bowl. Keep the background tools, the plastic sheeting, and the gloved hand holding the can in their
    original positions.
  rationale: The video prompt describes the dispensing of expanding foam into a bowl, followed by a camera
    pan away and back. During the occlusion caused by the camera rotation, the foam undergoes a chemical
    reaction, expanding significantly in volume. Since the bowl is described as wide with ample space,
    the foam will spread and rise within the bowl rather than bursting it. When the camera returns to
    the initial viewpoint, the primary change is the presence of a large mass of expanded foam inside
    the previously empty bowl. The environment and static objects remain unchanged.
  questions:
  - id: foam_presence
    question: Is there yellow expanding foam visible inside the plastic bowl?
    answer_type: yes_no
    notes_for_judge: Check for the presence of the new material described in the prompt.
  - id: volume_increase
    question: Is the volume of material inside the bowl greater than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The bowl started empty; it should now contain foam.
  - id: foam_texture
    question: Does the material in the bowl have a puffy or porous texture typical of expanding foam?
    answer_type: yes_no
    notes_for_judge: Looking for visual evidence of the specific material properties.
  - id: bowl_fill_state
    question: Is the bottom of the bowl covered by the foam?
    answer_type: yes_no
    notes_for_judge: The foam should have spread to cover the bottom.
  - id: structural_integrity_bowl
    question: Does the bowl appear to remain intact without bursting?
    answer_type: yes_no
    notes_for_judge: The prompt specifies a wide bowl with ample space, so it should contain the foam
      without breaking, unlike a confined burst scenario.
  - id: background_consistency_hammer
    question: Is the hammer in the background still visible and in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for static objects.
  - id: background_consistency_sheeting
    question: Is the plastic sheeting on the table still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
