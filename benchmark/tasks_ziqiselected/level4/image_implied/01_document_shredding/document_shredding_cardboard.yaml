id: document_shredding
level: 4
category: structural_transformation
transformation_type: cutting (machine)
prompts:
  image_gen_prompt: An active office paper shredder with cutting blades running. A single sheet of paper
    is held just above the feed slot.
  video_WM: A piece of cardboard is held up in front of the camera view, completely blocking the active shredder and paper from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the cardboard is lowered. The camera remains stationary; no scene cuts; no new people or objects enter the scene. removed. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: ""
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a clear-cased paper shredder in an office
    setting. A hand enters from the top right, holding a white sheet of paper positioned vertically just
    above the shredder's intake slot. The shredder's internal metal blades are visible through the clear
    plastic housing. The collection bin at the bottom is partially filled with white shredded paper strips.
    In the background, there is a blurred office environment with desks, computer monitors, and a person
    sitting at a desk.
  init2final_edit_prompt: Edit the given image to show the white sheet of paper significantly shortened,
    appearing as though a large portion of it has been pulled down into the shredder blades. Increase
    the volume of shredded paper strips inside the clear collection bin below the mechanism to reflect
    the newly processed material.
  rationale: 'The video prompt describes the paper being fed into the machine and the blades engaging.
    The camera then pans away and returns, creating a duration of time during which the shredding process
    continues. Upon the camera''s return, the physical state of the paper must have changed: the sheet
    held by the hand should be shorter (partially consumed) or fully gone, and the corresponding volume
    of shredded material in the bin must have increased. This represents an irreversible structural change
    to the paper.'
  questions:
  - id: paper_length
    question: Is the visible portion of the paper sheet shorter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The paper should have been fed into the machine, reducing the length visible above
      the slot.
  - id: bin_volume
    question: Is there a greater volume of shredded paper in the collection bin compared to the start?
    answer_type: yes_no
    notes_for_judge: The shredding process adds material to the bin.
  - id: paper_integrity
    question: Has the sheet of paper undergone structural reduction or fragmentation?
    answer_type: yes_no
    notes_for_judge: The paper is being destroyed/shredded.
  - id: shredding_progress
    question: Does the paper appear to be actively feeding into or consumed by the shredder?
    answer_type: yes_no
    notes_for_judge: Check for visual evidence of the paper moving into the blades or being shorter.
  - id: new_fragments
    question: Are there new paper strips visible in the bin that were not there initially?
    answer_type: yes_no
    notes_for_judge: The pile in the bin should look larger or higher.
  - id: hand_holding_less
    question: Is the hand holding a smaller piece of paper (or no paper) compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the paper is pulled in, less remains in the hand.
  - id: background_consistency
    question: Are the computer monitors in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: shredder_structure
    question: Does the shredder casing remain transparent?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
