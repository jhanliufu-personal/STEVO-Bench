  init_frame_description: A close-up, high-angle shot showing a person's hand holding the black and yellow
    housing of a tape measure on a wooden floor. The tape measure is extended towards the left side of
    the frame. The yellow tape blade is visible with inch markings '4', '5', and '6' clearly readable.
    The metal hook at the end of the tape is out of frame to the left. The wooden floorboards run horizontally
    across the image.
  init2final_edit_prompt: Edit the given image to show the tape measure in a fully retracted state. Remove
    the extended yellow tape blade from the wooden floor, leaving only the black and yellow housing held
    by the hand. Place the metal hook of the tape measure directly against the housing where the tape
    exits. Ensure the wooden floor texture is visible and continuous where the tape blade was removed.
    Keep the hand, the housing, and the camera framing exactly as they are in the original image.
  rationale: The video prompt describes a retraction action where the tape zips back into the housing
    until it is gone. The camera rotates away (occluding the tape) and then rotates back to the original
    view ('back in the center' is interpreted here as returning to the initial subject position given
    the symmetrical camera movement description). Therefore, the final frame should depict the same scene
    as the initial frame but with the scalar state of the tape changed from 'extended' to 'fully retracted'.
    The time elapsed during the camera rotation allows for the complete retraction of the tape.
