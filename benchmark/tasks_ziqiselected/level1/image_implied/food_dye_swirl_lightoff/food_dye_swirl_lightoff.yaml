id: food_dye_swirl_lightoff
level: 1
category: scalar_state
tags: []
prompts:
  image_gen_prompt: A clear glass filled with still, transparent water sits on a white surface. A dropper is positioned above
    the glass, releasing a single drop of bright red food coloring that has just made contact with the water surface, beginning
    to disperse.
  video_WM: The room lights switch off, leaving the glass in complete darkness and completely invisible for a prolonged duration. After a pause, the lights turn back on. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  questions:
  - id: dye_volume_growth
    question: Does the red dye occupy a larger volume of the water than it did in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the total area/volume of red coloration. It should be greater in the final frame.
  - id: dye_depth
    question: Has the red plume sunk deeper into the glass compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The lowest point of the red dye should be closer to the bottom of the glass than in the start image.
  - id: dye_spread_width
    question: Is the red coloration wider horizontally than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Diffusion should cause the dye to expand horizontally as well as vertically.
  - id: diffusion_softness
    question: Do the edges of the red dye appear more diffuse and less sharp than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Diffusion causes gradients; the initial drop is sharp, the final state should be softer.
  - id: clear_water_reduction
    question: Is there less clear, uncolored water visible in the glass compared to the start?
    answer_type: yes_no
    notes_for_judge: As the dye spreads, it consumes the volume previously occupied by clear water.
  - id: glass_consistency
    question: Is the glass tumbler still in the same position and orientation?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original viewpoint; the glass should not have moved.
  - id: dropper_presence
    question: Is the dropper still visible above the water?
    answer_type: yes_no
    notes_for_judge: The prompt does not indicate the dropper is removed, only that the camera moves.
