id: yoyo_drop_curtain
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A large metal yo-yo is held by its string at a height of 2 meters. The string is wound
    perfectly around the central axle. The yo-yo is currently stationary.
  video_WM: A heavy curtain drops from the ceiling between the camera and the yoyo, completely blocking the yoyo from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: ""
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up of a large, silver metal yo-yo suspended in mid-air by a white twisted
    string. A hand is visible at the very top edge holding the string. The background is an out-of-focus
    industrial workshop with concrete floors, metal walls, and a bright window in the distance.
  init2final_edit_prompt: Edit the given image to show the metal yo-yo positioned significantly lower
    in the frame, closer to the floor. Extend the white string vertically downwards from the top edge
    to connect with the new, lower position of the yo-yo. Keep the hand at the top and the background
    unchanged.
  rationale: 'The prompt specifies that the yo-yo is released and free to move toward the floor, meaning
    gravity will cause it to unwind and descend. The camera pans away and then returns to the initial
    view (centering the hand). Therefore, in the final frame, the viewpoint is the same as the start,
    but the physical state of the yo-yo has changed: it must be vertically lower due to the time elapsed
    during the camera movement.'
  questions:
  - id: yoyo_lower_1
    question: Is the metal yo-yo positioned lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the yo-yo center relative to the background or frame
      edges.
  - id: string_longer_1
    question: Is the visible length of the string between the hand and the yo-yo longer than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The string should have unwound, creating a longer tether.
  - id: yoyo_floor_proximity
    question: Is the yo-yo closer to the bottom edge of the image than it was initially?
    answer_type: yes_no
    notes_for_judge: Check vertical displacement towards the bottom.
  - id: yoyo_descent
    question: Has the yo-yo moved downwards from its starting height?
    answer_type: yes_no
    notes_for_judge: The primary motion is a downward descent due to gravity.
  - id: hand_visibility
    question: Is the hand holding the string still visible at the top of the frame?
    answer_type: yes_no
    notes_for_judge: The camera prompt specifies returning until the hand is back in the center of view.
  - id: background_consistency
    question: Is the industrial workshop background consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original view, so the background should match.
