id: upipe_equilibrium_curtain
level: 3
category: relational_state
relational_type: pressure_coupling
prompts:
  image_gen_prompt: A clear U-shaped glass pipe filled with blue water. A black rubber piston is inserted
    into the left opening. The water levels on both sides are currently equal.
  video_WM: While a mechanical arm is beginning to slowly push the left piston down into the pipe, a heavy curtain drops from the ceiling between the camera and the glass pipe, completely blocking the glass pipe from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: A mechanical arm slowly pushes down the left piston.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A U-shaped glass tube (U-pipe) sitting on a wooden table in a laboratory setting.
    The tube is partially filled with a clear blue liquid. The left arm of the tube is sealed with a black
    piston or stopper mechanism that sits directly on top of the liquid column. The right arm of the tube
    is open at the top, and the liquid level is visible. The background shows blurred laboratory equipment
    and a window.
  init2final_edit_prompt: Edit the given image so that the black piston on the left side of the U-tube
    is positioned significantly lower inside the glass tube. Correspondingly, lower the level of the blue
    liquid in the left arm to be directly beneath the lowered piston. Raise the level of the blue liquid
    in the right arm of the U-tube significantly higher than it was originally, reflecting the displacement
    of the fluid from the left side. Ensure the total volume of blue liquid appears conserved and the
    background remains unchanged.
  rationale: The video prompt describes a mechanical arm pushing the piston down on the left side of the
    U-pipe. According to Pascal's principle and the conservation of volume for an incompressible fluid,
    pushing the piston down displaces the liquid in the left arm, forcing it to flow into the right arm.
    Consequently, the liquid level on the left must drop (moving with the piston), and the liquid level
    on the right must rise. The camera rotation serves as a temporal transition; upon returning to the
    initial view, the system should show this new state of equilibrium or displacement.
  questions:
  - id: piston_position
    question: Is the black piston on the left side of the U-tube positioned lower than it was in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the black stopper/piston in the left tube relative
      to the tube's markings or top rim.
  - id: right_liquid_rise
    question: Is the blue liquid level in the right arm of the tube higher than it was in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The liquid on the right should have risen due to displacement from the left.
  - id: left_liquid_drop
    question: Is the blue liquid level in the left arm of the tube lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The liquid on the left should be pushed down by the piston.
  - id: relative_levels
    question: Is the liquid level in the right arm significantly higher than the liquid level in the left
      arm?
    answer_type: yes_no
    notes_for_judge: Initially they are roughly level; after the push, the right should be much higher
      than the left.
  - id: liquid_conservation
    question: Is the blue liquid still visible in both arms of the U-tube?
    answer_type: yes_no
    notes_for_judge: Checks that the object hasn't disappeared or broken.
  - id: piston_liquid_contact
    question: Is the blue liquid in the left arm still in contact with (or directly beneath) the black
      piston?
    answer_type: yes_no
    notes_for_judge: The piston pushes the liquid, so there shouldn't be a large air gap between them.
