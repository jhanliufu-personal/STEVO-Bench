id: shower_knob_turn_01
level: 5
category: causal_mechanism
mechanism_type: rotary_valve_flow_logic
prompts:
  image_gen_prompt: A close-up view of a chrome shower head mounted on a tiled bathroom wall. The shower
    head is off and completely dry with no water flowing. 
  video_WM: The camera rotates right at constant speed until the shower head exits the view. While the
    shower head is out of view, a hand turns the shower faucet knob. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the shower head back
    into view. Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: While the shower head is out of view, a hand turns the shower faucet knob.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, straight-on view of a chrome shower head mounted on a white tiled
    bathroom wall. The shower head is dry and no water is flowing from its nozzles. The faucet knob is
    not visible in the frame.
  init2final_edit_prompt: Edit the given image to show water actively flowing from the shower head. Multiple
    streams of water should be spraying downward from the nozzle holes across the face of the shower head.
    The chrome surface should appear wet with water droplets or sheen. Keep the wall tiles, mounting hardware,
    and camera angle exactly as in the original image.
  rationale: The initial frame shows a dry shower head with no water flowing. The video prompt describes
    a sequence where the camera rotates away, a hand turns the faucet knob to the on position while the
    shower head is out of view, and the camera returns. Turning the knob opens the water valve, allowing
    water to flow through the pipe and out of the shower head. Therefore, the final frame must depict the
    same shower head with water actively streaming from its nozzles.
