id: pedestrians_enter_crosswalk
level: 6
category: causal_mechanism
mechanism_type: social_yield_convention
prompts:
  image_gen_prompt: A side-on view of a car approaching an intersection with a marked crosswalk. No
    pedestrians are visible in or near the crosswalk. The cars are moving.
  video_WM: The cars are driving. The camera rotates right at constant speed until the car exits the view. While the car is
    out of view, a group of pedestrians steps off the curb into the crosswalk. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the crosswalk back into view.
    Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: The cars are driving. While the cars are out of view, a group of pedestrians steps off the curb into the crosswalk.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A side-on view of an urban intersection with a clearly marked crosswalk. A
    car is approaching the crosswalk at normal driving speed. No pedestrians are visible in or near
    the crosswalk.
  init2final_edit_prompt: Edit the given image to show the car stopped at or just before the crosswalk
    line, with a group of pedestrians now visible mid-crossing in front of it. The car should be
    completely stationary with no motion blur. The pedestrians should be walking across the crosswalk.
    Keep the road, crosswalk markings, and background consistent with the original image.
  rationale: The initial frame shows a car approaching an empty crosswalk. The video describes a sequence
    where the camera pans away and a group of pedestrians steps off the curb into the crosswalk. Yielding
    to pedestrians in a crosswalk is both a legal requirement and a deeply ingrained social convention —
    a moving vehicle must stop and wait. When the camera returns, the car must be stopped, having yielded
    to the pedestrians now in the crosswalk.
