id: drawbridge_rising
level: 6
category: causal_mechanism
prompts:
  image_gen_prompt: A side-on view of cars approaching a drawbridge with the bridge in the fully lowered
    and flat position. The cars are moving toward the bridge. The drawbridge barriers and warning signals
    are not visible in frame.
  video_WM: The cars are driving. The camera rotates right at constant speed until the cars exit the view. While the cars are
    out of view, a drawbridge barrier lowers and the bridge begins to rise. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the road back into view.
    Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: The cars are driving. While the cars are out of view, a drawbridge barriers lower and the bridge begins to rise.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A side-on view of a road leading toward a drawbridge. Several cars are moving
    forward toward the bridge, which is in the fully lowered and flat position. No barrier arms or warning
    signals are active.
  init2final_edit_prompt: Edit the given image to show the cars stopped at a lowered barrier arm blocking
    the road, with the drawbridge visibly raised at an angle in the background. The cars should be
    stationary and queued behind the barrier. Keep the road, surroundings, and camera angle consistent
    with the original image.
  rationale: The initial frame shows cars moving toward a drawbridge in the down position. The video
    describes a sequence where the camera pans away and the drawbridge barriers descend while the bridge
    begins to rise. Stopping for a raised drawbridge is a universal traffic law — no vehicle may proceed
    while the bridge is open. When the camera returns, the cars must be stopped at the barrier with the
    bridge raised behind them.
