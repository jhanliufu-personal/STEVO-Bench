id: sprint_start_gun
level: 6
category: causal_mechanism
prompts:
  image_gen_prompt: A view along a 100-meter sprint track toward the starting blocks. Athletes in sprint
    gear are crouched in the set position in their blocks, motionless and poised to run. The starting
    official is not visible in frame.
  video_WM: The camera rotates right at constant speed until the starting blocks and all athlese completely exit the view. While
    the starting blocks are out of view, a starter raises and fires the starting pistol. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the starting blocks
    back into view. Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: While the starting blocks are out of view, a starter raises and fires the starting pistol.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A view along a 100-meter sprint track toward the starting blocks. Several athletes
    in sprint uniforms are crouched in the set position in their blocks, perfectly still, with fingertips
    on the track surface and legs coiled to push off. The lane markings are clearly visible and the athletes
    are tensed but completely motionless.
  init2final_edit_prompt: Edit the given image to show the athletes in the explosive first strides of
    a sprint start. The athletes should be rising out of their blocks with arms driving and legs pushing
    off powerfully, bodies leaning forward at a low angle consistent with the initial acceleration phase.
    Keep the track, lane markings, and background consistent with the original image.
  rationale: The initial frame shows athletes crouched motionless in their starting blocks. The video
    describes a sequence where the camera pans away and a starting pistol is fired. The gunshot is the
    universal causal trigger for a sprint race — upon hearing it, athletes explode out of their blocks.
    When the camera returns, the athletes must be in motion, captured in the explosive initial push off
    the blocks.
