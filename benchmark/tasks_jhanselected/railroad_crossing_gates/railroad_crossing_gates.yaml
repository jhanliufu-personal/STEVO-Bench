id: railroad_crossing_gates
level: 6
category: causal_mechanism
prompts:
  image_gen_prompt: A side-on view of cars approaching a railroad crossing. The crossing gates are fully
    raised and the warning lights are dark. The cars are moving toward the crossing. The gate mechanism
    is not visible in frame.
  video_WM: The cars are driving. The camera rotates right at constant speed until the cars exit the view. While the cars are
    out of view, the railroad crossing gates on a railroad lower and the warning lights begin flashing. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the crossing back
    into view. Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: The cars are driving. While the cars are out of view, the railroad crossing gates on a railroad lower and the warning lights begin flashing.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A side-on view of a road approaching a railroad crossing. Several cars are
    moving toward the crossing with the gates fully raised and warning lights dark and inactive. No train
    is visible.
  init2final_edit_prompt: Edit the given image to show the cars stopped behind a lowered crossing gate
    arm that now blocks the road. The red warning lights at the crossing should be visibly illuminated.
    The cars should be stationary and queued behind the gate. Keep the road, crossing structure, and
    camera angle consistent with the original image.
  rationale: The initial frame shows cars moving toward a railroad crossing with gates up and no warning
    signals active. The video describes a sequence where the camera pans away and the crossing gates
    lower while warning lights activate. Stopping for lowered railroad crossing gates is one of the most
    fundamental traffic laws — all vehicles must stop and wait. When the camera returns, the cars must
    be stopped behind the lowered gate arm.
