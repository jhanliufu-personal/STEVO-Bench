evaluation:
  init_frame_description: A rolled piece of thick, textured white paper rests on a rustic ceramic plate
    atop a wooden table. A window is visible in the background. The paper is actively burning; a flame
    is visible on the lower right edge of the roll, and the surrounding paper is charred black and brown.
    Smoke is rising from the burning area.
  init2final_edit_prompt: Edit the given image to show the fire has progressed. Significantly increase
    the size of the blackened, charred area on the paper to indicate more material has burned. Reduce
    the amount of visible unburnt white paper. Show the flame or glowing embers consuming a larger portion
    of the paper's edge. Maintain the exact position of the plate, table, and background window.
  rationale: The paper is actively burning in the initial frame. As time passes without interruption,
    the fire will naturally consume more of the paper fuel. This is an irreversible transformation where
    the white paper turns into black char and ash. The final state must show an expansion of the damaged
    area and a reduction of the pristine material, while the inanimate surroundings remain static.
