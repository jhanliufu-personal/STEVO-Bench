evaluation:
  init_frame_description: A dark reddish-brown clay pot sits on a weathered stone pedestal inside a greenhouse.
    The pot's surface appears mostly wet and dark, except for a circular patch on the right side facing
    a heat lamp, which is lighter orange, dry, and cracked. A silver clamp lamp with a wire guard and
    a glowing red heat bulb is positioned to the right, shining directly on the pot. Steam or vapor is
    rising from the pot and pedestal area.
  init2final_edit_prompt: Edit the given image to show the clay pot in a significantly drier state. Expand
    the lighter-colored, dry, cracked patch on the side of the pot so it covers a much larger area of
    the surface. Replace the dark, wet-looking sections of the clay with lighter, matte terracotta tones.
    Reduce the glossiness of the pot's surface to reflect a dry texture.
  rationale: The scene shows a wet clay pot under a heat lamp, a setup designed to dry the clay. Over
    time, the heat will cause moisture to evaporate, leading to a scalar change in the pot's surface properties.
    The visual evidence of this drying process is the expansion of the lighter, dry area and the reduction
    of the darker, wet area. The texture will shift from glossy/wet to matte/dry, and cracking may increase
    as the clay shrinks.
