  image_gen_prompt: A fully inflated blue vinyl air mattress on a floor. The black air valve is wide open,
    and the mattress is just starting to show slight surface wrinkles.
  video_WM: The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth,
    continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a blue, inflated air mattress resting on a wooden
    floor. The mattress has a flocked top surface with indented circular patterns. In the foreground,
    the black air valve is visible; the cap is unplugged and hanging loose by a tether, leaving the valve
    open. A window and white baseboard are visible in the blurred background.
  init2final_edit_prompt: Edit the given image to show the blue air mattress in a partially deflated state.
    The mattress should appear significantly flatter and less taut, with the top surface sagging and showing
    loose wrinkles or folds due to air loss. The height of the mattress edges should be lower than in
    the original image, while the valve remains open and the camera angle stays the same.
  rationale: The initial image shows an inflated air mattress with its valve cap open. In a physical simulation,
    the internal air pressure would naturally force air out through the open valve, causing the mattress
    to lose volume over time. Therefore, the state evolution involves the mattress gradually deflating,
    becoming flatter, less taut, and more wrinkled as the air escapes.
