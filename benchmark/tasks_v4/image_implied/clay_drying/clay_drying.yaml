id: clay_drying
level: 1
category: scalar_state
scalar_variable: Surface darkness
prompts:
  image_gen_prompt: A dark, wet mahogany-colored terracotta pot on a pedestal. A bright industrial heat
    lamp is positioned inches away, aimed directly at the side of the pot.
  video_WM: A piece of cardboard is held up in front of the camera view, completely blocking the terracotta
    pot and heating lamp from view, without touching or interacting with any object in the scene, for
    a prolonged duration. After a pause, the cardboard is lowered. The camera remains stationary; no scene
    cuts; no new people or objects enter the scene. removed. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A dark reddish-brown terracotta pot sits on a weathered stone pedestal inside
    a greenhouse. A metal clamp lamp with a heat bulb is positioned to the right, shining intense red-orange
    light onto the side of the pot. A circular patch on the pot directly under the light is significantly
    lighter in color, dry, and cracked, contrasting with the surrounding darker, damp-looking clay. Steam
    or heat vapor is rising from the top of the pot.
  init2final_edit_prompt: Edit the given image to show the terracotta pot in a drier state. Expand the
    light-colored, dry, cracked circular area on the side of the pot so it covers a significantly larger
    portion of the surface. Reduce the extent of the dark, wet-looking clay surrounding the dry patch.
    Keep the heat lamp illuminated and in the same position.
  rationale: The heat lamp is actively drying the wet terracotta pot. The occlusion by the cardboard represents
    a prolonged duration of time passing. During this time, the heat source causes moisture to evaporate
    from the clay. Consequently, the visual indicator of dryness (the lighter, cracked texture) should
    expand radially from the point of heat application, while the visual indicator of wetness (the dark,
    smooth clay) should recede.
