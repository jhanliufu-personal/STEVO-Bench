id: sandcastle_wave_impact_00
level: 4
category: structural_transformation
transformation_type: structural_collapse
prompts:
  image_gen_prompt: A detailed sandcastle sits on a beach. A large ocean wave is cresting and just about
    to crash directly onto the castle.
  video_WM: The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth,
    continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A detailed sandcastle with multiple towers, a bridge, and seashell decorations
    sits on a sandy beach. A massive, green, curling wave is looming directly behind and to the left of
    the castle, poised to crash. White foam from the wave is already touching the base of the castle on
    the left. The sky is overcast and grey.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The sandcastle
    should be collapsed, flattened, or significantly eroded, losing its distinct architectural shape.
    The large curling wave should be replaced by turbulent white foam and rushing water covering the area
    where the castle stood. The sand should appear wet and disturbed.
  rationale: The initial frame captures the moment immediately preceding a destructive impact. The physics
    of a large volume of water crashing onto a structure made of sand dictates that the sandcastle will
    be structurally compromised. The wave will collapse, its potential energy converting into kinetic
    energy that washes over the sandcastle, eroding the towers, filling the moat, and flattening the walls.
    The final state must reflect this irreversible destruction and the presence of turbulent water or
    foam over the site.
