id: hourglass_accumulation_00
level: 1
category: scalar_state
scalar_variable: Bottom pile height
prompts:
  image_gen_prompt: Generate an image that shows a large wooden hourglass with white sand flowing through
    the narrow neck in a steady line. A small conical mound of sand is visible in the bottom bulb.
  video_WM: The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth,
    continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A close-up shot of a wooden hourglass standing on a wooden desk in a library
    or study. The hourglass has three vertical pillars. The top glass bulb contains a significant amount
    of white sand, and a thin stream of sand is actively falling into the bottom bulb. The bottom bulb
    already contains a conical pile of white sand. In the background, there are bookshelves filled with
    books, a window with natural light, and other desk items like books and a balance scale.
  init2final_edit_prompt: 'Edit the given image to show the hourglass after some time has passed: make
    the pile of sand in the bottom bulb larger and taller, and lower the level of sand remaining in the
    top bulb, reflecting the transfer of sand from top to bottom.'
  rationale: The initial image shows an hourglass with sand actively flowing. The video prompt specifies
    smooth, continuous evolution with no external interference. Therefore, the physical process of gravity
    acting on the sand will continue, causing the sand to drain from the top bulb and accumulate in the
    bottom bulb. The primary scalar changes are the decrease in the top sand volume and the increase in
    the bottom sand volume. The camera and background objects remain static.
