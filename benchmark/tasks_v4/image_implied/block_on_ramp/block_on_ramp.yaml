id: block_on_ramp
level: 2
category: kinematics
tags: []
prompts:
  image_gen_prompt: A small rectangular block rests near the top of a smooth inclined ramp placed on a flat tabletop. The
    ramp surface is visibly smooth and the block sits still against it.
  video_WM: A large opaque panel slides in front of the ramp from the side, completely blocking the block and ramp from the camera view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the panel slides away. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  questions:
  - id: block_moved
    question: Is the wooden block in a different position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The block should have moved from the top of the ramp.
  - id: top_empty
    question: Is the top of the ramp, where the block was initially located, now empty?
    answer_type: yes_no
    notes_for_judge: The starting position should be vacant.
  - id: block_lower
    question: Is the wooden block positioned lower in height (closer to the table surface) than in the initial frame?
    answer_type: yes_no
    notes_for_judge: It should have slid down towards the table.
  - id: block_right
    question: Has the wooden block moved to the right relative to its starting position?
    answer_type: yes_no
    notes_for_judge: The ramp slopes down to the right, so motion should be rightward.
  - id: block_at_bottom
    question: Is the wooden block located at the bottom of the ramp or on the table?
    answer_type: yes_no
    notes_for_judge: It should have reached the end of the incline.
  - id: ramp_stationary
    question: Is the metal ramp in the same position and orientation as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ramp itself should not move.
  - id: background_consistency
    question: Are the background elements (window, cabinets) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original viewpoint.
