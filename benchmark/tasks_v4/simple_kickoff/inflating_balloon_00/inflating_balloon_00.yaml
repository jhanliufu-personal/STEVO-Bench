id: inflating_balloon_00
level: 1
category: scalar_state
scalar_variable: Balloon size
prompts:
  image_gen_prompt: A limp white latex weather balloon attached to a green helium tank nozzle on a grassy
    field. The tank valve is visibly turned to the 'Open' position.
  video_WM: A hand opens the valve of the helium tank, and helium is pumped into the balloon. The camera
    remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution
    with only objects present in the initial scene.
  camera_WM: A hand opens the valve of the helium tank, and helium is pumped into the balloon.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A green gas cylinder labeled 'HELIUM' stands on a grassy field. A deflated,
    cream-colored balloon is attached to the nozzle on the side of the tank's valve assembly. A gloved
    hand is holding the valve handle at the top of the tank. In the background, there is a wire fence
    and rolling hills under a cloudy sky.
  init2final_edit_prompt: Edit the given image to show the cream-colored balloon inflated and significantly
    larger, appearing taut and filled with gas, extending outwards from the nozzle.
  rationale: The prompt describes the action of opening the valve to pump helium into the balloon. Physically,
    this causes gas to transfer from the tank into the balloon, increasing the internal pressure and volume
    of the balloon. Therefore, the primary visual change is the expansion of the balloon from a deflated,
    flat state to an inflated, voluminous state. The tank and background remain static.
