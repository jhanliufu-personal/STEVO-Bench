id: expanding_sponge_water
level: 1
category: scalar_state
tags: []
prompts:
  image_gen_prompt: A compressed dry sponge sits flat in a shallow white dish. The sponge is thin and
    compact in its dehydrated state. A hand holds a pitcher of water positioned above the sponge, about
    to pour.
  video_WM: A hand pours water from a cup over a flat compressed sponge; while the water continues soaking
    in and the sponge continues expanding, a large piece of cardboard is held up between the camera and
    the sponge, completely blocking it from view, without touching or interacting with any object in the
    scene, for a prolonged duration. After a pause, the cardboard is lowered. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: A hand pours water from a cup over a flat compressed sponge.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A high-angle close-up showing a wooden countertop with a white shallow circular
    dish containing a thin, dry, beige rectangular compressed sponge. A hand holds a clear glass pitcher
    filled with water above the dish, tilted with a droplet of water just beginning to pour from the spout.
  init2final_edit_prompt: Edit the given image to show the sponge in a wet and expanded state. Make the
    beige rectangular sponge significantly thicker and taller, increasing its vertical volume as if it
    has absorbed water. Change the texture of the sponge to look wet and slightly darker. Lower the water
    level inside the clear glass pitcher held by the hand. Add a small amount of water pooling in the
    bottom of the white dish around the base of the sponge.
  rationale: The video prompt describes water being poured onto a compressed sponge. Physically, this
    causes the sponge to absorb the water and expand significantly in thickness and volume (a scalar state
    change). The occlusion (cardboard) is introduced and then removed, so the final frame must show the
    result of the expansion without the occluder. The water level in the source container must decrease.
