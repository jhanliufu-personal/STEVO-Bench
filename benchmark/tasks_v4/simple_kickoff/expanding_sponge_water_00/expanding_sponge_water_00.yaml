prompts:
  image_gen_prompt: A compressed dry sponge sits flat in a shallow white dish. The sponge is thin and
    compact in its dehydrated state. A hand holds a pitcher of water positioned above the sponge, about
    to pour.
  video_WM: A hand pours water from a cup over a flat compressed sponge. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: A hand pours water from a cup over a flat compressed sponge.
camera_control:
  HY-WorldPlay: null
  lingbot: null
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a wooden table surface featuring a white shallow plate with
    a thin, dry, tan rectangular compressed sponge in the center. A hand is holding a clear glass pitcher
    filled with water, positioned above the sponge, ready to pour.
  init2final_edit_prompt: Edit the given image to make the tan rectangular sponge on the plate appear
    significantly thicker and taller, simulating expansion from water absorption. Give the sponge a wet,
    darker texture. Reduce the water level inside the glass pitcher to show that water has been poured
    out.
  rationale: The video prompt describes pouring water onto a compressed sponge. Physically, when a dry
    compressed sponge absorbs water, it undergoes a rapid and significant expansion in volume, primarily
    increasing in height (thickness). Consequently, the final state must show the sponge as much taller
    and wet, while the source container (the pitcher) must contain less water due to the transfer.
