evaluation:
  init_frame_description: A close-up view of a clear glass pitcher held by a hand, tilted over a clear
    glass tumbler on a wooden table. A stream of water is flowing from the pitcher into the glass. The
    glass currently contains a very small amount of water at the bottom, indicating the pour has just
    begun. The background features a blurred window.
  init2final_edit_prompt: Edit the given image to show the glass tumbler filled with significantly more
    water, with the water level rising to fill a substantial portion of the glass. Simultaneously, reduce
    the water level inside the pitcher to show that water has been transferred out. Maintain the pouring
    stream connecting the pitcher and the glass, and keep the position of the glass and the background
    identical.
  rationale: The action is a continuous pour of water from a pitcher into a glass. As the video progresses,
    the physical law of conservation of mass dictates that the volume of water leaving the pitcher must
    accumulate in the glass. Therefore, the water level in the glass must rise significantly, while the
    water level in the pitcher must drop correspondingly. The camera and static environment remain unchanged.
