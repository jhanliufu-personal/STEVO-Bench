id: plastic_bottle_hand_crush
level: 4
category: structural_transformation
transformation_type: plastic_container_deformation
tags: []
prompts:
  image_gen_prompt: An empty transparent plastic water bottle stands upright on a table. The bottle is made of thin flexible
    PET plastic with smooth cylindrical walls. A hand approaches the bottle ready to squeeze.
  video_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it; while the hand continues squeezing and the bottle deforms further, the lights turn off, leaving the room in complete darkness and the hand and bottle completely invisible for a prolonged duration. After a pause, the lights turn back on. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A clear, empty plastic water bottle stands upright on a wooden table. To the left, a human arm and
    hand are visible, reaching towards the bottle with fingers extended as if about to grab it. Faint water rings are visible
    on the table surface near the bottle. The background shows a blurred kitchen interior with a window, cabinets, and appliances.
  init2final_edit_prompt: Edit the given image to show the hand firmly gripping the plastic bottle. The bottle must appear
    significantly crushed, crumpled, and deformed within the hand's grasp, showing irregular folds and buckling in the clear
    plastic material. The bottle should no longer be a smooth cylinder. Maintain the original background, lighting, and table
    texture.
  rationale: The prompt describes a physical interaction where a hand squeezes a thin plastic bottle. This material undergoes
    irreversible plastic deformation when the force exceeds its structural limit. Although the camera pans away during the
    action, the prompt specifies the squeezing continues and the camera returns. Therefore, the final state must show the
    bottle in a crushed, permanently deformed state held by the hand, rather than its original pristine cylindrical shape.
  questions:
  - id: hand_grip
    question: Is the hand now gripping the plastic bottle?
    answer_type: yes_no
    notes_for_judge: The hand should be closed around the bottle, not just reaching.
  - id: deformation_visible
    question: Is the bottle visibly crushed or deformed compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for loss of the original smooth shape.
  - id: structural_change
    question: Has the smooth cylindrical shape of the bottle been altered by crumpling or buckling?
    answer_type: yes_no
    notes_for_judge: The walls of the bottle should be bent or folded.
  - id: material_folds
    question: Are there visible folds, dents, or irregularities in the plastic surface that were not there initially?
    answer_type: yes_no
    notes_for_judge: Check for evidence of crushing force.
  - id: compression
    question: Does the bottle appear to be compressed or squeezed by the hand?
    answer_type: yes_no
    notes_for_judge: The bottle's width should likely be reduced at the grip point.
  - id: irreversible_state
    question: Is the bottle's structural integrity compromised (no longer a perfect cylinder)?
    answer_type: yes_no
    notes_for_judge: The change should look like permanent damage/deformation.
  - id: background_consistency
    question: Are the background elements (window, appliances) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original view, so the background should match.
