id: seesaw_balance
level: 3
category: relational_state
relational_type: angular_coupling
prompts:
  image_gen_prompt: A wooden see-saw on a playground pivot. A heavy 20kg sandbag is on the left seat,
    which is currently touching the ground. An empty seat is on the far right, high in the air.
  video_WM: A hand removes the heavy sandbag from the near end of the seesaw; a large box is then immediately
    placed in front of the seesaw, completely blocking it from the camera view, without touching or interacting
    with any object in the scene, for a prolonged duration. After a pause, the box is removed. The camera
    remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution
    with only objects present in the initial scene.
  camera_WM: A hand removes the heavy sandbag from the near end of the seesaw.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A wooden playground seesaw in a park setting with wood chips on the ground.
    The near end of the seesaw is tilted all the way down, resting on or near the ground, weighed down
    by a burlap sack labeled '20 KG SAND'. The far end of the seesaw is elevated high in the air. The
    background features trees and other playground equipment.
  init2final_edit_prompt: Edit the given image to remove the sandbag from the near end of the seesaw.
    Change the position of the seesaw beam so that it is balanced horizontally, parallel to the ground.
    The near end should be lifted significantly higher than its original position, and the far end should
    be lowered correspondingly to match the level of the near end.
  rationale: The video prompt describes the removal of the heavy counterweight (the sandbag) that was
    holding the near end of the seesaw down. In a standard physical system, removing the unbalanced load
    from a symmetric seesaw causes it to return to a neutral, balanced equilibrium or at least lift from
    the ground due to the release of the downward force. The occlusion by the box allows this physical
    transition to occur unseen. The final state should show the seesaw in a balanced, unloaded state (horizontal)
    with the sandbag gone.
