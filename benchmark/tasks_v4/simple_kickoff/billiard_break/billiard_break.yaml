id: billiard_break
level: 3
category: relational_state
relational_type: momentum_coupling
prompts:
  image_gen_prompt: A rack of fifteen colorful billiard balls arranged in a tight triangle on a green
    felt table. A single white cue ball is positioned three feet away, aligned with the lead ball of the
    triangle.
  video_WM: The robot strikes the cue ball with a pool cue, sending it toward the rack of balls; while
    the cue ball rolls, the lights turn off, leaving the room in complete darkness and the billiard balls
    completely invisible for a prolonged duration. After a pause, the lights turn back on. The camera
    remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution
    with only objects present in the initial scene.
  camera_WM: The robot strikes the cue ball with a pool cue, sending it toward the rack of balls.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A silver humanoid robot with blue glowing eyes and accents is leaning over a
    green felt pool table, holding a wooden cue stick and aiming at a white cue ball. At the opposite
    end of the table, a standard rack of 15 colored billiard balls is arranged in a tight triangular formation.
    Above the table, three green shaded lamps illuminate the scene. The room features dark wood paneling
    and a fireplace in the background.
  init2final_edit_prompt: Edit the given image so that the triangular rack of colored billiard balls is
    broken and the balls are scattered randomly across the green felt surface of the pool table. Position
    the white cue ball at a new location on the table, distinct from its starting point. Keep the robot
    standing at the table holding the cue stick. Ensure the overhead lights are on and the room is fully
    illuminated, matching the brightness of the original image.
  rationale: 'The video prompt describes a physical interaction where the robot strikes the cue ball,
    sending it towards the rack. The subsequent period of darkness occludes the collision, but physical
    causality dictates that the moving cue ball strikes the rack, transferring momentum and scattering
    the balls. Therefore, the final state must show the aftermath of this collision: the transition from
    an ordered low-entropy state (the triangle) to a disordered high-entropy state (scattered balls),
    with the cue ball having moved from its origin. The lights return to their initial state, revealing
    this new configuration.'
