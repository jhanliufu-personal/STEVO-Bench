evaluation:
  init_frame_description: A high-angle shot of a wooden table featuring a long, winding row of wooden
    dominoes standing upright. A person's hand enters from the left, with a finger touching the first
    domino in the sequence, poised to push it. In the background, there are stacks of books, potted plants,
    a window, and a chair.
  init2final_edit_prompt: Edit the given image to show the result of the dominoes falling over. Render
    the dominoes lying flat on the table, overlapping each other in a continuous chain that follows the
    exact winding path of the original standing row. The fall should appear to have started from where
    the finger is located. Keep the background, lighting, and table texture identical to the original.
  rationale: The finger applies a force to the first domino, initiating a chain reaction. Because the
    dominoes are spaced closely together (a coupled system), the fall of one triggers the fall of the
    next. By the final frame, the wave of kinetic energy will have propagated through the line, causing
    the dominoes to lie flat in an overlapping pattern along the original curve. The background remains
    static.
