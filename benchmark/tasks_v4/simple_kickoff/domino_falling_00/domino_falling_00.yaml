prompts:
  image_gen_prompt: A row of upright rectangular dominoes is arranged in a line on a flat table. A finger
    is positioned just behind the first domino in the row, about to push it.
  video_WM: A finger tips over the first domino in a long standing row. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: A finger tips over the first domino in a long standing row.
