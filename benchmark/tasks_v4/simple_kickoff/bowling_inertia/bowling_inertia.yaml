id: bowling_inertia
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A heavy black bowling ball mid-lane on a polished wooden surface. The ball is moving
    toward the pins, which are visible in the far distance. No bumpers are present.
  video_WM: A hand releases a bowling ball, sending it rolling down the polished lane; while the ball
    continues rolling toward the pins, a heavy curtain drops from the ceiling between the camera and the
    lane, completely blocking the ball and pins from view, without touching or interacting with any object
    in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: A hand releases a bowling ball, sending it rolling down the polished lane.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A low-angle view of a polished wooden bowling lane. A black, marbled bowling
    ball is positioned in the immediate foreground, centered on the lane. In the distance, a set of white
    bowling pins is arranged at the end of the lane. Gutters run along both sides of the lane. The lighting
    reflects off the oily surface of the wood.
  init2final_edit_prompt: Edit the given image to show the black bowling ball located far down the lane,
    very close to the pins in the background. The ball should appear significantly smaller due to perspective.
    The wooden lane surface in the immediate foreground, where the ball was originally, should now be
    empty and show only the polished wood grain and reflections.
  rationale: The initial frame establishes the bowling ball on the lane with an implied forward velocity
    (rolling). The prompt describes a release and continuous rolling motion. During the occlusion by the
    curtain, the ball travels down the low-friction lane due to its momentum. When the curtain rises,
    the ball must have traversed the length of the lane and should be located near the pins in the background,
    appearing smaller due to perspective. The foreground must be empty as the ball has moved away.
