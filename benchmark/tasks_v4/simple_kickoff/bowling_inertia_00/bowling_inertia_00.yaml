id: bowling_inertia_00
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A heavy black bowling ball mid-lane on a polished wooden surface. The ball is moving
    toward the pins, which are visible in the far distance. No bumpers are present.
  video_WM: A hand releases a bowling ball, sending it rolling down the polished lane. The camera remains
    stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution
    with only objects present in the initial scene.
  camera_WM: A hand releases a bowling ball, sending it rolling down the polished lane.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A large, black, marbled bowling ball sits in the immediate foreground on a polished
    wooden bowling lane. The lane features perspective lines converging towards a set of white bowling
    pins at the far end. Dark gutters run along both sides of the lane.
  init2final_edit_prompt: Edit the image to move the bowling ball significantly further down the lane
    towards the pins. Scale the ball down to appear smaller due to the increased distance from the camera.
    Clear the immediate foreground where the ball was originally located to show the empty wooden floor.
  rationale: The prompt describes the ball rolling down the lane away from the stationary camera. Physically,
    this results in the ball moving along the depth axis towards the pins. In the 2D image plane, the
    ball will move upwards (towards the vanishing point) and decrease in apparent size due to perspective.
    The original foreground position will be vacated.
