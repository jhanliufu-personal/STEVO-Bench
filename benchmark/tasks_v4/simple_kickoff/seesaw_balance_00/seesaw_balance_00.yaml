id: seesaw_balance_00
level: 3
category: relational_state
relational_type: angular_coupling
prompts:
  image_gen_prompt: A wooden see-saw on a playground pivot. A heavy 20kg sandbag is on the left seat,
    which is currently touching the ground. An empty seat is on the far right, high in the air.
  video_WM: A hand removes the heavy sandbag from the near end of the seesaw. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: A hand removes the heavy sandbag from the near end of the seesaw.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A playground scene featuring a wooden seesaw. On the near end of the seesaw,
    which is tilted down to touch or nearly touch the ground, sits a burlap sack labeled '20 KG SAND'.
    The far end of the seesaw is elevated in the air. The seesaw has metal handles near each seat. The
    ground is covered in wood chips, and trees and a climbing frame are visible in the blurred background.
  init2final_edit_prompt: Edit the given image to remove the burlap sandbag from the near end of the seesaw.
    Re-orient the seesaw beam so that it is approximately horizontal and balanced, with the near end raised
    significantly from the ground and the far end lowered correspondingly. Inpaint the background and
    wood chips to fill the space where the bag was and where the seesaw moved.
  rationale: The initial state shows a seesaw unbalanced by a heavy 20kg weight on the near end. The prompt
    describes a hand removing this weight. According to the physics of a lever/seesaw, removing the load
    from the depressed end will cause that end to rise and the elevated far end to fall, restoring the
    system to a neutral, roughly horizontal equilibrium (assuming the seesaw is symmetrical). The final
    state should show the bag removed and the seesaw leveled.
