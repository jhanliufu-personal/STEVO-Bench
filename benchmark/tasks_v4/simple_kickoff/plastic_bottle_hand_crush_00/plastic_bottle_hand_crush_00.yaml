prompts:
  image_gen_prompt: An empty transparent plastic water bottle stands upright on a table. The bottle is
    made of thin flexible PET plastic with smooth cylindrical walls. A hand approaches the bottle ready
    to squeeze.
  video_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it. The camera remains
    stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution
    with only objects present in the initial scene.
  camera_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it.
camera_control:
  HY-WorldPlay: null
  lingbot: null
  Genie: null
evaluation:
  init_frame_description: A clear plastic water bottle with a blue cap stands upright on a wooden table.
    The bottle appears empty or nearly empty with some droplets inside. To the left, a person's arm and
    hand are visible, with the hand open and fingers reaching towards the bottle. The table has visible
    water ring stains. The background shows a blurred kitchen interior with a window and appliances.
  init2final_edit_prompt: Edit the given image to show the hand firmly gripping the plastic bottle. The
    fingers should be wrapped around the middle of the bottle's body. The plastic bottle should appear
    deformed, dented, and crushed inwards where the hand is squeezing it, losing its perfect cylindrical
    shape. The blue cap should remain on top. The wooden table and background should remain unchanged.
  rationale: The video prompt describes a physical interaction where a hand grips and squeezes a bottle.
    The state evolution involves the hand moving from an open, approaching position to a closed, gripping
    position. Consequently, the bottle transitions from a rigid, symmetrical cylinder to a deformed, crushed
    state due to the applied pressure. This is an irreversible structural change to the object's form.
    The camera remains stationary, so the background and table perspective should not change.
