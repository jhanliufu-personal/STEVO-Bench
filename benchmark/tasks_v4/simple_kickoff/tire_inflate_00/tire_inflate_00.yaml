id: tire_inflate_00
level: 1
category: scalar_state
scalar_variable: Tire outer diameter
prompts:
  image_gen_prompt: A flat bicycle tire on a rim. A high-pressure air hose is attached to the valve, and
    the rubber is just starting to push outward.
  video_WM: Air is getting pumped into the deflated tire through the pump nozzle. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: Air is getting pumped into the deflated tire through the pump nozzle.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A close-up, ground-level view of a bicycle wheel with a significantly deflated
    tire resting on a concrete floor. The tire is flattened at the bottom where it contacts the ground,
    and the sidewalls are bulging. A black air hose is connected to the tire's valve stem via a brass
    fitting. In the background, a red air compressor tank is visible, and metal wrenches are scattered
    on the floor in the foreground.
  init2final_edit_prompt: Edit the given image to show the bicycle tire inflated with air. The tire should
    appear round and firm, lifting the metal rim higher off the concrete floor. The flattened section
    at the bottom of the tire should be gone, replaced by a curved profile consistent with a full tire.
    The sidewalls should be straight rather than bulging.
  rationale: The prompt describes air being pumped into the tire. As air enters, the internal pressure
    increases, forcing the tire to expand and regain its circular shape. This physical process causes
    the rim to lift away from the ground and the flattened contact patch to shrink or disappear. The camera
    remains stationary, so the background objects and tools on the floor should remain unchanged.
