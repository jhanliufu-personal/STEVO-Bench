id: paper_burning
level: 4
category: transformational_state_change
tags: []
prompts:
  image_gen_prompt: A piece of paper rests on a heat-resistant plate on a table. One edge of the paper is lit with a small
    flame, just beginning to burn.
  video_WM: A metal lid is placed over the burning paper, covering it from view, then, after a pause, lifted away.
  camera_WM: ""
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a wooden table with a round ceramic plate. On the plate is a rolled piece of
    textured white paper that is currently burning. A small flame is visible on the right side of the paper roll, with charred
    black edges and smoke rising. The background shows a window frame and soft daylight.
  init2final_edit_prompt: Edit the given image to show the paper roll in a more advanced state of burning. The area of black
    char and ash should be significantly larger, covering more of the paper. The amount of white unburnt paper should be reduced.
    The structure of the paper roll should appear more collapsed, fragmented, or degraded due to the fire. Smoke should be
    present, consistent with ongoing or recent combustion. Keep the plate, table, and background identical to the original.
  rationale: The video involves a camera panning away from a burning object and then returning to the original view after
    several seconds. Fire causes irreversible chemical and structural changes. During the occlusion, the fire continues to
    consume the paper. Therefore, when the camera returns, the paper must appear more burnt than before—showing more char,
    less fuel (white paper), and structural degradation (crumbling or collapsing). The plate and table remain unchanged.
  questions:
  - id: more_char
    question: Is the area of blackened char on the paper larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the extent of the black burnt area. It should have grown.
  - id: less_paper
    question: Is there less white unburnt paper visible compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The fire consumes the paper, so the white area must decrease.
  - id: structural_degradation
    question: Does the paper roll appear more collapsed or structurally damaged than initially?
    answer_type: yes_no
    notes_for_judge: Burning compromises structural integrity; the roll should look more fragile or broken.
  - id: more_ash
    question: Are there more ash fragments or debris on the plate compared to the start?
    answer_type: yes_no
    notes_for_judge: Burning produces ash; look for increased debris on the plate surface.
  - id: flame_progression
    question: Does the state of the paper indicate that the burning process has progressed?
    answer_type: yes_no
    notes_for_judge: General check for progression of the irreversible process.
  - id: plate_consistency
    question: Is the ceramic plate in the same position on the table?
    answer_type: yes_no
    notes_for_judge: The plate itself should not move, only the camera moved and returned.
  - id: background_consistency
    question: Is the window in the background still visible and consistent with the initial view?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original viewpoint, so the background should match.
