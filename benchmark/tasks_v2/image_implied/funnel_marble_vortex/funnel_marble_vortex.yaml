id: funnel_marble_vortex
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A steel ball sitting on the high outer rim of a large, smooth acrylic vortex funnel. The funnel walls
    curve steeply toward a central hole at the bottom.
  video_WM: A hand covers the top of the funnel with a bowl, hiding the marble from view, then, after a pause, lifts it away.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  questions:
  - id: ball_moved
    question: Is the steel ball at a different position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should no longer be resting statically on the upper left rim.
  - id: ball_lower_in_funnel
    question: Is the steel ball positioned closer to the central hole of the funnel than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should have spiraled downwards, appearing 'deeper' in the funnel or closer to the center drain.
  - id: initial_position_empty
    question: Is the upper left rim of the funnel, where the ball started, now empty?
    answer_type: yes_no
    notes_for_judge: Check if the ball has vacated its starting spot.
  - id: ball_visible
    question: Is the steel ball visible somewhere within the acrylic funnel?
    answer_type: yes_no
    notes_for_judge: Assuming the duration wasn't long enough for it to fall completely through, it should be visible spiraling.
  - id: funnel_structure_preserved
    question: Is the large clear acrylic funnel still the main object in the view?
    answer_type: yes_no
    notes_for_judge: The camera returns to the funnel.
  - id: background_consistency
    question: Are the windows and brick building in the background still visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change.
