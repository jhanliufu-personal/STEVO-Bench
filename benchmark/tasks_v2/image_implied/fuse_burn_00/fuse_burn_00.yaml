id: fuse_burn_00
level: 1
category: scalar_state
scalar_variable: Unburned fuse length
prompts:
  image_gen_prompt: A thick black gunpowder fuse is laid out on a concrete floor. One end is lit and sizzling with a bright
    spark, moving quickly toward the other end.
  video_WM: ''
  camera_WM: ''
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  questions:
  - id: fuse_shorter
    question: Is the unburnt section of the rope shorter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the length of the intact rope. It should be reduced.
  - id: flame_position
    question: Is the burning tip located further along the rope's path than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The fire should have moved along the curve of the rope away from the starting point.
  - id: consumption_check
    question: Has the section of the rope where the fire started been consumed or turned to ash?
    answer_type: yes_no
    notes_for_judge: The original starting tip should no longer be intact rope.
  - id: fire_movement
    question: Has the source of the sparks moved relative to the concrete floor features?
    answer_type: yes_no
    notes_for_judge: The fire should be in a different physical location on the floor, following the rope's path.
  - id: floor_consistency
    question: Is the concrete floor texture consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary check for background consistency.
  - id: smoke_presence
    question: Is there smoke or fire visible at the new burning location?
    answer_type: yes_no
    notes_for_judge: The burning process should still be active.
