id: clay_drying_00
level: 1
category: scalar_state
scalar_variable: Surface darkness
prompts:
  image_gen_prompt: A dark, wet mahogany-colored terracotta pot on a pedestal. A bright industrial heat lamp is positioned
    inches away, aimed directly at the side of the pot.
  video_WM: ''
  camera_WM: ''
camera_control:
  HY-WorldPlay: null
evaluation:
  questions:
  - id: dry_patch_size
    question: Is the light-colored dry patch on the side of the pot larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the surface area of the light orange/dry clay against the initial image.
  - id: pot_color_lightness
    question: Does the terracotta pot appear lighter in color overall compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Drying clay turns from dark red/brown to lighter orange/pink.
  - id: wet_area_reduction
    question: Is the area of dark, wet clay smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the dry patch expands, the wet area must shrink.
  - id: dry_patch_expansion
    question: Has the dry patch expanded beyond the specific boundaries seen in the first image?
    answer_type: yes_no
    notes_for_judge: Check for growth of the dry region.
  - id: surface_texture_dryness
    question: Does the surface of the pot look drier than it did at the start?
    answer_type: yes_no
    notes_for_judge: Look for reduced specularity or lighter values associated with dry clay.
  - id: lamp_presence
    question: Is the heat lamp still visible on the right side of the frame?
    answer_type: yes_no
    notes_for_judge: 'Consistency check: The camera returned to the original view.'
  - id: pedestal_consistency
    question: Is the pot still resting on the same stone pedestal?
    answer_type: yes_no
    notes_for_judge: Consistency check.
