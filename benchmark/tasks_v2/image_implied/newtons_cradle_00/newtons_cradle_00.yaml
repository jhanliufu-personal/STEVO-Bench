evaluation:
  init_frame_description: A close-up, eye-level shot of a Newton's Cradle on a wooden desk. The cradle consists of a brass
    frame and five silver metallic spheres suspended by strings. The far-left sphere is pulled back and raised high to the
    left side, held in a position of potential energy. The other four spheres are resting stationary in the center, touching
    each other in a horizontal line. The background features a blurred office setting with a window, curtain, and bookshelf.
  init2final_edit_prompt: 'Edit the given image to show the physical reaction of the Newton''s Cradle: position the far-left
    ball down so it is hanging in line with the central balls, and position the far-right ball so it is swung outward and
    upward to the right side, separated from the group.'
  rationale: The prompt describes the release of the raised left ball. According to the physics of a Newton's Cradle (conservation
    of momentum and energy), the left ball will swing down and strike the stationary pack. The momentum will transfer through
    the middle balls, causing the far-right ball to swing outward and upward. The camera movement (panning away and returning)
    provides a duration of time for this swing and impact to occur. Therefore, in the final frame, the left ball should be
    down (having released its energy) and the right ball should be displaced to the right (having received the momentum).
