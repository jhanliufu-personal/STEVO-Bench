evaluation:
  init_frame_description: A clear acrylic helical track structure stands on a wooden workbench. A blue and green swirled glass
    marble is positioned at the very top entrance of the spiral track. The background features a workshop environment with
    tools hanging on a pegboard and a window letting in natural light.
  init2final_edit_prompt: Edit the given image to show the marble at the bottom of the track. Remove the blue and green marble
    from the top entrance of the spiral. Place the same blue and green marble resting in the curved exit tray at the very
    base of the acrylic structure on the wooden table. Ensure the marble is no longer visible at the top. Keep the camera
    angle, lighting, and background exactly the same.
  rationale: The marble is released and subjected to gravity, causing it to roll down the helical path. The prompt specifies
    that the camera looks away for several seconds before returning. Given the low friction of acrylic and the steepness of
    the spiral, a duration of several seconds is sufficient for the marble to traverse the entire length of the track and
    reach the bottom. Therefore, in the final frame, the marble should be located at the base of the structure, and the top
    entrance should be empty.
