prompts:
  image_gen_prompt: A clear acrylic helical spiral track stands vertically on a table. The helix has multiple turns descending
    from top to bottom. A glass marble sits at the very top of the spiral track at the entrance. The marble is stationary
    and positioned to enter the helical groove.
