id: marble_helix_descent
level: 2
category: spatial_kinematics
kinematic_variable: Vertical position along helical constraint
tags: []
prompts:
  image_gen_prompt: A clear acrylic helical spiral track stands vertically on a table. The helix has multiple turns descending
    from top to bottom. A glass marble sits at the very top of the spiral track at the entrance. The marble is stationary
    and positioned to enter the helical groove.
  video_WM: A hand holds a sheet of cardboard in front of the helix track, blocking the marble from view, then, after a pause,
    pulls it away.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A clear acrylic helical track structure stands on a wooden workbench. A blue and green swirled glass
    marble is positioned at the very top entrance of the spiral track. The background features a workshop environment with
    tools hanging on a pegboard and a window letting in natural light.
  init2final_edit_prompt: Edit the given image to show the marble at the bottom of the track. Remove the blue and green marble
    from the top entrance of the spiral. Place the same blue and green marble resting in the curved exit tray at the very
    base of the acrylic structure on the wooden table. Ensure the marble is no longer visible at the top. Keep the camera
    angle, lighting, and background exactly the same.
  rationale: The marble is released and subjected to gravity, causing it to roll down the helical path. The prompt specifies
    that the camera looks away for several seconds before returning. Given the low friction of acrylic and the steepness of
    the spiral, a duration of several seconds is sufficient for the marble to traverse the entire length of the track and
    reach the bottom. Therefore, in the final frame, the marble should be located at the base of the structure, and the top
    entrance should be empty.
  questions:
  - id: marble_moved_from_start
    question: Is the marble absent from the top entrance of the track?
    answer_type: yes_no
    notes_for_judge: Check if the starting position at the very top of the spiral is empty.
  - id: marble_vertical_position
    question: Is the marble at a lower vertical position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The marble should have moved downwards due to gravity.
  - id: marble_at_bottom
    question: Is the marble visible at the base of the helical structure?
    answer_type: yes_no
    notes_for_judge: The marble should be resting in the bottom tray or near the exit of the spiral.
  - id: marble_displacement
    question: Has the marble moved down the spiral path?
    answer_type: yes_no
    notes_for_judge: Verify that the object's position has changed along the track's trajectory.
  - id: track_stability
    question: Is the acrylic track in the same position on the table as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The track itself should not have moved, only the marble.
  - id: background_consistency
    question: Are the tools in the background unchanged?
    answer_type: yes_no
    notes_for_judge: The environment should remain static.
