id: lava_cool
level: 1
category: scalar_state
scalar_variable: Glow brightness
prompts:
  image_gen_prompt: A jagged piece of volcanic rock sitting on a metal tray. The entire rock is glowing a vibrant, brilliant
    orange from extreme internal heat.
  video_WM: A fireproof cloth is draped over the glowing rock, covering it from view, then, after a pause, pulled away.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a large, jagged chunk of volcanic rock sitting on a dirty, weathered metal baking
    sheet. The rock is intensely hot, with bright orange and yellow molten lava glowing from deep cracks and fissures, contrasting
    with the blackened, cooled crust on the exterior. Smoke and heat distortion rise from the rock. The tray reflects the
    orange glow of the heat. The background is a dark, blurred industrial workshop environment.
  init2final_edit_prompt: Edit the given image to make the volcanic rock appear significantly cooler. Replace the bright orange
    and yellow glowing areas within the cracks with dark grey and black solidified rock textures. Reduce the intensity of
    the light emitted by the rock and the corresponding orange reflection on the metal tray. The rock should look mostly dark
    and solid, with the glowing heat largely extinguished.
  rationale: The prompt describes a continuous cooling process. While the camera rotates away and then returns to the original
    view, the rock's temperature must decrease. Visually, this scalar change is represented by a reduction in incandescence
    (glowing brightness) and a transition from orange/yellow colors to black/grey solid rock. The final frame should show
    the rock in the same position but in a later state of cooling, meaning it should be darker and less luminous than the
    initial frame.
  questions:
  - id: glow_reduction
    question: Is the intensity of the orange and yellow glow coming from the rock reduced compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the brightness of the cracks. The final frame should be dimmer.
  - id: surface_darkening
    question: Does the rock surface appear darker and more solidified than it was initially?
    answer_type: yes_no
    notes_for_judge: The area that was previously molten orange should now be darker grey or black.
  - id: tray_reflection
    question: Is the orange light reflected on the metal tray dimmer than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the rock cools, it emits less light, so the tray should reflect less color.
  - id: black_dominance
    question: Is there a greater proportion of black or grey rock visible compared to the glowing sections than in the start?
    answer_type: yes_no
    notes_for_judge: Assess the ratio of cooled crust to molten core.
  - id: object_permanence
    question: Is the volcanic rock visible in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera rotates back to the center, so the rock must be present.
  - id: background_consistency
    question: Is the background environment (dark workshop setting) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The location has not changed.
