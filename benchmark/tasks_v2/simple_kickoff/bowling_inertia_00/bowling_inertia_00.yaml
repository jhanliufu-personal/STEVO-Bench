id: bowling_inertia_00
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A heavy black bowling ball mid-lane on a polished wooden surface. The ball is moving toward the pins,
    which are visible in the far distance. No bumpers are present.
  video_WM: A hand releases a bowling ball, sending it rolling down the polished lane.
  camera_WM: A hand releases a bowling ball, sending it rolling down the polished lane.
camera_control:
  HY-WorldPlay: null
evaluation:
  questions:
  - id: ball_position_depth
    question: Is the bowling ball positioned further down the lane than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should be closer to the pins and further from the camera.
  - id: ball_size_perspective
    question: Does the bowling ball appear smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Due to perspective, as the ball moves away, it should appear smaller.
  - id: foreground_empty
    question: Is the immediate foreground of the lane empty of the bowling ball?
    answer_type: yes_no
    notes_for_judge: The spot where the ball started should now show the empty lane surface.
  - id: ball_closer_to_pins
    question: Is the bowling ball closer to the background pins than it was initially?
    answer_type: yes_no
    notes_for_judge: Check relative distance to the pins.
  - id: lane_consistency
    question: Is the lane surface still polished wood?
    answer_type: yes_no
    notes_for_judge: The environment style should remain consistent.
  - id: camera_view_consistency
    question: Is the camera view centered on the lane, similar to the initial frame?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the camera returns to the center view.
