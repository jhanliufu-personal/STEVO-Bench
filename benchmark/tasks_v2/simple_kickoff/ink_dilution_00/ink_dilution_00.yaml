id: ink_dilution_00
level: 3
category: relational_state
relational_type: concentration_coupling
scalar_variable: Fluid transparency
prompts:
  image_gen_prompt: A glass beaker is half-full of dark, opaque purple ink. A pitcher of clear water is tilted over the beaker,
    beginning to pour in a steady stream.
  video_WM: A hand pours a stream of clear water into a beaker of dark ink.
  camera_WM: A hand pours a stream of clear water into a beaker of dark ink.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A glass beaker sits on a wooden lab table containing dark purple ink. A glass pitcher held above
    is pouring a stream of clear water into the beaker. The water is crashing into the ink, creating turbulent swirls of lighter
    purple and clear liquid within the dark mixture. In the background, there is a window with white frames and other blurred
    lab equipment.
  init2final_edit_prompt: Edit the given image to show the beaker filled with a significantly higher level of liquid. The
    liquid inside the beaker should be a much lighter, more transparent shade of purple, indicating it has been diluted by
    the added water. The glass pitcher should still be pouring a stream of clear water into the beaker. Maintain the original
    camera angle, background, and lighting.
  rationale: The video prompt describes a continuous pouring action while the camera pans away and then returns. During the
    time the beaker is occluded by the camera rotation, the pouring adds volume to the beaker. According to physical principles
    of mixing and dilution, adding clear water to dark ink increases the total volume and decreases the opacity/saturation
    of the color. When the camera returns to the initial view, the beaker must contain more liquid, and that liquid must be
    lighter in color.
