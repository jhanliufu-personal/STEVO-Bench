id: upipe_equilibrium
level: 3
category: relational_state
relational_type: pressure_coupling
prompts:
  image_gen_prompt: A clear U-shaped glass pipe filled with blue water. A black rubber piston is inserted into the left opening.
    The water levels on both sides are currently equal.
  video_WM: A hand continuously pushes the piston down the left end of the upipe; while the piston continues to descend and the liquid level on the right continues to rise, a stack of books is placed in front of the tube, blocking it from view. After a pause, the books are removed.
  camera_WM: A hand continuously pushes the piston down the left end of the upipe.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  questions:
  - id: piston_position
    question: Is the black piston on the left side of the U-tube positioned lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the black stopper/piston in the left tube relative to the tube's markings
      or top rim.
  - id: right_liquid_rise
    question: Is the blue liquid level in the right arm of the tube higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The liquid on the right should have risen due to displacement from the left.
  - id: left_liquid_drop
    question: Is the blue liquid level in the left arm of the tube lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The liquid on the left should be pushed down by the piston.
  - id: relative_levels
    question: Is the liquid level in the right arm significantly higher than the liquid level in the left arm?
    answer_type: yes_no
    notes_for_judge: Initially they are roughly level; after the push, the right should be much higher than the left.
  - id: liquid_conservation
    question: Is the blue liquid still visible in both arms of the U-tube?
    answer_type: yes_no
    notes_for_judge: Checks that the object hasn't disappeared or broken.
  - id: piston_liquid_contact
    question: Is the blue liquid in the left arm still in contact with (or directly beneath) the black piston?
    answer_type: yes_no
    notes_for_judge: The piston pushes the liquid, so there shouldn't be a large air gap between them.
