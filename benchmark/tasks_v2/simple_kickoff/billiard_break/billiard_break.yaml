id: billiard_break
level: 3
category: relational_state
relational_type: momentum_coupling
prompts:
  image_gen_prompt: A rack of fifteen colorful billiard balls arranged in a tight triangle on a green felt table. A single
    white cue ball is positioned three feet away, aligned with the lead ball of the triangle.
  video_WM: A hand strikes the cue ball with a pool cue, sending it toward the rack of balls. The lights in the room then turns off
    and leave the room in complete darkness and the billard balls completely invisible. After a pause, the lights are turned back on.
  camera_WM: A hand strikes the cue ball with a pool cue, sending it toward the rack of balls.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  questions:
  - id: triangle_broken
    question: Is the triangular formation of the object balls completely broken?
    answer_type: yes_no
    notes_for_judge: The balls should no longer be in a tight rack.
  - id: balls_scattered
    question: Are the object balls distributed across a wider area of the table than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for spatial distribution/scattering.
  - id: cue_ball_moved
    question: Is the white cue ball in a different position relative to the table center compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The cue ball must have moved from its starting spot.
  - id: entropy_increase
    question: Does the arrangement of the balls appear random rather than ordered?
    answer_type: yes_no
    notes_for_judge: Tests the transition from ordered state to disordered state.
  - id: balls_separated
    question: Are there visible gaps between most of the object balls?
    answer_type: yes_no
    notes_for_judge: In the initial frame, they are touching. In the final frame, they should be separated.
  - id: background_consistency
    question: Do the background elements (fireplace, second table) remain in the same position relative to the camera frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the center view, so the background should align with the initial frame.
  - id: surface_visible
    question: Is more of the green felt surface visible between the individual balls compared to the initial rack?
    answer_type: yes_no
    notes_for_judge: Scattering exposes the table surface between balls.
