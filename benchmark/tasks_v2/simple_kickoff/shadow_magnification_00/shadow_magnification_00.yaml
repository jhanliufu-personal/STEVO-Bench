id: shadow_magnification_00
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: A stationary spotlight is aimed at a white wall. A small plastic dinosaur is sitting on a pedestal halfway
    between the light and the wall, casting a sharp shadow.
  video_WM: A hand continuously slides the pedestal closer to a spotlight.
  camera_WM: A hand continuously slides the pedestal closer to a spotlight.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A studio scene featuring a toy T-Rex standing on a tall wooden pedestal in the center. To the right,
    a black stage spotlight on a stand shines a beam of light towards the left. To the left, a textured concrete wall displays
    the cast shadow of the T-Rex. The beam of light is visible in the air, illuminating dust particles.
  init2final_edit_prompt: Edit the given image to move the wooden pedestal and dinosaur to the right, placing them closer
    to the spotlight. Make the shadow cast on the wall significantly larger and taller to reflect the increased magnification
    caused by the dinosaur's closer proximity to the light source. Keep the spotlight stand and the wall in their original
    positions. Maintain the original camera framing.
  rationale: The prompt describes the dinosaur moving toward the light source and away from the wall. According to the laws
    of optics, as an object moves closer to a point light source and further from the projection screen (the wall), the shadow
    magnification increases. Therefore, the final state must show the dinosaur positioned closer to the light and a correspondingly
    larger shadow on the wall. The camera rotation away and back serves as a temporal transition; I assume the camera returns
    to the initial framing to allow evaluation of the relative positions.
