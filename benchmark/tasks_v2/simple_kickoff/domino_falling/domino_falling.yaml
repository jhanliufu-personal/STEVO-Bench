id: domino_falling
level: 3
category: relational_state
tags: []
prompts:
  image_gen_prompt: A row of upright rectangular dominoes is arranged in a line on a flat table. A finger is positioned just
    behind the first domino in the row, about to push it.
  video_WM: A finger tips over the first domino in a long standing row; while the chain reaction continues to cascade through the row, the lights turn off, leaving the room in complete darkness and the dominoes completely invisible. After a pause, the lights turn back on.
  camera_WM: A finger tips over the first domino in a long standing row.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table surface featuring a long, winding row of rectangular
    wooden dominoes standing upright. A human hand enters from the left, with an index finger touching or poised to push the
    first domino in the sequence. The background is slightly out of focus, showing a domestic setting with a window, potted
    plants (including a Monstera), and a stack of books.
  init2final_edit_prompt: Edit the given image to show the row of dominoes toppled over. Render the wooden blocks lying flat
    on the table surface, following the exact winding path of the original standing row, to depict the aftermath of a chain
    reaction. Ensure the dominoes appear collapsed in sequence. Maintain the original background, lighting, and table texture
    exactly as they are.
  rationale: The video prompt describes a physical interaction where a finger pushes the first domino, initiating a chain
    reaction. The camera pans away for several seconds and then returns to the original framing. Due to the coupled nature
    of the dominoes (relational state), the fall of the first domino propagates through the chain. By the time the camera
    returns, the physics of the system dictates that the dominoes in the visible row will have toppled in sequence. The final
    state should show the dominoes lying flat along their original path.
