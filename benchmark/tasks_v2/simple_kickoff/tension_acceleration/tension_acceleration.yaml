id: tension_acceleration
level: 3
category: relational_state
relational_type: tension_coupling
prompts:
  image_gen_prompt: An iron weight is suspended off the edge of a table, connected by a string over a pulley to a 1kg rolling
    cart sitting on the tabletop.
  video_WM: A hand releases a cart on a track connected by a string, over a pulley, to a hanging weight. The lights in the room then turns off
    and leave the room in complete darkness, and the weight and cart completely invisible. After a pause, the lights are turned back on.
  camera_WM: A hand releases a cart on a track connected by a string, over a pulley, to a hanging weight.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  questions:
  - id: cart_moved_left
    question: Is the 1KG cart positioned further to the left than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The cart should have moved towards the pulley.
  - id: weight_moved_down
    question: Is the 5KG weight positioned lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The weight falls as the cart moves.
  - id: cart_pulley_proximity
    question: Is the distance between the 1KG cart and the pulley clamp significantly reduced?
    answer_type: yes_no
    notes_for_judge: The cart moves towards the pulley.
  - id: string_length_relation
    question: Is the horizontal segment of the string shorter than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the cart moves left, the horizontal string length decreases.
  - id: cart_ruler_relation
    question: Has the cart moved to a lower number/position on the meter stick relative to the start?
    answer_type: yes_no
    notes_for_judge: Assuming the ruler measures distance from the left/pulley, or simply checking relative displacement along
      the ruler.
  - id: coupled_motion
    question: Does the final state show the cart closer to the pulley and the weight lower, consistent with coupled motion?
    answer_type: yes_no
    notes_for_judge: Checks if both objects moved in the correct coupled directions.
  - id: connectivity
    question: Does the string still appear to connect the cart and the weight?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the stopwatch and meter stick still present on the table?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
