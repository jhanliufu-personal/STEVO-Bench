id: document_shredding
level: 4
category: structural_transformation
transformation_type: cutting (machine)
prompts:
  image_gen_prompt: An active office paper shredder with cutting blades running. A single sheet of paper is held just above
    the feed slot.
  video_WM: A hand feeds a document into the slot of a running paper shredder. A box is placed in front of the shredder, blocking
    the view, then, after a pause, removed.
  camera_WM: A hand feeds a document into the slot of a running paper shredder.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  questions:
  - id: paper_length
    question: Is the visible portion of the paper sheet shorter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The paper should have been fed into the machine, reducing the length visible above the slot.
  - id: bin_volume
    question: Is there a greater volume of shredded paper in the collection bin compared to the start?
    answer_type: yes_no
    notes_for_judge: The shredding process adds material to the bin.
  - id: paper_integrity
    question: Has the sheet of paper undergone structural reduction or fragmentation?
    answer_type: yes_no
    notes_for_judge: The paper is being destroyed/shredded.
  - id: shredding_progress
    question: Does the paper appear to be actively feeding into or consumed by the shredder?
    answer_type: yes_no
    notes_for_judge: Check for visual evidence of the paper moving into the blades or being shorter.
  - id: new_fragments
    question: Are there new paper strips visible in the bin that were not there initially?
    answer_type: yes_no
    notes_for_judge: The pile in the bin should look larger or higher.
  - id: hand_holding_less
    question: Is the hand holding a smaller piece of paper (or no paper) compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the paper is pulled in, less remains in the hand.
  - id: background_consistency
    question: Are the computer monitors in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: shredder_structure
    question: Does the shredder casing remain transparent?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
