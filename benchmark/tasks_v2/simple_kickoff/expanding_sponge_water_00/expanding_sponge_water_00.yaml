id: expanding_sponge_water_00
level: 1
category: scalar_state
tags: []
prompts:
  image_gen_prompt: A compressed dry sponge sits flat in a shallow white dish. The sponge is thin and compact in its dehydrated
    state. A hand holds a pitcher of water positioned above the sponge, about to pour.
  video_WM: A hand pours water from a cup over a flat compressed sponge.
  camera_WM: A hand pours water from a cup over a flat compressed sponge.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  questions:
  - id: sponge_thickness
    question: Is the sponge thicker vertically than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical height of the sponge slab. It should be significantly taller/thicker.
  - id: sponge_expansion
    question: Does the sponge appear to have expanded in volume compared to the start?
    answer_type: yes_no
    notes_for_judge: The sponge should look like it has grown or puffed up.
  - id: sponge_wetness
    question: Does the sponge texture appear wet or saturated?
    answer_type: yes_no
    notes_for_judge: Look for darkening or glistening associated with water absorption.
  - id: sponge_height_rel
    question: Is the top surface of the sponge higher relative to the rim of the dish than before?
    answer_type: yes_no
    notes_for_judge: In the init frame, the sponge is likely below or level with the rim. In the final, it should be higher.
  - id: sponge_flatness
    question: Is the sponge less flat than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial sponge is a flat wafer; the final should be a block.
  - id: dish_presence
    question: Is the white circular dish still present?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: table_texture
    question: Is the wooden surface texture visible and consistent with the start?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: sponge_color_change
    question: Is the sponge darker in color than the dry sponge in the initial frame?
    answer_type: yes_no
    notes_for_judge: Wet sponges usually appear darker beige/brown.
