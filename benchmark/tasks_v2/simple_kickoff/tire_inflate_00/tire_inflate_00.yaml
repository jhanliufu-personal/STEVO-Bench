id: tire_inflate_00
level: 1
category: scalar_state
scalar_variable: Tire outer diameter
prompts:
  image_gen_prompt: A flat bicycle tire on a rim. A high-pressure air hose is attached to the valve, and the rubber is just
    starting to push outward.
  video_WM: Air is getting pumped into the deflated tire through the pump nozzle.
  camera_WM: Air is getting pumped into the deflated tire through the pump nozzle.
camera_control:
  HY-WorldPlay: null
evaluation:
  questions:
  - id: tire_inflation_status
    question: Is the tire more inflated than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall fullness of the tire.
  - id: contact_patch_shape
    question: Is the flattened section of the tire at the bottom smaller or less pronounced than in the starting image?
    answer_type: yes_no
    notes_for_judge: The tire should look less squashed against the ground.
  - id: tire_roundness
    question: Does the tire appear rounder and firmer than it did initially?
    answer_type: yes_no
    notes_for_judge: The shape should be closer to a perfect circle.
  - id: rim_height
    question: Is the metal rim of the wheel sitting higher off the ground compared to the first frame?
    answer_type: yes_no
    notes_for_judge: As the tire inflates, it lifts the rim.
  - id: sidewall_tautness
    question: Do the sidewalls of the tire look less wrinkled or bulged than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Inflation smooths out the sidewalls.
  - id: hose_connection
    question: Is the air hose still connected to the valve stem?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: tool_consistency
    question: Are the wrenches on the floor in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: Consistency check.
