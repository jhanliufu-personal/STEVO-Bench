id: remote_control_pairing
level: 5
category: causal_mechanism
mechanism_type: rf_coupling_logic
prompts:
  image_gen_prompt: A small toy robot labeled Channel A sits on a surface. The robot is currently motionless and stationary. The camera view is centered on the robot.
  video_WM: The camera starts centered on the motionless toy robot labeled Channel A. The camera rotates right at constant speed until the robot exits the view. The camera continues rotating, revealing a handheld remote control also labeled Channel A. A hand enters the frame and presses the large FORWARD button on the remote control. The remote is within wireless range of the robot. The remote transmits radio signals when buttons are pressed, and the robot receives signals on the paired channel. The button press occurs while the toy robot remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the toy robot back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the robot, then rotates to the remote control. A hand presses the FORWARD button on the paired Channel A remote. The remote transmits the command signal wirelessly. The button press occurs while the robot is not visible. The camera then returns to the robot. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
