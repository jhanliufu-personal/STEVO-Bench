id: remote_control_pairing
level: 5
category: causal_mechanism
mechanism_type: rf_coupling_logic
prompts:
  image_gen_prompt: A small toy robot and a handheld remote control. Both are labeled 'Channel A'. The
    robot is currently motionless.
  video_WM: A hand presses the large 'FORWARD' button on the Channel A remote control. The remote is within
    range of the robot. The camera rotates right until the remote completely exits the view, then rotates
    toward the left smoothly at the same rate until the toy robot is back in the center of view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The command button is pressed on the paired remote control, sending a signal to the robot.
    The link is active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
