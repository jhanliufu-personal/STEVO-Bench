id: car_key_ignition_turn
level: 5
category: causal_mechanism
mechanism_type: rotary_switch_activation
tags: []
prompts:
  image_gen_prompt: A car dashboard is visible with instrument cluster showing no illuminated lights. The dashboard is dark. The steering column is partially visible. The camera view is centered on the dashboard instruments.
  video_WM: The camera starts centered on the dark dashboard instrument cluster. The camera rotates right at constant speed until the dashboard exits the view. The camera continues rotating right, revealing the steering column and ignition cylinder with a key inserted at the OFF position. A hand grips the key and turns it clockwise from the OFF position to the ACC or ON position. The ignition cylinder contains a rotary switch with multiple contact positions. As the key rotates, internal contacts align differently at each position. The ACC/ON position closes specific electrical circuits that were open in the OFF position. These circuits supply power to the dashboard instruments and indicator lights. Each dashboard light has a dedicated circuit that receives power when the ignition is in the appropriate position. The key turning occurs while the dashboard remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the dashboard instrument cluster back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the dark dashboard, then rotates to the ignition cylinder. A hand turns the key from OFF to ACC/ON position. The ignition cylinder contains a rotary switch with multiple contact positions. Different positions close different electrical circuits. The ACC/ON position circuits supply power to dashboard instruments. The key turn occurs while the dashboard is not visible. The camera then returns to the dashboard. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
