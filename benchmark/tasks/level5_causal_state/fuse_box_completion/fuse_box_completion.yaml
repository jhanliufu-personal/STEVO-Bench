id: fuse_box_completion
level: 5
category: causal_mechanism
mechanism_type: connectivity_logic
prompts:
  image_gen_prompt: An industrial floor fan is plugged into the wall. The fan blades are stationary and not spinning. The camera view is centered on the fan.
  video_WM: The camera starts centered on the stationary industrial floor fan. The camera rotates right at constant speed until the fan exits the view. The camera continues rotating, revealing an open industrial fuse box mounted on the wall. One circuit is missing its ceramic fuse, leaving an empty gap. A hand enters the frame holding a new ceramic fuse and presses it firmly into the empty gap in the fuse box, completing the circuit. The main power is ON. The fuse insertion occurs while the fan remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the industrial fan back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the fan, then rotates to the fuse box. A hand inserts a ceramic fuse into the empty gap, completing the electrical circuit. The main power is ON. The fuse insertion occurs while the fan is not visible. The camera then returns to the fan. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
