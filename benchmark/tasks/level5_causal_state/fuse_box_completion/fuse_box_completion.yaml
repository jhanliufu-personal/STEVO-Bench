id: fuse_box_completion
level: 5
category: causal_mechanism
mechanism_type: connectivity_logic
prompts:
  image_gen_prompt: An industrial floor fan is plugged into the wall. The fan blades are stationary and
    not spinning. The camera view is centered on the fan.
  video_WM: The camera starts centered on the stationary industrial floor fan. The camera rotates right
    at constant speed until the fan exits the view. The camera continues rotating, revealing an open industrial
    fuse box mounted on the wall. One circuit is missing its ceramic fuse, leaving an empty gap. A hand
    enters the frame holding a new ceramic fuse and presses it firmly into the empty gap in the fuse box,
    completing the circuit. The main power is ON. The fuse insertion occurs while the fan remains out
    of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the industrial fan back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the fan, then rotates to the fuse box. A hand inserts a ceramic fuse
    into the empty gap, completing the electrical circuit. The main power is ON. The fuse insertion occurs
    while the fan is not visible. The camera then returns to the fan. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A large, circular industrial floor fan sits in the center of a workshop. The
    fan has a metal wire cage and three distinct metal blades which are stationary. A black power cord
    runs from the fan motor to an electrical outlet box mounted on the brick wall to the left. The background
    features a workshop with shelves, machinery, and windows. The floor is concrete.
  init2final_edit_prompt: Edit the given image to show the industrial fan spinning at high speed. Apply
    strong radial motion blur to the fan blades inside the cage so they appear as a translucent blur rather
    than distinct stationary objects. Keep the wire cage, the stand, the power cord, and the surrounding
    workshop environment exactly as they are in the original image. The fan should look like it is powered
    on and running.
  rationale: The video prompt describes a sequence where the camera pans away to reveal a broken circuit
    (missing fuse), which is then repaired by inserting a new fuse. Since the fan is plugged in and the
    main power is described as ON, completing the circuit restores electricity to the fan. Therefore,
    when the camera returns to the initial view, the functional consequence of the action is that the
    fan should be running. The final frame must depict the fan blades with motion blur to indicate operation,
    contrasting with the stationary blades in the initial frame.
  questions:
  - id: fan_spinning
    question: Is the industrial fan spinning in the final frame?
    answer_type: yes_no
    notes_for_judge: Look for visual evidence of rotation such as motion blur on the blades.
  - id: motion_blur
    question: Do the fan blades appear blurred due to motion?
    answer_type: yes_no
    notes_for_judge: The blades should not be sharp and distinct as in the initial frame.
  - id: blades_indistinct
    question: Are the individual fan blades less distinct than they were in the initial frame?
    answer_type: yes_no
    notes_for_judge: Spinning blades should merge visually.
  - id: fan_active_state
    question: Does the fan appear to be powered on and active?
    answer_type: yes_no
    notes_for_judge: Infer from the visual state of the blades.
  - id: cord_plugged_in
    question: Is the power cord still plugged into the outlet on the left wall?
    answer_type: yes_no
    notes_for_judge: The connection must remain to justify the power state.
  - id: cage_position
    question: Is the fan's wire cage in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The fan itself should not have moved, only the blades are spinning.
  - id: background_consistency
    question: Are the shelves and machinery in the background consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for hallucinations in the background.
