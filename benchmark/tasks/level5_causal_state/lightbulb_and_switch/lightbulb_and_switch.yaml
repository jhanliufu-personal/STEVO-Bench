  - id: room_brightness
    question: Is the room significantly brighter than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The room should be lit by the artificial light, not just the dim window light.
  - id: illumination_source
    question: Does the lighting on the furniture suggest an overhead light source is active?
    answer_type: yes_no
    notes_for_judge: Shadows and highlights should be consistent with the ceiling light being on.
  - id: switch_state_change
    question: Is the light switch toggle pointing in the opposite direction compared to the initial frame?
