  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A dimly lit room corner containing a blue upholstered armchair, a small round
    wooden side table with a stack of books, and a window with closed blinds on the right wall. A flush-mount
    ceiling light fixture is centered near the top, currently turned off (dark). On the left wall, a white
    light switch plate is visible with the toggle in the down position.
  init2final_edit_prompt: Edit the image to show the ceiling light turned on. The glass dome of the ceiling
    fixture should be glowing brightly with warm white light. The entire room should be illuminated by
    this overhead light source, making the walls, carpet, and armchair significantly brighter than in
    the original dark state. The toggle of the light switch on the left wall must be flipped to the UP
    position.
  rationale: 'The video prompt describes a sequence where the camera pans away and returns to the original
    viewpoint. During the interval, a human hand toggles the wall switch. The initial state shows the
    switch in the ''down'' position and the room dark (light off). The prompt defines ''switch up = light
    ON''. Therefore, the action of toggling the switch changes the state to ''switch up'' and ''light
    ON''. The final frame must reflect this new state: the switch physically flipped up and the room illuminated
    by the active ceiling light.'
  questions:
