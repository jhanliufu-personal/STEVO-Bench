prompts:
  video_WM: Single continuous shot, no cuts, no zoom. The scene contains one functioning ceiling light
    that is controlled only by the wall switch (switch up = light ON, switch down = light OFF). The bulb
    is working. Camera starts centered on the ceiling light. The camera smoothly moves left at constant
    speed until the ceiling light exits the frame to the right. While the light is out of view, a human
    hand toggles the wall switch (changing it to the opposite position). The camera continues moving left
    for several seconds. Then the camera moves right at the same constant speed back to the original viewpoint,
    bringing the ceiling light back into view.
