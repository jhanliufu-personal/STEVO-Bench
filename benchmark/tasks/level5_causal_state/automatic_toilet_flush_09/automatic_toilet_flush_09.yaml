id: automatic_toilet_flush_09
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_toilet_flush
variation_type: repeated_activation
variation_description: Double wave interpreted as a cancel command.
changes:
  occlusion_method: null
  dynamic_conditions: Two rapid signals cancel the operation.
  expected_outcome_change: The water remains stable (no flush).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the toilet bowl with stable water level. The camera rotates
    right at constant speed until the bowl exits the view. The camera continues rotating, revealing the
    automatic flush sensor module. A hand enters the frame and waves twice in rapid succession in front
    of the sensor. The repeated action occurs while the toilet bowl remains out of camera view. Then the
    camera rotates left smoothly back to the original viewpoint, bringing the toilet bowl back into center
    view. STOP.
  camera_WM: The scene features a toilet bowl and a flush sensor. A hand waves twice rapidly in front
    of the sensor. This action occurs while the bowl is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A high-angle close-up view of a white ceramic toilet bowl with the lid raised.
    The water inside the bowl is calm and still, with some visible mineral staining on the porcelain surface
    below the water line. A beige textured bath mat is partially visible at the bottom of the frame, and
    the floor is covered in light-colored tiles. To the left, a window frame is visible.
  init2final_edit_prompt: Edit the given image to show the water in the toilet bowl swirling and turbulent,
    indicating an active flush cycle. The water surface should be disturbed with ripples, bubbles, or
    motion blur typical of flushing water, replacing the calm, still water from the original view. Maintain
    the original camera angle, lighting, and the position of the toilet bowl and surrounding objects.
  rationale: 'The video prompt describes a sequence where the camera rotates away from the bowl to reveal
    a flush sensor, which is then triggered by a hand wave. This causal action activates the flushing
    mechanism. Although the bowl is occluded during the triggering action, the camera rotates back to
    the original view immediately after. Therefore, in the final frame, the functional consequence of
    the trigger must be visible: the toilet should be in the process of flushing, with the water agitated
    and swirling rather than still.'
