id: slider_thermostat_heat_00
level: 5
category: causal_mechanism
tags: []
variant_of: slider_thermostat_heat
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add a wall-mounted heater control unit with a horizontal slider
    on the wall to the right of the vent. The slider should be positioned at the far left.
  video_WM: The camera is completely stationary, framing a wall that features both a heater vent and a
    heater control slider. The slider is initially set to the far left position. A finger enters the frame,
    touches the control bar, and slides it all the way to the far right position. The hand then exits
    the view, leaving the slider at the new setting. STOP.
  camera_WM: The camera is completely stationary, framing a wall that features both a heater vent and
    a heater control slider. The slider is initially set to the far left position. A finger enters the
    frame, touches the control bar, and slides it all the way to the far right position. The hand then
    exits the view, leaving the slider at the new setting. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a beige wall featuring a rectangular heater vent with horizontal
    slats on the left and a thermostat control unit on the right. The thermostat has a horizontal slot
    with a small beige slider knob currently positioned at the far left end, labeled 'OFF'. The right
    end of the slot is labeled 'MAX'.
  init2final_edit_prompt: Edit the given image to move the small beige slider knob to the far right end
    of the horizontal slot, positioning it directly under or next to the 'MAX' label. Ensure the slider
    is no longer on the left side. The hand or finger used to move it should not be visible. Keep the
    heater vent, wall texture, and lighting exactly as they are.
  rationale: The video prompt describes a physical interaction where a hand moves the thermostat slider
    from the far left ('OFF') to the far right ('MAX'). The camera is stationary, and the hand exits the
    frame after the action. Therefore, the final state must show the slider at the rightmost position
    without the hand present, while the background and vent remain unchanged.
  questions:
  - id: slider_position_right
    question: Is the slider knob now positioned at the far right end of the horizontal slot?
    answer_type: yes_no
    notes_for_judge: The slider should be at the limit of the track on the right side.
  - id: slider_near_max
    question: Is the slider knob closer to the 'MAX' label than the 'OFF' label?
    answer_type: yes_no
    notes_for_judge: Check relative distance to the text labels.
  - id: slider_moved_from_off
    question: Has the slider knob moved away from its initial position at the far left?
    answer_type: yes_no
    notes_for_judge: It should no longer be at the 'OFF' mark.
  - id: slider_past_center
    question: Is the slider knob located to the right of the center of the slot?
    answer_type: yes_no
    notes_for_judge: It should be clearly in the right half of the track.
  - id: hand_absent
    question: Is the hand or finger absent from the final frame?
    answer_type: yes_no
    notes_for_judge: The prompt states the hand exits the view.
  - id: vent_consistency
    question: Is the heater vent with horizontal slats still visible on the left side?
    answer_type: yes_no
    notes_for_judge: The vent should remain unchanged.
  - id: wall_consistency
    question: Does the wall retain its original beige color and texture?
    answer_type: yes_no
    notes_for_judge: Background consistency check.
