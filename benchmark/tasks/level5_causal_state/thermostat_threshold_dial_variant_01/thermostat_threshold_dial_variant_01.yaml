id: thermostat_threshold_dial_variant_01
level: 5
category: causal_mechanism
tags: []
variant_of: thermostat_threshold_dial
variation_type: initial_state
variation_description: Heater starts ON (glowing) with thermostat set high; hand turns it down.
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is active (glowing). Action is turning dial down below ambient.
  expected_outcome_change: Heater turns OFF (stops glowing) because thermostat is set below ambient.
prompts:
  init_frame_edit_prompt: Edit the heating element to appear active, with the coils glowing bright orange-red
    to indicate high heat.
  video_WM: The camera starts centered on the glowing, active heating element. The camera rotates right
    at constant speed until the heating element exits the view. The camera continues rotating, revealing
    a round analog thermostat dial mounted on the wall. The current temperature needle shows 60 degrees.
    The setting dial is currently at 80 degrees (above ambient). A hand enters the frame and rotates the
    setting dial counter-clockwise until the marker reaches 50 degrees, dropping below the current temperature
    needle. When the thermostat setting drops below ambient temperature, the circuit disengages heating.
    The dial rotation occurs while the heating element remains out of camera view. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the heating element back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the heating element, then rotates to the thermostat dial. A hand rotates
    the setting dial from 80 to 50 degrees, dropping below the ambient temperature of 60 degrees. The
    thermostat disengages heating when setting drops below ambient. The dial rotation occurs while the
    heating element is not visible. The camera then returns to the heating element. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of an electric space heater. The central heating element is
    a coiled tube glowing bright orange-red, indicating it is active and hot. A horizontal metal wire
    grille protects the element. The heater's housing is metallic with a slightly reflective surface.
  init2final_edit_prompt: Edit the given image to turn off the heater. Change the heating element coils
    from glowing bright orange to a dark, dull grey or black color, indicating that the power has been
    cut and the element is no longer incandescent. Keep the metal grille, the housing, and the camera
    viewpoint exactly the same.
  rationale: The video prompt describes a causal chain where the camera pans to a thermostat, and a user
    lowers the setting (50 degrees) below the current ambient temperature (60 degrees). This action functionally
    disengages the heating circuit. When the camera pans back to the original view, the heating element
    must reflect this state change by no longer glowing, appearing dark/deactivated.
  questions:
  - id: q1
    question: Is the heating element no longer glowing bright orange?
    answer_type: yes_no
    notes_for_judge: The coils should be dark/grey, not orange/red.
  - id: q2
    question: Do the coils appear dark (grey or black) instead of illuminated?
    answer_type: yes_no
    notes_for_judge: Verifies the visual state of the element corresponds to 'off'.
  - id: q3
    question: Does the heater appear to be deactivated compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Functional state check.
  - id: q4
    question: Is the incandescence (light emission) from the heating element absent?
    answer_type: yes_no
    notes_for_judge: Check for lack of light source from the coils.
  - id: q5
    question: Are the horizontal metal grille bars still visible in the same position?
    answer_type: yes_no
    notes_for_judge: Consistency check for static objects.
  - id: q6
    question: Is the camera framing identical to the initial view?
    answer_type: yes_no
    notes_for_judge: Consistency check for camera return.
