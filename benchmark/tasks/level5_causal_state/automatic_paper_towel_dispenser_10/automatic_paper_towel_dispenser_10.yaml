id: automatic_paper_towel_dispenser_10
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_paper_towel_dispenser
variation_type: indirect_causation
variation_description: An intermediate status light is added to the causal chain.
changes:
  occlusion_method: null
  dynamic_conditions: The sensor triggers a status light first, which then enables the motor.
  expected_outcome_change: Paper is dispensed, but the status light is also illuminated/blinking.
prompts:
  init_frame_edit_prompt: Edit the image to add a large green status light box attached to the top of
    the dispenser.
  video_WM: The camera starts centered on the automatic paper towel dispenser opening. The camera rotates
    right at constant speed until the dispenser exits the view. The camera continues rotating, revealing
    the area directly below the dispenser where the infrared sensor detection zone is located. A hand
    enters the frame and waves in front of the sensor zone. The sensor detects the hand, causing the green
    status light on top to blink, which then signals the motor to activate. The hand wave occurs while
    the dispenser opening remains out of camera view. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the dispenser opening back into center view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The scene displays the dispenser opening with a status light. The view shifts to the sensor
    detection area below. A hand waves in the sensor zone. The sensor detects proximity, triggers the
    status light, and activates the motor. The hand wave occurs while the dispenser opening is not visible.
    The view returns to the dispenser opening. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A stainless steel Tork automatic paper towel dispenser mounted on a white subway
    tile wall. A bright green indicator light strip is illuminated on the top edge. Through a transparent
    window in the center, a roll of brown paper towels is visible. The dispensing slot at the bottom is
    visible and currently empty, with no paper hanging out.
  init2final_edit_prompt: Edit the given image to show a sheet of brown paper towel hanging down from
    the bottom dispensing slot of the unit. The paper should extend vertically downwards from the metal
    opening, appearing as if it has just been dispensed.
  rationale: The video prompt describes a sequence where the camera pans away from the dispenser, a hand
    triggers the infrared sensor, and the camera pans back. The functional mechanism of this device is
    that triggering the sensor activates the motor to dispense a length of paper towel. Although the dispensing
    action occurs while the device is out of view (occluded), the resulting state change—a sheet of paper
    hanging from the bottom slot—must be visible when the camera returns to the initial viewpoint.
  questions:
  - id: paper_hanging_1
    question: Is there a sheet of paper towel hanging from the bottom of the dispenser?
    answer_type: yes_no
    notes_for_judge: Check if paper has been dispensed from the slot.
  - id: paper_hanging_2
    question: Is the amount of paper towel visible outside the dispenser greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare with the initial empty slot.
  - id: paper_color
    question: Is there brown paper visible extending below the stainless steel casing?
    answer_type: yes_no
    notes_for_judge: The paper should match the roll inside.
  - id: functional_state
    question: Does the dispenser opening show evidence of the mechanism being triggered?
    answer_type: yes_no
    notes_for_judge: Evidence is the dispensed paper.
  - id: consistency_wall
    question: Is the wall behind the dispenser still composed of white tiles?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: consistency_logo
    question: Is the Tork logo still visible on the front of the dispenser?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: consistency_light_structure
    question: Is the green light fixture on top of the dispenser still present?
    answer_type: yes_no
    notes_for_judge: Checks for the presence of the light component, not necessarily its on/off state
      which might be blinking.
