id: safety_interlock_motor
level: 5
category: causal_mechanism
mechanism_type: interlock_logic
prompts:
  image_gen_prompt: An industrial motor drive shaft is visible and currently stationary. The camera view
    is centered on the motor shaft.
  video_WM: The camera starts centered on the stationary motor drive shaft. The camera rotates right at
    constant speed until the shaft exits the view. The camera continues rotating, revealing a large green
    START button next to a clear plastic safety guard. The guard is currently flipped down in the closed
    position. A finger enters the frame and presses the green START button. The motor has a safety interlock
    mechanism that only allows operation when the guard is properly closed. The button press occurs while
    the motor shaft remains out of camera view. Then the camera rotates left smoothly at the same rate
    back to the original viewpoint, bringing the motor drive shaft back into center view. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The camera starts on the motor shaft, then rotates to the START button and safety guard.
    A finger presses the START button while the guard is closed. The safety interlock permits operation
    only when the guard is closed. The button press occurs while the shaft is not visible. The camera
    then returns to the motor shaft. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, green industrial electric motor dominates the foreground in a factory
    setting. A thick, cylindrical metal drive shaft extends from the left side of the motor, showing surface
    rust, grease, and a distinct keyway slot. The motor body has cooling fins and a lifting eye on top.
    The background is a spacious industrial workshop with concrete pillars, overhead lights, and other
    machinery.
  init2final_edit_prompt: Edit the given image to show the motor drive shaft spinning at high speed. Apply
    strong rotational motion blur to the cylindrical metal shaft, causing the rust, grease textures, and
    the keyway slot to appear smeared and indistinct. Keep the green motor housing, the mounting base,
    and the industrial background sharp and strictly in focus to contrast with the moving shaft.
  rationale: The video prompt establishes a causal chain involving a safety interlock mechanism. The user
    presses the 'START' button while the safety guard is in the 'closed' position. The interlock logic
    dictates that the motor is permitted to start only if the guard is closed. Since this condition is
    met, the motor activates. The camera pans away during the interaction and returns to the original
    view. Therefore, the final state must depict the motor in operation, visually represented by rotational
    motion blur on the drive shaft, while the rest of the scene remains static.
  questions:
  - id: shaft_blur_check
    question: Does the metal drive shaft exhibit motion blur indicating rapid rotation?
    answer_type: yes_no
    notes_for_judge: The shaft should look blurred/spinning compared to the sharp initial frame.
  - id: texture_smear
    question: Are the surface details on the shaft (rust and grease) smeared rotationally?
    answer_type: yes_no
    notes_for_judge: Static details should now be streaks.
  - id: keyway_visibility
    question: Is the keyway slot on the shaft less distinct or blurred out compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: A spinning keyway is not clearly visible.
  - id: motor_active_state
    question: Does the image depict the motor in an active, running state?
    answer_type: yes_no
    notes_for_judge: 'Functional check: did the start button work?'
  - id: static_body_check
    question: Is the green motor body still sharp and in focus?
    answer_type: yes_no
    notes_for_judge: Only the shaft should move; the body is stationary.
  - id: background_sharpness
    question: Is the industrial background sharp, confirming the blur is localized to the shaft?
    answer_type: yes_no
    notes_for_judge: Ensures the blur isn't just global camera motion blur.
