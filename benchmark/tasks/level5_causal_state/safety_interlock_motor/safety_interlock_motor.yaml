id: safety_interlock_motor
level: 5
category: causal_mechanism
mechanism_type: interlock_logic
prompts:
  image_gen_prompt: An industrial motor drive shaft is visible and currently stationary. The camera view is centered on the motor shaft.
  video_WM: The camera starts centered on the stationary motor drive shaft. The camera rotates right at constant speed until the shaft exits the view. The camera continues rotating, revealing a large green START button next to a clear plastic safety guard. The guard is currently flipped down in the closed position. A finger enters the frame and presses the green START button. The motor has a safety interlock mechanism that only allows operation when the guard is properly closed. The button press occurs while the motor shaft remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the motor drive shaft back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the motor shaft, then rotates to the START button and safety guard. A finger presses the START button while the guard is closed. The safety interlock permits operation only when the guard is closed. The button press occurs while the shaft is not visible. The camera then returns to the motor shaft. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
