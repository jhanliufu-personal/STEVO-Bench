id: conveyor_reverse_lever
level: 5
category: causal_mechanism
mechanism_type: mechanical_logic
prompts:
  image_gen_prompt: A long conveyor belt with a control lever on the side. The lever is currently in the
    middle 'NEUTRAL' position. A cardboard box sits on the belt.
  video_WM: A worker pulls the control lever all the way to the 'REVERSE' position. The motor hums and
    the belt is engaged. The camera rotates right until the lever completely exits the view, then rotates
    toward the left smoothly at the same rate until the cardboard box on the belt is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The control lever is shifted from neutral to reverse while the belt motor is active. The
    transmission is engaged. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
