id: conveyor_reverse_lever
level: 5
category: causal_mechanism
mechanism_type: mechanical_logic
prompts:
  image_gen_prompt: A cardboard box sits stationary on a conveyor belt. The belt is currently not moving. The camera view is centered on the box on the belt.
  video_WM: The camera starts centered on the stationary cardboard box on the conveyor belt. The camera rotates right at constant speed until the box exits the view. The camera continues rotating, revealing a control lever on the side of the conveyor. The lever is currently in the middle NEUTRAL position. A hand enters the frame and pulls the control lever all the way to the REVERSE position. The motor is active and the transmission engages in the selected direction. The lever movement occurs while the cardboard box remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the cardboard box on the belt back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the box, then rotates to the control lever. A hand shifts the lever from NEUTRAL to REVERSE position. The transmission engages in the selected direction. The lever movement occurs while the box is not visible. The camera then returns to the box on the belt. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
