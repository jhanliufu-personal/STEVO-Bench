id: fire_alarm_pull_station_05
level: 5
category: causal_mechanism
tags: []
variant_of: fire_alarm_pull_station
variation_type: precondition_failure
variation_description: The indicator dome is shattered and dark; the light cannot turn on.
changes:
  occlusion_method: null
  dynamic_conditions: Output object is broken (shattered). Causal chain fails at the output.
  expected_outcome_change: The light remains dark/shattered (no change).
prompts:
  init_frame_edit_prompt: Edit the image so the green dome is shattered, broken, and dark.
  video_WM: The camera starts centered on the ceiling-mounted fire alarm indicator which has a shattered,
    dark dome. The camera rotates right at constant speed until the indicator exits the view. The camera
    continues rotating, revealing a red fire alarm pull station on the wall. A hand enters the frame and
    pulls down the handle on the pull station firmly. The pull station switch closes the alarm circuit
    to send power to the indicator. The handle pull occurs while the ceiling indicator remains out of
    camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the ceiling indicator back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ceiling indicator is shattered and dark. A hand pulls down the handle on the wall-mounted
    station. The station activates the circuit. The action occurs while the indicator is not visible.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, centered view of a white, circular fire alarm indicator mounted
    on a white textured ceiling. The device features a central green glass dome that is shattered, with
    cracks and missing shards revealing a dark interior. The text 'SYSTEM ARMED' is printed on the top
    rim, and 'FIRE ALARM INDICATOR' on the bottom rim. Small fragments of green glass are scattered on
    the ceiling around the device.
  init2final_edit_prompt: Edit the given image to turn on the light inside the fire alarm indicator. Make
    the dark interior behind the shattered green glass glow brightly with an intense green light. The
    light should illuminate the cracks and remaining shards of the dome from within. Keep the position
    of the shattered glass, the text, and the surrounding ceiling debris exactly the same, changing only
    the illumination state to show the device is active.
  rationale: 'The video prompt describes a causal chain where the camera rotates away to reveal a pull
    station, which is then activated by a hand. This action closes the circuit and sends power to the
    ceiling indicator. When the camera rotates back to the original view, the only change in the scene
    should be the functional state of the indicator: it should now be illuminated (glowing) instead of
    dark, reflecting the activation of the alarm system. The physical damage to the dome remains unchanged.'
  questions:
  - id: q1_illumination
    question: Is the fire alarm indicator now emitting light?
    answer_type: yes_no
    notes_for_judge: The central dome should be glowing or illuminated, contrasting with the dark initial
      state.
  - id: q2_glow_center
    question: Is the interior of the shattered dome glowing brightly?
    answer_type: yes_no
    notes_for_judge: Look for a light source inside the broken glass.
  - id: q3_brightness_change
    question: Is the center of the device significantly brighter than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the luminance of the central dome area.
  - id: q4_functional_state
    question: Does the indicator appear to be powered on or active?
    answer_type: yes_no
    notes_for_judge: The visual cue for 'active' is the light being on.
  - id: q5_glass_shattered
    question: Is the green glass dome still shattered?
    answer_type: yes_no
    notes_for_judge: The physical damage should persist; the glass should not be repaired.
  - id: q6_text_consistency
    question: Is the text 'SYSTEM ARMED' still visible on the device?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: q7_debris_consistency
    question: Are the small green glass shards still present on the ceiling?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
