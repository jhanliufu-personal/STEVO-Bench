id: sprinkler_valve_control_03
level: 5
category: causal_mechanism
tags: []
variant_of: sprinkler_valve_control
variation_type: initial_state
variation_description: Sprinkler starts active creating a mist; action closes the valve.
changes:
  occlusion_method: null
  dynamic_conditions: Sprinkler is active (mist). Valve starts OPEN. Action CLOSES valve.
  expected_outcome_change: Mist dissipates and sprinkler becomes inactive.
prompts:
  init_frame_edit_prompt: Edit the image to show a fine mist of water spraying from the sprinkler head,
    blurring the background slightly.
  video_WM: The camera starts centered on the misting sprinkler head on the grass. The camera rotates
    right at constant speed until the sprinkler exits the view. The camera continues rotating, revealing
    a manual water valve mounted on a pipe near the wall. The valve handle is currently in the open position.
    A hand enters the frame and turns the valve handle clockwise to the shut-off position. This action
    blocks the water flow to the sprinkler line. The valve operation occurs while the sprinkler head remains
    out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the sprinkler head back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scene features a misting sprinkler head and a manual water valve. A hand turns the valve
    handle clockwise to the shut-off position. This action blocks the water flow to the sprinkler line.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal impact sprinkler head mounted on a short
    riser in a field of dry, yellow grass. The sprinkler is active, spraying a fan of water mist and droplets
    into the air. The ground is parched with visible cracks. A beige hose is connected to the base of
    the sprinkler. The background consists of blurred dry vegetation.
  init2final_edit_prompt: Edit the given image to stop the water flow. Remove all water spray, mist, and
    droplets emerging from the sprinkler head. The sprinkler head should appear completely inactive and
    dry. Keep the metal sprinkler mechanism, the hose, the dry grass, and the background exactly as they
    are, but eliminate the water action.
  rationale: 'The video prompt describes a sequence where the camera pans away from the active sprinkler
    to reveal a manual valve. A hand turns this valve to the ''shut-off'' position, which physically cuts
    the water supply to the sprinkler line. When the camera pans back to the original view, the causal
    effect of closing the valve must be visible: the sprinkler should no longer be spraying water. The
    final state is the sprinkler in an ''off'' condition.'
