id: pressure_mat_alarm_09
level: 5
category: causal_mechanism
tags: []
variant_of: pressure_mat_alarm
variation_type: repeated_activation
variation_description: The mat is stepped on twice (toggle on, toggle off).
changes:
  occlusion_method: null
  dynamic_conditions: 'Toggle logic: First step triggers, second step resets. Net zero change.'
  expected_outcome_change: Final state is Green (Original state).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the alarm indicator light showing green. The camera rotates
    right at constant speed until the indicator exits the view. The camera continues rotating, revealing
    a rectangular pressure-sensitive floor mat positioned in the entryway. The system operates as a toggle.
    A foot enters the frame and steps onto the mat to trigger it, then lifts and steps onto it again to
    reset it. These two actions occur while the alarm indicator remains out of camera view. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the alarm indicator
    back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scene features a green alarm indicator and a pressure-sensitive floor mat configured
    as a toggle. A foot steps onto the mat (trigger) and then steps again (reset). These actions occur
    while the alarm indicator is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot of a grey industrial electrical box mounted on a
    textured beige wall between two windows. The box features a central green dome light which is currently
    illuminated and glowing. Above the light is a black label with white text reading 'SYSTEM ARMED',
    and below the light is a similar label reading 'NORMAL'. Metal conduits connect to the top and bottom
    of the box.
  init2final_edit_prompt: Edit the given image so that the central green indicator light on the control
    box is illuminated and glowing bright green. Ensure the light appears active and emits a visible green
    glow.
  rationale: The video describes a sequence where the camera rotates to reveal a pressure mat, a user
    steps on it to trigger the system (changing the state), and then steps on it again to reset the system.
    The 'reset' action explicitly restores the system to its initial state. Therefore, when the camera
    rotates back to the original view of the control box, the indicator light must be back in its original
    'Normal' state, which is glowing green. The final state is identical to the initial state because
    the second action cancelled the first.
  questions:
  - id: primary_state_green
    question: Is the central indicator light glowing green?
    answer_type: yes_no
    notes_for_judge: The system was reset, so the light should be green (Normal state).
  - id: primary_state_illuminated
    question: Is the dome light on the control box illuminated?
    answer_type: yes_no
    notes_for_judge: The light should be on/glowing, not dark.
  - id: primary_state_color
    question: Is the active light color green?
    answer_type: yes_no
    notes_for_judge: It should not be red or off.
  - id: primary_state_normal
    question: Does the indicator light correspond to the 'NORMAL' state?
    answer_type: yes_no
    notes_for_judge: Green indicates Normal in this context.
  - id: primary_state_glow
    question: Is the indicator light emitting a visible glow?
    answer_type: yes_no
    notes_for_judge: Check for bloom or brightness indicating the light is active.
  - id: secondary_label_top
    question: Is the 'SYSTEM ARMED' label visible above the light?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: secondary_conduit
    question: Is the vertical conduit above the box visible?
    answer_type: yes_no
    notes_for_judge: Invariant check.
