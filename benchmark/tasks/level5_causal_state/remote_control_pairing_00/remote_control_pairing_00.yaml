id: remote_control_pairing_00
level: 5
category: causal_mechanism
tags: []
variant_of: remote_control_pairing
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to place a toy remote control labeled 'Channel A' on the wooden
    table to the right of the robot. The remote should have a large button and match the lighting, texture,
    and depth of field of the scene.
  video_WM: The camera is completely stationary, framing both the toy robot labeled 'Channel A' and the
    paired remote control labeled 'Channel A' resting on the table. A hand enters the frame and presses
    the large FORWARD button on the remote control. STOP.
  camera_WM: The camera is completely stationary, framing both the toy robot labeled 'Channel A' and the
    paired remote control labeled 'Channel A' resting on the table. A hand enters the frame and presses
    the large FORWARD button on the remote control. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A grey, retro-style toy robot with tank tracks and a 'CHANNEL A' label on its
    chest stands on the left side of a wooden table. To its right sits a matching grey remote control
    with a prominent red button, a small dark indicator light, an antenna, and a 'CHANNEL A' label. The
    background features blurred books and a window.
  init2final_edit_prompt: Edit the given image to show a human hand entering the frame and pressing the
    large red button on the remote control. The small indicator light below the button on the remote should
    be illuminated red. The toy robot should be positioned closer to the camera and lower in the frame,
    appearing larger than in the original image, to simulate that it has driven forward towards the viewer.
    The background and table surface should remain consistent.
  rationale: The visual setup establishes a functional pairing between the remote and the robot via the
    matching 'Channel A' labels. The action described is pressing the 'Forward' button. Functionally,
    this triggers the robot's motors. Since the robot is oriented facing the camera, a 'forward' command
    causes it to move towards the viewpoint. Therefore, in the final state, the robot must be displaced
    from its original position, appearing closer (larger and lower in the frame) while the remote shows
    signs of activation (hand present, light on).
