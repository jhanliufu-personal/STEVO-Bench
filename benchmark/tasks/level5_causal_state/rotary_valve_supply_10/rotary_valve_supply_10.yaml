id: rotary_valve_supply_10
level: 5
category: causal_mechanism
tags: []
variant_of: rotary_valve_supply
variation_type: indirect_causation
variation_description: A second valve on the supply line is closed, preventing flow even when the main
  valve is opened.
changes:
  occlusion_method: null
  dynamic_conditions: Secondary valve blocks flow. Opening main valve has no effect.
  expected_outcome_change: No flame appears because the upstream/secondary valve cuts the supply.
prompts:
  init_frame_edit_prompt: Edit the image to add a second, red-handled valve on the vertical pipe section
    below the T-junction. The red handle should be perpendicular to the pipe (closed state).
  video_WM: The camera starts centered on the unlit burner nozzle. The camera rotates right at constant
    speed until the burner exits the view. The camera continues rotating, revealing a yellow rotary valve
    handle on the gas pipe and a second red valve below it that is currently closed. A hand enters the
    frame, grabs the yellow handle, and rotates it 90 degrees so that it becomes parallel with the pipe
    (open). The hand does not touch the closed red valve. The yellow valve remains open. The valve rotation
    occurs while the burner nozzle remains out of camera view. Then the camera rotates left smoothly at
    the same rate back to the original viewpoint, bringing the burner nozzle back into center view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the burner nozzle, then rotates to the valve setup. A hand opens the
    main yellow valve, but a secondary red valve remains closed. The valve rotation occurs while the burner
    is not visible. The camera then returns to the burner nozzle. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a metal pipe burner assembly in a workshop. The central component
    is a horizontal rusty metal pipe with a T-junction. To the left, the pipe ends in an open, unlit burner
    nozzle which shows signs of soot and heat discoloration. Extending downwards from the T-junction is
    a short pipe connected to a red-handled ball valve; the handle is perpendicular to the pipe, indicating
    it is closed. To the right, the main pipe continues towards a brass fitting. The background is a blurred
    workshop interior with wooden walls, a window, and various tools.
  init2final_edit_prompt: Edit the given image to show the burner nozzle emitting a bright, fierce flame
    to the left. The flame should be orange and blue, appearing as a high-pressure jet typical of a gas
    burner. The red valve handle at the bottom must remain in its closed, perpendicular position. The
    rest of the scene, including the background and pipe assembly, should remain unchanged.
  rationale: The video prompt describes a causal sequence where the camera pans to reveal a gas supply
    valve (yellow handle), a user opens it, and the camera returns to the original view of the nozzle.
    Functionally, opening the gas supply to a burner implies activation. Therefore, the final state must
    show the burner emitting a flame, representing the 'on' state caused by the valve opening. The red
    valve visible in the initial frame was not touched, so it must remain closed.
