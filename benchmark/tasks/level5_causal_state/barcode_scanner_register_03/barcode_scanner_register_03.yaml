id: barcode_scanner_register_03
level: 5
category: causal_mechanism
tags: []
variant_of: barcode_scanner_register
variation_type: initial_state
variation_description: Register display shows 'READY' text instead of price
changes:
  occlusion_method: null
  dynamic_conditions: The register is in a ready state; scanning initiates the first item.
  expected_outcome_change: The final display will change from text to a numeric price value.
prompts:
  init_frame_edit_prompt: Edit the register display to show the word 'READY' in green digital text instead
    of numbers.
  video_WM: The camera starts centered on the cash register display showing the text 'READY'. The camera
    rotates right at constant speed until the display exits the view. The camera continues rotating, revealing
    a barcode scanner area with a product (cereal box) being held over it. A hand holding the product
    moves it across the scanner window. The scanner uses an optical sensor to read barcodes, looks up
    product data in the database, and transmits price information to the register display. The scanning
    action occurs while the register display remains out of camera view. Then the camera rotates left
    smoothly at the same rate back to the original viewpoint, bringing the register display back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the register display showing 'READY', then rotates to the scanner area.
    A hand scans a product barcode across the scanner. The scanner reads barcodes and sends product data
    to update the display. The scanning occurs while the display is not visible. The camera then returns
    to the register display. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a beige electronic cash register. The
    central focus is a green backlit LCD display showing the text 'READY' in segmented digital characters.
    To the left of the display is a keypad with grey and brown buttons. Above the display, a white paper
    receipt curls out of the printer slot. In the background, out of focus, are shelves stocked with boxes
    of candy and snacks, including red and yellow packaging.
  init2final_edit_prompt: Edit the given image to update the green digital display on the cash register.
    Replace the text 'READY' with a price such as '4.99' or '3.50' in the same digital font style. Keep
    the keypad, the receipt paper, and the background candy shelves exactly as they are. Ensure the lighting
    and camera angle remain identical to the original image.
  rationale: The video sequence involves a camera panning away from the register display to a scanner,
    performing a scanning action, and then panning back. This is a functional state transition test. The
    scanning of a product is a causal trigger that updates the system state. While the display is occluded
    (out of view), the system processes the barcode. When the camera returns to the initial viewpoint,
    the display must reflect the new state (a price or product entry) rather than the initial 'READY'
    idle state. The physical environment (register position, background) remains unchanged.
