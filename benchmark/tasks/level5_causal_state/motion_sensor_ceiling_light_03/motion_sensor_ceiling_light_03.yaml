id: motion_sensor_ceiling_light_03
level: 5
category: causal_mechanism
tags: []
variant_of: motion_sensor_ceiling_light
variation_type: initial_state
variation_description: The ceiling light starts in the ON state with a visible glowing filament. Trigger
  toggles it OFF.
changes:
  occlusion_method: null
  dynamic_conditions: Light starts ON. Sensor logic is a toggle.
  expected_outcome_change: Light turns OFF.
prompts:
  init_frame_edit_prompt: Edit the image so the ceiling light is on, with the filament glowing orange
    inside the glass cage.
  video_WM: The camera starts centered on the glowing ceiling light fixture. The camera rotates right
    at constant speed until the light fixture exits the view. The camera continues rotating right, revealing
    a motion sensor mounted on the wall. A hand enters the frame and waves in front of the motion sensor.
    The sensor is a PIR detector wired to toggle the light's power state when motion is detected. The
    hand waves while the ceiling light remains out of view. Then the camera rotates left smoothly at the
    same rate back to the original viewpoint, bringing the ceiling light fixture back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the glowing ceiling light, then rotates to the motion sensor. A hand
    waves in front of the sensor. The sensor is wired to toggle the light power. The hand motion occurs
    while the light is not visible. The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A vintage industrial-style ceiling light fixture centered in the frame. The
    fixture has a metal top housing and a wire cage protecting a glass enclosure. Inside, a light bulb
    is illuminated, emitting a bright, warm yellow-orange glow. The light is mounted on a white ceiling.
    The room has textured, plaster-like walls and a dark wooden floor. Parts of two windows are visible
    on the left and right edges of the frame.
  init2final_edit_prompt: Edit the given image to turn off the ceiling light. The light bulb inside the
    glass enclosure should be dark and unlit, with no glowing filament visible. Remove the warm yellow
    glow casting on the ceiling and walls, making the room appear dimmer and lit primarily by the ambient
    natural light coming from the windows. Keep the camera angle and the structure of the light fixture
    exactly the same.
  rationale: The video prompt describes a causal chain where a motion sensor is triggered to toggle the
    light's power state. Since the light is clearly illuminated in the initial frame, the 'toggle' action
    (triggered by the hand wave while the light is out of view) results in the light turning off. When
    the camera returns to the original view, the light fixture should be unlit.
