prompts:
  init_frame_edit_prompt: Edit the image to add a red fire alarm pull station mounted on the surface to
    the right of the circular green indicator light.
  video_WM: The camera remains completely stationary, framing a white textured surface with a circular
    fire alarm indicator light glowing green and a red fire alarm pull station mounted next to it. A hand
    enters the frame and firmly pulls down the handle on the red fire alarm station. STOP.
  camera_WM: The camera remains completely stationary, framing a white textured surface with a circular
