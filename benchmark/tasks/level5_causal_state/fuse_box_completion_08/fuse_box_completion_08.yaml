id: fuse_box_completion_08
level: 5
category: causal_mechanism
tags: []
variant_of: fuse_box_completion
variation_type: repeated_activation
variation_description: Fuse is inserted and then immediately removed.
changes:
  occlusion_method: null
  dynamic_conditions: 'Net action: Fuse removed. Circuit open.'
  expected_outcome_change: Fan remains OFF (stationary).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the stationary industrial floor fan. The camera rotates right
    at constant speed until the fan exits the view. The camera continues rotating, revealing an open industrial
    fuse box mounted on the wall. One circuit is missing its ceramic fuse. A hand enters the frame holding
    a new ceramic fuse, presses it into the gap, and then immediately pulls it back out. The circuit is
    momentarily completed then broken again. The action occurs while the fan remains out of camera view.
    Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the
    industrial fan back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the fan, then rotates to the fuse box. A hand inserts and then immediately
    removes a ceramic fuse. The action occurs while the fan is not visible. The camera then returns to
    the fan. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, circular industrial floor fan is centered in the frame, featuring a
    metal wire cage and three distinct, stationary metal blades. The fan is mounted on a black tubular
    metal stand sitting on a concrete floor. A black power cord runs from the fan motor to a wall outlet
    on the left side of the image. The background consists of a workshop environment with brick walls,
    a workbench with tools, and large windows letting in daylight.
  init2final_edit_prompt: Edit the given image to show the industrial fan blades spinning rapidly. Apply
    strong motion blur to the area inside the fan cage where the blades are, making the individual blades
    indistinguishable and creating the visual effect of a rotating disc. Ensure the fan cage, the stand,
    the power cord, and the surrounding workshop background remain sharp and unchanged.
  rationale: The video prompt describes a causal chain where the camera pans away, a fuse is inserted
    to complete the circuit, and then removed. The insertion of the fuse momentarily powers the fan, causing
    it to spin up. Although the fuse is removed (cutting power), industrial fans have significant mass
    and low friction, meaning the blades will continue to coast (spin due to inertia) for a long time
    after power is lost. Therefore, when the camera returns to the initial view, the fan blades should
    be visible spinning (motion blurred) rather than stationary.
