changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add a round analog thermostat control dial mounted on the
    vertical metal panel to the right of the heating coils. The dial should look like a vintage heater
    control with visible temperature numbers and a setting indicator.
  video_WM: The camera is completely stationary, showing the electric heater with its central heating
    coils and the thermostat dial on the right side. The heating coils are currently dull and inactive.
    A hand enters the frame and rotates the thermostat dial clockwise, turning the setting from 50 degrees
    up to 80 degrees. The hand releases the dial and exits the view. STOP.
  camera_WM: The camera is completely stationary, showing the electric heater with its central heating
    coils and the thermostat dial on the right side. The heating coils are currently dull and inactive.
    A hand enters the frame and rotates the thermostat dial clockwise, turning the setting from 50 degrees
    up to 80 degrees. The hand releases the dial and exits the view. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of an electric space heater. The central area features a winding,
    tubular heating element that is currently dull, dark reddish-brown, and inactive. A wire safety grille
    covers the heating element. To the right is a circular thermostat control dial with markings for 'OFF',
    'LO', 'MED', 'HI', and numbers '70', '80', '90'. The black pointer on the dial is currently positioned
    near the 'OFF' or 'LO' section.
  init2final_edit_prompt: Edit the given image to show the thermostat dial rotated clockwise so that the
    black pointer aligns with the number '80'. Change the appearance of the central heating coils to make
    them glow bright orange and red, indicating they are hot and active. Ensure no hand or person is visible
    in the frame.
  rationale: The video prompt describes a functional interaction where the thermostat is turned up to
    80 degrees. In a functioning heater, raising the thermostat setting above the ambient temperature
    triggers the heating mechanism. Therefore, the physical consequence is that the resistive heating
    coils will heat up and emit visible light (incandescence), glowing bright orange. The dial remains
    in the new position (80) after the hand releases it.
