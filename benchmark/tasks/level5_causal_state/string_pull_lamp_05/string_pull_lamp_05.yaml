id: string_pull_lamp_05
level: 5
category: causal_mechanism
tags: []
variant_of: string_pull_lamp
variation_type: precondition_failure
variation_description: The light bulb is missing entirely from the socket.
changes:
  occlusion_method: null
  dynamic_conditions: 'Broken precondition: No output object (bulb). Trigger action completes but produces
    no light.'
  expected_outcome_change: The socket will remain empty and dark.
prompts:
  init_frame_edit_prompt: Edit the image to remove the glass bulb, leaving only the empty, dark socket
    visible in the fixture.
  video_WM: The camera starts centered on the empty lamp socket. The camera rotates right at constant
    speed until the socket exits the view. The camera continues rotating, revealing the beaded pull-string
    hanging down. A hand enters the frame, grabs the beaded string, and pulls it downward firmly until
    a mechanical click is heard, then releases it. The fixture contains an internal toggle switch mechanism.
    The string pull occurs while the socket remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the empty socket back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the empty socket, then rotates to the pull-string. A hand pulls the
    string downward to engage the internal toggle switch. The string pull occurs while the socket is not
    visible. The camera then returns to the socket. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, low-angle shot of a vintage industrial pendant lamp hanging in a
    workshop. The lamp features a weathered silver metal shade and a wire cage guard protecting the socket.
    The black socket inside the cage is empty, with no light bulb installed. The background is cluttered
    with tools, shelves, and workshop equipment, slightly out of focus.
  init2final_edit_prompt: Edit the given image to ensure the lamp socket remains empty and unlit. Do not
    add a light bulb. Do not add any glow, brightness, or illumination coming from the socket. The wire
    cage, metal shade, and background details should remain visually identical to the original image,
    maintaining the ambient lighting without any new light source.
  rationale: The video prompt describes a camera rotation to a pull-string, a hand pulling the string
    to activate the switch, and a return to the initial view. However, the prompt explicitly states the
    camera starts and ends on an 'empty lamp socket'. Since there is no light bulb in the socket, the
    activation of the switch (the 'click') results in no visual change to the illumination. A correct
    world model must account for the missing component (the bulb) and predict that the light does not
    turn on, despite the switch being toggled. The final frame should therefore be visually identical
    to the initial frame regarding the socket's contents and the lack of light emission.
  questions:
  - id: socket_empty
    question: Is the lamp socket still empty (containing no bulb)?
    answer_type: yes_no
    notes_for_judge: The socket should remain empty as no bulb was inserted.
  - id: lamp_unlit
    question: Is the lamp fixture unlit?
    answer_type: yes_no
    notes_for_judge: Since there is no bulb, the lamp cannot produce light.
  - id: cage_dark
    question: Is the area inside the wire cage dark?
    answer_type: yes_no
    notes_for_judge: Check for absence of glow or illumination inside the cage.
  - id: no_glow
    question: Is the scene free of any glowing light source from the lamp?
    answer_type: yes_no
    notes_for_judge: The image should not show any light emission from the socket.
  - id: shade_reflection
    question: Is the underside of the metal shade free of bright reflections from a light source?
    answer_type: yes_no
    notes_for_judge: If the light were on, the shade would reflect it. It should remain dull.
  - id: bulb_absence
    question: Does the image show the absence of a light bulb in the socket?
    answer_type: yes_no
    notes_for_judge: Verify no bulb has appeared.
  - id: cage_consistency
    question: Is the wire cage guard still present around the socket?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
