id: car_window_switch_01
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: initial_state
variation_description: The window starts fully open. Pressing 'down' (open) results in no change.
changes:
  occlusion_method: null
  dynamic_conditions: 'Initial state is ''window open''. Switch logic: Down=Open. Open+Down=Open.'
  expected_outcome_change: The window remains fully open (no movement).
prompts:
  init_frame_edit_prompt: Edit the image so the driver-side window is fully rolled down, showing a clear
    view of the street outside without any glass obstruction.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully open — the daylight exterior is clearly visible with no glass. The driver leans forward
    toward the door panel; the window opening and exterior are no longer visible. The window control switch
    panel on the door armrest comes into view. A hand presses the lower side of the driver window switch
    downward. The window switch is part of the car's electrical system and operates only when the ignition
    is on; the direction pressed determines the behavior of the window motor. The driver leans back to
    the upright seated position. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window fully
    open. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch on the door armrest. A hand presses the lower side of the switch downward. The window switch
    is part of the electrical system and operates only with ignition on; the direction pressed determines
    the window motor behavior. The action occurs while the window opening is not visible. The driver leans
    back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A first-person view from the driver's seat of a car. The steering wheel is centered
    with the driver's left hand resting on it. The dashboard is illuminated with red indicators. The driver's
    side window is visible and is currently closed (up), evidenced by the clear reflection of the dashboard
    air vent and interior trim on the glass surface. Through the window, a street scene with buildings,
    parked cars, and trees is visible. A side mirror is visible attached to the door.
  init2final_edit_prompt: Edit the given image to make the driver's side window fully open. Remove the
    window glass pane completely, ensuring that the reflection of the dashboard air vent and interior
    trim is no longer visible on the window area. The view of the street and exterior through the window
    frame should be clear, sharp, and unobstructed by any glass surface or reflections. Keep the steering
    wheel, dashboard, and side mirror unchanged.
  rationale: The initial frame visually shows the window in a closed state, indicated by the reflection
    of the interior air vent on the glass. The prompt describes the driver pressing the window switch
    downward. In a car, pressing the window switch down activates the motor to lower (open) the window.
    Although the prompt text preamble states the window is 'fully open', the visual evidence of the start
    frame combined with the specific 'press down' action implies a transition to an open state is the
    intended outcome. The driver leans back to the original position, so the final view is identical to
    the start but with the window lowered.
  questions:
  - id: window_open_check
    question: Is the driver's side window fully open in the final frame?
    answer_type: yes_no
    notes_for_judge: The window should be down, meaning no glass is visible.
  - id: reflection_removal
    question: Are the reflections of the dashboard vent on the window glass gone?
    answer_type: yes_no
    notes_for_judge: In the initial frame, there is a reflection of the AC vent on the glass. This should
      be absent if the window is open.
  - id: glass_obstruction
    question: Is the view of the street through the window frame unobstructed by glass?
    answer_type: yes_no
    notes_for_judge: The view should be clear, without the sheen or distortion of a window pane.
  - id: state_change_glass
    question: Has the window glass been lowered into the door panel?
    answer_type: yes_no
    notes_for_judge: Functionally, the glass should no longer be in the frame.
  - id: steering_wheel_consistency
    question: Is the steering wheel still in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: mirror_consistency
    question: Is the side mirror still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
