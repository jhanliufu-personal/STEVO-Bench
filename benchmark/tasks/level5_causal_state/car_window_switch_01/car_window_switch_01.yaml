id: car_window_switch_01
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: initial_state
variation_description: Window starts fully open; action changed to 'pull up' to close it
changes:
  occlusion_method: null
  dynamic_conditions: Window starts open. Action is pulling switch UP (closing).
  expected_outcome_change: Window transitions from Open to Closed (Opposite of original outcome)
prompts:
  init_frame_edit_prompt: Edit the image to show the driver-side window fully rolled down (open), with
    the exterior clearly visible through the opening. The window glass and all stickers on it are no longer
    visible — remove them completely.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully open — the exterior is clearly visible with no glass obstruction. The driver leans
    forward toward the door panel; the window opening is no longer visible. The window control switch
    panel on the door armrest comes into view. A hand hooks fingers under the driver window switch and
    pulls it upward. The window switch is part of the car's electrical system; the direction of actuation
    determines the motor behavior. The driver leans back to the upright seated position. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window fully
    open. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch on the door armrest. A hand hooks fingers under the switch and pulls it upward. The action
    occurs while the window opening is not visible. The driver leans back to the original seated position.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Driver's point-of-view shot from inside a car. A black aftermarket steering
    wheel with a yellow centering stripe is prominent. The dashboard instrument cluster is illuminated
    with various gauge lights. The driver's left arm is visible. To the left, the driver's side door panel
    (beige and black) is visible. The driver's side window is fully open, meaning there is no glass visible
    in the window frame; the side mirror and the exterior dirt road and trees are seen clearly through
    the open air.
  init2final_edit_prompt: Edit the given image to show the driver's side window in the raised (closed)
    position. Fill the previously open window frame on the left with a transparent glass texture. The
    glass should show realistic surface reflections and a slight tint typical of a car window, distinguishing
    it from open air. Ensure the exterior scenery and side mirror remain visible but appear as though
    viewed through the glass pane. Keep the steering wheel, dashboard, and driver's arm in their original
    positions.
  rationale: The video prompt describes the driver pulling the window control switch upward. In standard
    automotive design, pulling the switch up activates the motor to raise the window glass. The driver
    then returns to the initial upright seating position. Consequently, the final frame must show the
    same camera angle as the initial frame, but with the functional state of the window changed from 'fully
    open' to 'closed' (glass raised).
