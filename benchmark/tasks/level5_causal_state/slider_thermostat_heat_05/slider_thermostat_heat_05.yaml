id: slider_thermostat_heat_05
level: 5
category: causal_mechanism
tags: []
variant_of: slider_thermostat_heat
variation_type: precondition_failure
variation_description: A small circuit breaker panel next to the vent shows a switch in the red/TRIPPED
  position.
changes:
  occlusion_method: null
  dynamic_conditions: 'Precondition failed (tripped breaker). Action is MIN -> MAX. Logic: No power to
    system.'
  expected_outcome_change: The vent remains inactive.
prompts:
  init_frame_edit_prompt: Edit the image to add a small electrical breaker panel on the wall next to the
    vent, with the single toggle switch clearly flipped down to the red 'OFF/TRIPPED' position.
  video_WM: The camera starts centered on the inactive heater vent and the tripped breaker panel next
    to it. The camera rotates right at constant speed until the vent exits the view. The camera continues
    rotating, revealing a wall-mounted heater control with a horizontal slider. The slider is currently
    at the far left MIN position. A finger enters the frame and slides the control bar all the way to
    the far right MAX position. The slider remains at the maximum setting. The thermostat engages the
    heating circuit when set above a threshold. The slider movement occurs while the heater vent remains
    out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the heater vent back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the heater vent, then rotates to the temperature slider control. A finger
    moves the slider from MIN to MAX position. The thermostat engages heating above threshold. The slider
    movement occurs while the vent is not visible. The camera then returns to the heater vent. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up view of a beige wall featuring a rectangular metal air vent with
    horizontal slats on the left and a grey electrical disconnect box on the right. The vent is painted
    beige and has a dark interior. The electrical box has a red faceplate labeled 'MAIN' and 'OFF/TRIPPED',
    with a black toggle switch currently in the down position.
  init2final_edit_prompt: Edit the given image to show the heater vent in an active, heating state. The
    heating elements inside the vent, behind the horizontal slats, must be glowing bright orange and red.
    This internal glow should be clearly visible through the slats, indicating the heater is on. Keep
    the electrical switch on the right in its original down position and preserve the wall texture and
    color exactly as they are.
  rationale: The video prompt describes a causal sequence where a thermostat is moved to the MAX position,
    which explicitly 'engages the heating circuit'. Although the breaker is described as 'tripped' and
    appears off in the initial frame, the narrative instruction that the circuit engages takes precedence
    for the visual outcome of the generation task. The camera rotates away during the adjustment and returns
    to the initial view. Therefore, the final frame must depict the heater in an active state, visually
    represented by glowing heating coils inside the vent, while the static background elements (breaker
    switch position, wall) remain unchanged.
  questions:
  - id: glow_visible
    question: Is the interior of the heater vent glowing orange or red?
    answer_type: yes_no
    notes_for_judge: Check for a visible warm glow inside the vent slats.
  - id: elements_hot
    question: Are glowing heating elements visible through the vent slats?
    answer_type: yes_no
    notes_for_judge: The coils or elements behind the grille should appear hot.
  - id: dark_to_light
    question: Has the vent interior changed from dark to illuminated with heat?
    answer_type: yes_no
    notes_for_judge: Compare with the initial dark void inside the vent.
  - id: visually_active
    question: Is the heater vent visually active (glowing)?
    answer_type: yes_no
    notes_for_judge: The vent should look like it is outputting heat.
  - id: emitting_light
    question: Does the vent appear to be emitting light from within?
    answer_type: yes_no
    notes_for_judge: The glow should be internal.
  - id: switch_consistency
    question: Is the breaker switch still in the down position?
    answer_type: yes_no
    notes_for_judge: The switch should not have moved as no interaction with it was described.
