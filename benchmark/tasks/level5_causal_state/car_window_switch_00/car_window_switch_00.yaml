id: car_window_switch_00
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add a clearly visible window control switch panel on the driver's
    door armrest.
  video_WM: Stationary view from the driver's seat. The closed driver-side window and the window control
    switch panel on the door armrest are both visible. A hand reaches to the door panel and presses the
    driver window switch downward. STOP.
  camera_WM: Stationary view from the driver's seat. The closed driver-side window and the window control
    switch panel on the door armrest are both visible. A hand reaches to the door panel and presses the
    driver window switch downward. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: View from the driver's seat of a car looking out the driver-side window. The
    window is closed, with a 'Lemons Rally' sticker near the bottom and a 'SPEED DEMON' sticker at the
    top left. Reflections are visible on the glass. A suede steering wheel with a yellow center marker
    is in the foreground. The driver's left hand is holding the steering wheel. The door panel is beige
    and black, featuring a window control switch panel on the armrest. Outside, a dirt road and trees
    are visible.
  init2final_edit_prompt: Edit the given image to show the driver's side window rolled down. The window
    glass should be retracted into the door, causing the 'Lemons Rally' and 'SPEED DEMON' stickers to
    disappear or move significantly lower. Remove the glass reflections from the window opening to show
    a clear view of the outside. Position the driver's left hand on the window switch panel on the door
    armrest, pressing the switch.
  rationale: 'The prompt describes a causal action: pressing the window switch downward. In a car, this
    function lowers the window glass. Therefore, the primary state change is the window opening. This
    involves the glass pane moving down, which carries the attached stickers (''Lemons Rally'' and ''SPEED
    DEMON'') out of the frame or to a lower position. The hand must move from the steering wheel to the
    door panel to perform this action.'
  questions:
  - id: window_state_open
    question: Is the driver's side window rolled down compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the glass is lower or gone.
  - id: sticker_lemons_moved
    question: Is the 'Lemons Rally' sticker missing or significantly lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The sticker is attached to the glass, so it must move down with the window.
  - id: sticker_speed_moved
    question: Is the 'SPEED DEMON' sticker missing or significantly lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The sticker is attached to the glass, so it must move down with the window.
  - id: hand_position_switch
    question: Is the driver's hand positioned on or near the window switch panel on the door armrest?
    answer_type: yes_no
    notes_for_judge: The prompt describes the hand reaching for the switch.
  - id: hand_moved_from_wheel
    question: Has the driver's left hand moved away from its initial position on the steering wheel?
    answer_type: yes_no
    notes_for_judge: The hand must leave the wheel to reach the door panel.
  - id: glass_reflection_cleared
    question: Is the view through the window frame clearer and less reflective than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Open windows have no glass reflections.
  - id: steering_wheel_stationary
    question: Is the steering wheel in the same position and orientation as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check; the car is driving straight or stationary, wheel shouldn't
      turn wildly.
  - id: outside_scenery_consistent
    question: Is the outside scenery (road and trees) consistent with the initial view?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
