id: car_window_switch
level: 5
category: causal_mechanism
mechanism_type: switch_motor_control_logic
tags: []
prompts:
  image_gen_prompt: A first-person driver's POV inside a Suzuki with an aftermarket black steering wheel
    with a yellow tape marker at the top center. The instrument cluster behind the steering wheel is illuminated
    with orange and red warning lights — the car is running. Car keys hang from the ignition on the right
    side of the steering column. The driver's left arm and sleeve are visible on the left edge of the
    frame, resting on the wheel. The driver-side window is fully raised and closed. Two stickers are affixed
    to the inside of the window glass:a "SPEED DEMON" sticker near the top and a large "Lemons Rally"
    sticker across the middle of the glass. A side mirror is visible through the window glass. The window
    control switch panel is on the door armrest to the left. Through the windshield, a rural road lined
    with trees extends ahead under an overcast sky.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully closed — the daylight exterior is visible through the glass. The driver leans forward
    toward the door panel; the side windows and exterior are no longer visible. The window control switch
    panel on the door armrest comes into view. A hand presses the lower side of the driver window switch
    downward. The window switch is part of the car's electrical system and operates only when the ignition
    is on; the direction pressed determines the behavior of the window motor. The driver leans back to
    the upright seated position. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window fully
    closed — daylight exterior visible through the glass. The driver leans forward, camera pitches down
    and moves forward, revealing the window control switch on the door armrest. A hand presses the lower
    side of the switch downward. The window switch is part of the electrical system and operates only
    with ignition on; the direction pressed determines the window motor behavior. The action occurs while
    the windows are not visible. The driver leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: s-3, down-10, w-10, s-10, up-10
evaluation:
  init_frame_description: A view from the driver's seat inside a car. A black steering wheel with a yellow
    center marker and a Suzuki logo is in the center. The dashboard instrument cluster is illuminated
    with orange lights, indicating the ignition is on. To the left, the driver's side door panel is visible.
    The driver's side window is fully closed, with a white 'Lemons Rally' text sticker applied to the
    glass. Through the window, a dirt road and trees are visible, slightly obscured by the glass texture
    and reflections. A driver's arm is visible on the left side.
  init2final_edit_prompt: Edit the given image to show the driver-side window rolled down. Remove the
    window glass and the 'Lemons Rally' sticker from the window frame, leaving a clear, unobstructed view
    of the outside scenery. Keep the car interior, dashboard lights, and steering wheel exactly as they
    are.
  rationale: The video prompt describes the driver leaning forward to press the window switch downward,
    which activates the window motor to lower the glass. The dashboard lights in the initial frame confirm
    the ignition is on, allowing the electrical system to function. After the action, the driver returns
    to the original upright position. Therefore, the final frame should be identical to the initial frame
    in terms of viewpoint and interior lighting, but the window glass (and the sticker attached to it)
    should be retracted into the door, leaving the window opening clear.
  questions:
  - id: window_sticker_visible
    question: Is the 'Lemons Rally' sticker absent from the window frame?
    answer_type: yes_no
    notes_for_judge: The sticker is on the glass; if the window rolls down, the sticker moves down into
      the door panel and should no longer be visible.
  - id: window_open_state
    question: Is the driver-side window glass rolled down?
    answer_type: yes_no
    notes_for_judge: The glass should be missing or significantly lowered compared to the initial frame.
  - id: view_clarity
    question: Is the view of the outside scenery clearer and free of glass reflections?
    answer_type: yes_no
    notes_for_judge: With the window open, the glass texture, dirt, and reflections should be gone.
  - id: dashboard_lights
    question: Are the dashboard instrument lights still illuminated?
    answer_type: yes_no
    notes_for_judge: The ignition remains on throughout the sequence.
  - id: steering_wheel_pos
    question: Is the steering wheel in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The driver returns to the initial seating position, so the static car parts should
      align.
  - id: glass_removed
    question: Is the window opening unobstructed by glass?
    answer_type: yes_no
    notes_for_judge: Checks if the physical barrier of the window has been removed.
