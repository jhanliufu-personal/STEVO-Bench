id: car_window_switch
level: 5
category: causal_mechanism
mechanism_type: switch_motor_control_logic
prompts:
  image_gen_prompt: A car door window is shown from the exterior side view. The window glass is fully
    raised in the closed position. The camera view is centered on the car window from outside.
  video_WM: The camera starts centered on the car door window from the exterior, showing the window fully
    raised. The camera rotates right at constant speed until the exterior window view exits. The camera
    continues rotating, revealing the car interior door panel with the window control switch on the armrest.
    A hand enters the frame and presses the down side of the window switch. The switch controls the window
    motor which raises or lowers the glass depending on which side is pressed. The switch press occurs
    while the exterior window remains out of camera view. Then the camera rotates left smoothly at the
    same rate back to the original viewpoint, bringing the exterior window back into center view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The camera starts on the exterior window fully raised, then rotates to the interior window
    switch on the door panel. A hand presses the down switch. The switch controls the window motor that
    moves the glass. The switch press occurs while the exterior window is not visible. The camera then
    returns to the exterior window. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
