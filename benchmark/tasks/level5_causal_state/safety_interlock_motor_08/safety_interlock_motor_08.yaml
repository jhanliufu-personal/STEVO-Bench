id: safety_interlock_motor_08
level: 5
category: causal_mechanism
tags: []
variant_of: safety_interlock_motor
variation_type: repeated_activation
variation_description: Operator presses Start then immediately presses Stop.
changes:
  occlusion_method: null
  dynamic_conditions: Start followed by Stop results in net zero change (stationary).
  expected_outcome_change: The motor shaft remains stationary.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the stationary motor drive shaft. The camera rotates right at
    constant speed until the shaft exits the view. The camera continues rotating, revealing a control
    panel with a green START button and a red STOP button. A finger presses the green START button, then
    immediately moves to and presses the red STOP button. The actions occur while the motor shaft remains
    out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the motor drive shaft back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scene features a stationary motor drive shaft and a control panel with START and STOP
    buttons. A finger presses START then STOP while the shaft is out of view. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot of a large industrial electric motor painted green.
    The motor has a prominent, thick cylindrical metal drive shaft extending towards the left side of
    the frame. The shaft surface is weathered, showing distinct patterns of rust, grease, and discoloration.
    The background shows a blurred factory interior with concrete floors, pillars, and other industrial
    machinery.
  init2final_edit_prompt: Edit the given image to show the cylindrical metal drive shaft rotated to a
    different angle. The specific rust patterns, grease marks, and surface textures on the shaft must
    be shifted or changed to indicate that the shaft has turned around its axis. Keep the green motor
    housing, the mounting base, and the background factory environment exactly the same as the original.
  rationale: The video prompt describes a sequence where the camera pans away, a START button is pressed
    followed immediately by a STOP button, and then the camera returns. Pressing the START button energizes
    the motor, causing the shaft to begin rotating. Pressing STOP immediately afterwards cuts the power,
    but the motor will have moved from its initial position (a 'jog' operation). When the camera returns
    to the initial view, the motor shaft will be in a different rotational position (phase) than it was
    initially. Therefore, the visual texture landmarks (rust, grease) on the shaft must be shifted or
    different, providing evidence of the mechanical action.
  questions:
  - id: shaft_rotation_change
    question: Are the rust patterns and surface marks on the drive shaft in a different position compared
      to the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the specific texture details on the cylindrical shaft. They should be shifted
      or changed, indicating rotation.
  - id: shaft_orientation_diff
    question: Does the drive shaft appear to have rotated around its axis relative to the starting image?
    answer_type: yes_no
    notes_for_judge: The shaft itself is the same object, but its rotational orientation (roll) should
      be different.
  - id: shaft_displacement
    question: Is the visual texture of the motor shaft different from the initial frame, providing evidence
      that the motor was activated?
    answer_type: yes_no
    notes_for_judge: The key is evidence of activation (movement), manifested as a change in the visible
      surface of the rotating part.
  - id: motor_housing_consistency
    question: Is the green motor housing in the same position and orientation as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The stationary parts of the motor should not move.
  - id: background_consistency
    question: Is the background factory environment unchanged?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original view; the background should be identical.
  - id: shaft_presence
    question: Is the drive shaft visible in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera pans back to the original view, so the shaft must be visible again.
