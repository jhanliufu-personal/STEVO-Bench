id: lightbulb_and_switch_01
level: 5
category: causal_reasoning
tags: []
variant_of: lightbulb_and_switch
variation_type: initial_state
variation_description: The lightbulb starts in the ON state, so toggling the switch turns it OFF.
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is ON (switch UP). Trigger action toggles switch to DOWN.
  expected_outcome_change: Light turns OFF (original was ON).
prompts:
  init_frame_edit_prompt: Edit the image so the lightbulb is illuminated and glowing brightly.
  video_WM: Single continuous shot, no cuts, no zoom. The scene contains one functioning ceiling light
    that is currently illuminated (ON). The switch is in the UP position. Camera starts centered on the
    glowing ceiling light. The camera smoothly moves left at constant speed until the ceiling light exits
    the frame to the right. While the light is out of view, a human hand toggles the wall switch. The
    camera continues moving left for several seconds. Then the camera moves right at the same constant
    speed back to the original viewpoint, bringing the ceiling light back into view.
  camera_WM: The scene contains one functioning ceiling light that is currently illuminated (ON). The
    switch is in the UP position. A human hand toggles the wall switch. STOP.
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  Genie: null
evaluation:
  init_frame_description: A low-angle interior shot of a room with textured off-white walls and a wooden
    floor. A single ceiling light fixture is mounted in the center of the ceiling. The light bulb is currently
    illuminated, glowing brightly with a warm yellowish-white light that creates a soft gradient on the
    surrounding ceiling.
  init2final_edit_prompt: Edit the given image to turn the ceiling light off. The light bulb should appear
    unlit, dull, and dark grey or white, with no glow or illumination emanating from it. The surrounding
    ceiling and walls should appear dimmer, reflecting the absence of the primary light source.
  rationale: The initial state shows the light turned ON. The prompt describes a camera movement that
    occludes the light, followed by a 'toggle' action on the switch. Toggling a switch that is currently
    ON causes it to turn OFF. Therefore, when the camera returns to the original viewpoint, the functional
    state of the light must be OFF (unlit).
