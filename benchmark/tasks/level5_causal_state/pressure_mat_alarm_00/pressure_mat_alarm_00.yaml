camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a wall-mounted industrial control system. Two
    gray metal junction boxes are connected by a horizontal conduit. The left box features a large, glowing
    green indicator light with a label above it reading 'SYSTEM ARMED' and a label below reading 'NORMAL'.
    The right box features a large red mushroom-head push-button switch. The background is a textured
    beige wall, with a window frame visible on the far left edge.
  init2final_edit_prompt: Edit the given image to show the industrial system in a deactivated state. Turn
    off the glowing green indicator light on the left box so that the green lens appears dark and unlit.
    Keep the red button and the rest of the scene unchanged.
  rationale: The initial state shows the system is 'ARMED' and 'NORMAL', indicated by the glowing green
    light. The action described is pressing the red button, which in industrial contexts is universally
    an Emergency Stop or Disarm trigger. Activating this switch will functionally transition the system
    out of the 'ARMED' state. Physically, the green indicator is a colored plastic lens, so it cannot
    change color to red; the only valid visual state change is for the light to extinguish (turn off).
