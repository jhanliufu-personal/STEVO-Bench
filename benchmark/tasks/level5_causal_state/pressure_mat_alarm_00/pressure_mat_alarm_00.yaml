    on the wall setup. STOP.
  camera_WM: The camera is completely stationary, showing a wall-mounted industrial alarm system featuring
    a glowing green indicator light labeled 'SYSTEM ARMED' and a red push-button switch mounted next to
    it. A hand enters the frame, reaches out, and firmly presses the red button. The camera remains fixed
