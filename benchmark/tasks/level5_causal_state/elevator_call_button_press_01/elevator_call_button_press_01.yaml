id: elevator_call_button_press_01
level: 5
category: causal_mechanism
tags: []
variant_of: elevator_call_button_press
variation_type: initial_state
variation_description: The Up button starts in the LIT state. The action is to press it, which cancels
  the call (toggle logic).
changes:
  occlusion_method: null
  dynamic_conditions: 'The button logic is reversed for this variant: pressing an illuminated button cancels
    the request.'
  expected_outcome_change: The Up button light should turn OFF.
prompts:
  init_frame_edit_prompt: Edit the image so the Up arrow button is illuminated with a bright orange glow,
    matching the style of a lit elevator button.
  video_WM: The camera starts centered on the elevator call button panel, where the Up button is currently
    illuminated. The camera rotates right at constant speed until the button panel exits the view. The
    camera continues rotating right, showing the wall and surroundings. While the button is out of view,
    a hand reaches to the button location and presses the Up call button. In this system, pressing an
    already illuminated button sends a cancellation signal to the controller. The controller receives
    the signal and cuts power to the button's internal light circuit. The button press occurs while the
    button panel remains out of camera view. Then the camera rotates left smoothly at the same rate back
    to the original viewpoint, bringing the button panel back into center view. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The camera starts on the illuminated Up button. While out of view, the button is pressed.
    This system allows call cancellation by pressing the button again. The controller cuts power to the
    light circuit upon receiving the signal. The button press occurs while the button is not visible.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A close-up view of a brushed metal elevator control panel mounted on a rough,
    porous concrete wall. The panel contains two circular buttons arranged vertically. The top button
    displays an upward-pointing arrow, and the bottom button displays a downward-pointing arrow. Both
    buttons are currently illuminated with a bright orange internal light. The metal plate has visible
    scratches and wear marks.
  init2final_edit_prompt: Edit the given image to turn off the internal light of the top 'Up' arrow button,
    so the arrow appears dark or unlit rather than glowing orange. Keep the bottom 'Down' arrow button
    illuminated with its original orange glow. Maintain the texture of the concrete wall and the scratches
    on the metal plate exactly as they are.
  rationale: 'The video prompt describes a specific causal logic: pressing an already illuminated button
    cancels the call and cuts power to the light. The camera rotates away, the button is pressed (triggering
    the cancellation), and the camera rotates back. Therefore, in the final frame, the top button must
    be unlit (showing the causal result of the hidden action), while the bottom button and surrounding
    environment remain unchanged.'
  questions:
  - id: q1_primary_state
    question: Is the top 'Up' arrow button unlit in the final frame?
    answer_type: yes_no
    notes_for_judge: The top button should no longer be glowing orange.
  - id: q2_primary_state
    question: Has the orange glow been removed from the top button?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame where it was glowing.
  - id: q3_primary_state
    question: Is the top button significantly darker than the bottom button?
    answer_type: yes_no
    notes_for_judge: The bottom button should remain lit, making the unlit top button appear darker by
      comparison.
  - id: q4_consistency
    question: Is the bottom 'Down' arrow button still illuminated?
    answer_type: yes_no
    notes_for_judge: The action only affected the top button; the bottom one should stay lit.
  - id: q5_consistency
    question: Are the scratches on the metal plate identical to the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returned to the exact same position; static details should match.
  - id: q6_consistency
    question: Is the concrete wall texture unchanged?
    answer_type: yes_no
    notes_for_judge: Background details should be preserved.
