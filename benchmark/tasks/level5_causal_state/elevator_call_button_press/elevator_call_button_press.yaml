id: elevator_call_button_press
level: 5
category: causal_mechanism
mechanism_type: button_signal_indicator
tags: []
prompts:
  image_gen_prompt: An elevator call button panel is mounted on a wall showing up and down arrow buttons. The up arrow button is currently unlit and dark. The camera view is centered on the button panel.
  video_WM: The camera starts centered on the unlit elevator call button panel. The camera rotates right at constant speed until the button panel exits the view. The camera continues rotating right, showing the wall and surroundings. While the button is out of view, a hand reaches to the button location and presses the up call button. Elevator call buttons contain a momentary switch that closes when pressed. Behind the button face is a small LED or incandescent bulb. The button is wired to the elevator controller which receives the call signal. The controller can send power back to the button's internal light circuit to indicate the call has been registered. The light circuit and switch are independent - the light is controlled by the elevator system, not directly by the button press. The button press occurs while the button panel remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the button panel back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the unlit call button, then rotates away. While out of view, the button is pressed. The button contains a switch that sends a signal to the elevator controller. The controller can send power to the button's internal light circuit. The light circuit is controlled by the elevator system. The button press occurs while the button is not visible. The camera then returns to the button panel. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
