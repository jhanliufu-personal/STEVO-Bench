prompts:
  init_frame_edit_prompt: Edit the image to add a stainless steel push button on the side of the fountain
    body, clearly visible within the frame.
  video_WM: The camera is completely stationary, framing both the drinking fountain spout and the push
    button on the side. A hand enters the view and firmly presses the push button. STOP.
  camera_WM: The camera is completely stationary, framing both the drinking fountain spout and the push
    button on the side. A hand enters the view and firmly presses the push button. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a stainless steel drinking fountain. The frame features a
    circular basin with a curved metal spout (bubbler) in the center and a large circular push button
    mounted on the vertical side of the housing. The background is a tiled wall with a grid pattern. The
    fountain is currently inactive, meaning no water is flowing from the spout.
  init2final_edit_prompt: Edit the given image to show a human hand firmly pressing the circular push
    button on the side of the fountain. Render a clear stream of water arcing out of the metal spout and
    falling into the basin, indicating the fountain is active. Ensure the button appears depressed or
    interacted with by the hand.
  rationale: 'The video prompt specifies a causal action: a hand pressing the activation button. In a
    functional drinking fountain, this mechanical input directly causes the valve to open and water to
    flow. Therefore, the final state must depict the immediate functional consequence of the action: the
    button being pressed and a stream of water flowing from the spout.'
