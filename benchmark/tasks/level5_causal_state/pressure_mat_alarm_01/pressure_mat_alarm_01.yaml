id: pressure_mat_alarm_01
level: 5
category: causal_mechanism
tags: []
variant_of: pressure_mat_alarm
variation_type: initial_state
variation_description: Indicator starts in RED (triggered) state; stepping resets it to Green.
changes:
  occlusion_method: null
  dynamic_conditions: System starts in alarm state (Red). Trigger action acts as a reset/acknowledgment.
  expected_outcome_change: Final state is Green (Normal), opposite of original outcome.
prompts:
  init_frame_edit_prompt: Edit the indicator light to be glowing bright RED instead of green.
  video_WM: The camera starts centered on the alarm indicator light showing red (triggered state). The
    camera rotates right at constant speed until the indicator exits the view. The camera continues rotating,
    revealing a rectangular pressure-sensitive floor mat positioned in the entryway. A foot enters the
    frame and steps onto the pressure mat. The mat acts as a reset trigger for the alarm circuit. When
    pressure is applied, the sensor signals the alarm indicator to reset. The stepping action occurs while
    the alarm indicator remains out of camera view. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the alarm indicator back into center view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The scene features a red alarm indicator light and a pressure-sensitive floor mat. A foot
    steps onto the mat. The mat acts as a reset trigger for the alarm circuit. When pressure is applied,
    the sensor signals the alarm indicator to reset. The step occurs while the alarm indicator is not
    visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up view of a gray, industrial metal electrical box mounted on a textured
    beige wall. A metal conduit runs vertically through the top and bottom of the box. The box features
    a central circular indicator light that is currently illuminated with a bright red glow. Above the
    light is a red label reading 'SYSTEM ARMED', and below is a black label reading 'NORMAL'. A window
    frame is visible on the left edge of the image.
  init2final_edit_prompt: Edit the given image to turn off the central red indicator light on the metal
    box. The circular lens should appear dark, unlit, and dull, removing the red glow and illumination.
    Keep the metal box, the labels 'SYSTEM ARMED' and 'NORMAL', the conduit, the wall texture, and the
    window frame exactly as they are. The only change should be the state of the light transitioning from
    on to off.
  rationale: The video prompt establishes a functional relationship where a pressure mat acts as a reset
    switch for the alarm system. The sequence begins with the alarm in a triggered state (red light on).
    During the camera rotation and occlusion, the reset mechanism is activated by a foot stepping on the
    mat. Upon returning to the initial view, the causal effect of this action is that the alarm system
    has been reset, meaning the indicator light should no longer be illuminated.
  questions:
  - id: light_state_off
    question: Is the red indicator light on the metal box now turned off?
    answer_type: yes_no
    notes_for_judge: The light should appear dark or unlit, contrasting with the glowing red state in
      the initial frame.
  - id: lens_appearance
    question: Does the central circular lens appear dark instead of glowing?
    answer_type: yes_no
    notes_for_judge: Check for the absence of the bright red bloom/glow seen initially.
  - id: alarm_reset_visual
    question: Has the illumination of the 'SYSTEM ARMED' indicator ceased?
    answer_type: yes_no
    notes_for_judge: The functional result of the reset action is the light turning off.
  - id: glow_absence
    question: Is the area around the central bulb free of red light reflection or glow?
    answer_type: yes_no
    notes_for_judge: The surrounding metal should not reflect red light if the bulb is off.
  - id: box_integrity
    question: Is the metal electrical box still present and in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: conduit_consistency
    question: Are the vertical conduits still connected to the top and bottom of the box?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
