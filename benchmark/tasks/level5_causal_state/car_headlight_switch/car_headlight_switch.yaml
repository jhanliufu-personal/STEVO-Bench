id: car_headlight_switch
level: 5
category: causal_mechanism
mechanism_type: switch_circuit_logic
prompts:
  image_gen_prompt: A car's front headlights are visible from the exterior. Both headlights are currently
    off and dark. The camera view is centered on the front headlights from outside the car.
  video_WM: The camera starts centered on the car's front headlights from the exterior, both headlights
    are off. The camera rotates right at constant speed until the headlights exit the view. The camera
    continues rotating, revealing the car interior dashboard with the headlight control switch on the
    left side of the steering column. A hand enters the frame and rotates the headlight switch from the
    OFF position to the ON position. The switch controls the electrical circuit that supplies power to
    the front headlight bulbs. The switch rotation occurs while the exterior headlights remain out of
    camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the exterior headlights back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the exterior headlights showing them off, then rotates to the interior
    dashboard switch. A hand turns the headlight switch to ON. The switch controls the headlight circuit.
    The switch turn occurs while the exterior lights are not visible. The camera then returns to the exterior
    headlights. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
