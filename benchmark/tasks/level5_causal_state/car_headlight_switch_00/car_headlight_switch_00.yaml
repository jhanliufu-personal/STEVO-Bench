id: car_headlight_switch_00
level: 5
category: causal_mechanism
tags: []
variant_of: car_headlight_switch
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to make the headlight control switch on the left steering column
    stalk clearly visible and illuminated, ensuring the rotating knob is distinct against the dark background.
  video_WM: Stationary view from the driver's seat at night. The dashboard is illuminated, and the view
    through the windshield is completely dark. The headlight control switch on the left steering column
    stalk is clearly visible. A hand reaches for the stalk and rotates the switch to the on position.
    STOP.
  camera_WM: Stationary view from the driver's seat at night. The dashboard is illuminated, and the view
    through the windshield is completely dark. The headlight control switch on the left steering column
    stalk is clearly visible. A hand reaches for the stalk and rotates the switch to the on position.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A view from the driver's seat of a car at night. The interior is dimly lit,
    featuring a steering wheel with a Toyota logo in the center. The dashboard instrument cluster is illuminated
    with amber light, showing a speedometer and tachometer. To the left of the steering wheel, a control
    stalk for lights and turn signals is visible. To the right, a wiper control stalk is visible. The
    side mirror is visible on the far left. The view through the windshield is completely black, indicating
    total darkness outside.
  init2final_edit_prompt: Edit the given image to show the car's headlights turned on. The view through
    the windshield, previously pitch black, must now be illuminated by bright headlight beams casting
    light on the ground or road ahead. The dashboard instrument cluster should remain illuminated in amber.
  rationale: The user's action of rotating the switch to the 'on' position triggers the car's headlight
    system. The primary functional consequence of this action is the illumination of the environment in
    front of the car. Therefore, the final frame must show the transition from a pitch-black windshield
    view to one where headlight beams illuminate the space ahead. The interior state (dashboard lights)
    remains largely consistent, though the switch position itself would technically change.
