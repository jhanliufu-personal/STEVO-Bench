id: automatic_toilet_flush_04
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_toilet_flush
variation_type: precondition_failure
variation_description: The water supply valve is visibly closed, preventing the flush.
changes:
  occlusion_method: null
  dynamic_conditions: The angle stop valve is closed (perpendicular). The sensor triggers the solenoid,
    but no water flows.
  expected_outcome_change: The water in the bowl remains stable (no flush) because the supply is cut.
prompts:
  init_frame_edit_prompt: Edit the image to show a metal water supply valve on the wall pipe turned perpendicular
    to the pipe, indicating it is in the CLOSED position.
  video_WM: The camera starts centered on the toilet bowl with stable water level. The camera rotates
    right at constant speed until the bowl exits the view. The camera continues rotating, revealing the
    automatic flush sensor and the closed water supply valve on the wall. A hand enters the frame and
    waves in front of the sensor. The sensor detects the hand and attempts to trigger the valve. The hand
    wave occurs while the toilet bowl remains out of camera view. Then the camera rotates left smoothly
    back to the original viewpoint, bringing the toilet bowl back into center view. STOP.
  camera_WM: The scene features a toilet bowl and a flush sensor with a closed water supply valve. A hand
    waves in front of the sensor. The action occurs while the bowl is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A high-angle, close-up view of a white ceramic toilet bowl. The toilet seat
    is white and in the down position; the lid is open. The water inside the bowl is clear, calm, and
    still, with some mineral stains visible on the porcelain bottom. A beige, textured rug is partially
    visible on the tiled floor at the bottom of the frame. To the right, a chrome water supply pipe and
    angle stop valve project from the tiled wall.
  init2final_edit_prompt: Edit the given image to show the water in the toilet bowl in an agitated, swirling
    state, as if the toilet is currently flushing. Add ripples, bubbles, and motion blur to the water
    surface to indicate strong fluid movement. The water should no longer look calm or still. Keep the
    toilet seat, rug, and wall tiles unchanged.
  rationale: The video prompt describes a sequence where the camera rotates away, a hand triggers the
    automatic flush sensor, and the camera rotates back. The causal action (triggering the sensor) initiates
    the flushing mechanism. Even if the 'closed water supply valve' implies the mains water is shut off,
    a standard residential toilet (as pictured with a tank) holds enough water for one flush. Therefore,
    the triggering event causes the tank water to release into the bowl. When the camera returns to the
    initial view, the water in the bowl should be visually agitated, swirling, or draining, rather than
    returning to the static calm state seen initially.
  questions:
  - id: q1
    question: Is the water in the toilet bowl agitated or swirling?
    answer_type: yes_no
    notes_for_judge: Look for evidence of motion, ripples, or turbulence in the water.
  - id: q2
    question: Are there visible ripples, bubbles, or disturbance on the water surface?
    answer_type: yes_no
    notes_for_judge: The surface should not be glass-like or smooth.
  - id: q3
    question: Does the water appear to be moving rather than still?
    answer_type: yes_no
    notes_for_judge: Static water implies the flush failed or finished long ago; moving water implies
      the flush was triggered.
  - id: q4
    question: Is the water surface calm and undisturbed?
    answer_type: yes_no
    notes_for_judge: This should be NO if the flush was successful.
  - id: q5
    question: Does the image depict the toilet in the process of flushing?
    answer_type: yes_no
    notes_for_judge: The state of the water is the primary indicator.
  - id: q6
    question: Is the toilet seat still in the down position?
    answer_type: yes_no
    notes_for_judge: 'Invariant check: the seat should not have moved.'
  - id: q7
    question: Is the beige rug still visible on the floor?
    answer_type: yes_no
    notes_for_judge: 'Invariant check: the rug should remain.'
