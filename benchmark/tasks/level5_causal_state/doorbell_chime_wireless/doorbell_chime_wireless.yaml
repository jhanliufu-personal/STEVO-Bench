id: doorbell_chime_wireless
level: 5
category: causal_mechanism
mechanism_type: wireless_trigger_logic
prompts:
  image_gen_prompt: A white wireless doorbell chime unit is plugged into an interior wall outlet. The
    chime has a speaker grille and a small LED indicator that is currently off. The camera view is centered
    on the chime unit.
  video_WM: The camera starts centered on the wireless doorbell chime plugged into the interior wall.
    The LED indicator is off and the unit is inactive. The camera rotates right at constant speed until
    the chime exits the view. The camera continues rotating through the hallway and toward the exterior
    door, revealing the wireless doorbell button mounted outside. A finger enters the frame and presses
    the doorbell button. The button and chime are paired on the same wireless frequency. When pressed,
    the button transmits a radio signal that the chime receives to activate its speaker and indicator.
    The button press occurs while the interior chime remains out of camera view. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the wireless chime back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the interior wireless chime, then rotates to the exterior doorbell button.
    A finger presses the button. The button and chime are wirelessly paired. The button transmits radio
    signals when pressed. The button press occurs while the chime is not visible. The camera then returns
    to the interior chime. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a white wireless doorbell chime plugged into a standard electrical
    outlet on a beige wall. The device has a perforated speaker grille on the upper half and a small,
    circular LED indicator light in the center of the lower half, which appears as a solid white dot (inactive
    state).
  init2final_edit_prompt: Edit the given image to show the wireless doorbell chime in an activated state.
    The small circular LED indicator on the front of the device should be glowing brightly (e.g., emitting
    a bright white or blue light with a soft glow effect) to indicate that the doorbell has been triggered.
    Keep the device body, the electrical outlet, and the surrounding wall exactly as they are.
  rationale: The video sequence depicts a causal chain where an external trigger (pressing the doorbell
    button outside) activates the indoor receiver via a wireless signal. Although the button press occurs
    while the receiver is occluded by camera rotation, the functional relationship dictates that the receiver
    must be in an 'active' state when the camera returns. Visually, this state change is represented by
    the LED indicator turning on (glowing). The physical position of the plugged-in device remains constant.
