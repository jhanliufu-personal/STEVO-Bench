id: elevator_call_button_press_02
level: 5
category: causal_mechanism
tags: []
variant_of: elevator_call_button_press
variation_type: initial_state
variation_description: The Down button starts LIT (as in the original image). The action is to press it,
  canceling the call.
changes:
  occlusion_method: null
  dynamic_conditions: The button logic acts as a toggle; pressing the lit button turns it off.
  expected_outcome_change: The Down button light should turn OFF.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the elevator call button panel, where the Down button is currently
    illuminated. The camera rotates right at constant speed until the button panel exits the view. The
    camera continues rotating right, showing the wall and surroundings. While the button is out of view,
    a hand reaches to the button location and presses the Down call button. In this specific elevator
    bank, a second press on an active button cancels the call. The controller registers the press and
    deactivates the light circuit. The button press occurs while the button panel remains out of camera
    view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing
    the button panel back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the illuminated Down button. While out of view, the button is pressed.
    The system logic dictates that pressing an active button cancels the call and cuts power to the light.
    The button press occurs while the button is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up view of a brushed metal elevator control panel mounted on a rough,
    pitted concrete wall. The panel features two circular buttons vertically aligned. The top button has
    an upward-pointing arrow and is currently unlit (dark/black). The bottom button has a downward-pointing
    arrow and is currently illuminated with a bright orange-yellow glow.
  init2final_edit_prompt: Edit the given image to turn off the light on the bottom 'Down' button. Remove
    the orange glow from the bottom button so that it appears dark and unlit, visually matching the unlit
    top 'Up' button. Ensure the metal panel and concrete wall texture remain unchanged.
  rationale: 'The video prompt describes a scenario where the camera rotates away from the panel, a user
    presses the already-lit ''Down'' button, and the camera returns. The prompt explicitly states the
    logic for this system: pressing an active button cancels the call and deactivates the light. Since
    the ''Down'' button was initially lit, the press turns it off. The final frame must show the ''Down''
    button in an unlit state, identical to the ''Up'' button, from the original camera angle.'
