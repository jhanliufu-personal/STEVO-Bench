id: automatic_toilet_flush_03
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_toilet_flush
variation_type: initial_state
variation_description: The toilet bowl starts filled to the brim; the trigger action drains it.
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is over-filled. Trigger activates the drain/flush.
  expected_outcome_change: The water level should lower to a normal level (drain) rather than just swirling.
prompts:
  init_frame_edit_prompt: Edit the image so the toilet bowl is filled with water almost to the rim.
  video_WM: The camera starts centered on the toilet bowl, which is filled with water to the rim. The
    camera rotates right at constant speed until the bowl exits the view. The camera continues rotating,
    revealing the automatic flush sensor module. A hand enters the frame and waves in front of the sensor
    to trigger the flush valve. The hand wave occurs while the toilet bowl remains out of camera view.
    Then the camera rotates left smoothly back to the original viewpoint, bringing the toilet bowl back
    into center view. STOP.
  camera_WM: The scene features an overfilled toilet bowl and a flush sensor. A hand waves in front of
    the sensor to trigger the flush mechanism. This action occurs while the bowl is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A top-down close-up view of a white ceramic toilet bowl containing clear water.
    The water surface is calm and still, reflecting the light. A white toilet seat and lid are visible
    at the top. The bowl sits on a tiled floor with a beige rug partially visible at the bottom.
  init2final_edit_prompt: Edit the given image to show the toilet bowl in the middle of a flush cycle.
    Transform the calm water surface into agitated, swirling water with ripples, bubbles, and motion blur
    to indicate active draining or flushing. The water level should appear dynamic. Keep the ceramic bowl,
    toilet seat, floor tiles, and rug exactly as they are in the original image.
  rationale: The video prompt describes a sequence where the camera pans away, a hand triggers the automatic
    flush sensor, and the camera pans back to the bowl. The duration of these actions (panning and triggering)
    implies that when the camera returns to the initial viewpoint, the toilet will be in the midst of
    the flush cycle. Physically, this means the previously calm water will be turbulent, swirling, or
    draining. The 'filled to the rim' context in the prompt emphasizes a high initial volume that would
    be evacuated, ensuring the final state shows significant water motion or level change compared to
    the static initial frame.
