id: motion_sensor_ceiling_light_07
level: 5
category: causal_mechanism
tags: []
variant_of: motion_sensor_ceiling_light
variation_type: precondition_failure
variation_description: The fixture is heavily rusted and looks non-functional. Triggering has no effect.
changes:
  occlusion_method: null
  dynamic_conditions: 'Precondition failure: Device failure due to corrosion/age.'
  expected_outcome_change: No change (light remains dark).
prompts:
  init_frame_edit_prompt: Edit the image to make the light fixture look heavily rusted, corroded, and
    non-functional.
  video_WM: The camera starts centered on the rusty, corroded ceiling light fixture. The camera rotates
    right at constant speed until the light fixture exits the view. The camera continues rotating right,
    revealing a motion sensor mounted on the wall. A hand enters the frame and waves in front of the motion
    sensor. The sensor is a PIR detector attempting to control the light circuit. The hand waves while
    the ceiling light remains out of view. Then the camera rotates left smoothly at the same rate back
    to the original viewpoint, bringing the ceiling light fixture back into center view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The camera starts on the corroded ceiling light, then rotates to the motion sensor. A hand
    waves in front of the sensor. The sensor attempts to control the circuit. The hand motion occurs while
    the light is not visible. The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A low-angle, centered view of a rusty, industrial-style ceiling light fixture
    hanging in an empty room. The fixture features a heavily corroded metal housing and a wire cage protecting
    a glass enclosure. Inside the glass, a light bulb is visible but currently dark (off). The ceiling
    above shows signs of water damage and rust stains. The room has distressed beige walls with peeling
    paint and a wooden floor. Portions of windows are visible on the far left and right edges of the frame.
  init2final_edit_prompt: Edit the given image to turn on the light bulb inside the central ceiling fixture.
    Make the bulb glow brightly with a warm light, illuminating the interior of the glass enclosure and
    casting a glow on the surrounding wire cage and ceiling base. Ensure the light source appears active
    and bright compared to the dark initial state.
  rationale: The video prompt describes a causal chain where a motion sensor is triggered while the light
    fixture is temporarily out of view. The camera rotates away, a hand waves at the sensor (the trigger
    event), and the camera rotates back. Functionally, triggering a motion sensor connected to a light
    circuit should cause the light to turn on. Therefore, in the final frame, the previously dark light
    fixture must be illuminated to reflect the state change caused by the action.
