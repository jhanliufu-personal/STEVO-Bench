id: keycard_reader_insertion_02
level: 5
category: causal_mechanism
tags: []
variant_of: keycard_reader_insertion
variation_type: initial_state
variation_description: The status LED starts in the locked RED state, so swiping the card toggles it to
  GREEN (unlocking).
changes:
  occlusion_method: null
  dynamic_conditions: Reader starts in 'locked' state (Red LED). Trigger action unlocks it.
  expected_outcome_change: The LED should turn from Red to Green.
prompts:
  init_frame_edit_prompt: Edit the image so the small circular status LED above the slot is glowing bright
    red.
  video_WM: The camera starts centered on the keycard reader with its illuminated red status LED. The
    camera rotates right at constant speed until the reader exits the view. The camera continues rotating,
    showing the area near the reader. A hand holding a white plastic keycard enters the frame and slides
    the keycard into the slot of the reader and then quickly removes it. The reader contains authentication
    circuitry that validates the card and signals the mechanism. The keycard swipe occurs while the reader's
    status LED remains out of camera view. Then the camera rotates left smoothly at the same rate back
    to the original viewpoint, bringing the reader and its status LED back into center view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The camera starts on the keycard reader with red status LED, then rotates away. A hand swipes
    a keycard through the reader slot. The reader processes the card. The card swipe occurs while the
    status LED is not visible. The camera then returns to the reader and status LED. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up view of a stainless steel keycard reader mounted on a beige textured
    wall. The reader features a horizontal black card slot in the center. Directly above the slot is a
    small circular LED status light which is illuminated bright red. To the left of the reader is a vertical
    section of a brown wooden door frame.
  init2final_edit_prompt: Edit the given image to change the color of the circular status LED light above
    the card slot from red to green. The LED should appear illuminated in a bright green color. Ensure
    the black card slot is empty and contains no objects. Keep the stainless steel plate, the beige wall
    texture, and the wooden door frame exactly as they are in the original image.
  rationale: The video prompt describes a sequence where the camera rotates away, a keycard is inserted
    and validated, and the camera returns to the original view. The explicit mention of the circuitry
    'validating' the card implies a successful authentication event. In standard access control systems,
    a valid swipe triggers a state transition from Red (locked) to Green (access granted). Since the prompt
    states the card is 'quickly removed', the final state should show the reader with a green LED and
    an empty slot.
  questions:
  - id: led_is_green
    question: Is the status LED above the card slot now illuminated green?
    answer_type: yes_no
    notes_for_judge: The primary indicator of the state change is the LED color changing from red to green.
  - id: led_changed_color
    question: Has the status light changed color compared to the initial red state?
    answer_type: yes_no
    notes_for_judge: Any change from the initial red indicates a reaction, though green is the expected
      specific outcome.
  - id: red_light_gone
    question: Is the red light from the initial frame no longer visible?
    answer_type: yes_no
    notes_for_judge: The red light should be replaced by green.
  - id: slot_empty
    question: Is the black card slot empty?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the card was removed.
  - id: no_card_visible
    question: Is the image free of any visible keycards or hands?
    answer_type: yes_no
    notes_for_judge: The interaction finished and the hand/card left the scene.
  - id: plate_material_consistent
    question: Is the stainless steel texture of the reader plate still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: door_frame_visible
    question: Is the wooden door frame visible on the left side?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
