id: drinking_fountain_button
level: 5
category: causal_mechanism
mechanism_type: button_valve_logic
prompts:
  image_gen_prompt: A drinking fountain spout extends from the basin. No water is flowing from the spout.
    The camera view is centered on the fountain spout and basin.
  video_WM: The camera starts centered on the drinking fountain spout with no water flowing. The camera
    rotates right at constant speed until the spout exits the view. The camera continues rotating, revealing
    the push button or paddle lever on the side of the fountain. A hand enters the frame and presses the
    button firmly. The button is mechanically connected to a valve in the water supply line. When pressed,
    the valve opens and water pressure creates an arc from the spout. The button press occurs while the
    fountain spout remains out of camera view. Then the camera rotates left smoothly at the same rate
    back to the original viewpoint, bringing the fountain spout back into center view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The camera starts on the fountain spout, then rotates to the side push button. A hand presses
    the button. The button opens the water valve when pressed. The button press occurs while the spout
    is not visible. The camera then returns to the fountain spout. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
