id: motion_sensor_ceiling_light_02
level: 5
category: causal_mechanism
tags: []
variant_of: motion_sensor_ceiling_light
variation_type: initial_state
variation_description: The ceiling light starts in the ON state (bright white). The trigger action toggles
  it OFF.
changes:
  occlusion_method: null
  dynamic_conditions: Light starts ON. Sensor logic is a toggle.
  expected_outcome_change: Light turns OFF.
prompts:
  init_frame_edit_prompt: Edit the image so the ceiling light is illuminated with a bright, cool white
    light.
  video_WM: The camera starts centered on the bright ceiling light fixture. The camera rotates right at
    constant speed until the light fixture exits the view. The camera continues rotating right, revealing
    a motion sensor mounted on the wall. A hand enters the frame and waves in front of the motion sensor.
    The sensor is a PIR detector that toggles the connected load when triggered. The hand waves while
    the ceiling light remains out of view. Then the camera rotates left smoothly at the same rate back
    to the original viewpoint, bringing the ceiling light fixture back into center view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The camera starts on the bright ceiling light, then rotates to the motion sensor. A hand
    waves in front of the sensor. The sensor is a PIR detector that toggles the load. The hand motion
    occurs while the light is not visible. The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A centered view of a vintage industrial ceiling light fixture with a metal cage
    and glass enclosure, mounted on a white ceiling. The light is currently turned on, emitting a bright
    white glow that illuminates the surrounding ceiling. The room has distressed walls with peeling paint,
    a wooden floor, and windows visible on the far left and right edges providing daylight.
  init2final_edit_prompt: Edit the given image to turn off the central ceiling light fixture. The glass
    enclosure inside the metal cage should appear dark and unlit, replacing the bright white glow with
    the appearance of an extinguished bulb. The ceiling area immediately surrounding the fixture should
    appear dimmer, reflecting the absence of artificial light from the fixture. Maintain the natural daylight
    coming from the windows and the existing texture of the walls and floor.
  rationale: The initial frame shows the light fixture in an 'ON' state (brightly glowing). The video
    prompt describes a camera rotation to a motion sensor which is explicitly defined to 'toggle the connected
    load' when triggered. A hand waves to trigger this sensor. Since the initial state is ON, the 'toggle'
    function causes the state to switch to OFF. The camera then returns to the original viewpoint. Therefore,
    the final frame must show the light fixture turned off.
  questions:
  - id: light_state_off
    question: Is the ceiling light fixture turned off in the final frame?
    answer_type: yes_no
    notes_for_judge: The light should no longer be glowing.
  - id: glow_disappeared
    question: Has the bright white glow from the center of the fixture disappeared?
    answer_type: yes_no
    notes_for_judge: Compare with the bright source in the initial frame.
  - id: bulb_dark
    question: Does the glass enclosure inside the fixture's cage appear dark or unlit?
    answer_type: yes_no
    notes_for_judge: The interior of the cage should be dark, not white/bright.
  - id: ceiling_dimmer
    question: Is the ceiling area immediately surrounding the fixture dimmer than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The artificial light cast on the ceiling should be gone.
  - id: artificial_light_absent
    question: Is the scene devoid of the artificial illumination coming from the central fixture?
    answer_type: yes_no
    notes_for_judge: Natural light from windows should remain, but the lamp's light should be gone.
  - id: cage_interior_dark
    question: Is the interior of the metal cage dark?
    answer_type: yes_no
    notes_for_judge: It should not be filled with light.
  - id: window_consistency
    question: Are the windows on the left and right edges still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: floor_consistency
    question: Is the wooden floor texture still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
