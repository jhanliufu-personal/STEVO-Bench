id: slider_thermostat_heat
level: 5
category: causal_mechanism
mechanism_type: threshold_logic
prompts:
  image_gen_prompt: A heater vent is mounted on the wall. The vent is currently not emitting heat (inactive). The camera view is centered on the heater vent.
  video_WM: The camera starts centered on the inactive heater vent. The camera rotates right at constant speed until the vent exits the view. The camera continues rotating, revealing a wall-mounted heater control with a horizontal slider. The slider is currently at the far left MIN position. A finger enters the frame and slides the control bar all the way to the far right MAX position. The slider remains at the maximum setting. The thermostat engages the heating circuit when set above a threshold. The slider movement occurs while the heater vent remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the heater vent back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the heater vent, then rotates to the temperature slider control. A finger moves the slider from MIN to MAX position. The thermostat engages heating above threshold. The slider movement occurs while the vent is not visible. The camera then returns to the heater vent. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
