id: automatic_paper_towel_dispenser_02
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_paper_towel_dispenser
variation_type: initial_state
variation_description: The internal paper roll is blue instead of brown.
changes:
  occlusion_method: null
  dynamic_conditions: The object state (paper color) is different, leading to a qualitatively different
    output.
  expected_outcome_change: Blue paper is hanging out instead of brown paper.
prompts:
  init_frame_edit_prompt: Edit the semi-transparent dispenser window to show a roll of blue paper inside
    instead of brown.
  video_WM: The camera starts centered on the automatic paper towel dispenser opening with no paper hanging
    out. The camera rotates right at constant speed until the dispenser exits the view. The camera continues
    rotating, revealing the area directly below the dispenser where the infrared sensor detection zone
    is located. A hand enters the frame and waves in front of the sensor zone below the dispenser. The
    dispenser contains an infrared proximity sensor that detects hand presence and activates a motor to
    advance paper when triggered. The hand wave occurs while the dispenser opening remains out of camera
    view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing
    the dispenser opening back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scene displays the dispenser opening. The view shifts to the sensor detection area below.
    A hand waves in the sensor zone. The sensor detects proximity and triggers the motor. The hand wave
    occurs while the dispenser opening is not visible. The view returns to the dispenser opening. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a stainless steel Tork paper towel dispenser mounted on a
    white tiled wall. The dispenser has a semi-transparent window showing a roll of blue paper towels
    inside. Below the window is the Tork logo and a black sensor area. At the bottom is a dispensing slot,
    which is currently empty with no paper hanging out. To the right, a window frame and part of a white
    sink are visible.
  init2final_edit_prompt: Edit the given image to show a length of blue paper towel hanging down from
    the dispensing slot at the bottom of the stainless steel unit. The paper should emerge from the black
    opening and hang downwards. Ensure the paper color matches the blue roll visible inside the window.
    Keep the dispenser casing, wall tiles, and background lighting unchanged.
  rationale: The video describes a sequence where the camera pans away, a hand triggers the dispenser's
    infrared sensor, and the camera pans back. The causal mechanism of the automatic dispenser is that
    triggering the sensor activates the motor to feed paper. Therefore, in the final frame, the state
    of the dispenser must have changed from having no paper exposed to having a sheet of paper hanging
    from the slot, ready for use.
  questions:
  - id: paper_hanging_presence
    question: Is there a sheet of paper towel hanging from the bottom of the dispenser?
    answer_type: yes_no
    notes_for_judge: Check if paper has been dispensed and is now visible below the slot.
  - id: paper_color_match
    question: Is the dispensed paper towel blue?
    answer_type: yes_no
    notes_for_judge: The paper hanging out should match the blue roll visible inside the machine.
  - id: slot_state_change
    question: Is the dispensing slot at the bottom no longer empty?
    answer_type: yes_no
    notes_for_judge: Initially the slot was empty; now it should be occupied by paper.
  - id: paper_extension
    question: Does the paper towel extend downwards below the metal casing?
    answer_type: yes_no
    notes_for_judge: The paper should hang down due to gravity after being dispensed.
  - id: dispenser_integrity
    question: Is the stainless steel casing of the dispenser still intact and in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: logo_visibility
    question: Is the Tork logo still visible on the front of the dispenser?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: state_transition_dispensed
    question: Does the dispenser appear to have been activated compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Activation is evidenced by the presence of dispensed paper.
