id: automatic_paper_towel_dispenser_06
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_paper_towel_dispenser
variation_type: precondition_failure
variation_description: A red LED indicates error or low battery.
changes:
  occlusion_method: null
  dynamic_conditions: Device is in error state (low battery/jam), preventing operation.
  expected_outcome_change: No paper is dispensed.
prompts:
  init_frame_edit_prompt: Edit the image to add a bright red LED indicator glowing on the front of the
    dispenser casing.
  video_WM: The camera starts centered on the automatic paper towel dispenser opening. The camera rotates
    right at constant speed until the dispenser exits the view. The camera continues rotating, revealing
    the area directly below the dispenser where the infrared sensor detection zone is located. A hand
    enters the frame and waves in front of the sensor zone below the dispenser. The hand wave occurs while
    the dispenser opening remains out of camera view. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the dispenser opening back into center view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The scene displays the dispenser opening. The view shifts to the sensor detection area below.
    A hand waves in the sensor zone. The hand wave occurs while the dispenser opening is not visible.
    The view returns to the dispenser opening. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a stainless steel Tork paper towel dispenser mounted on a
    white tiled wall. The dispenser has a translucent window showing a roll of brown paper inside. A red
    indicator light is illuminated near the bottom center. The dispensing slot at the bottom is visible,
    with no paper towel currently hanging out. To the right, a blurred window and sink area are partially
    visible.
  init2final_edit_prompt: Edit the given image to show a length of brown paper towel hanging down from
    the dispensing slot at the bottom of the metal unit. The paper should extend downwards, appearing
    as if it has just been dispensed. Keep the stainless steel dispenser, the red indicator light, the
    Tork logo, and the tiled background unchanged.
  rationale: The video prompt describes a causal chain where the camera pans away to reveal the sensor
    zone, a hand waves to trigger the sensor, and the camera pans back. The automatic dispenser mechanism
    is activated by the hand wave (the causal trigger). Therefore, when the camera returns to the initial
    viewpoint, the state of the dispenser must have changed to show a dispensed paper towel hanging from
    the slot. The edit reflects this functional state change.
