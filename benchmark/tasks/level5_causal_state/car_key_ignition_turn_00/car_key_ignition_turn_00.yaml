id: car_key_ignition_turn_00
level: 5
category: causal_mechanism
tags: []
variant_of: car_key_ignition_turn
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to ensure a car key is clearly visible inserted into the ignition
    cylinder on the right side of the steering column.
  video_WM: Stationary driver's POV. The steering wheel is centered, the instrument cluster is dark, and
    the ignition key is visible on the right side of the steering column. A hand reaches in, grips the
    key, and turns it clockwise from the OFF to the ON position. STOP.
  camera_WM: Stationary driver's POV. The steering wheel is centered, the instrument cluster is dark,
    and the ignition key is visible on the right side of the steering column. A hand reaches in, grips
    the key, and turns it clockwise from the OFF to the ON position. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A driver's point-of-view shot from inside a parked car on a sunny day. The steering
    wheel is centered with a dark grey rim. Behind the wheel, the instrument cluster is black and unlit,
    with white gauge markings for speed, RPM, fuel, and temperature. The needles are at their resting
    zero positions. To the right of the steering column, a car key is inserted into the ignition switch
    in the 'OFF' position, with other keys hanging from the ring. The dashboard includes climate control
    vents and sliders in the center console. Through the windshield, a suburban street with houses and
    green lawns is visible.
  init2final_edit_prompt: Edit the given image to show the car's ignition turned on. Rotate the key in
    the ignition clockwise to the 'ON' position. Illuminate the instrument cluster with bright warning
    lights (such as the battery, oil pressure, and check engine symbols) and backlighting to indicate
    the electrical system is active.
  rationale: The video prompt describes a hand turning the ignition key from OFF to ON. This mechanical
    action closes the car's electrical circuit. The primary functional consequence is the activation of
    the instrument cluster. In a real vehicle, turning the key to ON (without cranking) immediately illuminates
    the dashboard warning lights (bulb check) and powers the gauges. While the hand performs the action,
    the most reliable state change to verify is the illumination of the dashboard indicators, which confirms
    the causal link between the key turn and the car's system response.
  questions:
  - id: dash_lights_illuminated
    question: Are the instrument cluster warning lights or indicators illuminated?
    answer_type: yes_no
    notes_for_judge: Look for glowing icons (red, orange, or yellow) on the dashboard panel that were
      previously dark.
  - id: system_power_active
    question: Does the dashboard show visual evidence of the electrical system being powered on?
    answer_type: yes_no
    notes_for_judge: Evidence includes backlighting or specific warning lights turning on.
  - id: key_rotation
    question: Is the ignition key rotated clockwise compared to its initial position?
    answer_type: yes_no
    notes_for_judge: The key angle should have changed to the right.
  - id: cluster_state_change
    question: Is the instrument panel significantly brighter or more colorful than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Refers to the activation of lights/indicators.
  - id: steering_wheel_invariant
    question: Is the steering wheel in the same centered position as the initial frame?
    answer_type: yes_no
    notes_for_judge: The wheel itself should not have turned, only the key.
  - id: environment_invariant
    question: Is the view of the street through the windshield unchanged?
    answer_type: yes_no
    notes_for_judge: The car is stationary; the background should not move.
