id: automatic_toilet_flush_00
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_toilet_flush
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add a chrome automatic flush sensor module mounted on the
    tiled wall directly behind the toilet seat, ensuring it is clearly visible within the frame.
  video_WM: The camera is completely stationary, framing the toilet bowl and the automatic flush sensor
    mounted on the wall behind it. The water in the bowl is stable. A hand enters the frame and waves
    in front of the sensor. STOP.
  camera_WM: The camera is completely stationary, framing the toilet bowl and the automatic flush sensor
    mounted on the wall behind it. The water in the bowl is stable. A hand enters the frame and waves
    in front of the sensor. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A high-angle close-up shot of a white ceramic toilet bowl. Inside the bowl,
    mounted on the back inner rim, is a chrome-finished automatic sensor device, resembling a soap dispenser
    but identified as a flush sensor. The water in the bowl is clear, calm, and still, with visible reflections
    on the surface. The toilet seat is white and visible at the top of the frame. The floor around the
    toilet has light-colored tiles and a beige rug.
  init2final_edit_prompt: Edit the given image to show the water in the toilet bowl in a state of active
    flushing. The water surface should be swirling, agitated, and turbulent with ripples and motion blur,
    replacing the calm still water. Do not change the position of the sensor or the toilet bowl itself.
  rationale: 'The user prompt explicitly identifies the wall-mounted device as an ''automatic flush sensor''
    and describes a hand waving to trigger it. The causal mechanism is: Hand Wave -> Sensor Trigger ->
    Toilet Flush. Therefore, the primary state change in the final frame must be the agitation and swirling
    of the water in the bowl, indicating that the flush cycle has been activated. While the device visually
    resembles a soap dispenser, the text prompt''s functional definition (''flush sensor'') dictates the
    outcome (flushing water) rather than dispensing soap.'
  questions:
  - id: water_agitation
    question: Is the water in the toilet bowl agitated or swirling?
    answer_type: yes_no
    notes_for_judge: Look for ripples, turbulence, or swirling motion in the water compared to the calm
      initial state.
  - id: flush_active
    question: Does the toilet appear to be in the process of flushing?
    answer_type: yes_no
    notes_for_judge: The water should not be still; it should show evidence of a flush cycle.
  - id: surface_change
    question: Is the surface of the water different from the calm, reflective state in the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial frame has still water. The final frame should show disturbed water.
  - id: motion_evidence
    question: Is there visual evidence of water motion or flow in the bowl?
    answer_type: yes_no
    notes_for_judge: Check for motion blur or current lines in the water.
  - id: sensor_invariant
    question: Is the chrome sensor device still mounted on the back rim of the bowl?
    answer_type: yes_no
    notes_for_judge: The device itself should not disappear or move significantly, though water might
      splash near it.
  - id: seat_invariant
    question: Is the toilet seat in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The seat should remain stationary.
