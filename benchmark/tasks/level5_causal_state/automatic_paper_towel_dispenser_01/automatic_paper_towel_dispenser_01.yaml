id: automatic_paper_towel_dispenser_01
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_paper_towel_dispenser
variation_type: initial_state
variation_description: Paper is already hanging out of the dispenser at the start.
changes:
  occlusion_method: null
  dynamic_conditions: Initial state shows paper dispensed. Waving sensor typically dispenses a second
    sheet or does nothing depending on specific firmware logic.
  expected_outcome_change: A second sheet of paper is dispensed (longer strip) or no change if sensor
    is blocked by existing paper.
prompts:
  init_frame_edit_prompt: Edit the image to show a sheet of brown paper towel already hanging out of the
    dispenser slot.
  video_WM: The camera starts centered on the automatic paper towel dispenser opening, which already has
    paper hanging out. The camera rotates right at constant speed until the dispenser opening exits the
    view. The camera continues rotating, revealing the area directly below the dispenser where the infrared
    sensor detection zone is located. A hand enters the frame and waves in front of the sensor zone below
    the dispenser. The dispenser contains an infrared proximity sensor that detects hand presence and
    activates a motor to advance paper when triggered. The hand wave occurs while the dispenser opening
    remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original
    viewpoint, bringing the dispenser opening back into center view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The scene displays the automatic paper towel dispenser with paper hanging out. The view shifts
    to the sensor detection area below. A hand waves in the sensor zone. The sensor detects proximity
    and triggers the motor. The hand wave occurs while the dispenser opening is not visible. The view
    returns to the dispenser opening. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a stainless steel Tork automatic paper towel dispenser mounted
    on a wall with white subway tiles. A sheet of brown paper towel hangs from the dispenser slot. A black
    sensor window is visible on the front panel with wave icons. To the right, a window frame is partially
    visible. Below the dispenser, a white sink is partially visible.
  init2final_edit_prompt: Edit the given image to show the brown paper towel hanging significantly lower
    than in the original image, extending further down towards the sink, indicating that more paper has
    been dispensed. Keep the camera angle, lighting, and background identical to the original.
  rationale: The video prompt describes a sequence where the camera rotates away from the dispenser opening,
    a hand triggers the infrared sensor, and the camera rotates back. The functional mechanism of an automatic
    dispenser dictates that triggering the sensor causes the motor to advance the paper roll. Therefore,
    in the final frame, the length of the hanging paper towel must be longer than in the initial frame,
    reflecting the dispensing action that occurred while the output was out of view.
