id: automatic_paper_towel_dispenser_01
level: 5
category: causal_mechanism
mechanism_type: proximity_sensor_motor_logic
prompts:
  image_gen_prompt: An automatic paper towel dispenser is mounted on the wall. The dispenser opening shows the paper towel roll inside, with no paper hanging out. The camera view is centered on the dispenser opening.
  video_WM: The camera starts centered on the automatic paper towel dispenser opening with no paper hanging out. The camera rotates right at constant speed until the dispenser exits the view. The camera continues rotating, revealing the area directly below the dispenser where the infrared sensor detection zone is located. A hand enters the frame and waves in front of the sensor zone below the dispenser. The dispenser contains an infrared proximity sensor that detects hand presence and activates a motor to advance paper when triggered. The hand wave occurs while the dispenser opening remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the dispenser opening back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the dispenser opening, then rotates to the sensor detection area below. A hand waves in the sensor zone. The sensor detects proximity and triggers the motor to dispense paper. The hand wave occurs while the dispenser opening is not visible. The camera then returns to the dispenser opening. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
