evaluation:
  init2final_edit_prompt: Turn the ceiling light off. The glass dome of the ceiling fixture should appear
    dark and unlit, with no glow. The overall room lighting should be dimmer, consistent with the main
    light source being extinguished. The toggle on the light switch on the left wall should be flipped
    to the down position.
  rationale: The video prompt specifies that the camera moves away and then returns to the original viewpoint.
    During the time the relevant objects are unobserved, a human hand toggles the wall switch to the opposite
    position. In the initial frame, the switch is up and the light is on. Therefore, the action flips
    the switch to the down position, which cuts power to the light. The final frame must show the switch
    down and the ceiling light turned off (dark), with the room lighting adjusted to reflect the loss
    of the main light source.
