id: lightbulb_and_switch_02
level: 5
category: causal_reasoning
tags: []
variant_of: lightbulb_and_switch
variation_type: initial_state
variation_description: The lightbulb starts ON with a warm color temperature.
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is ON (warm light). Trigger action toggles switch to OFF.
  expected_outcome_change: Light turns OFF (original was ON).
prompts:
  init_frame_edit_prompt: Edit the image so the lightbulb is ON, emitting a warm orange glow.
  video_WM: Single continuous shot, no cuts, no zoom. The scene contains one functioning ceiling light
    that is currently emitting a warm glow (ON). Camera starts centered on the ceiling light. The camera
    smoothly moves left at constant speed until the ceiling light exits the frame to the right. While
    the light is out of view, a human hand toggles the wall switch. The camera continues moving left for
    several seconds. Then the camera moves right at the same constant speed back to the original viewpoint,
    bringing the ceiling light back into view.
  camera_WM: The scene contains one functioning ceiling light that is currently emitting a warm glow (ON).
    A human hand toggles the wall switch. STOP.
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  Genie: null
evaluation:
  init_frame_description: A low-angle shot of a room interior featuring a central ceiling light fixture
    with a single bulb that is currently turned on and emitting a bright, warm glow. The light illuminates
    the textured plaster ceiling and walls, creating a gradient of light fading into shadows in the corners.
    The floor appears to be made of wooden planks.
  init2final_edit_prompt: Edit the given image so that the ceiling light is turned off. The light bulb
    should appear unlit, dark, and transparent or opaque without emitting any light. The entire room should
    be significantly darker, removing the warm glow from the ceiling and walls, simulating the appearance
    of the room with the main light source deactivated.
  rationale: The initial state shows the light is ON. The video prompt describes a camera motion that
    occludes the light, followed by a 'toggle' action on the wall switch. Toggling a switch for a light
    that is currently ON causes it to turn OFF. Therefore, when the camera returns to the original view,
    the light bulb must be unlit and the room's illumination must be significantly reduced.
