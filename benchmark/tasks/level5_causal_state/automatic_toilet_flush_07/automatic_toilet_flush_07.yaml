id: automatic_toilet_flush_07
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_toilet_flush
variation_type: precondition_failure
variation_description: The sensor displays a red 'dead battery' indicator.
changes:
  occlusion_method: null
  dynamic_conditions: The sensor has no power/fault state. It does not trigger.
  expected_outcome_change: The water remains stable (no flush).
prompts:
  init_frame_edit_prompt: Edit the image to add a bright red LED indicator light on the flush sensor face,
    symbolizing a dead battery or fault.
  video_WM: The camera starts centered on the toilet bowl with stable water level. The camera rotates
    right at constant speed until the bowl exits the view. The camera continues rotating, revealing the
    automatic flush sensor which shows a red fault light. A hand enters the frame and waves in front of
    the sensor. The hand wave occurs while the toilet bowl remains out of camera view. Then the camera
    rotates left smoothly back to the original viewpoint, bringing the toilet bowl back into center view.
    STOP.
  camera_WM: The scene features a toilet bowl and a flush sensor displaying a red fault light. A hand
    waves in front of the sensor. This action occurs while the bowl is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A high-angle, eye-level shot of a white ceramic toilet bowl centered in the
    frame. The toilet seat is down. The water inside the bowl is calm, clear, and still, with a slight
    brownish ring stain visible near the water line. To the left of the toilet tank, mounted on the white
    tiled wall, is a square automatic flush sensor with a bright red circular light illuminated in its
    center. A beige bath mat is visible on the floor at the bottom of the frame. A window frame is visible
    on the far left edge.
  init2final_edit_prompt: Edit the image to show the toilet actively flushing. The water in the bowl should
    be swirling, agitated, and turbulent with motion blur and bubbles, replacing the calm still water.
    The red light on the square wall sensor to the left of the tank should be turned off (remove the red
    glow). Keep the toilet seat down and the surrounding bathroom tiles and rug unchanged.
  rationale: The video prompt describes a user waving a hand in front of the automatic flush sensor, which
    is the universal trigger for activating the flush mechanism. Although the camera looks away during
    the trigger event, the causal consequence is that the toilet flushes. Therefore, when the camera returns
    to the initial viewpoint, the water in the bowl must be in motion (swirling or draining) rather than
    static. Additionally, the 'fault light' described in the prompt typically resets or turns off when
    the mechanism is successfully triggered.
  questions:
  - id: water_motion
    question: Is the water in the toilet bowl swirling, agitated, or moving?
    answer_type: yes_no
    notes_for_judge: Look for evidence of a flush in progress, such as ripples, bubbles, motion blur,
      or swirling water, as opposed to the still water in the initial frame.
  - id: sensor_light_state
    question: Is the red light on the wall-mounted sensor turned off?
    answer_type: yes_no
    notes_for_judge: The initial frame shows a bright red light. The final frame should show this light
      off or significantly changed (e.g., green or unlit) to indicate the sensor was triggered.
  - id: water_state_change
    question: Does the water surface look different (e.g., turbulent) compared to the calm water in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: Comparative check for state change in the liquid.
  - id: seat_invariant
    question: Is the toilet seat still in the down position?
    answer_type: yes_no
    notes_for_judge: The seat position should not change during a standard flush.
  - id: rug_invariant
    question: Is the beige rug still visible on the floor?
    answer_type: yes_no
    notes_for_judge: Background object consistency check.
  - id: viewpoint_return
    question: Is the toilet bowl centered in the frame?
    answer_type: yes_no
    notes_for_judge: Verifies the camera returned to the original composition.
