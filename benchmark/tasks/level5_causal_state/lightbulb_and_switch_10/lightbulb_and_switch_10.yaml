id: lightbulb_and_switch_10
level: 5
category: causal_reasoning
tags: []
variant_of: lightbulb_and_switch
variation_type: indirect_causation
variation_description: The light requires BOTH the wall switch and a visible pull-string to be ON. The
  pull-string is OFF.
changes:
  occlusion_method: null
  dynamic_conditions: Logic is AND gate. Pull-string is OFF. Wall switch becomes ON. Result is OFF.
  expected_outcome_change: Light stays OFF (original was ON).
prompts:
  init_frame_edit_prompt: Edit the image to add a pull-string switch hanging from the light fixture.
  video_WM: 'Single continuous shot, no cuts, no zoom. The scene contains a ceiling light that requires
    TWO switches to be on: the wall switch AND the pull-string hanging from the fixture. The pull-string
    is currently in the OFF position. Camera starts centered on the ceiling light. The camera smoothly
    moves left at constant speed until the light exits the frame to the right. While the light is out
    of view, a human hand toggles the wall switch to the ON position. The camera continues moving left
    for several seconds. Then the camera moves right at the same constant speed back to the original viewpoint,
    bringing the ceiling light back into view.'
  camera_WM: 'The scene contains a ceiling light that requires TWO switches to be on: the wall switch
    AND the pull-string hanging from the fixture. The pull-string is currently in the OFF position. A
    human hand toggles the wall switch to the ON position. STOP.'
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  Genie: null
evaluation:
  init_frame_description: A low-angle shot of a corner in a room showing a ceiling light fixture. The
    fixture consists of a white ceramic base mounted to a textured white ceiling, holding a clear incandescent
    light bulb. A metal beaded pull-chain hangs vertically from the fixture, ending in a small white handle.
    The bulb is currently unlit, and the room is dimly lit with soft shadows on the walls and ceiling.
  init2final_edit_prompt: Edit the given image to show the light bulb remaining completely unlit and dark.
    Do not add any glow or illumination to the bulb. Maintain the original dim, shadowy lighting on the
    ceiling and walls. Ensure the pull-string hangs vertically in the exact same position as the original
    image.
  rationale: 'The prompt establishes a logical AND condition for the light to activate: both the wall
    switch AND the pull-string must be ON. The initial state specifies the pull-string is OFF. The action
    performed is toggling the wall switch to ON. Since the pull-string remains OFF (no interaction described
    for it), the combined logic (ON AND OFF) results in the light remaining OFF. Therefore, the final
    frame must show the light bulb unlit, identical to the initial state, despite the wall switch being
    toggled off-screen.'
