id: car_window_switch_09
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: repeated_activation
variation_description: Switch described as toggle; activated twice
changes:
  occlusion_method: null
  dynamic_conditions: 'Switch is a toggle. Pressed twice. Net result: Closed.'
  expected_outcome_change: Window remains Closed (Net no change)
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully closed. The driver leans forward toward the door panel; the window is no longer visible.
    The window control switch panel comes into view. The switch is an aftermarket toggle button. A hand
    presses the switch once, releases it, and then presses it a second time. The double activation cycles
    the window state and returns it to the start. The driver leans back to the upright seated position.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and window closed. The driver
    leans forward, camera pitches down and moves forward, revealing the window control switch. A hand
    presses the switch twice. The actions occur while the window is not visible. The driver leans back
    to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Driver's POV inside a car with a suede steering wheel featuring a yellow center
    marker. The instrument cluster is illuminated with orange light. The driver's side door panel is visible
    on the left, featuring a beige armrest and black upper trim. The driver's side window is fully closed,
    covered in dust, and displays a large 'Lemons Rally' text sticker and a smaller 'SPEED DEMON' sticker
    in the top corner. A side mirror is visible through the closed glass. The driver's left hand holds
    the steering wheel, and blue jeans are visible on the leg. Outside, a dirt road and trees are visible
    through the window.
  init2final_edit_prompt: Edit the image to ensure the driver-side window is fully closed. The 'Lemons
    Rally' and 'SPEED DEMON' stickers must be clearly visible on the glass in their original positions.
    The window glass should show reflections and dust consistent with being rolled up. The driver's left
    hand should be resting on the steering wheel. The view should be the original upright perspective,
    with the window completely filling the door frame area.
  rationale: The video prompt describes a causal chain where the driver leans forward to access the controls,
    performs a double activation of the window switch, and then returns to the upright position. The prompt
    explicitly states that this action 'cycles the window state and returns it to the start.' Since the
    window was fully closed in the initial frame, the functional result of the action is that the window
    returns to the fully closed position. The final frame should therefore show the window rolled up with
    all stickers visible, identical to the initial state, verifying that the model correctly processed
    the 'return to start' instruction rather than leaving the window open.
  questions:
  - id: window_closed
    question: Is the driver-side window fully closed?
    answer_type: yes_no
    notes_for_judge: The window should be rolled up, covering the opening.
  - id: sticker_lemons_visible
    question: Is the 'Lemons Rally' sticker clearly visible on the window?
    answer_type: yes_no
    notes_for_judge: If the window is open, this sticker would be rolled down and not visible.
  - id: sticker_speed_visible
    question: Is the 'SPEED DEMON' sticker visible in the top corner of the window?
    answer_type: yes_no
    notes_for_judge: This sticker is near the top edge; if the window is even slightly open, it might
      disappear.
  - id: glass_reflection
    question: Is the window glass visible with reflections or dust, indicating it is present?
    answer_type: yes_no
    notes_for_judge: Check for the texture/glare of the glass surface.
  - id: mirror_through_glass
    question: Is the side mirror viewed through the window glass?
    answer_type: yes_no
    notes_for_judge: The view of the mirror should be filtered by the dirty window glass.
  - id: hand_position
    question: Is the driver's left hand on the steering wheel?
    answer_type: yes_no
    notes_for_judge: The driver should have returned to the driving position.
