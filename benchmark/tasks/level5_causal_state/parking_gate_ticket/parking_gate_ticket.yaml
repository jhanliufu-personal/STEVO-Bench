id: parking_gate_ticket
level: 5
category: causal_mechanism
mechanism_type: authentication_barrier_logic
prompts:
  image_gen_prompt: A parking gate barrier arm is in the lowered position, blocking the exit lane. The
    striped barrier arm extends horizontally across the lane. The camera view is centered on the barrier
    arm.
  video_WM: The camera starts centered on the lowered parking barrier arm blocking the exit. The camera
    rotates right at constant speed until the barrier exits the view. The camera continues rotating, revealing
    a ticket payment machine with an insertion slot at driver window height. A hand holding a validated
    parking ticket enters the frame and inserts the ticket into the slot. The machine contains validation
    circuitry that reads tickets and controls the barrier motor based on payment status. The ticket insertion
    occurs while the barrier arm remains out of camera view. Then the camera rotates left smoothly at
    the same rate back to the original viewpoint, bringing the barrier arm back into center view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The camera starts on the lowered barrier arm, then rotates to the ticket machine. A hand
    inserts a validated parking ticket into the slot. The machine validates tickets and controls the barrier
    motor. The ticket insertion occurs while the barrier is not visible. The camera then returns to the
    barrier arm. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
