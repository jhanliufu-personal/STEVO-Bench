id: atm_card_screen_08
level: 5
category: causal_mechanism
tags: []
variant_of: atm_card_screen
variation_type: repeated_activation
variation_description: Card is inserted and then immediately removed (net no change).
changes:
  occlusion_method: null
  dynamic_conditions: The trigger is activated and then reversed (card in, card out) restoring the initial
    state.
  expected_outcome_change: Screen returns to 'INSERT CARD TO BEGIN' (or flickers and returns).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the ATM screen showing 'INSERT CARD TO BEGIN'. The camera rotates
    right at constant speed until the screen exits the view. The camera continues rotating, revealing
    the ATM card insertion slot. A hand enters, slides a bank card into the slot, pauses briefly, and
    then pulls the card back out. The system detects the insertion and immediate removal, resetting to
    standby. This sequence occurs while the screen remains out of camera view. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the ATM screen back into center
    view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ATM screen, then rotates to the card slot. A hand inserts and then
    removes a bank card. The system resets. The action occurs while the screen is not visible. The camera
    then returns to the ATM screen. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level view of an outdoor ATM interface at dusk. The central
    focus is a CRT screen displaying the text 'INSERT CARD TO BEGIN' in a pixelated cyan font on a black
    background. To the right of the screen is a vertical column of four silver function buttons. Below
    the screen is a metallic keypad. To the bottom right, a card insertion slot is visible, surrounded
    by a glowing blue illuminated ring. The machine's surface is brushed metal with visible wear and scratches.
    Reflections of a city street, including lights and a car, are visible on the screen and metal surfaces.
  init2final_edit_prompt: Edit the given image to show the ATM screen displaying the text 'INSERT CARD
    TO BEGIN' on two lines in cyan pixelated font. Ensure the card reader slot at the bottom right is
    empty and has an illuminated blue ring. The scene should appear identical to the initial frame, with
    the same lighting, reflections, and camera angle.
  rationale: The video prompt describes a sequence where the camera rotates away from the screen, a card
    is inserted and immediately removed, and the system explicitly 'resets to standby'. This specific
    instruction overrides the common causal expectation where a card dip would trigger a 'Enter PIN' screen.
    By the time the camera rotates back to the original view, the system has completed its reset. Therefore,
    the final state must be functionally identical to the initial state, displaying the welcome message
    rather than a transaction screen.
