id: slider_thermostat_heat_09
level: 5
category: causal_mechanism
tags: []
variant_of: slider_thermostat_heat
variation_type: repeated_activation
variation_description: The slider is quickly slid up and down, ending at the original position.
changes:
  occlusion_method: null
  dynamic_conditions: Repeated activation (MIN -> MAX -> MIN). Net state change is zero.
  expected_outcome_change: The vent remains inactive (same as initial state).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the inactive heater vent. The camera rotates right at constant
    speed until the vent exits the view. The camera continues rotating, revealing a wall-mounted heater
    control with a horizontal slider. The slider is currently at the far left MIN position. A finger enters
    the frame and quickly slides the control bar to the far right MAX position and immediately returns
    it to the far left MIN position. The slider remains at the minimum setting. The thermostat engages
    the heating circuit only when set above a threshold. The slider movements occur while the heater vent
    remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original
    viewpoint, bringing the heater vent back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the heater vent, then rotates to the temperature slider control. A finger
    moves the slider from MIN to MAX and back to MIN position. The thermostat engages heating only above
    threshold. The slider movements occur while the vent is not visible. The camera then returns to the
    heater vent. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, straight-on view of a rectangular, beige metal air vent mounted
    on a textured beige wall. The vent features two columns of horizontal louvers (slats) that are fixed
    in position. The paint on the vent is worn and chipped, revealing dark underlying material, particularly
    along the edges and around the two mounting screws on the left and right sides. The interior spaces
    between the louvers are dark, indicating no internal light source.
  init2final_edit_prompt: Edit the given image to show the heater vent in a completely inactive state.
    Ensure there is no red glow, orange light, or illumination coming from inside the louvers. The metal
    slats should appear cool and beige, identical to the original state, with no heat distortion or blurring
    in the air. The interior shadows between the slats should remain dark.
  rationale: The video prompt describes a sequence where the camera pans away from the vent to a thermostat,
    the slider is moved to the MAX position and then immediately returned to the MIN position, and then
    the camera pans back to the vent. The thermostat logic dictates that the heating circuit is only engaged
    when the setting is above a threshold. Since the slider is returned to the minimum setting (below
    threshold) before the camera returns to the vent, the heating circuit should be disengaged in the
    final frame. The vent should therefore appear inactive, with no visible glow or heat distortion, matching
    its initial state.
