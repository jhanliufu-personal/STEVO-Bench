id: car_window_switch_10
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: indirect_causation
variation_description: Driver turns ignition key first, then operates window
changes:
  occlusion_method: null
  dynamic_conditions: Ignition turned ON -> Power available -> Switch pressed -> Window Opens.
  expected_outcome_change: Window Opens (Same as original, but requires extra step)
prompts:
  init_frame_edit_prompt: Edit the image to make the dashboard dark (ignition off) but show a key inserted
    in the ignition slot.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is dark (ignition off),
    and the driver-side window is fully closed. The driver leans forward. First, a hand reaches to the
    steering column and turns the ignition key; the dashboard lights illuminate. Then, the hand moves
    to the door armrest window switch and presses it downward. The window motor activates now that power
    is established. The driver leans back to the upright seated position. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The camera starts in upright driver POV with dark dashboard and window closed. The driver
    leans forward, camera moves to the ignition. A hand turns the key and the dash lights up. The camera/hand
    moves to the window switch. A hand presses the switch downward. The driver leans back to the original
    seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: View from the driver's seat of a car. A black steering wheel with a Suzuki logo
    and a yellow centering stripe is prominent. The dashboard instrument cluster is visible behind the
    wheel and is currently dark (unlit). To the left, the driver's side window is closed, with a 'Lemons
    Rally' sticker applied to the glass. Reflections of trees are visible on the window glass. The door
    panel is beige and black with window control switches on the armrest. Outside, a dirt road and trees
    are visible.
  init2final_edit_prompt: Edit the given image to show the car in an active state with the driver's window
    rolled down. Illuminate the dashboard instrument cluster with backlights and indicator lights to show
    the ignition is on. Remove the window glass and the 'Lemons Rally' sticker from the driver's side
    window frame to simulate the window being fully open. Ensure the view of the outside through the window
    frame is clear and free of glass reflections.
  rationale: The video describes a sequence where the driver turns on the ignition and then opens the
    window. Turning the ignition key causes the dashboard instrument cluster to illuminate (transition
    from dark to lit). Pressing the window switch downward activates the motor to roll the window down.
    Since the driver returns to the upright position at the end, the final camera view matches the initial
    perspective. Therefore, the final state should show the dashboard lights on and the window glass (along
    with the sticker attached to it) removed or lowered significantly.
  questions:
  - id: q1
    question: Is the dashboard instrument cluster illuminated?
    answer_type: yes_no
    notes_for_judge: Check if the gauges or warning lights are glowing/lit compared to the dark initial
      state.
  - id: q2
    question: Is the 'Lemons Rally' sticker no longer visible in its original position on the window?
    answer_type: yes_no
    notes_for_judge: The sticker is on the glass; if the window is down, the sticker should be gone or
      moved down.
  - id: q3
    question: Is the driver's side window open?
    answer_type: yes_no
    notes_for_judge: Look for the absence of glass or the absence of the sticker/reflections.
  - id: q4
    question: Are the reflections on the driver's side window glass gone?
    answer_type: yes_no
    notes_for_judge: If the window is down, the glass reflections of the trees/interior should disappear.
  - id: q5
    question: Does the view through the driver's window appear clearer than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Without the tinted/dirty glass, the outside view should be clearer.
  - id: q6
    question: Is the steering wheel in the same general position as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check; the driver sat back down, so the wheel should be centered
      in view again.
