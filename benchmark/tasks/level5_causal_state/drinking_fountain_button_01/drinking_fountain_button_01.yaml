id: drinking_fountain_button_01
level: 5
category: causal_mechanism
tags: []
variant_of: drinking_fountain_button
variation_type: initial_state
variation_description: Fountain starts ON; button press turns it OFF
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is active flow. Mechanism is treated as a toggle/latch. Trigger action
    stops the flow.
  expected_outcome_change: 'Water should stop flowing (Final state: OFF)'
prompts:
  init_frame_edit_prompt: Edit the image to show a clear arc of water flowing from the fountain spout,
    simulating that it is currently ON.
  video_WM: The camera starts centered on the drinking fountain spout with water flowing in an arc. The
    camera rotates right at constant speed until the spout exits the view. The camera continues rotating,
    revealing the push button on the side. A hand enters the frame and presses the button firmly. The
    button acts as a toggle for the water valve. When pressed, the valve closes to stop the water flow.
    The button press occurs while the fountain spout remains out of camera view. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the fountain spout back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the flowing fountain spout, then rotates to the side push button. A
    hand presses the button. The button toggles the valve closed. The camera then returns to the fountain
    spout. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a stainless steel circular drinking fountain basin.
    A clear stream of water is arcing from the metal spout on the left side of the basin towards the center.
    The background features a wall with light-colored square tiles.
  init2final_edit_prompt: Edit the given image to turn off the water fountain. Remove the arcing stream
    of water completely so that the spout appears inactive. Keep the stainless steel basin, the spout,
    and the tiled background exactly as they are, but show the fountain with no water flowing.
  rationale: The video prompt describes a camera movement that temporarily occludes the fountain spout
    to reveal a control button. A hand presses this button, which is defined as a toggle that closes the
    water valve. Since the water was initially flowing, this action stops the flow. The camera then returns
    to the original viewpoint. Therefore, the final frame should look identical to the initial frame in
    terms of camera angle and background, but the functional state of the fountain must change from 'active'
    (flowing water) to 'inactive' (no water).
  questions:
  - id: water_stopped_01
    question: Is the arcing stream of water absent in this frame?
    answer_type: yes_no
    notes_for_judge: The water flow should have stopped due to the button press.
  - id: water_stopped_02
    question: Does the drinking fountain spout appear to be inactive (not spraying water)?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame where water was clearly flowing.
  - id: water_stopped_03
    question: Is the space previously occupied by the water arc now clear?
    answer_type: yes_no
    notes_for_judge: The area between the spout and the basin center should be empty.
  - id: state_change_01
    question: Has the fountain transitioned from an 'on' state to an 'off' state?
    answer_type: yes_no
    notes_for_judge: The toggle button was pressed to close the valve.
  - id: spout_visibility_01
    question: Is the metal tip of the spout visible without water emerging from it?
    answer_type: yes_no
    notes_for_judge: The spout structure should be visible but dry/inactive.
  - id: consistency_01
    question: Are the background wall tiles still visible in the same position as the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returned to the original viewpoint.
  - id: consistency_02
    question: Is the circular stainless steel basin still the central object?
    answer_type: yes_no
    notes_for_judge: Ensure the object identity is preserved.
