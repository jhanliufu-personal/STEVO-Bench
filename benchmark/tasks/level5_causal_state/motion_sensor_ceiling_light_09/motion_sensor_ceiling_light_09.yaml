id: motion_sensor_ceiling_light_09
level: 5
category: causal_mechanism
tags: []
variant_of: motion_sensor_ceiling_light
variation_type: repeated_activation
variation_description: The hand triggers the sensor twice distinctly. Net result is no change.
changes:
  occlusion_method: null
  dynamic_conditions: Toggle logic activated twice.
  expected_outcome_change: No change (light remains OFF).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the dark ceiling light fixture. The camera rotates right at
    constant speed until the light fixture exits the view. The camera continues rotating right, revealing
    a motion sensor mounted on the wall. A hand enters the frame, waves to trigger the sensor, retracts,
    and then enters again to wave a second time. The sensor operates on a toggle logic, reversing the
    light's state with each confirmed motion event. These actions occur while the ceiling light remains
    out of view. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the ceiling light fixture back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ceiling light, then rotates to the motion sensor. A hand triggers
    the sensor twice. The sensor operates on toggle logic. The actions occur while the light is not visible.
    The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: The image shows a low-angle view of an empty, aged room. In the center of the
    white ceiling is an industrial-style light fixture featuring a glass dome or jar encased in a metal
    wire cage. Inside the glass, a light bulb is visible and is currently unlit (dark). The walls have
    peeling paint or plaster, giving the room a dilapidated look. On the left and right edges of the frame,
    parts of windows are visible, providing natural daylight which illuminates the scene. The floor is
    made of wide wooden planks.
  init2final_edit_prompt: Edit the given image to ensure the central ceiling light fixture remains completely
    unlit and dark. The light bulb inside the glass dome should appear inactive with no glow or incandescence.
    Maintain the existing natural lighting of the room and the appearance of the metal cage and glass
    texture without adding any artificial illumination from the fixture.
  rationale: The video prompt establishes that the light starts in the 'off' (dark) state. The camera
    rotates away to reveal a motion sensor. The prompt specifies a custom 'toggle logic' for the sensor,
    where each confirmed motion event reverses the light's state. The hand waves twice (two distinct events).
    The first wave toggles the light from Off to On. The second wave toggles the light from On back to
    Off. The camera then returns to the original view. Therefore, in the final frame, the light fixture
    must be in the 'off' state, visually identical to the initial state regarding the bulb's illumination.
