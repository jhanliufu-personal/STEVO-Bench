id: slider_thermostat_heat_01
level: 5
category: causal_mechanism
tags: []
variant_of: slider_thermostat_heat
variation_type: initial_state
variation_description: The vent starts with a ribbon blowing to indicate airflow (ON state); the slider
  starts at MAX and is moved to MIN.
changes:
  occlusion_method: null
  dynamic_conditions: 'Initial state is ACTIVE (blowing ribbon). Action is MAX -> MIN. Logic: Turning
    thermostat down stops airflow.'
  expected_outcome_change: The ribbon should stop blowing and hang limp (ON -> OFF).
prompts:
  init_frame_edit_prompt: Edit the image to add a bright orange ribbon tied to the vent louvers, blowing
    outwards vigorously to indicate active airflow.
  video_WM: The camera starts centered on the active heater vent, which has a ribbon blowing in the airflow.
    The camera rotates right at constant speed until the vent exits the view. The camera continues rotating,
    revealing a wall-mounted heater control with a horizontal slider. The slider is currently at the far
    right MAX position. A finger enters the frame and slides the control bar all the way to the far left
    MIN position. The slider remains at the minimum setting. The thermostat disengages the heating circuit
    when set below a threshold. The slider movement occurs while the heater vent remains out of camera
    view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing
    the heater vent back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the heater vent, then rotates to the temperature slider control. A finger
    moves the slider from MAX to MIN position. The thermostat disengages heating below threshold. The
    slider movement occurs while the vent is not visible. The camera then returns to the heater vent.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up view of a white, rectangular wall vent with horizontal louvers. An
    orange ribbon is tied to the center vertical support of the vent. The ribbon is blowing vigorously
    to the right and slightly upwards, indicating strong airflow coming from the vent. The background
    is a textured off-white wall.
  init2final_edit_prompt: Edit the given image so that the orange ribbon hangs limp and vertically downwards
    from the center of the vent, instead of blowing to the side. The ribbon should appear relaxed and
    draped due to gravity, indicating that there is no longer any airflow coming from the vent.
  rationale: The video sequence establishes a causal relationship between a thermostat control and the
    airflow from the vent. Initially, the heater is on, causing the ribbon to blow. The camera pans to
    reveal the thermostat, which is then adjusted from the maximum setting to the minimum setting. This
    action functionally turns off the heating system and the fan. When the camera pans back to the vent,
    the airflow has stopped as a result of the thermostat adjustment. Therefore, the ribbon should no
    longer be blowing but should hang limp due to gravity.
  questions:
  - id: ribbon_limp
    question: Is the orange ribbon hanging limp instead of blowing taut?
    answer_type: yes_no
    notes_for_judge: The ribbon should look relaxed, not stiff or extended by air pressure.
  - id: ribbon_direction_vertical
    question: Is the main body of the ribbon hanging downwards?
    answer_type: yes_no
    notes_for_judge: Gravity should pull the ribbon down if the air is off.
  - id: ribbon_not_blowing_right
    question: Is the ribbon no longer extending to the right side of the frame?
    answer_type: yes_no
    notes_for_judge: In the initial frame it blows right; now it should be down.
  - id: airflow_stopped
    question: Does the state of the ribbon indicate that the airflow has stopped?
    answer_type: yes_no
    notes_for_judge: Infer airflow from the ribbon's physics.
  - id: ribbon_lower_position
    question: Is the tip of the ribbon lower in the frame compared to the initial image?
    answer_type: yes_no
    notes_for_judge: Since it is no longer supported by air, it should fall.
  - id: vent_consistency
    question: Is the metal vent grille still visible and in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: wall_consistency
    question: Is the wall texture and color consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
