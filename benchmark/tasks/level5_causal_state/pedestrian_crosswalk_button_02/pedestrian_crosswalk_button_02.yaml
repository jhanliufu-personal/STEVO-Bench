id: pedestrian_crosswalk_button_02
level: 5
category: causal_mechanism
tags: []
variant_of: pedestrian_crosswalk_button
variation_type: initial_state
variation_description: Signal starts completely unlit/dark
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is unlit. Pressing button activates the system.
  expected_outcome_change: Signal changes from Dark to Red DON'T WALK (Hand).
prompts:
  init_frame_edit_prompt: Edit the pedestrian signal to appear completely dark/unlit, with no symbols
    visible.
  video_WM: The camera starts centered on the unlit pedestrian signal. The camera rotates right at constant
    speed until the signal exits the view. The camera continues rotating, revealing a pedestrian crossing
    button mounted on a pole at the curb. A hand enters the frame and presses the circular button firmly.
    The button sends an activation signal to the traffic light controller. The button press occurs while
    the crossing signal remains out of camera view. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the pedestrian crossing signal back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A hand presses the pedestrian button. The button sends an activation signal to the traffic
    controller. The button press occurs while the crossing signal is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A rainy urban street scene featuring a yellow pedestrian signal box mounted
    on a grey pole in the immediate foreground. The rectangular face of the signal is currently unlit
    (dark/black). To the left, white crosswalk stripes are painted on the wet asphalt. The background
    shows a city street receding into the distance with wet pavement, several cars including a white sedan
    and a dark SUV, and pedestrians holding umbrellas on the sidewalk. Tall buildings line the street.
  init2final_edit_prompt: Edit the given image to illuminate the pedestrian signal in the foreground.
    Change the dark rectangular face of the yellow signal box to display a bright white 'Walk' symbol
    (a stylized icon of a walking person). Ensure the symbol is glowing and clearly visible against the
    dark background of the signal face. Keep the yellow housing, the mounting pole, the rainy weather,
    the wet pavement, and the background street scene with cars and buildings unchanged.
  rationale: The video sequence depicts a causal interaction where a button is pressed to request a pedestrian
    crossing. Although the signal is out of view during the press, the 'activation signal' sent to the
    controller implies that the system responds. Upon returning to the original view, the functional consequence
    of this action should be visible. The standard active state for a pedestrian signal following a button
    press is the illumination of the 'Walk' indicator. Therefore, the final frame must show the signal
    transitioned from its initial unlit state to an illuminated state displaying the walking person symbol.
  questions:
  - id: signal_illuminated
    question: Is the pedestrian signal face now illuminated?
    answer_type: yes_no
    notes_for_judge: The signal face should no longer be dark/black.
  - id: walk_symbol_visible
    question: Is a white 'Walk' symbol (walking person icon) visible on the signal?
    answer_type: yes_no
    notes_for_judge: Look for the specific icon of a walking person.
  - id: signal_emitting_light
    question: Is the rectangular screen of the signal box emitting light?
    answer_type: yes_no
    notes_for_judge: It should appear bright/glowing compared to the initial dark state.
  - id: state_transition_occurred
    question: Has the signal transitioned from an unlit state to an active state?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame where the signal was off.
  - id: light_color_white
    question: Is the light displayed on the signal white?
    answer_type: yes_no
    notes_for_judge: The Walk signal is typically white.
  - id: housing_consistency
    question: Is the yellow signal housing still present in the foreground?
    answer_type: yes_no
    notes_for_judge: The physical object should remain, only the light changes.
  - id: background_consistency
    question: Does the background still depict a rainy street scene with cars?
    answer_type: yes_no
    notes_for_judge: The environment should not change significantly.
