id: car_window_switch_02
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: initial_state
variation_description: Window starts half open; action is 'pull up' to close it
changes:
  occlusion_method: null
  dynamic_conditions: Window starts half-open. Action is pulling switch UP (closing).
  expected_outcome_change: Window transitions from Half-Open to Closed
prompts:
  init_frame_edit_prompt: Edit the image to show the driver-side window rolled halfway down, with the
    top edge of the glass visible in the middle of the frame.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is halfway open. The driver leans forward toward the door panel; the window is no longer visible.
    The window control switch panel on the door armrest comes into view. A hand hooks fingers under the
    driver window switch and pulls it upward. The window switch is part of the car's electrical system;
    the direction of actuation determines the motor behavior. The driver leans back to the upright seated
    position. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window halfway
    open. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch. A hand hooks fingers under the switch and pulls it upward. The action occurs while the window
    is not visible. The driver leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A first-person view from the driver's seat of a car. A black steering wheel
    with a yellow center marker and Suzuki logo is prominent. The dashboard gauges are illuminated with
    orange light. To the left, the driver's side door panel is visible with a beige armrest and black
    trim. The side window glass is visible, bearing a 'Lemons Rally' text sticker. Outside, a dirt road
    and trees are seen through the dirty window glass.
  init2final_edit_prompt: Edit the image to simulate the driver's side window rolling up. Move the 'Lemons
    Rally' sticker upwards in the frame to reflect the glass rising. If the upward movement places the
    sticker outside the visible area, remove it. Ensure the window glass covers the window opening. Keep
    the steering wheel, dashboard, and background scenery unchanged.
  rationale: The prompt describes the driver pulling the window control switch upward. In automotive electrical
    systems, pulling the switch up actuates the motor to raise (close) the window. Since the window is
    initially described as 'halfway open', this action causes the glass to move upward. Consequently,
    the 'Lemons Rally' sticker attached to the glass must move higher in the frame or disappear if it
    travels beyond the upper edge of the view. The driver returns to the initial upright position, restoring
    the original camera angle.
  questions:
  - id: sticker_position
    question: Is the 'Lemons Rally' sticker either positioned higher in the frame or no longer visible
      compared to the initial image?
    answer_type: yes_no
    notes_for_judge: The sticker should move up with the window glass. If it moves out of frame, the answer
      is Yes.
  - id: window_direction
    question: Does the window state indicate that the glass has moved in the upward direction?
    answer_type: yes_no
    notes_for_judge: Upward movement corresponds to closing the window.
  - id: sticker_moved
    question: Is the 'Lemons Rally' sticker in a different position than in the initial frame?
    answer_type: yes_no
    notes_for_judge: It should have moved up.
  - id: steering_wheel_invariant
    question: Is the steering wheel still centered with the yellow marker at the top?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: dashboard_invariant
    question: Are the dashboard gauge lights still illuminated?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: background_invariant
    question: Is the outdoor scenery (trees and road) still visible through the window?
    answer_type: yes_no
    notes_for_judge: The window glass is transparent/tinted, so the background should remain visible.
