id: car_window_switch_02
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: initial_state
variation_description: The window starts halfway open. Pressing 'down' opens it fully.
changes:
  occlusion_method: null
  dynamic_conditions: 'Initial state is ''window half open''. Switch logic: Down=Open. Half+Down=Full
    Open.'
  expected_outcome_change: The window moves from half-open to fully open.
prompts:
  init_frame_edit_prompt: Edit the image so the driver-side window is rolled halfway down, with the top
    edge of the glass visible horizontally across the middle of the window frame.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is partially open — the top edge of the glass is visible halfway up the frame. The driver leans
    forward toward the door panel; the window and exterior are no longer visible. The window control switch
    panel on the door armrest comes into view. A hand presses the lower side of the driver window switch
    downward. The window switch is part of the car's electrical system and operates only when the ignition
    is on; the direction pressed determines the behavior of the window motor. The driver leans back to
    the upright seated position. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window partially
    open. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch on the door armrest. A hand presses the lower side of the switch downward. The window switch
    is part of the electrical system and operates only with ignition on; the direction pressed determines
    the window motor behavior. The action occurs while the window is not visible. The driver leans back
    to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A view from the driver's seat of a car interior. A hand is holding the black
    steering wheel on the right side. The dashboard instrument cluster is illuminated with red lights.
    On the left, the driver's side door panel is visible, featuring a beige lower section, a black upper
    section, a silver door handle, and window control switches on the armrest. A side mirror is visible
    through the window frame, reflecting the street behind. The street scene outside includes cars, trees,
    and buildings. The window glass is present in the frame.
  init2final_edit_prompt: Edit the image to show the driver's side window fully rolled down. Remove any
    visible window glass, tint, or reflections from the window opening area above the door panel. The
    view of the street and side mirror should remain visible but appear clearly through the open air without
    any glass obstruction.
  rationale: The prompt describes the driver pressing the window control switch downward. In a car with
    the ignition on (indicated by the lit dashboard), pressing the switch down activates the motor to
    lower (open) the window. Although the window is occluded during the interaction, the functional result
    of this action is that the window rolls down. When the view returns to the initial position, the window
    glass should be gone or significantly lower than in the initial state.
  questions:
  - id: window_state_open
    question: Is the driver's side window rolled down compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The window should appear open, meaning the glass is lowered or gone.
  - id: glass_visibility
    question: Is the window glass less visible or completely absent from the window frame?
    answer_type: yes_no
    notes_for_judge: Check for the absence of the glass pane or its edge.
  - id: reflections_removed
    question: Are reflections on the window glass removed or significantly reduced?
    answer_type: yes_no
    notes_for_judge: An open window should not show surface reflections typical of glass.
  - id: view_clarity
    question: Does the view through the window frame appear clearer, indicating the glass is down?
    answer_type: yes_no
    notes_for_judge: The lack of tint or glass distortion indicates the window is open.
  - id: mechanism_result
    question: Does the final image show the result of the window being opened?
    answer_type: yes_no
    notes_for_judge: The causal link is switch down -> window opens.
  - id: dashboard_lit
    question: Is the dashboard instrument cluster still illuminated?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: steering_wheel_pos
    question: Is the steering wheel in the same position as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
