id: sprinkler_valve_control_06
level: 5
category: causal_mechanism
tags: []
variant_of: sprinkler_valve_control
variation_type: precondition_failure
variation_description: The sprinkler head is wrapped in duct tape, preventing water from exiting.
changes:
  occlusion_method: null
  dynamic_conditions: Sprinkler output is sealed with tape. Valve opens. Pressure builds but no spray.
  expected_outcome_change: Sprinkler remains inactive (no spray visible).
prompts:
  init_frame_edit_prompt: Edit the image to show the sprinkler head completely wrapped in thick silver
    duct tape.
  video_WM: The camera starts centered on the inactive, tape-wrapped sprinkler head on the dry grass.
    The camera rotates right at constant speed until the sprinkler exits the view. The camera continues
    rotating, revealing a manual water valve mounted on a pipe near the wall. The valve handle is currently
    in the closed position. A hand enters the frame and rotates the valve handle counterclockwise to the
    open position. The valve sends water to the sprinkler, but the tape seals the nozzle. The valve rotation
    occurs while the sprinkler head remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the taped sprinkler head back into center
    view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scene features a sprinkler head wrapped in duct tape and a manual water valve. A hand
    opens the valve by rotating it counterclockwise. The valve sends water to the sprinkler, but the tape
    seals the nozzle. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal sprinkler head wrapped extensively in
    silver duct tape, sitting on a patch of dry, yellowed grass. A dirty, beige garden hose is attached
    to the sprinkler and extends out of the frame to the right. The scene is brightly lit with distinct
    shadows indicating a sunny day.
  init2final_edit_prompt: Edit the given image to show the sprinkler head under internal water pressure.
    Make the silver duct tape wrapping appear swollen, bulging, and distended outward. Add small water
    droplets leaking from the seams of the tape and a small dark wet spot on the dry grass directly beneath
    the sprinkler head to indicate leakage. Keep the background grass mostly dry and the camera angle
    unchanged.
  rationale: The video prompt describes a sequence where the camera pans away to reveal a manual valve
    being opened, sending water to the sprinkler. Since the sprinkler head is taped shut, the water pressure
    will cause the flexible duct tape to bulge, swell, and likely leak slightly at the seams. The final
    frame captures this pressurized state after the camera returns to the original view, showing the physical
    consequences of the valve activation on the occluded object.
