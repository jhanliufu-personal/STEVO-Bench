id: automatic_toilet_flush_01
level: 5
category: causal_mechanism
mechanism_type: proximity_sensor_valve_logic
prompts:
  image_gen_prompt: A toilet bowl is shown from the front. The water level is stable and calm, not flushing. The camera view is centered on the toilet bowl.
  video_WM: The camera starts centered on the toilet bowl with stable water level. The camera rotates up and back at constant speed until the bowl exits the view. The camera continues rotating toward the wall behind the toilet, revealing the automatic flush sensor module mounted on the flush valve pipe. A hand enters the frame and waves in front of the sensor. The sensor uses infrared detection to identify when a user has moved away from the detection zone, triggering the flush valve solenoid to release water. The hand wave occurs while the toilet bowl remains out of camera view. Then the camera rotates down and forward smoothly at the same rate back to the original viewpoint, bringing the toilet bowl back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the toilet bowl, then rotates to the flush sensor on the wall pipe. A hand waves in front of the sensor. The sensor detects presence changes and triggers the flush valve. The hand wave occurs while the bowl is not visible. The camera then returns to the toilet bowl. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
