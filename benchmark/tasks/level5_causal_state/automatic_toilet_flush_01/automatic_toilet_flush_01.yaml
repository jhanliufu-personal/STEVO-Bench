id: automatic_toilet_flush_01
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_toilet_flush
variation_type: initial_state
variation_description: The toilet starts in an active flushing state; the trigger action acts as a stop/toggle.
changes:
  occlusion_method: null
  dynamic_conditions: The system is initially active (water swirling). The sensor wave toggles the valve
    closed.
  expected_outcome_change: The toilet bowl should be stable (water stopped swirling) instead of flushing.
prompts:
  init_frame_edit_prompt: Edit the image so the water in the toilet bowl is swirling and agitated, indicating
    an active flush cycle.
  video_WM: The camera starts centered on the toilet bowl, which shows swirling, agitated water from an
    active flush. The camera rotates right at constant speed until the bowl exits the view. The camera
    continues rotating, revealing the automatic flush sensor module on the wall. A hand enters the frame
    and waves in front of the sensor to toggle the mechanism. The hand wave occurs while the toilet bowl
    remains out of camera view. Then the camera rotates left smoothly back to the original viewpoint,
    bringing the toilet bowl back into center view. STOP.
  camera_WM: The scene features a toilet bowl initially in an active flushing state and a wall-mounted
    sensor. A hand waves in front of the sensor, toggling the valve mechanism. This action occurs while
    the bowl is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A high-angle, close-up shot centered on a white ceramic toilet bowl. The toilet
    seat is white and is in the down position. Inside the bowl, the water is visibly agitated and swirling,
    with a distorted surface indicating an active flush. The bottom of the bowl is partially visible through
    the moving water. The floor is covered with light-colored square tiles, and a beige textured bath
    mat is visible at the bottom of the frame. To the right, a white vertical surface (likely a cabinet
    or wall) is partially visible.
  init2final_edit_prompt: Edit the given image to show the water in the toilet bowl as highly agitated,
    swirling, and turbulent, representing an active flush cycle. Ensure the water surface is distorted
    with ripples and movement. Keep the toilet bowl, seat, floor tiles, and rug unchanged.
  rationale: The initial frame shows an active flush. The camera pans away for a duration that would typically
    allow the initial flush to complete and the water to settle to a still state. However, the prompt
    specifies that a hand waves at the sensor to 'toggle' the mechanism. For an automatic flush sensor,
    this action triggers a new flush cycle. Therefore, when the camera returns, the water should be agitated
    and swirling again (due to the re-triggering), rather than having settled to a calm state. The evaluation
    verifies that the system correctly simulates the causal effect of the sensor trigger by maintaining
    or restarting the active flush state.
