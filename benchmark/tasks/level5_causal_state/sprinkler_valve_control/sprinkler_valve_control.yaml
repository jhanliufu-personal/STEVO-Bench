id: sprinkler_valve_control
level: 5
category: causal_mechanism
mechanism_type: valve_flow_logic
prompts:
  image_gen_prompt: A lawn sprinkler head sits on dry grass. The sprinkler is currently inactive with
    no water flowing. The camera view is centered on the sprinkler head.
  video_WM: The camera starts centered on the inactive sprinkler head on the dry grass. The camera rotates
    right at constant speed until the sprinkler exits the view. The camera continues rotating, revealing
    a manual water valve mounted on a pipe near the wall. The valve handle is currently in the closed
    position. A hand enters the frame and rotates the valve handle counterclockwise from the closed position
    to the open position. The sprinkler is connected to a pressurized water line controlled by this valve.
    When the valve opens, water can flow through the system to the sprinkler head. The valve rotation
    occurs while the sprinkler head remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the sprinkler head back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the inactive sprinkler head, then rotates to the water valve. A hand
    opens the valve by rotating it counterclockwise. The valve controls water flow to the pressurized
    line connected to the sprinkler. The valve opening occurs while the sprinkler is not visible. The
    camera then returns to the sprinkler head. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
