id: sprinkler_valve_control
level: 5
category: causal_mechanism
mechanism_type: valve_flow_logic
prompts:
  image_gen_prompt: A lawn sprinkler head sits on dry grass. The sprinkler is currently inactive with
    no water flowing. The camera view is centered on the sprinkler head.
  video_WM: The camera starts centered on the inactive sprinkler head on the dry grass. The camera rotates
    right at constant speed until the sprinkler exits the view. The camera continues rotating, revealing
    a manual water valve mounted on a pipe near the wall. The valve handle is currently in the closed
    position. A hand enters the frame and rotates the valve handle counterclockwise from the closed position
    to the open position. The sprinkler is connected to a pressurized water line controlled by this valve.
    When the valve opens, water can flow through the system to the sprinkler head. The valve rotation
    occurs while the sprinkler head remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the sprinkler head back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the inactive sprinkler head, then rotates to the water valve. A hand
    opens the valve by rotating it counterclockwise. The valve controls water flow to the pressurized
    line connected to the sprinkler. The valve opening occurs while the sprinkler is not visible. The
    camera then returns to the sprinkler head. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal impact sprinkler head mounted on a short
    riser in a field of dry, yellow grass. The sprinkler is connected to a hose or pipe running horizontally
    near the ground. The ground is parched and cracked. The sprinkler is currently inactive, dry, and
    stationary.
  init2final_edit_prompt: Edit the given image to show the sprinkler actively spraying water. Add a visible
    stream or jet of water shooting out from the nozzle of the impact sprinkler. Include water mist and
    droplets in the air around the mechanism to indicate active irrigation. Make the surface of the sprinkler
    head appear wet.
  rationale: The video prompt describes a sequence where the camera pans away from the sprinkler to a
    valve, a user opens the valve, and the camera pans back. The valve controls the water flow to the
    sprinkler. Since the valve is transitioned from closed to open, the functional result is that water
    flows to the sprinkler. Upon the camera's return, the sprinkler must be active and spraying water,
    representing a state change caused by the off-screen interaction.
  questions:
  - id: q1_spray_visible
    question: Is the sprinkler spraying water in the final frame?
    answer_type: yes_no
    notes_for_judge: Look for a stream of water or mist exiting the nozzle.
  - id: q2_stream_presence
    question: Is there a visible stream or jet of water exiting the sprinkler nozzle?
    answer_type: yes_no
    notes_for_judge: The primary functional change is the presence of the water jet.
  - id: q3_mist_droplets
    question: Are there water droplets or mist visible in the air around the sprinkler?
    answer_type: yes_no
    notes_for_judge: Active sprinklers create mist/spray.
  - id: q4_active_state
    question: Does the sprinkler appear to be active/operating compared to the initial inactive state?
    answer_type: yes_no
    notes_for_judge: Compare against the static, dry initial frame.
  - id: q5_wet_head
    question: Does the sprinkler head itself appear wet or glistening?
    answer_type: yes_no
    notes_for_judge: Water flowing through the device usually wets the exterior.
  - id: q6_consistency_object
    question: Is the metal sprinkler head still present in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The object should not disappear.
  - id: q7_consistency_pipe
    question: Is the connecting hose or pipe still visible at the base?
    answer_type: yes_no
    notes_for_judge: Structural consistency check.
