id: string_pull_lamp
level: 5
category: causal_mechanism
mechanism_type: mechanical_toggle_logic
prompts:
  image_gen_prompt: A hanging workshop lamp with a long beaded pull-string. The lamp is currently off.
    A hand is reaching for the end of the string.
  video_WM: The hand grabs the beaded string and pulls it downward firmly until a mechanical click is
    heard, then releases it. The camera rotates right until the lamp completely exits the view, then rotates
    toward the left smoothly at the same rate until the bulb of the lamp is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The pull-string is tugged downward to engage the internal toggle switch and then released.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
