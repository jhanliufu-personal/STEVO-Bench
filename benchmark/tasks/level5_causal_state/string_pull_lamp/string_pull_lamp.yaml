id: string_pull_lamp
level: 5
category: causal_mechanism
mechanism_type: mechanical_toggle_logic
prompts:
  image_gen_prompt: A hanging workshop lamp with the bulb visible. The lamp is currently off (not glowing). The camera view is centered on the lamp bulb.
  video_WM: The camera starts centered on the dark lamp bulb. The camera rotates right at constant speed until the bulb exits the view. The camera continues rotating, revealing the beaded pull-string hanging down. A hand enters the frame, grabs the beaded string, and pulls it downward firmly until a mechanical click is heard, then releases it. The lamp contains an internal toggle switch mechanism that changes state with each pull. The string pull occurs while the lamp bulb remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the lamp bulb back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the lamp bulb, then rotates to the pull-string. A hand pulls the string downward to engage the internal toggle switch. The string pull occurs while the bulb is not visible. The camera then returns to the lamp bulb. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
