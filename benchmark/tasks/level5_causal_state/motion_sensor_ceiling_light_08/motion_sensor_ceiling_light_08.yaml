id: motion_sensor_ceiling_light_08
level: 5
category: causal_mechanism
tags: []
variant_of: motion_sensor_ceiling_light
variation_type: repeated_activation
variation_description: The hand waves, waits, and waves again (toggle ON then toggle OFF). Net result
  is no change.
changes:
  occlusion_method: null
  dynamic_conditions: Toggle logic activated twice (OFF -> ON -> OFF).
  expected_outcome_change: No change (light remains OFF).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the dark ceiling light fixture. The camera rotates right at
    constant speed until the light fixture exits the view. The camera continues rotating right, revealing
    a motion sensor mounted on the wall. A hand enters the frame and waves in front of the motion sensor,
    pauses for a moment, and then waves a second time. The sensor is a toggle-type PIR detector; each
    detected motion event flips the state of the relay (Off to On, or On to Off). The double activation
    occurs while the ceiling light remains out of view. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the ceiling light fixture back into center view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ceiling light, then rotates to the motion sensor. A hand waves,
    pauses, and waves again in front of the sensor. The sensor is a toggle-type detector. The double activation
    occurs while the light is not visible. The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A centered view of a vintage industrial ceiling light fixture in a room with
    distressed white walls. The fixture consists of a glass jar enclosure surrounded by a wire cage, mounted
    on a metal base. Inside the glass, a light bulb is visible and is currently unlit (dark). The ceiling
    and walls show signs of peeling paint and age. Natural daylight enters from windows visible on the
    far left and right edges of the frame. The floor is composed of wide wooden planks.
  init2final_edit_prompt: Edit the given image to ensure the central ceiling light fixture remains completely
    unlit and dark. The light bulb inside the glass jar enclosure must be off, with no glowing filament
    or internal illumination. The lighting on the surrounding ceiling and walls should reflect only the
    natural daylight from the windows, consistent with the artificial light being turned off. Preserve
    the texture of the peeling paint and the wooden floor.
  rationale: The initial state of the ceiling light is off (dark). The prompt specifies a 'toggle-type'
    motion sensor where each detected motion event flips the state of the relay (Off to On, or On to Off).
    The action sequence involves a hand waving twice ('double activation') in front of the sensor. Starting
    from the 'Off' state, the first wave toggles the light 'On'. The second wave toggles the light back
    'Off'. The camera returns to the fixture after these events are complete. Therefore, the correct final
    state is that the light fixture is off, returning to its initial dark state.
