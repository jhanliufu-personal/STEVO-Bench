id: fuse_box_completion_00
level: 5
category: causal_mechanism
tags: []
variant_of: fuse_box_completion
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add an open industrial fuse box mounted on the brick wall
    to the left of the fan. The fuse box should be clearly visible and feature an empty slot where a ceramic
    fuse is missing. Ensure the style, lighting, and texture of the fuse box match the existing industrial
    environment and electrical conduit on the wall.
  video_WM: The camera is completely stationary, capturing both the industrial floor fan in the center
    and the open fuse box on the wall to the left. A hand enters the frame holding a new ceramic fuse.
    The hand reaches over to the fuse box and firmly presses the fuse into the empty gap. The hand then
    withdraws from the fuse box. Both the fan and the fuse box remain fully visible throughout the sequence.
    STOP.
  camera_WM: The camera is completely stationary, capturing both the industrial floor fan in the center
    and the open fuse box on the wall to the left. A hand enters the frame holding a new ceramic fuse.
    The hand reaches over to the fuse box and firmly presses the fuse into the empty gap. The hand then
    withdraws from the fuse box. Both the fan and the fuse box remain fully visible throughout the sequence.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A stationary shot of an industrial workshop interior. On the left, mounted on
    a brick wall, is an open, weathered metal fuse box containing three vertical fuse slots; the left
    and right slots hold cylindrical cartridge fuses, while the middle slot is empty, exposing the metal
    contacts. In the center stands a large industrial floor fan with a wire mesh cage and metal blades,
    resting on a tubular stand with wheels. The background shows workshop windows, shelving, and machinery.
  init2final_edit_prompt: Edit the given image to show a new cylindrical ceramic fuse installed in the
    previously empty middle slot of the open fuse box on the left. The new fuse should be positioned vertically
    between the contacts, matching the orientation and style of the existing fuses in the adjacent slots.
    Remove any hand or person from the scene. Ensure the fan and the rest of the workshop background remain
    unchanged.
  rationale: 'The video prompt describes a specific physical intervention: a hand inserts a missing fuse
    into the empty middle slot of the fuse box and then withdraws. The causal outcome is that the previously
    empty slot is now occupied by a fuse. Since the prompt does not explicitly state that the fan turns
    on or that the circuit is live, the primary state change is the completion of the fuse configuration.
    The final frame must show the fuse box with three fuses and no hand present.'
  questions:
  - id: fuse_present_middle
    question: Is the middle slot of the fuse box now occupied by a fuse?
    answer_type: yes_no
    notes_for_judge: Check the fuse box on the left. The middle slot, which was empty in the initial frame,
      should now contain a fuse.
  - id: fuse_count_three
    question: Are there now three fuses visible in the fuse box instead of two?
    answer_type: yes_no
    notes_for_judge: Count the vertical cylindrical objects in the fuse box.
  - id: gap_filled
    question: Is the previously empty gap between the left and right fuses now filled?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame where the center gap was empty.
  - id: fuse_orientation
    question: Is the object in the middle slot oriented vertically like the other fuses?
    answer_type: yes_no
    notes_for_judge: The fuse should be vertical to fit the contacts.
  - id: hand_withdrawn
    question: Is the hand completely absent from the image?
    answer_type: yes_no
    notes_for_judge: The prompt states the hand withdraws, so it should not be visible in the final state.
  - id: fan_position
    question: Is the industrial fan still present in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The fan should not have moved.
  - id: box_open
    question: Is the fuse box door still open?
    answer_type: yes_no
    notes_for_judge: The prompt does not mention closing the door.
