id: car_window_switch_03
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: initial_state
variation_description: Window starts slightly ajar; action is 'pull up' to close it
changes:
  occlusion_method: null
  dynamic_conditions: Window starts slightly ajar. Action is pulling switch UP (closing).
  expected_outcome_change: Window transitions from Ajar to Fully Closed
prompts:
  init_frame_edit_prompt: Edit the image to show the driver-side window slightly cracked open (ajar) at
    the top.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is slightly ajar. The driver leans forward toward the door panel; the window is no longer visible.
    The window control switch panel on the door armrest comes into view. A hand hooks fingers under the
    driver window switch and pulls it upward to seal the window. The window switch is part of the car's
    electrical system. The driver leans back to the upright seated position. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window slightly
    ajar. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch. A hand hooks fingers under the switch and pulls it upward. The action occurs while the window
    is not visible. The driver leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A driver's point-of-view shot inside a car, showing a racing steering wheel
    with a Suzuki logo and a yellow center marker. The dashboard is illuminated with orange gauges and
    warning lights. The driver's left hand is on the wheel. The driver-side window is partially open (ajar),
    with a visible gap of open air between the top edge of the glass and the window frame. A 'Lemons Rally'
    text sticker is adhered to the window glass. Outside, a dirt road and trees are visible.
  init2final_edit_prompt: Edit the given image to show the driver's side window fully closed. Extend the
    window glass upward to completely fill the gap at the top of the window frame, eliminating the open
    air space. Shift the 'Lemons Rally' sticker upwards on the glass to reflect the new closed position
    of the window. Keep the driver's hand on the steering wheel and the camera angle identical to the
    original view.
  rationale: The video prompt describes a functional action where the driver uses the window control switch
    to seal the window. Although the interaction with the switch is occluded or involves camera movement,
    the final state requires the driver to return to the initial upright position. The causal consequence
    of pulling the window switch up is that the electric window motor raises the glass. Therefore, the
    final frame must show the window fully closed, with the glass filling the previous gap and the sticker
    moved upward.
