id: atm_card_screen_00
level: 5
category: causal_mechanism
tags: []
variant_of: atm_card_screen
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add a card insertion slot to the metal panel below the ATM
    screen, ensuring it matches the machine's metallic texture and lighting.
  video_WM: The camera is completely stationary, framing the ATM screen which displays "INSERT CARD TO
    BEGIN" and the card insertion slot on the panel below. A hand holding a bank card enters the view
    and slides the card into the insertion slot. Both the screen and the slot remain fully visible throughout
    the action. STOP.
  camera_WM: The camera is completely stationary, framing the ATM screen which displays "INSERT CARD TO
    BEGIN" and the card insertion slot on the panel below. A hand holding a bank card enters the view
    and slides the card into the insertion slot. Both the screen and the slot remain fully visible throughout
    the action. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of an outdoor ATM interface at dusk. The central
    focus is a CRT screen displaying the text 'INSERT CARD TO BEGIN' in cyan pixelated font on a black
    background. Below the screen is a brushed metal panel containing a horizontal black card insertion
    slot in the center. To the right of the slot is a circular device illuminated with a blue LED ring.
    Below the slot, a numeric keypad is partially visible. The background reflects a street scene with
    blurred lights.
  init2final_edit_prompt: Edit the given image to reflect the state of the ATM screen after a card has
    been inserted. Change the text on the screen from 'INSERT CARD TO BEGIN' to a next-step prompt such
    as 'ENTER PIN', 'PLEASE WAIT', or 'SELECT LANGUAGE'. Maintain the original screen font style and color
    (cyan on black).
  rationale: 'The video prompt describes the physical action of inserting a bank card into the ATM. This
    physical input acts as a causal trigger for the machine''s software. The expected functional outcome
    is a state transition in the user interface: the screen must update from the idle message (''INSERT
    CARD TO BEGIN'') to the active transaction phase (typically requesting a PIN or language selection).
    The evaluation focuses on this screen update as evidence that the system responded to the user''s
    action.'
