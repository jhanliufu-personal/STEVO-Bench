id: car_hood_release_00
level: 5
category: causal_mechanism
tags: []
variant_of: car_hood_release
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add a clearly visible hood release lever on the dashboard
    panel to the left of the steering wheel, positioned below the air vent so it is fully visible within
    the frame.
  video_WM: Stationary driver's POV. The closed car hood is visible through the windshield. A hood release
    lever is visible on the dashboard to the left of the steering wheel. A hand reaches into the frame,
    grips the hood release lever, and pulls it firmly. STOP.
  camera_WM: Stationary driver's POV. The closed car hood is visible through the windshield. A hood release
    lever is visible on the dashboard to the left of the steering wheel. A hand reaches into the frame,
    grips the hood release lever, and pulls it firmly. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A driver's point-of-view shot from inside a blue Corvette C7. The steering wheel
    with the Corvette logo is central. The digital instrument cluster shows 0 MPH. To the left of the
    steering wheel, on the dashboard, is a control panel with buttons, including a release button with
    a car icon. Through the windshield, the blue car hood is visible, currently closed and flush with
    the side fenders. A suburban street with trees and parked cars is visible in the background.
  init2final_edit_prompt: Edit the given image to show the car hood unlatched and popped open. The rear
    edge of the hood (closest to the windshield) should be raised vertically, creating a visible gap between
    the hood panel and the side fenders/cowl. Include a hand visible on the left side of the dashboard,
    gripping the release control.
  rationale: The prompt describes pulling the hood release lever. In this vehicle (Corvette C7), the hood
    is front-hinged, meaning the latch mechanism is located at the rear near the windshield. Consequently,
    when the release is pulled, the rear edge of the hood pops upward due to spring tension, breaking
    the flush line with the fenders. The final frame must depict this specific mechanical state change
    (hood ajar at the cowl) and the hand performing the action.
