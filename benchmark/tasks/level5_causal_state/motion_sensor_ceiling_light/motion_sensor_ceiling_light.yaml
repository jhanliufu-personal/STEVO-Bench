id: motion_sensor_ceiling_light
level: 5
category: causal_mechanism
mechanism_type: proximity_sensor_trigger
tags: []
prompts:
  image_gen_prompt: A ceiling light fixture is mounted on the ceiling and currently off (dark). The room has plain walls. The camera view is centered on the light fixture.
  video_WM: The camera starts centered on the dark ceiling light fixture. The camera rotates right at constant speed until the light fixture exits the view. The camera continues rotating right, revealing a motion sensor mounted on the wall. A hand enters the frame and waves in front of the motion sensor. The sensor is a passive infrared (PIR) detector that monitors for changes in infrared radiation patterns. When a warm object moves within the detection zone, the sensor registers a change in the IR field. The sensor is wired to a relay that controls the ceiling light circuit. The relay has two states - open or closed. When the sensor detects motion above its threshold, it can trigger the relay to change state. The hand waves while the ceiling light remains out of view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the ceiling light fixture back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ceiling light, then rotates to the motion sensor. A hand waves in front of the sensor. The sensor is a PIR detector monitoring IR radiation patterns. When motion is detected above threshold, it can trigger a relay controlling the light circuit. The relay has two states. The hand motion occurs while the light is not visible. The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
