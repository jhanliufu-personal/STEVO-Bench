id: thermostat_threshold_dial
level: 5
category: causal_mechanism
mechanism_type: threshold_logic
prompts:
  image_gen_prompt: A round analog thermostat dial. The current temperature needle is at 60 degrees. The
    setting dial is currently at 50 degrees. A red heating element is visible in the background.
  video_WM: A hand rotates the setting dial clockwise until the marker reaches 80 degrees, well past the
    current temperature needle. The thermostat is active. The camera rotates right until the dial completely
    exits the view, then rotates toward the left smoothly at the same rate until the heating element in
    the background is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The thermostat setting is increased to 80 degrees, surpassing the ambient temperature threshold
    and triggering the heating circuit. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
