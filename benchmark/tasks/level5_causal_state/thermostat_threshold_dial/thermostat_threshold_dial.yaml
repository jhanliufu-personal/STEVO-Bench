id: thermostat_threshold_dial
level: 5
category: causal_mechanism
mechanism_type: threshold_logic
prompts:
  image_gen_prompt: A red heating element is visible. The heating element is currently off (not glowing). The camera view is centered on the heating element.
  video_WM: The camera starts centered on the inactive red heating element. The camera rotates right at constant speed until the heating element exits the view. The camera continues rotating, revealing a round analog thermostat dial mounted on the wall. The current temperature needle shows 60 degrees. The setting dial is currently at 50 degrees (below ambient). A hand enters the frame and rotates the setting dial clockwise until the marker reaches 80 degrees, well past the current temperature needle. When the thermostat setting exceeds the ambient temperature, the circuit can engage heating. The dial rotation occurs while the heating element remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the heating element back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the heating element, then rotates to the thermostat dial. A hand rotates the setting dial from 50 to 80 degrees, surpassing the ambient temperature of 60 degrees. The thermostat engages heating when setting exceeds ambient. The dial rotation occurs while the heating element is not visible. The camera then returns to the heating element. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
