id: rotary_valve_supply_00
level: 5
category: causal_mechanism
tags: []
variant_of: rotary_valve_supply
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to replace the small metal butterfly valve handle on the horizontal
    pipe to the right with a bright yellow lever-style gas valve handle. The yellow handle should be oriented
    perpendicular to the pipe to indicate the closed position. Ensure the new handle blends naturally
    with the rusty texture of the pipe and the workshop lighting.
  video_WM: The camera is completely stationary, showing the metal burner nozzle on the left and the supply
    pipe with a yellow valve handle on the right. The yellow handle is initially in the closed position,
    perpendicular to the pipe. A hand enters the frame, grasps the yellow handle, and rotates it 90 degrees
    until it is parallel with the pipe. The hand releases the handle and withdraws from the scene. STOP.
  camera_WM: The camera is completely stationary, showing the metal burner nozzle on the left and the
    supply pipe with a yellow valve handle on the right. The yellow handle is initially in the closed
    position, perpendicular to the pipe. A hand enters the frame, grasps the yellow handle, and rotates
    it 90 degrees until it is parallel with the pipe. The hand releases the handle and withdraws from
    the scene. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal burner assembly in a workshop. On the
    left, a cylindrical metal burner nozzle is visible. Connected to it is a T-junction and a supply pipe
    extending to the right. A brass ball valve with a bright yellow handle is mounted on the right-side
    pipe. The yellow handle is currently perpendicular to the pipe, indicating it is in the closed position.
    The background shows a blurred workshop environment with tools and a window.
  init2final_edit_prompt: Edit the given image so that the yellow valve handle on the right is rotated
    90 degrees to be parallel with the pipe. The handle should be aligned with the axis of the pipe, indicating
    an open valve state. Ensure that no hand is visible in the frame and that the burner nozzle, pipes,
    and background remain unchanged.
  rationale: 'The video prompt describes a specific mechanical action: a hand enters, rotates the valve
    handle 90 degrees from closed (perpendicular) to open (parallel), and then withdraws. The final state
    must show the valve in the open position with the handle aligned with the pipe. Since the camera is
    stationary and the hand leaves the scene, the final frame should look identical to the initial frame
    except for the new orientation of the yellow handle.'
  questions:
  - id: valve_parallel
    question: Is the yellow valve handle now parallel to the pipe it is attached to?
    answer_type: yes_no
    notes_for_judge: The handle should be aligned with the pipe's axis, not crossing it.
  - id: valve_open_state
    question: Does the yellow handle appear to be in the open position (aligned with flow) rather than
      the closed position?
    answer_type: yes_no
    notes_for_judge: Open = parallel to pipe; Closed = perpendicular.
  - id: handle_rotation
    question: Has the yellow handle been rotated approximately 90 degrees from its initial perpendicular
      orientation?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame where it was vertical/perpendicular.
  - id: handle_not_perpendicular
    question: Is the yellow handle no longer perpendicular to the pipe?
    answer_type: yes_no
    notes_for_judge: It should now be flat along the pipe.
  - id: hand_removed
    question: Is the hand that manipulated the valve absent from the final frame?
    answer_type: yes_no
    notes_for_judge: The prompt states the hand withdraws.
  - id: nozzle_consistency
    question: Is the metal burner nozzle on the left still present and in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
