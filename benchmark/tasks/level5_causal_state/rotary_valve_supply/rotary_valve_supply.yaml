id: rotary_valve_supply
level: 5
category: causal_mechanism
mechanism_type: binary_routing_logic
prompts:
  image_gen_prompt: A gas burner nozzle connected to a pipe. The burner is currently off (no flame visible). The camera view is centered on the burner nozzle.
  video_WM: The camera starts centered on the unlit burner nozzle. The camera rotates right at constant speed until the burner exits the view. The camera continues rotating, revealing a yellow rotary valve handle on the gas pipe. The handle is currently perpendicular to the pipe (closed position). A hand enters the frame, grabs the yellow handle, and rotates it 90 degrees so that it becomes parallel with the pipe. The handle remains in the parallel position. When the valve is parallel, the internal passage aligns with the pipe allowing gas flow. The valve rotation occurs while the burner nozzle remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the burner nozzle back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the burner nozzle, then rotates to the valve handle. A hand rotates the valve 90 degrees from perpendicular (closed) to parallel (open position). The valve rotation occurs while the burner is not visible. The camera then returns to the burner nozzle. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
