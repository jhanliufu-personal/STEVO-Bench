id: car_window_switch_06
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: precondition_failure
variation_description: The switch button is physically missing/broken
changes:
  occlusion_method: null
  dynamic_conditions: Switch mechanism is broken. No input signal.
  expected_outcome_change: Window remains Closed (No change)
prompts:
  init_frame_edit_prompt: Edit the image to show the driver window switch button is missing from the panel,
    leaving an exposed empty socket.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully closed. The driver leans forward toward the door panel; the window is no longer visible.
    The door armrest comes into view, revealing that the plastic button for the driver window is missing.
    A hand presses uselessly on the exposed socket where the switch should be. The mechanical linkage
    is incomplete. The driver leans back to the upright seated position. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and window closed. The driver
    leans forward, camera pitches down and moves forward, revealing the broken window control socket.
    A hand presses on the exposed mechanism. The action occurs while the window is not visible. The driver
    leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A driver's point-of-view shot inside a car. A black aftermarket steering wheel
    with a yellow top-center marker and a Suzuki logo is in the foreground. The dashboard instrument cluster
    is illuminated, showing RPM and speed. To the left, the driver's side door panel is visible; the window
    control area on the armrest appears damaged or stripped, with the switch unit missing or incomplete.
    The driver's side window is fully closed (rolled up), and the glass reflects the outside environment.
    Through the window and windshield, a dirt road and trees are visible.
  init2final_edit_prompt: Edit the image to show the driver's side window remaining fully closed and rolled
    up. The glass must continue to cover the entire window opening, just as it did initially. Do not lower
    the window. Ensure the door panel still shows the empty or damaged socket where the switch is missing.
    Maintain the original lighting, the illuminated dashboard, and the position of the steering wheel.
  rationale: The video describes an attempted action (pressing a spot where a switch should be) that is
    mechanically futile because the switch is missing and the linkage is incomplete. Since the control
    mechanism is broken, the causal chain to operate the window motor is severed. Therefore, despite the
    driver's action, the window does not move. When the driver leans back to the initial position, the
    visual state of the window should be identical to the start (fully closed).
  questions:
  - id: window_closed_01
    question: Is the driver's side window still fully closed?
    answer_type: yes_no
    notes_for_judge: The window should not have opened because the switch was missing.
  - id: window_glass_02
    question: Is the window glass still visible covering the entire door frame opening?
    answer_type: yes_no
    notes_for_judge: Check if the glass is still up.
  - id: window_position_03
    question: Is the vertical position of the window unchanged from the initial frame?
    answer_type: yes_no
    notes_for_judge: It should remain at the top.
  - id: mechanism_check_04
    question: Does the window remain up despite the interaction with the door panel?
    answer_type: yes_no
    notes_for_judge: Verifies the causal failure.
  - id: door_panel_05
    question: Is the missing switch socket on the door armrest still visible?
    answer_type: yes_no
    notes_for_judge: The damage to the panel should persist.
  - id: dashboard_06
    question: Are the dashboard gauges still illuminated?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
