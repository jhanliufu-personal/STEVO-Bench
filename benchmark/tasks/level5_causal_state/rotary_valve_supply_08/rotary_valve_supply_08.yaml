id: rotary_valve_supply_08
level: 5
category: causal_mechanism
tags: []
variant_of: rotary_valve_supply
variation_type: repeated_activation
variation_description: The valve is opened and then immediately closed again.
changes:
  occlusion_method: null
  dynamic_conditions: Valve opened then closed. Net state is closed.
  expected_outcome_change: No flame appears because the valve ends up closed.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the unlit burner nozzle. The camera rotates right at constant
    speed until the burner exits the view. The camera continues rotating, revealing a yellow rotary valve
    handle on the gas pipe. The handle is currently perpendicular to the pipe (closed position). A hand
    enters the frame, rotates the handle 90 degrees to parallel (open), pauses briefly, and then rotates
    it 90 degrees back to perpendicular (closed). The handle remains in the closed position. The double
    action occurs while the burner nozzle remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the burner nozzle back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the burner nozzle, then rotates to the valve handle. A hand rotates
    the valve to the open position and then immediately back to the closed position. The valve manipulation
    occurs while the burner is not visible. The camera then returns to the burner nozzle. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a metal burner assembly in a workshop. On the left is a cylindrical
    brass burner nozzle, which is dark and unlit. In the center is a dark metal T-junction fitting. Connected
    to the right is a rusty metal pipe leading to a brass ball valve. The valve has a butterfly-style
    handle that is oriented vertically, perpendicular to the horizontal pipe, indicating it is in the
    closed position. The background is a blurred workshop environment.
  init2final_edit_prompt: Edit the given image to ensure the burner nozzle on the left remains unlit,
    with no visible flames, smoke, or heat distortion. Ensure the valve handle on the right pipe is positioned
    perpendicular to the pipe (vertical orientation), indicating a closed state. The scene should appear
    identical to the initial unlit state.
  rationale: 'The video prompt describes a causal sequence where the camera pans to the valve, a hand
    opens the valve (allowing gas flow), pauses, and then closes the valve (stopping gas flow). The camera
    then returns to the original view. Since the valve is returned to the closed position and no ignition
    source (like a spark or lighter) was applied, the burner remains unlit throughout or is extinguished
    by the closure. Therefore, the final state is functionally identical to the initial state: the valve
    is closed and the burner is unlit.'
  questions:
  - id: burner_unlit
    question: Is the burner nozzle unlit?
    answer_type: yes_no
    notes_for_judge: The burner should not show any fire or flame.
  - id: valve_perpendicular
    question: Is the valve handle perpendicular to the pipe?
    answer_type: yes_no
    notes_for_judge: The handle should be oriented across the pipe (vertical), not along it.
  - id: no_fire
    question: Is the scene free of visible fire?
    answer_type: yes_no
    notes_for_judge: Check for any flames at the nozzle tip.
  - id: valve_closed_state
    question: Is the valve handle in the closed position?
    answer_type: yes_no
    notes_for_judge: Closed position for this valve is perpendicular to the flow.
  - id: no_smoke
    question: Is the area around the burner nozzle free of smoke?
    answer_type: yes_no
    notes_for_judge: There should be no smoke indicating a recent or active fire.
  - id: handle_orientation
    question: Is the valve handle oriented vertically?
    answer_type: yes_no
    notes_for_judge: Assuming the pipe is horizontal, the handle should be vertical.
