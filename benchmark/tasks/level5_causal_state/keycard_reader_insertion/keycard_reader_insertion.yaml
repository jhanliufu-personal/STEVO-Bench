id: keycard_reader_insertion
level: 5
category: causal_mechanism
mechanism_type: authentication_logic
prompts:
  image_gen_prompt: A hotel-style keycard reader mounted next to a door. The reader has a status LED that
    is currently dim. A hand holds a white plastic keycard.
  video_WM: The hand slides the white keycard into the slot of the reader and then quickly removes it.
    The camera rotates right until the reader completely exits the view, then rotates toward the left
    smoothly at the same rate until the reader's status LED and the door handle are back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The keycard is inserted into the electronic reader and removed to trigger the authentication
    mechanism. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
