id: keycard_reader_insertion
level: 5
category: causal_mechanism
mechanism_type: authentication_logic
prompts:
  image_gen_prompt: A hotel-style keycard reader is mounted next to a door. The reader has a status LED that is currently dim (off). The camera view is centered on the reader and its status LED.
  video_WM: The camera starts centered on the keycard reader with its dim status LED. The camera rotates right at constant speed until the reader exits the view. The camera continues rotating, showing the area near the reader. A hand holding a white plastic keycard enters the frame and slides the keycard into the slot of the reader and then quickly removes it. The reader contains authentication circuitry that validates the card and can signal lock mechanisms or status indicators. The keycard swipe occurs while the reader's status LED remains out of camera view. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the reader and its status LED back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the keycard reader status LED, then rotates away. A hand swipes a keycard through the reader slot. The reader validates the card and can trigger authentication signals. The card swipe occurs while the status LED is not visible. The camera then returns to the reader and status LED. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
