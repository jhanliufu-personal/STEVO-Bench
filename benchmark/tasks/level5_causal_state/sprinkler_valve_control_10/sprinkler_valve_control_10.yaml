id: sprinkler_valve_control_10
level: 5
category: causal_mechanism
tags: []
variant_of: sprinkler_valve_control
variation_type: indirect_causation
variation_description: A second valve is visible near the sprinkler and is closed. The main valve opens,
  but the second valve blocks flow.
changes:
  occlusion_method: null
  dynamic_conditions: System requires both valves open. Secondary valve (visible) is closed. Main valve
    (trigger) opens. Flow blocked by secondary.
  expected_outcome_change: Sprinkler remains inactive because the secondary valve is closed.
prompts:
  init_frame_edit_prompt: Edit the image to show a second, smaller red-handled ball valve connected directly
    to the sprinkler inlet, currently in the closed position (handle perpendicular to flow).
  video_WM: The camera starts centered on the inactive sprinkler head, which is fitted with a secondary
    isolation valve that is currently closed. The camera rotates right at constant speed until the sprinkler
    and isolation valve exit the view. The camera continues rotating, revealing the main manual water
    valve mounted on a pipe near the wall. The main valve handle is currently in the closed position.
    A hand enters the frame and rotates the main valve handle counterclockwise to the open position. Water
    can only flow if both valves in the series are open. The main valve operation occurs while the sprinkler
    head remains out of camera view. Then the camera rotates left smoothly at the same rate back to the
    original viewpoint, bringing the sprinkler head and the closed secondary valve back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The scene features an inactive sprinkler head fitted with a closed secondary isolation valve,
    and a main manual water valve. A hand opens the main valve by rotating it counterclockwise. Water
    can only flow if both valves in the series are open. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal impact sprinkler head mounted on a vertical
    riser pipe in a field of dry, yellow grass. A red-handled ball valve is attached to the pipe directly
    below the sprinkler mechanism. The red handle is oriented perpendicular to the pipe, indicating it
    is in the closed position. The ground is parched, cracked, and dry.
  init2final_edit_prompt: Edit the given image to maintain the sprinkler in its inactive state. Ensure
    the red valve handle remains perpendicular to the pipe in the closed position. Do not add any water
    spray, mist, or wet spots; the sprinkler head, grass, and ground must remain completely dry.
  rationale: 'The system consists of two valves in series: the secondary valve visible in the frame (initially
    closed) and a main valve located off-screen. The action opens the off-screen main valve, but the visible
    secondary valve is never touched and remains closed. Since water requires both valves to be open to
    flow, the circuit remains blocked at the sprinkler head. Therefore, in the final frame, the sprinkler
    must remain inactive and dry, and the visible red handle must remain in the closed (perpendicular)
    position.'
  questions:
  - id: sprinkler_inactive
    question: Is the sprinkler head still inactive without any water spraying?
    answer_type: yes_no
    notes_for_judge: The sprinkler should not be spraying because the local isolation valve remained closed.
  - id: valve_handle_position
    question: Does the red valve handle remain in the perpendicular (closed) position?
    answer_type: yes_no
    notes_for_judge: The handle should not have moved; it should still be at a 90-degree angle to the
      pipe.
  - id: ground_dryness
    question: Is the ground and grass around the sprinkler still dry?
    answer_type: yes_no
    notes_for_judge: No water flowed, so the ground should not be wet.
  - id: no_mist
    question: Is the air around the sprinkler free of mist or water droplets?
    answer_type: yes_no
    notes_for_judge: Verify no partial activation or leakage.
  - id: mechanism_stationary
    question: Does the sprinkler head appear stationary and in the same orientation as the initial frame?
    answer_type: yes_no
    notes_for_judge: Impact sprinklers move when water flows; it should be still.
  - id: valve_handle_color
    question: Is the valve handle still red?
    answer_type: yes_no
    notes_for_judge: Consistency check.
