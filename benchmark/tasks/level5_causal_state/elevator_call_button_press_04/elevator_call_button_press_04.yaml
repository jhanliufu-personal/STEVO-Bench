id: elevator_call_button_press_04
level: 5
category: causal_mechanism
tags: []
variant_of: elevator_call_button_press
variation_type: precondition_failure
variation_description: An 'Out of Order' sign is taped over the panel.
changes:
  occlusion_method: null
  dynamic_conditions: The elevator is out of service; the controller is offline or ignoring inputs.
  expected_outcome_change: The button remains unlit (no change).
prompts:
  init_frame_edit_prompt: Edit the image to add a paper sign taped over the metal panel that reads 'OUT
    OF ORDER'. Ensure the Up button is unlit.
  video_WM: The camera starts centered on the elevator call button panel, which has an 'Out of Order'
    sign taped to it. The camera rotates right at constant speed until the button panel exits the view.
    The camera continues rotating right, showing the wall and surroundings. While the button is out of
    view, a hand reaches to the button location and presses the Up call button. Since the elevator system
    is deactivated for maintenance, the controller does not send power to the button's internal light
    circuit in response to the press. The light circuit remains inactive. The button press occurs while
    the button panel remains out of camera view. Then the camera rotates left smoothly at the same rate
    back to the original viewpoint, bringing the button panel back into center view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The camera starts on the button panel marked 'Out of Order'. While out of view, the button
    is pressed. Because the system is deactivated, the controller does not activate the light circuit.
    The button press occurs while the button is not visible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up view of a vertical silver metal elevator control panel mounted on
    a textured concrete wall. A handwritten 'OUT OF ORDER' sign on a piece of white paper is taped over
    the upper section of the panel using pieces of masking tape. Below the paper sign, a circular metal
    component (resembling a button or key switch) is visible on the panel; it is currently dark and unlit.
  init2final_edit_prompt: Edit the given image to show the elevator panel exactly as it appeared initially.
    Ensure the 'OUT OF ORDER' sign remains taped in place and the circular button component at the bottom
    remains completely unlit and dark. Do not add any illumination, glow, or light to the button or the
    panel.
  rationale: The camera rotates away from the panel and then returns to the original viewpoint. During
    the occlusion, a hand presses the call button. However, the prompt explicitly states that the elevator
    system is deactivated and the controller does not send power to the light circuit. Therefore, the
    button must not light up. The final state should be visually identical to the initial state, with
    the button remaining unlit and the sign undisturbed, reflecting the 'Out of Order' status.
