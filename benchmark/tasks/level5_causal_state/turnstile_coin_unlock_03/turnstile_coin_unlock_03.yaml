id: turnstile_coin_unlock_03
level: 5
category: causal_mechanism
tags: []
variant_of: turnstile_coin_unlock
variation_type: initial_state
variation_description: Turnstile starts in 'Maintenance Mode' (Yellow/Orange); coin resets it to Standby
  (Red/Locked).
changes:
  occlusion_method: null
  dynamic_conditions: Start state is Maintenance (Yellow). Coin insertion resets system to Standby (Red).
  expected_outcome_change: Final state is Red (Locked) instead of Green (Unlocked). The change is from
    Yellow to Red.
prompts:
  init_frame_edit_prompt: Edit the image to change the indicator light to ORANGE/YELLOW and add a small
    'MAINTENANCE' label near the light.
  video_WM: The camera starts centered on the turnstile arm showing an orange maintenance light. The camera
    rotates right at constant speed until the turnstile exits the view. The camera continues rotating,
    revealing a coin slot mechanism. A hand enters and inserts a token, which acts as a system reset key.
    The insertion occurs while the turnstile arm remains out of camera view. Then the camera rotates left
    smoothly back to the original viewpoint, bringing the turnstile arm and indicator back into center
    view. STOP.
  camera_WM: The scene starts on the turnstile arm in maintenance mode. A hand inserts a token into the
    coin slot to reset the system. The action occurs while the turnstile is not visible. The scene returns
    to the turnstile arm. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal subway turnstile. In the center, a three-bar
    rotating barrier arm is visible. To the right of the arm, on the turnstile chassis, there is a prominent,
    illuminated circular orange light consisting of a grid of LEDs. Above this light is a white label
    reading 'MAINTENANCE'. To the left of the arm, on a vertical post, is a label reading 'LOCKED' with
    a down arrow symbol and a dark, unlit circular indicator above it. In the background, out of focus,
    are white subway tiles, a person in a dark jacket, and other station elements.
  init2final_edit_prompt: Edit the given image to show the state of the turnstile after a system reset.
    Change the color of the circular light under the 'MAINTENANCE' label from orange to bright green.
    The light should appear illuminated in green, indicating the system is active. Ensure the metal turnstile
    arms remain in their original position. Do not add any hands or tokens. Keep the background, the 'LOCKED'
    label, and the 'MAINTENANCE' label unchanged.
  rationale: The video prompt describes a camera rotation that reveals a coin slot where a 'system reset
    key' token is inserted, followed by a return to the original view. The insertion of a reset key functionally
    clears the 'Maintenance' error state observed in the initial frame. The expected visual outcome of
    this causal action is a change in the status indicator light. We define the correct final state as
    the orange maintenance light changing to green (or a 'ready' state) to visually confirm the reset
    was successful. The camera movement ensures the final frame framing matches the initial frame.
