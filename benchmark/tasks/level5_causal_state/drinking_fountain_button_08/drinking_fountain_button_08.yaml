id: drinking_fountain_button_08
level: 5
category: causal_mechanism
tags: []
variant_of: drinking_fountain_button
variation_type: repeated_activation
variation_description: Button is pressed twice (toggle logic)
changes:
  occlusion_method: null
  dynamic_conditions: 'Repeated activation: The button is toggled ON then OFF again.'
  expected_outcome_change: 'No water flow (Final state: OFF)'
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera starts centered on the drinking fountain spout with no water flowing. The camera
    rotates right at constant speed until the spout exits the view. The camera continues rotating, revealing
    the push button on the side. A hand enters the frame and presses the button firmly, then pauses and
    presses it a second time. The first press opens the valve, and the second press closes it again. The
    sequence occurs while the fountain spout remains out of camera view. Then the camera rotates left
    smoothly at the same rate back to the original viewpoint, bringing the fountain spout back into center
    view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the spout, then rotates to the side button. A hand presses the button
    twice. The valve opens then closes. The camera then returns to the fountain spout. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot of a stainless steel drinking fountain. The central
    focus is the chrome bubbler head (spout) with a curved metal guard. The basin is circular and metallic,
    showing minor scratches and mineral deposits but appears dry. The background consists of a grid of
    light-colored square tiles. There is no water flowing from the spout.
  init2final_edit_prompt: Edit the given image to show the stainless steel basin surface with scattered
    water droplets and wet streaks, indicating the fountain was recently used. Ensure there is absolutely
    NO stream of water flowing from the spout; the spout must appear inactive and the air above it clear
    of any water arc.
  rationale: The video prompt describes a sequence where the camera rotates away, a button is pressed
    to open the valve, and then pressed a second time to close the valve. The camera returns to the original
    view only after the valve has been closed. Therefore, the final state must show the fountain turned
    off (no active water stream). However, because the water was running briefly during the occlusion,
    the basin should now appear wet with droplets, distinguishing the final state from the initial dry
    state.
  questions:
  - id: '1'
    question: Is the fountain spout currently free of flowing water?
    answer_type: yes_no
    notes_for_judge: The water should be off because the second button press closed the valve.
  - id: '2'
    question: Is the area above the spout clear, with no water arc visible?
    answer_type: yes_no
    notes_for_judge: Check for the absence of a water stream.
  - id: '3'
    question: Is the drinking fountain in an idle state with no active jet?
    answer_type: yes_no
    notes_for_judge: The final state should be inactive.
  - id: '4'
    question: Does the basin surface show water droplets or wetness?
    answer_type: yes_no
    notes_for_judge: The basin should be wet from the recent activation.
  - id: '5'
    question: Is there evidence of recent use in the form of a wet basin?
    answer_type: yes_no
    notes_for_judge: Look for reflections or drops on the steel surface.
  - id: '6'
    question: Is the water valve effectively closed, indicated by the lack of a stream?
    answer_type: yes_no
    notes_for_judge: Confirm the mechanism cycled back to closed.
