id: lightbulb_and_switch_07
level: 5
category: causal_reasoning
tags: []
variant_of: lightbulb_and_switch
variation_type: precondition_failure
variation_description: A visible wire feeding the fixture is cut.
changes:
  occlusion_method: null
  dynamic_conditions: Power feed is cut. Switch toggle has no effect.
  expected_outcome_change: Light stays OFF (original was ON).
prompts:
  init_frame_edit_prompt: Edit the image to show a clearly cut and disconnected electrical wire hanging
    near the base of the light fixture.
  video_WM: Single continuous shot, no cuts, no zoom. The scene contains a ceiling light with a visibly
    cut electrical wire disconnected from the base. Camera starts centered on the ceiling light. The camera
    smoothly moves left at constant speed until the light exits the frame to the right. While the light
    is out of view, a human hand toggles the wall switch to the ON position. The camera continues moving
    left for several seconds. Then the camera moves right at the same constant speed back to the original
    viewpoint, bringing the ceiling light back into view.
  camera_WM: The scene contains a ceiling light with a visibly cut electrical wire disconnected from the
    base. A human hand toggles the wall switch to the ON position. STOP.
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  Genie: null
evaluation:
  init_frame_description: A low-angle shot of a dimly lit, empty room with grey walls and a wooden floor.
    In the center of the white ceiling, there is a circular light fixture base. Two black electrical wires
    hang down from the base, ending abruptly in mid-air with visible cut or stripped tips. There is no
    light bulb or socket attached to the wires. The lighting is cool and ambient, casting soft, diffuse
    shadows.
  init2final_edit_prompt: Edit the given image to maintain the exact same lighting conditions. The ceiling
    light fixture must remain dark with the two cut wires hanging down. Do not add any light, glow, or
    bulb to the wires. The room must remain dimly lit with the original soft ambient lighting. Ensure
    the wires are not emitting any light or sparks.
  rationale: The video prompt describes a switch being toggled to the ON position. However, the initial
    frame clearly establishes that the electrical circuit is physically broken (the wires are cut and
    disconnected from any bulb). Therefore, the causal mechanism for creating light is interrupted. Despite
    the switch being toggled, the expected functional outcome is that the light remains OFF. The final
    state should be visually identical to the initial state, testing the model's ability to recognize
    that the broken mechanism prevents the standard effect.
