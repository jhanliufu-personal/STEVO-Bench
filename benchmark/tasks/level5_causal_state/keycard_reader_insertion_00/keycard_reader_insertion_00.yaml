id: keycard_reader_insertion_00
level: 5
category: causal_mechanism
tags: []
variant_of: keycard_reader_insertion
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to ensure the black card reader slot is clearly visible on the
    metal faceplate, positioned directly below the small circular status LED.
  video_WM: The camera is completely stationary, framing the metal keycard reader. The dim status LED
    and the black card slot are both clearly visible. A hand holding a white plastic keycard enters the
    frame. The hand slides the keycard into the slot of the reader and then quickly removes it. The hand
    exits the frame. STOP.
  camera_WM: The camera is completely stationary, framing the metal keycard reader. The dim status LED
    and the black card slot are both clearly visible. A hand holding a white plastic keycard enters the
    frame. The hand slides the keycard into the slot of the reader and then quickly removes it. The hand
    exits the frame. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a brushed metal keycard reader mounted on a textured beige
    wall. The device features a horizontal black card slot in the center and a small, round, dark status
    LED lens positioned directly above the slot. To the left of the reader is a vertical section of a
    dark wood door frame.
  init2final_edit_prompt: Edit the given image to show the small round status LED above the card slot
    illuminated with a bright green light. Ensure the card slot remains empty and the metal faceplate
    and surrounding wall are unchanged.
  rationale: The video describes a functional interaction where a keycard is inserted and removed from
    the reader. In real-world systems, this action triggers the device to read the card and display a
    status signal, typically by illuminating the LED indicator (usually green for access granted) for
    a few seconds. Since the video ends immediately after the hand removes the card and exits, the final
    frame should capture this active state where the LED is lit up, while the scene is otherwise restored
    to its initial geometry (no hand, empty slot).
  questions:
  - id: led_illuminated
    question: Is the small round status LED above the card slot illuminated?
    answer_type: yes_no
    notes_for_judge: The LED should be glowing (likely green or red) compared to the dark/dim state in
      the initial frame.
  - id: led_brightness_change
    question: Is the indicator light above the slot brighter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for a distinct change in brightness/emission from the small circular lens.
  - id: led_state_active
    question: Does the status light show evidence of being activated?
    answer_type: yes_no
    notes_for_judge: Activation implies light emission.
  - id: slot_empty
    question: Is the card slot empty?
    answer_type: yes_no
    notes_for_judge: The card should have been removed.
  - id: hand_removed
    question: Is the hand no longer visible in the frame?
    answer_type: yes_no
    notes_for_judge: The prompt states the hand exits the frame.
  - id: wall_consistency
    question: Is the textured wall background unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
