id: string_pull_lamp_06
level: 5
category: causal_mechanism
tags: []
variant_of: string_pull_lamp
variation_type: precondition_failure
variation_description: The glass of the bulb is shattered, indicating it is broken and will not light
  up.
changes:
  occlusion_method: null
  dynamic_conditions: 'Broken precondition: Damaged output object. Trigger action has no effect.'
  expected_outcome_change: The broken bulb will remain dark.
prompts:
  init_frame_edit_prompt: Edit the image so the glass of the light bulb appears shattered and broken,
    with jagged edges visible.
  video_WM: The camera starts centered on the broken, dark lamp bulb. The camera rotates right at constant
    speed until the bulb exits the view. The camera continues rotating, revealing the beaded pull-string
    hanging down. A hand enters the frame, grabs the beaded string, and pulls it downward firmly until
    a mechanical click is heard, then releases it. The lamp contains an internal toggle switch mechanism.
    The string pull occurs while the bulb remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the broken bulb back into center view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the broken bulb, then rotates to the pull-string. A hand pulls the string
    downward to engage the internal toggle switch. The string pull occurs while the bulb is not visible.
    The camera then returns to the bulb. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a vintage industrial pendant lamp hanging in a workshop.
    The lamp has a weathered silver metal shade and a wire cage guard. Inside the cage, the light bulb
    is broken, with shattered glass shards visible at the base and resting at the bottom of the cage,
    exposing the internal stem and filament structure. The lamp is currently off (dark). The background
    shows wooden beams, shelves cluttered with tools, and a window providing ambient natural light.
  init2final_edit_prompt: Edit the given image to make the lamp appear turned on. The exposed central
    stem and filament area of the broken bulb should be glowing brightly with a warm, intense light. The
    light should illuminate the underside of the metal shade and create bright highlights on the wire
    cage. The surrounding wooden beams and workshop background should appear warmer and more illuminated
    due to the light emitted from the lamp. Keep the bulb glass shattered as in the original image, but
    illuminated.
  rationale: The video sequence establishes the lamp is initially off. The camera pans away to reveal
    the lamp's pull-string switch, which is then pulled by a hand. This action toggles the electrical
    state of the lamp. Since the lamp was initially off, the toggle action turns it on. The camera then
    pans back to the original view. The expected functional outcome is that the lamp is now powered and
    emitting light, demonstrating the causal link between the switch and the bulb, even though the bulb
    is physically broken (testing causal state tracking over strict real-world physics of filament oxidation).
