id: fire_alarm_pull_station
level: 5
category: causal_mechanism
mechanism_type: manual_trigger_alarm_logic
prompts:
  image_gen_prompt: A fire alarm indicator light is mounted on the ceiling. The indicator shows a steady
    green light meaning the system is armed but not activated. The camera view is centered on the alarm
    indicator.
  video_WM: The camera starts centered on the ceiling-mounted fire alarm indicator light showing steady
    green (armed, not triggered). The camera rotates right at constant speed until the indicator exits
    the view. The camera continues rotating, revealing a red fire alarm pull station mounted on the wall
    at chest height. A hand enters the frame and pulls down the handle on the pull station firmly. The
    pull station contains a mechanical switch that closes the alarm circuit when the handle is pulled.
    Building fire alarm systems activate indicators and sirens when the circuit is completed. The handle
    pull occurs while the ceiling alarm indicator remains out of camera view. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint, bringing the ceiling alarm indicator
    back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ceiling alarm indicator showing green, then rotates to the wall-mounted
    pull station. A hand pulls down the handle. The pull station switch closes the alarm circuit when
    activated. The handle pull occurs while the ceiling indicator is not visible. The camera then returns
    to the ceiling alarm indicator. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a white, circular fire alarm indicator mounted on a textured
    white wall or ceiling. The device features a central translucent dome illuminated with a bright green
    light. Black text printed on the white plastic housing reads 'SYSTEM ARMED' along the top curve and
    'FIRE ALARM INDICATOR' along the bottom curve.
  init2final_edit_prompt: Edit the given image to change the color of the central illuminated light from
    green to bright red. Maintain the glow and intensity of the light source. Keep the white plastic housing,
    the printed text 'SYSTEM ARMED' and 'FIRE ALARM INDICATOR', and the textured background exactly as
    they are in the original image.
  rationale: The video sequence establishes a causal relationship between a physical action (pulling the
    fire alarm handle) and a system state change (alarm activation). The initial frame shows the system
    in a 'System Armed' state indicated by a green light. The prompt describes the camera rotating away,
    a hand pulling a fire alarm station handle (which triggers the alarm circuit), and the camera returning
    to the indicator. Standard fire alarm systems switch indicators from a 'normal/armed' state (green)
    to an 'alarm/active' state (typically red) when triggered. Therefore, the final frame must show the
    indicator light glowing red instead of green.
