id: conveyor_reverse_lever_05
level: 5
category: causal_mechanism
tags: []
variant_of: conveyor_reverse_lever
variation_type: precondition_failure
variation_description: A red Emergency Stop button is pressed down, preventing operation.
changes:
  occlusion_method: null
  dynamic_conditions: Safety interlock active. Lever action has no effect.
  expected_outcome_change: The conveyor does not move. The box remains stationary.
prompts:
  init_frame_edit_prompt: Edit the image to add a large, red Emergency Stop button near the lever that
    is visibly pressed down (engaged).
  video_WM: The camera starts centered on the stationary cardboard box on the conveyor belt. The camera
    rotates right at constant speed until the box exits the view. The camera continues rotating, revealing
    a control lever on the side of the conveyor. The lever is currently in the middle NEUTRAL position.
    A hand enters the frame and pulls the control lever all the way to the REVERSE position. The lever
    movement occurs while the cardboard box remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the cardboard box on the belt back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the box, then rotates to the control lever. A hand shifts the lever
    from NEUTRAL to REVERSE position. The lever movement occurs while the box is not visible. The camera
    then returns to the box on the belt. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A warehouse interior featuring a conveyor belt system extending from the foreground
    into the background. A large, closed cardboard box with shipping labels sits stationary in the center
    of the conveyor belt. The belt has a visible fabric or rubber texture. In the immediate foreground,
    a red emergency stop button mounted on a yellow housing is prominent. The background contains warehouse
    racking filled with stacked wooden pallets and boxes, illuminated by overhead industrial lights.
  init2final_edit_prompt: Edit the given image to show the cardboard box in a new position on the conveyor
    belt. Move the box significantly closer to the foreground (towards the bottom of the frame and the
    emergency stop button) compared to its original central position. Ensure the box remains on the belt
    and fully visible, but clearly displaced from its starting spot. Keep the background, pallets, racking,
    and the emergency stop button exactly as they are.
  rationale: The video prompt describes a sequence where the camera rotates away from the box to reveal
    a control lever, which is then pulled to the 'REVERSE' position. This action activates the conveyor
    belt motor. Assuming a standard industrial layout where 'forward' moves items away into the warehouse
    and 'reverse' brings them back towards the operator station (the foreground), the activation of the
    belt will cause the box to travel towards the camera. When the camera returns to the original viewpoint,
    the box should have shifted position along the belt, ending up closer to the foreground than it was
    initially.
  questions:
  - id: box_moved_generic
    question: Is the cardboard box in a different position on the conveyor belt than it was in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The box should have moved from its original center position due to the conveyor activation.
  - id: box_moved_closer
    question: Has the cardboard box moved closer to the foreground (the bottom of the frame)?
    answer_type: yes_no
    notes_for_judge: Assuming 'Reverse' brings the item back to the operator/start of the line.
  - id: box_estop_proximity
    question: Is the distance between the cardboard box and the red emergency stop button smaller than
      in the initial frame?
    answer_type: yes_no
    notes_for_judge: The box should be physically closer to the button in the foreground.
  - id: box_center_displacement
    question: Is the cardboard box no longer centered in the middle of the conveyor belt's visible length?
    answer_type: yes_no
    notes_for_judge: It should be displaced longitudinally.
  - id: conveyor_activation_evidence
    question: Does the final state of the box indicate that the conveyor belt has been active?
    answer_type: yes_no
    notes_for_judge: Movement of the object is evidence of the mechanism working.
  - id: background_consistency
    question: Are the stacked pallets in the background in the same position as the initial frame?
    answer_type: yes_no
    notes_for_judge: Only the box on the belt should move.
  - id: estop_consistency
    question: Is the red emergency stop button still present and unchanged in the foreground?
    answer_type: yes_no
    notes_for_judge: The button itself should not move or change state.
