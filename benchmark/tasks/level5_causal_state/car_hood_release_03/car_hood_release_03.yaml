id: car_hood_release_03
level: 5
category: causal_mechanism
tags: []
variant_of: car_hood_release
variation_type: initial_state
variation_description: The car hood has been removed entirely, exposing the engine. Pulling the lever
  affects nothing visible.
changes:
  occlusion_method: null
  dynamic_conditions: No hood is present to latch or unlatch.
  expected_outcome_change: The engine bay remains exposed with no hood visible.
prompts:
  init_frame_edit_prompt: Edit the image to remove the car hood entirely, exposing the engine bay and
    mechanics underneath.
  video_WM: Driver's upright POV. The steering wheel is centered, and the exposed engine bay is visible
    through the windshield where the hood would normally be. The driver leans forward and downward toward
    the lower dashboard; the windshield is no longer visible. The hood release lever under the left side
    of the dashboard comes into view. A hand grips the lever handle and pulls it firmly outward. The cable
    pulls the latch, but there is no hood to catch. The driver leans back to the upright seated position,
    bringing the exposed engine bay back into view. STOP.
  camera_WM: The camera starts in upright driver POV with the exposed engine bay visible. The driver leans
    forward and down, camera pitches down and moves forward, revealing the hood release lever. A hand
    pulls the lever outward. The action occurs while the windshield is not visible. The driver leans back
    to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A driver's point-of-view shot from inside a blue Corvette C7. The black leather
    steering wheel is centered in the foreground. Through the windshield area, the car's hood is completely
    missing, exposing the engine bay directly. The silver engine cover with red 'CORVETTE' lettering is
    prominently visible. The windshield wipers are visible at the bottom of the glass. The background
    shows a sunny residential street with trees and parked cars.
  init2final_edit_prompt: Edit the given image to show the exposed engine bay remaining fully visible
    through the windshield. The hood must remain absent. The silver engine cover with red lettering should
    be visible in the same position. The steering wheel and interior should remain unchanged. The view
    through the windshield should continue to show the street and the exposed engine without any obstruction
    from a hood.
  rationale: The action involves pulling the hood release lever, but the initial state shows that the
    hood is already physically missing from the car. The prompt explicitly states 'there is no hood to
    catch,' meaning the latch mechanism activates but produces no visual change to the vehicle's exterior.
    The driver returns to the initial upright seating position, restoring the original camera view. Therefore,
    the final frame should be visually identical to the initial frame, with the engine remaining fully
    exposed and the hood remaining absent.
  questions:
  - id: q1
    question: Is the engine bay still fully exposed without a hood?
    answer_type: yes_no
    notes_for_judge: The hood was missing initially and should remain missing.
  - id: q2
    question: Is the red 'CORVETTE' lettering on the engine cover still clearly visible?
    answer_type: yes_no
    notes_for_judge: The view should not be obstructed by a hood popping up.
  - id: q3
    question: Does the view through the windshield remain clear of a hood?
    answer_type: yes_no
    notes_for_judge: Verifies that the model did not hallucinate a hood appearing.
  - id: q4
    question: Is the engine cover in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The engine should not move.
  - id: q5
    question: Is the steering wheel centered in the frame?
    answer_type: yes_no
    notes_for_judge: Verifies the driver returned to the upright position.
  - id: q6
    question: Is the street background still visible behind the engine?
    answer_type: yes_no
    notes_for_judge: Verifies no new occlusion.
