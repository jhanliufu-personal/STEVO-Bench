id: pedestrian_crosswalk_button
level: 5
category: causal_mechanism
mechanism_type: request_signal_logic
prompts:
  image_gen_prompt: A pedestrian crossing signal displays a red hand symbol (DON'T WALK) on the pole across
    the street. The signal is currently showing the stop indication. The camera view is centered on the
    crossing signal.
  video_WM: The camera starts centered on the pedestrian signal showing the red hand (DON'T WALK) symbol.
    The camera rotates right at constant speed until the signal exits the view. The camera continues rotating,
    revealing a pedestrian crossing button mounted on a pole at the curb. A hand enters the frame and
    presses the circular button firmly. The button sends a request signal to the traffic light controller
    which manages the crossing signal state based on traffic timing and pedestrian requests. The button
    press occurs while the crossing signal remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the pedestrian crossing signal back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the DON'T WALK signal, then rotates to the crossing button. A hand presses
    the pedestrian button. The button sends requests to the traffic controller which manages signal states.
    The button press occurs while the crossing signal is not visible. The camera then returns to the crossing
    signal. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A street-level shot focusing on a yellow pedestrian signal box mounted on a
    pole. The signal's LED display is active, showing a red hand symbol on the left and the words 'DON'T
    WALK' in red on the right. The background features a wet city street with cars, scaffolding, and buildings,
    indicating rainy weather.
  init2final_edit_prompt: Edit the given image to change the pedestrian signal to the 'WALK' state. Replace
    the illuminated red hand and 'DON'T WALK' text with an illuminated white walking person symbol. Change
    the color of the active LED display from red/orange to white. Keep the yellow housing, the pole, and
    the rainy street background unchanged.
  rationale: 'The video sequence depicts a causal chain: the camera pans to reveal a crosswalk button,
    a hand presses it to request a crossing, and the camera pans back to the signal. The functional result
    of this interaction is the activation of the crosswalk signal. Therefore, upon the camera''s return,
    the signal should have transitioned from the ''DON''T WALK'' state (red hand) to the ''WALK'' state
    (white walking person), reflecting the system''s response to the button press.'
  questions:
  - id: signal_state_walk_symbol
    question: Is the pedestrian signal now displaying a white walking person symbol?
    answer_type: yes_no
    notes_for_judge: The signal should show the standard white icon for walking, replacing the hand.
  - id: signal_state_red_off
    question: Has the red 'DON'T WALK' text and hand symbol turned off?
    answer_type: yes_no
    notes_for_judge: The red elements should be replaced by the white walk signal.
  - id: signal_color_change
    question: Is the illuminated part of the signal now white instead of red/orange?
    answer_type: yes_no
    notes_for_judge: Check for the color change associated with the state transition.
  - id: functional_permission
    question: Does the signal now indicate that pedestrians are allowed to cross?
    answer_type: yes_no
    notes_for_judge: 'Interpret the symbol: Walk vs Don''t Walk.'
  - id: housing_consistency
    question: Is the yellow signal housing still visible and in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the wet street and buildings still visible in the background?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
