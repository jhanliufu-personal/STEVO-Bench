id: fire_alarm_pull_station_01
level: 5
category: causal_mechanism
tags: []
variant_of: fire_alarm_pull_station
variation_type: initial_state
variation_description: The system is defined as a cutoff switch starting in the active (Red) state; pulling
  the handle deactivates it.
changes:
  occlusion_method: null
  dynamic_conditions: Initial state is Red (Active). Mechanism is a kill switch. Action turns output OFF.
  expected_outcome_change: The indicator light should be OFF (dark) instead of Red.
prompts:
  init_frame_edit_prompt: Edit the image to change the green indicator light to a glowing red color.
  video_WM: The camera starts centered on the ceiling-mounted indicator light showing steady red (system
    active). The camera rotates right at constant speed until the indicator exits the view. The camera
    continues rotating, revealing a red pull station mounted on the wall at chest height. A hand enters
    the frame and pulls down the handle on the pull station firmly. In this setup, the pull station acts
    as a kill switch that cuts power to the circuit when the handle is pulled. The handle pull occurs
    while the ceiling indicator remains out of camera view. Then the camera rotates left smoothly at the
    same rate back to the original viewpoint, bringing the ceiling indicator back into center view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The ceiling indicator shows steady red. A hand pulls down the handle on the wall-mounted
    station. The station acts as a kill switch. The action occurs while the indicator is not visible.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a white, circular fire alarm indicator mounted on a white
    textured ceiling. The device has a central red dome light that is currently illuminated, showing a
    bright glowing hotspot. Black text on the white housing reads 'SYSTEM ARMED' at the top and 'FIRE
    ALARM INDICATOR' at the bottom.
  init2final_edit_prompt: Edit the given image to turn off the central red light. The red dome in the
    center should appear dark and unlit, removing the bright internal glow and the central hotspot. The
    red plastic dome should remain visible but look like non-emissive plastic. Keep the white circular
    housing, the text labels 'SYSTEM ARMED' and 'FIRE ALARM INDICATOR', and the ceiling texture exactly
    as they are.
  rationale: The video prompt explicitly defines the pull station as a 'kill switch' that cuts power to
    the circuit when pulled. Although fire alarms typically activate lights, this specific scenario describes
    a mechanism where the action disconnects power. Therefore, after the camera pans to the pull station,
    the handle is pulled, and the camera returns, the previously lit indicator light must be unlit (off)
    due to the loss of power.
