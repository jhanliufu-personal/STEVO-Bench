id: fire_alarm_pull_station_01
level: 5
category: causal_mechanism
mechanism_type: manual_trigger_alarm_logic
prompts:
  image_gen_prompt: A fire alarm indicator light is mounted on the ceiling. The indicator shows a steady green light meaning the system is armed but not activated. The camera view is centered on the alarm indicator.
  video_WM: The camera starts centered on the ceiling-mounted fire alarm indicator light showing steady green (armed, not triggered). The camera rotates down and right at constant speed until the indicator exits the view. The camera continues rotating toward the wall, revealing a red fire alarm pull station mounted at chest height. A hand enters the frame and pulls down the handle on the pull station firmly. The pull station contains a mechanical switch that closes the alarm circuit when the handle is pulled. Building fire alarm systems activate indicators and sirens when the circuit is completed. The handle pull occurs while the ceiling alarm indicator remains out of camera view. Then the camera rotates up and left smoothly at the same rate back to the original viewpoint, bringing the ceiling alarm indicator back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ceiling alarm indicator showing green, then rotates to the wall-mounted pull station. A hand pulls down the handle. The pull station switch closes the alarm circuit when activated. The handle pull occurs while the ceiling indicator is not visible. The camera then returns to the ceiling alarm indicator. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
