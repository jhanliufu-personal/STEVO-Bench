id: lightbulb_and_switch_04
level: 5
category: causal_reasoning
tags: []
variant_of: lightbulb_and_switch
variation_type: precondition_failure
variation_description: The lightbulb glass is shattered, preventing it from turning on.
changes:
  occlusion_method: null
  dynamic_conditions: Bulb is broken. Switch toggle sends power but bulb cannot light.
  expected_outcome_change: Light stays OFF/Dark (original was ON).
prompts:
  init_frame_edit_prompt: Edit the image so the glass of the lightbulb is shattered and broken.
  video_WM: Single continuous shot, no cuts, no zoom. The scene contains a ceiling light fixture with
    a visibly shattered bulb. Camera starts centered on the broken ceiling light. The camera smoothly
    moves left at constant speed until the light exits the frame to the right. While the light is out
    of view, a human hand toggles the wall switch to the ON position. The camera continues moving left
    for several seconds. Then the camera moves right at the same constant speed back to the original viewpoint,
    bringing the ceiling light fixture back into view.
  camera_WM: The scene contains a ceiling light fixture with a visibly shattered bulb. A human hand toggles
    the wall switch to the ON position. STOP.
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  Genie: null
evaluation:
  init_frame_description: A low-angle shot of a ceiling light fixture in a dim, empty room. The lightbulb
    is visibly shattered, with jagged edges of the glass envelope remaining in the socket and the internal
    stem exposed. Directly below the fixture, scattered shards of broken glass are visible on the wooden
    floor. The room has bare, textured walls and a white ceiling. The lighting is dark and moody, with
    significant shadowing, indicating the light is currently off.
  init2final_edit_prompt: Edit the given image to maintain the exact same lighting conditions as the original.
    The shattered light bulb must remain completely unlit and dark. Do not add any glow, incandescence,
    or illumination to the bulb or the room. Ensure the broken glass shards on the floor remain visible
    and unchanged. The scene should look identical to the initial state.
  rationale: The video prompt describes a camera panning away from a broken light fixture, a switch being
    toggled to the ON position, and the camera returning. The critical physical constraint is that the
    bulb is shattered. A shattered incandescent bulb cannot hold a vacuum and thus cannot produce light
    (the filament would burn out instantly or fail to complete the circuit). Therefore, despite the switch
    being toggled ON, the physically correct outcome is that the bulb remains unlit and the room remains
    dark. The model must demonstrate causal reasoning by prioritizing the broken state of the object over
    the generic action of the switch.
  questions:
  - id: light_state_unlit
    question: Is the light bulb still unlit?
    answer_type: yes_no
    notes_for_judge: The bulb is broken, so it should not light up even though the switch was toggled.
  - id: room_darkness
    question: Does the room remain dark and dimly lit?
    answer_type: yes_no
    notes_for_judge: The room should not be illuminated by the fixture.
  - id: filament_glow
    question: Is the exposed interior of the bulb dark (not glowing)?
    answer_type: yes_no
    notes_for_judge: There should be no incandescence.
  - id: fixture_inactive
    question: Does the ceiling fixture appear to be inactive?
    answer_type: yes_no
    notes_for_judge: Inactive means no light emission.
  - id: glass_shards_presence
    question: Are the shards of broken glass still visible on the floor?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: bulb_broken_state
    question: Is the light bulb still visibly shattered?
    answer_type: yes_no
    notes_for_judge: The bulb should not be repaired.
