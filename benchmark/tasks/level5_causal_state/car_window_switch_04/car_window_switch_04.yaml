id: car_window_switch_04
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: precondition_failure
variation_description: Ignition is off (dashboard dark), preventing window operation
changes:
  occlusion_method: null
  dynamic_conditions: Ignition is OFF. Switch has no power.
  expected_outcome_change: Window remains Closed (No change)
prompts:
  init_frame_edit_prompt: Edit the image to make the dashboard lights dark and unlit, indicating the ignition
    is off.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is completely dark (ignition
    off), and the driver-side window is fully closed. The driver leans forward toward the door panel;
    the window is no longer visible. The window control switch panel on the door armrest comes into view.
    A hand presses the lower side of the driver window switch downward. The window switch is part of the
    car's electrical system and requires ignition power to operate the motor. The driver leans back to
    the upright seated position. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with a dark dashboard and the driver-side window
    closed. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch. A hand presses the switch downward. The action occurs while the window is not visible. The
    driver leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A first-person view from the driver's seat of a car with a black interior. The
    steering wheel is on the left, featuring a yellow centering stripe at the top and a Suzuki logo. The
    dashboard instrument cluster is dark and unlit. The driver's side window is to the left and is fully
    closed, with a white 'Lemons Rally' sticker applied to the glass. A 'Speed Demon' sticker is visible
    on the upper left of the windshield. A side view mirror is visible through the driver's window. Outside,
    a sunny dirt road lined with trees is visible.
  init2final_edit_prompt: Edit the given image to show the driver's side window remaining fully closed
    with the 'Lemons Rally' sticker clearly visible on the glass. Ensure the dashboard instrument cluster
    remains dark and unlit. The view should be the original driver's perspective with the hand on the
    steering wheel and the dirt road visible outside.
  rationale: The prompt explicitly states that the car's ignition is off (indicated by the dark dashboard)
    and that the window switch requires ignition power to operate the motor. Therefore, the action of
    pressing the switch downward has no functional effect on the window. When the driver leans back to
    the initial position, the window must remain fully closed, and the dashboard must remain dark, resulting
    in a final state that is functionally identical to the initial state.
