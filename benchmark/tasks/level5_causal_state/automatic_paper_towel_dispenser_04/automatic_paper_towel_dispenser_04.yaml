id: automatic_paper_towel_dispenser_04
level: 5
category: causal_mechanism
tags: []
variant_of: automatic_paper_towel_dispenser
variation_type: precondition_failure
variation_description: The dispenser is empty.
changes:
  occlusion_method: null
  dynamic_conditions: No paper available to dispense.
  expected_outcome_change: No paper is dispensed (Motor may whir, but nothing comes out).
prompts:
  init_frame_edit_prompt: Edit the dispenser window to show it is empty and dark inside, with no paper
    roll visible.
  video_WM: The camera starts centered on the automatic paper towel dispenser opening. The camera rotates
    right at constant speed until the dispenser exits the view. The camera continues rotating, revealing
    the area directly below the dispenser where the infrared sensor detection zone is located. A hand
    enters the frame and waves in front of the sensor zone below the dispenser. The dispenser attempts
    to activate. The hand wave occurs while the dispenser opening remains out of camera view. Then the
    camera rotates left smoothly at the same rate back to the original viewpoint, bringing the dispenser
    opening back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scene displays the dispenser opening. The view shifts to the sensor detection area below.
    A hand waves in the sensor zone. The mechanism attempts activation. The hand wave occurs while the
    dispenser opening is not visible. The view returns to the dispenser opening. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A stainless steel Tork automatic paper towel dispenser mounted on a wall with
    white subway tiles. The dispenser features a dark translucent horizontal window showing the paper
    supply inside, a sensor near the bottom, and a dispensing slot at the very bottom which is currently
    empty (no paper hanging out). To the right of the dispenser is a window frame, and a white sink is
    partially visible in the lower right corner.
  init2final_edit_prompt: Edit the given image to show a sheet of white paper towel hanging down from
    the dispensing slot at the bottom of the stainless steel dispenser.
  rationale: The video prompt describes a sequence where the camera pans away, a hand triggers the dispenser's
    infrared sensor while the output slot is occluded, and then the camera pans back to the original view.
    The causal mechanism of the automatic dispenser dictates that waving a hand in the sensor zone triggers
    the motor to dispense paper. Therefore, upon returning to the initial viewpoint, the state of the
    dispenser must have changed to show a length of paper towel hanging from the slot.
  questions:
  - id: paper_hanging_presence
    question: Is there a sheet of paper towel hanging from the bottom of the dispenser?
    answer_type: yes_no
    notes_for_judge: Check if white paper is visible extending downwards from the dispensing slot.
  - id: paper_quantity_change
    question: Is the amount of exposed paper towel greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial frame shows no hanging paper; the final frame should show a dispensed
      sheet.
  - id: dispenser_state_active
    question: Does the dispenser appear to have been triggered, resulting in dispensed paper?
    answer_type: yes_no
    notes_for_judge: The presence of the paper is evidence of the mechanism triggering.
  - id: paper_color
    question: Is the dispensed material white?
    answer_type: yes_no
    notes_for_judge: Standard paper towels are white; verify the object hanging is white.
  - id: logo_invariant
    question: Is the Tork logo still visible on the front of the dispenser?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_invariant
    question: Are the white subway tiles on the wall still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
