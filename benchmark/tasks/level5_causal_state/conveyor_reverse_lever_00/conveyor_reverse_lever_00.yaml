id: conveyor_reverse_lever_00
level: 5
category: causal_mechanism
tags: []
variant_of: conveyor_reverse_lever
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: Edit the image to add an industrial control box with a vertical lever attached
    to the right side of the green metal conveyor frame in the foreground. The lever should be depicted
    in the center neutral position.
  video_WM: The camera is stationary, keeping both the cardboard box on the conveyor belt and the control
    lever on the side frame in view. A hand enters the frame and pulls the control lever from the center
    neutral position to the reverse position. STOP.
  camera_WM: The camera is stationary, keeping both the cardboard box on the conveyor belt and the control
    lever on the side frame in view. A hand enters the frame and pulls the control lever from the center
    neutral position to the reverse position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A warehouse scene featuring a cardboard box sitting centrally on a stationary
    conveyor belt. To the right of the belt, in the foreground, is a gray metal control box with a black-handled
    lever currently in a vertical, neutral position. The background contains stacked wooden pallets and
    industrial shelving. The lighting is overhead industrial lighting.
  init2final_edit_prompt: Edit the given image to show the black control lever on the right tilted at
    an angle, indicating it has been switched out of the vertical neutral position. Include a human hand
    visible grasping the lever handle. The cardboard box on the conveyor belt should be shifted to a different
    position along the belt, indicating that the conveyor has moved.
  rationale: 'The video prompt describes a causal chain: a hand interacts with the control mechanism (the
    lever), changing its state from neutral (vertical) to reverse (angled). This functional change in
    the switch state activates the conveyor belt motor, causing the physical object (the box) resting
    on the belt to move. Therefore, the final frame must show the lever in a non-vertical position, the
    presence of the hand as the causal agent, and the box displaced from its original location.'
