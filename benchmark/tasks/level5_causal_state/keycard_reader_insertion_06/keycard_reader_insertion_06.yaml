id: keycard_reader_insertion_06
level: 5
category: causal_mechanism
tags: []
variant_of: keycard_reader_insertion
variation_type: precondition_failure
variation_description: The slot is jammed with paper. The card cannot be fully inserted.
changes:
  occlusion_method: null
  dynamic_conditions: Slot is jammed. Card insertion fails.
  expected_outcome_change: The LED remains dim/unchanged.
prompts:
  init_frame_edit_prompt: Edit the image to show a piece of folded white paper jammed tightly into the
    card slot, protruding slightly.
  video_WM: The camera starts centered on the keycard reader with paper jammed in the slot. The camera
    rotates right at constant speed until the reader exits the view. The camera continues rotating, showing
    the area near the reader. A hand holding a white plastic keycard enters the frame and tries to push
    the keycard into the slot but is obstructed by the paper jam. The hand withdraws the card. The attempt
    occurs while the reader's status LED remains out of camera view. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint, bringing the reader and its status LED back into
    center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the jammed keycard reader, then rotates away. A hand attempts to insert
    a keycard but is blocked by debris. The camera then returns to the reader and status LED. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up of a brushed metal keycard reader mounted on a textured beige wall.
    A brown wooden door frame is visible on the left edge. The reader has a black horizontal slot which
    is stuffed with folded white paper, creating a jam. There are no illuminated lights visible on the
    reader faceplate.
  init2final_edit_prompt: Edit the given image to show the keycard reader with the white paper still jammed
    in the slot. The paper should remain visible and blocking the slot, appearing largely unchanged or
    slightly compressed. Ensure no hand or keycard is present in the frame. The metal plate, beige wall,
    and brown door frame should remain identical to the original view.
  rationale: 'The camera pans away and then returns to the original viewpoint. During the occlusion, a
    hand attempts to insert a keycard but is physically obstructed by the paper jam. Because the card
    cannot fully enter the slot, the reader''s internal mechanism is not triggered, and the status LED
    does not change state (it remains off or in its default idle state). The hand withdraws the card,
    leaving the scene. The final state is visually identical to the initial state: the paper remains jammed
    in the slot, and the reader shows no sign of activation.'
