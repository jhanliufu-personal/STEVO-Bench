id: turnstile_coin_unlock
level: 5
category: causal_mechanism
mechanism_type: payment_unlock_logic
prompts:
  image_gen_prompt: A subway turnstile arm is in the locked position with a red indicator light showing
    on the turnstile mechanism. The three-armed rotating barrier is stationary and locked. The camera
    view is centered on the turnstile arm and red indicator.
  video_WM: The camera starts centered on the locked turnstile arm with its red indicator light. The camera
    rotates right at constant speed until the turnstile exits the view. The camera continues rotating,
    revealing a coin slot mechanism at waist height. A hand holding a token enters the frame and inserts
    the coin into the slot. The turnstile contains a coin detection sensor and mechanical lock mechanism.
    When valid payment is detected, the lock can release to allow rotation. The coin insertion occurs
    while the turnstile arm remains out of camera view. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the turnstile arm and indicator back into center view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the locked turnstile arm, then rotates to the coin slot. A hand inserts
    a token into the slot. The turnstile has coin detection that controls the lock mechanism. The coin
    insertion occurs while the turnstile is not visible. The camera then returns to the turnstile arm.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a metal subway turnstile. The central focus is a stainless
    steel turnstile mechanism with a three-bar rotating arm (tripod style). On the front face of the turnstile
    body, there is a circular red LED display illuminated, consisting of horizontal lines of red lights.
    Below the light, there is a label reading 'LOCKED' and a downward-pointing arrow. To the left and
    right are parts of other turnstile units. In the background, there is a subway station environment
    with white tiled walls and blurred figures of people.
  init2final_edit_prompt: Edit the given image to change the circular red LED indicator light on the central
    turnstile to a bright green LED light. The green light should occupy the same circular area as the
    original red light. Keep the turnstile arms in their original position and preserve the background
    details exactly as they are.
  rationale: The video prompt describes a causal chain where a coin is inserted into the turnstile mechanism
    while the camera is looked away. In standard turnstile systems, inserting a valid payment triggers
    the unlocking mechanism. The visual indicator of this state change is the status light switching from
    red (locked) to green (unlocked/go). Since the prompt does not describe anyone walking through the
    turnstile, the physical arms remain in their initial position, but the electronic state indicator
    must reflect the successful payment.
  questions:
  - id: light_color_green
    question: Is the circular indicator light on the turnstile now green?
    answer_type: yes_no
    notes_for_judge: The primary indicator of the unlocked state is the light changing from red to green.
  - id: red_light_off
    question: Is the red LED signal no longer illuminated?
    answer_type: yes_no
    notes_for_judge: The red light should be replaced by a green light or a 'go' signal.
  - id: state_change_indicator
    question: Does the turnstile display a visual signal indicating it is unlocked (e.g., green light)?
    answer_type: yes_no
    notes_for_judge: Check for the functional state change resulting from the coin insertion.
  - id: indicator_difference
    question: Is the color of the main circular light different from the initial frame?
    answer_type: yes_no
    notes_for_judge: It should change from red to green.
  - id: arms_position
    question: Are the metal turnstile arms in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The turnstile was unlocked but not pushed through, so the arms should not have rotated.
  - id: background_consistency
    question: Are the white tiled walls in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
