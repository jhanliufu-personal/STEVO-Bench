id: car_hood_release
level: 5
category: causal_mechanism
mechanism_type: cable_latch_release_logic
tags: []
prompts:
  image_gen_prompt: A first-person view from the driver's seat of a car in daylight. The steering wheel
    is centered in the frame with the instrument cluster fully illuminated behind it — the car is running.
    Through the windshield, the car hood is clearly visible in the fully closed and latched position,
    flush with the body of the car. The hood release lever is located under the left side of the dashboard,
    near the driver's left knee area, with a small pull handle visible. The surrounding environment in
    daylight is visible through the windshield and side windows.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the closed
    car hood is clearly visible through the windshield. The driver leans forward and downward toward the
    lower dashboard; the windshield and side windows are no longer visible. The hood release lever under
    the left side of the dashboard comes into view near the driver's left knee area. A hand grips the
    lever handle and pulls it firmly outward. The lever is connected via cable to the primary hood latch
    at the front of the car. Hood release is a purely mechanical action that operates independently of
    the ignition state. The driver leans back to the upright seated position. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the car hood fully closed,
    visible through the windshield. The driver leans forward and down, camera pitches down and moves forward,
    revealing the hood release lever under the left side of the dashboard. A hand pulls the lever outward.
    The lever is connected via cable to the hood latch — a purely mechanical action independent of the
    ignition state. The action occurs while the windshield is not visible. The driver leans back to the
    original seated position. STOP.
camera_control:
  HY-WorldPlay: s-3, down-10, w-10, s-10, up-10
evaluation:
  init_frame_description: A driver's perspective from inside a blue Chevrolet Corvette. The black leather
    steering wheel with the Corvette logo is centered. The digital dashboard is illuminated, displaying
    '0 MPH' and 'P' for Park. To the left of the steering wheel, on the lower dashboard, are buttons for
    the trunk release and motion sensors. Through the windshield, the blue hood of the car is visible
    in a closed, flush position. Beyond the hood, a sunny suburban street with trees, sidewalks, and parked
    cars is visible.
  init2final_edit_prompt: Edit the given image so that the car hood visible through the windshield appears
    unlatched and popped open. The rear edge of the hood (closest to the windshield) should be slightly
    elevated relative to the car body, creating a visible gap or separation line that indicates it is
    no longer flush. Maintain the exact appearance of the interior, dashboard, steering wheel, and the
    street scene outside.
  rationale: The video prompt describes a driver pulling the hood release lever. In this specific car
    model (C7 Corvette), the hood is front-hinged, meaning the latches are located near the windshield.
    When the release lever is pulled, the rear edge of the hood (closest to the driver) pops up mechanically.
    Although the camera view is occluded during the action, the return to the upright position reveals
    this state change. Therefore, the final frame must show the hood slightly raised at the cowl, indicating
    it is unlatched.
  questions:
  - id: hood_raised
    question: Is the edge of the hood closest to the windshield raised compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The hood should appear 'popped' or slightly elevated at the edge near the wipers/cowl.
  - id: gap_visible
    question: Is there a visible gap or separation between the hood and the car body that was not present
      initially?
    answer_type: yes_no
    notes_for_judge: Look for the dark line or gap indicating the hood is unlatched.
  - id: hood_flush_check
    question: Is the hood no longer flush with the surrounding body panels?
    answer_type: yes_no
    notes_for_judge: Initially it is flush; finally it should be misaligned/raised.
  - id: mechanism_evidence
    question: Does the hood appear to be in an unlatched state?
    answer_type: yes_no
    notes_for_judge: The visual state should correspond to the mechanical result of pulling the release
      lever.
  - id: interior_consistency
    question: Are the steering wheel and dashboard gauges consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The interior should not change significantly.
  - id: background_consistency
    question: Is the street scene outside the car consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The car has not moved, so the background should be identical.
