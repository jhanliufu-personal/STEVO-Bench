id: car_hood_release
level: 5
category: causal_mechanism
mechanism_type: cable_latch_release_logic
prompts:
  image_gen_prompt: A car hood is shown from the exterior front view. The hood is fully closed and latched.
    The camera view is centered on the closed car hood.
  video_WM: The camera starts centered on the exterior car hood in the closed position. The camera rotates
    right at constant speed until the hood exits the view. The camera continues rotating, revealing the
    car interior with the hood release lever mounted under the dashboard near the driver's left knee.
    A hand enters the frame and pulls the hood release lever firmly. The lever is connected via cable
    to the primary hood latch mechanism. When pulled, the cable releases the latch allowing the hood
    to pop up. The lever pull occurs while the exterior hood remains out of camera view. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the exterior hood
    back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the exterior closed hood, then rotates to the interior hood release
    lever. A hand pulls the lever. The lever pulls a cable that releases the hood latch. The lever pull
    occurs while the hood is not visible. The camera then returns to the exterior hood. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
