id: car_window_switch_05
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: precondition_failure
variation_description: The specific button for the driver's window is missing from the switch panel.
changes:
  occlusion_method: null
  dynamic_conditions: 'Precondition: Mechanical interface missing. Action cannot be completed.'
  expected_outcome_change: The window remains closed.
prompts:
  init_frame_edit_prompt: Edit the image to show the driver window switch button is missing from the door
    armrest panel, leaving an empty socket or exposed contacts.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully closed. The driver leans forward toward the door panel; the side windows are no longer
    visible. The window control switch panel on the door armrest comes into view, revealing that the driver
    window button is missing. A hand reaches for the empty socket where the switch should be and presses
    against the exposed plastic. The window switch is part of the car's electrical system. The driver
    leans back to the upright seated position. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and the driver-side window fully
    closed. The driver leans forward, camera pitches down and moves forward, revealing the window control
    switch panel with a missing button. A hand reaches for the empty socket. The action occurs while the
    windows are not visible. The driver leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Driver's point-of-view inside a car. A black steering wheel is centered. The
    dashboard is illuminated with orange and red lights. The driver's side door panel is visible on the
    left, featuring a beige armrest and a black upper trim. The window control switch unit on the armrest
    is damaged and disassembled, revealing a white plastic connector and exposed red and blue wires where
    the buttons should be. The driver's side window is fully closed, with the glass pane visible and reflecting
    the outside street scene. The side mirror is visible through the closed window.
  init2final_edit_prompt: Edit the given image to show the driver's side window remaining fully closed.
    The view should be identical to the initial frame, with the window glass in the up position, reflecting
    the environment. The damaged window switch area with exposed wires on the door panel must remain visible
    and unchanged. The steering wheel and dashboard indicators should remain exactly as they are in the
    original image.
  rationale: The prompt describes a driver attempting to operate the window using a switch that is explicitly
    described as missing ('empty socket', 'exposed plastic'). Since the functional mechanism (the button)
    is absent, pressing the empty socket or housing does not complete the electrical circuit, and the
    window motor is not triggered. Therefore, the window remains fully closed. The driver returns to the
    initial upright position, restoring the original camera view with no change to the world state.
  questions:
  - id: window_closed_primary
    question: Is the driver's side window still fully closed?
    answer_type: yes_no
    notes_for_judge: The window should not have opened because the switch is broken.
  - id: window_glass_visible
    question: Is the glass pane of the driver's side window still visible in the frame?
    answer_type: yes_no
    notes_for_judge: If the window opened, the glass would be gone or lowered.
  - id: window_state_unchanged
    question: Does the window appear to be in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The state should be unchanged.
  - id: view_through_glass
    question: Is the side mirror still viewed through the window glass (e.g., affected by tint or reflection)?
    answer_type: yes_no
    notes_for_judge: Verifies the glass is still there.
  - id: switch_condition
    question: Is the damaged window switch area with exposed wires still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: steering_wheel_centered
    question: Is the steering wheel centered in the view?
    answer_type: yes_no
    notes_for_judge: Verifies the camera returned to the initial position.
  - id: dashboard_lit
    question: Is the dashboard still illuminated?
    answer_type: yes_no
    notes_for_judge: Consistency check.
