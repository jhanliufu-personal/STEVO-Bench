id: car_window_switch_05
level: 5
category: causal_mechanism
tags: []
variant_of: car_window_switch
variation_type: precondition_failure
variation_description: Window lock button is engaged/lit
changes:
  occlusion_method: null
  dynamic_conditions: Child/Window lock is active. Switch input is disabled.
  expected_outcome_change: Window remains Closed (No change)
prompts:
  init_frame_edit_prompt: Edit the image to show the 'Window Lock' button on the armrest illuminated or
    depressed, indicating the safety lock is active.
  video_WM: Driver's upright POV. The steering wheel is centered, the dashboard is lit, and the driver-side
    window is fully closed. The driver leans forward toward the door panel; the window is no longer visible.
    The window control switch panel comes into view, showing the 'Window Lock' safety indicator is active.
    A hand presses the lower side of the driver window switch downward. The lock mechanism typically prevents
    window movement when engaged. The driver leans back to the upright seated position. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The camera starts in upright driver POV with lit dashboard and window closed. The driver
    leans forward, camera pitches down and moves forward, revealing the window control panel with the
    lock indicator active. A hand presses the window switch downward. The action occurs while the window
    is not visible. The driver leans back to the original seated position. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: From the driver's perspective, the interior of a car is visible. A suede steering
    wheel with a yellow centering stripe is in the foreground. The dashboard gauges are illuminated with
    orange light. To the left, the driver's side window is fully closed, with a 'Lemons Rally' sticker
    applied to the glass. Through the window, a side mirror, a dirt road, and trees are visible. The door
    panel is beige and black.
  init2final_edit_prompt: Edit the given image to show the driver's side window in the fully open position.
    Remove the window glass and the 'Lemons Rally' sticker from the frame, leaving an unobstructed view
    of the outdoors and the side mirror. Ensure the steering wheel, dashboard, and door panel remain unchanged,
    and the view remains from the driver's upright perspective.
  rationale: The driver presses the window switch downward, which is the command to open the window. Although
    the prompt notes the window lock is active, in the vast majority of vehicles, the driver's master
    control overrides the safety lock (which is intended for passengers). The narrative structure—occluding
    the window during the action and then revealing it—strongly implies a state change occurred. Therefore,
    the window should be fully open in the final frame, causing the glass and the attached sticker to
    retract into the door.
