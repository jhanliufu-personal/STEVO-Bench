id: motion_sensor_ceiling_light_06
level: 5
category: causal_mechanism
tags: []
variant_of: motion_sensor_ceiling_light
variation_type: precondition_failure
variation_description: A wire is disconnected at the fixture base. Triggering the sensor has no effect.
changes:
  occlusion_method: null
  dynamic_conditions: 'Precondition failure: Open circuit due to cut wire.'
  expected_outcome_change: No change (light remains dark).
prompts:
  init_frame_edit_prompt: Edit the image to show a severed electrical wire hanging loose from the base
    of the ceiling light fixture.
  video_WM: The camera starts centered on the ceiling light fixture, where a disconnected wire is visible.
    The camera rotates right at constant speed until the light fixture exits the view. The camera continues
    rotating right, revealing a motion sensor mounted on the wall. A hand enters the frame and waves in
    front of the motion sensor. The sensor is a PIR detector designed to close the relay for the light
    circuit upon detecting motion. The hand waves while the ceiling light remains out of view. Then the
    camera rotates left smoothly at the same rate back to the original viewpoint, bringing the ceiling
    light fixture back into center view. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera starts on the ceiling light with a disconnected wire, then rotates to the motion
    sensor. A hand waves in front of the sensor. The sensor is designed to close the relay. The hand motion
    occurs while the light is not visible. The camera then returns to the light fixture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A low-angle shot of a dilapidated room ceiling featuring a vintage, semi-spherical
    metal light fixture base mounted centrally. Two thick, insulated electrical wires hang down from the
    center of the fixture, terminating in frayed, exposed copper ends. There is no light bulb, socket,
    or glass shade attached to the fixture. The surrounding ceiling and walls show signs of age with peeling
    paint. The scene is illuminated by soft, diffuse natural light, likely from a window, casting gentle
    shadows.
  init2final_edit_prompt: Edit the image to ensure the ceiling light fixture and its hanging wires remain
    completely unlit and dark. Do not add any glow, brightness, or artificial illumination to the wires
    or the fixture base. The lighting in the room should remain exactly as it is, consistent with natural
    daylight, showing no evidence of the light fixture turning on.
  rationale: The initial frame establishes that the ceiling light fixture is physically incomplete and
    broken, consisting only of a base and disconnected bare wires with no bulb or socket. Although the
    video prompt describes a causal trigger (motion sensor activation closing a relay), the physical preconditions
    for the light to turn on (a complete circuit and a light source/bulb) are missing. Therefore, the
    correct functional outcome based on a consistent world model is that the light remains off. The final
    state should be visually identical to the initial state regarding the fixture's illumination, demonstrating
    that the system correctly simulates physical constraints over implied script actions.
