id: spring_oscillation_01_07
level: 2
category: spatial_kinematics
tags: []
variant_of: spring_oscillation_01
variation_type: combined
variation_description: The spring is rusty (damped oscillation) and the occlusion method is lights off.
changes:
  occlusion_method: The lights in the room turn off, making the scene completely dark, and then turn back
    on.
  dynamic_conditions: The spring is described as old and rusty, implying high internal friction and damping.
  expected_outcome_change: The oscillation is heavily damped. The weight should move less and settle near
    its equilibrium position much faster than in the original.
prompts:
  init_frame_edit_prompt: Edit the image to make the spring appear rusty and slightly corroded, suggesting
    it is old and stiff.
  video_WM: The weight is released from the pulled-down position. The old, rusty spring groans under the
    tension. The lights in the room are switched off, plunging the scene into complete darkness. After
    a few seconds, the lights are switched back on, revealing the scene. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The weight is released from a state of spring tension. The old, stiff spring and the mass
    of the weight determine the motion. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
