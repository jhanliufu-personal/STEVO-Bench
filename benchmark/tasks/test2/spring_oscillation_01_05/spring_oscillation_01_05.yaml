id: spring_oscillation_01_05
level: 2
category: spatial_kinematics
tags: []
variant_of: spring_oscillation_01
variation_type: combined
variation_description: The mass is increased (slower oscillation) and the occlusion method is lights off.
changes:
  occlusion_method: The lights in the room turn off, making the scene completely dark, and then turn back
    on.
  dynamic_conditions: The dumbbell's mass is increased from 5kg per side to 20kg per side.
  expected_outcome_change: The oscillation is slower (lower frequency). The weight will be at a different
    vertical position in its cycle compared to the original after the occlusion period.
prompts:
  init_frame_edit_prompt: Edit the image to change the text on both ends of the dumbbell from '5 KG' to
    '20 KG'.
  video_WM: The heavy weight is released from the pulled-down position. The spring is high-quality and
    the system has negligible air resistance. The lights in the room are switched off, plunging the scene
    into complete darkness. After a few seconds, the lights are switched back on, revealing the scene.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy weight is released from a state of spring tension. The spring constant and the
    mass of the weight determine the motion. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
