id: spinning_coin_wobble_06
level: 2
category: spatial_kinematics
tags: []
variant_of: spinning_coin_wobble
variation_type: dynamic_condition
variation_description: 'Initial state changed: coin is already leaning heavily and wobbling.'
changes:
  occlusion_method: null
  dynamic_conditions: Coin is in the final stages of spin (low angle wobble).
  expected_outcome_change: The coin will definitely fall flat very quickly.
prompts:
  init_frame_edit_prompt: Edit the image so the coin is leaning significantly, forming a 30-degree angle
    with the table, wobbling heavily.
  video_WM: The coin is in the final stages of its spin, leaning heavily and wobbling rapidly on the wooden
    surface. Gravity pulls on the angled coin. Friction acts on the edge. The coin is a standard metal
    quarter. The camera rotates right at constant speed until the coin completely exits the view to the
    right. The camera continues rotating right for several seconds while the coin remains off-screen.
    Then the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The coin is in the final stages of its spin, leaning heavily and wobbling rapidly on the
    wooden surface. Gravity pulls on the angled coin. Friction acts on the edge. The coin is a standard
    metal quarter during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A silver quarter coin spinning on its edge on a scratched wooden table. The
    coin is angled and leaning, indicating it is in motion. The background features a blurred window frame
    and wall.
  init2final_edit_prompt: Edit the given image so that the silver quarter is lying completely flat on
    the wooden table surface. The coin should be resting on one of its faces, positioned in the same general
    area on the wood where it was previously standing. Ensure the coin is no longer standing on its edge
    or leaning. Maintain the original wooden texture, lighting, shadows, and background details exactly
    as they are.
  rationale: The initial frame shows a coin in the final, unstable stages of a spin, already leaning and
    wobbling. The video prompt describes a camera sequence where the view rotates away for several seconds
    before returning to the original angle. Due to the action of friction and gravity over this elapsed
    time, the coin's remaining angular momentum would dissipate, causing it to lose stability and fall
    flat onto the table surface by the time the camera returns.
