prompts:
  image_gen_prompt: A bicycle wheel is suspended horizontally by its axle from a stand. The wheel is spinning rapidly at high speed with the spokes appearing as a blur. The tire and rim are clearly visible as they rotate.
  video_WM: The wheel continues spinning freely on its axle bearing. The axle bearing has moderate friction typical of standard ball bearings without lubrication. Air resistance acts on the rotating spokes and rim as they move through the air. No external torque is applied to the wheel. The wheel has standard mass distribution for a bicycle wheel. The camera rotates right at constant speed until the wheel completely exits the view to the right. The camera continues rotating right for several seconds while the wheel remains off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the suspended wheel back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The wheel continues spinning freely on its axle bearing. The axle bearing has moderate friction typical of standard ball bearings without lubrication. Air resistance acts on the rotating spokes and rim as they move through the air. No external torque is applied to the wheel. The wheel has standard mass distribution for a bicycle wheel during the occlusion period. STOP.
