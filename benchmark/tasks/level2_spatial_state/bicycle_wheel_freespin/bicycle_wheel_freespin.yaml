id: bicycle_wheel_freespin
level: 2
category: spatial_kinematics
kinematic_variable: Angular velocity with rotational friction
tags: []
prompts:
  image_gen_prompt: A bicycle wheel is suspended horizontally by its axle from a stand. The wheel is spinning
    rapidly at high speed with the spokes appearing as a blur. The tire and rim are clearly visible as
    they rotate.
  video_WM: The wheel continues spinning freely on its axle bearing. The axle bearing has moderate friction
    typical of standard ball bearings without lubrication. Air resistance acts on the rotating spokes
    and rim as they move through the air. No external torque is applied to the wheel. The wheel has standard
    mass distribution for a bicycle wheel. The camera rotates right at constant speed until the wheel
    completely exits the view to the right. The camera continues rotating right for several seconds while
    the wheel remains off-screen. Then the camera rotates left smoothly at the same rate back to the original
    viewpoint, bringing the suspended wheel back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The wheel continues spinning freely on its axle bearing. The axle bearing has moderate friction
    typical of standard ball bearings without lubrication. Air resistance acts on the rotating spokes
    and rim as they move through the air. No external torque is applied to the wheel. The wheel has standard
    mass distribution for a bicycle wheel during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A bicycle wheel with a black tire and silver rim is mounted horizontally on
    a vertical metal stand made of square tubing. The wheel is spinning, indicated by significant motion
    blur on the silver spokes. The central hub is silver and attached to the stand's arm. The background
    shows a workshop environment with a workbench, a blue vise, white walls, and overhead fluorescent
    lights.
  init2final_edit_prompt: Edit the given image to show the bicycle wheel still mounted on the metal stand
    in the exact same position and horizontal orientation. The wheel should still exhibit motion blur
    on the spokes, indicating it is spinning, though the blur may be slightly less intense than in the
    original view. Ensure the background workbench, tools, and lighting remain unchanged.
  rationale: The camera pans away from the wheel and then returns to the original viewpoint. Physically,
    the wheel is mounted on a fixed axle, so its position and orientation relative to the room must remain
    invariant (object permanence and spatial consistency). Kinematically, the wheel is spinning freely
    subject to friction and air resistance. While these forces cause angular deceleration, a standard
    bicycle wheel has high rotational inertia and would not stop completely in the span of 'several seconds'.
    Therefore, the final state should show the wheel in the same location, still spinning (visible motion
    blur), but potentially with slightly reduced angular velocity compared to the start.
