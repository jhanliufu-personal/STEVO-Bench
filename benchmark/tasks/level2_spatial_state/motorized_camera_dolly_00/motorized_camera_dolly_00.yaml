id: motorized_camera_dolly_00
level: 2
category: spatial_kinematics
tags: []
variant_of: motorized_camera_dolly
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A camera dolly is positioned on straight metal tracks. The motorized drive is engaged to ensure
    a constant, unwavering velocity. Camera remains stationary throughout, keeping the dolly fully in
    view. No zoom, no cut, no scene change.
  camera_WM: A camera dolly is positioned on straight metal tracks. The motorized drive is engaged to
    ensure a constant, unwavering velocity. Camera remains stationary throughout, keeping the dolly fully
    in view. No zoom, no cut, no scene change.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: 'A film studio setting with a green screen in the background. In the foreground,
    straight metal dolly tracks run diagonally across the concrete floor from bottom-right towards the
    left. A large camera dolly rig sits on the tracks on the right side of the frame. Two men are on the
    dolly: one sitting in the operator seat and one standing behind him. A large professional film camera
    is mounted on the dolly''s arm.'
  init2final_edit_prompt: Edit the given image so that the entire camera dolly rig and the two men operating
    it have moved significantly along the metal tracks towards the left side of the image. The dolly should
    be positioned further down the rails, leaving the track segment at the bottom right empty. Ensure
    the background studio environment, including the green screen, lights, and equipment cases, remains
    exactly in the same position.
  rationale: The prompt specifies that the motorized drive is engaged with a constant velocity. Since
    the dolly is constrained to the tracks and positioned near the right end of the visible rails, the
    physical motion must be along the tracks towards the left (where the tracks extend). The observing
    camera is stationary, so the dolly will physically displace within the frame from right to left.
  questions:
  - id: dolly_moved
    question: Has the camera dolly moved from its initial position?
    answer_type: yes_no
    notes_for_judge: Compare the position of the dolly wheels relative to the floor markings or track
      ends.
  - id: dolly_direction_left
    question: Is the camera dolly positioned further to the left side of the frame than it was initially?
    answer_type: yes_no
    notes_for_judge: The dolly should have traveled along the tracks towards the left.
  - id: track_position_change
    question: Are the dolly wheels located on a different segment of the metal tracks?
    answer_type: yes_no
    notes_for_judge: Check if the wheels have rolled along the rails.
  - id: empty_start_pos
    question: Is the section of the track where the dolly started (bottom right) now more visible/exposed?
    answer_type: yes_no
    notes_for_judge: As the dolly moves left, the track behind it should become visible.
  - id: distance_from_right_edge
    question: Is the distance between the dolly and the right edge of the image greater than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Measure the gap between the dolly structure and the right frame border.
  - id: operators_moved
    question: Have the two men moved along with the dolly to the new position?
    answer_type: yes_no
    notes_for_judge: The operators are seated/standing on the moving dolly.
  - id: background_static_green_screen
    question: Is the green screen in the background in the same position relative to the frame edges?
    answer_type: yes_no
    notes_for_judge: The observing camera is stationary, so the background should not shift.
  - id: background_static_lights
    question: Are the overhead studio lights in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for stationary camera.
