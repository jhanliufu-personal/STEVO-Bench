camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up side view of a utility sink area. On the left, a metal faucet extends
    from the wall, emitting a stream of water. On the right, a person's hands are holding a black, wire-caged
    electric fan, positioning it to face the water stream. The water stream is currently being hit by
    the airflow, causing it to spray chaotically towards the left rather than falling straight down. The
    background consists of white tiled walls.
  init2final_edit_prompt: Edit the given image to show the water stream continuing to flow and being blown
    forcefully to the left by the fan. The water should appear as a chaotic spray or mist directed away
    from the fan, with a new and distinct pattern of droplets compared to the original, consistent with
    ongoing fluid dynamics. The fan blades should appear blurred to indicate high-speed rotation. The
    hands holding the fan and the faucet should remain in their original positions.
  rationale: The initial frame shows a state where the fan is already interacting with the water, or just
    beginning to. The prompt 'switched to its maximum setting' ensures the fan is active and powerful.
    The rollout will depict the continuous physical interaction where the horizontal airflow transfers
    momentum to the vertical water stream, deflecting it to the left. The primary state change is the
    temporal evolution of the fluid (new droplet positions) and the maintenance of the deflected trajectory
    against gravity. The fan blades will exhibit motion blur.
