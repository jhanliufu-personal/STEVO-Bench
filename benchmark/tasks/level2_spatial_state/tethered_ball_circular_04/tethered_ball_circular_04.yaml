id: tethered_ball_circular_04
level: 2
category: spatial_kinematics
tags: []
variant_of: tethered_ball_circular
variation_type: dynamic_condition
variation_description: The string is visibly frayed and damaged, implying it might break under tension.
changes:
  occlusion_method: null
  dynamic_conditions: String is frayed and holding by a thread.
  expected_outcome_change: The string breaks, causing the ball to fly off tangentially in a straight line
    rather than continuing the circle.
prompts:
  init_frame_edit_prompt: Edit the image to show the string looks extremely frayed, thin, and damaged
    near the attachment point to the ball, as if about to snap.
  video_WM: The tethered ball is spinning in a horizontal circle. The string is visibly frayed near the
    ball, holding on by only a few thin threads under the tension. The camera rotates right until the
    entire apparatus completely exits the view, then rotates toward the left smoothly at the same rate
    until the central pole is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The tethered ball is spinning in a horizontal circle. The string is visibly frayed near the
    ball, holding on by only a few thin threads under the tension. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A red ball is suspended in the air on the left, attached to a taut horizontal
    string. The string connects to a vertical wooden pole positioned on the right side of the frame. The
    string is visibly frayed and thinning near its connection to the ball. The background consists of
    a dry, dusty ground.
  init2final_edit_prompt: Edit the given image to show that the string has snapped due to tension. Remove
    the red ball from the scene. Depict the string as slack and hanging loosely down from the wooden pole,
    rather than being taut horizontally. The loose end of the string should appear frayed. Keep the wooden
    pole and the ground background unchanged.
  rationale: 'The initial frame establishes a precarious physical state: a spinning ball exerting tension
    on a string that is ''holding on by only a few thin threads''. During the occlusion period (camera
    rotating away and back), the tension and motion dynamics imply that the frayed string will snap. Physically,
    the ball would fly off tangentially (exiting the frame due to its velocity) and the string would lose
    tension and fall slack against the pole. The final state should therefore reflect the aftermath of
    this structural failure.'
