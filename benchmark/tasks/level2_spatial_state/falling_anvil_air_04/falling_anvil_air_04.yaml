id: falling_anvil_air_04
level: 2
category: spatial_kinematics
tags: []
variant_of: falling_anvil_air
variation_type: dynamic_condition
variation_description: Anvil has a parachute, drastically increasing air resistance.
changes:
  occlusion_method: null
  dynamic_conditions: Anvil is attached to a parachute (high drag).
  expected_outcome_change: The anvil falls much slower; final position is higher than original.
prompts:
  init_frame_edit_prompt: Edit the image to show a large, deployed parachute attached to the top of the
    anvil.
  video_WM: The anvil, suspended by a large open parachute, descends slowly through the air due to high
    air resistance counteracting gravity. The camera rotates right until the anvil completely exits the
    view, then rotates toward the left smoothly at the same rate until the crane hook is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The anvil, suspended by a large open parachute, descends slowly through the air due to high
    air resistance counteracting gravity. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large rusty anvil is suspended in the air by a fully inflated white and orange
    parachute. To the left, a yellow construction crane jib extends horizontally with a hook hanging from
    it. The background features a clear blue sky and a cityscape below. There is some debris or dust near
    the anvil.
  init2final_edit_prompt: Edit the given image to position the yellow crane hook in the horizontal center
    of the frame. Place the anvil and parachute significantly lower in the frame to reflect downward motion.
    Shift the anvil and parachute horizontally closer to the right edge of the image.
  rationale: The camera performs a panning sequence (right then left) that consumes time, allowing the
    anvil to descend under gravity. The parachute creates air resistance, causing a slow but steady descent.
    The final camera movement centers the crane hook (originally on the left), which shifts the framing
    to the left relative to the initial view, causing the anvil (positioned to the right of the hook)
    to appear further to the right in the final frame.
