id: cart_spring_release_03
level: 2
category: spatial_kinematics
tags: []
variant_of: cart_spring_release
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to camera zooming out.
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The release mechanism disengages and the compressed spring is freed to expand. The cart is
    free to move along the smooth track with low friction wheels. The track extends several feet forward
    from the starting position. The spring has a strong spring constant typical of steel coils. The camera
    zooms out rapidly until the cart and spring are too small to distinguish details, revealing the wider
    messy workshop. The camera holds this distant view for several seconds. Then the camera zooms back
    in to the original framing. No cut, no scene change. STOP.
  camera_WM: The release mechanism disengages and the compressed spring is freed to expand. The cart is
    free to move along the smooth track with low friction wheels. The track extends several feet forward
    from the starting position. The spring has a strong spring constant typical of steel coils during
    the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A red metal utility cart with black rubber wheels sits on a wooden track system
    on a workbench. A large, compressed heavy-duty metal spring is positioned between the rear of the
    cart and a vertical concrete pillar on the right. A person's hand is visible on the right, holding
    a metal release latch or lever mechanism. The background shows a workshop setting with a window, tools,
    and sawdust.
  init2final_edit_prompt: Edit the given image to show the red cart moved significantly to the left along
    the wooden track, creating a large gap between the cart and the concrete pillar. The metal spring
    should be fully expanded and uncoiled, extending from the pillar towards the left. The section of
    the wooden track where the cart was originally sitting should now be exposed and empty. The hand holding
    the release mechanism should be released or removed.
  rationale: The video prompt describes the release of a compressed spring, which converts potential energy
    into kinetic energy, pushing the cart to the left (forward) along the track. The camera zooms out
    and then returns to the exact original framing after several seconds. Physically, the cart will have
    accelerated away from the concrete block due to the spring force and low friction, likely moving significantly
    to the left or even off-screen. The spring will be left in an expanded, uncompressed state. The final
    frame must show this new physical configuration from the original viewpoint.
