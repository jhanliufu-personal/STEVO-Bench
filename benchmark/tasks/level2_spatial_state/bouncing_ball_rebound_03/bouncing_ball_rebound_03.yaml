id: bouncing_ball_rebound_03
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to thick fog filling the room
changes:
  occlusion_method: Thick white fog/smoke fills the space
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood with
    elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. Rapidly, thick white fog fills the entire room, obscuring the floor, the hand, and
    the ball completely. The fog swirls densely for several seconds, hiding all motion. Then the fog dissipates
    quickly, clearing the view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood
    with elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. Rapidly, thick white fog fills the entire room, obscuring the floor, the hand, and
    the ball completely. The fog swirls densely for several seconds, hiding all motion. Then the fog dissipates
    quickly, clearing the view. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of a robotic arm with a black carbon fiber texture and silver
    metal joints extending from the top right. The arm's three-fingered gripper is holding a yellow-green
    tennis ball. The background is a polished hardwood floor with a herringbone pattern, showing reflections
    of light.
  init2final_edit_prompt: Edit the given image to show the robotic gripper empty, with the fingers open.
    Place the tennis ball on the hardwood floor directly below the gripper, resting on the surface. Ensure
    the ball casts a natural shadow on the floor.
  rationale: The prompt specifies that the ball is released and gravity acts upon it. Although the floor
    is elastic and the ball would bounce, the duration of 'several seconds' during which the fog swirls
    is sufficient for the ball's kinetic energy to dissipate significantly, causing it to settle on the
    floor or roll to a stop. The fog dissipates at the end, revealing the final state where the ball is
    no longer in the gripper but resting on the floor below.
  questions:
  - id: ball_separated
    question: Is the tennis ball separated from the robotic gripper?
    answer_type: yes_no
    notes_for_judge: The ball should no longer be held by the fingers.
  - id: ball_lower
    question: Is the tennis ball positioned lower than its initial height?
    answer_type: yes_no
    notes_for_judge: The ball must have fallen due to gravity.
  - id: ball_on_floor
    question: Is the tennis ball resting on or very near the floor surface?
    answer_type: yes_no
    notes_for_judge: After several seconds, the ball should have settled on the floor.
  - id: gripper_empty
    question: Is the robotic gripper empty?
    answer_type: yes_no
    notes_for_judge: The gripper should not be holding anything.
  - id: vertical_alignment
    question: Is the tennis ball located generally below the gripper's position?
    answer_type: yes_no
    notes_for_judge: It should fall roughly vertically, allowing for minor bounce displacement.
  - id: fog_cleared
    question: Is the view clear of the thick white fog mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the fog dissipates quickly, clearing the view.
  - id: floor_consistency
    question: Is the herringbone floor pattern visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should remain unchanged.
