id: bouncing_ball_rebound
level: 2
category: spatial_kinematics
kinematic_variable: Vertical position through collision cycles
tags: []
prompts:
  image_gen_prompt: A tennis ball is held by a hand at shoulder height, approximately 1.5 meters above
    a solid hardwood floor. The hand is in the process of releasing the ball.
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood with
    elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. The camera rotates right at constant speed until the ball and hand completely exit
    the view to the right. The camera continues rotating right for several seconds while the ball remains
    off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the floor area back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood
    with elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A high-angle shot showing a person's arm and hand in the upper right corner,
    fingers spread open as if just releasing an object. A yellow-green tennis ball is suspended in mid-air
    immediately below the fingertips. The background consists of a polished hardwood floor and the bottom
    edge of a white window frame with blinds.
  init2final_edit_prompt: Edit the given image to place the tennis ball on the hardwood floor near the
    bottom of the frame. Remove the floating ball from the space immediately below the hand. Ensure the
    ball appears to be resting on the ground surface. Keep the position of the arm and hand in the upper
    right unchanged, and maintain the original background details of the floor and window.
  rationale: The video prompt describes a physics sequence where the ball is released and subjected to
    gravity. The camera pans away for a duration of several seconds before returning to the original view.
    During this elapsed time, the ball will have fallen, bounced, and dissipated its kinetic energy, likely
    settling on the floor or rolling slightly. Therefore, in the final frame, the ball must be located
    on the ground, significantly lower than its initial release height.
  questions:
  - id: ball_height_change
    question: Is the tennis ball positioned lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: The ball must have fallen due to gravity.
  - id: ball_ground_contact
    question: Is the tennis ball resting on or very close to the hardwood floor?
    answer_type: yes_no
    notes_for_judge: After several seconds, the ball should have settled on the floor.
  - id: hand_ball_separation
    question: Is the vertical distance between the hand and the ball greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should be far below the hand, not hovering near it.
  - id: ball_not_floating
    question: Is the space immediately below the fingers empty?
    answer_type: yes_no
    notes_for_judge: The ball should no longer be suspended in mid-air near the hand.
  - id: background_consistency
    question: Is the hardwood floor pattern still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: hand_presence
    question: Is the arm or hand still visible in the upper right area?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
