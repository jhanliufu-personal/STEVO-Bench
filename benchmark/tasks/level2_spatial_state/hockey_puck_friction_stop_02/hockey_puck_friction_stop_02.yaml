evaluation:
  init_frame_description: A black hockey puck sliding on a rough, cracked concrete floor. There is a cloud
    of dust and debris spraying up around the puck, indicating motion and friction. The background consists
    of the same concrete surface, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the hockey puck in a different position on the
    concrete floor, displaced from its original location. Remove the cloud of dust and debris spray, depicting
    the puck as having settled or stopped moving. Keep the concrete cracks, texture, and lighting exactly
    the same as the initial frame. Ensure the view of the floor is unobstructed.
  rationale: The puck is initially sliding on a surface with high friction (rough concrete). During the
    occlusion period of several seconds, the kinetic energy of the puck is dissipated by friction, causing
    it to decelerate and likely come to a complete stop. Consequently, in the final frame, the puck should
    be displaced from its starting position (having traveled along its trajectory) and the dynamic dust/debris
    cloud caused by the initial rapid motion should have settled. The camera remains static, so the background
    features (cracks) must remain fixed.
