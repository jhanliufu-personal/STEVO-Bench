id: hockey_puck_friction_stop_02
level: 2
category: spatial_kinematics
tags: []
variant_of: hockey_puck_friction_stop
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a rolling garage door blocking the view.
changes:
  occlusion_method: A rolling garage door descends in the foreground to block the view, then rises.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber. No external forces are applied.
    A heavy rolling garage door descends in the foreground, completely blocking the view of the concrete
    floor and the puck. The door remains closed for several seconds. Then the door rises smoothly, revealing
    the concrete floor area again. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber. No external forces are applied.
    A heavy rolling garage door descends in the foreground, completely blocking the view of the concrete
    floor and the puck. The door remains closed for several seconds. Then the door rises smoothly, revealing
    the concrete floor area again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A black hockey puck sliding on a rough, cracked concrete floor. There is a cloud
    of dust and debris spraying up around the puck, indicating motion and friction. The background consists
    of the same concrete surface, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the hockey puck in a different position on the
    concrete floor, displaced from its original location. Remove the cloud of dust and debris spray, depicting
    the puck as having settled or stopped moving. Keep the concrete cracks, texture, and lighting exactly
    the same as the initial frame. Ensure the view of the floor is unobstructed.
  rationale: The puck is initially sliding on a surface with high friction (rough concrete). During the
    occlusion period of several seconds, the kinetic energy of the puck is dissipated by friction, causing
    it to decelerate and likely come to a complete stop. Consequently, in the final frame, the puck should
    be displaced from its starting position (having traveled along its trajectory) and the dynamic dust/debris
    cloud caused by the initial rapid motion should have settled. The camera remains static, so the background
    features (cracks) must remain fixed.
  questions:
  - id: puck_displacement
    question: Is the hockey puck in a different position on the concrete floor compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The puck must have moved from its original coordinates due to the initial sliding
      motion.
  - id: dust_settled
    question: Is the dust and debris spray around the puck absent in the final frame?
    answer_type: yes_no
    notes_for_judge: The puck should have slowed down or stopped, so the motion-induced dust cloud should
      be gone.
  - id: puck_visibility
    question: Is the hockey puck visible on the concrete floor?
    answer_type: yes_no
    notes_for_judge: The puck should be revealed again after the door opens.
  - id: background_consistency
    question: Are the cracks and texture of the concrete floor in the same position as in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The camera does not move; the background features must align perfectly.
  - id: occluder_gone
    question: Is the view of the concrete floor unobstructed by the garage door?
    answer_type: yes_no
    notes_for_judge: The prompt states the door rises, revealing the floor again.
  - id: motion_state
    question: Does the puck appear to be at rest or moving significantly slower (no motion blur or spray)
      compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Friction should have slowed or stopped the puck.
