id: sliding_block_frictionless_09
level: 2
category: spatial_kinematics
tags: []
variant_of: sliding_block_frictionless
variation_type: combined
variation_description: Block is replaced by a massive static object, combined with zoom occlusion.
changes:
  occlusion_method: Camera zoom out/in
  dynamic_conditions: Object is massive and stationary (not sliding)
  expected_outcome_change: Object remains exactly where it was.
prompts:
  init_frame_edit_prompt: Edit the image to replace the sliding block with a massive, heavy lead cube
    that is sitting completely still.
  video_WM: A massive lead cube sits stationary on the ice. It is heavy and not moving. The camera zooms
    out rapidly until the cube is just a tiny speck in the distance, effectively losing detail. The camera
    then zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: A massive lead cube sits stationary on the ice. It is heavy and not moving. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A large, dark, metallic lead cube sits on a frozen ice surface. To the left,
    a black mechanical robotic arm with hydraulic cylinders extends horizontally into the frame, its gripper
    positioned close to the side of the cube but not touching it. The background features a flat, icy
    horizon under a pale, twilight sky. Reflections of the cube and the arm are visible on the slick ice
    surface.
  init2final_edit_prompt: Edit the given image to show the lead cube and the mechanical arm in their exact
    original locations and orientations. The cube should be resting on the ice in the center, and the
    mechanical arm should be extending from the left side, maintaining the precise spatial gap between
    the gripper and the cube face. The framing and perspective should match the initial view.
  rationale: The prompt explicitly states that the cube is stationary, heavy, and not moving. The only
    action described is a camera movement that zooms out and then back in to the original framing. Therefore,
    the physical state of the world (position of the cube and arm) remains unchanged. The final frame
    should be visually identical to the initial frame, testing the model's ability to maintain spatial
    consistency and object permanence after the details are temporarily lost during the zoom-out.
