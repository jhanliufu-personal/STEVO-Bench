id: yoyo_drop
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A large metal yo-yo is held by its string at a height of 2 meters. The string is wound
    perfectly around the central axle. The yo-yo is currently stationary.
  video_WM: The yo-yo is released from the hand. The end of the string remains fixed in the air. The yo-yo
    is free to move toward the floor. The camera rotates right until the yo-yo completely exits the view,
    then rotates toward the left smoothly at the same rate until the hand holding the string is back in
    the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The yo-yo is released from a fixed string. Gravity acts on the mass while the wound string
    constrains the rotation of the axle. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up of a large, silver metal yo-yo suspended in mid-air by a white twisted
    string. A hand is visible at the very top edge holding the string. The background is an out-of-focus
    industrial workshop with concrete floors, metal walls, and a bright window in the distance.
  init2final_edit_prompt: Edit the given image to show the metal yo-yo positioned significantly lower
    in the frame, closer to the floor. Extend the white string vertically downwards from the top edge
    to connect with the new, lower position of the yo-yo. Keep the hand at the top and the background
    unchanged.
  rationale: 'The prompt specifies that the yo-yo is released and free to move toward the floor, meaning
    gravity will cause it to unwind and descend. The camera pans away and then returns to the initial
    view (centering the hand). Therefore, in the final frame, the viewpoint is the same as the start,
    but the physical state of the yo-yo has changed: it must be vertically lower due to the time elapsed
    during the camera movement.'
