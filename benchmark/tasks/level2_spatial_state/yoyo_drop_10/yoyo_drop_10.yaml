id: yoyo_drop_10
level: 2
category: spatial_kinematics
tags: []
variant_of: yoyo_drop
variation_type: combined
variation_description: Elastic bungee cord (bounce) + Camera zoom occlusion.
changes:
  occlusion_method: Camera zoom.
  dynamic_conditions: String is an elastic bungee cord.
  expected_outcome_change: Yo-yo bounces/oscillates.
prompts:
  init_frame_edit_prompt: Edit the image to show the string is a thick, textured rubber bungee cord instead
    of a twisted cotton string.
  video_WM: The yo-yo is released attached to an elastic bungee cord. The camera zooms out rapidly until
    the yo-yo and hand are too small to distinguish. The camera holds this distant view, then zooms back
    in to the original framing. No cut, no scene change. STOP.
  camera_WM: The yo-yo is released attached to an elastic bungee cord. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up, eye-level shot of a large, polished aluminum yo-yo or spool suspended
    by a thick, grey woven cord. The cord is coiled around the center axle of the yo-yo and connects to
    a metal hook held by fingers at the very top of the frame. The background is a blurred industrial
    warehouse interior with a concrete floor, metal beams, and bright windows in the distance.
  init2final_edit_prompt: Edit the given image to show the metal yo-yo hanging lower in the frame, significantly
    further down from the top hook. Extend the length of the vertical cord connecting the hook to the
    yo-yo to show that it has unwound or stretched downwards. Keep the background, lighting, and camera
    framing exactly the same as the original image.
  rationale: The prompt describes the yo-yo being released. Physically, this causes the object to fall
    due to gravity, either unwinding the cord or stretching the bungee. Since the initial state is the
    release point (maximum potential energy), any subsequent state captured after the drop will show the
    object at a lower vertical position relative to the anchor point. The camera returns to the original
    framing, so the background remains static while the object's position changes within that frame.
  questions:
  - id: q1_vertical_pos
    question: Is the metal yo-yo positioned lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the yo-yo center relative to the background or top
      edge.
  - id: q2_cord_length
    question: Is the visible section of the cord between the hook and the yo-yo longer than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The cord should appear extended as the object drops.
  - id: q3_displacement
    question: Has the yo-yo moved downwards relative to the metal hook at the top?
    answer_type: yes_no
    notes_for_judge: The hook stays fixed (held by hand), the yo-yo drops.
  - id: q4_separation
    question: Is there a greater vertical distance between the holding hand/hook and the yo-yo body compared
      to the start?
    answer_type: yes_no
    notes_for_judge: Check for increased separation between the anchor point and the object.
  - id: q5_background_consistency
    question: Is the industrial warehouse background consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original framing, so the background should match.
  - id: q6_hook_visibility
    question: Is the metal hook still visible at the top of the frame?
    answer_type: yes_no
    notes_for_judge: The framing returns to the start, so the anchor point should still be in view.
