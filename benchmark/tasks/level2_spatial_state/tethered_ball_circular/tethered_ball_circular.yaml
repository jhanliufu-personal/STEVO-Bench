id: tethered_ball_circular
level: 2
category: spatial_kinematics
kinematic_variable: Orbital position (phi)
prompts:
  image_gen_prompt: A small ball is tied to a string which is attached to a central vertical pole. The
    ball is currently spinning in a perfectly horizontal circle at high speed.
  video_WM: The tethered ball is spinning in a horizontal circle at a constant angular velocity. The tension
    in the string maintains its orbital path. The camera rotates right until the entire apparatus completely
    exits the view, then rotates toward the left smoothly at the same rate until the central pole is back
    in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The tethered ball rotates in a horizontal circle at a constant speed, maintained by the tension
    of the string. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A vertical wooden pole is centered in the frame, planted in a dirt ground. A
    red ball is attached to the pole by a taut string and is positioned to the left of the pole, hovering
    above the ground. The background consists of blurred natural terrain.
  init2final_edit_prompt: Edit the given image to show the red ball positioned on the right side of the
    central pole, maintaining the taut string connection, to represent orbital motion. Ensure the wooden
    pole remains vertically centered in the frame. Keep the background and ground texture consistent.
  rationale: The camera performs a panning motion away from the apparatus and then returns to the original
    viewing angle. This operation takes a significant amount of time. During this interval, the tethered
    ball continues to spin at a constant angular velocity due to the physics of the setup. When the camera
    returns to center the pole, the ball will have progressed along its circular orbit and will be at
    a different position than the initial frame (statistically unlikely to be in the exact same phase).
    The final state must show the pole centered and the ball displaced along its path.
  questions:
  - id: pole_centered
    question: Is the vertical wooden pole positioned in the horizontal center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera rotates back to center the pole.
  - id: ball_moved
    question: Has the red ball moved from its initial position on the left side of the image?
    answer_type: yes_no
    notes_for_judge: The ball is spinning, so it should not be in the exact same spot after time passes.
  - id: ball_displacement
    question: Is the red ball located at a different angle relative to the pole compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Checks for orbital progress.
  - id: string_taut
    question: Is the string connecting the ball to the pole appearing taut or straight?
    answer_type: yes_no
    notes_for_judge: Centripetal force keeps the string taut during motion.
  - id: height_consistency
    question: Is the red ball maintaining roughly the same height above the ground as in the initial frame?
    answer_type: yes_no
    notes_for_judge: Horizontal circle implies height conservation.
  - id: connection_exists
    question: Is the red ball still attached to the central pole via the string?
    answer_type: yes_no
    notes_for_judge: Physics constraint.
  - id: background_consistency
    question: Is the ground texture (dirt/sand) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
