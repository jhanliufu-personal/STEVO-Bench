prompts:
  init_frame_edit_prompt: Edit the image to make the concrete surface slant downwards in the direction
    the puck is sliding.
  video_WM: The puck slides down a rough concrete slope. Gravity acts in the direction of motion, assisting
    the slide. A large cardboard box falls in the immediate foreground, completely blocking the camera's
    view of the puck and slope. The box remains for several seconds before being lifted away, revealing
    the slope again. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides down a rough concrete slope. Gravity acts in the direction of motion, assisting
    the slide. A large cardboard box falls in the immediate foreground, completely blocking the camera's
    view of the puck and slope. The box remains for several seconds before being lifted away, revealing
    the slope again. No zoom, no cut, no scene change. STOP.
