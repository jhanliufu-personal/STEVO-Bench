id: cart_spring_release_10
level: 2
category: spatial_kinematics
tags: []
variant_of: cart_spring_release
variation_type: combined
variation_description: Spring disconnected from cart combined with camera moving away.
changes:
  occlusion_method: Camera physically moves backward away from scene.
  dynamic_conditions: Spring disconnected from cart.
  expected_outcome_change: Spring expands but cart does not move.
prompts:
  init_frame_edit_prompt: Edit the image so the spring is physically detached from the cart, lying on
    the ground next to the connection point.
  video_WM: The release mechanism is toggled. The spring is physically disconnected from the cart. The
    cart sits freely on the track. The camera physically moves backward through the workshop until the
    cart is no longer visible in the distance and clutter. It stays there for several seconds. Then the
    camera moves forward rapidly, returning to the original viewpoint. No cut, no scene change. STOP.
  camera_WM: The release mechanism is toggled. The spring is physically disconnected from the cart. The
    cart sits freely on the track. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A red metal toy wagon sits on wooden rails in a workshop. A large metal coil
    spring lies in the foreground on the wooden structure. A person's hand is visible on the right, holding
    the wagon's handle in a horizontal position using a latch tool. The background features a basement
    wall, a window, and various tools.
  init2final_edit_prompt: Edit the given image to show the red wagon with its handle released and dropped
    down due to gravity. The handle should be pointing downwards or resting on the wooden track, no longer
    held horizontally. Remove the hand and the latch tool from the right side of the frame. The red wagon
    body should remain stationary on the wooden rails. The large spring in the foreground should remain
    visible but clearly disconnected from the cart.
  rationale: The video prompt describes a release mechanism being toggled and the camera moving away for
    several seconds before returning. This implies that the hand holding the wagon handle releases it
    and leaves the scene. Without the hand's support, the hinged handle of the wagon will fall due to
    gravity and come to rest pointing downwards or on the track. The cart itself is described as sitting
    freely, so it remains on the rails without rolling away.
