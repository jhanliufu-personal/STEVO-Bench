evaluation:
  init_frame_description: A close-up, eye-level shot of a black hockey puck on a wet, oily concrete floor.
    The puck is in the center of the frame. There are active splash droplets and a spray of liquid around
    the puck, indicating recent impact or rapid motion. The background is a blurred garage or outdoor
    setting with natural lighting.
  init2final_edit_prompt: Edit the given image to show the black hockey puck at a new position on the
    concrete floor, displaced from the center. Remove the splashing water droplets and spray, leaving
    the oily surface calm and reflective. Ensure the scene is completely clear of smoke, revealing the
    floor texture and the puck.
  rationale: The initial frame shows a puck with active splash dynamics, indicating motion or impact.
    The prompt describes the puck sliding on a low-friction oily surface, followed by a period of occlusion
    by smoke lasting several seconds. During this time, the puck's momentum carries it to a new position
    on the floor. By the time the smoke clears, the transient splash droplets from the initial frame will
    have settled, leaving the surface calm. The 'friction_stop' task identifier implies the puck eventually
    slows or stops within the scene rather than sliding off infinitely.
