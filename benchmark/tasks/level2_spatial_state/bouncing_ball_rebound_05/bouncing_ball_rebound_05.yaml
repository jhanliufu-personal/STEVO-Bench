id: bouncing_ball_rebound_05
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: dynamic_condition
variation_description: Ball changed to heavy steel sphere
changes:
  occlusion_method: null
  dynamic_conditions: Ball is heavy solid steel instead of tennis ball
  expected_outcome_change: Ball falls faster (less air resistance effect relative to mass) and bounces
    with different restitution/sound, potentially less height
prompts:
  init_frame_edit_prompt: Edit the image to change the tennis ball into a shiny, heavy, solid steel sphere.
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood.
    The ball is a heavy, solid steel sphere with high mass and rigid structure. Gravity acts on the ball.
    The camera rotates right at constant speed until the ball and hand completely exit the view to the
    right. The camera continues rotating right for several seconds while the ball remains off-screen.
    Then the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood.
    The ball is a heavy, solid steel sphere with high mass and rigid structure. Gravity acts on the ball
    during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up view of a robotic arm with a carbon fiber and metal finish, positioned
    in the upper right. The arm's gripper is holding a large, polished steel ball. The background is a
    wooden parquet floor with a herringbone pattern. Reflections of a window are visible on the floor
    and the ball.
  init2final_edit_prompt: Edit the given image to show the robotic gripper empty and open. Place the steel
    ball resting on the wooden floor below the gripper.
  rationale: The video prompt describes the ball being released from the gripper. Gravity causes the ball
    to fall to the floor. Since the camera rotates away and returns after 'several seconds', the ball
    will have had time to fall, bounce, and settle on the ground (or be rolling on it). Therefore, in
    the final frame, the gripper must be empty, and the ball must be located on the floor, significantly
    lower than its initial position.
