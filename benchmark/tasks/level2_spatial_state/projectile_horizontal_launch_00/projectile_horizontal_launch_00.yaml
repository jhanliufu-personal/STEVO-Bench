prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The red ball is traveling through the air after its horizontal launch from a cannon on the
    table. It is moving forward and downward under the influence of its initial momentum and gravity.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The red ball is traveling through the air after its horizontal launch from a cannon on the
    table. It is moving forward and downward under the influence of its initial momentum and gravity.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene featuring a wooden workbench with a brass and wood model cannon.
    A red ball is in mid-air to the right of the cannon muzzle, trailing white smoke. The cannon is mounted
    on a wooden carriage with wheels. On the workbench, there are wood shavings, chisels, and a blueprint.
    In the background, there is a window on the left and an open doorway on the right leading to a garage
    area.
  init2final_edit_prompt: Edit the given image to show the red ball significantly further to the right
    and lower in the frame, following a trajectory towards the open doorway. The ball should be positioned
    closer to the floor and the door frame than in the original image. The white smoke cloud near the
    cannon muzzle should be thinner, more spread out, and dissipated.
  rationale: The video prompt describes the ball traveling forward and downward under momentum and gravity.
    Physically, this results in a parabolic trajectory where the ball's horizontal position increases
    (moves right) while its vertical position decreases (moves down). The smoke, being a gas, will naturally
    expand and dissipate over time, becoming less dense. The stationary camera ensures the background
    and static objects like the cannon and workbench remain in fixed positions.
