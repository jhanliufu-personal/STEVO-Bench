prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The tethered ball is spinning in a horizontal circle at a constant angular velocity. The tension
    in the string maintains its orbital path. A sudden gust of wind kicks up a thick, opaque cloud of
    brown dust that completely obscures the pole and ball. The dust lingers for a moment before settling
    and clearing the view. No zoom, no cut, no scene change. STOP.
  camera_WM: The tethered ball is spinning in a horizontal circle at a constant angular velocity. The
    tension in the string maintains its orbital path. A sudden gust of wind kicks up a thick, opaque cloud
    of brown dust that completely obscures the pole and ball. The dust lingers for a moment before settling
    and clearing the view. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A vertical wooden pole is planted in a dirt field. A red ball is attached to
    the pole by a taut horizontal string. The ball is suspended in the air to the left of the pole and
    appears to be in motion, indicated by slight motion blur. The background is a blurred field with dry
    ground.
  init2final_edit_prompt: Edit the given image to show the red ball at a new position on the right side
    of the wooden pole, simulating that it has continued its circular path. Ensure the string remains
    taut and connected between the pole and the ball. The scene must be sharp and clear, with no dust
    or obstruction obscuring the view.
  rationale: The prompt describes a ball spinning at constant angular velocity. A dust cloud temporarily
    obscures the view but then clears. During the time the view was obscured, the ball continued to spin.
    Therefore, in the final frame, the ball must be visible again (dust cleared) but at a different position
    along its circular orbit (due to elapsed time). The physical constraints (taut string, attachment
    to pole) must remain intact.
