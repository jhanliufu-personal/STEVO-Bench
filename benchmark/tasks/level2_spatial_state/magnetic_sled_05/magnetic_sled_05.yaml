id: magnetic_sled_05
level: 2
category: spatial_kinematics
tags: []
variant_of: magnetic_sled
variation_type: dynamic_condition
variation_description: The rails are rusty, creating high friction.
changes:
  occlusion_method: null
  dynamic_conditions: High friction surface (rust)
  expected_outcome_change: The sled will move much slower or get stuck.
prompts:
  init_frame_edit_prompt: Edit the image to make the silver rails look dark, rusty, and rough.
  video_WM: The mechanical pin is retracted. The sled is ferromagnetic, but the rails are covered in heavy
    rust and grime, creating significant friction. The camera rotates right until the sled completely
    exits the view, then rotates toward the left smoothly at the same rate until the magnet is back in
    the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The mechanical pin is retracted. The sled is ferromagnetic, but the rails are covered in
    heavy rust and grime, creating significant friction. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: 'A laboratory setup showing a clear acrylic track with two rusty metal rails
    running horizontally. On the left side of the track, an aluminum H-shaped sled sits on the rails,
    blocked from moving right by a red-handled pin inserted through the track wall. On the right side,
    a large square electromagnet assembly with a yellow ''CAUTION: HIGH MAGNETIC FIELD'' label faces the
    track. Background includes a lab bench with electronic equipment like oscilloscopes.'
  init2final_edit_prompt: Edit the given image to remove the red-handled pin from the side of the clear
    track. Move the aluminum sled from the left side of the track to the far right side, positioning it
    flush against the face of the large square magnet. Ensure the sled is resting on the rusty rails in
    this new position and that the rails on the left are now empty.
  rationale: The retraction of the pin removes the physical barrier holding the sled. Since the sled is
    ferromagnetic and the sign indicates a high magnetic field, the magnetic attraction will pull the
    sled towards the magnet. Although the rails are rusty (creating friction), the force from a high-field
    magnet at this distance is typically sufficient to overcome friction and accelerate the sled. The
    camera rotation occludes the movement, but physically, the sled should travel across the track and
    come to rest attached to or pressing against the magnet face.
