prompts:
  init_frame_edit_prompt: Edit the image to show the table legs on the right side propped up on blocks,
    creating a steep upward incline for the puck's path.
  video_WM: The puck slides up the inclined air-cushioned surface, moving against gravity. Thick white
    smoke from an arcade smoke machine rapidly fills the space between the camera and the table, completely
    obscuring the view. The smoke slowly dissipates until the table is visible again. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The puck slides up the inclined air-cushioned surface, moving against gravity. Thick white
    smoke from an arcade smoke machine rapidly fills the space between the camera and the table, completely
    obscuring the view. The smoke slowly dissipates until the table is visible again. No zoom, no cut,
