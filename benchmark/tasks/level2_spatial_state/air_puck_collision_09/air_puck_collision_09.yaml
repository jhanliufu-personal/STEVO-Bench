camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, low-angle shot of an air hockey table with a reflective surface
    featuring neon grid lines. A glowing circular puck is impacting the metal rail on the left side, creating
    a burst of sparks and a bright flash. The puck has a motion blur trail indicating rapid movement.
    The table surface appears inclined, receding into the background with wooden supports visible in the
    foreground.
  init2final_edit_prompt: Edit the given image to show the glowing air hockey puck at a new position further
    up the inclined surface and to the right, significantly distant from the left rail. Remove the sparks,
    flash, and explosion effects from the left rail to show the aftermath of the impact. Ensure the puck
    is positioned deeper into the scene along the neon grid lines. The scene should be clear of any thick
    smoke, showing the table surface clearly.
  rationale: The puck is initially impacting the rail and moving up the incline (away from the camera
    and to the right). During the period of smoke occlusion, the puck's momentum carries it further up
    the table and to the right, away from the initial impact point. The sparks are a transient effect
    of the collision and must dissipate immediately. Gravity acts against the upward motion, but the puck
    is expected to have displaced significantly up the slope before potentially slowing down or stopping.
