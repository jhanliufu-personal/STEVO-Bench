prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel ball is given a rapid horizontal nudge along the inner circumference of the funnel's
    rim. The acrylic surface is polished and smooth. The wide upper rim is positioned in the center of
    view. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The steel ball is given a rapid horizontal nudge along the inner circumference of the funnel's
    rim. The acrylic surface is polished and smooth. The wide upper rim is positioned in the center of
    view. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, clear acrylic gravity well funnel (vortex coin bank style) is in the
    foreground. A polished steel ball is resting on a metal launch ramp attached to the upper-left section
    of the funnel's rim. The background features a museum interior with large windows, a polished floor,
    and visitors standing near other exhibits.
  init2final_edit_prompt: Edit the given image to remove the steel ball from the metal launch ramp on
    the upper-left rim. Place the steel ball on the curved, transparent acrylic surface inside the funnel,
    positioned to the right of the launch ramp and slightly lower than the rim, to show it has entered
    the spiral.
  rationale: The prompt describes giving the ball a horizontal nudge, which acts as the initial velocity
    for a gravity well orbit. Physically, the ball will leave the stationary metal launcher and begin
    traveling along the smooth acrylic surface of the funnel. Due to the conservation of angular momentum
    and gravity, the ball will spiral around the center, moving away from the launch point and descending
    slightly into the well. The final frame must show the ball on the acrylic slope rather than the starting
    ramp.
