id: block_on_ramp
level: 2
category: kinematics
tags: []
prompts:
  image_gen_prompt: A small rectangular block rests near the top of a smooth inclined ramp placed on a
    flat tabletop. The ramp surface is visibly smooth and the block sits still against it.
  video_WM: Single continuous take, no cuts or zoom. The block is resting on a smooth inclined ramp with
    very low friction. The block is not glued or fixed in place. Camera starts centered on the block and
    ramp. Then the camera smoothly moves to the right at constant speed until the ramp leaves the frame
    to the left. While the ramp is out of view, the physical interaction between the block and ramp continues
    naturally according to gravity and the low-friction surface. The camera continues moving right across
    the tabletop for several seconds. Then the camera moves left at the same speed back to the original
    viewpoint, bringing the ramp back into view naturally. Lighting and objects remain consistent and
    realistic.
  camera_WM: A block rests on a smooth inclined ramp with very low friction. The block is not glued or
    fixed in place. Lighting and objects remain consistent and realistic. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A rectangular wooden block rests at the top of a smooth, inclined stainless
    steel ramp. The ramp is set up on a light-colored wooden table. To the left, a clamp or fixture secures
    the top of the ramp. The background shows a window with daylight and laboratory cabinets with glass
    doors.
  init2final_edit_prompt: Edit the given image to show the wooden block positioned at the bottom end of
    the metal ramp or resting on the table near the base of the ramp, leaving the original position at
    the top of the ramp empty.
  rationale: The prompt specifies that the block is on a smooth, low-friction inclined ramp and is not
    fixed in place. Under the influence of gravity, the block will slide down the incline. The camera
    moves away for several seconds, providing ample time for the block to travel the length of the ramp.
    When the camera returns to the initial viewpoint, the block should no longer be at the top but should
    have reached the bottom of the ramp or slid onto the table.
  questions:
  - id: block_moved
    question: Is the wooden block in a different position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The block should have moved from the top of the ramp.
  - id: top_empty
    question: Is the top of the ramp, where the block was initially located, now empty?
    answer_type: yes_no
    notes_for_judge: The starting position should be vacant.
  - id: block_lower
    question: Is the wooden block positioned lower in height (closer to the table surface) than in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: It should have slid down towards the table.
  - id: block_right
    question: Has the wooden block moved to the right relative to its starting position?
    answer_type: yes_no
    notes_for_judge: The ramp slopes down to the right, so motion should be rightward.
  - id: block_at_bottom
    question: Is the wooden block located at the bottom of the ramp or on the table?
    answer_type: yes_no
    notes_for_judge: It should have reached the end of the incline.
  - id: ramp_stationary
    question: Is the metal ramp in the same position and orientation as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ramp itself should not move.
  - id: background_consistency
    question: Are the background elements (window, cabinets) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original viewpoint.
