prompts:
  video_WM: Single continuous take, no cuts or zoom. The block is resting on a smooth inclined ramp with
    very low friction. The block is not glued or fixed in place. Camera starts centered on the block and
    ramp. Then the camera smoothly moves to the right at constant speed until the ramp leaves the frame
    to the left. While the ramp is out of view, the physical interaction between the block and ramp continues
    naturally according to gravity and the low-friction surface. The camera continues moving right across
    the tabletop for several seconds. Then the camera moves left at the same speed back to the original
    viewpoint, bringing the ramp back into view naturally. Lighting and objects remain consistent and
    realistic.
