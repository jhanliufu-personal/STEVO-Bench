  init_frame_description: A triangular wooden ramp with a polished finish sits on a light-colored table
    surface. A rectangular metal block rests near the top edge of the ramp's inclined surface, which slopes
    downwards from left to right.
  init2final_edit_prompt: The metal block is now located at the bottom of the wooden ramp, resting either
    at the very base of the incline or on the table surface immediately to the right of the ramp. The
