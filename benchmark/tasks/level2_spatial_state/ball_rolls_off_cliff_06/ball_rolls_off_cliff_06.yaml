variation_description: The ball rolls away from the edge instead of towards it.
changes:
  occlusion_method: null
  dynamic_conditions: Velocity vector reversed (rolling left, away from the edge).
  expected_outcome_change: The ball ends up further from the edge on the left side, rather than falling
