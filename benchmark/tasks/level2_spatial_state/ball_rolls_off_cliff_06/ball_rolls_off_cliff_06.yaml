    same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball rolls across the table surface to the left, moving away from the sharp edge. The
    table surface is flat. The ball has sufficient velocity in the direction away from the drop-off. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a rustic wooden table corner. A red
    ball is positioned on the left side of the table surface, exhibiting motion blur that indicates velocity
    towards the left. The left edge of the table is clearly visible, with a drop-off revealing a window
    area and a patterned rug on the floor below. The table surface extends to the right.
  init2final_edit_prompt: Edit the given image to remove the red ball from the wooden table surface. The
    final image should show the continuous wood grain texture of the empty table top where the ball was
    previously located. Maintain the original camera angle, lighting, and all background details including
    the window, wall, and rug exactly as they appear.
  rationale: The initial frame shows a ball with momentum moving to the left, directly towards the visible
    table edge. Although the text prompt contains contradictory descriptions (stating 'moving away from
    the sharp edge' while also saying 'rolls to the left' towards the visible edge), the visual evidence
    of momentum and the Task ID 'ball_rolls_off_cliff' indicate the ball is intended to roll off the table.
    The camera motion described ('table exits view to the right') implies a pan to the left (following
    the ball/looking at the drop-off) before returning to the original view. After several seconds of
    elapsed time, the ball will have fallen off the table and likely exited the frame or landed on the
    floor, leaving the table surface empty.
