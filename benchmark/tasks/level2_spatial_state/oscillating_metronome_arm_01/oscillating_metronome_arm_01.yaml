prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The metronome arm is released and begins its rhythmic, high-frequency oscillation back and
    forth. The internal spring mechanism is fully active. Suddenly, the room lights turn off completely,
    plunging the scene into pitch black darkness. After a brief duration, the lights turn back on to reveal
    the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The metronome arm is released and begins its rhythmic, high-frequency oscillation back and
    forth. The internal spring mechanism is fully active. Suddenly, the room lights turn off completely,
    plunging the scene into pitch black darkness. After a brief duration, the lights turn back on to reveal
    the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a wooden clock mechanism or metronome on a workbench. The
    device has a wooden casing with an open front door, revealing brass gears inside. A long metal pendulum
    arm with a weighted end extends diagonally downwards to the right. A brass winding key is attached
    to the left side of the box. The background shows a workshop setting with tools like files and pliers
    scattered on the wooden surface, and a window in the distance.
  init2final_edit_prompt: Edit the given image so that the long metal pendulum arm is swung to the opposite
    side, leaning diagonally downwards to the left instead of the right. Ensure the arm looks like it
    has moved along its arc. Keep the wooden box, the brass gears, the winding key, and the background
    tools exactly as they are. The lighting should be fully restored and identical to the initial frame.
  rationale: The prompt describes the arm being released and oscillating. Oscillation implies the arm
    swings back and forth along an arc. After the lights turn off and back on, time has passed, and the
    arm should be captured in a different phase of its swing to demonstrate that motion has occurred.
    The most distinct change to verify kinematic evolution is showing the arm on the opposite side of
    its trajectory (left) compared to the initial static position (right). The lighting returns to the
    initial state.
