id: magnetic_sled
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: Generate an image of a small metal sled sits on a frictionless plastic rail. At the
    far end of the rail is a massive, high-powered neodymium magnet. The sled is currently held in place
    by a mechanical pin.
  video_WM: The mechanical pin is retracted, allowing the sled to move freely along the rail. The sled
    is made of a highly ferromagnetic material. The camera rotates right until the sled completely exits
    the view, then rotates toward the left smoothly at the same rate until the magnet is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The sled is released on the frictionless rail. The magnetic attraction from the stationary
    magnet at the end of the track is the only force acting on the sled. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: 'A laboratory setup featuring a clear rectangular plastic track running horizontally
    across a black lab bench. Inside the track on the left side, there is a U-shaped aluminum sled resting
    on two metal rails. On the right side of the track, there is a large square magnet assembly with a
    yellow label reading ''CAUTION: HIGH MAGNETIC FIELD''. A red-handled mechanical pin is visible on
    the side of the track near the sled''s starting position. In the background, there are electronic
    instruments like oscilloscopes and white cabinets.'
  init2final_edit_prompt: Edit the given image to show the metal sled moved to the far right end of the
    clear track. The sled should be resting directly against the face of the large square magnet assembly,
    in contact with the metal plate. The red-handled pin should be retracted.
  rationale: The prompt specifies that the sled is ferromagnetic and the retaining pin is retracted. Due
    to the high magnetic field from the large magnet on the right, the sled will be attracted and pulled
    forcefully along the rails until it impacts the magnet. The camera motion involves panning right and
    then back left to center the magnet, meaning the final view will focus on the magnet with the sled
    attached to it.
