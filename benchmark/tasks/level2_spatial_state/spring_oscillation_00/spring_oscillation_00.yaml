prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The weight is released from the pulled-down position. The spring is high-quality and the system
    has negligible air resistance. Camera remains stationary throughout with the entire system fully visible.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The weight is released from the pulled-down position. The spring is high-quality and the
    system has negligible air resistance. Camera remains stationary throughout with the entire system
    fully visible. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene featuring a rusty 20kg metal weight hanging from a long, extended
    coil spring attached to a wooden ceiling beam. To the right, a vertical wooden post has a measuring
    tape attached with a handwritten '20cm' mark. A gloved hand is visible on the right edge near the
    post. A large window with a grid pattern is visible in the background on the left.
  init2final_edit_prompt: Edit the given image to show the 20kg weight positioned significantly higher
    in the frame, closer to the wooden ceiling beam. Make the coil spring appear shorter and more compressed,
    with the coils closer together. Ensure the weight remains vertically aligned with the spring's attachment
    point. Keep the background, including the window and the wooden post, unchanged.
  rationale: The prompt specifies that the weight is released from a 'pulled-down' position. In this state,
    the spring is extended and exerts an upward restoring force greater than gravity. Upon release, the
    weight will accelerate upward, and the spring will contract. Therefore, the final frame must show
    the weight at a higher vertical position and the spring in a less extended (shorter) state.
