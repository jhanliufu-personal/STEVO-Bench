id: hockey_puck_friction_stop
level: 2
category: spatial_kinematics
kinematic_variable: Linear velocity with friction deceleration
tags: []
prompts:
  image_gen_prompt: A black hockey puck is sliding rapidly across a rough concrete floor surface. The
    puck is in motion moving from left to right at high speed. Motion blur is visible around the puck
    edges.
  video_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber with significant contact area
    against the rough surface. No external forces are applied to the puck after it is already in motion.
    The camera rotates right at constant speed until the puck completely exits the view to the right.
    The camera continues rotating right for several seconds while the puck remains off-screen on the concrete
    surface. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing
    the concrete floor area back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber with significant contact area
    against the rough surface. No external forces are applied to the puck after it is already in motion
    during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A black hockey puck sliding on a rough, cracked concrete surface. The puck is
    centered in the frame. There is a visible spray of dust and debris around the base of the puck, indicating
    motion. The background consists of out-of-focus concrete extending into the distance.
  init2final_edit_prompt: Edit the given image to remove the hockey puck and the dust spray. The final
    image should show the empty rough concrete surface with cracks and texture continuous with the surrounding
    area, as if the object was never there.
  rationale: The video prompt specifies that the puck slides and 'completely exits the view to the right'
    before the camera pans away. Although the camera eventually returns to the exact original viewpoint,
    the puck has displaced significantly to the right (out of the frame) and stopped due to friction or
    continued moving. Therefore, the final frame should display the empty concrete surface where the puck
    used to be, as the puck is now located outside the field of view. The dust generated by the slide
    would have settled.
  questions:
  - id: puck_absent
    question: Is the hockey puck absent from the final image?
    answer_type: yes_no
    notes_for_judge: The puck should have moved out of the frame.
  - id: center_empty
    question: Is the concrete surface empty where the puck was initially located?
    answer_type: yes_no
    notes_for_judge: The starting position should now be bare concrete.
  - id: dust_gone
    question: Has the dust spray from the initial frame been removed?
    answer_type: yes_no
    notes_for_judge: Dust settles or moves with the puck.
  - id: moved_out
    question: Has the main object (the puck) moved out of the field of view?
    answer_type: yes_no
    notes_for_judge: Since the camera returns to start and the puck exited, it should be gone.
  - id: texture_consistency
    question: Is the concrete texture (cracks and pebbles) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The background should remain the same.
  - id: lighting_consistency
    question: Is the lighting on the concrete consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Lighting should not change.
