id: magnetic_sled_01
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: "A small metal sled sits on a frictionless plastic rail. At the far end of the rail is a massive, high-powered neodymium magnet. The sled is currently held in place by a mechanical pin."
  video_WM: "The mechanical pin is retracted, allowing the sled to move freely along the rail. The sled is made of a highly ferromagnetic material. The camera rotates right until the sled completely exits the view, then rotates toward the left smoothly at the same rate until the magnet is back in the center of view. No zoom, no cut, no scene change. STOP."
  camera_WM: "The sled is released on the frictionless rail. The magnetic attraction from the stationary magnet at the end of the track is the only force acting on the sled. STOP."
camera_control:
  HY-WorldPlay: "s-3, right-30, left-30"