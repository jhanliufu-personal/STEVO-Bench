id: elevator_cable_snap_06
level: 2
category: spatial_kinematics
tags: []
variant_of: elevator_cable_snap
variation_type: dynamic_condition
variation_description: 'Condition changed: Rails are rusted and jammed, causing high friction/resistance.'
changes:
  occlusion_method: null
  dynamic_conditions: 'High friction: rusted and deformed rails'
  expected_outcome_change: Elevator falls very slowly or gets stuck.
prompts:
  init_frame_edit_prompt: Edit the image to make the metal guide rails look heavily corroded, jagged,
    and covered in rust and debris.
  video_WM: The elevator cable has snapped. However, the guide rails are severely corroded, bent, and
    clogged with debris, creating immense friction against the car's movement. The camera rotates right
    until the elevator car completely exits the view, then rotates toward the left smoothly at the same
    rate until the camera returns to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The elevator cable has snapped. However, the guide rails are severely corroded, bent, and
    clogged with debris, creating immense friction against the car's movement. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A high-angle shot looking down into an atrium with a central elevator shaft.
    A glass-walled elevator car is suspended in the center of the frame. The vertical guide rails and
    structural beams surrounding the elevator are heavily rusted and corroded. There are walkways with
    metal railings on the left and right sides, and people are visible on the floor below.
  init2final_edit_prompt: Edit the given image to show the elevator car positioned lower in the shaft
    than in the original view, as if it has slid downwards. The cable extending upwards from the car should
    appear severed, slack, or absent. Maintain the exact same camera angle, perspective, and background
    architecture, ensuring the surrounding railings and building structure remain unchanged.
  rationale: The prompt establishes that the cable snaps, removing the upward support force. Gravity acts
    to pull the elevator car down. However, the 'immense friction' from the corroded rails acts as a significant
    opposing force, preventing a rapid freefall. As the camera pans away and then returns to the original
    viewpoint, time elapses. During this interval, the elevator car must displace downwards due to gravity,
    but because of the friction, it should slide down rather than plummet instantly to the bottom. The
    final state should show the car at a noticeably lower vertical position within the shaft, consistent
    with a resisted downward slide.
