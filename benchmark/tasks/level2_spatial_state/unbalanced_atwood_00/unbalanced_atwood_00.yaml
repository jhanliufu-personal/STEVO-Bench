evaluation:
  init_frame_description: A rustic workshop scene featuring a pulley system against a stone wall. On the
    left, a large, rusty rectangular iron weight labeled '50 KG' hangs from a thick rope. On the right,
    a smaller, similar weight labeled '5 KG' hangs from another rope. Both ropes ascend to a system of
    pulleys and a central gear mechanism with a handle. To the left of the 50kg weight, heavy chains hang
    vertically. Below the 50kg weight sits an anvil on a wooden stump. The lighting is natural, coming
    from a window on the right.
  init2final_edit_prompt: Edit the given image to show the large 50 KG weight on the left in a significantly
    lower position, closer to the anvil beneath it. Simultaneously, show the small 5 KG weight on the
    right in a significantly higher position, closer to the pulley block above it. Ensure the ropes remain
    taut and connected to the weights. Keep the hanging chains on the far left, the stone wall background,
    and the window unchanged.
  rationale: The scene depicts an unbalanced system (essentially an Atwood machine) where a 50kg mass
    is connected to a 5kg mass. When the brake is released, the significantly heavier 50kg weight will
    accelerate downwards due to gravity, overcoming the tension from the lighter weight. Consequently,
    the 5kg weight will be pulled upwards. The camera remains stationary, so the primary visual change
    is the vertical displacement of the two weights in opposite directions.
