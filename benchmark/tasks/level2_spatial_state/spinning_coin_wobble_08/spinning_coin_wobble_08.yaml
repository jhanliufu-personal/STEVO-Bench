id: spinning_coin_wobble_08
level: 2
category: spatial_kinematics
tags: []
variant_of: spinning_coin_wobble
variation_type: combined
variation_description: Felt surface (high friction) + Hand blocking occlusion.
changes:
  occlusion_method: Hand blocks the view.
  dynamic_conditions: Surface is rough felt cloth with high friction.
  expected_outcome_change: Coin falls flat quickly (felt) while hidden by hand.
prompts:
  init_frame_edit_prompt: Edit the image to change the wooden table surface to a green felt gaming cloth
    surface.
  video_WM: The coin continues spinning on the rough felt surface. High friction exists between the coin
    edge and the textured cloth. Air resistance acts on the rotating coin. The coin is a standard metal
    quarter. A large hand moves into the frame from the right, completely covering the coin and blocking
    the view. The hand remains in place for several seconds. Then the hand moves away to the right, revealing
    the table surface again. No zoom, no cut, no scene change. STOP.
  camera_WM: The coin continues spinning on the rough felt surface. High friction exists between the coin
    edge and the textured cloth. Air resistance acts on the rotating coin. The coin is a standard metal
    quarter. A large hand moves into the frame from the right, completely covering the coin and blocking
    the view. The hand remains in place for several seconds. Then the hand moves away to the right, revealing
    the table surface again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a silver US quarter dollar coin standing vertically
    on its edge on a green, textured felt surface. The coin displays the eagle (tails) side. The background
    is a blurred green surface extending to a wall or window.
  init2final_edit_prompt: Edit the given image so that the quarter is lying flat on the green felt surface
    instead of standing on its edge. The coin should be resting on one of its faces in the center of the
    frame. The lighting and background should remain consistent with the original scene.
  rationale: The video prompt describes a spinning coin on a rough felt surface with high friction and
    air resistance. The coin is occluded by a hand for 'several seconds'. Due to the high friction and
    the significant duration of time passed, the coin's angular momentum would naturally dissipate, causing
    it to lose stability and fall over. Therefore, when the hand moves away to reveal the table again,
    the coin should be lying flat on the surface rather than continuing to spin or stand upright.
  questions:
  - id: coin_flat
    question: Is the coin lying flat on the green felt surface?
    answer_type: yes_no
    notes_for_judge: The coin should no longer be standing vertically; it should be resting on one of
      its faces.
  - id: coin_not_standing
    question: Is the coin no longer standing on its edge?
    answer_type: yes_no
    notes_for_judge: The coin should be horizontal, not vertical.
  - id: coin_height_reduced
    question: Is the vertical height of the coin significantly lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Since the coin has fallen flat, its top edge should be much lower than when it was
      standing.
  - id: hand_absent
    question: Is the hand absent from the final frame?
    answer_type: yes_no
    notes_for_judge: The prompt states the hand moves away, revealing the table.
  - id: coin_present
    question: Is the coin still visible on the table?
    answer_type: yes_no
    notes_for_judge: The coin should not have vanished; it should just be in a different pose.
  - id: surface_visible
    question: Is the green felt surface visible where the coin is resting?
    answer_type: yes_no
    notes_for_judge: The view should be unblocked.
