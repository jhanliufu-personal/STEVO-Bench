camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: 'A laboratory setup featuring a clear plastic linear rail track on a black benchtop.
    On the track sits a silver metal sled carrying a large, dark, rusty rectangular weight. To the right
    of the track is a large square magnetic assembly with a yellow label reading ''CAUTION: HIGH MAGNETIC
    FIELD''. A red-handled locking pin is inserted through the side of the track near the sled, holding
    it in place. In the background, there is electronic equipment, including an oscilloscope, and white
    cabinets.'
  init2final_edit_prompt: Edit the given image to show the red-handled pin pulled out and retracted from
    the side of the clear track. Move the metal sled and the large rusty weight sitting on top of it to
    the far right end of the track, positioning them directly against the face of the large square magnet.
  rationale: The initial state shows a ferromagnetic sled held in place by a pin against a strong magnetic
    field (indicated by the warning sign). When the pin is retracted, the magnetic force will overcome
    the static friction and inertia of the heavy weight, accelerating the sled towards the magnet. During
    the occlusion by smoke, the sled travels along the rail. In the final state, the sled and weight will
    have moved to the right and come to rest against the face of the magnet.
