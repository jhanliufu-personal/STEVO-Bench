kinematic_variable: Position transition from rolling to projectile trajectory
tags: []
prompts:
  image_gen_prompt: A red rubber ball is rolling across a wooden table surface from left to right at moderate speed. The table edge is visible ahead in the ball's path. The table is elevated 1 meter above the floor. The ball is approaching the edge.
  video_WM: The ball continues rolling across the table surface toward the edge. The table edge is a sharp drop-off with no barrier. The ball has sufficient velocity to reach the edge. Once past the table edge, the ball is no longer supported by the surface. Gravity acts on the ball continuously. Air resistance is negligible. The camera rotates right at constant speed until the table completely exits the view to the right. The camera continues rotating right for several seconds while the ball trajectory continues off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the table and floor area back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball continues rolling across the table surface toward the edge. The table edge is a sharp drop-off with no barrier. The ball has sufficient velocity to reach the edge. Once past the table edge, the ball is no longer supported by the surface. Gravity acts on the ball continuously. Air resistance is negligible during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
