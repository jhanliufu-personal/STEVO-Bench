id: oscillating_metronome_arm_03
level: 2
category: spatial_kinematics
tags: []
variant_of: oscillating_metronome_arm
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large book blocking the view.
changes:
  occlusion_method: A large book moves into the foreground to block the view, then moves away
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The metronome arm is released and begins its rhythmic, high-frequency oscillation back and
    forth. The internal spring mechanism is fully active. A large, opaque hardcover book slides into the
    foreground, completely blocking the line of sight to the metronome. The book then slides away, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The metronome arm is released and begins its rhythmic, high-frequency oscillation back and
    forth. The internal spring mechanism is fully active. A large, opaque hardcover book slides into the
    foreground, completely blocking the line of sight to the metronome. The book then slides away, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a wooden metronome with its front door open, revealing the
    brass internal mechanism. A metal pendulum arm extends diagonally, with a sliding counterweight near
    the top and a bob at the bottom; the arm is currently tilted such that the bottom bob is to the right
    and the top counterweight is to the left. A winding key is inserted on the left side of the wooden
    case. The metronome sits on a wooden workbench scattered with various tools like files, pliers, and
    metal rods.
  init2final_edit_prompt: Edit the given image to show the metronome's metal pendulum arm tilted in the
    opposite direction, with the bottom bob swung to the left side and the top counterweight leaning to
    the right. Ensure the view of the metronome is completely clear and unobstructed by any other objects.
  rationale: The prompt describes a high-frequency oscillation of the metronome arm. While the exact phase
    of the arm in the final frame is technically indeterminate due to the periodic motion, a correct simulation
    must show the arm in a different position than the initial static state to demonstrate that motion
    has been activated. The prompt also describes a temporary occlusion by a book which then slides away;
    therefore, the final frame must show the scene fully revealed again without the book. The background
    tools and the metronome case should remain static.
  questions:
  - id: arm_moved
    question: Is the metronome's pendulum arm in a different angular position compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The arm should not be in the exact same static position (tilted bottom-right) as
      the init frame.
  - id: arm_orientation_change
    question: Has the bottom bob of the pendulum moved away from its initial position on the far right?
    answer_type: yes_no
    notes_for_judge: It should be center, left, or blurred, but not statically stuck at the initial rightmost
      point.
  - id: no_occlusion
    question: Is the view of the metronome clear of any large opaque objects like a book?
    answer_type: yes_no
    notes_for_judge: The book mentioned in the prompt should have slid away.
  - id: metronome_visible
    question: Is the internal brass mechanism of the metronome visible?
    answer_type: yes_no
    notes_for_judge: Verifies the occlusion is gone.
  - id: background_consistency
    question: Are the tools on the workbench in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: Only the metronome arm and the temporary book should have moved.
  - id: door_state
    question: Is the wooden door of the metronome case still open?
    answer_type: yes_no
    notes_for_judge: The door state was not changed by the prompt.
