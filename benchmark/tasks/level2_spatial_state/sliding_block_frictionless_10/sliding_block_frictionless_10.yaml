evaluation:
  init_frame_description: A wide shot of a frozen icy surface with a robotic arm on the left, a silver
    metal cube in the center, and a large red horseshoe magnet on the right. The sun is low on the horizon,
    creating a flare and reflections on the ice.
  init2final_edit_prompt: Edit the given image to move the silver metal cube from the center of the frame
    to the right side, placing it directly against the poles of the red horseshoe magnet. Ensure the cube
    is in contact with the magnet. Keep the robotic arm on the left and the icy background unchanged.
  rationale: The prompt describes a metal block sliding on a low-friction surface (ice) towards a powerful
    magnet. The magnetic force acts as an attractor, accelerating the block to the right. The sequence
    involves a crate falling and then being lifted, which implies a duration of time has passed during
    which the block is occluded. Given the physics of magnetism and low friction, the block will continue
    its trajectory and attach itself to the magnet by the time the view is restored.
