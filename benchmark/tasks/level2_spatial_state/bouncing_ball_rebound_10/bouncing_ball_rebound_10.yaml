id: bouncing_ball_rebound_10
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: combined
variation_description: Sticky glue floor + Camera zoom occlusion
changes:
  occlusion_method: Camera zooms out until details lost
  dynamic_conditions: Floor covered in industrial adhesive
  expected_outcome_change: Ball gets stuck on impact (no bounce) + different occlusion style
prompts:
  init_frame_edit_prompt: Edit the image to show the floor covered in a thick, shiny, sticky layer of
    industrial adhesive glue.
  video_WM: The ball is released from the hand and becomes free to move. The floor is coated in a thick
    layer of industrial adhesive glue with extremely high tackiness. The ball is a standard tennis ball.
    Gravity acts on the ball. The camera zooms out rapidly until the hand and ball are too small to distinguish,
    losing all detail. The camera holds this distant view for several seconds. Then the camera zooms back
    in smoothly to the original framing. No cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is coated in a thick
    layer of industrial adhesive glue with extremely high tackiness. The ball is a standard tennis ball.
    Gravity acts on the ball during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up view of a robotic arm with a carbon fiber texture and the text 'DYNAMIX
    ROBOTICS' on it. The arm has a three-fingered metal gripper holding a standard yellow tennis ball.
    The background is a wooden parquet floor with a herringbone pattern, covered in a thick, shiny, wet-looking
    layer of liquid or adhesive.
  init2final_edit_prompt: Edit the given image to show the robotic gripper empty with its fingers slightly
    open. Place the yellow tennis ball on the floor directly vertically below the gripper, resting on
    the wet adhesive surface.
  rationale: The prompt specifies that the ball is released and gravity acts on it, causing it to fall.
    The critical physical constraint is the 'industrial adhesive glue with extremely high tackiness' on
    the floor. Upon impact, a tennis ball hitting such a surface would stick immediately rather than bouncing
    or rolling. The camera zooms out and back in, covering a duration of several seconds, which is sufficient
    time for the ball to fall and settle. Therefore, in the final frame, the gripper should be empty and
    the ball should be stationary on the floor directly below the release point.
