id: bowling_inertia
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A heavy black bowling ball mid-lane on a polished wooden surface. The ball is moving
    toward the pins, which are visible in the far distance. No bumpers are present.
  video_WM: The bowling ball is in motion on the polished lane. The surface is treated with oil and offers
    minimal rolling resistance. The camera rotates right until the ball completely exits the view, then
    rotates toward the left smoothly at the same rate until the foul line is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy bowling ball is in motion on the polished wooden lane. The surface conditions and
    the ball's mass are the only factors affecting its path. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level perspective of a black, marbled bowling ball centered
    on a polished wooden bowling lane. The ball is in the immediate foreground. The lane features vertical
    wood planks and reflection lines leading towards a set of white bowling pins standing in the distance.
    Gutters are visible on either side of the lane.
  init2final_edit_prompt: Edit the given image to show the bowling ball positioned significantly further
    down the lane, much closer to the pins in the background. The ball should appear smaller due to perspective.
    The wooden lane surface in the immediate foreground, where the ball was originally located, should
    now be empty and visible.
  rationale: The prompt describes a scenario where the bowling ball is in motion, rolling down the lane
    with minimal resistance. While the camera pans to the right and then returns to the original center
    view, the ball continues its physical trajectory away from the camera. Therefore, in the final frame,
    the camera angle is identical to the start, but the ball must have traveled a significant distance
    down the lane towards the pins, appearing smaller and leaving the foreground empty.
