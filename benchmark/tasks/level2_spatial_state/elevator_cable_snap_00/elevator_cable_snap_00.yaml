id: elevator_cable_snap_00
level: 2
category: spatial_kinematics
tags: []
variant_of: elevator_cable_snap
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The elevator car is no longer supported by the cable. The vertical shaft is clear of obstructions,
    and the guide rails are well-lubricated. Camera remains stationary throughout. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The elevator car is no longer supported by the cable. The vertical shaft is clear of obstructions,
    and the guide rails are well-lubricated. Camera remains stationary throughout. No zoom, no cut, no
    scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A high-angle view of a multi-story atrium featuring a central glass elevator
    shaft. A glass elevator car is suspended in the middle of the vertical shaft, supported by cables
    extending upwards. Balconies with metal railings line the left and right sides of the atrium. Several
    people are standing on the balconies, observing the space. The floor of the atrium is tiled, and large
    arched windows are visible in the background.
  init2final_edit_prompt: Edit the given image to show the elevator car positioned significantly lower
    in the vertical shaft, near the bottom of the frame. Render the suspension cables hanging loosely,
    broken, or trailing down the shaft, indicating they are no longer supporting the car. Keep the surrounding
    architecture, balconies, and people unchanged.
  rationale: The prompt specifies that the elevator car is no longer supported by the cable. Consequently,
    gravity will cause the car to accelerate downwards through the unobstructed shaft. By the final frame,
    the elevator car must be at a significantly lower vertical position than its starting point, potentially
    near the bottom of the view. The cables should reflect the loss of tension, appearing slack or broken.
  questions:
  - id: elevator_position_lower
    question: Is the elevator car positioned lower in the shaft than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the elevator car relative to the background windows
      or floor levels.
  - id: elevator_moved_down
    question: Has the elevator car moved downwards from its starting location?
    answer_type: yes_no
    notes_for_judge: Check for downward displacement along the vertical axis.
  - id: original_space_empty
    question: Is the space where the elevator car was initially located now empty?
    answer_type: yes_no
    notes_for_judge: The area originally occupied by the car should now show the empty shaft or background.
  - id: closer_to_floor
    question: Is the elevator car closer to the bottom tiled floor than it was initially?
    answer_type: yes_no
    notes_for_judge: Assess the distance between the bottom of the car and the floor.
  - id: cable_state
    question: Do the cables appear slack, broken, or disconnected?
    answer_type: yes_no
    notes_for_judge: The cables should not look taut and supporting the car in the original position.
  - id: people_consistency
    question: Are the people on the balconies still present in their approximate original locations?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: architecture_consistency
    question: Are the arched windows and railings structurally unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
