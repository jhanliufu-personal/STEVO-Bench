id: rolling_sphere_inclined_plane_01
level: 2
category: spatial_kinematics
tags: []
variant_of: rolling_sphere_inclined_plane
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a person walking in front of the camera.
changes:
  occlusion_method: A person walks into frame, blocking the view, then walks out.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. A person walks into the frame from the right, completely
    blocking the view of the ramp and marble with their torso. After a moment, the person walks out to
    the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. A person walks into the frame from the right, completely
    blocking the view of the ramp and marble with their torso. After a moment, the person walks out to
    the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A polished steel sphere resting on a wooden plank that serves as an inclined
    ramp. The ramp slopes downwards from the top-right to the bottom-left of the frame. The background
    features a grassy field and a rustic wooden barn in the distance.
  init2final_edit_prompt: Edit the given image to show the steel sphere positioned significantly further
    down the wooden ramp, closer to the bottom-left corner of the frame. Keep the wooden ramp, the grassy
    field, and the barn in the background exactly as they are.
  rationale: The initial state shows a sphere on an inclined plane. Physics dictates that gravity will
    accelerate the sphere downwards along the slope of the ramp (towards the bottom-left). The prompt
    describes a person blocking the view for a moment and then leaving. This occlusion implies a passage
    of time during which the sphere continues to roll. Therefore, in the final frame, the sphere must
    be displaced further down the ramp compared to its starting position. The camera is static, so the
    background and ramp structure remain unchanged.
  questions:
  - id: position_change_01
    question: Is the steel sphere at a different position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the sphere has moved from its original spot.
  - id: trajectory_01
    question: Has the steel sphere moved downwards along the ramp towards the bottom-left?
    answer_type: yes_no
    notes_for_judge: The movement must follow the incline of the ramp.
  - id: relative_position_01
    question: Is the steel sphere closer to the bottom-left edge of the image than it was initially?
    answer_type: yes_no
    notes_for_judge: Compare the distance to the frame edge.
  - id: height_change_01
    question: Is the steel sphere visually lower in the frame than its starting position?
    answer_type: yes_no
    notes_for_judge: Since the ramp goes down, the ball should be lower on the y-axis.
  - id: displacement_01
    question: Is the distance between the sphere and the top-right end of the ramp greater than in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: The ball moves away from the top of the ramp.
  - id: background_consistency_01
    question: Is the wooden barn in the background still visible and in the same position?
    answer_type: yes_no
    notes_for_judge: The camera should not move.
  - id: ramp_consistency_01
    question: Is the wooden ramp still in the same position and orientation?
    answer_type: yes_no
    notes_for_judge: The ramp itself should not move.
