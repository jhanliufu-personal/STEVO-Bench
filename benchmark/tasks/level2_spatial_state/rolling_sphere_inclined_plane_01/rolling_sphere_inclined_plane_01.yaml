prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. A person walks into the frame from the right, completely
    blocking the view of the ramp and marble with their torso. After a moment, the person walks out to
    the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. A person walks into the frame from the right, completely
    blocking the view of the ramp and marble with their torso. After a moment, the person walks out to
