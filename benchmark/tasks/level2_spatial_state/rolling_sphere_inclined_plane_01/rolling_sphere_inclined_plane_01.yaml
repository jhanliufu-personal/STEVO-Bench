  HY-WorldPlay: null
evaluation:
  init_frame_description: A polished steel sphere resting on a wooden plank that serves as an inclined
    ramp. The ramp slopes downwards from the top-right to the bottom-left of the frame. The background
    features a grassy field and a rustic wooden barn in the distance.
  init2final_edit_prompt: Edit the given image to show the steel sphere positioned significantly further
    down the wooden ramp, closer to the bottom-left corner of the frame. Keep the wooden ramp, the grassy
    field, and the barn in the background exactly as they are.
  rationale: The initial state shows a sphere on an inclined plane. Physics dictates that gravity will
    accelerate the sphere downwards along the slope of the ramp (towards the bottom-left). The prompt
    describes a person blocking the view for a moment and then leaving. This occlusion implies a passage
    of time during which the sphere continues to roll. Therefore, in the final frame, the sphere must
    be displaced further down the ramp compared to its starting position. The camera is static, so the
    background and ramp structure remain unchanged.
