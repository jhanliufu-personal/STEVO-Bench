id: projectile_horizontal_launch_07
level: 2
category: spatial_kinematics
tags: []
variant_of: projectile_horizontal_launch
variation_type: combined
variation_description: Combines the obstacle condition with lights-out occlusion.
changes:
  occlusion_method: Lights turn off completely then turn on
  dynamic_conditions: A vertical wooden board is placed in the projectile's path
  expected_outcome_change: Ball hits obstacle in the dark
prompts:
  init_frame_edit_prompt: Edit the image to place a large vertical sheet of plywood standing about 3 feet
    in front of the cannon muzzle, directly in the path of the red ball.
  video_WM: The red ball is traveling through the air after its horizontal launch, heading directly toward
    a vertical wooden board. Suddenly, the overhead lights in the workshop turn off, plunging the room
    into complete darkness. After a moment, the lights flicker and turn back on, fully illuminating the
    scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The red ball is traveling through the air after its horizontal launch, heading directly toward
    a vertical wooden board. Suddenly, the overhead lights in the workshop turn off, plunging the room
    into complete darkness. After a moment, the lights flicker and turn back on, fully illuminating the
    scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene showing a brass cannon mounted on a wooden carriage on the
    left, angled slightly upward. A puff of white smoke is exiting the cannon barrel. To the right, a
    red ball is impacting a vertical plywood board, creating a cloud of dust and debris at the point of
    contact.
  init2final_edit_prompt: Edit the given image to remove the white smoke coming from the cannon and the
    dust cloud on the wooden board. Place the red ball resting on the wooden workbench surface directly
    below the area where it hit the board. Ensure the scene is fully illuminated and the background remains
    unchanged.
  rationale: The initial frame captures the moment of impact between the ball and the board, accompanied
    by smoke and dust. The video prompt describes a sequence where the lights go out and then come back
    on, implying a passage of time. During this interval, the smoke would dissipate, and gravity would
    cause the ball to fall from the impact point to the surface below (the workbench). The final state
    should show the aftermath with the ball settled and the air clear.
