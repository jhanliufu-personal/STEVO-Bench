id: marble_track_loop
level: 2
category: spatial_kinematics
kinematic_variable: Track position
prompts:
  image_gen_prompt: A steel ball is rolling down a vertical plastic track toward a complete 360-degree
    loop-the-loop. The ball is just about to enter the bottom of the loop.
  video_WM: The steel ball rolls into and through the vertical loop. Its momentum is sufficient to carry
    it through the curve of the manifold. The camera rotates right until the loop completely exits the
    view, then rotates toward the left smoothly at the same rate until the loop entrance is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball travels through the vertical loop, guided by the track's geometry and its own momentum.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
