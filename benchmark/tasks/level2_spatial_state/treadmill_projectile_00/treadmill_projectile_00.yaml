    keeping both the launcher and the treadmill completely within the frame. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The robotic launcher fires a tennis ball vertically into the air while the treadmill belt
    continues its constant leftward motion. The air in the room is still. Camera remains stationary throughout,
    keeping both the launcher and the treadmill completely within the frame. No zoom, no cut, no scene
