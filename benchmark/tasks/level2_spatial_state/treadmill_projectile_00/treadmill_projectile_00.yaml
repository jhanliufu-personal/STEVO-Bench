camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A silver robotic device constructed from aluminum extrusions is positioned on
    a wide, dark treadmill belt in an industrial room. The robot features exposed orange and black wiring,
    a vertical launch tube, and small blue and orange LED lights. The background includes a concrete wall,
    yellow safety cage posts, and blurred industrial machinery.
  init2final_edit_prompt: Edit the given image to shift the entire robotic device to the left along the
    treadmill belt. Add a yellow tennis ball floating in the air, positioned vertically directly above
    the robot's launch tube. Ensure the background, including the safety cage and walls, remains unchanged
    and stationary.
  rationale: The treadmill belt is moving leftward. Since the prompt does not specify that the robot is
    driving to maintain position, the physical assumption is that the robot is carried leftward by the
    belt's motion. The launcher fires a ball vertically relative to itself. Due to the conservation of
    momentum (inertia), the ball retains the leftward horizontal velocity of the launcher at the moment
    of firing. Thus, in the final frame, the robot should be displaced to the left, and the ball should
    appear in the air directly above the launcher, maintaining vertical alignment.
