id: bowling_inertia_05
level: 2
category: spatial_kinematics
tags: []
variant_of: bowling_inertia
variation_type: dynamic_condition
variation_description: The lane is tilted upwards, creating a steep incline.
changes:
  occlusion_method: null
  dynamic_conditions: Lane is inclined upwards (gravity opposes motion)
  expected_outcome_change: Ball slows down rapidly, stops, and potentially rolls backward.
prompts:
  init_frame_edit_prompt: Edit the image so the bowling lane is tilted upwards at a steep angle, creating
    an uphill ramp.
  video_WM: The bowling ball is rolling up a steep, polished wooden ramp. Gravity is acting against the
    ball's upward momentum. The camera rotates right until the ball completely exits the view, then rotates
    toward the left smoothly at the same rate until the ramp is back in the center of view. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The bowling ball is rolling up a steep, polished wooden ramp. Gravity is acting against the
    ball's upward momentum. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, low-angle view of a black, marbled bowling ball centered in the
    immediate foreground on a polished wooden bowling lane. The lane extends into the distance towards
    a set of white bowling pins. Gutters are visible on either side of the lane.
  init2final_edit_prompt: Edit the given image to move the black bowling ball further down the lane, closer
    to the pins in the background. Reduce the size of the ball significantly to account for perspective
    as it moves away from the viewer. Show the empty polished wooden lane texture in the foreground where
    the ball was originally positioned.
  rationale: The prompt establishes that the ball is rolling 'up' the ramp (away from the camera) with
    initial momentum. Although gravity acts against it, the ball is in motion away from the viewpoint.
    During the time the camera rotates right and then returns left to the center, the ball continues its
    trajectory along the lane. Therefore, in the final frame, the ball must be positioned further away
    from the camera (closer to the pins) and appear smaller due to perspective.
