id: block_on_ramp_09
level: 2
category: kinematics
tags: []
variant_of: block_on_ramp
variation_type: combined
variation_description: Ice cube combined with camera move-away occlusion.
changes:
  occlusion_method: Camera moves backward until scene is unresolved.
  dynamic_conditions: Object is an ice cube.
  expected_outcome_change: Ice slides fast.
prompts:
  init_frame_edit_prompt: Edit the image to replace the wooden block with a clear ice cube of the same
    size.
  video_WM: Single continuous take, no cuts. A clear ice cube is resting on a smooth metal inclined ramp.
    The surface is extremely slippery. The camera smoothly moves backward, retreating away from the table
    until the ramp and ice become distant specks too small to resolve details. While the scene is distant,
    the physical interaction continues naturally. The camera then moves forward at the same speed, returning
    to the original viewpoint.
  camera_WM: A clear ice cube rests on a smooth metal inclined ramp. The surface is extremely slippery.
    Lighting and objects remain consistent and realistic. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A rectangular clear ice cube rests near the top of a smooth, stainless steel
    inclined ramp. The ramp is wedge-shaped and sits on a light wooden table. There are water droplets
    and meltwater trails on the metal surface around and below the ice cube. In the background, there
    is a window and laboratory cabinets.
  init2final_edit_prompt: Edit the given image to show the ice cube positioned at the very bottom end
    of the metal ramp, leaving the original position at the top of the ramp empty.
  rationale: The ice cube is placed on a slippery, inclined surface. Under the influence of gravity, and
    given the low friction described, the ice cube will slide down the ramp. The camera maneuver (moving
    away until the scene is distant and then returning) implies a significant passage of time, sufficient
    for the ice cube to slide from the top to the bottom of the ramp (or potentially off it). The final
    state should show the ice cube significantly displaced down the incline.
