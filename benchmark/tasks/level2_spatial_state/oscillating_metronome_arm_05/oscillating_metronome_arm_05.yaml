evaluation:
  init_frame_description: A wooden metronome sits on a workbench with its front door open, revealing a
    heavily rusted internal gear mechanism. A long, rusty metal pendulum arm extends from the mechanism,
    protruding out of the box and angling downwards to the left. A rectangular sliding weight is attached
    to the arm. Various tools are scattered on the wooden surface in the background.
  init2final_edit_prompt: Edit the given image to show the metronome centered in the view with the scene
    unchanged. The rusted metal arm must remain in the exact same position and orientation as the original,
    pointing down and to the left. The wooden door must remain open. The internal gears must appear rusted
    and static. The tools on the workbench must remain in their original positions.
  rationale: The prompt explicitly states that the metronome is ancient, rusted, missing its wind-up key,
    and motionless. The camera rotates away and then returns to the center. Since the mechanism is broken
    and no external force is applied, the metronome arm must not move. The final frame should be visually
    identical to the initial frame. This task tests whether the model hallucinates motion (ticking) based
    on the object class or correctly adheres to the static constraints described in the text.
