changes:
  occlusion_method: A hand covers the camera lens, creating a blackout.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. A hand moves close to the lens and covers it completely,
    turning the screen black. The hand remains for a moment before moving away to reveal the scene again.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. A hand moves close to the lens and covers it completely,
    turning the screen black. The hand remains for a moment before moving away to reveal the scene again.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A polished steel sphere rests on a weathered wooden plank that extends diagonally
    from the bottom-left to the top-right of the frame. The plank appears to be an inclined ramp or seesaw.
    The background features a grassy field, trees, and a red barn in the distance, with soft daylight
    casting shadows.
  init2final_edit_prompt: Edit the given image to show the steel marble having rolled further down the
    wooden ramp towards the bottom-left. The marble should be positioned significantly closer to the bottom-left
    corner of the frame and appear slightly larger due to being closer to the camera. The wooden surface
    where the marble was originally positioned should now be empty, showing the wood grain texture.
  rationale: The initial frame shows a sphere on a ramp that ascends into the distance (the far end is
    clearly elevated above the ground compared to the near end). The prompt specifies the marble is rolling
    'down' the ramp under gravity. Therefore, the marble must roll towards the lowest point, which is
    towards the camera (the bottom-left of the frame). The occlusion event allows time for this motion
    to occur, so the final frame must show the marble displaced significantly in that direction.
