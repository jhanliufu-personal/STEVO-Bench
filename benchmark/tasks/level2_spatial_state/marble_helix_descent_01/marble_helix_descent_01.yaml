id: marble_helix_descent_01
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_helix_descent
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large blueprint blocking the view.
changes:
  occlusion_method: A large blueprint is held up in front of the camera, blocking the view.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The marble is released from the top entrance of the helical track. The marble is free to move
    along the grooved helical path. The track provides lateral constraint but allows motion along the
    spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic.
    The track descends vertically through multiple spiral turns from top to bottom. A large opaque blueprint
    is moved into the foreground, completely blocking the view of the helical track. The blueprint remains
    in place for several seconds while the marble remains hidden behind it. Then the blueprint is moved
    away, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The marble is released from the top entrance of the helical track. The marble is free to
    move along the grooved helical path. The track provides lateral constraint but allows motion along
    the spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic.
    The track descends vertically through multiple spiral turns from top to bottom. A large opaque blueprint
    is moved into the foreground, completely blocking the view of the helical track. The blueprint remains
    in place for several seconds while the marble remains hidden behind it. Then the blueprint is moved
    away, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear acrylic helical track stands on a wooden workbench. A glass marble with
    blue and green swirls is positioned at the very top entrance of the spiral track. The background features
    a workshop setting with tools hanging on a pegboard and a window.
  init2final_edit_prompt: Edit the given image to show the marble located at the bottom of the helical
    track structure instead of the top. The top entrance of the track must be empty. The marble should
    be visible resting or rolling near the bottom exit of the clear acrylic spiral.
  rationale: The video prompt establishes that gravity acts on the marble, causing it to roll down the
    helical path. The occlusion by the blueprint lasts for 'several seconds', which is sufficient time
    for a marble to traverse the length of the visible track shown in the initial frame. Therefore, when
    the view is restored, the marble must have moved from the top starting position to the bottom of the
    structure or the exit point.
