id: bouncing_ball_rebound_02
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large whiteboard blocking the view
changes:
  occlusion_method: Large opaque whiteboard rolls in front of camera
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood with
    elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. A large, opaque whiteboard on wheels rolls into the frame from the left, completely
    blocking the view of the hand, ball, and floor. The whiteboard remains in place for several seconds.
    Then the whiteboard rolls back out of the frame to the left, revealing the scene again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood
    with elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. A large, opaque whiteboard on wheels rolls into the frame from the left, completely
    blocking the view of the hand, ball, and floor. The whiteboard remains in place for several seconds.
    Then the whiteboard rolls back out of the frame to the left, revealing the scene again. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of a robotic arm with a carbon fiber finish and 'DYNAMIX ROBOTICS'
    branding, extending from the upper right. The arm's mechanical gripper is holding a yellow tennis
    ball. The background consists of a polished wooden parquet floor with a herringbone pattern and reflections.
  init2final_edit_prompt: Edit the given image to show the robotic gripper open and empty, with the fingers
    spread apart. Place the tennis ball on the wooden floor directly below the gripper. Ensure the ball
    is resting on the floor surface with a realistic contact shadow. Keep the robotic arm's position and
    the wooden floor background unchanged.
  rationale: The video prompt describes the ball being released from the gripper. Gravity causes the ball
    to fall to the floor. The occlusion by the whiteboard lasts for several seconds, which is sufficient
    time for the ball to fall, bounce on the elastic hardwood floor, and eventually settle on the ground
    or be in the very late stages of low bouncing. Therefore, in the final frame, the gripper should be
    empty and the ball should be located on the floor below the release point.
  questions:
  - id: ball_height_change
    question: Is the tennis ball located lower in the frame than its initial position?
    answer_type: yes_no
    notes_for_judge: The ball falls due to gravity, so its final position must be lower than the gripper.
  - id: gripper_state
    question: Is the robotic gripper empty?
    answer_type: yes_no
    notes_for_judge: The prompt states the ball is released, so the gripper should no longer hold it.
  - id: ball_floor_contact
    question: Is the tennis ball resting on or positioned very close to the wooden floor?
    answer_type: yes_no
    notes_for_judge: After several seconds, the ball should have settled on the floor.
  - id: ball_separation
    question: Is the tennis ball physically separated from the gripper fingers?
    answer_type: yes_no
    notes_for_judge: The ball must be detached from the hand.
  - id: vertical_alignment
    question: Is the tennis ball positioned vertically below the robotic gripper?
    answer_type: yes_no
    notes_for_judge: Assuming a release without lateral throw, the ball should drop roughly straight down.
  - id: object_permanence
    question: Is the tennis ball visible in the scene?
    answer_type: yes_no
    notes_for_judge: The whiteboard rolls away, revealing the scene; the ball should still be there.
  - id: background_consistency
    question: Is the wooden parquet floor pattern visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change, only the ball's position.
