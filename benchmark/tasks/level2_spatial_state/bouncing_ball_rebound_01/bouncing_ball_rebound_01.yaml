id: bouncing_ball_rebound_01
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off (pitch black).
changes:
  occlusion_method: Lights turn off completely, plunging the scene into darkness, then turn back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood with
    elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. Suddenly, the lights in the room turn off completely, plunging the scene into absolute
    pitch black darkness. The darkness persists for several seconds while the ball remains unseen. Then
    the lights turn back on instantly, restoring the original lighting. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood
    with elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. Suddenly, the lights in the room turn off completely, plunging the scene into absolute
    pitch black darkness. The darkness persists for several seconds while the ball remains unseen. Then
    the lights turn back on instantly, restoring the original lighting. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot showing a person's arm and hand releasing a yellow
    tennis ball. The ball is suspended in mid-air just below the fingertips in the center of the frame.
    The background consists of a polished brown hardwood floor, a white baseboard, and a window letting
    in natural daylight. A dark furniture leg is visible in the upper left.
  init2final_edit_prompt: Edit the given image to place the yellow tennis ball on the hardwood floor in
    the bottom center of the frame. Remove the ball from its original mid-air position near the fingers
    so that the space below the hand is empty. Ensure the ball appears to be resting on the floor surface
    while maintaining the original lighting and background.
  rationale: The ball is released and subjected to gravity. The prompt specifies that 'several seconds'
    pass in darkness before the lights return. A drop from this height takes less than a second, meaning
    the ball will have hit the floor, bounced, and likely settled or begun rolling on the floor during
    the elapsed time. Therefore, in the final frame, the ball must be located on or very near the floor,
    significantly lower than its release point.
  questions:
  - id: ball_vertical_drop
    question: Is the tennis ball located lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: Gravity pulls the ball down.
  - id: ball_on_floor
    question: Is the tennis ball positioned on or very near the hardwood floor surface?
    answer_type: yes_no
    notes_for_judge: After several seconds, the ball should have settled on the floor.
  - id: initial_space_empty
    question: Is the space directly below the fingers (where the ball started) now empty?
    answer_type: yes_no
    notes_for_judge: The ball has moved away from the release point.
  - id: ball_alignment
    question: Is the tennis ball positioned vertically below the hand?
    answer_type: yes_no
    notes_for_judge: The ball falls straight down; lateral motion is minimal without an initial throw.
  - id: lighting_check
    question: Is the scene illuminated (not pitch black)?
    answer_type: yes_no
    notes_for_judge: The prompt states the lights turn back on.
  - id: hand_consistency
    question: Is the hand still visible in the upper right portion of the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: floor_consistency
    question: Is the hardwood floor texture still visible in the background?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
