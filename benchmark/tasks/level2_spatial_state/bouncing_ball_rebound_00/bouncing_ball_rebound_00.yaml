id: bouncing_ball_rebound_00
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood with
    elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood
    with elastic properties. The ball is a standard tennis ball with typical bounce characteristics. Gravity
    acts on the ball. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A robotic arm with a black carbon-fiber texture and silver joints extends from
    the top right corner. It has a claw-style gripper holding a standard yellow tennis ball. The background
    is a polished wooden parquet floor with a herringbone pattern, reflecting light from a window.
  init2final_edit_prompt: Edit the given image to show the robotic gripper jaws open and empty. Position
    the yellow tennis ball in mid-air, vertically below the gripper and significantly closer to the wooden
    floor. Maintain the original background and camera perspective.
  rationale: The prompt specifies that the ball is released from the hand, meaning the gripper must open.
    Once released, gravity acts on the ball, causing it to accelerate downwards. Therefore, in the final
    state, the ball must be physically separated from the gripper and located at a lower vertical position,
    closer to the floor than in the initial frame. The camera remains stationary, so the background and
    arm position should remain largely unchanged.
  questions:
  - id: ball_separated
    question: Is the tennis ball physically separated from the robotic gripper?
    answer_type: yes_no
    notes_for_judge: The ball should no longer be touching the gripper jaws.
  - id: ball_lower
    question: Is the tennis ball positioned lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: Compare the vertical center of the ball in both frames.
  - id: gripper_open
    question: Are the jaws of the robotic gripper open or empty?
    answer_type: yes_no
    notes_for_judge: The gripper should not be holding the ball.
  - id: ball_closer_floor
    question: Is the tennis ball closer to the wooden floor than it was initially?
    answer_type: yes_no
    notes_for_judge: The distance between the ball and the floor should have decreased.
  - id: vertical_alignment
    question: Is the tennis ball positioned vertically below the gripper?
    answer_type: yes_no
    notes_for_judge: The ball should fall straight down due to gravity, maintaining rough horizontal alignment
      with the release point.
  - id: background_consistency
    question: Is the wooden floor pattern unchanged?
    answer_type: yes_no
    notes_for_judge: The parquet pattern should remain consistent.
  - id: arm_presence
    question: Is the robotic arm still visible in the top right area of the frame?
    answer_type: yes_no
    notes_for_judge: The arm should not disappear.
