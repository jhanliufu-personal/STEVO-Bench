id: spinning_coin_wobble
level: 2
category: spatial_kinematics
kinematic_variable: Angular velocity and orientation stability
tags: []
prompts:
  image_gen_prompt: A quarter coin is spinning upright on a smooth wooden table surface. The coin is rotating rapidly around its vertical axis in a stable upright position.
  video_WM: The coin continues spinning on the table surface. The coin edge maintains contact with the table. Friction exists between the coin edge and the wooden surface. Air resistance acts on the rotating coin. The coin is a standard metal quarter with typical mass distribution. The camera rotates right at constant speed until the coin completely exits the view to the right. The camera continues rotating right for several seconds while the coin remains off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the table surface back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The coin continues spinning on the table surface. The coin edge maintains contact with the table. Friction exists between the coin edge and the wooden surface. Air resistance acts on the rotating coin. The coin is a standard metal quarter with typical mass distribution during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
