evaluation:
  init_frame_description: A red tetherball rests on the dirt ground on the left side of the frame. A vertical
    wooden pole stands on the right side. A thin white string connects the top of the pole to the ball;
    the string is slack and curves downwards towards the ground. The ground is dry, textured dirt with
    some small stones.
  init2final_edit_prompt: Edit the given image to show the red ball resting on the ground in its original
    position to the left of the pole. The wooden pole stands vertically on the right. The string connects
    the ball and pole and appears slack. The atmosphere is clear and free of dust, haze, or visual obstructions.
    The ground and background details are visible and unchanged.
  rationale: The video generation prompt describes a wind event that creates a temporary visual occlusion
    (dust) but does not explicitly state that the wind exerts enough force to move the heavy tetherball.
    Given the physics of a rubber ball on dirt (friction) and the lack of described motion for the ball
    itself, the correct physical rollout preserves the ball's position (stationarity) and existence (permanence)
    through the occlusion. The final state should be visually similar to the initial state, with the dust
    settled and the view cleared.
