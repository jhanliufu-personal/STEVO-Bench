  camera_WM: The ball sits stationary on the dirt ground. The string connecting it to the pole is slack.
    A sudden gust of wind kicks up a thick, opaque cloud of brown dust that completely obscures the pole
    and ball. The dust lingers for a moment before settling and clearing the view. No zoom, no cut, no
