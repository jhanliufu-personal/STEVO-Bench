id: ball_rolls_off_cliff_08
level: 2
category: spatial_kinematics
tags: []
variant_of: ball_rolls_off_cliff
variation_type: combined
variation_description: Barrier added AND fog occlusion used.
changes:
  occlusion_method: Dense fog fills the room.
  dynamic_conditions: Solid barrier added at edge.
  expected_outcome_change: Ball hits barrier and stops.
prompts:
  init_frame_edit_prompt: Edit the image to place a solid wooden block fixed to the table surface directly
    between the ball and the table edge.
  video_WM: The ball rolls toward the table edge where a solid wooden block is fixed in its path. The
    block is immobile. Dense, opaque white fog rapidly fills the room, reducing visibility to zero. The
    fog swirls for several seconds, obscuring the collision. Then the fog dissipates rapidly, restoring
    clear view of the scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball rolls toward the table edge where a solid wooden block is fixed in its path. The
    block is immobile. Dense, opaque white fog rapidly fills the room, reducing visibility to zero. The
    fog swirls for several seconds, obscuring the collision. Then the fog dissipates rapidly, restoring
    clear view of the scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A wooden table surface with a red textured ball on the left side, exhibiting
    motion blur moving towards the right. A solid rectangular wooden block is positioned on the right
    side of the table, lying perpendicular to the ball's path. A window is visible in the background on
    the left, and a rug is on the floor below.
  init2final_edit_prompt: Edit the given image to show the red ball positioned on the table surface to
    the left of the wooden block. The ball should appear sharp without motion blur, reflecting a state
    after it has collided with the block and rebounded or stopped. The wooden block must remain in its
    exact original position and orientation. Ensure the scene is fully clear and visible.
  rationale: The ball is initially moving to the right towards a fixed, solid wooden block. The prompt
    states the block is fixed in the ball's path. Physics dictates that upon collision, the ball cannot
    pass through the solid object; it must either stop against it or rebound to the left. The fog obscures
    this interaction but then dissipates. Therefore, in the final state, the ball must be visible on the
    table to the left of the block (having been blocked), and the block must remain immobile.
  questions:
  - id: ball_on_table
    question: Is the red ball visible on the table surface?
    answer_type: yes_no
    notes_for_judge: The ball should not have fallen off the table because the block obstructed its path
      to the edge.
  - id: ball_left_of_block
    question: Is the red ball located to the left of the wooden block?
    answer_type: yes_no
    notes_for_judge: The ball was moving right but hit the block; it should not be to the right of the
      block.
  - id: block_position
    question: Is the wooden block in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The prompt states the block is fixed and immobile.
  - id: fog_cleared
    question: Is the scene free of dense fog?
    answer_type: yes_no
    notes_for_judge: The prompt states the fog dissipates rapidly.
  - id: ball_not_passed
    question: Has the red ball been prevented from passing to the right side of the wooden block?
    answer_type: yes_no
    notes_for_judge: Check that the ball is not on the right side of the block.
  - id: background_consistency
    question: Is the window in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
