id: spring_oscillation_05
level: 2
category: spatial_kinematics
tags: []
variant_of: spring_oscillation
variation_type: dynamic_condition
variation_description: The weight is at rest and is not released, implying no movement.
changes:
  occlusion_method: null
  dynamic_conditions: System is at equilibrium; no initial displacement.
  expected_outcome_change: No movement (static state)
prompts:
  init_frame_edit_prompt: Edit the image to remove the gloved hand entirely, showing the weight hanging
    freely in the air without being touched.
  video_WM: The weight hangs freely at its natural equilibrium point. No external forces are applied,
    and the system is at rest. The camera rotates right until the weight completely exits the view, then
    rotates toward the left smoothly at the same rate until the ceiling mount is back in the center of
    view. No zoom, no cut, no scene change. STOP.
  camera_WM: The weight hangs freely at its natural equilibrium point. No external forces are applied,
    and the system is at rest. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A workshop scene showing a 20kg cylindrical metal weight hanging from a large
    coil spring attached to a ceiling mount. To the right of the weight is a vertical wooden post with
    a measuring tape; the top edge of the weight aligns with the black marker line labeled '20cm'. In
    the background, there is a large window with a grid pattern and various workshop tools.
  init2final_edit_prompt: Edit the given image so that the 20kg weight appears in the exact same position
    as the original, with its top edge aligned with the 20cm mark on the ruler. The spring should maintain
    the same extension length as the initial view, and the weight should be centered in the frame relative
    to the background window.
  rationale: The prompt specifies that the system is at rest at its natural equilibrium point and no external
    forces are applied. This describes a static physical state governed by Newton's first law. Although
    the camera rotates away (occluding the weight) and then returns to the initial angle, the weight itself
    must not move, oscillate, or change position. Therefore, the final frame must be visually identical
    to the initial frame, preserving the alignment between the weight and the 20cm mark.
  questions:
  - id: q1
    question: Is the top of the weight aligned with the 20cm mark on the ruler?
    answer_type: yes_no
    notes_for_judge: The weight should not have moved; alignment must be preserved.
  - id: q2
    question: Is the weight at the same vertical height as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check relative to background features like the window grid.
  - id: q3
    question: Does the spring appear to have the same extension length as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The spring should not be compressed or stretched further.
  - id: q4
    question: Is the weight positioned in front of the same section of the window as initially?
    answer_type: yes_no
    notes_for_judge: Verifies the camera returned to the correct angle and the object didn't swing.
  - id: q5
    question: Is the '20 KG' text on the weight clearly visible?
    answer_type: yes_no
    notes_for_judge: Verifies object permanence and lack of rotation.
  - id: q6
    question: Is the wooden post with the measuring tape visible on the right side of the frame?
    answer_type: yes_no
    notes_for_judge: Verifies camera framing consistency.
