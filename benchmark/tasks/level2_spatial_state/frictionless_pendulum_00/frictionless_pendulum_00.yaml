prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The lead bob is released from its initial 45-degree position. The chamber is a vacuum, and
    the pivot point at the top is a low-friction bearing. Camera remains stationary throughout, keeping
    the entire pendulum fully visible within the frame. No zoom, no cut, no scene change. STOP.
  camera_WM: The lead bob is released from its initial 45-degree position. The chamber is a vacuum, and
    the pivot point at the top is a low-friction bearing. Camera remains stationary throughout, keeping
    the entire pendulum fully visible within the frame. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large spherical metal bob suspended by a thin wire inside a cylindrical glass
    vacuum chamber. The bob is positioned to the left side of the chamber, held at an elevated angle by
    an articulated mechanical arm. The background shows a laboratory setting with windows and equipment
    visible through the glass chamber.
  init2final_edit_prompt: Edit the image to show the metal sphere hanging vertically in the center of
    the chamber, at the lowest point of its swing. The sphere should be positioned lower than in the original
    image and centered within the glass cylinder. The mechanical arm on the left should remain in place
    but no longer be touching or holding the sphere. The wire suspending the sphere should appear straight
    and vertical.
  rationale: Upon release, gravity acts on the pendulum bob, causing it to swing downwards and towards
    the center of the chamber (the equilibrium position). Since the environment is a vacuum with low friction,
    the motion is a smooth arc. The final state represents the bob having traveled along this arc, resulting
    in a lower vertical position and a horizontal shift towards the center of the chamber compared to
    the initial held position.
