id: frictionless_pendulum_10
level: 2
category: spatial_kinematics
tags: []
variant_of: frictionless_pendulum
variation_type: combined
variation_description: Light balloon in air (high drag) combined with camera zoom occlusion.
changes:
  occlusion_method: Camera zooms out until scene is unrecognizable.
  dynamic_conditions: Object is a light balloon in air (not vacuum).
  expected_outcome_change: Balloon falls slowly or drifts; does not swing like a heavy pendulum.
prompts:
  init_frame_edit_prompt: Edit the image to replace the heavy metal sphere with a lightweight, inflated
    red balloon attached to the wire.
  video_WM: The chamber contains standard air at atmospheric pressure. The lightweight red balloon is
    released from its initial 45-degree position. The camera zooms out continuously until the chamber
    is a distant indistinguishable speck, then zooms back in smoothly to the original framing. No cut,
    no scene change. STOP.
  camera_WM: The chamber contains standard air at atmospheric pressure. The lightweight red balloon is
    released from its initial 45-degree position. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A large cylindrical glass chamber containing a red balloon suspended by a thin
    string from the top center. A mechanical arm on the left side holds the balloon, pulling it to the
    side at an approximate 45-degree angle. The background shows a laboratory setting with windows and
    equipment.
  init2final_edit_prompt: Edit the given image to show the red balloon hanging vertically in the center
    of the glass chamber, suspended straight down by the string. The mechanical arm on the left should
    remain in place but must be empty, no longer touching or holding the balloon. The balloon should be
    positioned lower than in the original image, resting at the bottom of its arc in the center of the
    cylinder.
  rationale: The prompt specifies that the balloon is released in standard air (not a vacuum) and the
    camera performs a long duration zoom-out and zoom-in sequence (until the chamber is a speck and back).
    A lightweight balloon in air experiences significant air resistance relative to its mass. Over the
    long duration implied by the camera move, the pendulum motion will be heavily damped by air resistance.
    By the time the camera returns to the initial framing, the balloon will have settled (or nearly settled)
    at its equilibrium position, hanging vertically in the center of the chamber.
