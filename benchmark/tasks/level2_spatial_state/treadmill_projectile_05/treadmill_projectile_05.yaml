id: treadmill_projectile_05
level: 2
category: spatial_kinematics
tags: []
variant_of: treadmill_projectile
variation_type: dynamic_condition
variation_description: The treadmill belt is turned off and stationary.
changes:
  occlusion_method: null
  dynamic_conditions: Treadmill belt velocity is zero.
  expected_outcome_change: The ball will land exactly where it launched (relative to the room) as there
    is no horizontal velocity component.
prompts:
  init_frame_edit_prompt: Edit the image to make the treadmill belt look completely static and sharp,
    and change the display panel to read '0.0 MPH'.
  video_WM: The robotic launcher fires a tennis ball vertically into the air. The treadmill belt is powered
    off and remains completely stationary. The air in the room is still. The camera rotates right until
    the treadmill completely exits the view, then rotates toward the left smoothly at the same rate until
    the launcher is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is launched vertically from a launcher sitting on a stationary treadmill belt. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A small robotic apparatus constructed from aluminum extrusions sits on a wide,
    dark, textured treadmill belt. The robot features a vertical metal shaft, exposed wiring, and a blue
    digital display showing '0.0'. It is positioned in the foreground of an industrial room with concrete
    walls and safety cages.
  init2final_edit_prompt: Edit the given image to show a yellow tennis ball resting on the treadmill belt
    surface near the base of the robotic apparatus. Ensure the robotic apparatus and the treadmill belt
    remain in exactly the same position, orientation, and lighting as the original image, with no movement
    or displacement.
  rationale: The video sequence involves the camera panning away from the scene and then returning to
    the exact initial viewpoint. The treadmill belt is explicitly described as powered off and stationary,
    meaning the robotic launcher must remain in its original position (kinematic consistency). The launcher
    fires a tennis ball vertically; given the stationary base and the duration of the camera movement,
    the ball will have ascended and landed back on the belt near the launcher by the time the view returns.
  questions:
  - id: robot_stationary
    question: Is the robotic apparatus in the same position on the treadmill belt as it was in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The treadmill is off, so the robot should not have moved.
  - id: ball_visible
    question: Is a yellow tennis ball visible in the final frame?
    answer_type: yes_no
    notes_for_judge: The launcher fired a ball, which should have landed back in view.
  - id: ball_location
    question: Is the tennis ball located on the treadmill belt?
    answer_type: yes_no
    notes_for_judge: The ball should land on the surface beneath the launcher.
  - id: background_consistency
    question: Is the background (walls, safety cage) aligned identically to the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the center view.
  - id: robot_orientation
    question: Is the robotic apparatus still upright and facing the same direction?
    answer_type: yes_no
    notes_for_judge: It should not have tipped over or rotated.
  - id: display_visible
    question: Is the blue digital display still visible on the robotic apparatus?
    answer_type: yes_no
    notes_for_judge: Checks for object permanence/consistency.
