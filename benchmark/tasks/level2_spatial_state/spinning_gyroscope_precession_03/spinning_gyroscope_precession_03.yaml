id: spinning_gyroscope_precession_03
level: 2
category: spatial_kinematics
tags: []
variant_of: spinning_gyroscope_precession
variation_type: occlusion_method
variation_description: Replaces camera rotation with thick industrial smoke/steam obscuring the view.
changes:
  occlusion_method: Fog/Smoke
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (gyroscope continues precessing)
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The gyroscope is spinning rapidly while its axis slowly circles around the vertical pedestal
    in a precessional motion. Thick white industrial steam suddenly fills the room, completely obscuring
    the gyroscope and pedestal. The steam then dissipates rapidly, clearing the view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The gyroscope is spinning rapidly while its axis slowly circles around the vertical pedestal
    in a precessional motion. Thick white industrial steam suddenly fills the room, completely obscuring
    the gyroscope and pedestal. The steam then dissipates rapidly, clearing the view. No zoom, no cut,
    no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a large industrial gyroscope resting on a metal workbench.
    The gyroscope features a thick brass rotor inside a steel gimbal frame. It is balanced on a sharp
    conical pivot point on a metal plate covered in metal shavings. A heavy metal chain hangs vertically
    on the left side. The background shows a workshop environment with white brick walls, shelves, and
    various tools.
  init2final_edit_prompt: Edit the given image so that the gyroscope's tilted axis is oriented in a different
    direction around the vertical pivot point, simulating rotational precession. The gyroscope must remain
    balanced on its bottom tip. Ensure the scene is completely clear of steam or fog, revealing the original
    workshop background and the metal table with shavings.
  rationale: The prompt describes a gyroscope undergoing precession, which is the slow rotation of the
    axis of a spinning body around a vertical line. While the steam obscures the view, the gyroscope continues
    to spin and precess. When the steam clears, the gyroscope should still be balanced on its pivot (due
    to the stability provided by the rapid spin) but its axis should be pointing in a different azimuthal
    direction compared to the start. The final state requires the steam to be fully dissipated.
  questions:
  - id: axis_orientation_change
    question: Is the gyroscope's central axis pointing in a different direction compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The axis should have precessed (rotated around the vertical) to a new angle.
  - id: gyro_balanced
    question: Is the gyroscope still balanced on its bottom pivot point?
    answer_type: yes_no
    notes_for_judge: It should not have fallen over; it should be upright on the tip.
  - id: steam_cleared
    question: Is the view clear of the thick white steam mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the steam dissipates rapidly, so the final frame should be clear.
  - id: top_position_shift
    question: Has the top of the gyroscope moved horizontally relative to the background features?
    answer_type: yes_no
    notes_for_judge: Due to precession, the top of the axis moves in a circle.
  - id: background_consistency
    question: Are the background shelves and white brick wall visible again?
    answer_type: yes_no
    notes_for_judge: Verifies that the occlusion has ended and the background is consistent.
  - id: chain_presence
    question: Is the hanging chain on the left still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for static objects.
