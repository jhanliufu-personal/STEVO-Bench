evaluation:
  init_frame_description: A black hockey puck on a rough, cracked concrete floor. There is a cloud of
    dust and debris spraying out from the base of the puck, indicating motion or impact. The concrete
    surface has visible cracks and a gritty texture. The lighting is natural and overhead.
  init2final_edit_prompt: Edit the given image to show the hockey puck in a different position on the
    concrete floor, displaced from its original location relative to the cracks. Remove the flying dust
    and debris spray around the puck to show the scene after the dust has settled. Keep the concrete floor
    texture, camera angle, and lighting identical to the initial frame.
  rationale: The puck is sliding on rough concrete with high friction. During the several seconds of darkness,
    the kinetic energy of the puck is dissipated by friction, causing it to decelerate and slide to a
    new location, likely coming to a stop. The dust and debris visible in the initial frame would settle
    during this time. When the lights turn back on, the puck should be in a different position (displacement)
    and the dynamic dust cloud should be gone (state change).
