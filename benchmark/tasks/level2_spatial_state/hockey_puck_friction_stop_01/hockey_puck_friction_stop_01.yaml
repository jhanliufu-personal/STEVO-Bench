id: hockey_puck_friction_stop_01
level: 2
category: spatial_kinematics
tags: []
variant_of: hockey_puck_friction_stop
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off (pitch black).
changes:
  occlusion_method: Lights turn off completely, plunging scene into darkness, then turn back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber with significant contact area
    against the rough surface. No external forces are applied to the puck after it is already in motion.
    Suddenly, all lights in the environment turn off, plunging the scene into total darkness for several
    seconds. Then the lights turn back on, illuminating the concrete floor area again. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber with significant contact area
    against the rough surface. No external forces are applied to the puck after it is already in motion.
    Suddenly, all lights in the environment turn off, plunging the scene into total darkness for several
    seconds. Then the lights turn back on, illuminating the concrete floor area again. No zoom, no cut,
    no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A black hockey puck on a rough, cracked concrete floor. There is a cloud of
    dust and debris spraying out from the base of the puck, indicating motion or impact. The concrete
    surface has visible cracks and a gritty texture. The lighting is natural and overhead.
  init2final_edit_prompt: Edit the given image to show the hockey puck in a different position on the
    concrete floor, displaced from its original location relative to the cracks. Remove the flying dust
    and debris spray around the puck to show the scene after the dust has settled. Keep the concrete floor
    texture, camera angle, and lighting identical to the initial frame.
  rationale: The puck is sliding on rough concrete with high friction. During the several seconds of darkness,
    the kinetic energy of the puck is dissipated by friction, causing it to decelerate and slide to a
    new location, likely coming to a stop. The dust and debris visible in the initial frame would settle
    during this time. When the lights turn back on, the puck should be in a different position (displacement)
    and the dynamic dust cloud should be gone (state change).
  questions:
  - id: position_change
    question: Is the hockey puck in a different position on the concrete floor than it was in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Compare the puck's location relative to the cracks in the concrete. It should have
      moved.
  - id: landmark_displacement
    question: Has the puck moved away from the specific crack pattern it was covering or touching in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: The puck should no longer be aligned with the exact same cracks as the starting image.
  - id: dust_settled
    question: Is the flying dust and debris spray around the puck absent?
    answer_type: yes_no
    notes_for_judge: The initial frame has dust kicking up; the final frame should be clear as time has
      passed.
  - id: texture_consistency
    question: Is the concrete floor texture consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change, only the puck's position.
  - id: lighting_restored
    question: Is the scene illuminated similarly to the initial frame, rather than being dark?
    answer_type: yes_no
    notes_for_judge: The prompt states the lights turn back on.
  - id: camera_static
    question: Is the camera angle and zoom level identical to the initial frame?
    answer_type: yes_no
    notes_for_judge: The background features (cracks) should be the same scale and orientation.
