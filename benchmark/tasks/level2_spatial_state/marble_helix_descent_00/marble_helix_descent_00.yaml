evaluation:
  init_frame_description: A clear acrylic helical track structure sits on a wooden workbench in a workshop
    setting. A blue and green swirled glass marble is positioned at the very top entrance of the spiral
    track, ready to roll down. The background features a pegboard with tools and a window.
  init2final_edit_prompt: Edit the given image to move the blue and green marble from the top of the track
    to a position significantly lower down on the spiral. The marble should be visible on one of the middle
    or lower loops of the clear acrylic track. The top entrance where the marble was originally located
    must now be empty.
  rationale: Gravity acts on the marble, causing it to accelerate downwards upon release. The helical
    track constrains the marble's motion, forcing it to follow the spiral path rather than falling straight
    down. Due to the low friction of the acrylic and the slope of the helix, the marble will travel a
    significant distance down the track during the video duration, resulting in a final state where it
    is at a lower vertical elevation and the starting position is empty.
