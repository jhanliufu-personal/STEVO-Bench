id: marble_helix_descent_00
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_helix_descent
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The marble is released from the top entrance of the helical track. The marble is free to move
    along the grooved helical path. The track provides lateral constraint but allows motion along the
    spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic.
    The track descends vertically through multiple spiral turns from top to bottom. Camera remains stationary
    throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The marble is released from the top entrance of the helical track. The marble is free to
    move along the grooved helical path. The track provides lateral constraint but allows motion along
    the spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic.
    The track descends vertically through multiple spiral turns from top to bottom. Camera remains stationary
    throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear acrylic helical track structure sits on a wooden workbench in a workshop
    setting. A blue and green swirled glass marble is positioned at the very top entrance of the spiral
    track, ready to roll down. The background features a pegboard with tools and a window.
  init2final_edit_prompt: Edit the given image to move the blue and green marble from the top of the track
    to a position significantly lower down on the spiral. The marble should be visible on one of the middle
    or lower loops of the clear acrylic track. The top entrance where the marble was originally located
    must now be empty.
  rationale: Gravity acts on the marble, causing it to accelerate downwards upon release. The helical
    track constrains the marble's motion, forcing it to follow the spiral path rather than falling straight
    down. Due to the low friction of the acrylic and the slope of the helix, the marble will travel a
    significant distance down the track during the video duration, resulting in a final state where it
    is at a lower vertical elevation and the starting position is empty.
  questions:
  - id: marble_lower_pos
    question: Is the marble at a lower vertical height than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the marble in the final frame to the initial frame.
  - id: top_empty
    question: Is the top entrance of the track empty?
    answer_type: yes_no
    notes_for_judge: The starting position at the very top of the spiral should no longer contain the
      marble.
  - id: marble_on_track
    question: Is the marble visible on a lower section of the spiral track?
    answer_type: yes_no
    notes_for_judge: The marble should be resting on the track grooves, not floating or on the table.
  - id: path_consistency
    question: Has the marble moved along the path of the helix?
    answer_type: yes_no
    notes_for_judge: The displacement should follow the curve of the track.
  - id: marble_displacement
    question: Has the marble moved away from its initial starting coordinates?
    answer_type: yes_no
    notes_for_judge: Check for any movement from the start.
  - id: background_stability
    question: Do the tools on the pegboard in the background remain stationary?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
