id: marble_track_loop_08
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_track_loop
variation_type: combined
variation_description: Blocked track combined with object blocking occlusion.
changes:
  occlusion_method: A person walks in front of the camera, blocking the view.
  dynamic_conditions: A wooden block obstructs the loop.
  expected_outcome_change: Collision with block.
prompts:
  init_frame_edit_prompt: Edit the image to place a small, solid wooden block firmly wedged inside the
    plastic loop track.
  video_WM: The steel ball rolls into the vertical loop toward a wooden block wedged inside the track
    path. A person in a dark shirt walks directly in front of the camera, completely blocking the view
    of the workbench. The person pauses, then walks away, clearing the view. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The steel ball rolls into the vertical loop toward a wooden block wedged inside the track
    path. A person in a dark shirt walks directly in front of the camera, completely blocking the view
    of the workbench. The person pauses, then walks away, clearing the view. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a wooden marble run structure with a clear plastic track
    forming a vertical loop. A cubic wooden block is wedged or resting inside the track at the bottom
    of the loop. The background shows a workbench with various tools like clamps, a hammer, and chisels,
    illuminated by natural light from a window.
  init2final_edit_prompt: Edit the given image to show the wooden block displaced from its original position
    inside the loop, appearing pushed further along the track or tumbled over. Add a steel ball visible
    on the track, resting near the displaced block or settled at the bottom of the loop.
  rationale: 'The prompt describes a steel ball rolling into the loop and colliding with the stationary
    wooden block. This physical interaction transfers momentum, causing the block to move from its initial
    resting position. The view is temporarily occluded by a person, but they walk away before the end.
    Therefore, the final state must show the consequences of the collision: the block should be displaced
    (pushed forward or knocked over) and the steel ball, which entered the scene to cause the impact,
    should now be visible on the track.'
