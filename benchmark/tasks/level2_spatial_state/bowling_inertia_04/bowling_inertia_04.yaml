id: bowling_inertia_04
level: 2
category: spatial_kinematics
tags: []
variant_of: bowling_inertia
variation_type: dynamic_condition
variation_description: The lane surface is changed to shag carpet, introducing high friction.
changes:
  occlusion_method: null
  dynamic_conditions: Surface changed from oiled wood to thick carpet (high friction)
  expected_outcome_change: Ball travels significantly less distance or stops completely due to friction.
prompts:
  init_frame_edit_prompt: Edit the image to change the floor surface from polished wood to a thick, textured
    shag carpet.
  video_WM: The bowling ball is in motion on a lane covered in thick shag carpet. The rough texture creates
    significant rolling resistance against the heavy ball. The camera rotates right until the ball completely
    exits the view, then rotates toward the left smoothly at the same rate until the lane is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy bowling ball is in motion on a lane covered in thick shag carpet. The rough texture
    creates significant rolling resistance against the heavy ball. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A low-angle, eye-level view of a black bowling ball centered in the foreground
    on a bowling lane. Unusually, the lane is covered in thick, beige shag carpet instead of wood. Dark
    gutters run along the left and right sides. In the blurred background, white bowling pins and lane
    markers are visible.
  init2final_edit_prompt: Edit the given image to show the bowling ball positioned further down the lane,
    closer to the background pins. Scale the ball down to appear smaller, consistent with perspective
    as it moves away from the camera. Keep the shag carpet texture and background elements unchanged.
  rationale: The prompt states the ball is in motion on the lane. In a bowling context, motion is directed
    away from the camera towards the pins. The camera performs a pan right and then returns to the center.
    During this occlusion, time passes, and the ball continues its trajectory down the lane. Due to the
    rolling resistance of the shag carpet mentioned in the prompt, the ball moves forward but likely does
    not reach the pins immediately. The final state should show the ball further away (smaller due to
    perspective) but still on the carpet.
  questions:
  - id: ball_depth_change
    question: Is the bowling ball positioned further down the lane than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should have moved away from the camera, appearing higher in the frame or
      smaller.
  - id: ball_size_perspective
    question: Does the bowling ball appear smaller than in the initial frame due to being further away?
    answer_type: yes_no
    notes_for_judge: Perspective dictates the ball shrinks as it moves away.
  - id: ball_closer_to_pins
    question: Is the bowling ball closer to the background pins than in the starting image?
    answer_type: yes_no
    notes_for_judge: Check relative distance to the background.
  - id: ball_visibility
    question: Is the bowling ball still visible in the lane?
    answer_type: yes_no
    notes_for_judge: The camera returns to the lane view; the ball should not have vanished unless it
      moved extremely fast, which is unlikely given the 'resistance'.
  - id: surface_consistency
    question: Is the lane surface still covered in shag carpet?
    answer_type: yes_no
    notes_for_judge: The environment style should persist.
  - id: ball_y_axis_movement
    question: Has the bowling ball moved upwards in the 2D image plane (indicating depth)?
    answer_type: yes_no
    notes_for_judge: Movement away from the camera on a flat plane usually corresponds to moving 'up'
      in the image.
