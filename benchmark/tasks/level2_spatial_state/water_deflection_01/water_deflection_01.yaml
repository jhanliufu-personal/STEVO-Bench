id: water_deflection_01
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: "A steady vertical stream of water falls from a tap. A high-powered handheld electric fan is positioned to the side, aimed horizontally at the middle of the falling stream."
  video_WM: "The electric fan is switched to its maximum setting. The horizontal airflow makes direct contact with the falling vertical stream of water. The camera rotates right until the fan completely exits the view, then rotates toward the left smoothly at the same rate until the drain directly below the tap is back in the center of view. No zoom, no cut, no scene change. STOP."
  camera_WM: "The horizontal air force from the fan is applied to the vertical water stream. The flow from the tap remains constant. STOP."
camera_control:
  HY-WorldPlay: "s-3, right-30, left-30"