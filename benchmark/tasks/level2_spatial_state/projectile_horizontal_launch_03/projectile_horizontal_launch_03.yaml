id: projectile_horizontal_launch_03
level: 2
category: spatial_kinematics
tags: []
variant_of: projectile_horizontal_launch
variation_type: occlusion_method
variation_description: Replaces camera rotation with a rapid zoom out and back in.
changes:
  occlusion_method: Camera zooms out until details are lost, then zooms in
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The red ball is traveling through the air after its horizontal launch. It is moving forward
    and downward under the influence of its initial momentum and gravity. The camera zooms out rapidly
    until the cannon and ball are too small to distinguish, revealing the wider workshop context. Then,
    the camera zooms back in to the exact original framing. No cut, no scene change. STOP.
  camera_WM: The red ball is traveling through the air after its horizontal launch, governed by its initial
    velocity and gravity. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden workbench inside a workshop. In the center
    stands a model cannon made of wood and brass. A red ball is suspended in mid-air just to the right
    of the cannon's muzzle, exhibiting motion blur indicating high speed. A puff of white smoke or steam
    is emerging from the barrel behind the ball. In the foreground, blueprints and a pencil lie on the
    table. The background shows a window on the left and an open doorway on the right leading to a brighter
    outdoor or garage area.
  init2final_edit_prompt: Edit the given image to remove the red ball and the white smoke cloud from the
    air. Ensure the brass cannon, the wooden workbench, the blueprints, and the background environment
    remain exactly unchanged.
  rationale: The video prompt describes a sequence where the camera zooms out and then back in to the
    original framing without a scene cut. During this elapsed time, the projectile (red ball), which was
    already in motion with significant momentum, will have continued its trajectory forward and downward.
    Given the speed implied by the blur and the time required for the camera maneuver, the ball will have
    traveled well beyond its initial position, likely exiting the frame or landing in the background.
    Similarly, the smoke from the discharge will have dissipated. Therefore, the final frame should depict
    the static workshop scene with the cannon, but without the mid-air ball or the initial smoke burst.
  questions:
  - id: ball_moved_from_start
    question: Is the red ball absent from its initial position immediately next to the cannon muzzle?
    answer_type: yes_no
    notes_for_judge: The ball should have moved forward/down or exited the frame. It should not be hovering
      right at the barrel tip.
  - id: ball_trajectory_right
    question: Has the red ball moved further to the right or exited the frame entirely?
    answer_type: yes_no
    notes_for_judge: Checks if the kinematic trajectory (forward motion) was respected.
  - id: smoke_dissipated
    question: Has the cloud of smoke near the barrel dissipated or disappeared?
    answer_type: yes_no
    notes_for_judge: Smoke should clear over time.
  - id: cannon_stationary
    question: Is the brass cannon still positioned on the wooden base?
    answer_type: yes_no
    notes_for_judge: The cannon itself should not vanish or move significantly.
  - id: blueprints_consistent
    question: Are the blueprints and pencil still visible on the workbench?
    answer_type: yes_no
    notes_for_judge: Static objects should remain.
  - id: background_consistent
    question: Is the open doorway in the background still visible?
    answer_type: yes_no
    notes_for_judge: The camera returns to the exact original framing.
