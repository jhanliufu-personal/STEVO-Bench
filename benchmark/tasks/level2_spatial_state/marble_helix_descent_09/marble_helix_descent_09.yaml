evaluation:
  init_frame_description: A clear acrylic helical track stands vertically on a wooden workbench. A glass
    marble with blue and green swirls rests at the very top entrance of the spiral track. The background
    shows a workshop setting with tools hanging on a pegboard to the left and a window to the right. The
    lighting is bright and natural.
  init2final_edit_prompt: Edit the given image to show the scene after the dust has cleared. Keep the
    marble in its exact original position at the very top of the helical track, as it is glued in place.
    Do not move the marble down the spiral. Ensure the background and track structure remain unchanged.
  rationale: The video generation prompt explicitly states that the marble is secured to the track with
    epoxy glue, which counteracts the force of gravity. Despite the occlusion by the dust cloud and the
    passage of time, the physical constraint (the adhesive) prevents any motion. Therefore, the correct
    final state is identical to the initial state regarding the marble's position; it must not roll down
    the track.
