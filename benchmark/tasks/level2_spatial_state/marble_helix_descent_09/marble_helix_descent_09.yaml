prompts:
  init_frame_edit_prompt: Edit the image to show a visible glob of clear epoxy glue surrounding the base
    of the marble at the top entrance, securing it to the track.
  video_WM: The marble sits at the top entrance of the helical track. A visible amount of epoxy glue secures
    the marble firmly to the plastic, preventing it from rolling. The track provides lateral constraint.
    Gravity acts on the marble, but the adhesive bond holds it in place. The helical path has low friction
    typical of acrylic plastic. The track descends vertically through multiple spiral turns from top to
    bottom. A cloud of thick, opaque workshop dust billows into the frame, completely obscuring the helical
    track from view. The dust cloud lingers for several seconds, hiding the marble. Then the dust settles
    and clears, revealing the scene again. No zoom, no cut, no scene change. STOP.
