id: bouncing_ball_rebound_04
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: dynamic_condition
variation_description: Floor changed to soft foam mat to dampen bounce
changes:
  occlusion_method: null
  dynamic_conditions: Floor is soft memory foam instead of hardwood
  expected_outcome_change: Ball should bounce significantly less or stop dead (dampened collision)
prompts:
  init_frame_edit_prompt: Edit the image to replace the hardwood floor with a thick, soft, dark grey memory
    foam gym mat texture.
  video_WM: The ball is released from the hand and becomes free to move. The floor is covered in a thick,
    soft memory foam gym mat designed to absorb impact. The ball is a standard tennis ball. Gravity acts
    on the ball. The camera rotates right at constant speed until the ball and hand completely exit the
    view to the right. The camera continues rotating right for several seconds while the ball remains
    off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is covered in a thick,
    soft memory foam gym mat designed to absorb impact. The ball is a standard tennis ball. Gravity acts
    on the ball during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A high-angle close-up shot showing a robotic arm with a black carbon-fiber shaft
    and silver metal joints extending from the top right. The robot's three-fingered gripper is holding
    a standard yellow-green tennis ball. The background is a floor covered with grey, textured, interlocking
    foam gym mats. A shadow of the arm and ball is cast on the mat below.
  init2final_edit_prompt: Edit the given image to show the robotic gripper open and empty, with the fingers
    spread apart. Move the yellow tennis ball to the grey foam floor directly below the gripper, showing
    it resting on the mat surface.
  rationale: The prompt specifies that the ball is released and gravity acts on it. The floor is described
    as soft memory foam designed to absorb impact, which significantly dampens any bounce. The camera
    rotates away for several seconds and then returns to the exact original viewpoint. During this elapsed
    time, the ball falls, impacts the mat, loses its energy to the foam, and settles on the floor directly
    below the release point. Therefore, the final frame must show the ball resting on the ground and the
    gripper empty.
