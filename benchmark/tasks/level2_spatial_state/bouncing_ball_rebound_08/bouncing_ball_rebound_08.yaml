  dynamic_conditions: Ball is heavy solid steel
  expected_outcome_change: Ball falls heavily (steel physics) + different occlusion style
prompts:
  init_frame_edit_prompt: Edit the image to change the tennis ball into a shiny, heavy, solid steel sphere.
  video_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood.
    The ball is a heavy, solid steel sphere with high mass. Gravity acts on the ball. A large, opaque
    whiteboard on wheels rolls into the frame from the left, completely blocking the view of the hand,
    ball, and floor. The whiteboard remains in place for several seconds. Then the whiteboard rolls back
    out of the frame to the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is solid hardwood.
    The ball is a heavy, solid steel sphere with high mass. Gravity acts on the ball. A large, opaque
    whiteboard on wheels rolls into the frame from the left, completely blocking the view of the hand,
    ball, and floor. The whiteboard remains in place for several seconds. Then the whiteboard rolls back
    out of the frame to the left, revealing the scene again. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a robotic arm with a carbon fiber texture and
    silver joints extending from the upper right. The robot's gripper is holding a large, shiny steel
    sphere. The background is a wooden parquet floor with a herringbone pattern. The lighting creates
    reflections on the polished floor and the metallic ball.
  init2final_edit_prompt: Edit the given image to show the steel sphere resting on the wooden floor directly
    below the robotic gripper. The robotic gripper should be empty with its fingers open. The ball should
    be positioned on the ground, casting a contact shadow on the floor. Ensure the whiteboard is not present
    in the scene.
  rationale: The prompt specifies that the ball is released and gravity acts on it. A heavy steel sphere
    dropped onto a hardwood floor will fall, bounce, and eventually settle or roll on the floor. The occlusion
    by the whiteboard lasts for 'several seconds', which is sufficient time for the ball to fall from
    the gripper height and settle on the ground. Therefore, in the final frame, the ball must be on the
    floor, and the gripper must be empty. The whiteboard rolls out, so the view is clear again.
