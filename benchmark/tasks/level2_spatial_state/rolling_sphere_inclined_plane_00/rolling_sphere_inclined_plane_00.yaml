prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. Camera remains stationary throughout. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. Camera remains stationary throughout. No zoom, no cut,
    no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a polished steel sphere resting on a weathered wooden beam.
    The beam acts as a ramp, angled diagonally across the frame from the bottom left to the top right.
    Based on the distance to the ground visible in the background, the ramp is inclined upwards towards
    the right. The wood has visible grain and texture. The background features a blurred grassy field
    and a rustic wooden barn structure. The sphere reflects the surrounding environment, including the
    sky and trees.
  init2final_edit_prompt: Edit the given image to move the steel sphere along the wooden beam towards
    the bottom-left corner of the frame. Place the sphere at a position significantly lower down the ramp
    than its starting point, closer to the viewer. Keep the wooden beam, the grassy background, and the
    barn exactly as they are, only changing the position of the sphere.
  rationale: The visual cues indicate the wooden beam is an inclined plane sloping upwards from left to
    right (the right side is higher off the ground). Gravity acts downwards, so a ball rolling 'down'
    the ramp will move towards the lower end, which is the bottom-left of the frame. The camera is stationary,
    so the background and the ramp itself should remain static while the ball translates along the surface
    towards the bottom-left.
