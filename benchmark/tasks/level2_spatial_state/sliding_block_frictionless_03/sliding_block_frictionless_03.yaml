id: sliding_block_frictionless_03
level: 2
category: spatial_kinematics
tags: []
variant_of: sliding_block_frictionless
variation_type: occlusion_method
variation_description: Replaces camera rotation with a large partition wall sliding in front of the camera.
changes:
  occlusion_method: Foreground object blocking
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless, and the block maintains its constant velocity. A large, opaque gray partition wall slides
    from the left into the immediate foreground, completely blocking the view of the scene. The partition
    remains for a moment, then slides back to the left, revealing the original viewpoint. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless, and the block maintains its constant velocity. A large, opaque gray partition wall slides
    from the left into the immediate foreground, completely blocking the view of the scene. The partition
    remains for a moment, then slides back to the left, revealing the original viewpoint. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A reflective cubic metal block sits on a polished sheet of blue-tinted ice.
    To the left of the block, a black mechanical arm with hydraulic pistons is visible, positioned as
    if it has just pushed or released the block. The sun is low on the horizon in the background, casting
    a bright glare and long reflections on the ice. There is a spray of ice particles or water droplets
    in the air around the block and the arm, indicating recent motion.
  init2final_edit_prompt: Edit the given image to position the reflective metal block significantly further
    to the right side of the frame, near the right edge. Maintain the block's orientation and reflective
    properties. Keep the mechanical arm on the left side stationary in its original position. Ensure the
    reflection of the block on the ice surface is moved to align with its new position on the right. The
    background horizon, sky, and lighting should remain unchanged.
  rationale: The video prompt describes a block sliding rapidly to the right on a frictionless surface.
    An occlusion event occurs where a wall blocks the view and then retracts. During the time the view
    is blocked, the block continues its motion to the right due to inertia and lack of friction. Therefore,
    in the final frame (after the wall retracts), the block must be positioned significantly further to
    the right than in the initial frame, while the stationary mechanical arm remains on the left.
  questions:
  - id: block_position_right
    question: Is the metal block positioned further to the right than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the horizontal position of the block's center relative to the frame edges.
  - id: separation_increase
    question: Is the distance between the mechanical arm and the metal block greater than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The block should have moved away from the arm.
  - id: block_past_center
    question: Is the metal block now positioned to the right of the horizontal center of the image?
    answer_type: yes_no
    notes_for_judge: Assuming the initial position was roughly central or left-of-center, the rapid motion
      should carry it past the midline.
  - id: arm_stationary
    question: Is the mechanical arm still visible on the left side of the frame?
    answer_type: yes_no
    notes_for_judge: The arm is a stationary launcher and should not disappear or move significantly.
  - id: reflection_consistency
    question: Is the reflection of the metal block visible on the ice directly beneath its new position?
    answer_type: yes_no
    notes_for_judge: Checks for physical consistency of the moved object.
  - id: motion_direction
    question: Has the metal block moved away from the mechanical arm?
    answer_type: yes_no
    notes_for_judge: The trajectory is to the right, away from the launcher.
  - id: horizon_consistency
    question: Is the horizon line at the same vertical level as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera does not zoom or tilt.
  - id: block_closer_to_right_edge
    question: Is the metal block closer to the right edge of the frame than the left edge?
    answer_type: yes_no
    notes_for_judge: Verifies significant displacement to the right.
