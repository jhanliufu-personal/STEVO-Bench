id: marble_track_loop_02
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_track_loop
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to the lights turning off.
changes:
  occlusion_method: The workshop lights turn off completely, plunging the scene into darkness, then turn
    back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel ball rolls into and through the vertical loop. Its momentum is sufficient to carry
    it through the curve of the manifold. The workshop lights suddenly turn off, making the scene pitch
    black and invisible. After a moment, the lights turn back on, illuminating the scene. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The steel ball rolls into and through the vertical loop. Its momentum is sufficient to carry
    it through the curve of the manifold. The workshop lights suddenly turn off, making the scene pitch
    black and invisible. After a moment, the lights turn back on, illuminating the scene. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a wooden marble run structure on a workbench. A clear, flexible
    plastic track forms a vertical loop. A shiny steel ball is positioned at the bottom of the loop, resting
    on the track. The background shows a workshop environment with a window, tools, and wood shavings.
  init2final_edit_prompt: Edit the given image to move the steel ball from the bottom of the loop to the
    track section on the far right side of the image. The ball should be positioned on the plastic track
    as if it has just exited the loop and rolled to the right. Remove the ball from its original position
    at the bottom of the loop. Ensure the lighting is fully illuminated and matches the brightness of
    the original image.
  rationale: The prompt describes the ball rolling 'through' the loop, which implies it successfully completes
    the vertical loop trajectory. Given the track geometry (entering from the left, looping, and exiting
    to the right), the ball's final position must be on the exit track to the right of the loop structure.
    The lighting temporarily turns off but turns back on for the final state, so the final image should
    be fully illuminated with the ball in its new position.
