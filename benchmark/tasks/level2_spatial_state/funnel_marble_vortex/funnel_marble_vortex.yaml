id: funnel_marble_vortex
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A steel ball sitting on the high outer rim of a large, smooth acrylic vortex funnel.
    The funnel walls curve steeply toward a central hole at the bottom.
  video_WM: The steel ball is given a rapid horizontal nudge along the inner circumference of the funnel's
    rim. The acrylic surface is polished and smooth. The camera rotates right until the funnel completely
    exits the view, then rotates toward the left smoothly at the same rate until the wide upper rim is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The steel ball is set in motion along the inner rim of the smooth funnel. The geometry of
    the funnel and gravity are the active constraints. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, clear acrylic gravity well funnel is centered in the frame. A polished
    steel ball rests on the upper left rim of the funnel. The funnel has a central hole at the bottom.
    The background features large windows looking out onto a brick building and a grassy area, with a
    polished concrete floor inside.
  init2final_edit_prompt: Edit the given image to show the steel ball at a new position inside the acrylic
    funnel, specifically lower down the slope and closer to the central hole than its starting position
    on the rim. Remove the steel ball from its original location on the upper left rim. Preserve the background,
    the funnel structure, and the lighting.
  rationale: The ball is nudged horizontally, initiating a spiraling motion down the gravity well. The
    camera rotates away and then returns, covering a duration of time during which the ball continues
    to move. Physically, the ball must travel downwards towards the center hole due to gravity while maintaining
    angular momentum. Therefore, in the final frame, the ball should be located deeper within the funnel
    (closer to the center hole) and not at its initial resting point on the rim.
