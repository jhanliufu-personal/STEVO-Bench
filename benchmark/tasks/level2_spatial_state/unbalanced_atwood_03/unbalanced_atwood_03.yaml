evaluation:
  init_frame_description: A rustic workshop interior featuring a pulley system with two hanging weights.
    On the left, a large, heavy, rusty iron block labeled '50 KG' is suspended by a thick rope. On the
    right, a smaller rusty iron weight labeled '5 KG' hangs from the same rope system. A gear and winch
    mechanism is situated between them. The background consists of stone walls, hanging chains on the
    left, and a bright window on the right. An anvil sits directly beneath the 50 KG weight.
  init2final_edit_prompt: 'Edit the given image to change the positions of the suspended weights. Move
    the large ''50 KG'' weight on the left downwards so it is positioned significantly lower, closer to
    the anvil. Move the small ''5 KG'' weight on the right upwards so it is positioned significantly higher,
    closer to the overhead pulley. Adjust the lengths of the ropes to correspond to these new positions:
    lengthen the rope segment above the 50 KG weight and shorten the rope segment above the 5 KG weight.
    Ensure the scene is clear and free of any smoke or obstruction.'
  rationale: 'The scenario describes an unbalanced Atwood machine where the mass on the left (50 kg) is
    ten times heavier than the mass on the right (5 kg). Upon releasing the brake, the significantly heavier
    50 kg weight will accelerate downwards due to gravity, while the lighter 5 kg weight will be pulled
    upwards. The smoke occlusion masks the duration of the movement, but the final state must show the
    result of this kinematic evolution: the heavy weight displaced downward and the light weight displaced
    upward.'
