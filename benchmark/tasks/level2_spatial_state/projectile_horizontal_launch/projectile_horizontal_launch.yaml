id: projectile_horizontal_launch
level: 2
category: spatial_kinematics
kinematic_variable: Parabolic trajectory (x, y)
prompts:
  image_gen_prompt: A small spring-loaded cannon mounted on a table. A red ball has just been fired horizontally
    from the muzzle and is mid-air, traveling away from the table.
  video_WM: The red ball is traveling through the air after its horizontal launch. It is moving forward
    and downward under the influence of its initial momentum and gravity. The camera rotates right until
    the ball completely exits the view, then rotates toward the left smoothly at the same rate until the
    cannon on the table is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball travels through the air following its horizontal launch, governed by its initial
    velocity and gravity. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A brass cannon mounted on a wooden carriage sits on a wooden workbench. A red
    ball is in mid-air just to the right of the cannon muzzle, blurring from motion. A puff of white smoke
    is expanding from the muzzle. In the foreground, blueprints and a pencil lie on the table. In the
    background, an open door leads to a garage area with tools.
  init2final_edit_prompt: Edit the given image to remove the red ball and the white smoke cloud from the
    air. Show the background (doorway and garage) clearly where the smoke and ball were previously obscuring
    it. Keep the cannon, wooden carriage, workbench, blueprints, and room interior exactly as they are.
  rationale: The video prompt describes a camera movement that pans away to follow the ball and then returns
    to the initial centered view of the cannon. This sequence implies a duration of time has passed. During
    this interval, the high-velocity projectile (red ball) will have traveled significantly downrange
    (likely exiting the frame or landing in the distance) and the transient muzzle smoke will have dissipated.
    Therefore, the final frame should depict the static environment without the momentary dynamic elements
    of the launch.
