id: yoyo_drop_09
level: 2
category: spatial_kinematics
tags: []
variant_of: yoyo_drop
variation_type: combined
variation_description: Sticky string (slow/no drop) + Lights off occlusion.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Sticky string (high friction).
  expected_outcome_change: Yo-yo descends very slowly or not at all.
prompts:
  init_frame_edit_prompt: Edit the image to show the string looks thick and sticky, covered in a layer
    of glue.
  video_WM: The yo-yo is released. The sticky glue on the string creates high friction against the axle.
    The lights in the room turn off completely, plunging the scene into total darkness. After a duration,
    the lights turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The yo-yo is released. The sticky glue on the string creates high friction against the axle.
    The lights in the room turn off completely, plunging the scene into total darkness. After a duration,
    the lights turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up of a silver metal yo-yo suspended in mid-air by a string inside a
    large industrial workshop. The yo-yo's axle and the string immediately above it are heavily coated
    in a thick, amber-colored sticky substance resembling glue or honey. The background features a concrete
    floor, metal structural pillars, and large windows letting in daylight.
  init2final_edit_prompt: Edit the given image to show the silver yo-yo positioned significantly lower
    in the frame, closer to the concrete floor. Extend the string vertically downwards from the top of
    the image to meet the yo-yo's new lower position. Ensure the scene is fully illuminated with the same
    lighting as the original image, and keep the background elements identical.
  rationale: The prompt describes the release of the yo-yo, which subjects it to gravity. Despite the
    high friction from the glue, the yo-yo will descend during the elapsed time. The sequence involves
    a period of darkness, but the final state occurs after the lights have turned back on. Therefore,
    the final image must show the yo-yo at a lower vertical position within the same illuminated environment.
