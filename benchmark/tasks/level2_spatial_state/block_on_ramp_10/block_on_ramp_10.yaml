id: block_on_ramp_10
level: 2
category: kinematics
tags: []
variant_of: block_on_ramp
variation_type: combined
variation_description: Glued block combined with fog occlusion.
changes:
  occlusion_method: Dense fog fills the room.
  dynamic_conditions: Visible glue fixes the block to the ramp.
  expected_outcome_change: Block stays stationary.
prompts:
  init_frame_edit_prompt: Edit the image to show thick, visible glue oozing out from underneath the wooden
    block, adhering it to the metal ramp.
  video_WM: Single continuous take, no cuts or zoom. The block is resting on a smooth inclined ramp. Thick
    visible glue secures the block to the ramp surface. Suddenly, dense white fog rapidly fills the room,
    completely obscuring the table and ramp. While the scene is hidden in the fog, the physical interaction
    continues naturally. After several seconds, the fog dissipates and clears, revealing the scene again.
  camera_WM: Single continuous take, no cuts or zoom. The block is resting on a smooth inclined ramp.
    Thick visible glue secures the block to the ramp surface. Suddenly, dense white fog rapidly fills
    the room, completely obscuring the table and ramp. While the scene is hidden in the fog, the physical
    interaction continues naturally. After several seconds, the fog dissipates and clears, revealing the
    scene again.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A wooden rectangular block rests on a stainless steel inclined ramp. A pool
    of thick, yellowish glue surrounds the base of the block, adhering it to the metal surface. The ramp
    is positioned on a light wooden table. In the background, a window and laboratory equipment, including
    a fume hood, are visible. A metal clamp is attached to the top edge of the ramp.
  init2final_edit_prompt: Edit the given image to show the wooden block remaining in its exact original
    position on the metal ramp. The block is secured by the glue and must not slide down the incline.
    The scene should appear clear and fully visible, with the block and glue unchanged in location.
  rationale: The prompt explicitly states that thick glue 'secures' the block to the ramp. In a physical
    context, this implies that the adhesive force and static friction are sufficient to counteract the
    component of gravity pulling the block down the incline. Therefore, despite the passage of time during
    the fog occlusion, the block remains in static equilibrium. The final frame should show the block
    in the exact same position as the initial frame, as the 'natural physical interaction' is one of stability.
  questions:
  - id: block_position_static
    question: Is the wooden block in the same position on the ramp as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The block should not have moved down the ramp.
  - id: block_stationary
    question: Has the block remained stationary on the incline?
    answer_type: yes_no
    notes_for_judge: Check for any displacement down the slope.
  - id: ramp_distance_top
    question: Is the distance between the top edge of the ramp and the wooden block unchanged?
    answer_type: yes_no
    notes_for_judge: Compare the visible metal space above the block in both frames.
  - id: block_height
    question: Is the block still at the same vertical height relative to the table as in the starting
      image?
    answer_type: yes_no
    notes_for_judge: The block should not be lower.
  - id: glue_integrity
    question: Is the glue still securing the block in its original location?
    answer_type: yes_no
    notes_for_judge: The glue and block assembly should be at the same spot.
  - id: ramp_space_above
    question: Is the amount of visible ramp surface above the block the same as initially?
    answer_type: yes_no
    notes_for_judge: If the block slid down, there would be more ramp visible above it.
  - id: clamp_position
    question: Is the metal clamp at the top of the ramp still in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: table_visibility
    question: Is the wooden table surface visible and clear?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
