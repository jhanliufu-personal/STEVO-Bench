id: falling_anvil_air
level: 2
category: spatial_kinematics
kinematic_variable: Vertical position (y)
prompts:
  image_gen_prompt: A massive iron anvil has just been dropped from the top of a high crane. It is currently
    mid-air, falling through a clear sky.
  video_WM: The anvil continues its rapid descent toward the ground. Due to its high mass, air resistance
    has negligible effect on its acceleration. The camera rotates right until the anvil completely exits
    the view, then rotates toward the left smoothly at the same rate until the crane hook is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The iron anvil falls through the air, accelerating constantly under the force of gravity.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, rusty metal anvil is positioned in the center of the sky, falling downwards
    with a trail of brown dust and debris behind it. Below the anvil, a yellow construction crane with
    a hanging hook is visible on the left side, set against a distant city skyline and a clear blue sky.
  init2final_edit_prompt: Edit the given image to remove the large falling anvil and its associated dust
    trail from the sky. The final image should show the clear blue sky, the yellow construction crane,
    and the city skyline exactly as they appear in the background of the original image, implying the
    anvil has fallen completely out of the frame.
  rationale: The anvil is in rapid descent. The camera performs a panning maneuver (right, then back left)
    that takes time. During this interval, gravity continues to accelerate the anvil downwards. Since
    the camera returns to its exact initial orientation (centering the crane hook), the anvil will have
    fallen past the original field of view or be significantly lower, leaving the upper sky empty.
