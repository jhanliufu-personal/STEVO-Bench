evaluation:
  init_frame_description: A close-up view of a red, textured ball rolling across a wooden table surface.
    The ball exhibits motion blur, indicating movement towards the right. The table has a visible edge
    on the right side. In the background, a window is visible on the left, and a patterned rug lies on
    the wooden floor beneath the table.
  init2final_edit_prompt: Edit the given image to remove the red ball from the wooden table surface. The
    table surface should appear empty and clear of the object. Maintain the original appearance of the
    wooden texture, the table legs, the rug on the floor, and the window in the background without any
    changes.
  rationale: The ball is initially moving with velocity towards the right edge of the table. The prompt
    specifies that the ball continues rolling, reaches the edge, and falls off due to gravity. An occlusion
    covers the scene for several seconds, which is sufficient time for the ball to fall to the floor and
    likely roll out of the camera's limited field of view or settle on the floor (which is mostly obscured
    in the drop zone). Consequently, in the final frame, the ball should no longer be present on the tabletop.
