id: elevator_cable_snap_04
level: 2
category: spatial_kinematics
tags: []
variant_of: elevator_cable_snap
variation_type: dynamic_condition
variation_description: 'Condition changed: Emergency brakes are engaged, preventing the fall.'
changes:
  occlusion_method: null
  dynamic_conditions: Emergency brakes engaged (high friction)
  expected_outcome_change: Elevator remains stationary or slides very slightly instead of falling.
prompts:
  init_frame_edit_prompt: Edit the image to show heavy mechanical emergency brake calipers clamped tightly
    onto the vertical guide rails on both sides of the elevator car.
  video_WM: The elevator cable has snapped, but the emergency safety brakes have automatically deployed
    and are clamping the guide rails with maximum force to hold the car in place. The camera rotates right
    until the elevator car completely exits the view, then rotates toward the left smoothly at the same
    rate until the camera returns to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The elevator cable has snapped, but the emergency safety brakes have automatically deployed
    and are clamping the guide rails with maximum force to hold the car in place. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A high-angle shot looking down into a multi-story atrium with a glass elevator
    shaft. A metal elevator car is suspended in the center of the shaft. Above the car, there is a heavy
    mechanical assembly with large springs and a thick black cable extending vertically upwards. The elevator
    is flanked by steel guide rails. On the left and right, there are balconies with metal railings. Several
    people are standing on the lower left balcony looking towards the elevator. The floor of the atrium
    is tiled and visible below.
  init2final_edit_prompt: Edit the image to show the thick central cable extending upwards from the elevator
    car as snapped and severed, with the broken ends visible or the cable appearing slack and recoiled,
    while keeping the elevator car exactly in its original vertical position and location within the shaft.
  rationale: The video prompt describes a sequence where the camera pans away and returns to the original
    view. During the occlusion, the elevator cable snaps, but the emergency brakes engage to hold the
    car in place. Therefore, in the final frame (which returns to the original viewpoint), the elevator
    car must be at the exact same vertical height as the initial frame (demonstrating the brakes worked),
    but the central cable should appear broken or severed (demonstrating the snap). The surrounding environment
    and people should remain largely unchanged.
  questions:
  - id: car_height_maintenance
    question: Is the elevator car at the same vertical height as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The car should not have fallen; it should be in the same position relative to the
      background floors/railings.
  - id: cable_state
    question: Does the central vertical cable above the elevator car appear broken, severed, or slack?
    answer_type: yes_no
    notes_for_judge: The cable should no longer look like a taut, continuous line supporting the car.
  - id: car_stationarity
    question: Has the elevator car remained suspended in the shaft rather than falling to the bottom?
    answer_type: yes_no
    notes_for_judge: The car must not be at the bottom of the atrium.
  - id: car_visibility
    question: Is the elevator car still visible in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original view, so the car should be visible.
  - id: relative_position
    question: Is the top of the elevator car still aligned with the same section of the balcony railing
      as in the initial image?
    answer_type: yes_no
    notes_for_judge: Use the balcony railings on the left or right as a reference for the car's height.
  - id: people_presence
    question: Are the people on the balcony still visible in the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
