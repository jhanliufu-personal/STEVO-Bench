id: sliding_block_frictionless
level: 2
category: spatial_kinematics
kinematic_variable: Linear displacement (x)
prompts:
  image_gen_prompt: A smooth metal block sits on a long, polished ice surface. A mechanical arm is seen
    just as it finishes a forceful push, sending the block sliding rapidly to the right.
  video_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless, and the block maintains its constant velocity. The camera rotates right until the block
    completely exits the view, then rotates toward the left smoothly at the same rate until the original
    starting point of the push is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The metal block slides across the frictionless ice at a high, constant velocity. The linear
    motion continues. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
