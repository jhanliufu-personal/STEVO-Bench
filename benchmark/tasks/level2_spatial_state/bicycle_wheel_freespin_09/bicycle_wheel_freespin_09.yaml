id: bicycle_wheel_freespin_09
level: 2
category: spatial_kinematics
tags: []
variant_of: bicycle_wheel_freespin
variation_type: combined
variation_description: Ultra-low friction bearing combined with fog occlusion.
changes:
  occlusion_method: Thick fog fills the room.
  dynamic_conditions: Ceramic bearings (ultra-low friction).
  expected_outcome_change: Wheel barely slows down at all.
prompts:
  init_frame_edit_prompt: Edit the image to make the central hub look shiny, polished chrome, looking
    brand new and high-tech.
  video_WM: The wheel spins on high-performance ceramic racing bearings with ultra-low friction. Air resistance
    is the only significant force opposing the motion. No external torque is applied. Thick industrial
    fog rapidly fills the workshop, completely obscuring the wheel and stand in a dense white haze. The
    fog hangs in the air for several seconds. Then the fog clears rapidly, restoring visibility to the
    original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The wheel spins on high-performance ceramic racing bearings with ultra-low friction. Air
    resistance is the only significant force opposing the motion. No external torque is applied. Thick
    industrial fog rapidly fills the workshop, completely obscuring the wheel and stand in a dense white
    haze. The fog hangs in the air for several seconds. Then the fog clears rapidly, restoring visibility
    to the original viewpoint. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A bicycle wheel with a black tire and silver rim is mounted horizontally on
    a metal stand in a workshop. The wheel is spinning rapidly, causing the spokes to appear as a translucent
    blur. The background features a workbench, tools, and industrial lighting.
  init2final_edit_prompt: Edit the given image to show the bicycle wheel still spinning on the stand in
    the workshop. Ensure the air is completely clear of any fog or haze. The wheel should remain in its
    original horizontal position with the spokes blurred from rotation.
  rationale: 'The wheel is mounted on high-performance bearings with negligible friction, and the occlusion
    lasts only a few seconds. Due to the conservation of angular momentum and lack of significant braking
    forces, the wheel will continue spinning throughout the foggy period. Since the stand is fixed, the
    wheel''s spatial position remains unchanged. When the fog clears, the final state should be visually
    identical to the initial state: the wheel spinning in place with motion blur.'
  questions:
  - id: wheel_visible
    question: Is the bicycle wheel clearly visible in the frame?
    answer_type: yes_no
    notes_for_judge: The wheel should not be missing or obscured.
  - id: wheel_spinning
    question: Does the wheel appear to be spinning (e.g., are the spokes blurred)?
    answer_type: yes_no
    notes_for_judge: The spokes should not be sharp/static; motion blur indicates continued rotation.
  - id: position_maintained
    question: Is the wheel still mounted on the metal stand?
    answer_type: yes_no
    notes_for_judge: The wheel should not have fallen off or moved away from the stand.
  - id: orientation_horizontal
    question: Is the wheel still oriented horizontally?
    answer_type: yes_no
    notes_for_judge: The angle of the wheel should match the initial frame.
  - id: location_static
    question: Is the wheel in the same position relative to the background as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The stand and wheel should not have translated spatially.
  - id: fog_cleared
    question: Is the view free of thick white fog?
    answer_type: yes_no
    notes_for_judge: The scene should be clear, not obscured.
  - id: tire_color
    question: Is the tire on the wheel still black?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: rim_color
    question: Is the rim of the wheel still silver?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
