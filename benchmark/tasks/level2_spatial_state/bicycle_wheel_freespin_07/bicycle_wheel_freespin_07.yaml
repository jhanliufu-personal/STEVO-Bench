id: bicycle_wheel_freespin_07
level: 2
category: spatial_kinematics
tags: []
variant_of: bicycle_wheel_freespin
variation_type: combined
variation_description: High friction bearing combined with lights-off occlusion.
changes:
  occlusion_method: Lights turn off completely.
  dynamic_conditions: Rusted bearing (high friction).
  expected_outcome_change: Wheel stops quickly in the dark.
prompts:
  init_frame_edit_prompt: Edit the image to make the central metal hub and axle look heavily rusted, corroded,
    and dirty.
  video_WM: The wheel spins on its axle bearing, which is heavily rusted and seized, creating significant
    internal friction. Air resistance acts on the rotating spokes. No external torque is applied. Suddenly,
    the overhead lights in the workshop turn off completely, plunging the scene into total darkness. The
    darkness persists for several seconds while the wheel remains unseen. Then the lights turn back on,
    illuminating the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The wheel spins on its axle bearing, which is heavily rusted and seized, creating significant
    internal friction. Air resistance acts on the rotating spokes. No external torque is applied. Suddenly,
    the overhead lights in the workshop turn off completely, plunging the scene into total darkness. The
    darkness persists for several seconds while the wheel remains unseen. Then the lights turn back on,
    illuminating the original viewpoint. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a bicycle wheel mounted horizontally
    on a metal stand in a workshop. The wheel is spinning rapidly, creating strong radial motion blur
    that makes the spokes appear as a translucent blur. The central hub is heavily rusted and textured.
    The background features a workbench with a blue vice and various tools, illuminated by bright overhead
    strip lights.
  init2final_edit_prompt: Edit the given image to show the bicycle wheel spinning much slower or completely
    stopped. Remove the radial motion blur from the spokes and tire, rendering the individual spokes as
    sharp, distinct, and well-defined lines. Keep the rusted hub, the metal stand, and the workshop background
    exactly unchanged. Ensure the lighting is bright and matches the initial state.
  rationale: The prompt establishes that the wheel is spinning on a rusted, seized bearing, which introduces
    significant friction. During the 'several seconds' of darkness, this friction, combined with air resistance
    and the lack of external torque, will cause the wheel to decelerate rapidly. When the lights turn
    back on, the wheel should have lost most or all of its angular momentum, resulting in a visual state
    where motion blur is drastically reduced or eliminated, and individual spokes are clearly visible.
