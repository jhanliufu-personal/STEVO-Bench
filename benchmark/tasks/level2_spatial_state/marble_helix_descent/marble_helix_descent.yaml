id: marble_helix_descent
level: 2
category: spatial_kinematics
kinematic_variable: Vertical position along helical constraint
tags: []
prompts:
  image_gen_prompt: A clear acrylic helical spiral track stands vertically on a table. The helix has multiple turns descending from top to bottom. A glass marble sits at the very top of the spiral track at the entrance. The marble is stationary and positioned to enter the helical groove.
  video_WM: The marble is released from the top entrance of the helical track. The marble is free to move along the grooved helical path. The track provides lateral constraint but allows motion along the spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic. The track descends vertically through multiple spiral turns from top to bottom. The camera rotates right at constant speed until the helical track completely exits the view to the right. The camera continues rotating right for several seconds while the marble remains off-screen in the track. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the helical track back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The marble is released from the top entrance of the helical track. The marble is free to move along the grooved helical path. The track provides lateral constraint but allows motion along the spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic. The track descends vertically through multiple spiral turns from top to bottom during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
