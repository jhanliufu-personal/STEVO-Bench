id: projectile_horizontal_launch_10
level: 2
category: spatial_kinematics
tags: []
variant_of: projectile_horizontal_launch
variation_type: combined
variation_description: Combines the obstacle condition with a person blocking the view.
changes:
  occlusion_method: A person walks in front of the camera blocking the view
  dynamic_conditions: A vertical wooden board is placed in the projectile's path
  expected_outcome_change: Ball hits obstacle while view is blocked by person
prompts:
  init_frame_edit_prompt: Edit the image to place a large vertical sheet of plywood standing about 3 feet
    in front of the cannon muzzle, directly in the path of the red ball.
  video_WM: The red ball is traveling through the air after its horizontal launch, heading directly toward
    a vertical wooden board. A person wearing a dark shirt walks directly in front of the camera, completely
    blocking the view of the workbench and cannon. The person pauses briefly then walks out of frame,
    revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The red ball is traveling through the air after its horizontal launch, heading directly toward
    a vertical wooden board. A person wearing a dark shirt walks directly in front of the camera, completely
    blocking the view of the workbench and cannon. The person pauses briefly then walks out of frame,
    revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene showing a brass spring-loaded cannon on a wooden workbench
    on the left. To the right, a red ball is impacting a vertical plywood board, creating a burst of white
    smoke and flying wood splinters. The ball is currently in contact with the board, suspended above
    the workbench surface.
  init2final_edit_prompt: Edit the given image to show the scene after the impact event has concluded.
    Remove the cloud of white smoke and the flying wood splinters from the air. Place the red ball resting
    on the wooden workbench surface, located below the impact point on the plywood board. Ensure the plywood
    board retains the visual damage at the impact site. Keep the cannon and the background workshop environment
    exactly as they are.
  rationale: 'The initial frame captures the exact moment of impact. The video prompt describes a sequence
    where a person temporarily blocks the view and then leaves, implying a passage of time. During this
    occlusion, the physical dynamics of the impact resolve: the smoke dissipates, the splinters settle,
    and the red ball, having lost its forward momentum against the board, falls due to gravity and settles
    on the workbench. The final state reveals this static aftermath.'
  questions:
  - id: ball_height_change
    question: Is the red ball at a lower vertical position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should have fallen from the impact point to the table/floor due to gravity.
  - id: ball_resting_surface
    question: Is the red ball resting on the wooden workbench surface?
    answer_type: yes_no
    notes_for_judge: The ball should be on the table, not floating in the air or stuck on the board.
  - id: smoke_dissipation
    question: Has the white smoke from the impact dissipated?
    answer_type: yes_no
    notes_for_judge: The air should be clear of the impact smoke.
  - id: debris_settled
    question: Are the flying wood splinters no longer visible in the air?
    answer_type: yes_no
    notes_for_judge: Debris should have settled.
  - id: cannon_invariant
    question: Is the cannon in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The cannon should not have moved.
  - id: board_damage_visible
    question: Is the damage to the plywood board still visible?
    answer_type: yes_no
    notes_for_judge: The impact site should show a hole or dent.
  - id: object_permanence
    question: Is the red ball visible in the frame?
    answer_type: yes_no
    notes_for_judge: The ball should not vanish; it should be visible on the table.
