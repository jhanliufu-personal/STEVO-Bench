id: treadmill_projectile
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A treadmill is running at a constant high speed toward the left. A small robotic launcher
    is mounted on the moving belt, aimed straight up at a 90-degree angle.
  video_WM: The robotic launcher fires a tennis ball vertically into the air while the treadmill belt
    continues its constant leftward motion. The air in the room is still. The camera rotates right until
    the treadmill completely exits the view, then rotates toward the left smoothly at the same rate until
    the launcher is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is launched vertically relative to the treadmill belt, which is moving horizontally
    at a constant velocity. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a robotic testing rig mounted on a treadmill.
    The robot features a vertical metal tube (launcher), aluminum extrusion framing, motors with exposed
    wiring, and small wheels. The robot and the industrial background (concrete walls, safety cages, yellow
    posts) are in sharp focus, appearing stationary. The black textured treadmill belt beneath the robot
    exhibits motion blur, indicating it is moving rapidly leftward while the robot maintains its position.
  init2final_edit_prompt: Edit the given image to show a yellow tennis ball suspended in the air, positioned
    vertically directly above the metal tube of the robotic launcher. The ball should be clearly visible
    and separated from the tube, appearing as if in mid-flight. Keep the robotic launcher and the background
    elements exactly in their original positions.
  rationale: The initial image shows a sharp robot and background with a blurred treadmill belt, indicating
    the robot is maintaining a stationary position relative to the room while the belt moves beneath it.
    When the ball is fired vertically from this stationary platform, it travels straight up and down relative
    to the camera. Although the camera rotates away and back, the final instruction specifies the launcher
    is re-centered. Since the launcher has not moved relative to the room, the camera returns to the original
    viewing angle. The only change in the state is the presence of the fired tennis ball in the air above
    the mechanism.
