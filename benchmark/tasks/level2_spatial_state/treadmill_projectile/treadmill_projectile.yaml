id: treadmill_projectile
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A treadmill is running at a constant high speed toward the left. A small robotic launcher
    is mounted on the moving belt, aimed straight up at a 90-degree angle.
  video_WM: The robotic launcher fires a tennis ball vertically into the air while the treadmill belt
    continues its constant leftward motion. The air in the room is still. The camera rotates right until
    the treadmill completely exits the view, then rotates toward the left smoothly at the same rate until
    the launcher is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is launched vertically relative to the treadmill belt, which is moving horizontally
    at a constant velocity. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
