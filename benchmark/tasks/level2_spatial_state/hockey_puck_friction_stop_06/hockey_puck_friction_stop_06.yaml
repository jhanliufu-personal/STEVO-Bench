id: hockey_puck_friction_stop_06
level: 2
category: spatial_kinematics
tags: []
variant_of: hockey_puck_friction_stop
variation_type: dynamic_condition
variation_description: Surface changed to concrete covered in slippery oil.
changes:
  occlusion_method: null
  dynamic_conditions: Surface coated in oil, reducing friction.
  expected_outcome_change: Puck slides further than on dry concrete.
prompts:
  init_frame_edit_prompt: Edit the image to show the concrete surface covered in a slick, reflective layer
    of oil.
  video_WM: The puck slides across the concrete surface which is coated in a layer of slippery oil. The
    oil significantly reduces the coefficient of friction compared to dry concrete. The puck is standard
    rubber. No external forces are applied. The camera rotates right at constant speed until the puck
    completely exits the view to the right. The camera continues rotating right for several seconds. Then
    the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The puck slides across the concrete surface which is coated in a layer of slippery oil. The
    oil significantly reduces the coefficient of friction compared to dry concrete. The puck is standard
    rubber. No external forces are applied. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A black, cylindrical hockey puck positioned centrally on a wet, dark, textured
    concrete surface. A dynamic splash of water or oil surrounds the puck, with droplets frozen in mid-air,
    indicating impact or rapid motion. The surface is highly reflective, showing blurred reflections of
    the background environment.
  init2final_edit_prompt: Edit the given image to completely remove the black hockey puck and the surrounding
    water splash. Fill the vacated area with the dark, wet, oily concrete texture and reflections consistent
    with the rest of the surface. The final image should depict the empty floor as if the object was never
    there, maintaining the original lighting and background details.
  rationale: The puck is sliding on a low-friction oily surface. The prompt states that the puck exits
    the view to the right while the camera is also rotating right. This implies the puck has a high rightward
    velocity relative to the ground (faster than the camera's panning speed). The camera continues to
    rotate right, then reverses direction to return to the original viewpoint. Due to the low friction
    and lack of opposing forces, the puck continues sliding to the right and moves far beyond the boundaries
    of the initial frame. Therefore, when the camera returns to the starting position, the puck is no
    longer visible.
