id: sliding_block_frictionless_00
level: 2
category: spatial_kinematics
tags: []
variant_of: sliding_block_frictionless
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A black robotic arm extends from the left side of the frame, positioning a large,
    reflective silver cube on a sheet of polished ice. Ice particles and spray are visible at the base
    of the cube, suggesting motion or impact. The background shows a flat, frozen horizon under a bright
    sky with sun glare reflecting off the ice.
  init2final_edit_prompt: Edit the given image to show the silver cube positioned significantly further
    to the right side of the frame. Create a large area of empty ice between the robotic arm and the cube
    to indicate separation. Ensure the reflection of the cube on the ice shifts to match its new position
    on the right. Keep the robotic arm stationary on the left side and maintain the background horizon
    and lighting.
  rationale: The prompt specifies that the block is sliding rapidly to the right on a nearly frictionless
    surface with a stationary camera. Physically, this implies the block will conserve its momentum and
    translate horizontally across the image plane away from the robotic arm. The final frame must depict
    the block at a new location to the right, having separated from the arm, while the background and
    stationary elements remain unchanged.
