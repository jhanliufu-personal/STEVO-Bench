id: rolling_sphere_inclined_plane_02
level: 2
category: spatial_kinematics
tags: []
variant_of: rolling_sphere_inclined_plane
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to extreme camera zoom out.
changes:
  occlusion_method: Camera zooms out until details are lost, then zooms back in.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. The camera zooms out rapidly until the ramp becomes
    a tiny, indistinguishable speck in the distant landscape. Then the camera zooms back in to the exact
    original framing. No cut, no scene change. STOP.
  camera_WM: The steel marble is rolling down the smooth inclined ramp. Gravity is accelerating the marble's
    descent, and there is no visible obstruction. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A shiny steel sphere resting on a weathered wooden plank that serves as a ramp.
    The plank is inclined, sloping upwards from the bottom-left foreground towards the top-right background.
    The sphere reflects the surrounding grassy field, sky, and a person. A red barn is visible in the
    background.
  init2final_edit_prompt: Edit the given image to move the steel sphere to a new position significantly
    further down the wooden ramp, towards the bottom-left corner. The sphere should be located closer
    to the foreground edge of the plank than it was originally.
  rationale: The wooden ramp is inclined with the higher end in the background (top-right) and the lower
    end in the foreground (bottom-left). Gravity will cause the sphere to accelerate down the ramp towards
    the camera. The video prompt describes a sequence where the camera zooms out and back in, implying
    a passage of time during which the sphere rolls. Upon returning to the original framing, the sphere
    must be positioned further down the slope (closer to the bottom-left) than in the initial frame.
