variation_description: 'Condition changed: The cable does not snap and holds the car firmly.'
changes:
  occlusion_method: null
  dynamic_conditions: Cable is intact and secure
  expected_outcome_change: Elevator does not move (static).
prompts:
  init_frame_edit_prompt: Edit the image to emphasize the steel cable above the elevator car is thick,
    taut, and securely attached, looking brand new and unbroken.
  video_WM: The elevator car is securely supported by a reinforced steel cable which is under normal tension.
    The motor is locked and the car is stationary. The camera rotates right until the elevator car completely
    exits the view, then rotates toward the left smoothly at the same rate until the camera returns to
    the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The elevator car is securely supported by a reinforced steel cable which is under normal
    tension. The motor is locked and the car is stationary. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A high-angle shot looking down into a modern elevator shaft. A thick, braided
    steel cable hangs vertically in the center, terminating in a heavy metal shackle and thimble assembly
    that connects to the top of the elevator car or counterweight frame. The cable is taut. The elevator
    structure is surrounded by vertical steel beams and glass panels. Through the glass, a multi-story
    atrium is visible with railings, windows, and a tiled floor below where a few people are standing.
  init2final_edit_prompt: Edit the given image to show the elevator car and central steel cable in their
    exact original positions. The cable must appear taut, vertical, and securely connected to the elevator
    car via the metal shackle. The elevator car must be at the same vertical level as in the source image,
    with no signs of damage, displacement, or cable failure. The background architecture and perspective
    should match the initial view.
  rationale: The video prompt explicitly states that the elevator car is stationary, the motor is locked,
    and the cable is under normal tension. Although the camera rotates away to occlude the elevator and
    then returns to the original viewpoint, the physical state of the elevator system remains unchanged.
    Therefore, the final frame should demonstrate object permanence and stationarity, showing the elevator
    and cable in the exact same position and condition as the initial frame.
