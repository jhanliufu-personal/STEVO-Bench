evaluation:
  init_frame_description: A black, marbled bowling ball is positioned in the center foreground of a polished
    wooden bowling lane. The lane features vertical wood planks leading towards a set of white bowling
    pins in the background. Gutters are visible on either side of the lane. The lighting creates strong
    reflections on the oiled lane surface.
  init2final_edit_prompt: Edit the given image to move the bowling ball further down the lane, significantly
    closer to the pins in the background. Scale the bowling ball down to appear smaller, consistent with
    perspective as it recedes from the viewer. Shift the ball's position higher in the frame and further
    from the bottom edge. Ensure the reflection of the ball on the lane surface moves along with the ball
    to its new location.
  rationale: The bowling ball has initial forward velocity and is rolling on a low-friction surface. Due
    to inertia and the lack of significant opposing forces, the ball will continue to travel down the
    lane away from the camera. Visually, this results in the ball moving towards the vanishing point (the
    pins), appearing smaller due to perspective, and occupying a position higher in the image frame.
