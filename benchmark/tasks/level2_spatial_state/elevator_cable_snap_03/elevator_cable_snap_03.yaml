prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The elevator car is no longer supported by the cable. The vertical shaft is clear of obstructions.
    A large, opaque metal maintenance shutter slides horizontally across the field of view, completely
    blocking the sight of the shaft and elevator. The shutter remains closed for a moment, then slides
    back open to reveal the shaft. No zoom, no cut, no scene change. STOP.
  camera_WM: The elevator car is no longer supported by the cable. The vertical shaft is clear of obstructions.
    A large, opaque metal maintenance shutter slides horizontally across the field of view, completely
    blocking the sight of the shaft and elevator. The shutter remains closed for a moment, then slides
    back open to reveal the shaft. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A high-angle, wide shot looking down into a multi-story atrium with a central
    glass elevator shaft. A glass elevator car is suspended in the middle of the frame by cables. The
    shaft is framed by vertical metal beams and large arched windows. On the left and right sides, there
    are tiled walkways with metal railings. Several people are standing on the walkways, looking towards
    the center or talking. The lighting is natural, coming from the large windows.
  init2final_edit_prompt: Edit the given image to show the elevator car has fallen downwards. Remove the
    elevator car from its original central position and place it significantly lower in the shaft, near
    the bottom edge of the frame, or remove it entirely to imply it has fallen out of view. Ensure the
    background windows and structural beams are visible in the space where the elevator car was originally
    located. Keep the surrounding walkways, railings, and people unchanged.
  rationale: The prompt describes a sequence where the elevator loses support and falls under gravity.
    A shutter temporarily blocks the view, covering the motion. When the shutter opens, the elevator must
    have displaced downwards due to the fall. Therefore, in the final frame, the elevator should be significantly
    lower in the shaft or completely out of the frame (having fallen past the view), leaving its original
    position empty. The camera is static, so the background and observers should remain consistent.
