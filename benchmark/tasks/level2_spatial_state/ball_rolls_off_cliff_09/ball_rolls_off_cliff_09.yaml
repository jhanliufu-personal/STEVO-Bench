  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of a red ball rolling on a rustic wooden table. The ball exhibits
    significant horizontal motion blur, with the solid part of the ball on the left and a faint trail
    on the right, indicating movement towards the left. The left edge of the table is visible nearby,
    and a window is seen in the background on the left.
  init2final_edit_prompt: Edit the given image to completely remove the red ball and its motion blur.
    Fill the area where the ball was with the existing wooden table texture, ensuring the grain and lighting
    match the surrounding surface. The final image should show an empty table surface. Do not alter the
    window or the background.
  rationale: The initial image shows the ball with motion blur indicating velocity to the left (towards
    the visible table edge). Given the ball's proximity to the edge and the instruction that it continues
    rolling for several seconds, the physical outcome is that the ball rolls off the table and falls out
    of the camera's view. The prompt's mention of 'moving away from the table edge' is interpreted in
    the context of the 'rolls to the left' instruction and visual momentum, implying it moves off the
    edge (away from the table surface). Therefore, the final state is the empty table.
