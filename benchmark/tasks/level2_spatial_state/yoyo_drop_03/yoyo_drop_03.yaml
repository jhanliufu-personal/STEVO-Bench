id: yoyo_drop_03
level: 2
category: spatial_kinematics
tags: []
variant_of: yoyo_drop
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to camera zooming out.
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The yo-yo is released from the hand. The end of the string remains fixed in the air. The yo-yo
    is free to move toward the floor. The camera zooms out rapidly until the yo-yo and hand are too small
    to distinguish details. The camera holds this distant view, then zooms back in to the original framing.
    No cut, no scene change. STOP.
  camera_WM: The yo-yo is released from the hand. The end of the string remains fixed in the air. The
    yo-yo is free to move toward the floor. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up, eye-level shot of a silver metallic yo-yo suspended in mid-air.
    The yo-yo is wound with white string. At the top center of the frame, fingers are visible holding
    the string. The background is a blurred industrial workshop or garage with a concrete floor and metal
    walls.
  init2final_edit_prompt: Edit the given image to show the silver yo-yo positioned significantly lower
    in the frame than its original position. Create a visible vertical gap between the fingers at the
    top and the yo-yo below. Render a taut white string extending vertically from the fingers down to
    the yo-yo. Keep the background, lighting, and camera framing identical to the original image.
  rationale: The video prompt describes the yo-yo being released and falling under gravity. While the
    camera performs a zoom-out and zoom-in maneuver, time passes, allowing the yo-yo to descend. When
    the camera returns to the original framing (position and angle), the yo-yo must be physically lower
    than it was at the start due to the fall. The string, which is fixed at the top, will have unwound,
    creating a longer visible segment connecting the hand to the yo-yo.
