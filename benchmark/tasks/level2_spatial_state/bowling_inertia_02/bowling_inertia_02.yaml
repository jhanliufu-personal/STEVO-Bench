    camera from right to left, completely blocking the view of the lane with their back. Once they have
    passed, the view of the lane is clear again. No zoom, no cut, no scene change. STOP.
  camera_WM: The bowling ball is in motion on the polished lane. The surface is treated with oil and offers
    minimal rolling resistance. A person wearing a bowling shirt walks slowly directly in front of the
    camera from right to left, completely blocking the view of the lane with their back. Once they have
    passed, the view of the lane is clear again. No zoom, no cut, no scene change. STOP.
