  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, low-angle view of a black marbled bowling ball centered on a polished
    wooden bowling lane. The lane features perspective lines converging toward a set of white bowling
    pins in the background. Gutters run along both sides of the lane. Overhead lights reflect brightly
    off the oiled surface of the wood.
  init2final_edit_prompt: Edit the given image to show the black bowling ball positioned significantly
    further down the lane, closer to the pins in the background. The ball should appear smaller and higher
    in the frame due to perspective. Ensure the lane is empty of any people or obstructions.
  rationale: The video prompt establishes that the ball is in motion on a low-friction surface. While
    the view is temporarily occluded by a person walking past, the ball continues to travel forward due
    to inertia. By the time the person clears the frame, the ball must have moved significantly further
    away from the camera (down the lane) compared to its starting position. The camera remains static,
    so the background environment remains stable.
