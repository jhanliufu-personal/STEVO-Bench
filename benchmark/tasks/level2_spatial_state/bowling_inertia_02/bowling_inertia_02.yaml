id: bowling_inertia_02
level: 2
category: spatial_kinematics
tags: []
variant_of: bowling_inertia
variation_type: occlusion_method
variation_description: A person walks in front of the camera, blocking the view.
changes:
  occlusion_method: Object blocking (person walking in foreground)
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The bowling ball is in motion on the polished lane. The surface is treated with oil and offers
    minimal rolling resistance. A person wearing a bowling shirt walks slowly directly in front of the
    camera from right to left, completely blocking the view of the lane with their back. Once they have
    passed, the view of the lane is clear again. No zoom, no cut, no scene change. STOP.
  camera_WM: The bowling ball is in motion on the polished lane. The surface is treated with oil and offers
    minimal rolling resistance. A person wearing a bowling shirt walks slowly directly in front of the
    camera from right to left, completely blocking the view of the lane with their back. Once they have
    passed, the view of the lane is clear again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, low-angle view of a black marbled bowling ball centered on a polished
    wooden bowling lane. The lane features perspective lines converging toward a set of white bowling
    pins in the background. Gutters run along both sides of the lane. Overhead lights reflect brightly
    off the oiled surface of the wood.
  init2final_edit_prompt: Edit the given image to show the black bowling ball positioned significantly
    further down the lane, closer to the pins in the background. The ball should appear smaller and higher
    in the frame due to perspective. Ensure the lane is empty of any people or obstructions.
  rationale: The video prompt establishes that the ball is in motion on a low-friction surface. While
    the view is temporarily occluded by a person walking past, the ball continues to travel forward due
    to inertia. By the time the person clears the frame, the ball must have moved significantly further
    away from the camera (down the lane) compared to its starting position. The camera remains static,
    so the background environment remains stable.
  questions:
  - id: ball_distance_01
    question: Is the bowling ball closer to the pins than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The ball should have moved away from the camera, towards the background.
  - id: ball_size_perspective_01
    question: Does the bowling ball appear smaller in the frame compared to the initial image?
    answer_type: yes_no
    notes_for_judge: Due to perspective, moving further away makes the object appear smaller.
  - id: ball_vertical_position_01
    question: Is the bowling ball positioned higher in the image frame than it was initially?
    answer_type: yes_no
    notes_for_judge: On a flat plane extending into the distance, moving away corresponds to moving up
      in the 2D image plane.
  - id: occlusion_cleared_01
    question: Is the view of the bowling lane clear of any people?
    answer_type: yes_no
    notes_for_judge: The prompt states the person walks past and the view becomes clear again.
  - id: lane_consistency_01
    question: Are the gutters and lane markings still visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change, only the ball's position.
  - id: ball_motion_01
    question: Has the bowling ball moved from its initial starting position?
    answer_type: yes_no
    notes_for_judge: It should not be in the exact same spot.
