id: torsional_oscillation
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A flat metal disk is suspended horizontally by a thin vertical wire. The disk has
    been twisted 90 degrees, coiling the wire.
  video_WM: The disk is released from its twisted position. The wire provides a restorative torque proportional
    to the twist. The camera rotates right until the disk completely exits the view, then rotates toward
    the left smoothly at the same rate until the top of the wire is back in the center of view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The disk is released from a state of rotational tension in the wire. The torsional constant
    of the wire is the only driver. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a circular brass disk suspended horizontally by
    a thin vertical steel cable in a workshop. A thicker wire is spiraled loosely around the central suspension
    cable, indicating a twisted state. The disk has some tarnish and surface imperfections on its rim.
    In the background, out of focus, is a wooden workshop interior with a window on the left and tools
    on a workbench below.
  init2final_edit_prompt: Edit the given image to show the suspended brass disk and the spiral wire rotated
    to a different angle around the vertical axis. The texture details on the rim of the disk should be
    shifted along the circumference to reflect this rotation. Ensure the background, lighting, and camera
    framing are identical to the original image.
  rationale: The scene depicts a torsional pendulum. Upon release, the restorative torque causes the disk
    to rotate around the vertical axis (unwinding or oscillating). The camera pans away (right) and then
    returns to the exact starting position (left). Therefore, the final frame should show the same background
    and camera angle as the initial frame, but the suspended object (disk and spiral wire) must be in
    a different rotational orientation due to the physical motion that occurred during the camera's absence.
