id: bicycle_wheel_freespin_04
level: 2
category: spatial_kinematics
tags: []
variant_of: bicycle_wheel_freespin
variation_type: dynamic_condition
variation_description: High friction condition due to rusted bearings.
changes:
  occlusion_method: null
  dynamic_conditions: Bearing is rusted and seized (high friction).
  expected_outcome_change: Wheel decelerates much faster, likely stopping.
prompts:
  init_frame_edit_prompt: Edit the image to make the central metal hub and axle look heavily rusted, corroded,
    and dirty, implying old age and poor maintenance.
  video_WM: The wheel spins on its axle bearing, which is heavily rusted and seized, creating significant
    internal friction. Air resistance acts on the rotating spokes. No external torque is applied to the
    wheel. The camera rotates right at constant speed until the wheel completely exits the view to the
    right. The camera continues rotating right for several seconds while the wheel remains off-screen.
    Then the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The wheel spins on its axle bearing, which is heavily rusted and seized, creating significant
    internal friction. Air resistance acts on the rotating spokes. No external torque is applied to the
    wheel. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A bicycle wheel with a black tire and silver rim mounted horizontally on a metal
    truing stand. The central axle is a vertical threaded rod, heavily rusted, held by a square metal
    arm. The background is a workshop with a workbench, tools, and overhead lights.
  init2final_edit_prompt: Edit the given image to show the bicycle wheel rotated to a new random angle
    around its central axis. The spokes, rim, and hub flange must be in a different rotational orientation
    compared to the original. The central vertical rusted axle, the metal support arm, and the background
    must remain exactly unchanged. The wheel should appear sharp and stationary.
  rationale: The video begins with the bicycle wheel spinning, but the prompt specifies the bearing is
    rusted and seized, creating significant friction. As the camera pans away, the wheel is occluded for
    several seconds. During this time, the internal friction and air resistance act to rapidly decelerate
    the wheel, likely bringing it to a complete stop. When the camera returns to the original viewpoint,
    the wheel should be in the same spatial position on the stand but at a different rotational angle
    due to the motion that occurred before stopping. The stationary components, such as the rusted axle
    and support arm, must remain unchanged.
