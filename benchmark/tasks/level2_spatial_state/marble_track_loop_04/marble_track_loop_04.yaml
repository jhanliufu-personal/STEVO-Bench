id: marble_track_loop_04
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_track_loop
variation_type: dynamic_condition
variation_description: The ball is stationary at the bottom of the loop instead of rolling with momentum.
changes:
  occlusion_method: null
  dynamic_conditions: Ball is stationary at the bottom of the loop, lacking momentum.
  expected_outcome_change: The ball remains at the bottom; it does not travel through the loop.
prompts:
  init_frame_edit_prompt: Edit the image so the steel ball is resting stationary at the very bottom of
    the loop track, rather than rolling into it.
  video_WM: A steel ball rests stationary at the bottom of the vertical loop. Gravity holds it in place
    at the lowest point of the curve. The camera rotates right until the loop completely exits the view,
    then rotates toward the left smoothly at the same rate until the loop entrance is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A steel ball rests stationary at the bottom of the vertical loop. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a homemade wooden marble run featuring a clear plastic vertical
    loop track. A shiny steel ball is resting stationary at the absolute bottom of the loop. The track
    is mounted on plywood, and the background shows a workshop environment with a workbench, tools, and
    a window.
  init2final_edit_prompt: Edit the given image to show the steel ball remaining stationary at the bottom
    of the clear plastic loop track, maintaining the exact same position and framing as the original view.
  rationale: The prompt establishes that the steel ball is stationary at the bottom of the loop, held
    by gravity in a stable equilibrium. The camera rotates away and then returns to the original viewpoint.
    Since no external forces or mechanisms are described that would impart energy to the ball, it must
    remain in its resting position at the bottom of the loop when the camera returns. The final frame
    should be visually identical to the initial frame.
