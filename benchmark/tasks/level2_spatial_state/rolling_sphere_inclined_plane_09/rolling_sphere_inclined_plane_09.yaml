id: rolling_sphere_inclined_plane_09
level: 2
category: spatial_kinematics
tags: []
variant_of: rolling_sphere_inclined_plane
variation_type: combined
variation_description: High friction surface combined with a tarp blowing over the camera.
changes:
  occlusion_method: A large tarp blows over the scene.
  dynamic_conditions: Ramp surface is shag carpet (high friction).
  expected_outcome_change: The marble rolls much slower or not at all.
prompts:
  init_frame_edit_prompt: Edit the image to change the ramp surface from smooth wood to shaggy, high-friction
    carpet.
  video_WM: The steel marble rests on a ramp covered in thick, high-friction shag carpet. The rough texture
    interacts with the marble's surface. A large opaque tarp blows into the frame, completely covering
    the view of the ramp. After a moment, the wind blows the tarp away, revealing the scene again. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The steel marble rests on a ramp covered in thick, high-friction shag carpet. The rough texture
    interacts with the marble's surface. A large opaque tarp blows into the frame, completely covering
    the view of the ramp. After a moment, the wind blows the tarp away, revealing the scene again. No
    zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A shiny, reflective steel sphere sits on a wooden ramp covered in beige shag
    carpet. The ramp is inclined, sloping downwards from the right side of the frame to the left. The
    background features a rural landscape with green grass, trees, and a wooden barn in the distance.
  init2final_edit_prompt: Edit the given image to show the steel sphere positioned further down the ramp,
    towards the bottom left of the frame. The sphere should be located significantly to the left and lower
    than its original position, consistent with having rolled down the incline. Ensure the background,
    lighting, and the texture of the carpeted ramp remain unchanged. Do not include any tarp or obstruction.
  rationale: The sphere is placed on a steep inclined plane. Although the shag carpet provides friction,
    the steep angle of the ramp means gravity will overcome static friction, causing the sphere to roll
    downwards (to the left) during the time the view is occluded by the tarp. When the tarp blows away,
    the sphere should be observed at a new position further down the slope.
  questions:
  - id: position_change_check
    question: Is the steel sphere at a different position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The sphere should have moved from its starting spot.
  - id: motion_direction_left
    question: Has the steel sphere moved to the left of its initial starting point?
    answer_type: yes_no
    notes_for_judge: The ramp slopes down to the left, so motion must be in that direction.
  - id: motion_direction_down
    question: Is the steel sphere positioned lower in the frame than in the initial image?
    answer_type: yes_no
    notes_for_judge: Gravity pulls the object down the incline.
  - id: tarp_removal_check
    question: Is the view clear of the opaque tarp mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the tarp blows away, revealing the scene.
  - id: background_consistency
    question: Is the wooden barn in the background still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: The environment should remain stable.
  - id: ramp_surface_consistency
    question: Does the ramp still appear to be covered in shag carpet?
    answer_type: yes_no
    notes_for_judge: The material of the ramp should not change.
