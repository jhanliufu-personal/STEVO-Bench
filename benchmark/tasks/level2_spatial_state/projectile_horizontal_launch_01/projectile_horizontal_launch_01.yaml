evaluation:
  init_frame_description: A wooden cannon with a brass barrel sits on a wooden workbench in a workshop.
    A red ball is suspended in mid-air to the right of the barrel, exhibiting motion blur indicating rightward
    movement. A puff of white smoke is emerging from the barrel behind the ball. In the foreground, there
    are blueprints and a pencil. In the background, an open door leads to an outdoor area.
  init2final_edit_prompt: Edit the given image to remove the red ball from mid-air, as it has traveled
    out of the frame. Remove the white smoke puff from the cannon barrel and ensure the air is completely
    clear and transparent. Make sure the background workshop and open doorway are fully visible and unobstructed
    by smoke. Keep the wooden cannon, workbench, blueprints, and tools unchanged.
  rationale: The prompt describes a sequence where the ball is launched, followed by a period where smoke
    fills the room and then slowly dissipates. This process implies a significant passage of time (likely
    seconds or minutes). Given the initial high velocity of the ball and the time elapsed, the ball will
    have completed its trajectory and exited the frame or landed far in the background. Therefore, the
    final frame should show the scene with the smoke cleared and the ball no longer in its initial flight
    position.
