  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a robotic arm with a black carbon fiber and silver metal
    finish. The arm has a three-fingered claw gripper holding a standard yellow-green tennis ball. The
    background is a textured, dark grey surface, resembling a soft memory foam mat, with a visible depression
    or indentation directly below the suspended ball.
  init2final_edit_prompt: Edit the given image to show the robotic gripper claws open and empty. Place
    the tennis ball resting on the grey foam surface directly vertically below the open gripper. The ball
    should appear stationary on the mat, sitting in or near the indentation on the floor.
  rationale: 'The prompt describes a physical sequence where the ball is released and subjected to gravity.
    The ''several seconds'' of darkness allow sufficient time for the ball to fall and settle. Since the
    surface is described as soft memory foam designed to absorb impact, the ball will not bounce significantly
    but will instead land and come to rest on the surface directly below the release point. The final
    state shows the aftermath: the gripper is open (having released the ball) and the ball is resting
    on the floor.'
