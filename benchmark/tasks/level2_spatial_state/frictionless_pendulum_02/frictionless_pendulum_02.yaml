prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The lead bob is released from its initial 45-degree position. The chamber is a vacuum, and
    the pivot point at the top is a low-friction bearing. A large opaque metal safety shutter descends
    from the top of the frame, completely blocking the view of the chamber. The shutter then rises smoothly
    until the chamber is fully visible again. No zoom, no cut, no scene change. STOP.
  camera_WM: The lead bob is released from its initial 45-degree position. The chamber is a vacuum, and
    the pivot point at the top is a low-friction bearing. A large opaque metal safety shutter descends
    from the top of the frame, completely blocking the view of the chamber. The shutter then rises smoothly
    until the chamber is fully visible again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, spherical metal pendulum bob suspended by a thin vertical wire inside
    a cylindrical glass vacuum chamber. A mechanical arm with a jointed structure is positioned on the
    left, with its tip touching or holding the bottom of the sphere. The chamber sits on a metal base
    in a laboratory room with windows in the background.
  init2final_edit_prompt: Edit the given image to show the mechanical arm retracted to the left, no longer
    touching the sphere. The sphere must remain in the exact center of the chamber with the wire vertical.
    Ensure the glass chamber is fully visible and unobstructed.
  rationale: The initial frame visually depicts the pendulum at its equilibrium position (vertical wire),
    despite the text prompt mentioning a '45-degree position' (which likely refers to the angle of the
    release arm or is a counterfactual instruction). In a physics-consistent rollout, releasing an object
    from equilibrium results in no motion (zero potential energy). Therefore, the pendulum bob will remain
    stationary in the center. The only kinematic change is the movement of the mechanical arm, which releases
    the bob and retracts. The shutter temporarily blocks the view but the final state returns to the visible
    chamber.
