id: spinning_gyroscope_precession_10
level: 2
category: spatial_kinematics
tags: []
variant_of: spinning_gyroscope_precession
variation_type: combined
variation_description: Combines low RPM (unstable/falling) with camera zoom occlusion.
changes:
  occlusion_method: Camera zoom out
  dynamic_conditions: Low RPM, unstable wobble
  expected_outcome_change: Gyroscope spirals downwards/falls
prompts:
  init_frame_edit_prompt: Edit the image to make the gyroscope appear to be wobbling heavily, tilted further
    down than before, with less motion blur to suggest it is slowing down.
  video_WM: The gyroscope is spinning slowly and wobbling unstably on its pivot. The camera zooms out
    rapidly until the gyroscope is too small to see clearly, then zooms back in to the original framing.
    No cut, no scene change. STOP.
  camera_WM: The gyroscope is spinning slowly and wobbling unstably on its pivot. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A close-up, eye-level shot of a large mechanical gyroscope resting on a metal
    table in a workshop. The gyroscope has a thick, brass-colored heavy rotor (flywheel) and a dark metal
    outer frame with a central shaft. It is balanced on a sharp, conical metal pivot point. The table
    surface is covered with scattered metal shavings and filings. To the left, a dark metal chain hangs
    vertically. The background is a cluttered workshop with shelves, tools, and industrial lighting, slightly
    out of focus.
  init2final_edit_prompt: Edit the given image to show the gyroscope tilted at a different angle or pointing
    in a different direction, reflecting a change in its wobble. Keep the pointed pivot tip at the same
    location on the table. Ensure the background, the hanging chain, the metal shavings on the table,
    and the lighting remain exactly unchanged.
  rationale: The video describes a gyroscope spinning and wobbling unstably. While the camera zooms out
    and back in, the gyroscope continues to move physically. Due to the unstable wobble (precession/nutation),
    the orientation of the gyroscope's axis will change over time. When the camera returns to the original
    framing, the gyroscope should be visible in the same location (anchored by its pivot) but tilted or
    oriented differently than in the initial frame. The static environment (chain, shavings, background)
    must remain identical.
  questions:
  - id: gyro_orientation_change
    question: Is the gyroscope tilted or oriented differently compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The gyroscope should have precessed or wobbled to a new angle.
  - id: gyro_shaft_direction
    question: Is the central shaft of the gyroscope pointing in a different direction than it was initially?
    answer_type: yes_no
    notes_for_judge: Check if the axis of rotation has moved.
  - id: gyro_pivot_consistency
    question: Is the pointed tip of the gyroscope still touching the table at approximately the same location?
    answer_type: yes_no
    notes_for_judge: The pivot point should act as an anchor and not slide significantly.
  - id: shavings_static
    question: Are the metal shavings on the table arranged identically to the initial frame?
    answer_type: yes_no
    notes_for_judge: Static objects should not move.
  - id: chain_static
    question: Is the hanging chain on the left in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The chain is a static background element.
  - id: gyro_presence
    question: Is the gyroscope still the central object in the frame?
    answer_type: yes_no
    notes_for_judge: The object must persist.
