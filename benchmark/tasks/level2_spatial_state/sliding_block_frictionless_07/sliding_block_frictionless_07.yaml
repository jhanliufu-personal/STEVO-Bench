id: sliding_block_frictionless_07
level: 2
category: spatial_kinematics
tags: []
variant_of: sliding_block_frictionless
variation_type: combined
variation_description: High friction surface (sand) combined with lighting occlusion.
changes:
  occlusion_method: Lighting change (lights off)
  dynamic_conditions: Surface is deep sand (high friction)
  expected_outcome_change: Block stops quickly in the dark.
prompts:
  init_frame_edit_prompt: Edit the image to change the ground surface to a bed of deep, loose sand.
  video_WM: The metal block is sliding across a bed of deep, loose sand. The sand creates significant
    resistance against the block's movement. Suddenly, the lights turn off, plunging the room into darkness.
    After a few seconds, the lights turn back on, revealing the scene again. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The metal block is sliding across a bed of deep, loose sand. The sand creates significant
    resistance against the block's movement. Suddenly, the lights turn off, plunging the room into darkness.
    After a few seconds, the lights turn back on, revealing the scene again. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A shiny silver metal cube is sliding across a sandy desert terrain, kicking
    up a significant cloud of brown dust and sand particles around it. To the left, a dark mechanical
    robotic arm is extended horizontally, positioned behind the moving cube. The scene is illuminated
    by a low sun, creating warm lighting and long shadows on the rippled sand surface.
  init2final_edit_prompt: Edit the given image to position the metal cube further to the right side of
    the frame, increasing the distance between the cube and the robotic arm. Remove the airborne clouds
    of sand and dust to show that the particles have settled. The cube should appear resting on the sand
    surface. Maintain the original lighting, background terrain, and the position of the robotic arm.
  rationale: 'The initial frame depicts a block with rightward momentum (evidenced by the dust trail)
    sliding on a high-friction surface. The prompt states that lights turn off for a few seconds. During
    this period of darkness, two physical processes occur: the friction from the sand decelerates the
    block until it stops further to the right, and gravity causes the airborne dust to settle. The final
    frame must reflect this new resting position and the clearing of the air.'
  questions:
  - id: block_position_right
    question: Is the metal cube positioned further to the right than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The block was sliding right; it should have continued in that direction.
  - id: block_arm_distance
    question: Is the distance between the robotic arm and the metal cube greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Since the block moves right and the arm is on the left, the gap must increase.
  - id: dust_settled
    question: Have the airborne sand and dust clouds mostly settled or disappeared?
    answer_type: yes_no
    notes_for_judge: The prompt implies 'a few seconds' passed, which is enough time for heavy sand particles
      to settle.
  - id: block_displacement
    question: Has the metal cube moved away from its starting location?
    answer_type: yes_no
    notes_for_judge: It must show displacement due to initial velocity.
  - id: block_grounded
    question: Is the metal cube resting on the sand surface?
    answer_type: yes_no
    notes_for_judge: It should not be floating or flying; it slides on the bed of sand.
  - id: arm_consistency
    question: Is the robotic arm still visible on the left side of the frame?
    answer_type: yes_no
    notes_for_judge: The arm is a static reference object in this context.
  - id: lighting_consistency
    question: Does the lighting (sun position/shadows) look consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The lights turn back on, revealing the same scene.
