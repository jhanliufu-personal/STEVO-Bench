evaluation:
  init_frame_description: A shiny silver metal cube is sliding across a sandy desert terrain, kicking
    up a significant cloud of brown dust and sand particles around it. To the left, a dark mechanical
    robotic arm is extended horizontally, positioned behind the moving cube. The scene is illuminated
    by a low sun, creating warm lighting and long shadows on the rippled sand surface.
  init2final_edit_prompt: Edit the given image to position the metal cube further to the right side of
    the frame, increasing the distance between the cube and the robotic arm. Remove the airborne clouds
    of sand and dust to show that the particles have settled. The cube should appear resting on the sand
    surface. Maintain the original lighting, background terrain, and the position of the robotic arm.
  rationale: 'The initial frame depicts a block with rightward momentum (evidenced by the dust trail)
    sliding on a high-friction surface. The prompt states that lights turn off for a few seconds. During
    this period of darkness, two physical processes occur: the friction from the sand decelerates the
    block until it stops further to the right, and gravity causes the airborne dust to settle. The final
    frame must reflect this new resting position and the clearing of the air.'
