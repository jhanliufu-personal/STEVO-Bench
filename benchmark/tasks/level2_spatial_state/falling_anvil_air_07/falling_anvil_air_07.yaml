id: falling_anvil_air_07
level: 2
category: spatial_kinematics
tags: []
variant_of: falling_anvil_air
variation_type: combined
variation_description: Parachute dynamics combined with cloud occlusion.
changes:
  occlusion_method: Cloud passing.
  dynamic_conditions: Anvil attached to parachute.
  expected_outcome_change: Slower fall.
prompts:
  init_frame_edit_prompt: Edit the image to show a large, deployed parachute attached to the top of the
    anvil.
  video_WM: The anvil descends slowly, suspended by the large parachute which catches the air. A thick
    white cloud drifts rapidly into the frame, completely obscuring the anvil and the background. The
    cloud passes, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The anvil descends slowly, suspended by the large parachute which catches the air. A thick
    white cloud drifts rapidly into the frame, completely obscuring the anvil and the background. The
    cloud passes, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large red and white striped parachute is fully inflated, suspending a heavy,
    rusty iron anvil in the air. To the left, a yellow construction crane stands tall. The background
    consists of a sprawling cityscape with buildings and roads viewed from a high angle against a clear
    blue sky.
  init2final_edit_prompt: Edit the given image to position the anvil and the parachute lower in the frame
    to simulate a downward descent. Ensure the parachute remains inflated and the anvil hangs directly
    below it. Keep the yellow crane and the cityscape background in their original positions, ensuring
    the view is clear of any clouds.
  rationale: The video prompt describes a sequence where the anvil descends slowly under the parachute.
    A cloud temporarily obscures the scene but then passes completely. During the time the view was obscured,
    the physical force of gravity continued to act on the anvil, causing it to fall further. Therefore,
    in the final frame, the anvil and parachute must be positioned lower in the visual field than they
    were initially, and the scene must be clear of the obscuring cloud.
  questions:
  - id: falling_anvil_air_07_q1
    question: Is the anvil positioned lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: The object must have moved downwards vertically.
  - id: falling_anvil_air_07_q2
    question: Has the parachute moved downwards from its starting position?
    answer_type: yes_no
    notes_for_judge: Both the anvil and the parachute should be lower.
  - id: falling_anvil_air_07_q3
    question: Is the vertical distance between the top of the image frame and the top of the parachute
      larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Checks for downward displacement relative to the frame border.
  - id: falling_anvil_air_07_q4
    question: Is the anvil vertically lower relative to the yellow crane than it was initially?
    answer_type: yes_no
    notes_for_judge: Compare the height of the anvil against the static crane.
  - id: falling_anvil_air_07_q5
    question: Is the scene clear of the thick white cloud described in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the cloud passes, revealing the scene again.
  - id: falling_anvil_air_07_q6
    question: Is the parachute still inflated?
    answer_type: yes_no
    notes_for_judge: State consistency check.
  - id: falling_anvil_air_07_q7
    question: Are the city buildings in the background still visible?
    answer_type: yes_no
    notes_for_judge: Background consistency check.
