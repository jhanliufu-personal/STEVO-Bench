id: falling_anvil_air_10
level: 2
category: spatial_kinematics
tags: []
variant_of: falling_anvil_air
variation_type: combined
variation_description: Rocket accelerating upward combined with smoke occlusion.
changes:
  occlusion_method: Thick smoke filling the scene.
  dynamic_conditions: Object is a rocket accelerating upward.
  expected_outcome_change: Object moves UP rapidly.
prompts:
  init_frame_edit_prompt: Edit the image to replace the anvil with a small rocket with flames shooting
    out of the bottom.
  video_WM: The rocket accelerates upward, propelled by the thrust from its engine. Thick black smoke
    fills the entire frame, completely obscuring the rocket and the background. The smoke clears, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The rocket accelerates upward, propelled by the thrust from its engine. Thick black smoke
    fills the entire frame, completely obscuring the rocket and the background. The smoke clears, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A silver retro-style rocket is in mid-air in the upper right quadrant, angled
    upwards and to the right, with flames and a smoke trail emitting from its thruster. Below and to the
    left, a yellow construction crane stands against a backdrop of a city skyline and blue sky.
  init2final_edit_prompt: Edit the given image to show the silver rocket at a significantly higher position
    in the sky, further to the right along its upward trajectory. The rocket should be further away from
    the yellow crane than it was initially. Keep the yellow construction crane, the city skyline, and
    the blue sky background exactly as they were in the original image, ensuring the view is clear and
    not obscured by smoke.
  rationale: The video prompt describes the rocket accelerating upward. Although a period of total occlusion
    by smoke occurs, the smoke clears by the end. Therefore, the final state should show the scene with
    the static background (crane and city) unchanged, but with the rocket displaced significantly along
    its velocity vector (up and to the right) due to the acceleration during the elapsed time.
  questions:
  - id: rocket_height
    question: Is the rocket positioned higher in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the rocket relative to the frame borders or the
      crane.
  - id: rocket_right_movement
    question: Has the rocket moved further to the right compared to its starting position?
    answer_type: yes_no
    notes_for_judge: The rocket is angled right, so upward acceleration implies rightward movement as
      well.
  - id: rocket_crane_distance
    question: Is the distance between the rocket and the yellow crane greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The rocket moves away from the static crane.
  - id: crane_position
    question: Is the yellow crane still in the same position in the lower left area?
    answer_type: yes_no
    notes_for_judge: The camera is static, so the crane should not move.
  - id: smoke_cleared
    question: Is the view clear of the thick black smoke that was described as obscuring the scene?
    answer_type: yes_no
    notes_for_judge: The prompt states the smoke clears, revealing the scene again.
  - id: rocket_orientation
    question: Is the rocket still pointing generally upwards and to the right?
    answer_type: yes_no
    notes_for_judge: Kinematic consistency check.
