id: spinning_coin_wobble_09
level: 2
category: spatial_kinematics
tags: []
variant_of: spinning_coin_wobble
variation_type: combined
variation_description: Leaning coin (final stage) + Camera zoom occlusion.
changes:
  occlusion_method: Camera zooms out until scene is unrecognizable.
  dynamic_conditions: Coin is in the final stages of spin (low angle wobble).
  expected_outcome_change: Coin falls flat quickly.
prompts:
  init_frame_edit_prompt: Edit the image so the coin is leaning significantly, forming a 30-degree angle
    with the table, wobbling heavily.
  video_WM: The coin is in the final stages of its spin, leaning heavily and wobbling rapidly on the wooden
    surface. Gravity pulls on the angled coin. Friction acts on the edge. The coin is a standard metal
    quarter. The camera zooms out quickly until the coin is too small to see clearly. The camera holds
    this distant view for several seconds. Then the camera zooms back in to the original framing. No cut,
    no scene change. STOP.
  camera_WM: The coin is in the final stages of its spin, leaning heavily and wobbling rapidly on the
    wooden surface. Gravity pulls on the angled coin. Friction acts on the edge. The coin is a standard
    metal quarter during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a US quarter spinning on its edge on a scratched wooden table.
    The coin is upright but slightly blurred due to the spinning motion. The background shows a blurred
    window and wall.
  init2final_edit_prompt: Edit the given image to show the quarter lying flat on the wooden surface. The
    coin should be resting on one of its faces (heads or tails) instead of standing on its edge. Ensure
    the coin appears stationary and flat against the table texture. Maintain the original lighting, table
    scratches, and background details.
  rationale: The prompt establishes that the coin is already in the 'final stages' of its spin and wobbling.
    The camera zooms out and holds for 'several seconds' before returning. Physically, a coin in this
    state will lose its remaining angular momentum and fall flat due to gravity and friction within that
    timeframe. Therefore, in the final frame (which returns to the original view), the coin must be lying
    flat on the table, having completed its transition from dynamic equilibrium to a static resting state.
  questions:
  - id: coin_flat_01
    question: Is the coin lying flat on the wooden surface?
    answer_type: yes_no
    notes_for_judge: The coin should no longer be standing on its edge.
  - id: coin_orientation_02
    question: Is the coin resting on one of its faces rather than its edge?
    answer_type: yes_no
    notes_for_judge: It should be heads or tails up, not vertical.
  - id: coin_height_03
    question: Is the vertical profile of the coin significantly lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Since it fell flat, it should occupy much less vertical space.
  - id: coin_state_04
    question: Does the coin appear to have stopped spinning on its edge?
    answer_type: yes_no
    notes_for_judge: It should be static and flat.
  - id: table_consistency_05
    question: Are the scratches on the wooden table consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change.
  - id: background_consistency_06
    question: Is the background (window/wall) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returned to the original framing.
