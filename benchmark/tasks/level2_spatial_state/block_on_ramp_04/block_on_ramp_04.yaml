id: block_on_ramp_04
level: 2
category: kinematics
tags: []
variant_of: block_on_ramp
variation_type: dynamic_condition
variation_description: Ramp surface changed to rough sandpaper (high friction).
changes:
  occlusion_method: null
  dynamic_conditions: Ramp surface is now rough sandpaper instead of smooth metal.
  expected_outcome_change: The block should remain stationary or slide very slowly due to high friction.
prompts:
  init_frame_edit_prompt: Edit the image to change the surface texture of the metal ramp to look like
    rough, coarse sandpaper.
  video_WM: Single continuous take, no cuts or zoom. The block is resting on an inclined ramp covered
    in rough, coarse sandpaper which provides high friction. The block is not glued, but the surface is
    very grippy. Camera starts centered on the block and ramp. Then the camera smoothly moves to the right
    at constant speed until the ramp leaves the frame to the left. While the ramp is out of view, the
    physical interaction between the block and the rough surface continues naturally. The camera continues
    moving right across the tabletop for several seconds. Then the camera moves left at the same speed
    back to the original viewpoint.
  camera_WM: A block rests on an inclined ramp covered in rough, coarse sandpaper which provides high
    friction. The block is not glued, but the surface is very grippy. Lighting and objects remain consistent
    and realistic. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A rectangular wooden block rests near the top of an inclined ramp. The ramp's
    surface is covered in a rough, brown, coarse material resembling sandpaper or grip tape. A small metal
    pin or stop is visible immediately uphill (to the left) of the block. The ramp is supported by a metal
    structure and sits on a wooden table. In the background, a window and laboratory cabinets are visible.
  init2final_edit_prompt: Edit the given image to ensure the wooden block remains in its exact original
    position near the top of the ramp. Do not move the block down the incline. The block should still
    be located immediately next to the metal pin mechanism at the top of the slope. The scene should look
    identical to the initial state, with no displacement of the object.
  rationale: The prompt explicitly states that the ramp is covered in rough, coarse sandpaper providing
    'high friction' and describes the surface as 'very grippy'. Physically, the coefficient of static
    friction for wood on coarse grip tape is very high (often > 0.8), which is sufficient to counteract
    the gravitational force component on the visible incline angle (approx. 20-30 degrees). Therefore,
    despite the camera panning away and returning, the block should remain held in place by static friction
    and not slide down. The task tests the model's ability to maintain object permanence and stability
    under high-friction conditions without hallucinating motion.
  questions:
  - id: pos_static_01
    question: Is the wooden block still located near the top of the ramp?
    answer_type: yes_no
    notes_for_judge: The block should not have slid down; it should be in the same spot as the initial
      frame.
  - id: pos_relative_02
    question: Is the block in the same position relative to the metal pin/stop as it was initially?
    answer_type: yes_no
    notes_for_judge: The gap between the block and the uphill pin should not have increased.
  - id: pos_displacement_03
    question: Has the block remained stationary on the incline?
    answer_type: yes_no
    notes_for_judge: Answer YES if the block has not moved. Answer NO if it has slid down.
  - id: pos_height_04
    question: Is the block at the same height on the ramp as in the starting image?
    answer_type: yes_no
    notes_for_judge: It should not be lower.
  - id: pos_distance_05
    question: Is the distance between the block and the bottom edge of the ramp unchanged?
    answer_type: yes_no
    notes_for_judge: The block should not have moved closer to the bottom.
  - id: scene_identity_06
    question: Does the final frame appear identical to the initial frame regarding the block's placement?
    answer_type: yes_no
    notes_for_judge: Since no motion should occur, the frames should be effectively the same.
