id: funnel_marble_vortex_05
level: 2
category: spatial_kinematics
tags: []
variant_of: funnel_marble_vortex
variation_type: dynamic_condition
variation_description: Ball released from standstill instead of nudged.
changes:
  occlusion_method: null
  dynamic_conditions: Initial velocity is zero (released from hold).
  expected_outcome_change: Ball slides straight down the slope into the hole without spiraling.
prompts:
  init_frame_edit_prompt: Edit the image to show the steel ball being held stationary by a small mechanical
    gripper at the very edge of the rim.
  video_WM: The mechanical gripper opens, releasing the steel ball from a complete standstill at the rim.
    Gravity acts on the ball on the smooth slope. The camera rotates right until the funnel completely
    exits the view, then rotates toward the left smoothly at the same rate until the wide upper rim is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The mechanical gripper opens, releasing the steel ball from a complete standstill at the
    rim. Gravity acts on the ball on the smooth slope. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, clear plastic gravity well funnel in a museum setting. At the top left
    rim of the funnel, a metal mechanical gripper holds a large, shiny steel ball. The funnel slopes downward
    towards a central circular hole. The background shows windows and museum visitors.
  init2final_edit_prompt: Edit the given image so that the mechanical gripper at the top left is open
    and empty, with its jaws apart. Place the large steel ball at the bottom center of the clear funnel,
    positioned right next to the central drain hole. Maintain the original camera angle and background.
  rationale: The video prompt describes the ball being released from a standstill. Under gravity, the
    ball will roll down the slope of the funnel. Since it starts with zero tangential velocity, it will
    travel radially inward towards the center hole rather than orbiting. By the time the camera pans away
    and returns, the ball will have accelerated to the bottom of the funnel and will be located near the
    center hole or falling through it.
