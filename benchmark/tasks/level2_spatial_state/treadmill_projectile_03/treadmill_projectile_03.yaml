id: treadmill_projectile_03
level: 2
category: spatial_kinematics
tags: []
variant_of: treadmill_projectile
variation_type: occlusion_method
variation_description: Replaces camera rotation with a rapid zoom out.
changes:
  occlusion_method: Camera zooms out until the treadmill is too small to see, then zooms back in.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The robotic launcher fires a tennis ball vertically into the air while the treadmill belt
    continues its constant leftward motion. The air in the room is still. The camera rapidly zooms out
    backward until the treadmill becomes a tiny, indistinguishable speck in the distance, then zooms back
    in smoothly until the launcher is back in the original framing. No cut, no scene change. STOP.
  camera_WM: The ball is launched vertically relative to the treadmill belt, which is moving horizontally
    at a constant velocity. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A robotic launcher device constructed from aluminum extrusion profiles, sitting
    on a dark treadmill belt. The launcher has a vertical firing tube, motors, wires, and blue and orange
    LED indicators. The background is an industrial room with a concrete wall. On the far left of the
    background is a grey electrical cabinet. On the far right is a yellow vertical safety post. The treadmill
    belt shows horizontal motion blur.
  init2final_edit_prompt: Edit the given image to shift the background wall features to the right. Remove
    the yellow vertical post from the right side. Move the grey electrical cabinet from the left edge
    towards the center. Keep the robotic launcher centered on the treadmill belt.
  rationale: The launcher is on a treadmill belt that is moving leftward. Since the prompt does not state
    the launcher is driving to maintain position, it moves left with the belt. The camera zooms out and
    then re-frames the launcher ('until the launcher is back in the original framing'), which requires
    the camera to pan left to track the object's displacement. Consequently, static background features
    (like the wall, cabinet, and post) must shift to the right relative to the centered launcher. The
    yellow post on the right should move out of frame, and the cabinet on the left should move inward.
