evaluation:
  init_frame_description: A rustic workshop interior with stone walls. A pulley system is rigged with
    two weights suspended by ropes. On the left, a large, heavy, rusty metal weight labeled '50 KG' hangs
    in mid-air above an anvil. On the right, a smaller metal weight labeled '5 KG' hangs at roughly the
    same height. Between them is a gear mechanism with a handle. Several chains hang vertically on the
    far left side.
  init2final_edit_prompt: Edit the given image to change the vertical positions of the weights. Move the
    large '50 KG' weight on the left significantly downwards so it is positioned near the bottom of the
    frame, just above or resting on the anvil. Move the small '5 KG' weight on the right significantly
    upwards, positioning it near the top pulley. Adjust the ropes to be taut and connected to the new
    positions of the weights. Keep the background, stone walls, chains, and tools unchanged.
  rationale: 'The prompt describes an unbalanced Atwood machine scenario where a 50kg weight is connected
    to a 5kg weight. Once the brake is released, the significantly heavier 50kg weight will accelerate
    downwards due to gravity, pulling the lighter 5kg weight upwards. The occlusion by the wooden board
    hides the motion, but the final state must show the result of this physical interaction: the heavy
    weight displaced downwards and the light weight displaced upwards.'
