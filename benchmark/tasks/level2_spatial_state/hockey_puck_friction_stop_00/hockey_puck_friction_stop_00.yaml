id: hockey_puck_friction_stop_00
level: 2
category: spatial_kinematics
tags: []
variant_of: hockey_puck_friction_stop
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber with significant contact area
    against the rough surface. No external forces are applied to the puck after it is already in motion.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the rough concrete surface. The concrete has a high coefficient of
    friction typical of unpolished concrete. The puck is standard rubber with significant contact area
    against the rough surface. No external forces are applied to the puck after it is already in motion.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A black hockey puck is positioned centrally on a rough, gray concrete surface
    with visible cracks and pebbles. The puck exhibits motion blur, and there is a spray of dust and small
    debris kicking up around its base, indicating it is currently sliding across the floor.
  init2final_edit_prompt: Edit the given image to show the hockey puck at a new position on the concrete
    floor, displaced from the center. Remove the motion blur and the flying dust spray to depict the puck
    as having come to a complete stop. Reveal the concrete texture and cracks in the area where the puck
    was originally located. Maintain the original camera angle and lighting.
  rationale: 'The initial frame shows a puck in motion on a high-friction surface. Physics dictates that
    the rough concrete will exert a frictional force opposing the puck''s velocity, causing it to decelerate
    and eventually stop. The camera is stationary, so the puck must change its pixel coordinates as it
    slides. The final state represents the puck at rest: displaced from its starting point, with no motion
    blur and the dust settled.'
  questions:
  - id: position_change
    question: Is the hockey puck in a different position on the concrete floor compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The camera is stationary, so the puck must have moved to a new location within the
      frame.
  - id: displacement_from_center
    question: Has the puck moved away from the central area where it was originally located?
    answer_type: yes_no
    notes_for_judge: The puck started in the center; it should now be offset.
  - id: dust_settled
    question: Is the spray of dust and debris around the puck absent or significantly reduced?
    answer_type: yes_no
    notes_for_judge: The puck stopping means the active dust cloud caused by sliding should settle.
  - id: motion_blur_removed
    question: Does the puck appear sharp and stationary, without motion blur?
    answer_type: yes_no
    notes_for_judge: The task implies the puck comes to a stop due to friction.
  - id: reveal_background
    question: Is the concrete texture visible in the spot where the puck was originally sitting?
    answer_type: yes_no
    notes_for_judge: Since the puck moved, the floor beneath its starting position should now be visible.
  - id: background_consistency
    question: Does the concrete floor retain the same rough texture and color as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: object_permanence
    question: Is the black hockey puck still visible in the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
