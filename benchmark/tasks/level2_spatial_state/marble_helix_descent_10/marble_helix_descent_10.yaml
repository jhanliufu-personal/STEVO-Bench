id: marble_helix_descent_10
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_helix_descent
variation_type: combined
variation_description: Sticky track combined with camera zoom occlusion.
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: Rough, sticky track surface.
  expected_outcome_change: Marble moves slower/stops.
prompts:
  init_frame_edit_prompt: Edit the image to make the transparent track surface appear frosted and rough,
    with a visible sticky texture, instead of smooth and clear.
  video_WM: The marble is released from the top entrance of the helical track. The marble is free to move
    along the grooved helical path. The track provides lateral constraint but allows motion along the
    spiral. Gravity acts on the marble. The helical path is coated with a rough, sticky residue that creates
    high friction against the marble. The track descends vertically through multiple spiral turns from
    top to bottom. The camera zooms out rapidly until the helical track is too small to distinguish details,
    effectively occluding the marble's state. The camera holds this distant view for several seconds.
    Then the camera zooms back in smoothly to the original framing. No cut, no scene change. STOP.
  camera_WM: The marble is released from the top entrance of the helical track. The marble is free to
    move along the grooved helical path. The track provides lateral constraint but allows motion along
    the spiral. Gravity acts on the marble. The helical path is coated with a rough, sticky residue that
    creates high friction against the marble. The track descends vertically through multiple spiral turns
    from top to bottom during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a translucent, rough-textured helical track standing
    on a wooden workbench. A blue and green glass marble is positioned at the very top starting point
    of the spiral track. The background shows a blurred workshop environment with tools.
  init2final_edit_prompt: Edit the given image to move the blue and green marble from the top of the helical
    track to the third loop down. Position the marble so it is resting naturally in the groove of the
    spiral path on the third turn from the top. Ensure the original starting position at the top of the
    track is now empty. Maintain the original camera angle, lighting, and background details.
  rationale: The marble is acted upon by gravity, which pulls it downwards. The helical track constrains
    its motion to a spiral path. Although the prompt specifies 'sticky residue' creating high friction,
    gravity is a continuous force that will cause the marble to descend, albeit slower than on a frictionless
    surface. Over the course of 'several seconds' (during the camera zoom out and hold), the marble will
    have traveled a significant distance down the track. It should not remain at the top (ignoring gravity)
    nor should it have necessarily cleared the track entirely (due to the friction slowing it down). Therefore,
    the marble should be visible at a lower position on the spiral.
