id: bouncing_ball_rebound_06
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: dynamic_condition
variation_description: Floor changed to deep wet mud
changes:
  occlusion_method: null
  dynamic_conditions: Floor is deep wet mud instead of hardwood
  expected_outcome_change: Inelastic collision; ball should stick/embed in mud without bouncing
prompts:
  init_frame_edit_prompt: Edit the image to show the floor covered in a layer of thick, wet, brown mud.
  video_WM: The ball is released from the hand and becomes free to move. The floor is covered in a layer
    of thick, wet, viscous mud. The ball is a standard tennis ball. Gravity acts on the ball. The camera
    rotates right at constant speed until the ball and hand completely exit the view to the right. The
    camera continues rotating right for several seconds while the ball remains off-screen. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The ball is released from the hand and becomes free to move. The floor is covered in a layer
    of thick, wet, viscous mud. The ball is a standard tennis ball. Gravity acts on the ball during the
    occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot showing a robotic arm with a black carbon-fiber
    texture and silver metal joints extending from the upper right. The robot's three-fingered gripper
    is holding a bright yellow tennis ball. The arm is positioned over a wooden parquet floor that is
    heavily covered in a layer of thick, dark brown, wet mud. The mud has a glossy, viscous texture with
    visible streaks and footprints.
  init2final_edit_prompt: Edit the given image to show the robotic gripper open and empty, with the fingers
    spread apart as if it has released the object. Place the yellow tennis ball on the muddy floor directly
    vertically below the gripper's position. The ball should appear to be resting in the thick mud, partially
    embedded or settled, with some mud residue on its surface. Create a small impact impression or disturbance
    in the mud immediately surrounding the ball. Maintain the exact original camera angle, lighting, and
    background details.
  rationale: The prompt specifies that the ball is released and gravity acts upon it. Since the floor
    is covered in thick, wet, viscous mud, the collision will be highly inelastic; the ball will not bounce
    significantly but will instead land, splat, and settle into the mud directly below the release point.
    The camera pans away and then returns to the original viewpoint, meaning the fall and impact happen
    while occluded. In the final state, the ball must be on the floor, the hand must be empty, and the
    ball should be stationary given the time elapsed and the sticky nature of the surface.
