id: hockey_puck_friction_stop_04
level: 2
category: spatial_kinematics
tags: []
variant_of: hockey_puck_friction_stop
variation_type: dynamic_condition
variation_description: Surface changed from rough concrete to smooth ice (low friction).
changes:
  occlusion_method: null
  dynamic_conditions: Surface is smooth ice with very low friction.
  expected_outcome_change: Puck slides much further/longer due to reduced friction.
prompts:
  init_frame_edit_prompt: Edit the image to change the ground surface to a sheet of smooth, reflective
    ice.
  video_WM: The puck slides across a smooth sheet of ice. The ice has a very low coefficient of friction,
    offering minimal resistance to motion. The puck is standard rubber. No external forces are applied
    to the puck after it is already in motion. The camera rotates right at constant speed until the puck
    completely exits the view to the right. The camera continues rotating right for several seconds. Then
    the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The puck slides across a smooth sheet of ice. The ice has a very low coefficient of friction,
    offering minimal resistance to motion. The puck is standard rubber. No external forces are applied
    to the puck after it is already in motion. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, low-angle shot of a black hockey puck sliding on a gray, scratched
    ice surface. White ice shavings and spray are visible around the base of the puck, indicating motion.
    The background is blurred, showing warm lighting and indistinct structures.
  init2final_edit_prompt: Edit the given image to remove the black hockey puck and the white ice shavings.
    Fill the space with the surrounding scratched, gray ice texture to create a seamless, empty surface.
    Maintain the original lighting, reflections, and blurred background exactly as they are.
  rationale: The prompt establishes that the puck is moving to the right faster than the camera is panning
    (since it exits the view to the right). The camera pans right, pauses, and then returns to the original
    viewpoint. Due to the low friction of the ice and the absence of opposing forces, the puck continues
    sliding to the right and moves further away from the starting position. Therefore, when the camera
    returns to the initial view, the puck is far out of frame to the right, leaving the scene empty.
