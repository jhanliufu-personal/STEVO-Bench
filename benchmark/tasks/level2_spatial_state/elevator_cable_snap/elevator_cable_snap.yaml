id: elevator_cable_snap
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A glass-walled elevator car in a tall atrium. The primary steel cable has just parted,
    and the car is currently suspended in mid-air within the vertical guide rails.
  video_WM: The elevator car is no longer supported by the cable. The vertical shaft is clear of obstructions,
    and the guide rails are well-lubricated. The camera rotates right until the elevator car completely
    exits the view, then rotates toward the left smoothly at the same rate until the snapped cable end
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The elevator car is free-hanging within the shaft after the cable failure. The vertical guide
    rails are the only physical constraints. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
