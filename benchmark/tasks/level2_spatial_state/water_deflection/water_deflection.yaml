id: water_deflection
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A steady vertical stream of water falls from a tap. A high-powered handheld electric
    fan is positioned to the side, aimed horizontally at the middle of the falling stream.
  video_WM: The electric fan is switched to its maximum setting. The horizontal airflow makes direct contact
    with the falling vertical stream of water. The camera rotates right until the fan completely exits
    the view, then rotates toward the left smoothly at the same rate until the drain directly below the
    tap is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The horizontal air force from the fan is applied to the vertical water stream. The flow from
    the tap remains constant. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a utility sink area. On the left, a metal faucet extends
    from a white tiled wall, releasing a vertical stream of water. On the right, a black industrial-style
    electric fan with a wire guard is held by a person's hands (arms visible). The fan is positioned facing
    the water stream. The airflow from the fan is interacting with the water, causing the stream to break
    up into a chaotic spray and deflect significantly towards the left. The sink basin is concrete and
    wet.
  init2final_edit_prompt: Edit the image to show the water stream being powerfully blown to the left by
    the fan. The water should not fall straight down but should curve sideways, breaking into a mist or
    spray directed away from the fan. The fan should remain visible on the right side. The sink surface
    should appear wet. Maintain the general composition of the scene.
  rationale: 'The video depicts a scenario where a fan exerts a continuous physical force (airflow) on
    a water stream. The camera pans to the right (causing the fan to exit the view on the left side of
    the frame as the camera looks away) and then pans back to the left until the drain/faucet is centered.
    During this occlusion and camera movement, the fan remains at its maximum setting. Therefore, when
    the camera returns to the initial subject, the physical state must be preserved: the water stream
    must still be deflected to the left by the airflow, rather than falling straight down as if the fan
    were off. The fan should also be visible again as the camera must pan past it to center the drain.'
