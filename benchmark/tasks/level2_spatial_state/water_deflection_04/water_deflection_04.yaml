id: water_deflection_04
level: 2
category: spatial_kinematics
tags: []
variant_of: water_deflection
variation_type: dynamic_condition
variation_description: Fan is switched off, removing the deflecting force.
changes:
  occlusion_method: null
  dynamic_conditions: Fan is switched off.
  expected_outcome_change: Water flows vertically straight down into the drain without deflection.
prompts:
  init_frame_edit_prompt: Edit the image so the fan blades look stationary and distinct, and ensure the
    fan appears powered down.
  video_WM: The electric fan is switched off and remains stationary. The water flows vertically from the
    tap. The camera rotates right until the fan completely exits the view, then rotates toward the left
    smoothly at the same rate until the drain directly below the tap is back in the center of view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The electric fan is switched off and remains stationary. The water flows vertically from
    the tap. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A side-view close-up of a sink area. On the left, a metal tap is running, producing
    a stream of water. On the right, a person's hands are holding a black electric fan with a wire grille.
    The fan is active and facing the tap, blowing air towards the left. Consequently, the water stream
    is being forcefully deflected to the left, creating a chaotic spray and mist that angles away from
    the fan. The background features a tiled wall and a stone or concrete sink basin.
  init2final_edit_prompt: Edit the given image to show the water flowing in a straight, vertical column
    directly downwards from the tap into the sink. Remove the horizontal deflection, spray, and mist caused
    by the wind. The water should appear as a coherent, gravity-driven stream falling straight down. If
    the fan blades are visible, they should appear distinct and stationary.
  rationale: The video prompt states that the fan is switched off. Physically, this removes the aerodynamic
    force that was pushing the water sideways. Without the wind pressure, gravity becomes the dominant
    force acting on the water, causing it to return to a vertical trajectory. The camera motion (panning
    right then left) serves to pass time and reset the view, but the fundamental state change is the water
    stream straightening out. In the final view, the water must fall directly below the tap, and the fan
    (if visible) should be stationary.
  questions:
  - id: water_vertical_01
    question: Is the water stream falling vertically straight down?
    answer_type: yes_no
    notes_for_judge: The water should no longer be deflected to the side.
  - id: water_deflection_02
    question: Has the horizontal deflection of the water stream disappeared?
    answer_type: yes_no
    notes_for_judge: Initially, the water was blown sideways; now it should fall straight.
  - id: water_destination_03
    question: Does the water enter the sink directly below the tap?
    answer_type: yes_no
    notes_for_judge: Check if the impact point is vertically aligned with the faucet.
  - id: spray_mist_04
    question: Is the chaotic spray or mist absent from the water flow?
    answer_type: yes_no
    notes_for_judge: The flow should be more laminar or coherent, not a wind-blown spray.
  - id: gravity_dominance_05
    question: Does the water trajectory follow the direction of gravity rather than wind force?
    answer_type: yes_no
    notes_for_judge: Gravity pulls down; wind pushes sideways. The final state should show only gravity's
      effect.
  - id: tap_presence_06
    question: Is the tap visible in the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check; the camera should have returned to show the tap/drain.
