id: oscillating_metronome_arm
level: 2
category: spatial_kinematics
kinematic_variable: Angular orientation (theta)
prompts:
  image_gen_prompt: A mechanical metronome with its winding key fully turned. The metal pendulum arm is
    currently held at its maximum left-hand extension, just as it is released.
  video_WM: The metronome arm is released and begins its rhythmic, high-frequency oscillation back and
    forth. The internal spring mechanism is fully active. The camera rotates right until the metronome
    completely exits the view, then rotates toward the left smoothly at the same rate until the metronome's
    wooden casing is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The metronome arm is oscillating back and forth at a steady, mechanical tempo. The motion
    is continuous. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden metronome mechanism housed in an open
    oak box on a cluttered workbench. The box has a door swung open to the right. Inside, brass gears
    are visible. A long metal pendulum arm with a sliding weight is tilted significantly to the left side
    of the oscillation arc. A brass winding key is inserted into the left side of the box. The workbench
    is covered with various woodworking tools like chisels and screwdrivers. A window with a blurred outdoor
    view is in the background.
  init2final_edit_prompt: Edit the given image to change the position of the metronome's metal pendulum
    arm so that it is oriented vertically, pointing straight down, rather than tilted to the left. Ensure
    the arm looks like it is in the middle of a swing. Keep the wooden box, the open door, the winding
    key, and all tools on the workbench exactly unchanged. Maintain the original lighting and background.
  rationale: The prompt describes the metronome arm being released and oscillating at high frequency.
    The camera performs a panning motion away from and then back to the object. During the time the object
    is out of view, the arm continues to swing. When the camera returns to the initial viewpoint, the
    arm will physically be in a different phase of its oscillation (e.g., vertical or tilted right) compared
    to the initial static 'held' position at the far left. The evaluation checks that the model has updated
    the arm's position to reflect this ongoing motion rather than freezing it in the initial state.
