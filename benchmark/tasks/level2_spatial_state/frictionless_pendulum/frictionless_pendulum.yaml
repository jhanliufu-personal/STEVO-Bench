id: frictionless_pendulum
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A massive lead pendulum bob suspended by a thin wire in a clear vacuum chamber. The
    bob is currently held at a 45-degree angle to the left.
  video_WM: The lead bob is released from its initial 45-degree position. The chamber is a vacuum, and
    the pivot point at the top is a low-friction bearing. The camera rotates right until the pendulum
    completely exits the view, then rotates toward the left smoothly at the same rate until the pivot
    point is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy pendulum is released from its left-hand extension in the vacuum chamber. The motion
    is governed by the length of the wire and gravity. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, spherical metal pendulum bob hangs suspended by a thin vertical wire
    in the center of a cylindrical glass vacuum chamber. To the left of the sphere, an angled mechanical
    arm structure is visible. The background shows a laboratory setting with windows and desks. The sphere
    appears to be at rest in its equilibrium position, with its shadow directly beneath it.
  init2final_edit_prompt: Edit the image to show the pendulum bob hanging vertically in the center of
    the glass chamber, in the exact same position as the original image. Ensure the mechanical arm remains
    on the left and the background laboratory equipment is unchanged. The view should remain centered
    on the pendulum structure.
  rationale: The initial image displays the pendulum bob hanging vertically at equilibrium, despite the
    prompt's text description of a '45-degree position' (which likely refers to the mechanical arm's angle
    or a hypothetical setup not depicted). Since the visual evidence shows the bob at rest at its lowest
    point, 'releasing' it results in no motion. The camera rotates away and then returns to the exact
    same viewpoint. Consequently, the final frame should be visually identical to the initial frame, with
    the bob remaining stationary in the center.
  questions:
  - id: bob_centered
    question: Is the metal sphere located in the center of the glass chamber?
    answer_type: yes_no
    notes_for_judge: The bob should be in the center, as it started at equilibrium and shouldn't move.
  - id: wire_vertical
    question: Is the wire supporting the sphere vertical?
    answer_type: yes_no
    notes_for_judge: The wire should be straight up and down, indicating no swing.
  - id: height_unchanged
    question: Is the sphere at the same height as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: It should not have risen or fallen.
  - id: no_displacement
    question: Has the sphere moved to the left or right side of the chamber?
    answer_type: yes_no
    notes_for_judge: Answer should be NO. The sphere should remain centered.
  - id: arm_visibility
    question: Is the mechanical arm still visible to the left of the sphere?
    answer_type: yes_no
    notes_for_judge: The arm is a static object and should remain in view.
  - id: view_centered
    question: Is the view centered on the pendulum structure?
    answer_type: yes_no
    notes_for_judge: The camera returns to the center pivot point.
  - id: bob_swinging
    question: Is the sphere displaced from the center equilibrium position?
    answer_type: yes_no
    notes_for_judge: Answer should be NO.
