camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Close-up view of an air hockey table with a dark surface and neon grid lines
    in pink, blue, and green. A white glowing puck is positioned at the far left edge, impacting the metal
    side rail. Orange sparks or light effects are visible at the point of contact with the rail. A motion
    blur trail extends to the right of the puck, indicating it traveled from right to left. The background
    is dark with blurred arcade machines.
  init2final_edit_prompt: Edit the given image to move the white air hockey puck to the right, positioning
    it near the center of the table surface. Remove the orange sparks and impact light effects from the
    left metal rail. Ensure the puck is no longer touching the left wall. Update the reflections on the
    glossy table surface to align with the puck's new position near the center.
  rationale: The initial frame shows the puck at the moment of impact with the left wall, evidenced by
    the sparks and the motion trail extending to the right (indicating right-to-left motion). Since the
    puck cannot move through the wall, and the prompt describes it sliding across the table, the physical
    progression is a rebound. The puck will bounce off the wall and slide towards the right (center of
    the table) at a constant velocity. The impact sparks are transient and will disappear as the puck
    moves away.
