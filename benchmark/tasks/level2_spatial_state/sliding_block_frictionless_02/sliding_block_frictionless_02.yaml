prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless, and the block maintains its constant velocity. Dense, opaque white fog rapidly fills
    the scene, completely obscuring the block and the environment. The fog holds for a moment, then dissipates
    quickly to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The metal block is sliding rapidly across the polished ice to the right. The surface is nearly
    frictionless, and the block maintains its constant velocity. Dense, opaque white fog rapidly fills
    the scene, completely obscuring the block and the environment. The fog holds for a moment, then dissipates
    quickly to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, reflective metal cubic block rests on a frozen, polished ice surface.
    To the left, a black mechanical arm with hydraulic pistons is positioned, appearing to have just pushed
    or released the block. The sun is low on the horizon, casting a glare on the ice and creating a lens
    flare. Small ice particles or shards are visible near the base of the block, suggesting recent movement.
    The background features a flat, icy horizon under a clear sky.
  init2final_edit_prompt: Edit the given image to position the metal block significantly further to the
    right side of the frame, creating a large gap between it and the mechanical arm. Keep the mechanical
    arm stationary on the left. Ensure the scene is clear and free of any fog or obstruction.
  rationale: The video prompt establishes that the block is sliding rapidly to the right on a frictionless
    surface. The fog acts as a temporary occlusion that hides the movement. Due to the lack of friction
    and the initial velocity, the block must continue its trajectory to the right while obscured. When
    the fog dissipates, the block should be found at a new position significantly to the right of its
    starting point, while the stationary mechanical arm remains on the left.
