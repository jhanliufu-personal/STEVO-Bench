id: torsional_oscillation_10
level: 2
category: spatial_kinematics
tags: []
variant_of: torsional_oscillation
variation_type: combined
variation_description: Stone disk (high inertia/slower) combined with smoke/fog occlusion.
changes:
  occlusion_method: Thick smoke/fog.
  dynamic_conditions: Heavy stone disk (higher moment of inertia).
  expected_outcome_change: Oscillation frequency decreases (slower rotation).
prompts:
  init_frame_edit_prompt: Edit the image to change the material of the disk from brass to dark grey, rough
    stone.
  video_WM: A heavy stone disk is released from the twisted position. Its high mass moment of inertia
    creates significant resistance to the torque. Thick industrial smoke fills the room, completely obscuring
    the disk and wire. The smoke slowly clears to reveal the scene again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A heavy stone disk is released from the twisted position. Its high mass moment of inertia
    creates significant resistance to the torque. Thick industrial smoke fills the room, completely obscuring
    the disk and wire. The smoke slowly clears to reveal the scene again. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a thick, rough-hewn circular stone disk suspended
    in mid-air by a vertical metal cable. The cable is visibly twisted into a spiral pattern above the
    disk, indicating stored torsional energy. The disk has a rugged, textured edge with visible chips
    and variations in the stone surface. The background is a dimly lit, rustic wooden workshop with a
    window on the left side providing natural light.
  init2final_edit_prompt: Edit the given image to show the stone disk rotated around its vertical axis,
    presenting a different section of its rough textured edge to the viewer. Modify the twisted cable
    above the disk to show a slightly different twist pattern or looseness, consistent with the disk having
    rotated to untwist it. Ensure the stone disk and wire are clearly visible with no thick smoke obscuring
    them, though a very faint, subtle haze may remain in the atmosphere. Keep the camera framing, background,
    and the vertical height of the disk identical to the original image.
  rationale: The prompt describes a torsional pendulum system where a heavy disk is released from a twisted
    state. The physical action is a rotation driven by the torque of the twisted wire. The high moment
    of inertia implies slow acceleration. The 'thick smoke' serves as a temporal occlusion; its clearing
    indicates that time has passed. Therefore, in the final frame, the smoke must be gone (revealing the
    object), and the disk must have rotated from its initial orientation, changing the visible texture
    on its side and altering the twist configuration of the wire. The vertical position of the suspended
    disk remains constant.
  questions:
  - id: disk_visibility
    question: Is the stone disk clearly visible, rather than being obscured by smoke?
    answer_type: yes_no
    notes_for_judge: The prompt states the smoke clears to reveal the scene. If the disk is hidden by
      smoke, the answer is No.
  - id: disk_rotation_texture
    question: Are the specific texture details (cracks, bumps, chips) on the visible side of the stone
      disk different from those in the initial frame?
    answer_type: yes_no
    notes_for_judge: The disk should have rotated, presenting a different face of the cylinder to the
      camera.
  - id: wire_twist_change
    question: Does the twisted wire pattern appear different (e.g., untwisted slightly or phase-shifted)
      compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the disk rotates, the wire untwists. The visual pattern of the spiral should change.
  - id: height_conservation
    question: Is the stone disk at approximately the same vertical height as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The disk is suspended; it should rotate but not fall.
  - id: background_consistency
    question: Are the background elements (window, wooden walls) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera should not move, and the scene should not change.
  - id: wire_connection
    question: Is the wire still connected to the center of the stone disk?
    answer_type: yes_no
    notes_for_judge: Structural integrity check.
