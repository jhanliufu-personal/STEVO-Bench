prompts:
  image_gen_prompt: A red toy cart with wheels sits on a straight horizontal track. A compressed coil spring is positioned behind the cart, held in compression between the cart and a fixed wall. The spring is visibly compressed with tightly packed coils. A release mechanism is about to let go.
  video_WM: The release mechanism disengages and the compressed spring is freed to expand. The cart is free to move along the smooth track with low friction wheels. The track extends several feet forward from the starting position. The spring has a strong spring constant typical of steel coils. The camera rotates right at constant speed until the cart and track completely exit the view to the right. The camera continues rotating right for several seconds while the cart remains off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the track back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The release mechanism disengages and the compressed spring is freed to expand. The cart is free to move along the smooth track with low friction wheels. The track extends several feet forward from the starting position. The spring has a strong spring constant typical of steel coils during the occlusion period. STOP.
