id: cart_spring_release
level: 2
category: spatial_kinematics
kinematic_variable: Linear position and velocity from stored elastic energy
tags: []
prompts:
  image_gen_prompt: A red toy cart with wheels sits on a straight horizontal track. A compressed coil
    spring is positioned behind the cart, held in compression between the cart and a fixed wall. The spring
    is visibly compressed with tightly packed coils. A release mechanism is about to let go.
  video_WM: The release mechanism disengages and the compressed spring is freed to expand. The cart is
    free to move along the smooth track with low friction wheels. The track extends several feet forward
    from the starting position. The spring has a strong spring constant typical of steel coils. The camera
    rotates right at constant speed until the cart and track completely exit the view to the right. The
    camera continues rotating right for several seconds while the cart remains off-screen. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the track back into
    view. No zoom, no cut, no scene change. STOP.
  camera_WM: The release mechanism disengages and the compressed spring is freed to expand. The cart is
    free to move along the smooth track with low friction wheels. The track extends several feet forward
    from the starting position. The spring has a strong spring constant typical of steel coils during
    the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A red metal wagon cart with black rubber wheels sits on wooden rails on a workbench.
    A large, compressed steel coil spring is positioned between the cart and a vertical concrete block
    on the right. A hand holds a release lever or handle near the spring, maintaining the compression.
  init2final_edit_prompt: Edit the given image to remove the red cart and the hand holding the lever.
    Show the wooden tracks empty and exposed where the cart was previously positioned. Extend the steel
    coil spring significantly to the left, rendering it in a relaxed, expanded state with visible gaps
    between the coils, protruding from the concrete block.
  rationale: The release of the mechanism allows the compressed spring to expand, exerting a strong force
    on the cart. Given the low friction wheels and the direction of the spring force (pushing away from
    the fixed concrete block), the cart is propelled to the left. The camera pans away and returns after
    several seconds; by this time, the cart will have traveled significantly to the left, likely exiting
    the original field of view entirely. The final state should show the empty track and the spring in
    its natural, uncompressed length.
  questions:
  - id: cart_absent
    question: Is the red cart absent from its initial position on the tracks?
    answer_type: yes_no
    notes_for_judge: The cart should have moved to the left, likely out of frame.
  - id: track_visible
    question: Are the wooden tracks visible where the cart was originally sitting?
    answer_type: yes_no
    notes_for_judge: Since the cart moved, the tracks underneath should be exposed.
  - id: spring_expanded
    question: Is the coil spring in an expanded state?
    answer_type: yes_no
    notes_for_judge: The spring should no longer be compressed.
  - id: spring_length
    question: Does the spring extend further to the left than it did in the initial frame?
    answer_type: yes_no
    notes_for_judge: The spring should be longer.
  - id: spring_gaps
    question: Are there visible gaps between the coils of the spring?
    answer_type: yes_no
    notes_for_judge: An uncompressed spring has spacing between coils.
  - id: space_empty
    question: Is the space immediately to the left of the concrete block empty of the cart?
    answer_type: yes_no
    notes_for_judge: The cart has been pushed away.
  - id: hand_removed
    question: Is the hand holding the release mechanism gone?
    answer_type: yes_no
    notes_for_judge: The hand released the mechanism and the scene has evolved.
