id: marble_helix_descent_05
level: 2
category: spatial_kinematics
tags: []
variant_of: marble_helix_descent
variation_type: dynamic_condition
variation_description: A clamp obstructs the path halfway down the spiral.
changes:
  occlusion_method: null
  dynamic_conditions: A physical block is clamped onto the track, obstructing the path.
  expected_outcome_change: Marble stops at the blockage instead of reaching the bottom.
prompts:
  init_frame_edit_prompt: Edit the image to show a black clamp attached to the helical track halfway down,
    physically blocking the groove where the marble rolls.
  video_WM: The marble is released from the top entrance of the helical track. The marble is free to move
    along the grooved helical path. The track provides lateral constraint but allows motion along the
    spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic.
    A black clamp is attached securely to the track halfway down the spiral, completely blocking the groove.
    The track descends vertically through multiple spiral turns from top to bottom. The camera rotates
    right at constant speed until the helical track completely exits the view to the right. The camera
    continues rotating right for several seconds while the marble remains off-screen in the track. Then
    the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the helical
    track back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The marble is released from the top entrance of the helical track. The marble is free to
    move along the grooved helical path. The track provides lateral constraint but allows motion along
    the spiral. Gravity acts on the marble. The helical path has low friction typical of acrylic plastic.
    A black clamp is attached securely to the track halfway down the spiral, completely blocking the groove.
    The track descends vertically through multiple spiral turns from top to bottom during the occlusion
    period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A clear acrylic helical marble run stands on a wooden workbench. A blue and
    green swirl marble sits at the very top entrance of the spiral track. A black C-clamp is clamped onto
    the spiral track structure roughly halfway down the vertical height of the helix. The background shows
    a workshop with tools hanging on a pegboard.
  init2final_edit_prompt: Edit the given image to move the blue and green marble from the top of the track
    to the middle section. Place the marble on the spiral track resting directly against the upper side
    of the black C-clamp, as if blocked from going further down. Remove the marble from the top entrance.
    Ensure the track structure, clamp position, and background remain unchanged.
  rationale: The marble is released and rolls down the helical track due to gravity. The prompt specifies
    that the black clamp blocks the groove halfway down. Therefore, the marble will travel down the spiral
    until it collides with the clamp and stops. The camera rotation away and back provides ample time
    for the marble to reach this resting point. The final state should show the marble stationary against
    the clamp, having vacated the top position but prevented from reaching the bottom.
  questions:
  - id: marble_moved_from_top
    question: Is the top entrance of the helical track empty?
    answer_type: yes_no
    notes_for_judge: The marble should have moved away from the starting position.
  - id: marble_lower_position
    question: Is the marble located lower in the image than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: It should have rolled down due to gravity.
  - id: marble_at_clamp
    question: Is the marble resting against or immediately adjacent to the black C-clamp?
    answer_type: yes_no
    notes_for_judge: The clamp is an obstacle blocking the path; the marble should stop there.
  - id: marble_not_at_bottom
    question: Is the bottom-most turn of the spiral track empty?
    answer_type: yes_no
    notes_for_judge: The marble should be stopped by the clamp before reaching the bottom.
  - id: clamp_consistency
    question: Is the black C-clamp still attached to the track in the same position?
    answer_type: yes_no
    notes_for_judge: The clamp is a static object and should not move.
  - id: track_integrity
    question: Does the clear acrylic track maintain its spiral shape?
    answer_type: yes_no
    notes_for_judge: The environment should remain stable.
