id: spring_oscillation_03
level: 2
category: spatial_kinematics
tags: []
variant_of: spring_oscillation
variation_type: occlusion_method
variation_description: Replaces camera rotation with a rapid zoom out.
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The weight is released from the pulled-down position. The spring is high-quality and the system
    has negligible air resistance. The camera zooms out rapidly until the spring and weight become tiny
    distant specks indistinguishable from the background, then zooms back in to the original framing.
    No cut, no scene change. STOP.
  camera_WM: The weight is released from the pulled-down position. The spring is high-quality and the
    system has negligible air resistance. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A workshop scene featuring a heavy 20kg cylindrical metal weight hanging from
    a vertical coil spring. The vertical spring is attached to a horizontal spring mechanism near the
    ceiling. To the right, a wooden post has a measuring tape attached, with a gloved hand visible near
    the tape. A large window with a grid pattern is visible in the background on the left.
  init2final_edit_prompt: Edit the given image to show the 20kg weight positioned significantly higher
    vertically than in the original frame. The vertical spring suspending the weight should appear shorter
    and compressed, with its coils closer together. Keep the background, the wooden post, the measuring
    tape, and the gloved hand consistent with the original image.
  rationale: The prompt specifies that the weight is released from a 'pulled-down position'. This implies
    the initial frame captures the system at its maximum vertical extension (lowest point). Upon release,
    the restoring force of the spring will pull the weight upward. Since the system has negligible air
    resistance, it will oscillate, but at any random point in time after release, the weight will almost
    certainly be higher than its starting extreme extension. The camera returns to the original framing,
    so the final image should depict the weight displaced upward from its initial static position.
  questions:
  - id: weight_height_change
    question: Is the 20kg weight positioned higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The weight starts at the bottom-most 'pulled-down' position. Any motion must be upward.
  - id: spring_compression
    question: Does the vertical spring appear shorter or more compressed than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the weight moves up, the spring must contract.
  - id: vertical_displacement
    question: Has the weight moved upward from its starting location?
    answer_type: yes_no
    notes_for_judge: Directional check for upward motion.
  - id: weight_visibility
    question: Is the 20kg weight still clearly visible in the frame?
    answer_type: yes_no
    notes_for_judge: Object permanence check.
  - id: background_consistency_window
    question: Is the window with the grid pattern still visible in the background?
    answer_type: yes_no
    notes_for_judge: Scene consistency check.
  - id: background_consistency_post
    question: Is the wooden post with the measuring tape still visible on the right?
    answer_type: yes_no
    notes_for_judge: Scene consistency check.
  - id: text_legibility
    question: Is the text '20 KG' on the weight still legible?
    answer_type: yes_no
    notes_for_judge: Detail preservation check.
