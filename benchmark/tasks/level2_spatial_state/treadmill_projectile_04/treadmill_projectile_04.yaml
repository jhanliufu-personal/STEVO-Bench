id: treadmill_projectile_04
level: 2
category: spatial_kinematics
tags: []
variant_of: treadmill_projectile
variation_type: dynamic_condition
variation_description: Introduces a strong industrial fan blowing against the direction of motion.
changes:
  occlusion_method: null
  dynamic_conditions: Strong wind blowing rightward (opposing belt motion).
  expected_outcome_change: The ball's trajectory will drift to the right relative to the launcher due
    to air resistance.
prompts:
  init_frame_edit_prompt: Edit the image to add a large, powerful industrial fan on the left side of the
    frame, facing towards the treadmill.
  video_WM: The robotic launcher fires a tennis ball vertically into the air while the treadmill belt
    continues its constant leftward motion. A large industrial fan on the left is running at maximum power,
    blowing a strong gale-force wind to the right across the treadmill. The camera rotates right until
    the treadmill completely exits the view, then rotates toward the left smoothly at the same rate until
    the launcher is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is launched vertically relative to the treadmill belt, which is moving horizontally.
    A strong wind is blowing horizontally in the opposite direction of the belt's motion. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A robotic launcher device mounted on a treadmill belt in an industrial room.
    The launcher is constructed from aluminum extrusion profiles and has a vertical guide mechanism. To
    the left of the treadmill stands a large industrial floor fan with a wire cage, positioned on a metal
    base. The background consists of a concrete block wall and some pipes/conduit. The treadmill belt
    has a dark, textured surface with longitudinal lines.
  init2final_edit_prompt: Edit the image to show the robotic launcher positioned further to the left on
    the treadmill, significantly closer to the large industrial fan. The distance between the launcher
    and the fan should be reduced. Ensure the launcher's mechanism appears empty, with no tennis ball
    visible.
  rationale: The treadmill belt is moving to the left, carrying the robotic launcher with it. Since the
    camera tracks the launcher and re-centers on it for the final frame, the launcher remains in the center
    of the view, but the stationary background objects (like the fan and wall) will appear shifted to
    the right relative to the launcher. Consequently, the fan will appear closer to the launcher than
    in the initial frame. The tennis ball, having been fired vertically into a strong rightward wind,
    will have been blown away from the launcher and is no longer present.
