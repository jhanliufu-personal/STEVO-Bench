id: spring_oscillation_09
level: 2
category: spatial_kinematics
tags: []
variant_of: spring_oscillation
variation_type: combined
variation_description: Very heavy mass (slow oscillation) with lights-out occlusion.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Mass increased to 500KG.
  expected_outcome_change: Very slow oscillation period
prompts:
  init_frame_edit_prompt: Edit the image to change the text engraved on the weight to read '500 KG' instead
    of '20 KG'.
  video_WM: The massive 500kg weight is released from the pulled-down position. The immense inertia implies
    very slow movement. The lights in the workshop abruptly cut out, leaving the room in total darkness.
    After a duration, the lights flicker back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The massive 500kg weight is released from the pulled-down position. The immense inertia implies
    very slow movement. The lights in the workshop abruptly cut out, leaving the room in total darkness.
    After a duration, the lights flicker back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene featuring a large, cylindrical, rusty metal weight labeled
    '500 KG' hanging from a heavy-duty metal coil spring attached to a wooden overhead beam. The spring
    is extended, showing gaps between the coils. To the right is a vertical wooden post with a measuring
    tape attached, marked with numbers. A gloved hand is visible on the right side near the post. A window
    with a grid pattern is visible in the background on the left.
  init2final_edit_prompt: Edit the given image to position the 500kg weight significantly higher vertically
    than its starting position. Compress the coil spring above the weight so the coils are closer together
    and the overall spring length is shorter. Maintain the original lighting, background tools, window,
    and the wooden post with the measuring tape.
  rationale: The prompt specifies that the weight is released from a pulled-down position. Physically,
    the tension in the extended spring will exert an upward force greater than gravity, causing the weight
    to accelerate upwards. Despite the 'slow movement' due to inertia, the net displacement over the duration
    of the blackout will be upward as the spring contracts towards its equilibrium point. Therefore, the
    final frame must show the weight at a higher vertical position and the spring in a more compressed
    state compared to the initial frame.
