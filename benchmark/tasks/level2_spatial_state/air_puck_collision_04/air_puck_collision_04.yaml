tags: []
variant_of: air_puck_collision
variation_type: dynamic_condition
variation_description: The air table is turned off, creating high friction.
changes:
  occlusion_method: null
  dynamic_conditions: Air cushion deactivated (high friction surface)
  expected_outcome_change: Puck decelerates rapidly and stops
prompts:
  init_frame_edit_prompt: Edit the image to make the table surface look matte and unlit, removing the
    glowing reflection from the air holes to imply the air jets are deactivated.
  video_WM: The puck slides across the rough surface of the deactivated air hockey table. Without the
    air cushion, friction is significant. The camera rotates right until the puck completely exits the
    view, then rotates toward the left smoothly at the same rate until the left wall is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the rough surface of the deactivated air hockey table. Without the
    air cushion, friction is significant. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of an air hockey table surface, which is dark blue with a grid
    of small air holes. On the left side, there is a metal rail with a yellow light strip running along
    its top. A white, glowing air hockey puck is in the midst of colliding with this left rail, creating
    a burst of orange sparks and exhibiting motion blur. In the background, slightly out of focus, a person's
    arm and a red mallet are visible, along with other arcade screens.
  init2final_edit_prompt: Edit the given image to show the white puck positioned further to the right
    on the dark blue table surface, clearly separated from the left metal rail. Remove the orange sparks,
    particles, and impact motion blur near the rail. The puck should appear to be resting or sliding on
    the perforated surface at a distance from the wall. Keep the framing of the left metal rail and the
    background elements identical to the original view.
  rationale: The puck initially impacts the left wall and bounces to the right. Since the table is deactivated,
    friction is significant, causing the puck to decelerate and likely stop a short distance away from
    the wall. The camera rotates away and then returns to the exact initial framing (left wall in center).
    Therefore, in the final state, the view is unchanged, but the puck has moved to the right (away from
    the wall) and the collision effects (sparks) have dissipated.
