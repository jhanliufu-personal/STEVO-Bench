evaluation:
  init_frame_description: A bicycle wheel with a black tire and silver rim is mounted horizontally on
    a metal truing stand. The wheel is spinning rapidly, causing the silver spokes to appear as a translucent,
    motion-blurred disc. The central hub is silver and attached to a vertical metal rod extending from
    the stand's arm. The background is a workshop environment featuring a workbench with tools, a blue
    vise, and overhead fluorescent lights.
  init2final_edit_prompt: Edit the given image to show the bicycle wheel continuing to spin in its original
    location. The wheel must remain mounted horizontally on the metal stand without shifting position,
    tilting, or falling. The spokes must continue to exhibit motion blur to indicate ongoing rotation.
    The tire, rim, and hub must remain in the exact same spatial coordinates relative to the frame. The
    background workshop environment, including the workbench and lights, must remain unchanged.
  rationale: The wheel is mounted on a fixed axle, constraining its translational position; it cannot
    move left, right, up, or down. The prompt specifies the wheel 'continues spinning freely,' and while
    friction is present, the inertia of a bicycle wheel typically prevents it from coming to a complete
    stop within the duration of a short video clip. Therefore, the final state should show the wheel still
    in motion (blurred spokes) and in the exact same position (kinematic constraint). The camera is stationary,
    so the background and perspective remain constant.
