id: sliding_block_frictionless_04
level: 2
category: spatial_kinematics
tags: []
variant_of: sliding_block_frictionless
variation_type: dynamic_condition
variation_description: Changes the surface from ice to rough asphalt, implying high friction.
changes:
  occlusion_method: null
  dynamic_conditions: Surface changed to rough asphalt (high friction)
  expected_outcome_change: The block should slow down significantly or stop, rather than maintaining velocity.
prompts:
  init_frame_edit_prompt: Edit the image to change the ground surface from polished ice to rough, coarse
    black asphalt texture.
  video_WM: The metal block is sliding rapidly across rough, coarse asphalt to the right. The surface
    texture is gritty and high-friction. The camera rotates right until the block completely exits the
    view, then rotates toward the left smoothly at the same rate until the original starting point is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The metal block is sliding rapidly across rough, coarse asphalt to the right. The surface
    texture is gritty and high-friction. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A low-angle shot of a shiny metal cube resting on coarse, dark asphalt. To the
    left, a mechanical robotic arm is visible, positioned near the block. Scattered around the block on
    the ground are small chunks of ice or glass debris. The background features a horizon with a sun flare,
    creating a high-contrast lighting environment.
  init2final_edit_prompt: Edit the given image to remove the metal block completely from the scene. Reveal
    the textured asphalt surface where the block was previously standing. Keep the robotic arm on the
    left, the scattered ice debris on the ground, and the background sky and lighting exactly as they
    are. The final image should show the exact same scene but with the metal block missing.
  rationale: The video prompt describes the block sliding rapidly to the right. The camera pans right
    to follow or track the action until the block completely exits the view, and then pans back to the
    original starting position. Since the block moved to the right and exited the frame of a right-panning
    camera, it will be significantly displaced to the right of the initial view. When the camera returns
    to the start, the block will no longer be in the frame. The static elements (arm, debris) remain unchanged.
  questions:
  - id: block_absence
    question: Is the metal block absent from its original position in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The block should have moved to the right and out of the frame.
  - id: block_out_of_frame
    question: Has the metal block moved out of the view?
    answer_type: yes_no
    notes_for_judge: Since the camera panned until it exited and came back to the start, the block should
      be gone.
  - id: empty_asphalt
    question: Is the asphalt visible where the metal block was initially standing?
    answer_type: yes_no
    notes_for_judge: The space occupied by the block should now be empty.
  - id: arm_presence
    question: Is the robotic arm still visible on the left side?
    answer_type: yes_no
    notes_for_judge: The arm is a static object and the camera returns to the original view.
  - id: debris_presence
    question: Are the scattered ice chunks still visible on the ground?
    answer_type: yes_no
    notes_for_judge: Debris should remain on the ground.
  - id: camera_consistency
    question: Is the camera view identical to the initial frame (same angle and framing)?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the camera returns to the original starting point.
