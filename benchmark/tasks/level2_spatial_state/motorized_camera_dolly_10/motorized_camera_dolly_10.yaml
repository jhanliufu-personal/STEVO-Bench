id: motorized_camera_dolly_10
level: 2
category: spatial_kinematics
tags: []
variant_of: motorized_camera_dolly
variation_type: combined
variation_description: Broken track + Fog occlusion
changes:
  occlusion_method: Thick fog fills room
  dynamic_conditions: Track is broken/missing segment
  expected_outcome_change: Dolly derails or stops at break
prompts:
  init_frame_edit_prompt: Edit the image to show the metal tracks ending abruptly in a jagged break a
    few feet ahead of the dolly.
  video_WM: The camera dolly is moving steadily along the tracks toward a section where the tracks are
    completely broken and missing. Thick white stage fog rapidly fills the room, obscuring the dolly,
    tracks, and background completely. The fog swirls for a moment, then dissipates to reveal the scene
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: The camera dolly is moving steadily along the tracks toward a section where the tracks are
    completely broken and missing. Thick white stage fog rapidly fills the room, obscuring the dolly,
    tracks, and background completely. The fog swirls for a moment, then dissipates to reveal the scene
    again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A professional film studio set featuring a large camera dolly mounted on metal
    tracks. A camera operator sits on the dolly seat, and another crew member stands behind him. A large
    camera is mounted on a jib arm extending from the dolly. The background features a green screen and
    studio lighting grids. In the immediate foreground, the tracks appear damaged with scattered wood
    splinters and debris lying on and around the rails.
  init2final_edit_prompt: Edit the given image to show the camera dolly and the seated operator positioned
    further along the tracks, significantly closer to the broken wood and debris in the foreground. The
    dolly should appear to have advanced down the rails. Ensure the entire scene is clear and fully visible,
    with no fog obscuring the view, maintaining the original studio lighting and background details.
  rationale: The prompt establishes that the dolly is moving steadily toward the broken track section.
    Although fog temporarily obscures the scene, the physical action of the dolly moving continues or
    the time elapsed implies a change in position. When the fog dissipates, the dolly must be located
    further along its trajectory (closer to the foreground debris) than it was initially. The final state
    requires the fog to be gone and the object to be spatially displaced.
