id: funnel_marble_vortex_07
level: 2
category: spatial_kinematics
tags: []
variant_of: funnel_marble_vortex
variation_type: combined
variation_description: Rough surface condition with fog occlusion.
changes:
  occlusion_method: Dense fog fills the room.
  dynamic_conditions: High friction surface (sandpaper).
  expected_outcome_change: Ball spirals inward rapidly due to friction.
prompts:
  init_frame_edit_prompt: Edit the image to make the clear acrylic surface of the funnel look frosted,
    rough, and textured like heavy-grit sandpaper.
  video_WM: The steel ball is given a rapid horizontal nudge along the inner circumference of the funnel's
    rim. The funnel surface is rough and textured like sandpaper. Suddenly, dense white fog pumps into
    the room, rapidly thickening until the funnel is completely obscured from view. The fog then clears
    away to reveal the scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The steel ball is given a rapid horizontal nudge along the inner circumference of the funnel's
    rim. The funnel surface is rough and textured like sandpaper. Suddenly, dense white fog pumps into
    the room, rapidly thickening until the funnel is completely obscured from view. The fog then clears
    away to reveal the scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, transparent, bowl-shaped funnel with a heavily scratched and textured
    surface. A shiny steel ball rests on the upper left rim of the funnel. At the bottom center of the
    funnel is a circular drain hole. The background features a bright room with large windows and people
    standing nearby.
  init2final_edit_prompt: Edit the given image to relocate the steel ball from the upper left rim to a
    position deep inside the funnel, resting near the central drain hole at the bottom. Remove the ball
    from its original position on the rim. Preserve the transparent, scratched texture of the funnel and
    the background details exactly as they are.
  rationale: The rapid horizontal nudge imparts initial kinetic energy to the ball, causing it to move
    along the funnel's surface. Gravity pulls the ball downward, while the normal force from the curved
    surface directs it inward, creating a spiraling trajectory. The specified 'sandpaper' texture introduces
    high friction, which rapidly dissipates the ball's kinetic energy, causing its orbit to decay quickly.
    During the time elapsed (implied by the fog sequence), the ball spirals down the slope and ends up
    significantly lower, near the central hole.
  questions:
  - id: position_change_rim
    question: Has the steel ball moved away from its starting position on the upper left rim?
    answer_type: yes_no
    notes_for_judge: The ball should no longer be at the top edge.
  - id: position_elevation
    question: Is the steel ball located lower in the funnel than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check vertical position relative to the rim.
  - id: position_proximity_center
    question: Is the steel ball closer to the central drain hole than it was initially?
    answer_type: yes_no
    notes_for_judge: The ball should have spiraled inward.
  - id: rim_empty
    question: Is the upper left section of the rim now empty?
    answer_type: yes_no
    notes_for_judge: Verify the initial spot is vacant.
  - id: funnel_integrity
    question: Does the funnel retain its transparent and scratched appearance?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the windows and background elements still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
