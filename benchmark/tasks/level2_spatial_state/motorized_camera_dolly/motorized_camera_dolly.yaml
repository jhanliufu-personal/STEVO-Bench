id: motorized_camera_dolly
level: 2
category: spatial_kinematics
kinematic_variable: Dolly position (y)
prompts:
  image_gen_prompt: A professional camera dolly is on a straight track in a studio. The motor is hummning,
    and the dolly is moving away from the starting point at a constant speed.
  video_WM: The camera dolly is moving steadily along the straight metal tracks. The motorized drive ensures
    a constant, unwavering velocity. The camera rotates right until the dolly completely exits the view,
    then rotates toward the left smoothly at the same rate until the start of the tracks is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The dolly moves along the track at a constant velocity, driven by its internal motor. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
