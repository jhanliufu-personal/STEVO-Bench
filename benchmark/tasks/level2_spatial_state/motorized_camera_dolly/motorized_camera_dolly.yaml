id: motorized_camera_dolly
level: 2
category: spatial_kinematics
kinematic_variable: Dolly position (y)
prompts:
  image_gen_prompt: A professional camera dolly is on a straight track in a studio. The motor is hummning,
    and the dolly is moving away from the starting point at a constant speed.
  video_WM: The camera dolly is moving steadily along the straight metal tracks. The motorized drive ensures
    a constant, unwavering velocity. The camera rotates right until the dolly completely exits the view,
    then rotates toward the left smoothly at the same rate until the start of the tracks is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The dolly moves along the track at a constant velocity, driven by its internal motor. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: 'A film studio scene featuring a large camera dolly on metal tracks. The tracks
    run diagonally from the bottom-right foreground towards the middle-left background. A professional
    film camera is mounted on the dolly. Two men are operating it: one seated on the dolly looking into
    the viewfinder (facing left), and another standing behind the dolly. The background includes a green
    screen on the right, black curtains on the left, and a lighting grid overhead.'
  init2final_edit_prompt: Edit the given image to show the camera dolly and the two operators positioned
    significantly further down the tracks, towards the left background. The dolly should appear smaller
    due to perspective, located deeper in the studio along the same metal rails. The section of the tracks
    in the foreground, originally occupied by the dolly, should now be empty and visible. Maintain the
    original background, lighting, and camera viewpoint.
  rationale: The video prompt describes the dolly moving steadily along the tracks. Based on the orientation
    of the operators and the camera lens, the dolly is moving 'forward' along the tracks (towards the
    left/background). The observer camera pans away (right) and then returns to the initial view ('start
    of the tracks in center'). During this occlusion, the dolly continues its steady motion. Therefore,
    in the final frame, the dolly must be displaced further along the tracks away from the camera, revealing
    the foreground section of the tracks it previously occupied.
