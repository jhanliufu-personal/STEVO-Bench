id: spinning_coin_wobble_03
level: 2
category: spatial_kinematics
tags: []
variant_of: spinning_coin_wobble
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to thick fog/smoke obscuring the scene.
changes:
  occlusion_method: Thick smoke fills the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The coin continues spinning on the table surface. The coin edge maintains contact with the
    table. Friction exists between the coin edge and the wooden surface. Air resistance acts on the rotating
    coin. The coin is a standard metal quarter with typical mass distribution. Thick white smoke blows
    into the scene, completely obscuring the coin and table from view. The smoke swirls densely for several
    seconds. Then the smoke clears rapidly, revealing the table surface again. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The coin continues spinning on the table surface. The coin edge maintains contact with the
    table. Friction exists between the coin edge and the wooden surface. Air resistance acts on the rotating
    coin. The coin is a standard metal quarter with typical mass distribution. Thick white smoke blows
    into the scene, completely obscuring the coin and table from view. The smoke swirls densely for several
    seconds. Then the smoke clears rapidly, revealing the table surface again. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a silver US quarter spinning upright on its edge
    on a scratched wooden table. The 'tails' side (eagle) is facing the camera, appearing as a circle.
    The background is blurred, showing a window sill and wall.
  init2final_edit_prompt: Edit the given image to show the coin lying flat on the wooden table surface.
    The coin should be resting horizontally on one of its faces instead of standing upright on its edge.
    The coin should appear as a flat disk or thin ellipse in perspective on the wood, rather than a vertical
    circle. Maintain the original lighting, wooden texture, and background.
  rationale: The prompt specifies that friction and air resistance are acting on the spinning coin. During
    the 'several seconds' that the coin is obscured by smoke, these dissipative forces will reduce the
    coin's angular momentum and rotational kinetic energy. Physically, a coin cannot maintain an upright
    spin indefinitely against friction; it will lose stability, wobble, and eventually fall to a stable
    resting position flat on the table due to gravity. Therefore, the final frame should depict the coin
    having fallen.
