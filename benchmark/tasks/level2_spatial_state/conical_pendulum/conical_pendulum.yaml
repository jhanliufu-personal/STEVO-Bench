id: conical_pendulum
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A heavy ball is suspended by a string from a ceiling hook. The ball is currently being
    held at a 30-degree angle from the vertical and is given a sharp push sideways, perpendicular to the
    string.
  video_WM: The ball is released into its path. The string remains taut and the pivot is frictionless.
    The motion is governed by the length of the string and the initial sideways velocity. The camera rotates
    right until the ball completely exits the view, then rotates toward the left smoothly at the same
    rate until the central vertical axis below the hook is back in the center of view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The ball is released with horizontal velocity while suspended by a fixed-length string. Gravity
    and tension are the only forces. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A heavy metal ball is suspended by a thick rope from a ceiling hook in front
    of a concrete wall. A vertical line is drawn on the wall directly below the hook, and an angled line
    marked '30°' indicates the displacement. A horizontal rope is attached to the ball and extends to
    the left. A person's hands are visible on the right, holding the ball and pulling it to the side,
    keeping the main rope taut at the 30-degree angle.
  init2final_edit_prompt: Edit the given image to center the vertical pencil line on the concrete wall
    within the frame. Remove the person's hands and arms completely. Show the metal ball hanging freely
    from the main rope, maintaining approximately the same vertical height as the initial state but potentially
    at a different horizontal position. The horizontal rope should be shown as slack, detached, or removed.
  rationale: The prompt describes a conical pendulum setup where the ball is released with an initial
    sideways velocity, causing it to orbit the vertical axis in a circle while maintaining a roughly constant
    height (unlike a simple pendulum which would drop). The camera pans right until the ball is out of
    view, then pans left to center the vertical reference line. The final frame should show the vertical
    line centered, the hands removed (release), and the ball in free motion at the same vertical level.
