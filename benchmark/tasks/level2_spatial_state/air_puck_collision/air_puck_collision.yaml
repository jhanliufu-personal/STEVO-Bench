id: air_puck_collision
level: 2
category: spatial_kinematics
kinematic_variable: Linear position (x)
prompts:
  image_gen_prompt: An air-hockey puck is moving across a glowing air-hockey table. It has just bounced
    off the left wall and is traveling toward the center at high speed.
  video_WM: The puck slides across the frictionless air-cushioned surface at a constant velocity. The
    path is a straight line across the table. The camera rotates right until the puck completely exits
    the view, then rotates toward the left smoothly at the same rate until the left wall is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the air-cushioned table at a high constant speed, governed by its
    initial momentum. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, low-angle view of an air hockey table. On the left, a metal rail
    is visible. A white puck with a blue center is impacting the rail, creating a bright burst of orange
    and yellow sparks. The table surface is black with glowing neon grid lines in pink and blue. On the
    far right, an orange mallet is partially visible. The scene has a dark, arcade-like atmosphere.
  init2final_edit_prompt: Edit the given image to show the state after the puck has bounced away. Remove
    the white puck and the orange sparks from the left metal rail. The metal rail should be clean and
    the black table surface with neon grid lines should be empty in that area. The puck should be positioned
    further to the right or removed from the frame entirely.
  rationale: The initial frame captures the moment of impact between the puck and the left wall. The video
    prompt describes a sequence where the camera pans right and then returns to the left wall. During
    this elapsed time, the puck (following the physics of a collision on a frictionless surface) will
    bounce off the wall and travel to the right at constant velocity. Therefore, in the final frame, the
    puck must have moved away from the left wall (towards the right or off-screen), and the transient
    impact sparks must have dissipated.
