id: air_puck_collision_02
level: 2
category: spatial_kinematics
tags: []
variant_of: air_puck_collision
variation_type: occlusion_method
variation_description: Replaces camera rotation with a person walking in front of the view.
changes:
  occlusion_method: A person walks in front of the camera, blocking the view
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The puck slides across the frictionless air-cushioned surface at a constant velocity. The
    path is a straight line across the table. A person wearing a dark shirt walks directly in front of
    the camera, completely blocking the view of the table. They pause for a moment, then walk away, revealing
    the table again. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the frictionless air-cushioned surface at a constant velocity. The
    path is a straight line across the table. A person wearing a dark shirt walks directly in front of
    the camera, completely blocking the view of the table. They pause for a moment, then walk away, revealing
    the table again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, low-angle view of an air hockey table with a retro neon grid design.
    A glowing white puck is on the left side of the frame, appearing to have just impacted the left rail
    with a burst of sparks and light. A motion blur trail indicates high speed. On the right side, an
    orange mallet is held by a hand, waiting. The background is dark with arcade lights.
  init2final_edit_prompt: Edit the given image to show the glowing white puck positioned further to the
    right, near the center or right side of the table, well away from the left rail. Remove the impact
    sparks and explosion effect from the left rail. Ensure the table surface is fully visible and unobstructed
    by any person or object.
  rationale: The video prompt describes the puck sliding across the table at a constant velocity in a
    straight line. In the initial frame, the puck is at the far left, having just impacted the wall. During
    the occlusion event (person walking by), time passes, allowing the puck to travel significantly to
    the right along the table surface. Therefore, in the final frame, the puck must be displaced to the
    right of its starting position, and the person must be gone to reveal the table again.
