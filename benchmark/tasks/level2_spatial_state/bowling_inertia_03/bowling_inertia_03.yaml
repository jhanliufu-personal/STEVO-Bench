evaluation:
  init_frame_description: A close-up, low-angle view of a black, marbled bowling ball positioned in the
    center of a polished wooden bowling lane. The lane extends into the distance with gutters on either
    side, leading to a set of white bowling pins in the background. Reflections of overhead lights are
    visible on the oily lane surface.
  init2final_edit_prompt: Edit the given image to show the bowling ball positioned significantly further
    down the lane, much closer to the pins in the background. The ball should appear smaller due to perspective
    distance. The immediate foreground area where the ball was originally located should now be empty,
    showing only the polished wooden lane surface. Maintain the original lighting, reflections, and the
    arrangement of the pins in the background.
  rationale: The video prompt establishes that the bowling ball is in motion on a low-friction surface.
    Although thick smoke temporarily obscures the view, the laws of physics (inertia and momentum) dictate
    that the ball continues to roll forward during the occlusion. When the smoke dissipates, the ball
    must be located further down the lane (closer to the pins) and appear smaller due to perspective,
    rather than remaining in its initial foreground position.
