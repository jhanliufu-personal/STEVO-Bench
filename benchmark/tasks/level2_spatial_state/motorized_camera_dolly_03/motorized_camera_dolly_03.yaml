id: motorized_camera_dolly_03
level: 2
category: spatial_kinematics
tags: []
variant_of: motorized_camera_dolly
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to extreme zoom on floor texture
changes:
  occlusion_method: Camera zooms in on the concrete floor until the dolly is out of frame
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The camera dolly is moving steadily along the straight metal tracks. The motorized drive ensures
    a constant, unwavering velocity. The camera zooms in tightly on the concrete floor texture next to
    the tracks until the dolly and tracks are completely excluded from the frame. The camera holds this
    close-up, then zooms back out smoothly until the camera returns to the original viewpoint. No cut,
    no scene change. STOP.
  camera_WM: The camera dolly is moving steadily along the straight metal tracks. The motorized drive
    ensures a constant, unwavering velocity. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: 'A wide shot of a film studio showing a large camera dolly system positioned
    on straight metal tracks. The tracks run diagonally from the bottom-left to the middle-right of the
    frame on a concrete floor. The dolly supports a black camera crane arm and a film camera. Two men
    are operating the dolly: one is seated on the rig controlling the camera, and the other stands behind
    him, both facing towards the right. The background features a green screen wall and a ceiling grid
    with studio lights.'
  init2final_edit_prompt: Edit the given image to move the entire camera dolly assembly (including the
    base, wheels, crane arm, camera, and both operators) further along the tracks towards the right side
    of the image. Reveal the empty metal tracks in the bottom-left foreground where the dolly was originally
    positioned. Ensure the dolly remains aligned with the tracks in its new position. Keep the background
    green screen, ceiling lights, and studio environment unchanged.
  rationale: The video prompt describes the dolly moving steadily along the tracks. The operators are
    facing to the right, which strongly implies the direction of motion is forward along the tracks (away
    from the camera/to the right). The observer camera zooms in on the floor (occluding the scene) and
    then zooms back out to the original viewpoint. Since the dolly has been moving continuously during
    this time, the final frame must show the dolly displaced further along the tracks to the right, while
    the static studio background remains the same.
  questions:
  - id: dolly_moved
    question: Has the camera dolly assembly moved from its initial position?
    answer_type: yes_no
    notes_for_judge: The dolly should not be in the exact same spot as the first frame.
  - id: dolly_direction
    question: Is the camera dolly positioned further to the right along the tracks compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The dolly should have moved in the direction the operators are facing (up the tracks/right).
  - id: tracks_exposed
    question: Are the metal tracks in the bottom-left foreground visible and empty?
    answer_type: yes_no
    notes_for_judge: Since the dolly moved away, the tracks where it started should now be exposed.
  - id: on_tracks
    question: Is the dolly still positioned on the metal tracks?
    answer_type: yes_no
    notes_for_judge: 'Kinematic constraint: the dolly must stay on the rails.'
  - id: background_static
    question: Are the green screen and ceiling lights in the same position as the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera returned to the original viewpoint, so the static background should match.
  - id: operators_present
    question: Are the two operators still visible on/with the dolly?
    answer_type: yes_no
    notes_for_judge: The operators should move with the dolly.
