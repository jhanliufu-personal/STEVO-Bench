prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The puck slides across the frictionless air-cushioned surface at a constant velocity. The
    path is a straight line across the table. Thick white smoke from an arcade smoke machine rapidly fills
    the space between the camera and the table, completely obscuring the view. The smoke slowly dissipates
    until the table is visible again. No zoom, no cut, no scene change. STOP.
  camera_WM: The puck slides across the frictionless air-cushioned surface at a constant velocity. The
    path is a straight line across the table. Thick white smoke from an arcade smoke machine rapidly fills
    the space between the camera and the table, completely obscuring the view. The smoke slowly dissipates
    until the table is visible again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, angled view of an air hockey table with a dark surface and glowing
    neon grid lines in pink, blue, and green. A white, glowing air hockey puck is positioned near the
    left metal rail. A bright spark effect and motion blur trail indicate the puck has just impacted the
    left rail and is moving rapidly towards the right.
  init2final_edit_prompt: Edit the given image to move the white glowing puck to the right side of the
    table. Remove the puck and the impact spark from their original position near the left rail. The puck
    should be positioned significantly further to the right, appearing to have slid across the surface.
    Maintain the neon grid lines, reflections, and the overall lighting of the arcade setting.
  rationale: The initial frame captures the puck immediately after impacting the left rail, moving rightward.
    The video prompt describes a sequence where smoke obscures the view and then dissipates, indicating
    a significant passage of time. Given the frictionless surface and constant velocity, the puck must
    continue its trajectory across the table. Therefore, the final frame should show the puck displaced
    significantly to the right, and the transient impact spark should have vanished.
