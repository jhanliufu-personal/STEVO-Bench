id: bouncing_ball_rebound_09
level: 2
category: spatial_kinematics
tags: []
variant_of: bouncing_ball_rebound
variation_type: combined
variation_description: Combined superball (high bounce) with fog occlusion.
changes:
  occlusion_method: Thick fog fills the room.
  dynamic_conditions: Ball is a high-elasticity rubber superball.
  expected_outcome_change: Ball bounces higher and longer than the tennis ball; occlusion is via fog.
prompts:
  init_frame_edit_prompt: Edit the image to change the tennis ball into a small, shiny, colorful rubber
    superball.
  video_WM: The rubber superball is released from the hand and becomes free to move. The floor is solid
    hardwood. The ball is made of high-elasticity polymer designed for maximum energy conservation. Gravity
    acts on the ball. Suddenly, thick, opaque white fog rapidly fills the room, obscuring all details
    and hiding the ball completely from view. The fog remains dense for several seconds. Then the fog
    clears rapidly, restoring visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The rubber superball is released from the hand and becomes free to move. The floor is solid
    hardwood. The ball is made of high-elasticity polymer designed for maximum energy conservation. Gravity
    acts on the ball. Suddenly, thick, opaque white fog rapidly fills the room, obscuring all details
    and hiding the ball completely from view. The fog remains dense for several seconds. Then the fog
    clears rapidly, restoring visibility. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot showing a person's arm and hand extended over a
    polished hardwood floor. The hand is open with fingers slightly curled, and a colorful, multi-colored
    swirled rubber ball is suspended in mid-air just below the fingertips, appearing to have just been
    released.
  init2final_edit_prompt: Edit the given image to show the colorful rubber ball resting on the hardwood
    floor significantly below the hand, instead of hovering in the air near the fingers. The space immediately
    below the hand should be empty. Keep the hand, arm, and background floor details identical to the
    original view.
  rationale: The ball is released and subjected to gravity, causing it to fall towards the floor. Although
    the fog obscures the scene for several seconds, the physical laws of gravity and energy conservation
    dictate that the ball will fall, hit the floor, and bounce. After several seconds, due to energy dissipation
    from impacts, the ball will be at a lower height than its release point, likely resting on the floor
    or bouncing at a low amplitude. The fog clears, restoring visibility of the scene with the ball in
    this new, lower position.
  questions:
  - id: ball_vertical_pos
    question: Is the colorful ball positioned lower in the frame than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: The ball should have fallen due to gravity.
  - id: ball_displacement
    question: Has the ball moved downwards from its starting position near the hand?
    answer_type: yes_no
    notes_for_judge: Check for downward displacement.
  - id: hand_empty
    question: Is the space immediately below the fingers empty?
    answer_type: yes_no
    notes_for_judge: The ball should no longer be hovering right under the hand.
  - id: floor_proximity
    question: Is the ball closer to the hardwood floor than it is to the hand?
    answer_type: yes_no
    notes_for_judge: After falling, it should be near or on the floor.
  - id: visibility_restored
    question: Is the colorful ball clearly visible?
    answer_type: yes_no
    notes_for_judge: The fog has cleared, so the object should be visible.
  - id: fog_cleared
    question: Are the floor details and the hand visible without obstruction?
    answer_type: yes_no
    notes_for_judge: Verifies the fog has cleared.
