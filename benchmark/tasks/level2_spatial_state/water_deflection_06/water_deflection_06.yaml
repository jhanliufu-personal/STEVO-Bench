id: water_deflection_06
level: 2
category: spatial_kinematics
tags: []
variant_of: water_deflection
variation_type: dynamic_condition
variation_description: Water flow is reduced to a weak trickle.
changes:
  occlusion_method: null
  dynamic_conditions: Water pressure is very low (trickle).
  expected_outcome_change: The water stream is deflected much more violently, potentially spraying horizontally
    or breaking into mist.
prompts:
  init_frame_edit_prompt: Edit the image to show a very thin, weak trickle of water coming from the tap
    instead of a strong steady stream.
  video_WM: The electric fan is switched to its maximum setting. The horizontal airflow hits the weak,
    thin trickle of water coming from the tap. The camera rotates right until the fan completely exits
    the view, then rotates toward the left smoothly at the same rate until the drain directly below the
    tap is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The electric fan is switched to its maximum setting. The horizontal airflow hits the weak,
    thin trickle of water coming from the tap. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A side-view close-up of an industrial sink area. On the left, a metal faucet
    protrudes from a tiled wall, releasing a thin, vertical trickle of clear water. Below the faucet is
    a dirty, concrete or stone sink basin with a drain. On the right side of the frame, a person's hands
    are holding a black electric fan with a metal wire guard. The fan is facing left, directly towards
    the water stream. The background consists of a tiled wall and blurred industrial equipment.
  init2final_edit_prompt: Edit the given image to show the thin stream of water curving significantly
    to the left. The water stream should no longer fall straight down but should form an arc bending away
    from the fan on the right, as if blown by a strong horizontal airflow. The water should appear to
    deflect towards the left side of the sink, and the fan blades should appear blurred to indicate they
    are spinning.
  rationale: The prompt describes a physical interaction where a fan blows air horizontally from right
    to left against a falling stream of water. Kinematically, the force of the air will accelerate the
    water droplets horizontally to the left, causing the stream to deflect and curve away from the fan.
    The camera rotation serves as a transition period for the fan to spin up and the airflow to establish
    this new steady state. Upon returning to the original viewing angle, the water stream must be shown
    bending to the left rather than falling vertically.
