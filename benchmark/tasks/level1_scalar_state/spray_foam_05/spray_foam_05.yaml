id: spray_foam_05
level: 1
category: scalar_state
tags: []
variant_of: spray_foam
variation_type: dynamic_condition
variation_description: A solvent is applied to the foam, causing it to dissolve/shrink instead of expand.
changes:
  occlusion_method: null
  dynamic_conditions: Chemical solvent applied to foam causing breakdown.
  expected_outcome_change: The foam volume decreases (shrinks) instead of increasing.
prompts:
  init_frame_edit_prompt: Edit the image to show the yellow foam looking wet and collapsing, with a clear
    liquid solvent dripping over it.
  video_WM: A strong solvent is reacting with the foam, causing the yellow mound to hiss, dissolve, and
    shrink in volume rapidly. The camera rotates right until the foam completely exits the view, then
    rotates toward the left smoothly at the same rate until the foam is back in the center of view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: A strong solvent is reacting with the foam, causing the yellow mound to hiss, dissolve, and
    shrink in volume rapidly. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a wall cavity framed by vertical wooden studs. A large, irregular
    mound of yellowish-brown expanding foam fills the space between the studs near the bottom plate. The
    foam has a glossy, bubbly texture. A metal nozzle tip is visible at the top right, dripping liquid
    onto the foam. Sawdust and wood shavings are scattered on the wooden floor plate.
  init2final_edit_prompt: Edit the given image to show the mound of yellow foam significantly reduced
    in volume, appearing shrunken, dissolved, and collapsed. The foam should look deflated and occupy
    much less space between the wooden studs compared to the original size. Keep the wooden studs, the
    floor plate, and the scattered sawdust identical to the original view.
  rationale: The video prompt describes a camera panning action that moves the subject out of view and
    then returns to the exact same centering. Therefore, the final frame's viewpoint is identical to the
    initial frame. The physical action describes a solvent dissolving the foam, which is a scalar reduction
    in volume. Consequently, the final image must show the foam mound as significantly smaller, shrunken,
    or collapsed compared to the initial expanded state.
