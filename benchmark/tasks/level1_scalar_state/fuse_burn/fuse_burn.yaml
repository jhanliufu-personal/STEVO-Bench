id: fuse_burn
level: 1
category: scalar_state
scalar_variable: Unburned fuse length
prompts:
  image_gen_prompt: A thick black gunpowder fuse is laid out on a concrete floor. One end is lit and sizzling
    with a bright spark, moving quickly toward the other end.
  video_WM: The fuse is burning rapidly, and the length of the black cord is visibly shortening as the
    spark moves along it. The burning continues at a fast, constant rate. The camera rotates right until
    the fuse completely exits the view, then rotates toward the left smoothly at the same rate until the
    fuse is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The fuse is burning; the length of the unburned cord is visibly decreasing. The combustion
    continues steadily. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
