evaluation:
  init_frame_description: A close-up, eye-level shot of a stainless steel gooseneck kettle sitting on
    an electric stove burner. The spiral burner coils are glowing bright orange-red, indicating high heat.
    A significant amount of white steam is vigorously escaping from the kettle's spout and leaking from
    under the lid, drifting upwards and to the right, partially obscuring the window in the background.
  init2final_edit_prompt: Edit the given image to remove all visible steam and smoke. Show the kettle
    sitting on the glowing red burner with the air around it completely clear. The white vapor plume coming
    from the spout and lid should be erased, restoring full visibility of the background window and tiles.
    Keep the kettle, the red-hot burner coils, and the kitchen environment otherwise unchanged.
  rationale: The video prompt describes a sequence where the water boils violently, filling the room with
    smoke/steam, which then clears to restore visibility. For the smoke (which originated from the boiling)
    to clear while the burner remains on maximum heat, the physical implication is that the water has
    boiled away or the emission has ceased. Therefore, the final frame should depict the kettle on the
    still-hot burner but with the air clear of the initial steam plume, representing the state after the
    smoke has dissipated.
