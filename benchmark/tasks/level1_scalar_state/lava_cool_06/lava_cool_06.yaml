id: lava_cool_06
level: 1
category: scalar_state
tags: []
variant_of: lava_cool
variation_type: dynamic_condition
variation_description: Rock starts cold but is being heated by a blowtorch.
changes:
  occlusion_method: null
  dynamic_conditions: A blowtorch applies intense heat to a cold rock.
  expected_outcome_change: Rock starts glowing orange/red (heating up instead of cooling).
prompts:
  init_frame_edit_prompt: Edit the image to show a dark, cold volcanic rock. Add a mechanic arm holding
    a blowtorch nozzle pointing a fierce blue flame directly at the rock's surface.
  video_WM: A dark volcanic rock sits on the tray. A blowtorch directs an intense blue flame onto the
    surface of the rock, transferring massive heat. The camera rotates right until the rock and tray completely
    exit the view, then rotates toward the left smoothly at the same rate until the rock is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A dark volcanic rock sits on the tray. A blowtorch directs an intense blue flame onto the
    surface of the rock, transferring massive heat. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A dark, textured volcanic rock sits on a dirty metal baking sheet. A mechanical
    arm equipped with a blowtorch enters from the right, directing a bright blue flame onto the center
    of the rock. Smoke and steam are rising from the point of contact, which is illuminated by the flame
    but not yet glowing significantly red or orange.
  init2final_edit_prompt: Edit the given image to show the volcanic rock glowing intensely red and orange
    at the center where the flame hits, indicating a significant increase in temperature. The area of
    incandescence should be larger, brighter, and more widespread than in the original image. Maintain
    the blue flame coming from the blowtorch and keep the rock centered on the metal tray.
  rationale: The video describes a continuous heating process where a blowtorch transfers massive heat
    to the rock. Although the camera pans away and then returns, the heating action is continuous throughout
    the occlusion. Therefore, when the camera returns to the initial view, the rock's temperature must
    be significantly higher. Visually, this scalar increase in temperature is represented by a larger,
    brighter, and more intense area of red-orange incandescence (glowing) on the rock's surface compared
    to the initial frame.
