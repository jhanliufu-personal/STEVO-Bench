    away and then returns, the inflation action continues throughout the duration of the video. Therefore,
    when the camera returns to the initial viewpoint, the tire must be significantly more inflated than
    it was at the start. The primary visual indicator of this state change is the disappearance of the
    'flat spot' at the bottom of the tire and the lifting of the rim as the tire expands to its full round
    shape.
