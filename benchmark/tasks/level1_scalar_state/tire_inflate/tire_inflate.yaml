id: tire_inflate
level: 1
category: scalar_state
scalar_variable: Tire outer diameter
prompts:
  image_gen_prompt: A flat bicycle tire on a rim. A high-pressure air hose is attached to the valve, and
    the rubber is just starting to push outward.
  video_WM: The air is pumping into the tire at high pressure, and the tire is visibly and rapidly expanding.
    The inflation continues steadily. The camera rotates right until the tire completely exits the view,
    then rotates toward the left smoothly at the same rate until the tire is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The tire is inflating; its diameter is visibly increasing. The high-pressure air inflow continues
    at a constant rate. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
