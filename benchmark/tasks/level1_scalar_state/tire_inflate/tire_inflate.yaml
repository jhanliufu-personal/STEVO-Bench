  init_frame_description: A close-up, low-angle shot of a bicycle wheel resting on a concrete garage floor.
    The tire is currently under-inflated or flat, visible by the significant flattening and squashing
    of the rubber at the bottom contact patch where it meets the ground. A black air hose with a brass
    fitting is connected to the tire's valve stem. In the foreground, a wrench lies on the floor. In the
    background, out of focus, there is a red air compressor, a window, and other garage items.
  init2final_edit_prompt: Edit the given image to show the bicycle tire fully inflated. The tire rubber
    should appear round, taut, and firm, eliminating the flattened, squashed appearance at the bottom
    contact patch seen in the original. The wheel rim should be elevated slightly higher off the ground
    as a result of the tire filling with air. Keep the air hose connected to the valve and ensure all
    background objects and foreground tools remain in their original positions.
