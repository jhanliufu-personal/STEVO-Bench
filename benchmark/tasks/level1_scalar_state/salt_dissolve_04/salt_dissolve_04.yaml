id: salt_dissolve_04
level: 1
category: scalar_state
tags: []
variant_of: salt_dissolve
variation_type: dynamic_condition
variation_description: Material changed from salt to insoluble granite stone.
changes:
  occlusion_method: null
  dynamic_conditions: The block is now solid granite (insoluble) instead of salt.
  expected_outcome_change: No dissolution; block size remains constant.
prompts:
  init_frame_edit_prompt: Edit the image to change the white salt lick into a grey, textured granite stone
    block of the same size. Keep the turbulent water and tank exactly the same.
  video_WM: A solid granite stone block is submerged in a turbulent water tank. The water churns around
    the insoluble stone. The camera rotates right until the tank and stone block completely exit the view,
    then rotates toward the left smoothly at the same rate until the tank is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A solid granite stone block is submerged in a turbulent water tank. The water churns around
    the insoluble stone. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A clear glass tank filled with turbulent water. In the center of the tank, a
    large, cubic block of grey speckled granite is submerged. The water is churning, creating white bubbles
    and foam around the stone. To the right of the tank, black pipes and a vertical heater or sensor are
    visible. The background shows a window with a blurred view of a building.
  init2final_edit_prompt: Edit the given image to show the granite block unchanged in size, shape, and
    texture, submerged in the water. Render new, randomized water turbulence and bubbles around the block,
    but ensure the stone block itself remains identical in dimensions and appearance to the original state.
  rationale: The prompt specifies that the object is a solid granite stone, which is insoluble in water.
    Although the camera rotates away and returns, the physical state of the stone (mass, volume, shape)
    must remain conserved because granite does not dissolve. Therefore, the final frame should show the
    stone exactly as it was initially, with the only differences being the stochastic pattern of the water
    turbulence.
