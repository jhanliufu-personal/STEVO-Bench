id: food_dye_swirl_01
level: 1
category: scalar_state
tags: []
variant_of: food_dye_swirl
variation_type: occlusion_method
variation_description: Replaces camera rotation with a hand blocking the view with a card.
changes:
  occlusion_method: A hand holding a card blocks the lens completely.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A drop of red food coloring contacts the still water surface. The dye is water-soluble. Molecular
    diffusion occurs driven by concentration gradients. The water is stationary with no forced convection.
    A hand holding a large opaque card moves directly in front of the lens, completely blocking the view
    of the glass. The view remains obstructed for several seconds. Then the hand moves away, revealing
    the glass again. No zoom, no cut, no scene change. STOP.
  camera_WM: A drop of red food coloring contacts the still water surface. The dye is water-soluble. Molecular
    diffusion occurs driven by concentration gradients. The water is stationary with no forced convection.
    A hand holding a large opaque card moves directly in front of the lens, completely blocking the view
    of the glass. The view remains obstructed for several seconds. Then the hand moves away, revealing
    the glass again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass tumbler filled with water sits on a white surface. A glass dropper
    containing red liquid is positioned above the center of the glass. A single drop of red dye has just
    impacted the water surface, creating a concentrated, mushroom-shaped red plume suspended near the
    top center of the water. The rest of the water in the glass remains clear and colorless.
  init2final_edit_prompt: Edit the given image to show the red dye significantly more dispersed within
    the water. The concentrated red plume should be expanded in volume, spreading deeper and wider into
    the glass. The edges of the red color should appear softer and more diffuse compared to the sharp
    initial drop. A larger portion of the water should be tinted red or pink, leaving less clear water
    visible than in the original state. Maintain the original camera angle, lighting, glass position,
    and water level.
  rationale: The video prompt describes a process of molecular diffusion occurring over 'several seconds'
    while the view is occluded. Physically, the concentrated dye will naturally spread from areas of high
    concentration to low concentration, expanding the red cloud downwards and outwards even without stirring.
    The occlusion event (the card) implies a passage of time, so when the view is restored, the visual
    state must reflect this progression. The final frame should show the glass revealed again with the
    dye in a more advanced state of diffusion than the initial frame.
