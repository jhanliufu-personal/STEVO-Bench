id: sand_filling_up_jar_00
level: 1
category: scalar_state_change
tags: []
variant_of: sand_filling_up_jar
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts or zoom. Camera is centered on the funnel and jar. Camera
    remains stationary throughout. Lighting and objects remain consistent and realistic.
  camera_WM: Single continuous take, no cuts or zoom. Camera is centered on the funnel and jar. Camera
    remains stationary throughout. Lighting and objects remain consistent and realistic.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass jar sits on a rustic wooden table with a glass funnel placed in
    its opening. Beige sand is pouring from the top of the frame into the funnel, and a stream of sand
    flows from the funnel stem into the jar. Inside the jar, a conical pile of sand has begun to form
    at the bottom.
  init2final_edit_prompt: Edit the given image to show the pile of sand inside the glass jar as significantly
    larger and taller, occupying more of the jar's internal volume. The peak of the sand pile should be
    higher, closer to the funnel's stem. Maintain the stream of sand pouring into the funnel and from
    the funnel into the jar.
  rationale: The video depicts a continuous process of sand pouring into a container. As time passes,
    the physical law of conservation of mass dictates that the accumulation of sand inside the jar must
    increase. Therefore, the primary scalar change is the growth of the sand pile's volume and height
    within the jar. The camera remains stationary, allowing for a direct visual comparison of the sand
    level.
  questions:
  - id: sand_volume_increase
    question: Is the pile of sand inside the jar larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall volume of the sand pile in the jar between the two frames.
  - id: sand_height_increase
    question: Is the peak of the sand pile higher in the jar compared to the starting image?
    answer_type: yes_no
    notes_for_judge: Check if the tip of the cone has moved upward towards the funnel.
  - id: sand_accumulation
    question: Does the sand cover more of the bottom or sides of the jar than before?
    answer_type: yes_no
    notes_for_judge: Look for expansion of the pile's base or width.
  - id: sand_level_up
    question: Is the level of accumulated sand in the jar higher than in the initial frame?
    answer_type: yes_no
    notes_for_judge: General check for vertical growth of the accumulation.
  - id: jar_position_invariant
    question: Is the glass jar in the same position on the table?
    answer_type: yes_no
    notes_for_judge: The jar should not move; only the sand inside changes.
  - id: funnel_presence_invariant
    question: Is the glass funnel still present in the mouth of the jar?
    answer_type: yes_no
    notes_for_judge: The equipment setup should remain consistent.
