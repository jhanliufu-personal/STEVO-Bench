variation_description: Pump attached (inflation) with occlusion by a blocking object.
changes:
  occlusion_method: A large opaque camping bag moves in front of the camera.
  dynamic_conditions: Electric pump attached and running.
  expected_outcome_change: Mattress inflates.
prompts:
  init_frame_edit_prompt: Edit the image to show an electric air pump attached to the valve, plugged into
    the wall.
  video_WM: An electric air pump is attached to the mattress valve and is running loudly. A large opaque
    camping bag moves into the frame and covers the lens, completely blocking the view. The bag then moves
    away to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: An electric air pump is attached to the mattress valve and is running loudly. A large opaque
    camping bag moves into the frame and covers the lens, completely blocking the view. The bag then moves
    away to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A blue air mattress placed on a wooden floor, connected to a black electric
    air pump via a corrugated hose. The pump is plugged into a white wall outlet. The mattress appears
    mostly inflated with some surface undulations. A window and white baseboards are visible in the background.
  init2final_edit_prompt: Edit the given image to make the blue air mattress appear significantly deflated.
    The mattress should look much flatter and less taut, with deep wrinkles, folds, and sagging areas
    on its surface indicating a loss of air volume. The height of the mattress should be noticeably lower
    than in the original image. Keep the black pump connected to the valve with the hose, and ensure the
    background, floor, and wall outlet remain unchanged.
  rationale: The task ID specifies a deflation scenario. The prompt describes the pump running loudly,
    which drives the physical process of air removal. The occlusion by the camping bag covers the duration
    of this process. When the view is restored, the primary scalar change is a reduction in the volume
    of the mattress. The mattress should appear less inflated (flatter, more wrinkled) than in the initial
    frame, assuming the pump was extracting air during the occlusion.
