evaluation:
  init_frame_description: A close-up view of a black electric hot plate with a red indicator light labeled
    'HEATING' illuminated on the front. A cylindrical stick of white chalk stands vertically in the center
    of the circular heating element. Wisps of smoke or steam are rising from the base of the chalk where
    it touches the hot surface.
  init2final_edit_prompt: Edit the given image to show the white chalk stick standing upright at its full
    original height and cylindrical shape. The chalk must appear solid and not melted, pooled, or deformed.
    The red 'HEATING' light on the hot plate must remain illuminated. Smoke or steam should continue to
    be visible rising from the hot plate surface around the base of the chalk.
  rationale: The prompt explicitly identifies the object as chalk (calcium carbonate), which has a decomposition
    temperature far higher than a standard hot plate can reach and does not melt like wax or plastic.
    Despite the passage of time indicated by the lights turning off and back on, the chalk's physical
    state (height, volume, shape) must remain invariant. The correct simulation requires the model to
    apply material science knowledge to resist the visual bias of melting objects on hot surfaces. The
    final state should look nearly identical to the initial state.
