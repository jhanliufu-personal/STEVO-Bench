id: matchstick_burning_09
level: 1
category: scalar_state
tags: []
variant_of: matchstick_burning
variation_type: combined
variation_description: Combined metal rod condition with camera dolly occlusion.
changes:
  occlusion_method: Camera moves backward (dolly out) until the match is a speck.
  dynamic_conditions: Stick is non-flammable metal.
  expected_outcome_change: Flame extinguishes immediately after tip is consumed; stick remains intact
prompts:
  init_frame_edit_prompt: Edit the image to change the wooden stick into a silver metal rod, with only
    the combustible tip burning.
  video_WM: The burning tip sits atop a non-flammable metal rod. Oxygen is available. The camera moves
    backward rapidly, pulling away from the hand until the match is just a tiny, indistinguishable speck
    in the distance. The camera holds this distant position for several seconds. Then the camera moves
    forward smoothly back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The burning tip sits atop a non-flammable metal rod. Oxygen is available. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of a hand holding a thin, silver metal rod. At the tip of the
    rod, there is a burning match head consisting of black charred material and a visible orange flame
    with white smoke rising from it. The background is a plain, out-of-focus beige surface.
  init2final_edit_prompt: Edit the given image to show the match head at the tip of the metal rod as significantly
    more burnt and consumed. Reduce the volume of the combustible material at the tip, making it appear
    as shriveled ash or residue. If a flame is present, it should be consistent with a depleted fuel source,
    or the flame can be extinguished. Keep the metal rod, the hand, and the background exactly as they
    are in the original image.
  rationale: The video prompt describes a camera pulling away and then returning to the original viewpoint
    after several seconds. During this elapsed time, the combustion of the match head continues. Since
    the rod is non-flammable metal, the fire consumes the combustible head material, reducing its mass
    and volume. When the camera returns, the match head should appear more degraded, smaller, or turned
    to ash compared to the initial frame, while the metal rod remains unchanged.
