id: spray_foam_04
level: 1
category: scalar_state
tags: []
variant_of: spray_foam
variation_type: dynamic_condition
variation_description: The foam is already cured and hardened, so no expansion occurs.
changes:
  occlusion_method: null
  dynamic_conditions: Foam is dry and hardened (static state) instead of wet and reacting.
  expected_outcome_change: The foam volume remains constant (no expansion).
prompts:
  init_frame_edit_prompt: Edit the image to make the yellow foam look dry, rigid, and matte, indicating
    it has fully hardened and cured.
  video_WM: The yellow insulation foam is fully cured, rigid, and static. There is no movement or expansion.
    The camera rotates right until the foam completely exits the view, then rotates toward the left smoothly
    at the same rate until the foam is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The yellow insulation foam is fully cured, rigid, and static. There is no movement or expansion.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of yellow expanding spray foam insulation that has cured between
    two vertical wooden studs. The foam is bulbous, textured, and fills the gap near the bottom plate.
    There is sawdust scattered on the wooden floor and bottom plate. The background consists of a brown
    wall board.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it was, ensuring the yellow
    foam insulation retains the exact same volume, shape, and position between the wooden studs without
    any expansion or shrinkage. The sawdust and wooden structures should remain unchanged.
  rationale: The video prompt explicitly states that the foam is fully cured, rigid, and static, meaning
    no physical changes occur to the object. The camera performs a panning motion away from the object
    and then returns to the exact starting position. Therefore, due to object permanence and the lack
    of dynamic physical processes, the final frame should be visually identical to the initial frame.
  questions:
  - id: foam_presence
    question: Is the yellow spray foam visible in the center of the frame?
    answer_type: yes_no
    notes_for_judge: Checks for object permanence after the camera pan.
  - id: foam_volume_stability
    question: Is the volume of the yellow foam approximately the same as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The foam should not have grown or shrunk.
  - id: foam_shape_stability
    question: Does the shape of the foam appear identical to the initial frame?
    answer_type: yes_no
    notes_for_judge: The foam is rigid and static; its contours should not change.
  - id: foam_no_expansion
    question: Has the foam remained the same size without expanding further?
    answer_type: yes_no
    notes_for_judge: Verifies that the model respected the 'fully cured' instruction.
  - id: stud_position
    question: Is the foam still positioned between the two vertical wooden studs?
    answer_type: yes_no
    notes_for_judge: Checks spatial consistency.
  - id: sawdust_consistency
    question: Is the sawdust on the floor visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for background elements.
