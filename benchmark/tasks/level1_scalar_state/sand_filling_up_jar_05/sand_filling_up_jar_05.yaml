id: sand_filling_up_jar_05
level: 1
category: scalar_state_change
tags: []
variant_of: sand_filling_up_jar
variation_type: dynamic_condition
variation_description: The top funnel is already empty.
changes:
  occlusion_method: null
  dynamic_conditions: Top funnel is empty; flow has already finished.
  expected_outcome_change: No change in sand levels (static state).
prompts:
  init_frame_edit_prompt: Edit the image so the top glass funnel is completely empty of sand. The jar
    below contains a pile of sand, but no sand is falling.
  video_WM: Single continuous take, no cuts or zoom. Camera starts centered on the funnel and jar. An
    empty glass funnel sits atop a glass jar containing a pile of sand. No sand is flowing. The camera
    smoothly moves to the right at constant speed until the funnel and jar leave the frame to the left
    and become completely invisible. The camera continues moving right across the room for several seconds.
    Then the camera moves left at the same speed back to the original viewpoint. Lighting and objects
    remain consistent and realistic.
  camera_WM: An empty glass funnel sits atop a glass jar containing a pile of sand. No sand is flowing.
    Lighting and objects remain consistent and realistic. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A clear glass jar sits on a rustic wooden table, containing a conical pile of
    beige granular sand that fills the bottom third of the container. A clear glass funnel rests securely
    in the mouth of the jar. The background consists of a blurred wooden surface, and the lighting is
    soft and natural.
  init2final_edit_prompt: Edit the given image to show the glass jar filled with a significantly larger
    amount of sand. The pile of sand inside the jar should be much taller and wider, occupying a greater
    volume of the jar than before. The sand should appear to be the same beige granular material. Maintain
    the exact camera angle, lighting, and position of the jar and funnel.
  rationale: The task ID implies a 'filling up' scenario. While the prompt describes the initial state
    as static with no sand flowing, the extended camera movement creates a period of full occlusion. We
    assume that during this occlusion, an unobserved action pours sand into the jar, increasing its volume.
    The final frame evaluates whether the world model correctly updates the scalar state (sand volume)
    to reflect this accumulation when the camera returns to the original viewpoint.
  questions:
  - id: sand_height_increase
    question: Is the pile of sand inside the jar taller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical height of the sand pile apex.
  - id: sand_volume_increase
    question: Does the sand occupy a larger volume of the jar compared to the start?
    answer_type: yes_no
    notes_for_judge: Check if the overall amount of sand has increased.
  - id: sand_level_higher
    question: Is the level of the sand higher than it was initially?
    answer_type: yes_no
    notes_for_judge: Look for the fill line relative to the jar's features.
  - id: less_empty_space
    question: Is there less empty space remaining in the jar than before?
    answer_type: yes_no
    notes_for_judge: Inverse check of volume increase.
  - id: jar_fuller
    question: Is the jar fuller than it was in the first frame?
    answer_type: yes_no
    notes_for_judge: General assessment of fullness.
  - id: funnel_presence
    question: Is the glass funnel still sitting on top of the jar?
    answer_type: yes_no
    notes_for_judge: Consistency check for the funnel object.
  - id: background_consistency
    question: Is the wooden surface visible in the background unchanged?
    answer_type: yes_no
    notes_for_judge: Consistency check for the environment.
