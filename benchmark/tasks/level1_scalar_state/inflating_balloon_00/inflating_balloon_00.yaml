id: inflating_balloon_00
level: 1
category: scalar_state
tags: []
variant_of: inflating_balloon
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A white balloon is connected to an open helium tank and is inflating. The balloon and tank
    are positioned in the center of view. Camera remains stationary throughout. No zoom, no cut, no scene
    change. STOP.
  camera_WM: A white balloon is connected to an open helium tank and is inflating. The balloon and tank
    are positioned in the center of view. Camera remains stationary throughout. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A green gas cylinder labeled 'HELIUM' sits on a grassy field. A deflated, wrinkled
    white balloon is attached to the nozzle on the left side of the tank's valve. A gloved hand is positioned
    on the valve handle at the top of the tank. In the background, there is a wire fence and rolling hills
    under a cloudy sky.
  init2final_edit_prompt: Edit the given image to show the white balloon significantly larger and more
    inflated. The balloon should appear expanded, fuller, and tauter, extending further outward from the
    nozzle than in the original view. Keep the green helium tank, the grassy terrain, and the background
    landscape unchanged.
  rationale: The prompt describes a balloon connected to an open helium tank that is actively inflating.
    Physically, this results in a continuous increase in the balloon's volume as gas fills it. The final
    frame should show the balloon in a state of greater expansion compared to the initial deflated state.
    Since the camera is stationary, the background and the tank itself remain static invariants.
  questions:
  - id: balloon_size_increase
    question: Is the white balloon larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall size/area of the white balloon.
  - id: balloon_inflation_state
    question: Does the balloon appear more inflated and fuller than in the starting image?
    answer_type: yes_no
    notes_for_judge: Look for signs of expansion and filling with gas.
  - id: balloon_volume_growth
    question: Has the volume of the balloon increased compared to the start?
    answer_type: yes_no
    notes_for_judge: Assess the 3D volume implied by the 2D shape.
  - id: balloon_extension
    question: Does the balloon extend further from the nozzle than it did initially?
    answer_type: yes_no
    notes_for_judge: Check the length/reach of the balloon relative to the tank.
  - id: balloon_tautness
    question: Does the balloon look less wrinkled and more taut than in the first frame?
    answer_type: yes_no
    notes_for_judge: Inflation typically smooths out deep wrinkles.
  - id: tank_presence
    question: Is the green helium tank still visible in the same position?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: background_consistency
    question: Is the grassy field and background landscape unchanged?
    answer_type: yes_no
    notes_for_judge: Invariant check.
