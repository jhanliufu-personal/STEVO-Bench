  init2final_edit_prompt: Edit the given image to show the white balloon significantly larger and more
    inflated. The balloon should appear expanded, fuller, and tauter, extending further outward from the
    nozzle than in the original view. Keep the green helium tank, the grassy terrain, and the background
    landscape unchanged.
  rationale: The prompt describes a balloon connected to an open helium tank that is actively inflating.
    Physically, this results in a continuous increase in the balloon's volume as gas fills it. The final
    frame should show the balloon in a state of greater expansion compared to the initial deflated state.
    Since the camera is stationary, the background and the tank itself remain static invariants.
