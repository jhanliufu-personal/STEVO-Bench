evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden tray on a wooden counter. On the tray
    sits a clear glass apothecary jar containing white powder (baking soda). A hand enters from the top
    right, holding a clear glass pitcher and pouring a clear liquid (hot vinegar) into the jar. Steam
    is rising from the liquid and the jar. In the background, slightly out of focus, is a bottle of vinegar,
    a knife block, and a kitchen window.
  init2final_edit_prompt: Edit the given image to show the glass jar filled with rising white foam and
    bubbles, with the level of the contents significantly higher than the original powder. Reduce the
    amount of liquid visible inside the glass pitcher held by the hand. Show the mixture in the jar actively
    reacting and expanding, potentially nearing the rim or overflowing.
  rationale: The prompt describes pouring hot vinegar into baking soda, which triggers an immediate and
    vigorous chemical reaction producing carbon dioxide gas. This results in rapid foaming and volume
    expansion (a 'volcano' effect). The camera zooms out and then back into the original framing, meaning
    the final view is identical to the start but captures a later state. Consequently, the final frame
    must show the jar filled with expanded foam rather than dry powder, the level of the substance must
    be higher, and the pitcher should contain less liquid.
