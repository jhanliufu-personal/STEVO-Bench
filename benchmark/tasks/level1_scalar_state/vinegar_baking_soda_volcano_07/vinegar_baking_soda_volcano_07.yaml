evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden kitchen table. In the center, a clear
    glass apothecary jar sits on a rustic wooden tray; the jar is filled about one-third of the way with
    white powder (baking soda). To the left of the jar is a clear glass bottle with a white label reading
    'WATER' in blue text. In the upper right, a hand holds a glass pitcher and is beginning to pour a
    clear liquid into the jar. The background shows a kitchen counter with a knife block, a window on
    the left, and a stove on the right.
  init2final_edit_prompt: Edit the given image to show the glass jar filled to a significantly higher
    level with a mixture of water and wet white powder. The contents of the jar should appear saturated,
    clumpy, or submerged in clear liquid, but strictly without any foam, bubbles, or eruption overflowing
    the rim. The hand holding the pitcher should remain in the upper right, potentially holding the pitcher
    at a different angle or with less liquid inside. The bottle labeled 'WATER' and the wooden tray must
    remain in their original positions.
  rationale: The prompt explicitly states that water is being poured, not vinegar, and clarifies that
    water is neutral and does not react with baking soda to produce gas. Therefore, the expected physical
    outcome is a simple increase in the volume of the jar's contents and a change in the texture of the
    powder from dry to wet. There should be no chemical reaction, foaming, or 'volcano' effect. The occlusion
    event hides the duration of the pour, but the final state reveals the accumulated liquid and wet powder
    without any eruption.
