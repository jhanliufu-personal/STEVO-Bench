prompts:
  init_frame_edit_prompt: Edit the image to make the sparks look very weak, dim, and sputtering, with
    grey smoke rising, as if the sparkler is damp.
  video_WM: The sparkler is damp and sputtering weakly, barely maintaining a flame. A large piece of opaque
    black cardboard slides into the frame from the left, completely blocking the view of the sparkler
    and hand. The cardboard remains in place for several seconds. Then the cardboard slides away to the
    left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The sparkler is damp and sputtering weakly, barely maintaining a flame. A large piece of
    opaque black cardboard slides into the frame from the left, completely blocking the view of the sparkler
    and hand. The cardboard remains in place for several seconds. Then the cardboard slides away to the
    left, revealing the scene again. No zoom, no cut, no scene change. STOP.
