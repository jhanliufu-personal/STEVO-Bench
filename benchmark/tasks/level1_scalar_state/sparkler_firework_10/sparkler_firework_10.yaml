evaluation:
  init_frame_description: A close-up shot against a black background showing a hand holding a lit sparkler.
    The hand, visible on the right with a dark sleeve, holds the wire rod. The sparkler is active, emitting
    a bright burst of yellow-orange sparks and a plume of white and grey smoke rising upwards and to the
    left.
  init2final_edit_prompt: Edit the given image to show the sparkler has almost completely burned out or
    extinguished. Remove the large, bright burst of sparks, leaving at most a tiny glowing tip or a few
    faint, dying sparks. Reduce the density of the smoke to make it look wispy and residual, as if the
    source has stopped. Keep the hand, sleeve, and background identical to the original.
  rationale: 'The prompt establishes that the sparkler is ''damp'' and ''barely maintaining a flame'',
    implying a rapid decrease in combustion intensity compared to the vigorous burning in the initial
    frame. During the ''several seconds'' of occlusion by the cardboard, the struggling flame would likely
    die down significantly or extinguish completely. Therefore, the final frame must show a state of reduced
    energy: fewer or no sparks, dimmer light, and dissipating smoke, reflecting the progression of a dying
    fire over time.'
