id: tank_filling_up_v05
level: 1
category: scalar_state
tags: []
variant_of: tank_filling_up
variation_type: dynamic_condition
variation_description: The water flow is increased to a violent high-pressure torrent.
changes:
  occlusion_method: null
  dynamic_conditions: High velocity flow rate
  expected_outcome_change: Water level rises significantly faster than original
prompts:
  init_frame_edit_prompt: Edit the image to show a massive, violent torrent of water blasting out of the
    pipe at high pressure, creating turbulence and white foam where it hits the water surface in the tank.
  video_WM: Single continuous take, no cuts or zoom. Camera starts centered on the pipe and water tank.
    A massive, high-pressure torrent of water blasts from the pipe into the tank. Then the camera smoothly
    moves to the right at constant speed until the pipe and tank leave the frame to the left and become
    completely invisible. The camera continues moving right across the room for several seconds. Then
    the camera moves left at the same speed back to the original viewpoint. STOP.
  camera_WM: A massive, high-pressure torrent of water blasts from a metal pipe into a transparent cylindrical
    water tank. Lighting and objects remain consistent and realistic. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A large clear cylindrical tank sits in the center of a warehouse with concrete
    floors. The tank has a vertical red measurement scale marked in grams (left) and liters (right). A
    metal pipe extends from the top right, pouring a heavy stream of water into the tank. The water is
    turbulent and splashing, currently filling the bottom portion of the tank. To the left, there are
    stacks of wooden pallets and shelving units. In the background, there are industrial machines and
    a white wall with windows.
  init2final_edit_prompt: Edit the given image so that the water level in the clear cylindrical tank is
    significantly higher. The volume of water inside the tank should occupy much more vertical space,
    reaching a higher point on the red measurement scale than before. Maintain the appearance of the water
    pouring from the pipe with turbulence and splashing, but show the tank in a fuller state.
  rationale: The video prompt describes a continuous high-pressure torrent of water filling the tank.
    The camera pans away, occluding the tank for several seconds while the filling action continues. When
    the camera returns to the original viewpoint, the primary scalar change is the increase in water volume.
    The tank should contain significantly more water than in the initial frame, resulting in a higher
    water level.
