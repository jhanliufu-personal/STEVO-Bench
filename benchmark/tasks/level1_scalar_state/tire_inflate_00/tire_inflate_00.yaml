id: tire_inflate_00
level: 1
category: scalar_state
tags: []
variant_of: tire_inflate
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The air is pumping into the tire at high pressure. The inflation continues steadily. Camera
    remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The air is pumping into the tire at high pressure. The inflation continues steadily. Camera
    remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up side view of a bicycle wheel resting on a concrete garage floor.
    The tire is visibly under-inflated, with a flattened section where it contacts the ground. A black
    air hose with a brass fitting is connected to the tire's valve stem. In the background, there is a
    red air compressor tank and blurred garage details. Several wrenches lie on the floor in the foreground.
  init2final_edit_prompt: Edit the given image to show the bicycle tire significantly more inflated. The
    flattened section of the tire at the bottom where it touches the ground should be rounded out and
    firm. The metal rim should be lifted higher off the concrete floor due to the expansion of the tire.
    Keep the air hose connected and the background tools unchanged.
  rationale: The prompt specifies that air is pumping into the tire steadily. As the air pressure increases,
    the tire will expand to its proper shape. The primary visual change will be the reduction of the flattened
    'contact patch' at the bottom of the tire and the subsequent lifting of the wheel rim away from the
    ground. The camera is stationary, so the background and surrounding tools should remain static.
  questions:
  - id: tire_inflation_status
    question: Does the tire appear more inflated than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall fullness of the tire.
  - id: rim_height
    question: Is the metal rim higher off the ground compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the tire inflates, the radius increases, lifting the rim.
  - id: tire_roundness
    question: Is the bottom section of the tire rounder than it was initially?
    answer_type: yes_no
    notes_for_judge: The flat spot at the bottom should be reduced or eliminated.
  - id: contact_patch
    question: Is the flattened area where the tire touches the ground smaller than before?
    answer_type: yes_no
    notes_for_judge: Inflation reduces the contact patch size.
  - id: hose_connection
    question: Is the air hose still connected to the valve stem?
    answer_type: yes_no
    notes_for_judge: Invariant check.
  - id: tool_stability
    question: Are the wrenches on the floor in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: Invariant check.
