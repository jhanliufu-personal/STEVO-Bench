variation_description: Liquid changed from vinegar to water. No chemical reaction should occur.
changes:
  occlusion_method: null
  dynamic_conditions: Liquid is water instead of vinegar. Water is neutral.
  expected_outcome_change: No foaming or bubbling occurs. The level rises only by the volume of water
