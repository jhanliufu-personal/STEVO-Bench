evaluation:
  init_frame_description: A close-up side view of a hand holding a lit wooden matchstick against a blurred
    beige background. The match head is blackened and charred, with a small orange flame burning at the
    tip and slightly down the shaft. Thin wisps of smoke rise from the flame. The fingers holding the
    match appear slightly dirty or sooty.
  init2final_edit_prompt: Edit the given image to show the matchstick after it has burned further down
    the shaft. The blackened, charred section of the matchstick should be longer, extending closer to
    the fingers. The remaining unburnt light-colored wooden section should be shorter. The flame should
    be positioned lower on the stick at the leading edge of the char. Keep the hand position and background
    identical.
  rationale: The video prompt describes a matchstick burning. Physically, this is an irreversible process
    where the flame consumes the wooden fuel, moving down the stick towards the holder's hand. Over time,
    the scalar quantity of 'charred length' increases, while the 'unburnt wood length' decreases. The
    flame front travels along this path. The camera and hand remain stationary, serving as a reference
    frame for the movement of the flame and the expansion of the charred region.
