id: fuse_burn_00
level: 1
category: scalar_state
tags: []
variant_of: fuse_burn
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fuse is burning rapidly as a spark moves along the black cord. The burning continues at
    a fast, constant rate. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The fuse is burning rapidly as a spark moves along the black cord. The burning continues
    at a fast, constant rate. Camera remains stationary throughout. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a thick, twisted fiber fuse or rope lying on a
    textured concrete floor. The rope extends from the foreground left, curving towards the right and
    looping back into the background. The tip of the rope on the left is ignited, featuring a bright orange
    flame and sparking embers. Smoke is rising from the burning tip. The rope in the foreground is brownish-tan,
    while the section looping in the background appears black. The lighting is dramatic, highlighting
    the texture of the floor and the rope.
  init2final_edit_prompt: Edit the given image to show the fuse has burned further along its length. Move
    the bright orange flame and sparking effect to the right, further along the twisted rope body. The
    section of the rope to the left of the new flame position (where the flame was originally) should
    now appear blackened, charred, and burnt out. Ensure smoke is rising from the new position of the
    flame. Keep the concrete floor and background details identical.
  rationale: The video prompt describes a fuse burning rapidly. Physically, this means the point of combustion
    (the spark/flame) travels along the path of the fuse. Since the flame starts at the left tip, it must
    move to the right along the rope's geometry. As the flame advances, the material behind it (to the
    left) is consumed, turning into ash or char. The scalar state change is the position of the flame
    along the curve $s(t)$ and the reduction in length of the unburnt fuse.
