id: syrup_fill_09
level: 1
category: scalar_state
tags: []
variant_of: syrup_fill
variation_type: combined
variation_description: Slow drip combined with steam occlusion.
changes:
  occlusion_method: Thick steam.
  dynamic_conditions: Slow drip.
  expected_outcome_change: Level rises negligibly.
prompts:
  init_frame_edit_prompt: Edit the image to change the steady stream of syrup into a very slow, intermittent
    drip of individual droplets falling from the spout.
  video_WM: A glass jar is 25% full of syrup. Slow, individual droplets drip from the spout. Thick steam
    fills the room, obscuring the jar completely, then dissipates. No zoom, no cut, no scene change. STOP.
  camera_WM: A glass jar is 25% full of syrup. Slow, individual droplets drip from the spout. Thick steam
    fills the room, obscuring the jar completely, then dissipates. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A clear glass jar sits on a wooden countertop, filled approximately 25% with
    an amber-colored syrup. A metal pour spout is positioned above the jar, with a droplet of syrup falling
    mid-air into the jar. To the left is a worn wooden cutting board. In the background, a window looks
    out onto a forest scene with trees. A ceramic jug is partially visible behind the jar.
  init2final_edit_prompt: Edit the given image to show the glass jar filled with a noticeably higher level
    of amber syrup than in the original image. The liquid level should be significantly above the 25%
    mark, indicating that time has passed and the jar has filled further. Ensure the view is completely
    clear and sharp, with no steam or fog obscuring the scene. The background, lighting, and position
    of the jar and spout should remain unchanged.
  rationale: The prompt describes a filling action (droplets dripping) and an occlusion event (steam filling
    and dissipating). The sequence of steam appearing and then clearing implies a passage of time during
    which the continuous dripping action would accumulate more liquid in the jar. Therefore, the final
    state must show a scalar increase in the volume of syrup (a higher liquid level) and a return to a
    clear, unoccluded view.
  questions:
  - id: syrup_level_higher
    question: Is the level of the syrup in the jar higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the height of the liquid surface relative to the jar's rim.
  - id: volume_increased
    question: Is there more syrup in the jar now compared to the start?
    answer_type: yes_no
    notes_for_judge: Focus on the volume of amber liquid.
  - id: empty_space_reduced
    question: Is the empty space at the top of the jar smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the liquid level rises, the air gap should decrease.
  - id: filling_progress
    question: Does the jar appear to be fuller than it was initially?
    answer_type: yes_no
    notes_for_judge: General impression of filling progress.
  - id: steam_cleared
    question: Is the view clear of the thick steam mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The final frame should be sharp, not foggy.
  - id: spout_presence
    question: Is the metal spout still visible above the jar?
    answer_type: yes_no
    notes_for_judge: Check for object consistency.
  - id: cutting_board_presence
    question: Is the wooden cutting board still visible on the left?
    answer_type: yes_no
    notes_for_judge: Check for background consistency.
