id: fuse_burn_01
level: 1
category: scalar_state
tags: []
variant_of: fuse_burn
variation_type: occlusion_method
variation_description: Occlusion by thick smoke instead of camera rotation
changes:
  occlusion_method: Thick smoke fills the scene, obscuring vision, then dissipates
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fuse is burning rapidly, and the length of the black cord is visibly shortening as the
    spark moves along it. The burning continues at a fast, constant rate. Suddenly, thick white smoke
    billows into the frame, completely obscuring the floor and the fuse from view. The smoke lingers for
    a moment, then rapidly clears away. No zoom, no cut, no scene change. STOP.
  camera_WM: The fuse is burning rapidly, and the length of the black cord is visibly shortening as the
    spark moves along it. The burning continues at a fast, constant rate. Suddenly, thick white smoke
    billows into the frame, completely obscuring the floor and the fuse from view. The smoke lingers for
    a moment, then rapidly clears away. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A thick, textured rope fuse lies on a grey concrete floor, curving from the
    foreground left towards the background right. A bright orange burning spark with flying embers is
    active at the tip of the rope in the lower-left area. The rope appears to be a dark, heavy cord. The
    floor has a rough, industrial texture.
  init2final_edit_prompt: Edit the given image to show that the fuse has burned significantly further
    along its length. Move the bright orange spark and flame further along the rope's path towards the
    right side of the frame. Render the section of the rope where the spark was originally located as
    a trail of black charred ash or scorch marks. Ensure the remaining segment of unburnt rope is visibly
    shorter than in the original image. Maintain the same camera angle and concrete floor background.
  rationale: The prompt describes a continuous burning process that persists even when the view is occluded
    by smoke. Since the burning is 'rapid' and 'constant', the state of the world must evolve during the
    occlusion. The primary scalar change is the position of the spark (moving along the path) and the
    length of the unburnt fuse (decreasing). When the smoke clears, the final frame must show the spark
    advanced along the rope and the unburnt material reduced, leaving a trail of ash or burnt residue
    behind.
