id: tank_filling_up_v07
level: 1
category: scalar_state
tags: []
variant_of: tank_filling_up
variation_type: combined
variation_description: High pressure flow combined with lights-off occlusion.
changes:
  occlusion_method: Lighting change (pitch black)
  dynamic_conditions: High velocity flow rate
  expected_outcome_change: Water level rises significantly faster
prompts:
  init_frame_edit_prompt: Edit the image to show a massive, violent torrent of water blasting out of the
    pipe at high pressure, creating turbulence and white foam where it hits the water surface in the tank.
  video_WM: Single continuous take, no cuts or zoom. Camera is static, centered on the pipe and water
    tank. A massive, high-pressure torrent of water blasts from the pipe into the tank. Suddenly, the
    warehouse lights turn off completely, plunging the scene into pitch black darkness where nothing is
    visible. The darkness lasts for several seconds. Then, the lights turn back on, revealing the scene
    again. STOP.
  camera_WM: Single continuous take, no cuts or zoom. Camera is static, centered on the pipe and water
    tank. A massive, high-pressure torrent of water blasts from the pipe into the tank. Suddenly, the
    warehouse lights turn off completely, plunging the scene into pitch black darkness where nothing is
    visible. The darkness lasts for several seconds. Then, the lights turn back on, revealing the scene
    again. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A large, clear cylindrical tank with red measurement markings stands in the
    center of a warehouse. A metal pipe extends from above, pouring a heavy, turbulent stream of water
    into the tank. The tank is currently filled to roughly the midpoint with churning, bubbly water. In
    the background, there are wooden pallets, industrial shelving, and warehouse lighting fixtures.
  init2final_edit_prompt: Edit the given image to show the water level inside the clear cylindrical tank
    significantly higher than it was initially. The tank should appear much fuller, with the water surface
    closer to the top rim. Maintain the turbulent, bubbly texture of the water and the stream flowing
    from the pipe. Keep the background warehouse environment, lighting, and camera angle exactly the same.
  rationale: The prompt describes a continuous, high-pressure flow of water into the tank. Although the
    scene is occluded by darkness for several seconds, the physical process of filling continues during
    this time. Therefore, when the lights turn back on, the accumulated volume of water must result in
    a noticeably higher water level. The camera remains static, so the background and tank position are
    invariant.
