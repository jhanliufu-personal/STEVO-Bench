id: lava_cool_01
level: 1
category: scalar_state
tags: []
variant_of: lava_cool
variation_type: occlusion_method
variation_description: Replaced camera rotation with a steel shutter blocking the view.
changes:
  occlusion_method: A heavy steel shutter slides down to block the view, then slides up.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A piece of volcanic rock is glowing bright orange and is cooling toward black. The cooling
    continues steadily. A heavy steel shutter slides down from the top until the rock and tray are completely
    hidden, then slides up smoothly at the same rate until the rock is fully visible again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: A piece of volcanic rock is glowing bright orange and is cooling toward black. The cooling
    continues steadily. A heavy steel shutter slides down from the top until the rock and tray are completely
    hidden, then slides up smoothly at the same rate until the rock is fully visible again. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a jagged chunk of volcanic rock sitting on a dirty, stained
    metal baking sheet. The rock is extremely hot, glowing with intense bright orange and yellow light
    emanating from deep cracks and fissures, while the outer crust is black and textured. Wisps of smoke
    or steam are rising from the rock. The background is a dark, out-of-focus industrial setting.
  init2final_edit_prompt: Edit the given image to show the volcanic rock after it has significantly cooled
    down. Transform the bright orange and yellow glowing areas into dark grey or black solidified rock.
    The rock should look extinguished, with little to no visible light or incandescence remaining. Keep
    the metal tray, the smoke, and the background details exactly as they are.
  rationale: The prompt describes a physical process of cooling that continues steadily. Although a shutter
    temporarily blocks the view, it retracts fully by the end of the sequence, leaving the scene unoccluded.
    The primary visual change is the loss of thermal radiation (glow). The rock should transition from
    glowing orange/yellow to a solidified, dark black or grey state as it loses heat. The surrounding
    environment and tray remain static.
  questions:
  - id: lava_cool_01_q1
    question: Is the rock glowing less intensely than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the brightness of the rock's core/cracks. The final frame should show significantly
      less light emission.
  - id: lava_cool_01_q2
    question: Have the bright orange and yellow areas of the rock turned darker?
    answer_type: yes_no
    notes_for_judge: The areas that were previously glowing should now be dark grey or black.
  - id: lava_cool_01_q3
    question: Is the rock mostly black or dark grey in color?
    answer_type: yes_no
    notes_for_judge: The dominant color should shift from orange/yellow to black/grey.
  - id: lava_cool_01_q4
    question: Does the rock appear cooler than it did in the starting image?
    answer_type: yes_no
    notes_for_judge: Evaluate the visual temperature; the rock should look like cold stone rather than
      hot magma.
  - id: lava_cool_01_q5
    question: Are the deep cracks in the rock darker than they were initially?
    answer_type: yes_no
    notes_for_judge: The fissures that were emitting light should now be dark.
  - id: lava_cool_01_q6
    question: Is the rock fully visible again, without being blocked by a shutter?
    answer_type: yes_no
    notes_for_judge: The prompt states the shutter slides up until the rock is fully visible.
  - id: lava_cool_01_q7
    question: Is the metal tray still visible beneath the rock?
    answer_type: yes_no
    notes_for_judge: Consistency check for the environment.
  - id: lava_cool_01_q8
    question: Is the overall brightness of the rock lower than in the first frame?
    answer_type: yes_no
    notes_for_judge: The rock itself should be darker due to the lack of incandescence.
