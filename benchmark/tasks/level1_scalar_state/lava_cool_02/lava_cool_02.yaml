prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A piece of volcanic rock is glowing bright orange and is cooling toward black. The cooling
    continues steadily. Thick white steam erupts from the edges of the frame, swirling and completely
    obscuring the rock and tray, then dissipates smoothly until the rock is clearly visible again. No
    zoom, no cut, no scene change. STOP.
  camera_WM: A piece of volcanic rock is glowing bright orange and is cooling toward black. The cooling
    continues steadily. Thick white steam erupts from the edges of the frame, swirling and completely
    obscuring the rock and tray, then dissipates smoothly until the rock is clearly visible again. No
    zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a jagged, glowing volcanic rock sitting on a dirty metal
    baking sheet. The rock is intensely hot, with bright orange and yellow magma visible through cracks
    in the black crust. Wisps of smoke and heat distortion rise from the rock. The background is a dark,
    blurred industrial setting.
  init2final_edit_prompt: Edit the given image to show the volcanic rock in a cooled state. Change the
    bright glowing orange and yellow magma areas to dark grey and black solidified rock. Reduce the light
    emission significantly so the rock appears mostly dark with perhaps only faint, dull red embers in
    the deepest cracks. Ensure the rock is clearly visible and not obscured by steam or smoke. Keep the
    metal tray and background details consistent with the original view.
  rationale: The video prompt describes a continuous cooling process where the rock transitions from glowing
    bright orange to black. Although a thick cloud of steam obscures the view during the middle of the
    video, the prompt explicitly states that the steam dissipates until the rock is clearly visible again
    by the end. Therefore, the final frame must show the rock in a significantly cooler state (darker,
    less glowing) than the initial frame, with the occlusion fully cleared.
