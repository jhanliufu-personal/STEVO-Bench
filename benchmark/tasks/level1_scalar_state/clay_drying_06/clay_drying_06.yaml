id: clay_drying_06
level: 1
category: scalar_state
tags: []
variant_of: clay_drying
variation_type: dynamic_condition
variation_description: The pot starts fully dry, so no color change occurs.
changes:
  occlusion_method: null
  dynamic_conditions: The pot is already dry (light orange color).
  expected_outcome_change: The pot remains light orange (no change).
prompts:
  init_frame_edit_prompt: Edit the image so the terracotta pot is a uniform light, dry orange color, removing
    the dark wet patches.
  video_WM: A dry, light-orange terracotta pot sits under a heat lamp. The camera rotates right until
    the pot completely exits the view, then rotates toward the left smoothly at the same rate until the
    pot is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A dry, light-orange terracotta pot sits under a heat lamp. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A medium-sized, orange terracotta pot sits centered on a weathered stone pedestal.
    To the right, a silver clamp-style heat lamp with a wire guard shines a bright, warm red light onto
    the pot. Wisps of steam or white vapor are rising from the pot and the area illuminated by the lamp.
    The background shows the blurred interior of a greenhouse with wooden frames.
  init2final_edit_prompt: Edit the given image to make the terracotta pot appear significantly drier.
    Change the pot's color to a lighter, paler, and more chalky orange shade. Remove the visible steam
    and vapor rising from the pot to indicate that the moisture has evaporated. Keep the heat lamp, pedestal,
    and background unchanged.
  rationale: The initial frame shows a terracotta pot under a heat lamp with visible steam rising, indicating
    that the pot is damp and moisture is evaporating. The task ID 'clay_drying' confirms this process.
    The video prompt describes a camera rotation that occludes the pot and then returns to the original
    view. During this unobserved interval, the heat lamp continues to dry the pot. Therefore, in the final
    frame, the pot should appear drier (manifested as a lighter, paler color) and the steam should be
    dissipated or significantly reduced.
  questions:
  - id: q1
    question: Is the terracotta pot lighter in color than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The pot should turn a paler, chalky orange as it dries.
  - id: q2
    question: Is the steam or vapor rising from the pot less visible than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The steam should dissipate as the drying completes.
  - id: q3
    question: Does the pot appear paler and more chalky than it did initially?
    answer_type: yes_no
    notes_for_judge: Visual indicator of dry clay.
  - id: q4
    question: Is the area above the pot clearer of haze or mist compared to the start?
    answer_type: yes_no
    notes_for_judge: Checks for removal of steam.
  - id: q5
    question: Does the pot look drier than it was in the first frame?
    answer_type: yes_no
    notes_for_judge: Overall assessment of the state change.
  - id: q6
    question: Is the heat lamp still positioned to the right of the pot?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: q7
    question: Is the pot still centered in the frame?
    answer_type: yes_no
    notes_for_judge: Consistency check for camera return.
