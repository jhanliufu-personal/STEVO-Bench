id: extending_piston_02
level: 1
category: scalar_state
tags: []
variant_of: extending_piston
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a burst of steam obscuring the view.
changes:
  occlusion_method: Thick white steam fills the frame, obscuring the scene, then dissipates.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hydraulic piston is extending slowly. A thick burst of white steam erupts, completely filling
    the frame and obscuring the excavator arm. The steam slowly dissipates to reveal the scene again.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A hydraulic piston is extending slowly. A thick burst of white steam erupts, completely filling
    the frame and obscuring the excavator arm. The steam slowly dissipates to reveal the scene again.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a green excavator arm mechanism in a
    cluttered industrial setting. The main focus is a large green hydraulic cylinder with a shiny silver
    piston rod partially extended towards the top right. Hydraulic hoses run along the top of the arm.
    In the foreground, a black control lever (joystick) with a ribbed rubber boot sits on a dirty, weathered
    green metal surface. The background contains blurred industrial debris and machinery parts.
  init2final_edit_prompt: Edit the given image so that the hydraulic piston is extended further than in
    the original view. The shiny silver rod protruding from the green cylinder should be significantly
    longer, pushing the attached joint outward to the right. The rest of the scene, including the control
    lever in the foreground and the background debris, should remain unchanged in position and appearance.
  rationale: The video prompt describes a hydraulic piston extending. A temporary occlusion by steam occurs,
    but the prompt explicitly states the steam dissipates to reveal the scene again. Therefore, the final
    frame must show the clear scene with the cumulative result of the extension action that occurred before
    and during the occlusion. The primary scalar change is the increased length of the visible piston
    rod.
