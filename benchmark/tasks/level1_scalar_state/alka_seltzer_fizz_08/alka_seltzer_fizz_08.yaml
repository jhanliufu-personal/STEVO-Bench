evaluation:
  init_frame_description: A clear glass tumbler filled with yellow vegetable oil sits on a white surface.
    A white, round effervescent tablet is suspended in the air directly above the center of the glass.
    The background shows a blurred kitchen interior with natural lighting.
  init2final_edit_prompt: Edit the given image to show the white round tablet resting at the bottom of
    the glass, submerged in the yellow liquid. The tablet must appear solid and intact. Do not add any
    bubbles, foam, or fizzing to the liquid; keep the yellow oil clear and still. Maintain the original
    lighting, background, and glass position.
  rationale: The initial frame shows the tablet in the air, and the prompt implies a sequence where the
    tablet ends up in the oil. Gravity will cause the tablet to fall into the glass. Since the liquid
    is vegetable oil, which lacks water, the effervescent tablet will not react, dissolve, or release
    gas bubbles. It will simply sink and settle at the bottom. The period of darkness (lights off/on)
    acts as a time skip, allowing the tablet to fully settle at the bottom of the glass by the time the
    lights return.
