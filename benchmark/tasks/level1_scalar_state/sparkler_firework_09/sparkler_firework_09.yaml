id: sparkler_firework_09
level: 1
category: scalar_state
tags: []
variant_of: sparkler_firework
variation_type: combined
variation_description: High intensity flare (faster burn) with zoom occlusion.
changes:
  occlusion_method: Camera zoom out.
  dynamic_conditions: High-intensity fast-burning flare.
  expected_outcome_change: Burns down significantly further/faster than standard sparkler.
prompts:
  init_frame_edit_prompt: Edit the image to make the light extremely bright and blinding white, like a
    magnesium flare, illuminating the hand more intensely.
  video_WM: A high-intensity magnesium flare is burning. It consumes fuel rapidly, moving the ignition
    point down the wire quickly. Oxygen is available. The camera zooms out rapidly until the flare becomes
    a tiny point of light and then disappears from view. The camera holds this distant view for several
    seconds. Then the camera zooms back in smoothly to the original framing. No cut, no scene change.
    STOP.
  camera_WM: A high-intensity magnesium flare is burning. It consumes fuel rapidly, moving the ignition
    point down the wire quickly. Oxygen is available. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a hand holding a burning sparkler against a dark background.
    The sparkler is emitting a bright white light with sparks radiating outward. The burning point (ignition
    source) is located on the upper portion of the wire, with a visible length of unburnt wire extending
    down to the hand. Smoke is rising from the flare.
  init2final_edit_prompt: Edit the given image to show the sparkler at a later stage of burning. Move
    the bright burning flare and the source of the sparks significantly lower down the metal wire, closer
    to the fingers holding the stick. The section of wire above the new flame position should appear burnt
    or be absent. Maintain the original hand position and dark background.
  rationale: 'The prompt describes a high-intensity flare that consumes fuel rapidly, causing the ignition
    point to move down the wire. The camera zooms out and holds a distant view for several seconds before
    returning to the original framing. During this occlusion/distant period, the physical process of burning
    continues. Therefore, when the camera returns, the state of the sparkler must have evolved: the flame
    must be positioned lower on the wire, closer to the hand, reflecting the consumption of the fuel over
    time.'
  questions:
  - id: flame_position_lower
    question: Is the burning flare positioned lower on the wire than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the bright light source relative to the top of the
      wire or the hand.
  - id: distance_to_hand
    question: Is the distance between the burning flare and the hand smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The flame should have moved down towards the fingers.
  - id: fuel_consumption
    question: Is there less unburnt wire visible between the flame and the hand compared to the start?
    answer_type: yes_no
    notes_for_judge: As the sparkler burns down, the segment of wire below the flame shortens.
  - id: ignition_point_movement
    question: Has the source of the sparks moved closer to the fingers holding the stick?
    answer_type: yes_no
    notes_for_judge: Directional check for the movement of the fire.
  - id: hand_consistency
    question: Is the hand still visible and holding the wire?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: lighting_consistency
    question: Is the background still dark?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
