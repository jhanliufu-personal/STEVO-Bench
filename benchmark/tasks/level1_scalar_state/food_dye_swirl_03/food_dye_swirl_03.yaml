evaluation:
  init_frame_description: A clear glass tumbler filled with water sits on a white background. A glass
    dropper containing red liquid is positioned above the center. A drop of red dye has just impacted
    the water surface, creating a small mushroom-cloud shape of concentrated red color just below the
    surface and minor ripples on top.
  init2final_edit_prompt: Edit the given image to show the red dye dispersed significantly deeper into
    the water. The concentrated red shape near the surface should be transformed into a larger, more diffuse
    red cloud extending towards the middle and bottom of the glass. The red color should appear less intense
    and spread over a wider volume of the water, showing signs of sinking and diffusion.
  rationale: The prompt describes a scenario where time passes while the view is occluded by fog. During
    this time, the red dye, which is denser than water and carries initial momentum, will sink and diffuse
    into the surrounding stationary water. The primary state change is the expansion of the dye's volume
    and its downward movement. The final frame must show the dye spread out and deeper in the glass, rather
    than as a tight drop near the surface, reflecting the natural progression of diffusion.
