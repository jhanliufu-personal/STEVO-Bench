id: food_dye_swirl_03
level: 1
category: scalar_state
tags: []
variant_of: food_dye_swirl
variation_type: occlusion_method
variation_description: Replaces camera rotation with dense fog obscuring the view.
changes:
  occlusion_method: Thick fog fills the space.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A drop of red food coloring contacts the still water surface. The dye is water-soluble. Molecular
    diffusion occurs driven by concentration gradients. The water is stationary with no forced convection.
    Dense white fog rapidly fills the space between the camera and the glass, completely obscuring the
    scene. The fog remains thick for several seconds. Then the fog clears away, revealing the glass again.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A drop of red food coloring contacts the still water surface. The dye is water-soluble. Molecular
    diffusion occurs driven by concentration gradients. The water is stationary with no forced convection.
    Dense white fog rapidly fills the space between the camera and the glass, completely obscuring the
    scene. The fog remains thick for several seconds. Then the fog clears away, revealing the glass again.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass tumbler filled with water sits on a white background. A glass
    dropper containing red liquid is positioned above the center. A drop of red dye has just impacted
    the water surface, creating a small mushroom-cloud shape of concentrated red color just below the
    surface and minor ripples on top.
  init2final_edit_prompt: Edit the given image to show the red dye dispersed significantly deeper into
    the water. The concentrated red shape near the surface should be transformed into a larger, more diffuse
    red cloud extending towards the middle and bottom of the glass. The red color should appear less intense
    and spread over a wider volume of the water, showing signs of sinking and diffusion.
  rationale: The prompt describes a scenario where time passes while the view is occluded by fog. During
    this time, the red dye, which is denser than water and carries initial momentum, will sink and diffuse
    into the surrounding stationary water. The primary state change is the expansion of the dye's volume
    and its downward movement. The final frame must show the dye spread out and deeper in the glass, rather
    than as a tight drop near the surface, reflecting the natural progression of diffusion.
  questions:
  - id: dye_volume_expansion
    question: Is the red dye spread over a larger volume of water than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the spatial extent of the red color. It should occupy more space in the final
      frame.
  - id: dye_depth
    question: Has the red color sunk deeper into the glass compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The lowest point of the red cloud should be lower in the glass than the initial drop.
  - id: dye_diffusion
    question: Is the red dye more diffuse and less concentrated than the initial drop?
    answer_type: yes_no
    notes_for_judge: The color should look more translucent or cloud-like, less like a solid blob.
  - id: shape_evolution
    question: Has the initial compact mushroom shape expanded or dispersed?
    answer_type: yes_no
    notes_for_judge: The specific tight shape from the start should be gone or significantly grown.
  - id: water_clarity_change
    question: Is the water in the middle of the glass less clear than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The spreading dye should obscure the clarity of the water in the middle section.
  - id: glass_consistency
    question: Is the glass tumbler still visible and intact?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Is the background still a plain white surface?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: dropper_presence
    question: Is the dropper still visible above the water?
    answer_type: yes_no
    notes_for_judge: Unless explicitly removed, the tool usually remains, or at least the question checks
      for consistent scene elements.
