id: matchstick_burning_06
level: 1
category: scalar_state
tags: []
variant_of: matchstick_burning
variation_type: dynamic_condition
variation_description: The stick is metal instead of wood, implying the fire will stop once the combustible
  tip is gone.
changes:
  occlusion_method: null
  dynamic_conditions: Stick is non-flammable metal.
  expected_outcome_change: Flame extinguishes immediately after tip is consumed; stick remains intact
prompts:
  init_frame_edit_prompt: Edit the image to change the wooden stick into a silver metal rod, with only
    the combustible tip burning.
  video_WM: The burning tip sits atop a non-flammable metal rod. Oxygen is available. The camera rotates
    right at constant speed until the matchstick completely exits the view to the right. The camera continues
    rotating right for several seconds while off-screen. Then the camera rotates left smoothly at the
    same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The burning tip sits atop a non-flammable metal rod. Oxygen is available during the occlusion
    period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up of a hand holding a silver metal rod with a matchstick head attached
    to the tip. The match head is currently burning, with a visible orange and yellow flame and smoke
    rising. The tip of the match head is blackened and charred, while the base of the head is still red,
    indicating unburnt fuel. The background is a blurred, neutral beige surface.
  init2final_edit_prompt: Edit the given image to show the match head in a later stage of combustion.
    Change the red unburnt portion of the match tip to black charred ash to indicate the fuel has been
    consumed. Reduce the size of the flame significantly or extinguish it completely, leaving only smoke
    or a faint glow. Keep the metal rod and the hand in their original positions and appearance.
  rationale: The video prompt describes a sequence where the camera looks away from the burning match
    for several seconds before returning. During this period of occlusion, the combustion reaction continues.
    Since the match head has a limited amount of fuel (the red chemical), it will burn down rapidly. When
    the camera returns, the red unburnt section should be largely or entirely replaced by black carbonized
    residue, and the flame should be either much smaller or extinguished due to fuel depletion. The metal
    rod is non-flammable and will not change in length or shape.
  questions:
  - id: fuel_depletion
    question: Is the red unburnt portion of the match head smaller or completely gone compared to the
      initial frame?
    answer_type: yes_no
    notes_for_judge: The red part represents fuel. After time passes, less red should be visible.
  - id: char_accumulation
    question: Is the blackened, charred area of the match head larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the match burns, the black ash area should expand.
  - id: flame_reduction
    question: Is the flame smaller, dimmer, or extinguished compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The flame should die down as fuel runs out.
  - id: rod_integrity
    question: Is the metal rod still visible and approximately the same length?
    answer_type: yes_no
    notes_for_judge: The rod is non-flammable metal and should not burn away.
  - id: hand_presence
    question: Is the hand holding the rod still visible in the frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original view; the hand should still be there.
  - id: overall_state
    question: Does the match head appear more burnt out than it was at the start?
    answer_type: yes_no
    notes_for_judge: General check for the progression of combustion.
