  init2final_edit_prompt: Edit the image to show the blue dye inside the water bowl significantly diffused
    and spread out. The concentrated blue drop shape in the water should be expanded into a larger, softer,
    cloud-like blue swirl or tint that occupies a greater volume of the water. The water should appear
    less clear and more tinted with blue in the center. Remove the distinct falling droplet connecting
    the dropper to the water, implying it has fully merged with the liquid in the bowl. Keep the bowl,
    table, and background identical to the original view.
  rationale: The video prompt describes a sequence where the camera pans away and then returns to the
    original viewpoint after a period of time. During the occlusion, the physical process of diffusion
    occurs. The initial concentrated drop of dye naturally spreads through the water due to fluid dynamics
    and entropy. Therefore, in the final frame, the dye must appear more dispersed, covering a larger
    volume with softer edges compared to the tight, distinct shape in the initial frame. The falling drop
    will have completed its entry into the water.
