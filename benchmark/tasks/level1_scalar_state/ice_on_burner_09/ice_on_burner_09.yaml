id: ice_on_burner_09
level: 1
category: scalar_state
tags: []
variant_of: ice_on_burner
variation_type: combined
variation_description: Wax candle (melting) with camera physically moving backward occlusion.
changes:
  occlusion_method: Camera physically moves backward/away.
  dynamic_conditions: Object is a small wax candle.
  expected_outcome_change: Candle melts into a wax pool.
prompts:
  init_frame_edit_prompt: Edit the image to replace the ice cube with a small red wax votive candle.
  video_WM: A small red wax candle sits on top of an electric cooktop burner. The cooktop display shows
    it is turned on. The camera moves backward, pulling away from the stove until the burner is lost from
    view in the distance of the room. The camera continues moving back for several seconds. Then the camera
    moves forward, returning to the original close-up position of the burner.
  camera_WM: A small red wax candle sits on top of an electric cooktop burner. The cooktop display shows
    it is turned on. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a black glass electric cooktop. A circular heating
    element is glowing bright orange-red, indicating high heat. In the center of the glowing coils sits
    a small, cylindrical red wax candle. The candle is upright but has begun to melt, with a small pool
    of liquid red wax forming at its base. To the right of the burner, a digital red LED display reads
    'ON' and 'HIGH'. Faint smoke or steam is visible rising from the right side of the burner.
  init2final_edit_prompt: Edit the given image to show the red wax candle in a significantly more melted
    state. The vertical height of the cylindrical candle should be lower than in the original image. The
    pool of liquid red wax at the base should be larger, spreading further outward across the glowing
    burner coils. The heating element should remain glowing bright red.
  rationale: 'The initial frame establishes that a wax candle is placed on a burner set to ''HIGH''. The
    video prompt describes a camera movement that pulls away and then returns, implying a duration of
    several seconds to minutes. During this unobserved period, the intense heat from the burner will cause
    the wax to melt rapidly. Therefore, in the final frame, the scalar state of the candle must change:
    the solid mass (height) must decrease, and the liquid volume (puddle area) must increase.'
  questions:
  - id: candle_height_reduction
    question: Is the red candle shorter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical height of the solid wax cylinder.
  - id: wax_pool_expansion
    question: Is the pool of melted red wax larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the liquid wax covers a greater surface area of the burner.
  - id: solid_mass_depletion
    question: Is there less solid wax remaining compared to the start?
    answer_type: yes_no
    notes_for_judge: Assess if the intact portion of the candle has diminished.
  - id: melting_progress
    question: Does the candle appear more melted than it did initially?
    answer_type: yes_no
    notes_for_judge: General assessment of the state change from solid to liquid.
  - id: wax_spread
    question: Is the red wax spread over a wider area of the heating element than before?
    answer_type: yes_no
    notes_for_judge: Directional check on the spread of the liquid.
  - id: burner_state_consistency
    question: Is the heating element still glowing red?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check; the stove was not turned off.
  - id: display_consistency
    question: Is the text 'ON' or 'HIGH' still visible on the cooktop?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for the environment.
