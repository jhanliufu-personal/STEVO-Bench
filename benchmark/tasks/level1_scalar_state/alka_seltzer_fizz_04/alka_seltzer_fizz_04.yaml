id: alka_seltzer_fizz_04
level: 1
category: scalar_state
tags: []
variant_of: alka_seltzer_fizz
variation_type: dynamic_condition
variation_description: Water temperature changed to near freezing, slowing the reaction rate.
changes:
  occlusion_method: null
  dynamic_conditions: Water is ice-cold with floating ice cubes.
  expected_outcome_change: Reaction is significantly slower; tablet dissolves less; fewer bubbles.
prompts:
  init_frame_edit_prompt: Edit the image to show condensation on the outside of the glass and several
    ice cubes floating in the water.
  video_WM: The effervescent tablet contacts the ice-cold water at the bottom of the glass. The low temperature
    significantly reduces the kinetic energy of the molecules. The chemical reaction between the citric
    acid and sodium bicarbonate is temperature-dependent. The camera rotates right at constant speed until
    the glass completely exits the view to the right. The camera continues rotating right for several
    seconds while off-screen. Then the camera rotates left smoothly at the same rate back to the original
    viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The effervescent tablet contacts the ice-cold water at the bottom of the glass. The low temperature
    significantly reduces the kinetic energy of the molecules. The chemical reaction between the citric
    acid and sodium bicarbonate is temperature-dependent. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a clear glass filled with water and ice cubes
    sitting on a white table. A white, round effervescent tablet is suspended in mid-air directly above
    the center of the glass, with a small water droplet connecting it to the surface. The background is
    a blurred kitchen interior with warm lighting.
  init2final_edit_prompt: Edit the given image to show the white effervescent tablet submerged at the
    bottom of the glass or resting among the ice cubes. Remove the tablet from the air above the glass.
    Add visible gas bubbles and a fizzy texture throughout the water to indicate the tablet is dissolving.
    Ensure the water looks slightly cloudier than the clear initial state due to the effervescence. Keep
    the camera angle, lighting, and background identical to the original image.
  rationale: The video prompt describes the tablet contacting the water and the camera panning away and
    returning. During the elapsed time while the camera is looking away, gravity will pull the tablet
    into the glass. Upon contact with the water, the tablet will begin to dissolve and generate carbon
    dioxide bubbles. Although the prompt specifies cold water (which slows the reaction rate), the reaction
    will still occur, resulting in visible bubbles and the tablet being submerged by the time the camera
    returns.
