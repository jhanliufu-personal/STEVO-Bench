id: syrup_fill_03
level: 1
category: scalar_state
tags: []
variant_of: syrup_fill
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to thick steam obscuring the view.
changes:
  occlusion_method: Thick steam fills the frame.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (jar fills behind the steam).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A glass jar is 25% full of syrup. A steady stream pours in, and the level is visibly rising.
    Thick white steam billows across the frame, completely obscuring the jar and spout from view, then
    dissipates. No zoom, no cut, no scene change. STOP.
  camera_WM: A glass jar is 25% full of syrup. A steady stream pours in, and the level is visibly rising.
    Thick white steam billows across the frame, completely obscuring the jar and spout from view, then
    dissipates. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A clear glass jar sits on a wooden table, partially filled with amber-colored
    syrup. A metal spout enters from the top right, pouring a stream of syrup into the jar. Bubbles are
    visible on the surface of the liquid. In the background, there is a wooden cutting board and a window
    view of trees.
  init2final_edit_prompt: Edit the given image to show the glass jar filled with significantly more syrup.
    Raise the level of the amber liquid so it is much higher in the jar than the original level, reducing
    the empty space at the top. Ensure the view is clear and not obscured by steam.
  rationale: The video prompt describes a continuous pouring action ('steady stream') that occurs while
    the view is temporarily obscured by steam. Since the stream is steady and the level is 'visibly rising',
    the primary state change during the occluded period is the accumulation of liquid. When the steam
    dissipates, the jar must contain a noticeably higher volume of syrup than in the initial frame.
  questions:
  - id: q1_level_height
    question: Is the level of the syrup in the jar higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the liquid height relative to the jar's rim or features.
  - id: q2_volume_increase
    question: Does the jar appear to contain more liquid volume than it did at the start?
    answer_type: yes_no
    notes_for_judge: Assess the total amount of amber liquid visible.
  - id: q3_empty_space
    question: Is the empty space at the top of the jar smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The air gap between the liquid surface and the rim should decrease.
  - id: q4_steam_cleared
    question: Is the jar clearly visible without being obscured by thick white steam?
    answer_type: yes_no
    notes_for_judge: The prompt states the steam dissipates, so the final view should be clear.
  - id: q5_liquid_color
    question: Is the liquid inside the jar still an amber/brown color?
    answer_type: yes_no
    notes_for_judge: Consistency check for the fluid type.
  - id: q6_background_consistency
    question: Is the wooden cutting board still visible in the background?
    answer_type: yes_no
    notes_for_judge: Consistency check for the environment.
  - id: q7_jar_fullness
    question: Is the jar fuller than it was in the first frame?
    answer_type: yes_no
    notes_for_judge: General comparative check.
