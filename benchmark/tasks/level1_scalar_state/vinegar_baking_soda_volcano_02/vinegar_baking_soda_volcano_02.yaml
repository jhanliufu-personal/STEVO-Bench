evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table with a rustic wooden tray. On the
    tray sits a clear glass apothecary jar containing white powder (baking soda). To the right, a hand
    holds a glass pitcher filled with clear liquid (vinegar), positioned as if ready to pour into the
    jar. In the background, there is a bottle of vinegar, a knife block, and a kitchen window.
  init2final_edit_prompt: Edit the given image so that the glass jar is filled with rising white bubbly
    foam instead of just powder. The level of the white substance in the jar should be significantly higher
    than in the original image, possibly overflowing the rim onto the wooden tray. The glass pitcher held
    by the hand should contain less liquid than before.
  rationale: The prompt describes pouring vinegar into baking soda, which initiates an acid-base reaction
    releasing carbon dioxide gas. This creates a rapidly expanding foam. The sequence includes a period
    of darkness which acts as a time-skip. When the lights turn back on, the reaction has progressed,
    meaning the volume of the substance in the jar must have increased significantly (turning from powder
    to rising foam), and the source container (pitcher) must have less liquid.
