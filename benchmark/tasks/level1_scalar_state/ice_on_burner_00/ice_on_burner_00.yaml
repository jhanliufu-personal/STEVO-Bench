evaluation:
  init_frame_description: A close-up, high-angle shot of a black glass-ceramic electric stovetop. A circular
    heating element is glowing bright orange-red, indicating it is very hot. A single clear ice cube sits
    in the center of the glowing coil. There is a pool of liquid water forming around the base of the
    ice, and white steam is rising from the burner. To the right of the burner, a red digital display
    reads 'ON' and 'HIGH'.
  init2final_edit_prompt: Edit the given image to show the ice cube significantly reduced in size due
    to melting. The remaining piece of ice should appear much smaller and more rounded than in the original
    image. Maintain the glowing red appearance of the heating coil and the 'ON HIGH' text on the display
    exactly as they are. Ensure steam is still visible rising from the hot surface.
  rationale: The scene depicts an ice cube on a burner set to 'HIGH'. The physical process governing this
    scene is rapid heat transfer leading to a phase change (melting). As time progresses, the scalar quantity
    of the ice's mass and volume must decrease. The ice cube will shrink, lose its sharp edges, and turn
    into liquid water and steam. The camera is stationary, so the stove interface and background remain
    invariant.
