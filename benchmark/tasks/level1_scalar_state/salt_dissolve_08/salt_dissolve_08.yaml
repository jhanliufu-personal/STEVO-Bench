id: salt_dissolve_08
level: 1
category: scalar_state
tags: []
variant_of: salt_dissolve
variation_type: combined
variation_description: Plastic wrapped block (Condition) + Lights off (Method).
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Block is wrapped in waterproof plastic.
  expected_outcome_change: No dissolution (protected by plastic).
prompts:
  init_frame_edit_prompt: Edit the image to show the salt lick tightly wrapped in clear, reflective plastic
    cling film. Keep the turbulent water.
  video_WM: A salt lick, tightly wrapped in waterproof plastic film, is submerged in a turbulent water
    tank. Suddenly, the lights turn off, leaving the scene in total darkness. After a moment, the lights
    turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: A salt lick, tightly wrapped in waterproof plastic film, is submerged in a turbulent water
    tank. Suddenly, the lights turn off, leaving the scene in total darkness. After a moment, the lights
    turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A rectangular glass tank filled with water containing a large, cubic salt lick
    block. The block is tightly wrapped in clear, crinkled waterproof plastic film. The water is turbulent,
    with numerous bubbles and surface agitation visible above and around the block. A black heater or
    pump mechanism is visible on the right side of the tank, and pipes are visible on the left.
  init2final_edit_prompt: Edit the given image to show the scene after a short duration. The salt block
    must remain exactly the same size, shape, and volume as the initial frame, appearing completely undissolved
    due to the waterproof plastic wrapping. The plastic film should remain intact and visible around the
    block. The water should continue to look turbulent with a new, random arrangement of bubbles and surface
    agitation, distinct from the initial frame. The water level should remain unchanged.
  rationale: The salt lick is explicitly described as being wrapped in waterproof plastic film. This barrier
    prevents the water from contacting the salt, meaning no dissolution can occur despite the turbulence
    and the passage of time. Therefore, the mass and volume of the block must remain constant (scalar
    change is zero). The only expected visual changes are the stochastic movements of the bubbles and
    water turbulence.
