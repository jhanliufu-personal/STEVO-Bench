id: food_dye_swirl_05
level: 1
category: scalar_state
tags: []
variant_of: food_dye_swirl
variation_type: dynamic_condition
variation_description: Changes the liquid to vegetable oil. Water-based dye is immiscible.
changes:
  occlusion_method: null
  dynamic_conditions: Liquid is hydrophobic oil; dye is hydrophilic.
  expected_outcome_change: Dye forms distinct spherical beads that sink without spreading/diffusing.
prompts:
  init_frame_edit_prompt: Edit the image to change the liquid in the glass to a slightly yellow, viscous
    vegetable oil.
  video_WM: A drop of water-based red food coloring contacts the surface of vegetable oil. The dye is
    hydrophilic, while the oil is hydrophobic. The liquids are immiscible. The oil is stationary. The
    camera rotates right at constant speed until the glass completely exits the view to the right. The
    camera continues rotating right for several seconds while off-screen. Then the camera rotates left
    smoothly at the same rate back to the original viewpoint, bringing the glass back into view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: A drop of water-based red food coloring contacts the surface of vegetable oil. The dye is
    hydrophilic, while the oil is hydrophobic. The liquids are immiscible. The oil is stationary. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A clear glass tumbler filled with a yellow liquid, likely oil, set against a
    white background. Inside the liquid, a complex, swirling plume of red liquid is suspended in the center.
    Above the liquid surface, a glass dropper containing red liquid is positioned, with a drop of red
    liquid hanging from the tip, ready to fall. There is also a small amount of red liquid resting on
    the surface tension of the yellow liquid.
  init2final_edit_prompt: Edit the given image to show the effects of gravity on the denser red liquid
    over time. Remove the red drop hanging from the tip of the dropper. Move the suspended red plume downwards
    so that it accumulates at the bottom of the glass, forming a settled red layer or pool. Ensure the
    yellow liquid remains clear and translucent, not tinted orange or pink, maintaining a sharp separation
    between the red and yellow liquids.
  rationale: The prompt specifies that the red dye is water-based and the yellow liquid is hydrophobic
    oil, and that they are immiscible. Since water is denser than oil, the red dye will sink through the
    yellow liquid over time. Because they are immiscible, the dye will not dissolve or diffuse to tint
    the oil; instead, it will remain distinct and settle at the bottom. The camera motion implies a passage
    of time sufficient for the drop to fall and the suspended plume to sink significantly.
  questions:
  - id: dye_height_1
    question: Is the main body of the red liquid lower in the glass than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: 'Tests the primary scalar change: vertical position (sinking) due to density.'
  - id: dye_accumulation_1
    question: Is there a collection of red liquid at the bottom of the glass?
    answer_type: yes_no
    notes_for_judge: Tests the accumulation of the denser fluid at the bottom.
  - id: dropper_state_1
    question: Has the drop hanging from the dropper tip fallen?
    answer_type: yes_no
    notes_for_judge: Tests the progression of the immediate physical action.
  - id: immiscibility_1
    question: Is the yellow liquid still clear and distinct from the red dye, rather than being uniformly
      tinted?
    answer_type: yes_no
    notes_for_judge: Tests the 'immiscible' constraint; the oil should not turn orange/pink.
  - id: dye_separation_1
    question: Does the red liquid appear as a distinct phase separated from the yellow liquid?
    answer_type: yes_no
    notes_for_judge: Verifies that the liquids have not mixed.
  - id: plume_descent_1
    question: Is the center of the red mass closer to the bottom of the glass than to the surface?
    answer_type: yes_no
    notes_for_judge: Directional check on the sinking motion.
  - id: glass_consistency_1
    question: Is the glass tumbler in the same position and orientation as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency_1
    question: Is the background still plain white?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
