id: extending_piston_07
level: 1
category: scalar_state
tags: []
variant_of: extending_piston
variation_type: combined
variation_description: Piston retracting + Occlusion by a construction worker walking past.
changes:
  occlusion_method: A construction worker walks in front of the camera.
  dynamic_conditions: Piston is retracting.
  expected_outcome_change: Rod becomes shorter/less visible.
prompts:
  init_frame_edit_prompt: Edit the image so the silver piston rod is extended significantly further out
    than in the original.
  video_WM: A hydraulic piston is retracting. A construction worker walks close to the lens from left
    to right, completely blocking the view with their high-visibility vest, then exits the frame to reveal
    the machinery again. No zoom, no cut, no scene change. STOP.
  camera_WM: A hydraulic piston is retracting. A construction worker walks close to the lens from left
    to right, completely blocking the view with their high-visibility vest, then exits the frame to reveal
    the machinery again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a green excavator's hydraulic arm mechanism. A large hydraulic
    cylinder is prominent diagonally across the frame, with its shiny silver rod extended outwards towards
    the top right. The cylinder body is green, weathered, and covered in grease stains. In the lower foreground,
    a black control lever with a ribbed rubber boot is visible on a dirty metal surface. The background
    is blurred and shows indistinct construction site elements.
  init2final_edit_prompt: Edit the given image to show the hydraulic piston in a retracted position. Shorten
    the visible length of the shiny silver rod significantly, making it appear as though it has withdrawn
    into the green cylinder housing. Move the attachment point at the end of the rod closer to the cylinder
    body to reflect this retraction. Ensure the scene is clear of any people or obstructions, maintaining
    the original background and foreground machinery details.
  rationale: The video prompt describes the hydraulic piston retracting. This is a scalar change where
    the length of the exposed piston rod decreases. Although a worker occludes the view during the video,
    the prompt states they exit the frame, so the final state should be a clear view of the machinery
    again. The key difference is that the silver rod should be shorter (retracted into the cylinder) compared
    to the initial extended state.
  questions:
  - id: rod_length_shorter
    question: Is the visible length of the shiny silver piston rod shorter than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the length of the chrome/silver part of the hydraulic cylinder. It should
      be shorter in the final frame.
  - id: piston_retracted_state
    question: Does the hydraulic cylinder appear to be in a more retracted state compared to the start?
    answer_type: yes_no
    notes_for_judge: Retracted means the rod is inside the cylinder, making the overall assembly shorter.
  - id: attachment_point_closer
    question: Is the joint at the end of the piston rod closer to the green cylinder body than before?
    answer_type: yes_no
    notes_for_judge: As the piston retracts, the end point moves closer to the base.
  - id: less_chrome_visible
    question: Is there less of the chrome rod surface area visible than in the initial image?
    answer_type: yes_no
    notes_for_judge: Direct consequence of retraction.
  - id: worker_gone
    question: Is the view clear of the construction worker mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the worker exits the frame.
  - id: machinery_visible
    question: Is the green hydraulic machinery visible again after the occlusion?
    answer_type: yes_no
    notes_for_judge: Verifies the occlusion has ended.
  - id: lever_invariant
    question: Is the black control lever in the foreground still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
