id: ice_on_burner_03
level: 1
category: scalar_state
tags: []
variant_of: ice_on_burner
variation_type: occlusion_method
variation_description: Occlusion changed to camera zooming out until details are lost.
changes:
  occlusion_method: Camera zooms out until the burner is too small to see state.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A clear ice cube sits on top of an electric cooktop burner. The cooktop display shows it is
    turned on. The camera zooms out rapidly and continuously until the entire kitchen is visible and the
    burner is just a tiny, indistinguishable speck in the distance. The camera holds this wide shot for
    several seconds. The camera then zooms back in to the original framing of the burner.
  camera_WM: A clear ice cube sits on top of an electric cooktop burner. The cooktop display shows it
    is turned on. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a black glass electric cooktop. A circular heating
    element is glowing bright orange-red. In the center of the hot coil sits a clear, cubic block of ice.
    A small puddle of melted water surrounds the base of the ice. To the right, a digital display reads
    'ON' and 'HIGH' in red LED segments. Steam is faintly visible.
  init2final_edit_prompt: Edit the given image to show the ice cube significantly reduced in size or completely
    melted into a puddle. Increase the amount of liquid water spreading across the heating element. Add
    more visible steam rising from the burner. Keep the heating element glowing orange-red and the digital
    display unchanged.
  rationale: The video prompt describes a sequence where the camera zooms out, holds for several seconds,
    and then zooms back in to the original view. During this elapsed time, the ice cube remains on the
    burner set to 'HIGH'. Physically, the intense heat will cause the ice to melt rapidly. Therefore,
    in the final frame (which returns to the initial viewpoint), the ice cube must be significantly smaller
    or entirely converted to liquid water, with more steam generated by the phase change.
  questions:
  - id: ice_volume_reduction
    question: Is the ice cube smaller than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the size of the solid ice block. It should be noticeably smaller or gone.
  - id: water_volume_increase
    question: Is there more liquid water visible on the burner than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for a larger puddle or boiling water replacing the ice.
  - id: phase_change_solid_to_liquid
    question: Has the solid ice mass decreased compared to the start?
    answer_type: yes_no
    notes_for_judge: The solid portion should be diminished.
  - id: steam_presence
    question: Is there steam or vapor visible indicating evaporation?
    answer_type: yes_no
    notes_for_judge: Steam should be present due to the high heat.
  - id: burner_state_consistency
    question: Is the heating element still glowing red?
    answer_type: yes_no
    notes_for_judge: The burner was on HIGH and the prompt implies a continuous shot, so it should remain
      hot.
  - id: display_consistency
    question: Is the digital display showing 'ON' or 'HIGH' still visible?
    answer_type: yes_no
    notes_for_judge: The interface elements should remain consistent.
  - id: ice_shape_degradation
    question: Have the sharp edges of the ice cube become more rounded or melted away?
    answer_type: yes_no
    notes_for_judge: Melting smooths out the cubic shape.
