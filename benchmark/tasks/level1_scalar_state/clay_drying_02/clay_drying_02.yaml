prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A wet, dark terracotta pot is under a hot lamp. Thick white fog rapidly fills the greenhouse,
    completely obscuring the pot and lamp from view. The fog then dissipates until the scene is clear
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: A wet, dark terracotta pot is under a hot lamp. Thick white fog rapidly fills the greenhouse,
    completely obscuring the pot and lamp from view. The fog then dissipates until the scene is clear
    again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a dark, wet terracotta pot sitting on a stone pedestal inside
    a greenhouse. A metal heat lamp with a wire guard and a glowing red bulb is positioned to the right,
    shining directly onto the side of the pot. A circular patch on the pot where the light hits is lighter
    in color and dry, showing cracked clay texture. Steam or mist is rising from the damp pot.
  init2final_edit_prompt: Edit the given image to show the terracotta pot in a significantly drier state.
    The dark, wet areas of the clay surface should appear lighter in color, similar to the dry patch.
    The area of light-colored, dry clay should be expanded, covering more of the pot's surface than before.
    Ensure the scene is completely clear of any fog or mist, returning to high visibility.
  rationale: The video prompt describes a sequence where thick fog obscures the scene and then clears.
    During this elapsed time, the heat lamp remains active, continuing to heat the wet pot. Physically,
    this causes evaporation, meaning the pot must appear drier in the final frame than in the initial
    frame. Visually, drying terracotta changes from dark red/brown to a lighter, chalky orange. Therefore,
    the final frame must show the pot with a larger dry surface area and less visible moisture, while
    the environment returns to a clear state after the fog dissipates.
