id: clay_drying_02
level: 1
category: scalar_state
tags: []
variant_of: clay_drying
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to thick fog filling the greenhouse.
changes:
  occlusion_method: Thick white fog fills the space, obscuring visibility.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A wet, dark terracotta pot is under a hot lamp. Thick white fog rapidly fills the greenhouse,
    completely obscuring the pot and lamp from view. The fog then dissipates until the scene is clear
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: A wet, dark terracotta pot is under a hot lamp. Thick white fog rapidly fills the greenhouse,
    completely obscuring the pot and lamp from view. The fog then dissipates until the scene is clear
    again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a dark, wet terracotta pot sitting on a stone pedestal inside
    a greenhouse. A metal heat lamp with a wire guard and a glowing red bulb is positioned to the right,
    shining directly onto the side of the pot. A circular patch on the pot where the light hits is lighter
    in color and dry, showing cracked clay texture. Steam or mist is rising from the damp pot.
  init2final_edit_prompt: Edit the given image to show the terracotta pot in a significantly drier state.
    The dark, wet areas of the clay surface should appear lighter in color, similar to the dry patch.
    The area of light-colored, dry clay should be expanded, covering more of the pot's surface than before.
    Ensure the scene is completely clear of any fog or mist, returning to high visibility.
  rationale: The video prompt describes a sequence where thick fog obscures the scene and then clears.
    During this elapsed time, the heat lamp remains active, continuing to heat the wet pot. Physically,
    this causes evaporation, meaning the pot must appear drier in the final frame than in the initial
    frame. Visually, drying terracotta changes from dark red/brown to a lighter, chalky orange. Therefore,
    the final frame must show the pot with a larger dry surface area and less visible moisture, while
    the environment returns to a clear state after the fog dissipates.
  questions:
  - id: drying_color_change
    question: Is the surface of the pot lighter in color overall compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Wet terracotta is dark; dry terracotta is light. The pot should look lighter.
  - id: dry_patch_expansion
    question: Is the light-colored dry patch on the pot larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The dry area should have expanded due to the heat lamp.
  - id: wet_area_reduction
    question: Is the area of dark, wet clay smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the pot dries, the dark wet area should recede.
  - id: fog_dissipation
    question: Is the scene clear of the thick white fog described in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the fog dissipates until the scene is clear again.
  - id: lamp_consistency
    question: Is the heat lamp still visible and positioned to the right of the pot?
    answer_type: yes_no
    notes_for_judge: The camera did not move, so the lamp should remain in place.
  - id: pedestal_consistency
    question: Is the stone pedestal still visible beneath the pot?
    answer_type: yes_no
    notes_for_judge: The environment should remain consistent.
  - id: texture_consistency
    question: Does the newly dried area show a matte or chalky texture consistent with the initial dry
      patch?
    answer_type: yes_no
    notes_for_judge: The texture should match the dry clay shown in the first frame.
