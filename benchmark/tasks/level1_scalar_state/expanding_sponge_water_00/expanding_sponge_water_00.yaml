evaluation:
  init_frame_description: A close-up, high-angle shot of a wooden countertop. In the center is a shallow,
    white, oval-shaped dish containing a thin, dry, beige rectangular sponge. The sponge appears compressed
    and flat. Above the dish, a hand holds a clear glass pitcher filled with water, tilted as if pouring.
    A small stream or droplet of water is just beginning to fall from the spout towards the sponge.
  init2final_edit_prompt: Edit the given image to show the sponge significantly expanded and swollen with
    water. The sponge should appear much thicker and taller than in the original image, rising vertically
    from the dish. The texture of the sponge should look wet and saturated. Show water pooled in the bottom
    of the white dish around the base of the sponge.
  rationale: The video prompt describes water being poured onto a compressed dry sponge. Physically, compressed
    cellulose sponges absorb water rapidly through capillary action, which causes the compressed fibers
    to swell and return to their original, uncompressed shape. This results in a significant increase
    in the sponge's volume, specifically its height/thickness. The final state should depict this expansion
    and the presence of water.
