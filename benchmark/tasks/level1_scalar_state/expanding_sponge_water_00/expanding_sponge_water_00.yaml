id: expanding_sponge_water_00
level: 1
category: scalar_state
tags: []
variant_of: expanding_sponge_water
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Water is poured over the compressed dry sponge. The sponge is made of porous cellulose material
    compressed to remove air. When dry sponges contact water, capillary forces draw liquid into the pore
    spaces. Camera remains stationary throughout. No zoom, no cut, no scene change.
  camera_WM: Water is poured over the compressed dry sponge. The sponge is made of porous cellulose material
    compressed to remove air. When dry sponges contact water, capillary forces draw liquid into the pore
    spaces. Camera remains stationary throughout. No zoom, no cut, no scene change.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a wooden countertop. In the center is a shallow,
    white, oval-shaped dish containing a thin, dry, beige rectangular sponge. The sponge appears compressed
    and flat. Above the dish, a hand holds a clear glass pitcher filled with water, tilted as if pouring.
    A small stream or droplet of water is just beginning to fall from the spout towards the sponge.
  init2final_edit_prompt: Edit the given image to show the sponge significantly expanded and swollen with
    water. The sponge should appear much thicker and taller than in the original image, rising vertically
    from the dish. The texture of the sponge should look wet and saturated. Show water pooled in the bottom
    of the white dish around the base of the sponge.
  rationale: The video prompt describes water being poured onto a compressed dry sponge. Physically, compressed
    cellulose sponges absorb water rapidly through capillary action, which causes the compressed fibers
    to swell and return to their original, uncompressed shape. This results in a significant increase
    in the sponge's volume, specifically its height/thickness. The final state should depict this expansion
    and the presence of water.
  questions:
  - id: sponge_height_increase
    question: Is the sponge taller than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical thickness of the sponge in the final frame to the initial frame.
      It should be noticeably thicker.
  - id: sponge_volume_expansion
    question: Does the sponge appear to have expanded in volume compared to the start?
    answer_type: yes_no
    notes_for_judge: The overall size, particularly thickness, should be larger.
  - id: sponge_wetness
    question: Does the sponge appear wet or saturated?
    answer_type: yes_no
    notes_for_judge: Look for darkening of color, glistening, or water texture on the sponge.
  - id: water_presence
    question: Is there water visible in the dish or on the sponge?
    answer_type: yes_no
    notes_for_judge: Check for a pool of water in the dish or water soaking the sponge.
  - id: sponge_thickness_comparison
    question: Is the sponge thicker than the flat sheet seen in the initial image?
    answer_type: yes_no
    notes_for_judge: Direct comparison of thickness.
  - id: dish_consistency
    question: Is the white dish still present and in the same location?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: surface_consistency
    question: Is the wooden countertop surface visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
