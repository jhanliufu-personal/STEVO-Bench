id: clay_drying_07
level: 1
category: scalar_state
tags: []
variant_of: clay_drying
variation_type: combined
variation_description: Lamp is off (no drying) and occlusion is by a blocking object.
changes:
  occlusion_method: A large piece of cardboard blocks the view.
  dynamic_conditions: The heat lamp is unlit.
  expected_outcome_change: The pot remains dark and wet.
prompts:
  init_frame_edit_prompt: Edit the image so the heat lamp bulb is dark and unlit, and remove the bright
    orange glow on the pot.
  video_WM: A wet, dark terracotta pot sits under an unlit lamp. A large piece of cardboard is placed
    directly in front of the camera lens, completely blocking the view. After a short duration, the cardboard
    is removed to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: A wet, dark terracotta pot sits under an unlit lamp. A large piece of cardboard is placed
    directly in front of the camera lens, completely blocking the view. After a short duration, the cardboard
    is removed to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A dark, wet terracotta pot sits on a weathered stone pedestal in a greenhouse
    environment. To the right, a metal clamp lamp with a silver reflector is positioned facing the pot;
    the lamp is unlit and the bulb is dark. A visible haze or steam is rising from the top of the pot,
    suggesting the clay is warm or the environment is humid. The background features the blurred wooden
    frame of the greenhouse and greenery.
  init2final_edit_prompt: Edit the given image to show the terracotta pot in a drier state. Change the
    dark, wet reddish-brown color of the clay to a lighter, matte orange or pinkish terracotta color,
    particularly expanding the lighter dry patches on the surface. Reduce or remove the visible steam
    or haze above the pot to imply it has dissipated. Keep the lamp unlit and the background and camera
    angle identical to the original.
  rationale: The initial frame displays a wet pot with visible steam, indicating that the clay is hot
    or actively evaporating moisture despite the lamp being unlit. During the occlusion period ('short
    duration'), the residual heat drives the evaporation process. Therefore, the physical state evolves
    by the clay drying (turning lighter in color) and the steam dissipating. The evaluation focuses on
    the directional change in moisture content (visible as color change) and the reduction of steam.
