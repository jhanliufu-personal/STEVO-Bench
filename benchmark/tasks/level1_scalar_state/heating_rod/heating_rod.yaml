evaluation:
  init_frame_description: A close-up industrial view of a thick steel rod passing horizontally through
    a helical copper induction coil. The section of the rod inside the coil is glowing a dull, faint red
    due to heating. Wisps of smoke or steam are rising from the heated area. The coil is made of copper
    tubing and surrounds the rod. Below the assembly, the machine bed is covered in dark metal shavings
    and debris. The background is dark and out of focus.
  init2final_edit_prompt: Edit the image to make the glowing section of the steel rod inside the coil
    significantly brighter and more intense in color, shifting from the original dull red to a bright
    orange or yellow-orange to simulate a higher temperature. Keep the copper coil, the unheated ends
    of the rod, the metal shavings below, and the overall camera framing identical to the original.
  rationale: The video prompt describes a continuous heating process where the rod is 'getting brighter'.
    The camera pans away (occlusion) and then returns to the exact same center view. During the time the
    rod is out of view, the induction heating continues. Therefore, when the camera returns to the initial
    position, the rod must appear significantly hotter, manifested visually as a brighter and more orange/yellow
    glow compared to the initial faint red state.
