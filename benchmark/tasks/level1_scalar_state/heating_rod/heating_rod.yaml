  init_frame_description: A close-up view of a thick steel rod passing horizontally through a copper induction
    heating coil in an industrial workshop. The section of the rod inside the coil is glowing a dull,
    faint red color. To the left, the unheated portion of the rod is dark grey metal. The background features
    industrial machinery, including a green press and various pipes.
  init2final_edit_prompt: Edit the given image so that the heated section of the metal rod inside the
    copper coil glows with a significantly brighter, more intense orange-yellow light, representing an
    increase in temperature. Ensure the unheated parts of the rod, the copper coil, and the industrial
    background remain identical to the original image.
  rationale: The video prompt describes the rod sitting in an active induction coil and 'getting brighter'.
    The camera pans away and then returns to the original view. During the time the rod is occluded by
    the camera movement, the induction heating process continues. Therefore, when the rod comes back into
    view in the final frame, the glowing section must be significantly hotter (brighter and shifting towards
    orange/yellow) than it was in the initial frame due to the continuous accumulation of heat.
