id: alka_seltzer_fizz_10
level: 1
category: scalar_state
tags: []
variant_of: alka_seltzer_fizz
variation_type: combined
variation_description: Inert object (no reaction) combined with camera moving away physically.
changes:
  occlusion_method: Camera physically moves backward away from the scene.
  dynamic_conditions: Object is inert plastic.
  expected_outcome_change: No reaction.
prompts:
  init_frame_edit_prompt: Edit the image to change the white tablet into a glossy white plastic button
    with four holes.
  video_WM: The white plastic button rests in the water. Being plastic, it does not dissolve or react.
    The camera physically moves backward, retreating away from the table and through a doorway until the
    glass is no longer visible. The camera waits in the other room for several seconds. Then the camera
    moves forward, returning through the doorway to the original position in front of the glass. No cut,
    no scene change. STOP.
  camera_WM: The white plastic button rests in the water. Being plastic, it does not dissolve or react.
    STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a clear glass filled with water sitting on a white
    table. A large, white, four-hole plastic button is suspended in the air just above the water surface,
    with a small droplet or splash connecting it to the water, capturing the moment just before it fully
    enters. The background shows a blurred kitchen interior with warm lighting.
  init2final_edit_prompt: Edit the given image to show the white button resting at the bottom of the glass
    of water. The button must appear completely solid, intact, and undissolved, retaining its original
    size, shape, and four distinct holes. The water must remain perfectly clear and transparent, with
    absolutely no bubbles, foam, or cloudiness. The water level should be consistent with the button being
    submerged. The background, lighting, and glass position should remain exactly unchanged.
  rationale: The task tests the model's ability to adhere to material properties (plastic vs. soluble
    tablet) and maintain object permanence during occlusion. Although the visual setup resembles an Alka-Seltzer
    commercial, the prompt explicitly identifies the object as a plastic button, which is inert in water.
    Therefore, during the camera's excursion and return, the button should sink (or float) but must not
    dissolve, react, or generate bubbles. The scalar state of the button's mass should remain constant,
    and the water's turbidity should remain zero.
