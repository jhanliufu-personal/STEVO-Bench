id: mattress_deflate
level: 1
category: scalar_state
scalar_variable: Mattress height
prompts:
  image_gen_prompt: A fully inflated blue vinyl air mattress on a floor. The black air valve is wide open,
    and the mattress is just starting to show slight surface wrinkles.
  video_WM: A thick air mattress has its valve open and is visibly deflating. The air continues to escape
    steadily. The camera rotates right until the mattress completely exits the view, then rotates toward
    the left smoothly at the same rate until the mattress is back in the center of view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The air mattress is deflating; the air continues to flow out of the open valve steadily.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
