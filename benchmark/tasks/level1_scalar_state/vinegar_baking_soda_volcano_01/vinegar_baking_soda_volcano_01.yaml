evaluation:
  init_frame_description: A close-up eye-level shot of a wooden countertop in a kitchen. In the center,
    a clear glass apothecary jar sits on a rustic wooden tray; the jar contains a mound of white powder
    (baking soda). To the left, a bottle of Heinz vinegar is visible. Above the jar, a hand holds a glass
    pitcher filled with clear liquid (vinegar), positioned as if about to pour. The background features
    a window on the left, a knife block, and a stove on the right.
  init2final_edit_prompt: Edit the given image to show the result of mixing the vinegar and baking soda.
    The glass jar should be filled to the brim or overflowing with thick white bubbly foam. The foam should
    be spilling over the sides of the jar onto the wooden tray. The level of the substance in the jar
    must be significantly higher than the initial powder level. The glass pitcher in the hand should contain
    less liquid than before, appearing partially emptied.
  rationale: The prompt describes pouring vinegar (acetic acid) into baking soda (sodium bicarbonate).
    This creates a rapid acid-base reaction that releases carbon dioxide gas, causing the mixture to foam
    and expand significantly in volume (the 'volcano' effect). The occlusion by the person covers the
    duration of the pour and the reaction's peak. When the view is revealed, the jar should contain expanded
    foam rather than just powder, likely overflowing due to the volume increase. The pitcher should have
    less liquid as it was poured to trigger the reaction.
