evaluation:
  init_frame_description: A clear glass tumbler filled with water sits against a white background. A glass
    dropper containing red liquid is positioned above the center of the glass. A drop of red dye has just
    entered the water, forming a concentrated red mushroom-cloud shape near the surface with tendrils
    beginning to descend. The water around the dye remains mostly clear.
  init2final_edit_prompt: Edit the given image to show the red food coloring having diffused significantly
    further into the water. The red dye should occupy a larger volume of the glass, extending deeper and
    wider with more complex swirls and a more dispersed pinkish-red appearance, rather than a compact
    drop near the surface. The dye cloud should look expanded and less dense than in the original state.
  rationale: The video prompt describes a process of molecular diffusion occurring over a period of several
    seconds while the scene is occluded by darkness. When the lights return, the physical state of the
    system must have advanced. In a liquid system, a concentrated dye drop will naturally spread outwards
    and downwards due to momentum and diffusion, increasing the volume of water it occupies and becoming
    more dispersed. The final frame must show this advanced state of diffusion compared to the initial
    concentrated drop.
