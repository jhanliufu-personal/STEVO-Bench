evaluation:
  init_frame_description: A close-up, eye-level shot of a jagged, glowing volcanic rock sitting on a dirty,
    metallic baking sheet. The rock is intensely hot, with bright orange and yellow magma visible through
    cracks in a dark, hardened crust. Small flames and smoke are rising from the rock. The tray has burnt
    residue around the base of the rock. The background is a blurred, dark industrial or workshop setting.
  init2final_edit_prompt: Edit the given image to show the volcanic rock after it has cooled down. Change
    the glowing bright orange and yellow magma areas to dark grey and black solidified rock. Remove the
    flames. Reduce the smoke. The rock should appear dark and cold, with a rough, stony texture. Keep
    the metal tray, the burnt residue, and the blurred background exactly as they are.
  rationale: The task ID 'lava_cool' and the physical context of a small, isolated heat source on a conductive
    metal tray imply a trajectory of rapid cooling. Over time, the intense heat (glowing magma) will dissipate,
    causing the rock to crust over, darken, and lose its incandescence. The flames, driven by the heat,
    will extinguish. The evaluation focuses on the directional change of temperature, visually represented
    by the reduction of brightness and the shift from orange/yellow to black/grey.
