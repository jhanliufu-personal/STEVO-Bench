evaluation:
  init_frame_description: A close-up side view of a dirty hand holding a lit wooden matchstick against
    a blurred neutral beige background. The matchstick is held horizontally. The tip is burning with a
    bright orange and yellow flame, emitting a small trail of smoke. The head of the match is blackened
    and charred, and the charring has just begun to spread slightly down the wooden shaft.
  init2final_edit_prompt: Edit the given image to show the matchstick after it has burned further down.
    Replace the upper portion of the wooden stick with blackened char or ash. Move the flame lower down
    the stick, closer to the fingers holding it. Reduce the length of the visible unburnt light-colored
    wood. Ensure the hand and background remain identical to the original image.
  rationale: The video prompt describes a match burning while oxygen is available, implying the combustion
    process continues. An opaque occlusion covers the scene for several seconds. During this time, the
    fire consumes the wood, moving from the tip towards the base (the fingers). Therefore, when the view
    is restored, the matchstick should be physically shorter or significantly more charred, with the flame
    position advanced down the stick. The scalar change is the reduction of unburnt wood mass and the
    increase of charred length.
