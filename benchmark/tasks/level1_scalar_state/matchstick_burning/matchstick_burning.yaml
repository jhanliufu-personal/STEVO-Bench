evaluation:
  init_frame_description: A close-up side view of a hand holding a wooden matchstick against a blurred
    neutral background. The match is lit, with a bright orange and yellow flame burning at the blackened
    tip (head). The wooden shaft of the match is mostly light-colored and unburnt, extending from the
    fingers to the burning head. Thin smoke trails rise from the flame.
  init2final_edit_prompt: Edit the given image to show the matchstick after it has burned further down
    the shaft. The flame should be positioned significantly closer to the fingers than in the original
    image. The section of the matchstick between the tip and the new flame position should be blackened,
    charred, and thinner, representing burnt wood and ash. The remaining length of unburnt light-colored
    wood near the fingers should be shorter than in the original image.
  rationale: 'The prompt describes a continuous burning process while the camera pans away and returns.
    Since oxygen is available and the match is combustible, the fire continues to consume the wood during
    the occlusion period. When the camera returns to the original view, the state of the match must reflect
    the passage of time: the flame will have traveled down the stick towards the hand, converting the
    wood into char/ash and reducing the length of the unburnt segment.'
