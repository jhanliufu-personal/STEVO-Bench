id: balloon_inflate_01
level: 1
category: scalar_state
scalar_variable: Balloon size
prompts:
  image_gen_prompt: A limp white latex weather balloon attached to a green helium tank nozzle on a grassy
    field. The tank valve is visibly turned to the 'Open' position.
  video_WM: A white balloon is connected to an open helium tank and is inflating. The camera rotates right
    until the balloon and tank completely exit the view, then rotates toward the left smoothly at the
    same rate until the balloon is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A white weather balloon is attached to an open gas valve. The balloon is visibly expanding
    and growing larger. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A green compressed gas tank lies horizontally on a grassy field. A deflated,
    wrinkled white balloon is attached to the brass nozzle and valve assembly of the tank. The tank has
    a silver valve handle. The background consists of a green field, distant trees, and hills under a
    cloudy sky.
  init2final_edit_prompt: A green gas tank lying on a grassy field with a large, inflated white balloon
    attached to its nozzle. The balloon is expanded, round, and taut, significantly larger in volume than
    the original deflated balloon. The background remains a grassy field with distant hills.
  rationale: The prompt establishes that the balloon is connected to an open tank and is actively inflating.
    The camera rotates away (occluding the subject) and then returns to the original view. During the
    occlusion, the inflation process continues over time. Therefore, in the final frame, the balloon must
    appear significantly larger and more inflated (rounder, smoother) than in the initial state, while
    the tank and background remain unchanged.
  questions:
  - id: balloon_size_increase
    question: Is the white balloon larger in volume than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall size/area of the white balloon.
  - id: balloon_shape_roundness
    question: Does the balloon appear rounder and more inflated compared to the flat, wrinkled shape in
      the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for 3D expansion vs flat deflation.
  - id: balloon_surface_smoothness
    question: Is the surface of the balloon smoother and less wrinkled than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Inflation stretches the material, removing wrinkles.
  - id: balloon_area_occupancy
    question: Does the white balloon occupy a larger portion of the image frame than it did initially?
    answer_type: yes_no
    notes_for_judge: Check relative screen space usage.
  - id: balloon_tautness
    question: Does the balloon look taut rather than flaccid?
    answer_type: yes_no
    notes_for_judge: Tautness indicates internal pressure.
  - id: connection_maintained
    question: Is the white balloon still attached to the nozzle of the green tank?
    answer_type: yes_no
    notes_for_judge: The connection should persist.
  - id: tank_presence
    question: Is the green gas tank visible in the frame?
    answer_type: yes_no
    notes_for_judge: The tank should not disappear.
  - id: background_consistency
    question: Is the background (grass and distant hills) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The location has not changed.
