id: inflating_balloon_01
level: 1
category: scalar_state
tags: []
variant_of: inflating_balloon
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to thick fog obscuring the scene.
changes:
  occlusion_method: Thick fog fills the scene, blocking the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A white balloon is connected to an open helium tank and is inflating. Thick white fog rolls
    in from the sides until the balloon and tank are completely obscured from view, then the fog slowly
    dissipates until the scene is clear again. No cut, no scene change. STOP.
  camera_WM: A white weather balloon is attached to an open gas valve. The balloon is visibly expanding
    and growing larger. Thick white fog rolls in from the sides until the balloon and tank are completely
    obscured from view, then the fog slowly dissipates until the scene is clear again. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A green gas cylinder labeled 'HELIUM' sits on a grassy field. A gloved hand
    is positioned on the top valve. A deflated, cream-colored balloon is attached to the nozzle, hanging
    limply downwards.
  init2final_edit_prompt: Edit the given image to show the cream-colored balloon significantly inflated
    and expanded in size. The balloon should look full and rounder, extending outward from the nozzle
    rather than hanging limply. Keep the green helium tank, the gloved hand on the valve, and the grassy
    field background unchanged.
  rationale: The prompt establishes that the helium tank is open and the balloon is actively inflating.
    The fog serves as an occlusion event that covers the passage of time. When the fog dissipates, the
    physical process of inflation implies the balloon must be larger and fuller than in the initial state.
    The static environment (tank, grass) should remain unchanged.
  questions:
  - id: balloon_size_increase
    question: Is the balloon larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall visible area of the balloon material.
  - id: balloon_inflation_state
    question: Does the balloon appear more inflated than it did at the start?
    answer_type: yes_no
    notes_for_judge: Look for signs of expansion, such as roundness or lifting against gravity.
  - id: balloon_volume_expansion
    question: Has the volume of the balloon increased compared to the initial view?
    answer_type: yes_no
    notes_for_judge: The balloon should take up more 3D space.
  - id: balloon_shape_change
    question: Is the balloon fuller in shape compared to the deflated state in the first frame?
    answer_type: yes_no
    notes_for_judge: It should look less wrinkled/flat and more taut/round.
  - id: balloon_extension
    question: Does the balloon extend further from the nozzle than it did initially?
    answer_type: yes_no
    notes_for_judge: Inflation typically causes the balloon to grow outward.
  - id: tank_presence
    question: Is the green helium tank still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: text_legibility
    question: Is the word 'HELIUM' still visible on the tank?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Is the grassy field background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
