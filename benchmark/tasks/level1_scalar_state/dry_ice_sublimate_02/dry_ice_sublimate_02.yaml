prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The dry ice is sublimating rapidly in the warm water, and the size of the solid block is visibly
    shrinking. Suddenly, the lights in the room turn off, plunging the scene into complete pitch black
    darkness. After a duration, the lights turn back on to the original brightness. No cut, no scene change.
    STOP.
  camera_WM: The dry ice is sublimating rapidly in the warm water, and the size of the solid block is
    visibly shrinking. Suddenly, the lights in the room turn off, plunging the scene into complete pitch
    black darkness. After a duration, the lights turn back on to the original brightness. No cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a beige ceramic bowl sitting on a wooden table.
    Inside the bowl, a large, rectangular block of translucent white dry ice is submerged in water. Thick
    white fog is billowing out of the bowl, cascading over the rim and spreading onto the table surface.
    The water around the ice is bubbling. The scene is illuminated by warm, directional light.
  init2final_edit_prompt: Edit the given image to show the block of dry ice significantly reduced in size.
    Make the solid ice mass in the center of the bowl appear smaller and more eroded than in the original
    image. Maintain the presence of the white fog and the bubbling water texture around the diminished
    ice block. Keep the ceramic bowl, the wooden table, and the lighting conditions exactly as they are
    in the original frame.
  rationale: The prompt describes a physical process of sublimation where dry ice shrinks in warm water.
    The scene undergoes a temporary period of darkness (occlusion by lighting change), but the physical
    process continues during this time. Therefore, when the lights return to their original state, the
    key scalar change is that the dry ice block must be visibly smaller (less volume/mass) due to the
    elapsed time. The surrounding environment (bowl, table) remains unchanged.
