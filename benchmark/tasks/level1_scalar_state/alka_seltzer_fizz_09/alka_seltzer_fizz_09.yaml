evaluation:
  init_frame_description: A close-up, eye-level shot of a clear glass filled with water sitting on a white
    table. A white, circular effervescent tablet is suspended in mid-air just above the water's surface.
    Steam is rising from the water, indicating it is hot. The background shows a blurred kitchen interior
    with warm lighting.
  init2final_edit_prompt: Edit the given image to remove the white tablet suspended in the air. Modify
    the water inside the glass to appear highly effervescent, filled with bubbles and fizz. The water
    should look cloudier or more turbulent than the clear water in the original image, reflecting a chemical
    reaction. Do not show any hand or occlusion.
  rationale: The video prompt describes the tablet contacting hot water, which accelerates the dissolution
    process. A hand covers the lens for several seconds, allowing time for the tablet to fall into the
    water and react significantly. In the final frame, the tablet should no longer be in the air; it should
    be submerged and largely dissolved or dissolving vigorously. The water state must change from clear
    to fizzy and bubbly due to the release of gas.
