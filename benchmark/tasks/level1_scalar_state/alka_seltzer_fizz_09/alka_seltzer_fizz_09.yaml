id: alka_seltzer_fizz_09
level: 1
category: scalar_state
tags: []
variant_of: alka_seltzer_fizz
variation_type: combined
variation_description: Boiling water (fast reaction) combined with object blocking occlusion.
changes:
  occlusion_method: A person's hand covers the camera lens.
  dynamic_conditions: Water is near boiling.
  expected_outcome_change: Extremely rapid reaction and dissolution.
prompts:
  init_frame_edit_prompt: Edit the image to show steam rising from the water surface and small bubbles
    on the glass walls, indicating it is hot.
  video_WM: The effervescent tablet contacts the hot, near-boiling water. The high thermal energy accelerates
    the chemical kinetics significantly. A hand reaches out and covers the camera lens completely, blocking
    all view of the scene. The hand keeps the lens covered for several seconds. Then the hand moves away,
    revealing the view of the glass again. No zoom, no cut, no scene change. STOP.
  camera_WM: The effervescent tablet contacts the hot, near-boiling water. The high thermal energy accelerates
    the chemical kinetics significantly. A hand reaches out and covers the camera lens completely, blocking
    all view of the scene. The hand keeps the lens covered for several seconds. Then the hand moves away,
    revealing the view of the glass again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a clear glass filled with water sitting on a white
    table. A white, circular effervescent tablet is suspended in mid-air just above the water's surface.
    Steam is rising from the water, indicating it is hot. The background shows a blurred kitchen interior
    with warm lighting.
  init2final_edit_prompt: Edit the given image to remove the white tablet suspended in the air. Modify
    the water inside the glass to appear highly effervescent, filled with bubbles and fizz. The water
    should look cloudier or more turbulent than the clear water in the original image, reflecting a chemical
    reaction. Do not show any hand or occlusion.
  rationale: The video prompt describes the tablet contacting hot water, which accelerates the dissolution
    process. A hand covers the lens for several seconds, allowing time for the tablet to fall into the
    water and react significantly. In the final frame, the tablet should no longer be in the air; it should
    be submerged and largely dissolved or dissolving vigorously. The water state must change from clear
    to fizzy and bubbly due to the release of gas.
  questions:
  - id: tablet_position
    question: Is the white tablet gone from the space suspended above the glass?
    answer_type: yes_no
    notes_for_judge: The tablet should have fallen into the water.
  - id: water_effervescence
    question: Is the water in the glass more bubbly or fizzy than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for increased bubbles indicating a reaction.
  - id: tablet_mass
    question: Is the visible solid mass of the tablet smaller than in the initial frame, or completely
      dissolved?
    answer_type: yes_no
    notes_for_judge: The tablet dissolves, so its solid form should be smaller or gone.
  - id: water_clarity
    question: Is the water less clear than it was initially?
    answer_type: yes_no
    notes_for_judge: Dissolution usually clouds the water or fills it with bubbles.
  - id: reaction_state
    question: Does the liquid appear to be in a state of agitation or reaction compared to the calm water
      at the start?
    answer_type: yes_no
    notes_for_judge: Look for turbulence or fizz.
  - id: glass_consistency
    question: Is the glass cup still standing in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Is the blurred kitchen background consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
