evaluation:
  init_frame_description: A close-up view of a wooden wall frame construction site. Inside a wall cavity
    between two vertical wooden studs, a mound of yellow, bubbly spray foam insulation is accumulating
    at the bottom. A spray gun nozzle is visible in the upper right, spraying a stream of material onto
    the foam pile. Sawdust and wood shavings cover the floor and bottom plate of the frame.
  init2final_edit_prompt: Edit the given image to show the yellow spray foam having significantly expanded
    in volume. The mound of foam should be much larger, taller, and wider, filling a greater portion of
    the wooden wall cavity compared to the start. The texture should remain bubbly and irregular. Ensure
    the wooden studs remain in their original positions.
  rationale: The video prompt describes the rapid expansion of the spray foam insulation. Although a dust
    cloud temporarily obscures the scene, the primary state change is the continuous growth of the foam's
    volume due to chemical expansion. By the final frame, after the dust dissipates, the foam mound will
    be visibly larger, occupying more space within the wall cavity than in the initial frame.
