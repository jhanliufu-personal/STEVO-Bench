id: spray_foam_03
level: 1
category: scalar_state
tags: []
variant_of: spray_foam
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a cloud of construction dust obscuring
  the view.
changes:
  occlusion_method: Thick construction dust fills the air, obscuring visibility, then settles.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The insulation foam is expanding rapidly, and the volume of the yellow mound is visibly growing.
    A thick cloud of white construction dust blows into the scene, completely obscuring visibility. The
    dust cloud gradually dissipates. No zoom, no cut, no scene change. STOP.
  camera_WM: The insulation foam is expanding rapidly, and the volume of the yellow mound is visibly growing.
    A thick cloud of white construction dust blows into the scene, completely obscuring visibility. The
    dust cloud gradually dissipates. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a wooden wall frame construction site. Inside a wall cavity
    between two vertical wooden studs, a mound of yellow, bubbly spray foam insulation is accumulating
    at the bottom. A spray gun nozzle is visible in the upper right, spraying a stream of material onto
    the foam pile. Sawdust and wood shavings cover the floor and bottom plate of the frame.
  init2final_edit_prompt: Edit the given image to show the yellow spray foam having significantly expanded
    in volume. The mound of foam should be much larger, taller, and wider, filling a greater portion of
    the wooden wall cavity compared to the start. The texture should remain bubbly and irregular. Ensure
    the wooden studs remain in their original positions.
  rationale: The video prompt describes the rapid expansion of the spray foam insulation. Although a dust
    cloud temporarily obscures the scene, the primary state change is the continuous growth of the foam's
    volume due to chemical expansion. By the final frame, after the dust dissipates, the foam mound will
    be visibly larger, occupying more space within the wall cavity than in the initial frame.
  questions:
  - id: foam_volume_increase
    question: Is the mound of yellow foam larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall size of the yellow mass.
  - id: foam_height_increase
    question: Is the top of the foam pile higher than it was initially?
    answer_type: yes_no
    notes_for_judge: Check if the foam has grown vertically up the wall cavity.
  - id: foam_cavity_fill
    question: Does the foam occupy more space within the wall cavity than before?
    answer_type: yes_no
    notes_for_judge: Assess the fullness of the cavity relative to the start.
  - id: foam_back_wall_coverage
    question: Is the foam covering more of the back wall surface than in the initial view?
    answer_type: yes_no
    notes_for_judge: Look for reduced visibility of the back wall material due to foam expansion.
  - id: stud_consistency
    question: Are the vertical wooden studs in the same location as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera should not have moved significantly.
  - id: dust_dissipation
    question: Is the view clear of the thick dust cloud that obscured the scene?
    answer_type: yes_no
    notes_for_judge: The prompt states the dust dissipates, so the final frame should not be completely
      obscured.
