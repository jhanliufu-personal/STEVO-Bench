evaluation:
  init_frame_description: A clear glass filled with water sits on a white table in a kitchen setting.
    A round white effervescent tablet is suspended in mid-air directly above the center of the water surface,
    with a small droplet bridging the gap between the tablet and the water. The background is blurred,
    showing kitchen cabinets and warm lighting.
  init2final_edit_prompt: Edit the given image to show the white tablet submerged at the bottom of the
    glass. The tablet should appear significantly smaller than its original size, indicating partial dissolution.
    The water inside the glass should be filled with numerous small gas bubbles and appear cloudy or fizzy.
    Ensure the tablet is no longer suspended in the air above the glass.
  rationale: The prompt describes the tablet entering the water and undergoing a vigorous exothermic reaction
    that produces gas. The camera rotates away and returns after several seconds. During this elapsed
    time (occlusion), the tablet falls into the water, sinks to the bottom, and dissolves significantly
    while releasing carbon dioxide bubbles. The final state must show the tablet submerged and reduced
    in mass, with the water visually changed by the presence of bubbles.
