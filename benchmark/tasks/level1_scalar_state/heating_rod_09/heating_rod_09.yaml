id: heating_rod_09
level: 1
category: scalar_state
tags: []
variant_of: heating_rod
variation_type: combined
variation_description: Combined heating from cold dynamics with smoke occlusion.
changes:
  occlusion_method: Thick smoke fills the room.
  dynamic_conditions: Rod cold; Coil just turned on.
  expected_outcome_change: Rod begins to glow red while obscured by smoke.
prompts:
  init_frame_edit_prompt: Edit the image so the steel rod is dull grey metal with no glow.
  video_WM: A cold steel rod sits in an active induction coil that has just been powered on. Thick white
    industrial smoke billows into the frame, completely obscuring the rod and coil, then slowly dissipates
    to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: A cold steel rod sits in an active induction coil that has just been powered on. Thick white
    industrial smoke billows into the frame, completely obscuring the rod and coil, then slowly dissipates
    to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up industrial shot showing a thick, cylindrical grey steel rod passing
    horizontally through a copper induction coil. The coil consists of multiple turns of copper tubing.
    The background features a workshop environment with heavy machinery, including a green press and various
    metal components. The lighting is overhead industrial lighting.
  init2final_edit_prompt: Edit the given image to make the section of the steel rod inside the copper
    coil glow with a bright red-orange color to simulate intense heat. The glow should be concentrated
    within the area surrounded by the coil. Ensure the scene is clear of any smoke or obstruction, revealing
    the heated rod and the original background machinery clearly.
  rationale: The prompt describes an induction heating process where a cold rod is subjected to an active
    coil. The 'smoke' serves as a temporal occlusion device. During the time the view is obscured, the
    physical process of induction heating continues, causing the temperature of the steel to rise significantly.
    Physically, steel heated to induction temperatures becomes incandescent, glowing red or orange. Therefore,
    when the smoke dissipates, the primary scalar state change is the increase in temperature, visually
    represented by the rod glowing in the heated zone.
  questions:
  - id: heating_rod_09_q1
    question: Is the section of the rod inside the coil glowing red or orange?
    answer_type: yes_no
    notes_for_judge: Checks for the primary visual indicator of the temperature increase (incandescence).
  - id: heating_rod_09_q2
    question: Does the rod appear hotter than it did in the initial frame?
    answer_type: yes_no
    notes_for_judge: Comparative question regarding the thermal state.
  - id: heating_rod_09_q3
    question: Has the color of the rod inside the coil changed from grey to a heated tone?
    answer_type: yes_no
    notes_for_judge: Checks for the specific color shift associated with heating steel.
  - id: heating_rod_09_q4
    question: Is the heated glow localized primarily to the area near the induction coil?
    answer_type: yes_no
    notes_for_judge: Checks for physical consistency of induction heating (localized heat).
  - id: heating_rod_09_q5
    question: Is the rod visible again, free from total occlusion by smoke?
    answer_type: yes_no
    notes_for_judge: Verifies the 'dissipates to reveal' instruction.
  - id: heating_rod_09_q6
    question: Is the copper coil still present and wrapped around the rod?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for the main tool.
  - id: heating_rod_09_q7
    question: Are the background machines and workshop details consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for the environment.
