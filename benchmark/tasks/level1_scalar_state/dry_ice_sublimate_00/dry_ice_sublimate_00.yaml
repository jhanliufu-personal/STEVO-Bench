evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a beige ceramic bowl resting on a wooden
    table. Inside the bowl is water and a large, rectangular block of translucent white dry ice. Thick
    white fog is billowing vigorously from the bowl, spilling over the rim and settling on the table surface.
    The lighting is warm, creating highlights on the water and fog.
  init2final_edit_prompt: Edit the given image to show the block of dry ice significantly reduced in size.
    Make the central ice block smaller and more eroded to simulate sublimation. Maintain the billowing
    white fog and the water in the bowl. Keep the beige bowl and the wooden table surface exactly as they
    are in the original view.
  rationale: The prompt describes dry ice sitting in warm water, a setup that causes rapid sublimation
    (phase change from solid to gas). Over the duration of the video, the primary physical change is the
    reduction in mass and volume of the dry ice block as it turns into vapor. The camera is stationary,
    so the bowl and background remain fixed invariants.
