camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: 'A close-up industrial scene featuring a large winding machine. In the center,
    a black spool is partially filled with bright yellow wire. To the left of the spool is a large, greasy
    metal gear mechanism. Above the spool is a grey electric motor with cooling fins. In the background,
    there are other spools of wire: a blue one on the bottom left, a black one on the far left, a black
    one on the right, and a yellow one on the far right. The floor is concrete.'
  init2final_edit_prompt: Edit the given image to show the central spool with a significantly larger amount
    of yellow wire wound onto it. Increase the diameter of the yellow wire coil so it occupies more of
    the space between the black flanges. The layer of yellow wire should appear thicker and more voluminous
    than in the original image. Keep the machine structure, the gear on the left, the motor on top, and
    the background spools exactly unchanged.
  rationale: The video prompt describes a motorized spindle winding wire. Physically, this action results
    in the accumulation of wire onto the spool over time. Therefore, the primary scalar change is an increase
    in the volume and diameter of the yellow wire coil on the central spool. The camera is stationary,
    so the background and machine structure remain constant while the wire accumulates.
