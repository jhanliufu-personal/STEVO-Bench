prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A motorized spindle winds yellow wire. The spool is in the center of view. Camera remains
    stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: A motorized spindle winds yellow wire. The spool is in the center of view. Camera remains
