evaluation:
  init_frame_description: A dark, wet reddish-brown terracotta pot sits on a rough cylindrical concrete
    block in a workshop. To the right, a silver clamp-on heat lamp with a wire guard glows bright orange,
    directing intense light at the pot. Visible steam or vapor is rising from the pot's surface. The background
    features a textured wall, tools, and shelves typical of a pottery studio.
  init2final_edit_prompt: Modify the terracotta pot to appear significantly drier. Change the pot's color
    from dark wet reddish-brown to a lighter, paler dry clay orange. Remove the wet gloss and specular
    highlights on the pot's surface to give it a matte finish. Reduce the density of the steam rising
    from the pot. Keep the concrete block, the heat lamp, and the background workshop environment exactly
    as they are.
  rationale: 'The prompt describes a drying process where a wet pot turns lighter under a heat lamp. The
    camera motion pans away and then returns to the original view, implying a passage of time during the
    occlusion. Therefore, the final frame must depict the same scene composition as the initial frame,
    but the pot itself must exhibit the physical properties of having dried: a lighter color and a matte,
    non-reflective surface.'
  questions:
  - id: color_change
    question: Is the terracotta pot lighter in color than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The pot should shift from dark red/brown to a paler orange/clay color.
  - id: texture_matte
    question: Does the surface of the pot appear more matte (less glossy) than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Wet clay is shiny; dry clay is matte.
  - id: specular_highlights
    question: Are the wet specular highlights on the pot reduced or absent compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for the white reflections of the light on the pot's rim and body.
  - id: general_drying
    question: Does the pot appear drier than it did in the initial frame?
    answer_type: yes_no
    notes_for_judge: Holistic assessment of color and texture.
  - id: lamp_presence
