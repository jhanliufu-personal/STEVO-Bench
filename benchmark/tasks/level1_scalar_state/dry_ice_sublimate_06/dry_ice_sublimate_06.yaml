id: dry_ice_sublimate_06
level: 1
category: scalar_state
tags: []
variant_of: dry_ice_sublimate
variation_type: dynamic_condition
variation_description: Water changed from warm to boiling hot.
changes:
  occlusion_method: null
  dynamic_conditions: Water is boiling hot.
  expected_outcome_change: Sublimation rate is extremely rapid and violent; block shrinks very fast.
prompts:
  init_frame_edit_prompt: Edit the image to show the water bubbling vigorously and emitting steam, indicating
    it is boiling hot.
  video_WM: The dry ice is placed in boiling hot water. The reaction is violent, with aggressive bubbling
    and rapid sublimation. The camera rotates right until the bowl completely exits the view, then rotates
    toward the left smoothly at the same rate until the bowl is back in the center of view. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The dry ice is placed in boiling hot water. The reaction is violent, with aggressive bubbling
    and rapid sublimation. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a beige ceramic bowl resting on a wooden table.
    The bowl contains hot water and a large, rectangular block of semi-translucent white dry ice in the
    center. The water is bubbling vigorously around the dry ice, and thick white fog is billowing upwards
    and spilling over the rim of the bowl.
  init2final_edit_prompt: Edit the given image to show the block of dry ice as significantly smaller in
    size, appearing eroded and reduced in volume due to sublimation. Maintain the presence of agitated,
    bubbling water and thick white fog rising from the bowl. Keep the bowl centered and the wooden background
    unchanged.
  rationale: 'The prompt describes a violent reaction of dry ice in boiling water, which causes rapid
    sublimation (transition from solid to gas). The camera pans away and then returns to the original
    position, implying that a period of time has elapsed. During this time, the physical state of the
    dry ice must evolve: its mass and volume will decrease significantly due to the heat. The final frame
    should show the bowl in its original position (since the camera returns) but with a noticeably smaller
    chunk of dry ice and continued fog/bubbling.'
  questions:
  - id: dry_ice_size_reduction
    question: Is the block of dry ice smaller than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The dry ice should have sublimated significantly, reducing its volume.
  - id: dry_ice_mass_decrease
    question: Does the solid chunk of ice appear to have less mass than at the start?
    answer_type: yes_no
    notes_for_judge: Compare the visible solid matter in the bowl.
  - id: dry_ice_erosion
    question: Does the dry ice look more eroded or dissolved compared to the initial image?
    answer_type: yes_no
    notes_for_judge: The edges may be rounded or the overall shape diminished.
  - id: fog_presence
    question: Is there still white fog or mist rising from the bowl?
    answer_type: yes_no
    notes_for_judge: The reaction is described as violent, so fog should persist.
  - id: water_agitation
    question: Is the water in the bowl still bubbling or agitated?
    answer_type: yes_no
    notes_for_judge: The sublimation process creates bubbles.
  - id: bowl_centering
    question: Is the bowl positioned in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera prompt specifies returning the bowl to the center.
  - id: background_consistency
    question: Is the wooden table surface visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Invariant check.
