  video_WM: The dry ice is placed in boiling hot water. The reaction is violent, with aggressive bubbling
    and rapid sublimation. The camera rotates right until the bowl completely exits the view, then rotates
    toward the left smoothly at the same rate until the bowl is back in the center of view. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The dry ice is placed in boiling hot water. The reaction is violent, with aggressive bubbling
    and rapid sublimation. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a beige ceramic bowl resting on a wooden table.
    The bowl contains hot water and a large, rectangular block of semi-translucent white dry ice in the
    center. The water is bubbling vigorously around the dry ice, and thick white fog is billowing upwards
    and spilling over the rim of the bowl.
  init2final_edit_prompt: Edit the given image to show the block of dry ice as significantly smaller in
    size, appearing eroded and reduced in volume due to sublimation. Maintain the presence of agitated,
    bubbling water and thick white fog rising from the bowl. Keep the bowl centered and the wooden background
    unchanged.
  rationale: 'The prompt describes a violent reaction of dry ice in boiling water, which causes rapid
    sublimation (transition from solid to gas). The camera pans away and then returns to the original
    position, implying that a period of time has elapsed. During this time, the physical state of the
    dry ice must evolve: its mass and volume will decrease significantly due to the heat. The final frame
    should show the bowl in its original position (since the camera returns) but with a noticeably smaller
    chunk of dry ice and continued fog/bubbling.'
