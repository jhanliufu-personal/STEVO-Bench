evaluation:
  init_frame_description: A close-up, ground-level view of a bicycle wheel with a flat tire. The black
    rubber tire is significantly deflated, with the bottom section compressed flat against the concrete
    floor and the sidewalls bulging and wrinkled. The metal rim is sitting very close to the ground. A
    brass valve stem is visible at the bottom of the wheel. An air hose with a brass coupler lies disconnected
    on the floor in the foreground. In the background, slightly out of focus, is a red air compressor
    and workshop equipment.
  init2final_edit_prompt: Edit the given image to show the bicycle tire fully inflated. The tire should
    appear round and firm, lifting the metal rim significantly higher off the concrete floor. The sidewall
    of the tire near the ground should be smooth and taut, removing the wrinkles and bulge associated
    with the flat tire. The gap between the rim and the ground should be clearly increased due to the
    air pressure. Keep the air hose lying on the ground and the background tools unchanged.
  rationale: The task ID and the visual context of a flat tire with an air hose nearby imply that the
    tire is inflated during the occlusion event. The cardboard blocks the view to allow the state transition
    (inflation) to occur without requiring the generation of the specific tool manipulation animation.
    Therefore, the final state should depict the tire with increased air volume, lifting the wheel assembly,
    while the environment remains otherwise static.
