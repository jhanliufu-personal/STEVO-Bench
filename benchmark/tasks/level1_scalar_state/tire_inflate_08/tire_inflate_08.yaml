  video_WM: The air hose lies disconnected on the ground. The tire is stationary. A large piece of cardboard
    is moved in front of the camera lens, completely blocking the view of the tire. The cardboard is held
    there for a duration, then removed to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The air hose lies disconnected on the ground. The tire is stationary. A large piece of cardboard
