id: spooling_wire_04
level: 1
category: scalar_state
tags: []
variant_of: spooling_wire
variation_type: dynamic_condition
variation_description: The machine is set to reverse/unwind instead of wind.
changes:
  occlusion_method: null
  dynamic_conditions: Spindle rotates in reverse to unwind the wire.
  expected_outcome_change: The spool diameter shrinks instead of grows.
prompts:
  init_frame_edit_prompt: Edit the image to show the yellow wire slightly loose on the spool, implying
    it is being fed off rather than wound tightly.
  video_WM: A motorized spindle spins in reverse, unwinding yellow wire. The spool diameter is visibly
    decreasing. The camera rotates right until the spindle completely exits the view, then rotates toward
    the left smoothly at the same rate until the spool is back in the center of view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: A motorized spindle spins in reverse, unwinding yellow wire. The spool diameter is visibly
    decreasing. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up industrial scene showing a machine with a large motorized spindle
    holding a coil of yellow wire. The wire is currently wound on the spool with some loose loops visible
    due to motion. In the background, there is a large electric motor on top of the machine, and other
    spools of wire (black and yellow) are visible in the distance on the floor. The setting appears to
    be a warehouse or factory with metal walls and overhead lighting.
  init2final_edit_prompt: Edit the given image to show the central spool of yellow wire with a significantly
    smaller diameter, indicating that a substantial amount of wire has been unwound. The layer of yellow
    wire on the spindle should appear thinner and depleted compared to the original state. Keep the machine,
    the electric motor, the background spools, and the lighting identical to the original image.
  rationale: The video prompt describes a continuous unwinding process where the spindle spins in reverse.
    Although the camera pans away (occlusion) and then returns to the original view, the physical process
    of unwinding continues throughout. Therefore, in the final frame, the primary state change is a reduction
    in the volume and diameter of the yellow wire on the spool. The camera movement ensures the final
    viewpoint matches the initial one, allowing for a direct comparison of the wire amount.
