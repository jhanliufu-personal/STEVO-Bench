id: food_dye_swirl_00
level: 1
category: scalar_state
tags: []
variant_of: food_dye_swirl
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A drop of red food coloring contacts the still water surface. The dye is water-soluble. Molecular
    diffusion occurs driven by concentration gradients. The water is stationary with no forced convection.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: A drop of red food coloring contacts the still water surface. The dye is water-soluble. Molecular
    diffusion occurs driven by concentration gradients. The water is stationary with no forced convection.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass tumbler filled with water sits on a plain white background. A
    glass dropper containing red liquid is positioned above the center of the glass. A drop of red food
    coloring has entered the water, creating a dark red, swirling, mushroom-shaped cloud suspended in
    the upper middle portion of the water.
  init2final_edit_prompt: Edit the given image to show the red food coloring diffused more widely throughout
    the water. The red dye should occupy a significantly larger volume of the glass, appearing as a softer,
    expanded cloud of red and pink. The sharp, distinct swirls of the initial state should be blurred
    and spread out, tinting a greater portion of the surrounding water red.
  rationale: The prompt describes the physical process of molecular diffusion in a stationary liquid.
    Over time, the concentrated red dye will naturally move from areas of high concentration to low concentration,
    causing the visual 'cloud' of dye to expand in volume and become more diffuse. The sharp boundaries
    of the initial vortex rings will soften, and the red color will spread into the previously clear areas
    of the water. The glass and camera angle remain invariant.
  questions:
  - id: dye_volume_expansion
    question: Is the red dye occupying a larger volume of the water than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The red region should be visibly larger.
  - id: dye_spread_extent
    question: Has the red coloration spread further into the previously clear water?
    answer_type: yes_no
    notes_for_judge: Check if the red cloud reaches deeper or wider.
  - id: dye_diffusion_softness
    question: Is the red pattern more diffuse and less sharply defined than in the initial image?
    answer_type: yes_no
    notes_for_judge: Diffusion causes sharp lines to blur.
  - id: dye_area_coverage
    question: Does the red dye cover a wider area of the glass interior than it did initially?
    answer_type: yes_no
    notes_for_judge: Compare the 2D area of the red pixels.
  - id: water_tinting
    question: Is the water surrounding the initial impact site now tinted red or pink?
    answer_type: yes_no
    notes_for_judge: Look for color spreading into the clear zones.
  - id: glass_invariant
    question: Is the glass tumbler still in the same position?
    answer_type: yes_no
    notes_for_judge: The container should not move.
  - id: background_invariant
    question: Is the background still plain white?
    answer_type: yes_no
    notes_for_judge: Background should remain unchanged.
