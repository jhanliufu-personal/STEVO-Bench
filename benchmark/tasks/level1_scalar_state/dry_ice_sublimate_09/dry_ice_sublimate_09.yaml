id: dry_ice_sublimate_09
level: 1
category: scalar_state
tags: []
variant_of: dry_ice_sublimate
variation_type: combined
variation_description: Boiling water condition combined with fog occlusion.
changes:
  occlusion_method: Dense steam/fog fills the view.
  dynamic_conditions: Water is boiling hot.
  expected_outcome_change: Rapid sublimation rate.
prompts:
  init_frame_edit_prompt: Edit the image to show the water bubbling vigorously and emitting steam, indicating
    it is boiling hot.
  video_WM: The dry ice is in boiling hot water, reacting violently. An extremely dense cloud of steam
    and fog fills the entire view, turning the screen completely white and hiding the bowl. The fog eventually
    clears to reveal the scene again. No cut, no scene change. STOP.
  camera_WM: The dry ice is in boiling hot water, reacting violently. An extremely dense cloud of steam
    and fog fills the entire view, turning the screen completely white and hiding the bowl. The fog eventually
    clears to reveal the scene again. No cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a beige ceramic bowl sitting on a wet wooden table.
    The bowl contains water that is bubbling violently with large, chaotic bubbles. Dense white steam
    and fog are rising from the water surface, partially obscuring the back rim of the bowl and the background.
  init2final_edit_prompt: Edit the given image to show the water in the bowl in a much calmer state. Significantly
    reduce the number and size of the bubbles on the surface to show that the agitation has subsided.
    Decrease the density and volume of the rising steam and fog so that the air above the bowl is clearer
    than in the original image.
  rationale: 'The prompt describes a temporal sequence where a violent dry ice reaction creates a whiteout
    of fog, which eventually clears to reveal the scene. Physically, the sublimation of dry ice in hot
    water is a self-limiting process: it consumes the dry ice mass and rapidly cools the water, both of
    which reduce the rate of reaction. Therefore, when the fog clears and the scene is revealed again,
    the water must be significantly cooler and the reaction much less violent (fewer bubbles, less steam)
    than in the initial frame.'
