id: piston_ext
level: 1
category: scalar_state
scalar_variable: Extension length
prompts:
  image_gen_prompt: A heavy hydraulic piston on a green machine arm. The polished silver inner rod is
    partially extended. A control lever in the foreground is pushed to the 'Extend' position.
  video_WM: A hydraulic piston is extending slowly. The camera rotates right until the piston assembly
    completely exits the view, then rotates toward the left smoothly at the same rate until the piston
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A hydraulic piston is active, and the silver inner rod is steadily sliding out of the housing.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up view of a green industrial machine arm featuring a hydraulic cylinder
    with a shiny chrome piston rod partially extended. A black hydraulic line connects to the cylinder.
    In the foreground, a weathered control box is visible with a joystick being gripped by a person wearing
    a thick grey work glove. A metal label on the box reads 'EXTEND'. The background is a cluttered workshop
    with shelves, tools, and a bright doorway.
  init2final_edit_prompt: Modify the image to show the hydraulic piston in a more extended state. The
    shiny chrome rod should be significantly longer and more exposed than in the original image. The upper
    green metal arm section attached to the rod should be pushed further upward and outward relative to
    the cylinder base, reflecting the increased length of the assembly. Keep the gloved hand on the joystick
    and the background unchanged.
  rationale: 'The prompt describes a continuous action of the piston extending. Although the camera pans
    away to the right (occluding the machine) and then returns to the left, the extension continues throughout
    the duration of the camera movement. Therefore, when the camera returns to the initial framing, the
    physical state of the machine must have changed: the piston rod must be visibly longer and the arm
    pushed further out.'
  questions:
  - id: piston_rod_length
    question: Is the visible length of the shiny chrome piston rod longer than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the length of the silver metal rod extending from the cylinder.
  - id: arm_position
    question: Is the green metal arm attached to the piston pushed further away from the cylinder base
      compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The extension should push the upper green structure further up/left.
  - id: assembly_extension
    question: Does the overall hydraulic assembly appear more extended than it was initially?
    answer_type: yes_no
    notes_for_judge: Check if the mechanism has expanded.
  - id: cylinder_gap
    question: Is there a larger gap between the cylinder housing and the joint on the green arm than in
      the initial frame?
    answer_type: yes_no
    notes_for_judge: This gap increases as the rod extends.
  - id: hand_visibility
    question: Is the gloved hand still visible holding the joystick?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: panel_label
    question: Is the 'EXTEND' label still visible on the control panel?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
