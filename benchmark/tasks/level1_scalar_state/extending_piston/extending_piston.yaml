evaluation:
  init_frame_description: A close-up view of a weathered green excavator arm mechanism. A prominent hydraulic
    cylinder is visible diagonally, with a green barrel and a partially extended shiny silver rod. Hydraulic
    hoses run along the top of the arm. In the foreground, there is a control lever mechanism with a black
    handle and a 'EXTEND' label on the base plate. The machinery is dirty with grease and rust.
  init2final_edit_prompt: Edit the given image to show the hydraulic piston in a more extended state.
    Increase the visible length of the shiny silver rod protruding from the green cylinder barrel. Shift
    the mechanical joint attached to the end of the rod further away from the cylinder body to account
    for the extension. Maintain the exact camera angle, lighting, and the position of the foreground control
    lever.
  rationale: The video prompt specifies that the hydraulic piston is extending slowly. While the camera
    rotates away (occlusion) and then returns to the original view, the physical process of extension
    continues. Therefore, in the final frame, the piston rod must be visibly longer (more extended) than
    it was in the initial frame, representing a scalar increase in length.
