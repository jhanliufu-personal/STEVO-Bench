scalar_variable: Extension length
prompts:
  image_gen_prompt: A heavy hydraulic piston on a green machine arm. The polished silver inner rod is
    partially extended. A control lever in the foreground is pushed to the 'Extend' position.
  video_WM: A hydraulic piston is extending slowly. The camera rotates right until the piston assembly
    completely exits the view, then rotates toward the left smoothly at the same rate until the piston
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A hydraulic piston is active, and the silver inner rod is steadily sliding out of the housing.
    STOP.
camera_control:
