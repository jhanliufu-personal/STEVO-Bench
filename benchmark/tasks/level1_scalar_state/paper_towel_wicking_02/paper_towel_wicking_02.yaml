evaluation:
  init_frame_description: A laboratory setup showing a vertical strip of white paper towel clamped to
    a metal stand. The bottom edge of the paper towel is submerged in a glass petri dish filled with blue
    liquid. In the background, there are glass beakers and a notebook on a white table. The scene is brightly
    lit.
  init2final_edit_prompt: Edit the given image to show the blue liquid having wicked higher up the vertical
    paper towel strip. The blue stain should extend significantly upward from the liquid surface, covering
    the lower portion of the paper strip. Keep the metal stand, beakers, notebook, and lighting exactly
    as they are in the original image.
  rationale: The prompt describes a physical process of capillary action where liquid rises up a porous
    material. The period of darkness serves as a temporal occlusion during which the physical process
    continues. Upon the return of the lights, the state of the world must reflect the elapsed time, meaning
    the blue liquid front should have risen higher up the paper towel strip than it was in the initial
    frame.
