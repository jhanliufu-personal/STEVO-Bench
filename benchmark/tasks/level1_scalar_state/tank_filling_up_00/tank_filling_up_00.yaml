evaluation:
  init_frame_description: A large, clear cylindrical tank sits on a concrete warehouse floor. The tank
    has red measurement markings on its front face, with a scale on the left labeled in 'g' (grams) and
    a scale on the right labeled in 'lt' or 'L' (liters). A metal pipe extends from the top right, pouring
    a stream of water into the tank. The current water level is approximately at the 140 L mark on the
    right scale and the 300 g mark on the left scale. The water surface is turbulent where the stream
    hits it. In the background, there are warehouse shelves, pallets, and industrial equipment.
  init2final_edit_prompt: Edit the given image to show the water level significantly higher inside the
    clear tank. The water surface should be well above the 140 L mark, indicating that the tank has been
    filling up. Maintain the stream of water pouring from the metal pipe and show turbulence on the new,
    higher water surface. Keep the background warehouse environment, the tank's position, and the pipe's
    position exactly the same.
  rationale: The initial image shows water actively pouring into a container. The video prompt specifies
    a continuous take with a stationary camera. As time passes in a physical world, the continuous inflow
    of water must cause the volume of water in the tank to increase, resulting in a rise in the water
    level (scalar state change). The final frame should depict this accumulated volume.
