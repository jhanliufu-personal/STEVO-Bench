id: tank_filling_up_v01
level: 1
category: scalar_state
tags: []
variant_of: tank_filling_up
variation_type: occlusion_method
variation_description: Occlusion changed from camera panning to warehouse lights turning off completely.
changes:
  occlusion_method: Lighting change (pitch black)
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts or zoom. Camera is static, centered on the pipe and water
    tank. Water flows continuously. Suddenly, the warehouse lights turn off completely, plunging the scene
    into pitch black darkness where nothing is visible. The darkness lasts for several seconds. Then,
    the lights turn back on, revealing the scene again. STOP.
  camera_WM: Single continuous take, no cuts or zoom. Camera is static, centered on the pipe and water
    tank. Water flows continuously. Suddenly, the warehouse lights turn off completely, plunging the scene
    into pitch black darkness where nothing is visible. The darkness lasts for several seconds. Then,
    the lights turn back on, revealing the scene again. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A large, clear cylindrical tank sits in the center of a warehouse floor. The
    tank has red measurement markings on its front, with scales labeled in 'g' on the left and 'L'/'lt'
    on the right. A metal pipe extends from the top right, pouring a stream of water into the tank. The
    water level is currently aligned roughly with the '140 L' mark on the scale, with turbulence and bubbles
    visible where the stream hits the surface. The background features warehouse shelving, wooden pallets,
    and industrial equipment.
  init2final_edit_prompt: Edit the given image to raise the water level in the clear tank significantly
    higher than the current level. Show the water surface well above the '140 L' mark, indicating that
    the tank has continued to fill. Maintain the stream of water pouring from the pipe. Keep the lighting,
    background, and camera angle exactly identical to the original image.
  rationale: The prompt establishes that water flows continuously and the camera is static. The 'pitch
    black' period acts as a temporal occlusion where the visual state is hidden, but the physical process
    (filling) continues. Therefore, when the lights turn back on, the only change in the scene should
    be an increase in the volume of water in the tank, resulting in a higher water level compared to the
    initial frame.
