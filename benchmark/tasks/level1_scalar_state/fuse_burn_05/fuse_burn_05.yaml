id: fuse_burn_05
level: 1
category: scalar_state
tags: []
variant_of: fuse_burn
variation_type: dynamic_condition
variation_description: Fuse replaced by loose gunpowder trail, implying near-instant consumption
changes:
  occlusion_method: null
  dynamic_conditions: Loose gunpowder instead of rope (implies extremely fast burn)
  expected_outcome_change: Burn is nearly instantaneous; entire trail consumed
prompts:
  init_frame_edit_prompt: Edit the image to replace the braided rope fuse with a loose, granular trail
    of black gunpowder.
  video_WM: The gunpowder trail ignites with a bright flash, the flame racing along the path with extreme
    speed. The camera rotates right until the trail completely exits the view, then rotates toward the
    left smoothly at the same rate until the trail is back in the center of view. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The gunpowder trail ignites with a bright flash, the flame racing along the path with extreme
    speed. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A high-angle shot of a grey concrete floor showing a curved trail of black granular
    gunpowder. The trail begins in the lower left and curves towards the right side of the frame. At the
    bottom left tip of the trail, ignition has just occurred, producing bright orange sparks, a small
    flame, and rising smoke. The majority of the black powder trail remains unburnt and intact.
  init2final_edit_prompt: Edit the given image to show that the fire has traveled along the gunpowder
    trail. Replace the black granular powder on the left and middle sections of the curve with grey ash,
    dark scorch marks, and smoke residue on the concrete. Move the active flame and sparks to the far
    right end of the trail or remove them if the trail is fully consumed. Ensure the area where the fire
    started is now burnt out.
  rationale: The video prompt describes the flame moving at 'extreme speed' while the camera pans away
    and then returns to the original view. This implies that a significant duration has passed, allowing
    the fast-moving fire to consume most or all of the visible gunpowder. Consequently, the final frame
    should show the initial black powder replaced by burnt residue (ash and scorch marks), with the active
    flame front either advanced significantly to the right or the burn completed.
