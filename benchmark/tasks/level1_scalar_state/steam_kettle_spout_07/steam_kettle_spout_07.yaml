evaluation:
  init_frame_description: A silver gooseneck kettle sits on a black electric coil burner on a stovetop.
    The kettle has a black handle on the left and a black knob on its lid. The lid has a textured appearance,
    possibly from condensation or reflections. The background features a speckled beige countertop and
    a window frame on the right. The scene is brightly lit.
  init2final_edit_prompt: Edit the given image to show the scene fully illuminated with bright lighting.
    The silver kettle remains on the stove. The electric burner coils are black and do not glow. There
    is no steam or vapor rising from the kettle's spout. The kettle's position, the handle orientation,
    and the background details remain exactly as they were in the original image.
  rationale: 'The video prompt establishes that the stove is off and the water is at room temperature.
    The action consists solely of the lights turning off and then back on. No heating occurs during the
    darkness, so the water temperature does not rise, and no phase change (boiling) takes place. The final
    state should be visually identical to the initial state: the lights are back on, the burner is cold
    (black), and there is no steam coming from the spout.'
