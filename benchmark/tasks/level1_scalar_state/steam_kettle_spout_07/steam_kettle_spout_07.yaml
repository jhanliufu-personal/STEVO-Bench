prompts:
  init_frame_edit_prompt: Edit the image to show the stove burner coils as black and cold, and remove
    all steam coming from the kettle spout.
  video_WM: The kettle sits on a cold, inactive burner. The stove is turned off. The water inside is at
    room temperature. Suddenly, the lights in the kitchen turn off completely, plunging the scene into
    absolute darkness. The scene remains pitch black for several seconds. Then the lights turn back on,
    restoring visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The kettle sits on a cold, inactive burner. The stove is turned off. The water inside is
    at room temperature. Suddenly, the lights in the kitchen turn off completely, plunging the scene into
    absolute darkness. The scene remains pitch black for several seconds. Then the lights turn back on,
    restoring visibility. STOP.
camera_control:
  HY-WorldPlay: null
