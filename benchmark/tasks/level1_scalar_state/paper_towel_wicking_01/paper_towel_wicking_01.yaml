id: paper_towel_wicking_01
level: 1
category: scalar_state
tags: []
variant_of: paper_towel_wicking
variation_type: occlusion_method
variation_description: Occlusion by a large opaque object sliding in front of the camera instead of camera
  rotation.
changes:
  occlusion_method: A large grey laboratory notebook slides into view, blocking the scene.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The paper towel edge remains in contact with the blue water. Paper towel has porous cellulose
    fiber structure with capillary channels. Capillary action occurs when surface tension and adhesion
    forces draw liquid upward against gravity. The water is blue-dyed. A large grey laboratory notebook
    slides from the left into the foreground until it completely blocks the view of the experiment. The
    notebook remains in place for several seconds. Then the notebook slides back out to the left, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The paper towel edge remains in contact with the blue water. Paper towel has porous cellulose
    fiber structure with capillary channels. Capillary action occurs when surface tension and adhesion
    forces draw liquid upward against gravity. The water is blue-dyed. A large grey laboratory notebook
    slides from the left into the foreground until it completely blocks the view of the experiment. The
    notebook remains in place for several seconds. Then the notebook slides back out to the left, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A vertical strip of white paper towel is suspended by a metal clamp on a laboratory
    stand. The bottom edge of the paper towel is dipped into a petri dish filled with blue liquid. In
    the background, there are glass beakers and a blurred window. An open notebook is visible on the table
    to the right.
  init2final_edit_prompt: Edit the given image to show that the blue liquid has wicked up the vertical
    paper towel strip. The blue dye should extend significantly higher up the paper strip than in the
    original image, covering the lower portion of the towel well above the water line. The liquid level
    in the petri dish should be slightly lower or unchanged. Keep the clamp, stand, background beakers,
    and the rest of the scene identical to the original view.
  rationale: 'The video prompt describes a capillary action experiment where porous paper absorbs liquid
    against gravity. An occlusion event (a notebook sliding in and out) implies the passage of time. During
    this time, the physical process of wicking continues. Therefore, when the view is restored, the state
    of the world must have changed: the blue water should have risen up the paper towel due to capillary
    forces, resulting in a higher water line on the paper compared to the initial frame.'
