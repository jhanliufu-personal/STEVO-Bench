evaluation:
  init_frame_description: A close-up shot of a vertical blue rectangular strip (resembling a sponge cloth
    or heavy paper towel) clamped at the top by a metal stand. The bottom of the strip is submerged in
    a glass petri dish filled with blue liquid. The strip appears uniform in color, likely its natural
    dry color or partially wet. The petri dish sits on a blue surface, and blurred glass beakers are visible
    in the background.
  init2final_edit_prompt: Edit the given image to show the blue paper towel strip appearing completely
    wet and saturated all the way to the top clamp; it should look darker blue and heavy with liquid.
    Significantly lower the level of the blue liquid in the petri dish to reflect the volume absorbed
    by the strip. Ensure the scene is sharp and clear with no fog or mist remaining.
  rationale: The prompt describes the paper towel strip becoming completely saturated with blue water.
    Physically, this wicking process transfers liquid from the petri dish into the porous material of
    the strip. Therefore, the final state must show a lower liquid level in the dish (conservation of
    mass) and the strip should appear visually wet (darker and glistening) up to the top. The fog mentioned
    in the prompt acts as an occlusion curtain, hiding the duration of the process, but the final frame
    must reveal the completed state after the fog dissipates.
