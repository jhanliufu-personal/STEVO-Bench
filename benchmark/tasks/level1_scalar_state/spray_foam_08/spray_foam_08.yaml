  init_frame_description: A close-up view of a wooden wall cavity framed by vertical studs. A large, irregular
    mound of wet, yellowish spray foam is expanding at the bottom of the cavity. A gloved hand holding
    a spray gun nozzle enters from the top right, directing a stream of liquid onto the foam. Sawdust
    and debris cover the floor at the base of the studs.
  init2final_edit_prompt: Edit the given image to show the yellow foam mound significantly reduced in
    volume. The foam should appear melted, deflated, and dissolved, occupying much less space in the wall
    cavity than in the original image. The height of the foam pile should be lower. Maintain the wooden
    studs, the floor debris, and the camera angle exactly as they are.
  rationale: 'The video prompt describes a chemical reaction where a solvent dissolves the foam, causing
    it to shrink rapidly. Although a plywood sheet temporarily occludes the view, it retracts by the end
    of the sequence. Therefore, the final frame must show the aftermath of the reaction: the foam mound
    should be visibly smaller, deflated, and lower in height compared to the initial expanding state.
    The camera remains static, preserving the background structure.'
