id: spray_foam_06
level: 1
category: scalar_state
tags: []
variant_of: spray_foam
variation_type: dynamic_condition
variation_description: The foam is dense and cold, expanding extremely slowly compared to the original.
changes:
  occlusion_method: null
  dynamic_conditions: Cold temperature and high viscosity mixture.
  expected_outcome_change: Expansion occurs but at a much slower rate.
prompts:
  init_frame_edit_prompt: Edit the image to make the foam look very dense and sluggish, with a darker
    yellow-orange tint.
  video_WM: The dense foam mixture is expanding extremely slowly due to the cold temperature. The volume
    increase is barely perceptible. The camera rotates right until the foam completely exits the view,
    then rotates toward the left smoothly at the same rate until the foam is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The dense foam mixture is expanding extremely slowly due to the cold temperature. The volume
    increase is barely perceptible. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden wall cavity during construction. Two
    vertical wooden studs frame the shot on the left and right. At the bottom of the cavity, a pile of
    wet, yellow expanding spray foam is settling. A gloved hand holds a spray gun nozzle in the upper
    right corner, directing the foam application. Wood shavings and dust are scattered on the bottom plate
    and surrounding floor area. The foam has a glossy, bubbly, and irregular texture.
  init2final_edit_prompt: Edit the given image to show the yellow spray foam looking almost identical
    to the initial state, with only a minute, barely perceptible increase in volume. The foam pile must
    retain its original shape, height, and position at the bottom of the wall cavity. Do not make the
    foam expand significantly or fill the cavity. Keep the wooden studs, shavings, and spray gun in their
    original positions.
  rationale: The video prompt specifies that the foam is expanding 'extremely slowly' and the change is
    'barely perceptible'. The camera rotates away (occluding the foam) and then returns to the original
    view. Therefore, the final frame should look nearly identical to the initial frame in terms of composition
    and foam volume. The primary challenge for the model is to maintain the object permanence of the foam
    while adhering to the text constraint that suppresses the typical physical prior of rapid foam expansion.
  questions:
  - id: foam_existence
    question: Is the yellow spray foam still visible at the bottom of the wall cavity?
    answer_type: yes_no
    notes_for_judge: Tests object permanence after the camera pans away and returns.
  - id: foam_volume_stability
    question: Does the foam occupy approximately the same volume as it did in the initial frame?
    answer_type: yes_no
    notes_for_judge: The prompt specifies 'barely perceptible' expansion, so the volume should not have
      changed significantly.
  - id: foam_height_limit
    question: Is the height of the foam pile roughly the same as in the initial frame?
    answer_type: yes_no
    notes_for_judge: Tests that the foam has not grown vertically in a significant way.
  - id: foam_containment
    question: Has the foam avoided filling the upper portion of the space between the studs?
    answer_type: yes_no
    notes_for_judge: The foam should remain at the bottom, not filling the cavity.
  - id: foam_texture
    question: Does the foam retain a wet, bubbly, and irregular texture?
    answer_type: yes_no
    notes_for_judge: Checks for attribute consistency.
  - id: stud_visibility
    question: Are the vertical wooden studs still visible on both sides of the foam?
    answer_type: yes_no
    notes_for_judge: Checks that the environment is preserved.
  - id: expansion_check
    question: Does the foam appear to have expanded only slightly or not at all, rather than rapidly?
    answer_type: yes_no
    notes_for_judge: Verifies adherence to the 'extremely slowly' constraint.
  - id: gun_presence
    question: Is the spray gun nozzle still visible in the upper right area?
    answer_type: yes_no
    notes_for_judge: Checks for consistency of the camera/tool setup upon return to the initial view.
