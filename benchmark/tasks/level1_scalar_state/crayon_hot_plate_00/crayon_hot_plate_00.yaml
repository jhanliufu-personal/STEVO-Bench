evaluation:
  init_frame_description: A blue crayon stands upright in the center of a black circular electric hot
    plate. The hot plate has a red indicator light illuminated on the front panel next to the text 'HEATING'.
    The background is dark and out of focus, showing parts of a kitchen counter.
  init2final_edit_prompt: Edit the given image to show the blue crayon melting. Reduce the height of the
    standing crayon so it is shorter than in the original image. Create a pool of melted blue liquid wax
    spreading out on the black hot plate surface around the base of the crayon. Deform the bottom of the
    remaining solid crayon to look like it is turning into liquid. Keep the red indicator light on and
    the background unchanged.
  rationale: The prompt states the hot plate is actively heating and its temperature exceeds the melting
    point of the wax crayon. Therefore, the physical state of the crayon must evolve from solid to liquid.
    This process results in a reduction of the crayon's height (scalar change in length/mass of the solid
    component) and the formation of a liquid pool at the base (scalar change in volume of liquid). The
    camera remains stationary, so the background and hot plate structure should remain consistent.
