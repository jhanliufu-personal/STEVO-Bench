id: dry_ice_sublimate_10
level: 1
category: scalar_state
tags: []
variant_of: dry_ice_sublimate
variation_type: combined
variation_description: Ice water condition combined with person blocking view.
changes:
  occlusion_method: Person walks in front of camera.
  dynamic_conditions: Water is ice-cold with floating ice cubes.
  expected_outcome_change: Slower sublimation rate.
prompts:
  init_frame_edit_prompt: Edit the image to show floating ice cubes in the water surrounding the central
    dry ice block.
  video_WM: The dry ice sits in ice-cold water with floating ice cubes, sublimating slowly. A person walks
    in front of the camera, their torso completely blocking the view of the bowl. They stand there for
    a moment before walking away. No cut, no scene change. STOP.
  camera_WM: The dry ice sits in ice-cold water with floating ice cubes, sublimating slowly. A person
    walks in front of the camera, their torso completely blocking the view of the bowl. They stand there
    for a moment before walking away. No cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a beige ceramic bowl sitting on a wooden table.
    The bowl is filled with water and contains several translucent regular ice cubes and a large, central
    block of white, frosty dry ice. Thick white fog (sublimation mist) is billowing out of the bowl and
    spilling onto the wooden surface. The lighting is warm and natural, creating highlights on the water
    and ice.
  init2final_edit_prompt: Edit the given image to show the central block of dry ice significantly reduced
    in size. The white dry ice mass should appear smaller and eroded compared to the original state, indicating
    material loss. Keep the regular ice cubes floating in the water. Maintain the white fog and mist effects
    around the bowl and on the table. Ensure the person mentioned in the context is not visible and the
    view of the bowl is completely unobstructed, matching the original camera angle.
  rationale: The video prompt describes a sequence where a person temporarily blocks the camera view while
    the dry ice continues to sublimate. Sublimation is a continuous physical process where the solid dry
    ice turns into gas, resulting in a loss of mass and volume over time. Therefore, when the person walks
    away and the view is restored, the central block of dry ice must be visibly smaller than it was in
    the initial frame. The regular ice cubes may melt slightly or remain largely unchanged due to the
    cooling effect of the dry ice, but the primary scalar change is the reduction of the dry ice mass.
    The final frame must show the scene after the occlusion has ended, meaning the person is no longer
    visible.
