variation_description: Butter on hot burner (melting) with lights-out occlusion.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Object is butter.
  expected_outcome_change: Butter melts into yellow liquid.
prompts:
  init_frame_edit_prompt: Edit the image to replace the clear ice cube with a rectangular stick of yellow
    butter.
  video_WM: A stick of yellow butter sits on top of an electric cooktop burner. The cooktop display shows
    it is turned on. Suddenly, the lights in the kitchen turn off completely, resulting in a black screen.
    The darkness persists for several seconds. The lights turn back on, illuminating the scene again.
  camera_WM: A stick of yellow butter sits on top of an electric cooktop burner. The cooktop display shows
    it is turned on. Suddenly, the lights in the kitchen turn off completely, resulting in a black screen.
    The darkness persists for several seconds. The lights turn back on, illuminating the scene again.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A rectangular stick of yellow butter sits directly on the glass surface of an
    electric cooktop. The circular burner element beneath the butter is glowing bright red. A pool of
    melted liquid butter has already formed around the base of the stick, bubbling slightly. Smoke is
    rising from the butter. To the right, a digital display embedded in the glass surface reads 'ON' and
    'HIGH' in red LED segments. The cooktop has a stainless steel front panel with control knobs.
  init2final_edit_prompt: Edit the given image to show the stick of butter significantly more melted.
    Reduce the height and overall volume of the solid rectangular block of butter, making it look slumped
    or deformed. Expand the pool of yellow liquid butter so it covers a larger area of the glowing red
    burner coils. Maintain the red glow of the heating element and the smoke rising from the hot surface.
  rationale: The initial frame shows butter on a burner set to 'HIGH', already beginning to melt. The
    video prompt introduces a period of darkness lasting several seconds, during which the heat source
    remains active. Physically, the high heat will cause the butter to melt rapidly. Therefore, when the
    lights return, the solid butter should be smaller and less defined, and the liquid pool should be
    significantly larger. The camera angle remains static, and the lighting returns to its original state.
