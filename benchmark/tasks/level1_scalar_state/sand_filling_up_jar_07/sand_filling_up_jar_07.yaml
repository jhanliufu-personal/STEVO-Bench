evaluation:
  init_frame_description: A glass jar sits on a rustic wooden table. Inside the jar, there is a small,
    conical pile of beige sand at the bottom. The neck of the jar is tightly plugged with a thick, brown
    cork stopper. Resting on top of the jar and the stopper is a clear glass funnel filled with a large
    amount of beige sand. The sand in the funnel is piled high, held back by the stopper in the jar's
    neck.
  init2final_edit_prompt: Edit the given image to show the scene unchanged after a period of time. The
    glass funnel should remain filled with the same high level of sand as before. The small pile of sand
    at the bottom of the jar should remain exactly the same size and shape. The cork stopper should still
    be visible, tightly plugging the neck of the jar. The lighting and composition should match the original
    image exactly.
  rationale: 'The prompt establishes a physical constraint: the jar''s neck is tightly plugged with a
    cork stopper. Although gravity acts on the sand in the funnel, the stopper prevents any flow into
    the jar. The period of darkness (occlusion) passes time, but the prompt describes no agent or action
    that removes the stopper. Therefore, the physical state must remain static; no sand flows, and the
    levels in the funnel and jar remain identical to the initial frame.'
