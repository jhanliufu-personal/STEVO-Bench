id: spray_foam_07
level: 1
category: scalar_state
tags: []
variant_of: spray_foam
variation_type: combined
variation_description: Cured/static foam combined with lights-off occlusion.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Foam is cured/static.
  expected_outcome_change: No change in volume.
prompts:
  init_frame_edit_prompt: Edit the image to make the yellow foam look dry, rigid, and matte, indicating
    it has fully hardened and cured.
  video_WM: The yellow insulation foam is fully cured, rigid, and static. The scene lights suddenly cut
    out, leaving the frame in total darkness. After a pause, the lights flicker back on to full brightness.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The yellow insulation foam is fully cured, rigid, and static. The scene lights suddenly cut
    out, leaving the frame in total darkness. After a pause, the lights flicker back on to full brightness.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a wooden wall cavity during construction. Two vertical wooden
    studs frame the shot. At the bottom between the studs, a mound of yellow spray foam insulation is
    present, exhibiting a bubbly, irregular texture. In the upper right corner, a gloved hand holds a
    spray gun nozzle directed toward the foam. The floor is covered with sawdust and small wood debris.
    The scene is well-lit.
  init2final_edit_prompt: Edit the given image to maintain the exact same appearance as the original.
    The yellow foam must remain static, with identical volume, shape, and texture, showing no expansion.
    The lighting should be fully restored to its original brightness and color temperature. The gloved
    hand and spray gun must remain in the same position. The sawdust and wood studs should appear unchanged.
  rationale: The video prompt explicitly states that the foam is 'fully cured, rigid, and static,' which
    overrides the visual expectation of expanding foam; therefore, the foam's volume and shape must remain
    constant. The lighting event describes a temporary blackout followed by a return to 'full brightness.'
    Consequently, the final frame should be visually indistinguishable from the initial frame, testing
    the model's ability to maintain stability and resist hallucinating motion or expansion.
  questions:
  - id: foam_stability_1
    question: Is the volume of the yellow foam approximately the same as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The foam should not expand or shrink; it is described as cured and static.
  - id: foam_stability_2
    question: Does the yellow foam appear to have the same shape as it did initially?
    answer_type: yes_no
    notes_for_judge: Check for lack of expansion or deformation.
  - id: lighting_restoration
    question: Is the scene fully illuminated at a brightness level comparable to the start?
    answer_type: yes_no
    notes_for_judge: The lights should have flickered back on to full brightness.
  - id: no_expansion
    question: Is the yellow foam free from any visible expansion?
    answer_type: yes_no
    notes_for_judge: The prompt explicitly forbids expansion.
  - id: object_persistence_gun
    question: Is the spray gun still visible in the top right corner?
    answer_type: yes_no
    notes_for_judge: Secondary object consistency.
  - id: object_persistence_debris
    question: Is the sawdust on the floor arranged in the same way as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary object consistency.
