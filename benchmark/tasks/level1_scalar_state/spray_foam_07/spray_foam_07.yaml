evaluation:
  init_frame_description: A close-up view of a wooden wall cavity during construction. Two vertical wooden
    studs frame the shot. At the bottom between the studs, a mound of yellow spray foam insulation is
    present, exhibiting a bubbly, irregular texture. In the upper right corner, a gloved hand holds a
    spray gun nozzle directed toward the foam. The floor is covered with sawdust and small wood debris.
    The scene is well-lit.
  init2final_edit_prompt: Edit the given image to maintain the exact same appearance as the original.
    The yellow foam must remain static, with identical volume, shape, and texture, showing no expansion.
    The lighting should be fully restored to its original brightness and color temperature. The gloved
    hand and spray gun must remain in the same position. The sawdust and wood studs should appear unchanged.
  rationale: The video prompt explicitly states that the foam is 'fully cured, rigid, and static,' which
    overrides the visual expectation of expanding foam; therefore, the foam's volume and shape must remain
    constant. The lighting event describes a temporary blackout followed by a return to 'full brightness.'
    Consequently, the final frame should be visually indistinguishable from the initial frame, testing
    the model's ability to maintain stability and resist hallucinating motion or expansion.
