scalar_variable: Glow brightness
prompts:
  image_gen_prompt: A jagged piece of volcanic rock sitting on a metal tray. The entire rock is glowing
    a vibrant, brilliant orange from extreme internal heat.
  video_WM: A piece of volcanic rock is glowing bright orange and is cooling toward black. The cooling
    continues steadily. The camera rotates right until the rock and tray completely exit the view, then
    rotates toward the left smoothly at the same rate until the rock is back in the center of view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The lava rock is cooling; the dimming of the orange glow continues at a constant rate. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a large, jagged chunk of volcanic rock sitting on a dirty,
    weathered metal baking sheet. The rock is intensely hot, with bright orange and yellow molten lava
    glowing from deep cracks and fissures, contrasting with the blackened, cooled crust on the exterior.
    Smoke and heat distortion rise from the rock. The tray reflects the orange glow of the heat. The background
    is a dark, blurred industrial workshop environment.
  init2final_edit_prompt: Edit the given image to make the volcanic rock appear significantly cooler.
    Replace the bright orange and yellow glowing areas within the cracks with dark grey and black solidified
    rock textures. Reduce the intensity of the light emitted by the rock and the corresponding orange
    reflection on the metal tray. The rock should look mostly dark and solid, with the glowing heat largely
    extinguished.
  rationale: The prompt describes a continuous cooling process. While the camera rotates away and then
    returns to the original view, the rock's temperature must decrease. Visually, this scalar change is
    represented by a reduction in incandescence (glowing brightness) and a transition from orange/yellow
    colors to black/grey solid rock. The final frame should show the rock in the same position but in
    a later state of cooling, meaning it should be darker and less luminous than the initial frame.
