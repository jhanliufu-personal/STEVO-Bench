id: steam_kettle_spout
level: 1
category: scalar_state
tags: []
prompts:
  image_gen_prompt: A metal kettle with a visible spout sits on an electric burner with the indicator light showing active heating. The kettle contains water. A thin wisp of steam is just beginning to emerge from the spout opening.
  video_WM: The kettle remains on the hot burner. As the water inside approaches boiling temperature, the steam emerging from the spout increases in volume and density. The thin initial wisp transitions to thicker streams of white steam. The steam plume grows from barely visible vapor to a substantial jet flowing continuously from the spout. The camera rotates right at constant speed until the kettle completely exits the view to the right. The camera continues rotating right for several seconds while the water continues heating and producing more steam off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the kettle back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The kettle remains on the hot burner. As the water inside approaches boiling temperature, the steam emerging from the spout increases in volume and density. The thin initial wisp transitions to thicker streams of white steam. The steam plume grows from barely visible vapor to a substantial jet flowing continuously from the spout during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
