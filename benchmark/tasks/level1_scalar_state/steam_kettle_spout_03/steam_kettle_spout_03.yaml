variation_description: Occlusion changed to thick smoke filling the room.
changes:
  occlusion_method: Thick smoke obscures view
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The kettle sits on an active hot burner. The kettle contains water. Water boils at 212°F at
    standard pressure. The burner provides continuous heat. Steam exits through the spout opening. Thick,
    opaque grey smoke begins to fill the room rapidly, completely obscuring the kettle and stove from
    view. The smoke swirls densely for several seconds. Then a ventilation fan clears the smoke, restoring
    visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The kettle sits on an active hot burner. The kettle contains water. Water boils at 212°F
    at standard pressure. The burner provides continuous heat. Steam exits through the spout opening.
    Thick, opaque grey smoke begins to fill the room rapidly, completely obscuring the kettle and stove
    from view. The smoke swirls densely for several seconds. Then a ventilation fan clears the smoke,
    restoring visibility. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A stainless steel gooseneck kettle sits on a black electric stovetop. The spiral
    burner coil underneath the kettle is glowing bright orange-red. A wisp of white steam is visible exiting
    the tip of the curved spout. The kettle has a black handle and a lid with a black knob. The background
    shows a blurred kitchen counter and a window with daylight.
  init2final_edit_prompt: Edit the given image to show the scene after some time has passed. Ensure the
    electric burner coil is still glowing bright orange-red to indicate continuous heat. Show white steam
    clearly exiting the spout of the kettle. The air in the room must be clear and transparent, with no
    thick grey smoke or haze obscuring the view. The kettle and stove should remain in their original
    positions.
  rationale: The video prompt describes a continuous boiling process that is temporarily obscured by smoke
    and then revealed again. The primary physical state—the boiling water and the hot burner—persists
    throughout the occlusion. The final frame occurs after the ventilation fan has cleared the smoke,
    restoring visibility. Therefore, the final image should show the kettle still on the active, glowing
    burner with steam exiting the spout, and the temporary smoke occlusion should be completely gone.
