id: heating_rod_08
level: 1
category: scalar_state
tags: []
variant_of: heating_rod
variation_type: combined
variation_description: Combined static cold state with zoom occlusion.
changes:
  occlusion_method: Camera zooms out and in.
  dynamic_conditions: Rod cold; Coil inactive.
  expected_outcome_change: No change (rod remains grey).
prompts:
  init_frame_edit_prompt: Edit the image so the steel rod is dull grey metal with absolutely no glow.
  video_WM: A cold steel rod sits in an inactive induction coil. The camera zooms out rapidly until the
    rod and coil are too small to see clearly, then zooms back in to the original framing. No cut, no
    scene change. STOP.
  camera_WM: A cold steel rod sits in an inactive induction coil. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A thick, grey steel rod is inserted horizontally through a large, spiraled copper
    induction coil. The coil is made of thick copper tubing and appears inactive (copper-colored, no glow).
    The rod has a matte metallic finish and appears cold. The background is a cluttered industrial workshop
    with green machinery, metal beams, and overhead lighting.
  init2final_edit_prompt: Edit the given image to ensure the steel rod remains completely grey and metallic,
    showing absolutely no signs of heating, redness, or glowing. Keep the copper coil its original copper
    color, ensuring it does not appear active or glowing. The scene, including the rod's position and
    the background machinery, should look identical to the original state.
  rationale: The video prompt explicitly describes the induction coil as 'inactive' and specifies that
    the camera zooms out and then back in to the original framing with 'no scene change'. Therefore, despite
    the visual setting suggesting an induction heating process, the text constraint dictates that the
    rod must remain cold and the state unchanged. The evaluation tests the model's ability to adhere to
    the 'inactive' descriptor and maintain state stability (zero temperature change) rather than hallucinating
    a heating effect based on the visual context.
  questions:
  - id: q1
    question: Is the steel rod still grey and metallic in color?
    answer_type: yes_no
    notes_for_judge: The rod should not have turned red, orange, or yellow.
  - id: q2
    question: Does the rod appear cold, without any visible glow?
    answer_type: yes_no
    notes_for_judge: Check for absence of incandescence.
  - id: q3
    question: Is the copper coil still the same non-glowing copper color as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The coil should not be glowing or white-hot.
  - id: q4
    question: Is the rod positioned horizontally through the center of the coil?
    answer_type: yes_no
    notes_for_judge: Object permanence check.
  - id: q5
    question: Is the background machinery still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: q6
    question: Does the rod appear to be the same temperature as it was in the beginning?
    answer_type: yes_no
    notes_for_judge: Scalar stability check.
