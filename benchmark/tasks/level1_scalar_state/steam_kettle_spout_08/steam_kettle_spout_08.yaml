id: steam_kettle_spout_08
level: 1
category: scalar_state
tags: []
variant_of: steam_kettle_spout
variation_type: combined
variation_description: Burner turning off combined with object blocking occlusion.
changes:
  occlusion_method: Large cutting board blocks view
  dynamic_conditions: Burner turns off at start
  expected_outcome_change: Steam dissipates while view is blocked.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The kettle sits on an active hot burner with steam exiting the spout. Immediately, the burner
    is switched off, cutting the heat source. A large wooden cutting board is lifted into the frame, completely
    blocking the view of the kettle and stove. The board remains in place for several seconds. Then the
    board is lowered, revealing the stove again. No zoom, no cut, no scene change. STOP.
  camera_WM: The kettle sits on an active hot burner with steam exiting the spout. Immediately, the burner
    is switched off, cutting the heat source. A large wooden cutting board is lifted into the frame, completely
    blocking the view of the kettle and stove. The board remains in place for several seconds. Then the
    board is lowered, revealing the stove again. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A stainless steel gooseneck kettle sits on an electric stove. The electric coil
    burner beneath the kettle is glowing bright orange, indicating it is very hot. A wisp of white steam
    is rising from the kettle's spout. The background shows a kitchen counter and a window.
  init2final_edit_prompt: Edit the given image to show the stove burner turned off. Change the electric
    coil under the kettle from glowing bright orange to a dark, non-glowing grey or black color. Remove
    the steam rising from the kettle's spout. Maintain the exact position of the kettle and the background
    details.
  rationale: The prompt specifies that the burner is switched off immediately and the scene is occluded
    for several seconds. Physically, when an electric coil is turned off, the visible incandescence (red/orange
    glow) fades relatively quickly as it cools below the Draper point, returning to a dark color. Additionally,
    without active heat input, the water will stop boiling vigorously, causing the visible steam exiting
    the spout to dissipate or cease entirely. The final frame should reflect this cooling process.
