id: tape_retract
level: 1
category: scalar_state
scalar_variable: Extension length
prompts:
  image_gen_prompt: A yellow metal tape measure extended 5 feet across a wooden floor. A hand is visible
    holding the tape housing, with a finger pressing the retraction button.
  video_WM: A metal tape measure is extended 5 feet. The retraction button is held down, and the tape
    is visibly zipping back into the housing. The retraction continues until the tape is gone. The camera
    rotates right until the tape and housing completely exit the view, then rotates toward the left smoothly
    at the same rate until the housing is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A tape measure is retracting; the zipping motion continues steadily as the button is held.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
