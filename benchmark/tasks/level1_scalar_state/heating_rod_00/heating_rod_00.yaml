prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A steel rod sits in an active induction coil, glowing faint red. Camera remains stationary
    throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: A steel rod sits in an active induction coil, glowing faint red. Camera remains stationary
