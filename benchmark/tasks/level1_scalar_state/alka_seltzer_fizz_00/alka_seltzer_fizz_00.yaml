  init_frame_description: A clear glass filled with water sits on a white table in a sunlit kitchen. A
    white, round effervescent tablet is suspended in mid-air directly above the center of the glass, with
    a water droplet hanging from it.
  init2final_edit_prompt: Edit the given image to show the white tablet submerged at the bottom of the
    glass of water. Remove the tablet from the air above the glass. Fill the water in the glass with numerous
    small bubbles rising from the submerged tablet, making the water appear fizzy and effervescent.
  rationale: The video prompt indicates the tablet contacts the water. Physically, the tablet will fall
    due to gravity, sink to the bottom of the glass, and immediately begin a chemical reaction (effervescence)
    releasing carbon dioxide bubbles. The final state should show the tablet submerged and the water filled
    with bubbles generated by the reaction.
