id: alka_seltzer_fizz_00
level: 1
category: scalar_state
tags: []
variant_of: alka_seltzer_fizz
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The effervescent tablet contacts the water at the bottom of the glass. The tablet contains
    citric acid and sodium bicarbonate. Camera remains stationary throughout. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The effervescent tablet contacts the water at the bottom of the glass. The tablet contains
    citric acid and sodium bicarbonate. Camera remains stationary throughout. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass filled with water sits on a white table in a sunlit kitchen. A
    white, round effervescent tablet is suspended in mid-air directly above the center of the glass, with
    a water droplet hanging from it.
  init2final_edit_prompt: Edit the given image to show the white tablet submerged at the bottom of the
    glass of water. Remove the tablet from the air above the glass. Fill the water in the glass with numerous
    small bubbles rising from the submerged tablet, making the water appear fizzy and effervescent.
  rationale: The video prompt indicates the tablet contacts the water. Physically, the tablet will fall
    due to gravity, sink to the bottom of the glass, and immediately begin a chemical reaction (effervescence)
    releasing carbon dioxide bubbles. The final state should show the tablet submerged and the water filled
    with bubbles generated by the reaction.
  questions:
  - id: tablet_submerged
    question: Is the white tablet now inside the glass of water?
    answer_type: yes_no
    notes_for_judge: The tablet should have moved from the air into the water.
  - id: tablet_lower
    question: Is the tablet positioned lower vertically than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: It should have fallen from the air to the bottom of the glass.
  - id: bubbles_increase
    question: Are there more bubbles visible in the water than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The reaction creates significant effervescence.
  - id: air_clear
    question: Is the space directly above the glass clear of the tablet?
    answer_type: yes_no
    notes_for_judge: The tablet should no longer be floating in the air.
  - id: water_turbidity
    question: Does the water appear fizzier or more cloudy than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Due to the release of gas bubbles.
  - id: glass_consistency
    question: Is the glass cup still standing on the table?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
