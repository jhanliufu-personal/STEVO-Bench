id: syrup_fill_08
level: 1
category: scalar_state
tags: []
variant_of: syrup_fill
variation_type: combined
variation_description: Heavy gushing flow combined with lights turning off.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Heavy, gushing torrent.
  expected_outcome_change: Level rises significantly faster.
prompts:
  init_frame_edit_prompt: Edit the image to make the pouring stream of syrup much wider and thicker, looking
    like a heavy gush of liquid.
  video_WM: A glass jar is 25% full of syrup. A massive, heavy torrent of syrup gushes in from the spout.
    The kitchen lights flicker and turn off completely, leaving the scene in pitch blackness, then turn
    back on. No zoom, no cut, no scene change. STOP.
  camera_WM: A glass jar is 25% full of syrup. A massive, heavy torrent of syrup gushes in from the spout.
    The kitchen lights flicker and turn off completely, leaving the scene in pitch blackness, then turn
    back on. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A clear glass jar sits on a wooden countertop, filled approximately 30-40% with
    amber-colored syrup. A metal spout extends from the top right, pouring a steady stream of syrup into
    the center of the jar. Bubbles are visible on the surface of the liquid. To the left, a wooden cutting
    board stands vertically. In the background, a ceramic jug and a window looking out onto trees are
    visible.
  init2final_edit_prompt: Edit the given image to show the glass jar filled with a significantly higher
    level of syrup. The amber liquid should occupy most of the jar's volume, leaving less empty space
    at the top compared to the original image. Maintain the pouring stream and the original lighting conditions.
  rationale: The video prompt describes a continuous filling process ('massive, heavy torrent') that occurs
    even while the lights are temporarily off. Since the lights turn back on before the video stops, the
    final frame must show the scene illuminated again, but with the accumulated result of the pouring
    action. Therefore, the jar must contain a significantly higher volume of syrup than in the initial
    frame.
  questions:
  - id: syrup_level_height
    question: Is the level of the syrup in the jar higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical height of the liquid against the jar's ridges.
  - id: syrup_volume_increase
    question: Does the jar contain a larger amount of syrup compared to the start?
    answer_type: yes_no
    notes_for_judge: The total volume of amber liquid should be greater.
  - id: empty_space_reduction
    question: Is the empty headspace at the top of the jar smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the air gap above the liquid has decreased.
  - id: filling_progress
    question: Is the jar fuller than it was initially?
    answer_type: yes_no
    notes_for_judge: General assessment of fullness.
  - id: consistency_cutting_board
    question: Is the wooden cutting board to the left still visible?
    answer_type: yes_no
    notes_for_judge: Consistency check for static objects.
  - id: consistency_window
    question: Is the window in the background still visible?
    answer_type: yes_no
    notes_for_judge: Consistency check for background.
