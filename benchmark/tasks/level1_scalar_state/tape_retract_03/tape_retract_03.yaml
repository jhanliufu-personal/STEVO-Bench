id: tape_retract_03
level: 1
category: scalar_state
tags: []
variant_of: tape_retract
variation_type: occlusion_method
variation_description: Camera zooms out until details are lost, then zooms back in.
changes:
  occlusion_method: Camera zooms out to extreme distance.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A metal tape measure is extended 5 feet. The retraction button is held down, and the tape
    is visibly zipping back into the housing. The camera zooms out rapidly and continuously until the
    tape measure housing is a barely visible speck on the floor. The camera then zooms back in smoothly
    to the original framing. No cut, no scene change. STOP.
  camera_WM: A metal tape measure is extended 5 feet. The retraction button is held down, and the tape
    is visibly zipping back into the housing. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up view of a hand holding a yellow tape measure housing on a wooden
    floor. The yellow metal tape extends horizontally to the left, with inch markings visible (4, 5, 6).
    A window sill is visible in the background along the top left edge.
  init2final_edit_prompt: Edit the given image to show the tape measure fully retracted. Remove the long
    extended strip of yellow tape from the wooden floor. The hand and yellow housing should remain in
    the same position, but the metal hook of the tape should now be resting against the mouth of the housing.
  rationale: The prompt describes the tape retracting ('zipping back') while the camera zooms out and
    then back in. The duration of the camera movement allows time for the spring-loaded tape to retract
    completely. Since the camera returns to the original framing, the final view should show the same
    scene but with the tape retracted into the housing.
