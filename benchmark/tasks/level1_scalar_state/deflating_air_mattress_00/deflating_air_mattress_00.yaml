evaluation:
  init_frame_description: A close-up, eye-level shot of a blue, inflated air mattress resting on a wooden
    floor. The mattress is thick and taut. On the side facing the viewer, there is a black air valve with
    its cap unplugged and hanging loose. The background shows a blurry window and white wall.
  init2final_edit_prompt: Edit the given image to show the blue air mattress in a deflated state. Reduce
    the height and overall volume of the mattress so it sits lower to the ground. Add significant wrinkles,
    creases, and sagging folds to the top and side surfaces to indicate the loss of air pressure and tension.
    Ensure the black valve remains open. Keep the wooden floor and background window unchanged.
  rationale: The video prompt describes an air mattress that is actively deflating through an open valve.
    Physically, this results in a loss of air volume, causing the mattress to lose its rigid shape. The
    height of the mattress will decrease, and the previously taut surface will become loose, wrinkled,
    and saggy as the internal pressure drops. The camera remains stationary, so the background and floor
    perspective should not change.
