  init_frame_description: A clear glass tumbler filled with water sits on a white surface. A glass dropper
    is positioned above the center, dispensing red liquid. A drop of red dye has just entered the water,
    creating a concentrated, mushroom-shaped red plume suspended just below the surface of the water.
  init2final_edit_prompt: Edit the given image to show the red dye having diffused and sunk deeper into
    the water. The red plume should be significantly larger, wider, and extend further down towards the
    bottom of the glass compared to the original state. The edges of the red color should appear softer
    and more dispersed, occupying a greater volume of the water. Keep the glass container, the water level,
