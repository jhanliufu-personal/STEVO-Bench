  camera_WM: The red food coloring drop enters the water and begins dispersing. Vibrant red tendrils form and swirl downward through the clear water, creating dynamic patterns as the dye diffuses. The colored region gradually expands and spreads throughout the water, transitioning from concentrated tendrils to a more uniform light pink tint during the occlusion period. STOP.
