id: matchstick_burning_03
level: 1
category: scalar_state
tags: []
variant_of: matchstick_burning
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to the camera physically moving backward
  until details are lost.
changes:
  occlusion_method: Camera moves backward (dolly out) until the match is a speck.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The matchstick flame burns at the tip. The match is wooden with combustible material. Oxygen
    is available. The camera moves backward rapidly, pulling away from the hand until the match is just
    a tiny, indistinguishable speck in the distance. The camera holds this distant position for several
    seconds. Then the camera moves forward smoothly back to the original viewpoint. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The matchstick flame burns at the tip. The match is wooden with combustible material. Oxygen
    is available. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, first-person perspective shot of a dirty hand holding a burning
    matchstick against a blurred, neutral beige background. The matchstick is wooden with a blackened,
    charred tip where a bright orange and yellow flame is burning. Smoke is rising from the flame. The
    unburnt portion of the matchstick is light-colored wood.
  init2final_edit_prompt: Edit the given image to show the matchstick after it has burned for some time.
    The blackened, charred section of the matchstick should extend significantly further down the wooden
    shaft towards the fingers. The flame should be positioned lower on the stick, closer to the hand,
    consuming more of the previously unburnt wood. Keep the hand position, background, and lighting identical
    to the original image.
  rationale: 'The video prompt describes a camera movement that pulls away and then returns to the original
    viewpoint after a delay. During the time the camera is away (several seconds), the matchstick continues
    to burn naturally. Therefore, when the camera returns to the initial framing, the state of the match
    must reflect the passage of time: the flame will have traveled further down the stick, increasing
    the length of the charred portion and decreasing the length of the unburnt wood.'
