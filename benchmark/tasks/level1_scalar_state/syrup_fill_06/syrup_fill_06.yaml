  dynamic_conditions: Heavy, gushing torrent of syrup.
  expected_outcome_change: Level rises significantly faster (likely overflowing).
prompts:
  init_frame_edit_prompt: Edit the image to make the pouring stream of syrup much wider and thicker, looking
    like a heavy gush of liquid.
  video_WM: A glass jar is 25% full of syrup. A massive, heavy torrent of syrup gushes in from the spout.
    The camera rotates right until the jar and spout completely exit the view, then rotates toward the
    left smoothly at the same rate until the jar is back in the center of view. No zoom, no cut, no scene
    change. STOP.
  camera_WM: A glass jar is 25% full of syrup. A massive, heavy torrent of syrup gushes in from the spout.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A clear glass jar sits on a wooden countertop, filled approximately 25% with
    amber-colored syrup. A metal spout enters from the top right, pouring a stream of syrup into the jar,
    creating bubbles and turbulence in the liquid. To the left is a wooden cutting board, and behind the
    jar is a ceramic jug. Through a window in the background, trees are visible.
  init2final_edit_prompt: Edit the given image to show the glass jar filled with a significantly higher
    level of amber syrup. The syrup should occupy a much larger portion of the jar's volume compared to
    the original state, reducing the empty space at the top. Maintain the appearance of the pouring stream,
    the bubbles in the liquid, the wooden table, the cutting board on the left, and the background window
    exactly as they are.
  rationale: The video prompt describes a 'massive, heavy torrent' of syrup gushing into the jar while
    the camera pans away and then returns. This implies a continuous filling action during the period
    of occlusion. When the camera returns to the initial viewpoint, the primary state change must be a
    significant increase in the volume of syrup inside the jar. The jar should be much fuller than the
    initial 25% level.
