id: sand_filling_up_jar_01
level: 1
category: scalar_state_change
tags: []
variant_of: sand_filling_up_jar
variation_type: occlusion_method
variation_description: Occlusion changed from camera panning to lights turning off (pitch black).
changes:
  occlusion_method: Lights turn off completely, plunging the scene into darkness, then turn back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts or zoom. Camera is fixed on the funnel and jar. Sand flows
    continuously through the glass funnel into the jar. Suddenly, the lights turn off completely, plunging
    the scene into pitch black darkness. The darkness lasts for several seconds. Then the lights turn
    back on, revealing the scene again. Lighting and objects remain consistent and realistic.
  camera_WM: Single continuous take, no cuts or zoom. Camera is fixed on the funnel and jar. Sand flows
    continuously through the glass funnel into the jar. Suddenly, the lights turn off completely, plunging
    the scene into pitch black darkness. The darkness lasts for several seconds. Then the lights turn
    back on, revealing the scene again. Lighting and objects remain consistent and realistic.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass jar sits on a rustic wooden table with a glass funnel placed in
    its mouth. Beige sand is pouring from above into the funnel, and a stream of sand flows from the funnel's
    spout into the jar, forming a conical pile at the bottom. The background consists of blurred wooden
    planks.
  init2final_edit_prompt: Edit the given image to show the pile of sand inside the glass jar as significantly
    larger and taller. The sand should fill more of the jar's volume, reaching a higher level than in
    the original image. Keep the glass funnel, the wooden table, and the lighting conditions identical
    to the original.
  rationale: The video prompt describes a continuous flow of sand that persists while the scene is obscured
    by darkness for several seconds. A correct world model must track the accumulation of mass during
    this occlusion. Therefore, when the lights turn back on, the pile of sand in the jar must be noticeably
    larger and taller than it was in the initial frame, reflecting the time that passed.
  questions:
  - id: sand_pile_height
    question: Is the pile of sand inside the jar taller than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the peak of the sand pile in the jar between the two frames.
  - id: sand_volume_increase
    question: Does the sand inside the jar occupy more volume than in the starting image?
    answer_type: yes_no
    notes_for_judge: The overall amount of sand in the bottom container should be greater.
  - id: empty_space_reduction
    question: Is there less empty space remaining in the jar compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the sand fills the jar, the air/empty space should decrease.
  - id: sand_level_rise
    question: Is the level of the sand against the glass walls higher than before?
    answer_type: yes_no
    notes_for_judge: Check if the base of the pile has widened and risen against the jar walls.
  - id: funnel_presence
    question: Is the glass funnel still positioned on top of the jar?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: table_consistency
    question: Is the wooden table texture consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
