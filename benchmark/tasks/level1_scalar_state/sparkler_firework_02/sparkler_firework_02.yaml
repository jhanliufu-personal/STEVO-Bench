variation_description: Occlusion changed from camera rotation to thick smoke filling the scene.
changes:
  occlusion_method: Thick smoke fills the room.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The sparkler has an active ignition point with sparks. The wire is coated with combustible
    metallic compound. Oxygen is available. Thick, heavy smoke suddenly billows into the frame, completely
    obscuring the sparkler and the hand. The smoke swirls densely for several seconds, hiding everything.
    Then the smoke clears rapidly, restoring visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The sparkler has an active ignition point with sparks. The wire is coated with combustible
    metallic compound. Oxygen is available. Thick, heavy smoke suddenly billows into the frame, completely
    obscuring the sparkler and the hand. The smoke swirls densely for several seconds, hiding everything.
    Then the smoke clears rapidly, restoring visibility. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up shot against a black background showing a hand on the right holding
    a lit sparkler horizontally. The sparkler extends to the left. A bright cluster of white and gold
    sparks is exploding from a burning point roughly in the middle of the stick. To the left of the burning
    point, a thin, glowing red wire (the burnt section) is visible. To the right of the burning point,
    towards the hand, a thicker gray section of unburnt combustible coating remains.
  init2final_edit_prompt: Edit the given image to show the sparkler in a later stage of combustion. Move
    the bright cluster of sparks and the burning point significantly closer to the hand on the right.
    Reduce the length of the thick unburnt coating between the sparks and the hand. Increase the length
    of the thin, glowing burnt wire extending to the left of the sparks. Keep the hand position and the
    dark background unchanged.
  rationale: The video prompt describes a sparkler burning while temporarily obscured by smoke for several
    seconds. Sparklers burn by consuming the combustible coating along the wire, meaning the ignition
    point travels along the stick. In the initial frame, the burn is progressing from the tip (left) towards
    the handle (right). During the occlusion, the burning process continues. Therefore, when visibility
    is restored, the ignition point must have moved closer to the hand, the unburnt fuel section must
    be shorter, and the burnt wire section must be longer.
