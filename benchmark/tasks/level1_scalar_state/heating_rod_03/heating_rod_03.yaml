id: heating_rod_03
level: 1
category: scalar_state
tags: []
variant_of: heating_rod
variation_type: occlusion_method
variation_description: Replaced camera rotation with thick industrial smoke filling the scene.
changes:
  occlusion_method: Thick white smoke fills the frame, obscuring the view, then clears.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A steel rod sits in an active induction coil, glowing faint red and getting brighter. Thick
    white industrial smoke billows into the frame, completely obscuring the rod and coil, then slowly
    dissipates to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: A steel rod sits in an active induction coil, glowing faint red and getting brighter. Thick
    white industrial smoke billows into the frame, completely obscuring the rod and coil, then slowly
    dissipates to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up industrial shot showing a thick, dark grey steel rod passing horizontally
    through a copper helical induction coil. The section of the rod inside the coil is glowing a faint,
    dull red, indicating it is heating up. The background features blurred industrial machinery, a green
    cabinet, and the interior of a workshop with overhead lighting.
  init2final_edit_prompt: Edit the given image to make the glowing section of the steel rod appear significantly
    hotter. Change the color of the heated area from faint red to a bright, intense orange or yellow-orange
    to represent increased temperature. Ensure the scene is clear of any smoke or obstruction, keeping
    the copper coil and industrial background unchanged.
  rationale: The video prompt describes the rod getting brighter (heating up) before being obscured by
    smoke. During the occlusion period, the induction heating process continues. Therefore, when the smoke
    dissipates to reveal the scene again, the rod must appear hotter than it was in the initial frame.
    Visually, this corresponds to a shift in the glow color from dull red to bright orange or yellow,
    and an increase in overall luminosity of the heated section.
  questions:
  - id: heating_rod_03_q1
    question: Is the glowing section of the rod brighter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the luminosity of the heated metal. It should be higher in the final frame.
  - id: heating_rod_03_q2
    question: Has the color of the heated metal shifted towards bright orange or yellow compared to the
      initial dull red?
    answer_type: yes_no
    notes_for_judge: The hue should shift from deep red to orange/yellow indicating higher temperature.
  - id: heating_rod_03_q3
    question: Does the rod appear hotter in the final frame than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Based on visual cues of heat (brightness, color temperature).
  - id: heating_rod_03_q4
    question: Is the intensity of the glow on the rod higher than before?
    answer_type: yes_no
    notes_for_judge: Similar to brightness, but assessing overall radiant intensity.
  - id: heating_rod_03_q5
    question: Is the rod visible again without being obscured by smoke?
    answer_type: yes_no
    notes_for_judge: The prompt states the smoke dissipates to reveal the scene.
  - id: heating_rod_03_q6
    question: Is the copper induction coil still in the same position relative to the rod?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: heating_rod_03_q7
    question: Is the background machinery unchanged?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: heating_rod_03_q8
    question: Is the glowing region still centered within the coil?
    answer_type: yes_no
    notes_for_judge: The heat source is the coil, so the glow should remain localized there.
