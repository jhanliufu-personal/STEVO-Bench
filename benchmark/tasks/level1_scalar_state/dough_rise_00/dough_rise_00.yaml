id: dough_rise_00
level: 1
category: scalar_state
tags: []
variant_of: dough_rise
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A bowl of yeast dough sits in the center of the view. Camera remains stationary throughout.
    No zoom, no cut, no scene change.
  camera_WM: A bowl of yeast dough sits in the center of the view. Camera remains stationary throughout.
    No zoom, no cut, no scene change.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A clear glass mixing bowl sits on a wooden butcher block countertop, containing
    a ball of smooth, flour-dusted yeast dough. A beige cloth is draped over the back rim of the bowl.
    To the right, a vertical thermometer stands on the counter. In the background, there is a window with
    daylight entering, a large jar of flour, and a container with a red lid. The scene is brightly lit
    with natural light.
  init2final_edit_prompt: Edit the given image so that the dough inside the glass bowl is significantly
    larger and expanded in volume. The dough should reach higher up the sides of the bowl and appear puffier,
    filling more of the bowl's interior space compared to the original state. The texture of the dough
    should look stretched. Ensure the glass bowl, the cloth draped over the edge, the thermometer, and
    the background objects remain unchanged in position and appearance.
  rationale: The initial image shows a setup for proofing yeast dough, indicated by the covered bowl and
    nearby thermometer. The fundamental scalar state change expected in this context is the expansion
    of the dough's volume (rising) due to fermentation. The rollout simulates the passage of time where
    the dough grows in size, filling more of the bowl. The camera remains static, allowing for a direct
    comparison of the dough's volume and height against the fixed container.
  questions:
  - id: dough_volume_increase
    question: Is the volume of the dough visibly larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall size of the dough mass.
  - id: dough_height_rise
    question: Has the dough risen higher within the glass bowl compared to the start?
    answer_type: yes_no
    notes_for_judge: Check the vertical level of the dough against the side of the bowl.
  - id: dough_fill_ratio
    question: Does the dough occupy a larger portion of the bowl's interior space than before?
    answer_type: yes_no
    notes_for_judge: Assess the ratio of dough to empty space inside the bowl.
  - id: dough_width_expansion
    question: Has the dough expanded horizontally to touch more of the bowl's sides?
    answer_type: yes_no
    notes_for_judge: Check if the dough footprint or width has increased.
  - id: dough_surface_proximity
    question: Is the top surface of the dough closer to the rim or the cloth than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look at the gap between the dough top and the bowl rim/cloth.
  - id: bowl_position_consistency
    question: Is the glass bowl in the same position on the counter?
    answer_type: yes_no
    notes_for_judge: The bowl should not have moved.
  - id: thermometer_presence
    question: Is the thermometer still visible and unchanged in the background?
    answer_type: yes_no
    notes_for_judge: Background objects should be preserved.
