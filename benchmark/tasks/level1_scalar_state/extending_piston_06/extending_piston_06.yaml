id: extending_piston_06
level: 1
category: scalar_state
tags: []
variant_of: extending_piston
variation_type: dynamic_condition
variation_description: Speed of extension changed from slow to rapid.
changes:
  occlusion_method: null
  dynamic_conditions: High pressure system causing rapid extension.
  expected_outcome_change: The rod should extend much further or reach maximum limit faster than original.
prompts:
  init_frame_edit_prompt: Edit the image to show slight motion blur on the silver rod and dust kicking
    up around the joints.
  video_WM: A hydraulic piston is extending rapidly under high pressure. The camera rotates right until
    the piston assembly completely exits the view, then rotates toward the left smoothly at the same rate
    until the piston is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A hydraulic piston is extending rapidly under high pressure. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a green excavator arm featuring a hydraulic cylinder with
    a shiny metal piston rod partially extended. There is dust or steam near the piston joint. In the
    foreground, a black control lever with a rubber boot is visible on a dirty, weathered surface.
  init2final_edit_prompt: Edit the given image to show the hydraulic piston extended further. Make the
    shiny metal rod significantly longer than it is in the original image, pushing the attached joint
    and arm segment further away from the green cylinder barrel. Maintain the original camera angle and
    the position of the foreground control lever.
  rationale: The prompt specifies that the piston is extending rapidly. Although the camera rotates away
    and then back, the physical action of extension continues during the time the object is out of view.
    Therefore, when the camera returns to the initial viewpoint, the hydraulic cylinder must be in a more
    extended state (longer exposed rod) than in the initial frame.
