id: tire_inflate_03
level: 1
category: scalar_state
tags: []
variant_of: tire_inflate
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to zooming out until detail is lost.
changes:
  occlusion_method: Camera zooms out far enough that the tire becomes a speck, then zooms back in.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The air is pumping into the tire at high pressure, and the tire is visibly and rapidly expanding.
    The inflation continues steadily. The camera zooms out rapidly and continuously until the tire becomes
    indistinguishable in the distance. Then, the camera zooms back in smoothly until the tire fills the
    frame again. No cut, no scene change. STOP.
  camera_WM: The air is pumping into the tire at high pressure, and the tire is visibly and rapidly expanding.
    The inflation continues steadily. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A close-up, low-angle shot of a bicycle wheel and tire resting on a concrete
    floor. The tire is visibly under-inflated, with the bottom section flattened against the ground and
    the sidewalls appearing slightly wrinkled or compressed. A black air hose with a brass adapter is
    connected to the tire's valve stem. In the background, there is a red air compressor, a window, and
    a white wall. Several tools, including wrenches and a screwdriver, are scattered on the floor in the
    foreground and background.
  init2final_edit_prompt: Edit the given image to show the bicycle tire fully inflated. The section of
    the tire touching the ground should be round and firm, lifting the metal rim higher off the floor
    compared to the flattened state. The sidewalls should appear taut and smooth, removing any wrinkles
    or compression marks caused by low pressure. Keep the air hose connected, and ensure the background,
    tools, and floor remain unchanged.
  rationale: The video prompt describes a continuous inflation process that persists while the camera
    zooms out and then back in. Although the tire becomes indistinguishable during the zoom-out, the physical
    action of pumping air continues steadily. When the camera zooms back in to fill the frame, the tire
    must be significantly more inflated than it was at the start. Visually, this results in a rounder
    shape, a smaller contact patch with the ground, and the rim sitting higher due to the expanded tire
    volume.
  questions:
  - id: tire_inflated_check
    question: Is the tire visibly more inflated than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the overall fullness of the tire.
  - id: contact_patch_roundness
    question: Is the bottom section of the tire rounder and less flattened against the ground compared
      to the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial frame shows a flat spot at the bottom; the final frame should show a
      rounder profile.
  - id: rim_height
    question: Is the metal rim lifted higher off the ground than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the tire inflates, the radius increases, lifting the axle and rim.
  - id: sidewall_smoothness
    question: Do the sidewalls of the tire appear smoother and more taut than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for the disappearance of wrinkles or compression folds.
  - id: volume_increase
    question: Does the tire appear to contain a greater volume of air than at the start?
    answer_type: yes_no
    notes_for_judge: General assessment of expansion.
  - id: hose_connection
    question: Is the air hose still connected to the tire valve?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: tools_presence
    question: Are the tools on the floor still visible?
    answer_type: yes_no
    notes_for_judge: Consistency check for background objects.
