id: matchstick_burning_05
level: 1
category: scalar_state
tags: []
variant_of: matchstick_burning
variation_type: dynamic_condition
variation_description: Strong wind is present, implying the flame might blow out or burn erratically.
changes:
  occlusion_method: null
  dynamic_conditions: Strong wind blowing the flame.
  expected_outcome_change: Flame blows out or burns unevenly
prompts:
  init_frame_edit_prompt: Edit the image so the flame is blown aggressively to the side, indicating a
    strong wind.
  video_WM: The matchstick flame burns at the tip, whipping violently in a strong gust of wind. Oxygen
    is plentiful. The camera rotates right at constant speed until the matchstick completely exits the
    view to the right. The camera continues rotating right for several seconds while off-screen. Then
    the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The matchstick flame burns at the tip, whipping violently in a strong gust of wind. Oxygen
    is plentiful during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up side view of a hand holding a lit wooden matchstick against a blurred
    grey background. The match head is blackened and actively burning with a bright orange flame and trailing
    white smoke. The wooden shaft below the head is light-colored and pristine.
  init2final_edit_prompt: Edit the given image to show the matchstick in a later stage of burning. Extend
    the blackened, charred texture significantly further down the wooden stick towards the fingers. Position
    the flame lower on the stick, originating from the edge of the new charred section closer to the hand.
    Reduce the length of the visible unburnt light-colored wood.
  rationale: 'The prompt describes a continuous burning process (''whipping violently'', ''oxygen is plentiful'')
    while the camera performs a pan-away and return maneuver. This camera motion introduces a temporal
    gap where the match is occluded but continues to burn. Upon the camera''s return to the original viewpoint,
    the physical state of the match must reflect this elapsed time: the fire should have consumed more
    of the fuel, resulting in a longer charred section and the flame moving closer to the hand.'
