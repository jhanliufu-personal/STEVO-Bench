id: steam_kettle_spout_09
level: 1
category: scalar_state
tags: []
variant_of: steam_kettle_spout
variation_type: combined
variation_description: Kettle on cool surface combined with camera zoom occlusion.
changes:
  occlusion_method: Camera zoom out
  dynamic_conditions: Kettle on cool counter (removed from heat)
  expected_outcome_change: No steam generation.
prompts:
  init_frame_edit_prompt: Edit the image to show the kettle sitting on a cool granite countertop instead
    of a stove burner, with no steam coming from the spout.
  video_WM: The kettle sits on a cool granite countertop, removed from any heat source. The contents are
    cooling down. The camera zooms out rapidly until the kettle becomes a small, indistinguishable dot
    in the wide view of the kitchen. The camera holds this wide shot for several seconds. Then the camera
    zooms back in smoothly to the original framing. No cut, no scene change. STOP.
  camera_WM: The kettle sits on a cool granite countertop, removed from any heat source. The contents
    are cooling down. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
  Genie: null
evaluation:
  init_frame_description: A silver stainless steel gooseneck kettle sits on a speckled granite countertop.
    The kettle has a black handle on the left and a curved spout on the right. A glass lid with a black
    knob sits on top, and the underside of the glass is covered with visible water condensation droplets.
    The background features a window on the right providing natural light and a blurred wooden object
    on the left.
  init2final_edit_prompt: Edit the given image to show the exact same scene with the kettle in the same
    position. Ensure the condensation droplets on the glass lid remain visible. The spout should be free
    of any steam or vapor. The lighting, background, and countertop details should remain identical to
    the original image.
  rationale: The video describes a kettle cooling down over a period of several seconds while the camera
    zooms out and back in. Physically, a cooling kettle removed from a heat source will not generate new
    steam, and the existing condensation on the lid will persist without evaporating instantly. The primary
    evaluation focuses on the preservation of this static 'cooling' state (no boiling, persistent condensation)
    through the camera motion, ensuring the model does not hallucinate heating effects or lose object
    details like the droplets during the zoom.
  questions:
  - id: steam_absence_1
    question: Is the spout free of visible steam plumes?
    answer_type: yes_no
    notes_for_judge: The kettle is cooling, so no active steam should be visible.
  - id: vapor_clearance_1
    question: Is the area directly above the kettle clear of vapor or smoke?
    answer_type: yes_no
    notes_for_judge: Checks for absence of heating indicators.
  - id: condensation_persistence_1
    question: Is the condensation on the glass lid still visible?
    answer_type: yes_no
    notes_for_judge: The droplets should persist as the kettle cools.
  - id: lid_state_1
    question: Is the lid sitting flat and closed on the kettle?
    answer_type: yes_no
    notes_for_judge: The lid should not be lifted by boiling pressure.
  - id: stability_1
    question: Does the kettle appear to be resting stably without vibration or movement?
    answer_type: yes_no
    notes_for_judge: The kettle should be static.
  - id: handle_orientation_1
    question: Is the black handle still oriented to the left?
    answer_type: yes_no
    notes_for_judge: Consistency check after camera move.
  - id: spout_orientation_1
    question: Is the curved spout still oriented to the right?
    answer_type: yes_no
    notes_for_judge: Consistency check after camera move.
