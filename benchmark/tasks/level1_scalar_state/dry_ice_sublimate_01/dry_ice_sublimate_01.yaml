  init_frame_description: A beige ceramic bowl sitting on a wooden table, filled with water and a large,
    roughly cubic block of translucent white dry ice. Thick white fog is emanating from the bowl and spilling
    over the edges onto the table.
  init2final_edit_prompt: Edit the given image to show the block of dry ice significantly reduced in size,
    appearing partially sublimated and smaller than before. Keep the beige bowl, water, and wooden table
    unchanged. Ensure the white fog is present but translucent and light, allowing a clear view of the
    smaller ice block and the inside of the bowl.
  rationale: The video prompt describes a physical process of sublimation where the dry ice shrinks over
    time. A temporary occlusion by thick fog occurs, but the prompt specifies that the view clears again
    by the end. Therefore, the final frame must show the scene with visibility restored, but with the
    dry ice block having a noticeably smaller volume due to the elapsed time and sublimation process.
