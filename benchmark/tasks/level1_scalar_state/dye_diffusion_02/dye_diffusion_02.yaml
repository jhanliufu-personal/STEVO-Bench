id: dye_diffusion_02
level: 1
category: scalar_state
tags: []
variant_of: dye_diffusion
variation_type: occlusion_method
variation_description: Occlusion changed from camera panning to a large opaque object blocking the view.
changes:
  occlusion_method: A large opaque cutting board slides in front of the camera, blocking the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous shot, no cuts, no zoom. The blue liquid in the dropper is a water-soluble
    dye. When released into the bowl, it naturally diffuses and disperses throughout the water over time.
    The dye does not change color, evaporate, or chemically react; it simply spreads through the water
    due to natural diffusion and fluid motion. No stirring or additional drops occur after the initial
    release. Camera starts centered on the bowl and hand. A large opaque wooden cutting board slides into
    the frame from the left, completely blocking the view of the bowl and hand. The board remains in front
    of the camera for several seconds. While obscured, the dye continues to diffuse naturally. Then the
    cutting board slides back out to the left, revealing the bowl again. The camera remains stationary
    throughout.
  camera_WM: Single continuous shot, no cuts, no zoom. The blue liquid in the dropper is a water-soluble
    dye. When released into the bowl, it naturally diffuses and disperses throughout the water over time.
    The dye does not change color, evaporate, or chemically react; it simply spreads through the water
    due to natural diffusion and fluid motion. No stirring or additional drops occur after the initial
    release. Camera starts centered on the bowl and hand. A large opaque wooden cutting board slides into
    the frame from the left, completely blocking the view of the bowl and hand. The board remains in front
    of the camera for several seconds. While obscured, the dye continues to diffuse naturally. Then the
    cutting board slides back out to the left, revealing the bowl again. The camera remains stationary
    throughout. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a clear glass bowl filled with water on a white
    surface. A hand is visible holding a dropper with a black cap, dispensing blue dye into the water.
    Inside the bowl, the blue dye is currently forming a concentrated, dark blue swirl or cloud near the
    center, with distinct edges and deep color saturation. The background is slightly blurred, showing
    a window and some greenery.
  init2final_edit_prompt: Edit the given image to show the blue dye significantly diffused and spread
    out within the water. The concentrated dark blue swirls should be expanded into a larger, softer,
    and more transparent blue cloud that occupies a greater volume of the bowl. The edges of the dye should
    appear fuzzy and indistinct, tinting more of the surrounding water light blue. Keep the hand, dropper,
    bowl, and background elements unchanged.
  rationale: The primary physical process is diffusion. Over the duration of the video (including the
    occluded period), the concentrated dye naturally spreads from areas of high concentration to low concentration.
    This results in the blue color expanding to fill more of the bowl's volume while becoming less saturated
    and more transparent (diffuse) at the edges. The occlusion by the cutting board is temporary, so the
    final frame must show the unoccluded bowl with the advanced state of dye dispersion.
  questions:
  - id: dye_spread_area
    question: Is the blue dye spread across a larger area of the bowl than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the spatial extent of the blue color. It should be wider/larger in the final
      frame.
  - id: dye_diffuseness
    question: Does the blue dye appear more diffuse and less concentrated than the initial dark swirls?
    answer_type: yes_no
    notes_for_judge: Look for softer edges and greater transparency in the blue cloud compared to the
      sharp, dark drops in the init frame.
  - id: water_tint_volume
    question: Is a larger volume of the water tinted blue compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The blue region should occupy more of the bowl's total volume.
  - id: dye_boundary_softness
    question: Are the edges of the blue dye cloud softer and fuzzier than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Diffusion causes boundaries to become less distinct.
  - id: clear_water_reduction
    question: Is there less completely clear, untinted water visible than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the dye spreads, the amount of pure clear water decreases.
  - id: occlusion_removed
    question: Is the wooden cutting board absent from the view, revealing the bowl?
    answer_type: yes_no
    notes_for_judge: The board should have slid out, leaving the view clear.
  - id: bowl_visibility
    question: Is the glass bowl visible again after being covered?
    answer_type: yes_no
    notes_for_judge: Verifies the occlusion has ended.
  - id: background_consistency
    question: Are the background window and plants consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
