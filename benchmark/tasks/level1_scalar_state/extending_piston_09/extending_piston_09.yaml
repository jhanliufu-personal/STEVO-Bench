id: extending_piston_09
level: 1
category: scalar_state
tags: []
variant_of: extending_piston
variation_type: combined
variation_description: Rapid extension + Occlusion by heavy exhaust smoke.
changes:
  occlusion_method: Thick black exhaust smoke covers the view.
  dynamic_conditions: Rapid extension.
  expected_outcome_change: Rod extends significantly.
prompts:
  init_frame_edit_prompt: Edit the image to show slight motion blur on the silver rod.
  video_WM: A hydraulic piston is extending rapidly. Thick black exhaust smoke billows across the view,
    completely hiding the arm, then clears away to reveal the scene. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A hydraulic piston is extending rapidly. Thick black exhaust smoke billows across the view,
    completely hiding the arm, then clears away to reveal the scene. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a green excavator's hydraulic arm mechanism. A large hydraulic
    cylinder is prominent diagonally across the frame, with a green painted barrel and a shiny chrome
    rod extending towards the top right. The rod is connected to a joint on the boom. In the foreground,
    there is a control lever mechanism with a black handle and a rubber boot labeled 'EXTEND'. The machinery
    is weathered, with grease stains and rust spots visible on the green paint.
  init2final_edit_prompt: Edit the given image to show the hydraulic piston in a more extended state.
    Significantly increase the visible length of the shiny chrome rod protruding from the green cylinder
    barrel. Move the upper connection joint further towards the top right along the axis of the cylinder
    to accommodate the longer rod. Adjust the attached green arm structure to align with this new extended
    position. Ensure the scene is clear of any smoke or obstruction.
  rationale: The video prompt describes a hydraulic piston extending rapidly while obscured by smoke,
    which then clears. The primary scalar state change is the increase in the length of the exposed piston
    rod (extension). The final frame represents the state after the smoke has dissipated, revealing the
    completed action. Therefore, the final image must show the piston rod significantly longer than in
    the initial frame, with the arm geometry adjusted to match this extension, and no smoke present.
  questions:
  - id: rod_length_increase
    question: Is the shiny metal rod of the hydraulic cylinder longer than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the length of the chrome section of the piston.
  - id: piston_extension
    question: Has the hydraulic piston extended further compared to the start?
    answer_type: yes_no
    notes_for_judge: Check if the mechanism has pushed out along its axis.
  - id: joint_distance
    question: Is the connection joint at the end of the chrome rod further away from the green cylinder
      body?
    answer_type: yes_no
    notes_for_judge: The distance between the cylinder barrel and the end attachment point should increase.
  - id: arm_geometry
    question: Does the hydraulic assembly appear longer overall due to the extension?
    answer_type: yes_no
    notes_for_judge: The total length from the base of the cylinder to the tip of the rod should be greater.
  - id: smoke_cleared
    question: Is the view clear of the thick black smoke described in the action?
    answer_type: yes_no
    notes_for_judge: The prompt states the smoke clears to reveal the scene.
  - id: lever_consistency
    question: Is the black control lever still visible in the foreground?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: color_consistency
    question: Is the machinery still primarily green?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
