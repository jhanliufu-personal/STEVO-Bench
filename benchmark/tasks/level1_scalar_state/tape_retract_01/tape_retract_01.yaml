id: tape_retract_01
level: 1
category: scalar_state
tags: []
variant_of: tape_retract
variation_type: occlusion_method
variation_description: Replaces camera rotation with lights turning off completely.
changes:
  occlusion_method: Lights turn off (pitch black) then back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A metal tape measure is extended 5 feet. The retraction button is held down, and the tape
    is visibly zipping back into the housing. Suddenly, the overhead lights turn off, plunging the scene
    into complete pitch-black darkness. The darkness lasts for a duration equal to the previous rotation.
    The lights turn back on instantly to reveal the scene. No zoom, no cut, no scene change. STOP.
  camera_WM: A metal tape measure is extended 5 feet. The retraction button is held down, and the tape
    is visibly zipping back into the housing. Suddenly, the overhead lights turn off, plunging the scene
    into complete pitch-black darkness. The darkness lasts for a duration equal to the previous rotation.
    The lights turn back on instantly to reveal the scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a yellow and black tape measure resting on a
    wooden floor. A hand holds the body of the tape measure on the right side of the frame. The metal
    tape extends outwards to the left, with measurement markings visible, specifically the large number
    '5' indicating the 5-foot mark near the housing, and the number '4' visible further to the left. The
    background consists of the wooden floorboards and a window sill at the top left.
  init2final_edit_prompt: Edit the given image to show the tape measure fully retracted. Remove the long
    extended yellow metal tape strip from the wooden floor. Render the small metal hook tab resting directly
    against the yellow housing held by the hand. Ensure the wooden floor texture is visible and continuous
    where the tape strip used to be.
  rationale: The video prompt describes the retraction button being held and the tape 'zipping back',
    which is a fast mechanical action for a spring-loaded tape measure. The subsequent period of darkness
    allows ample time for the retraction to complete. Therefore, when the lights turn back on, the tape
    should be fully retracted into its housing, with only the hook visible against the case, and the previously
    covered floor exposed.
