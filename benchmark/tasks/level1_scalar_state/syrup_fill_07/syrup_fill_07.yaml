    The glass jar should remain visible on the counter containing the exact same amount of amber syrup
    (approximately 25% full). Ensure no hands, towels, or other objects are blocking the view of the jar.
    The wooden cutting board and ceramic jug should remain in their original positions.
  rationale: 'The video prompt describes a temporary occlusion event where a hand with a towel wipes the
    counter and then moves away. Crucially, the prompt explicitly states ''No stream is pouring'' and
