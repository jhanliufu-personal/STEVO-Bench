id: dry_ice_sublimate_03
level: 1
category: scalar_state
tags: []
variant_of: dry_ice_sublimate
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large opaque card blocking the view.
changes:
  occlusion_method: A large opaque card slides in to block the view, then slides away.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The dry ice is sublimating rapidly in the warm water, and the size of the solid block is visibly
    shrinking. A large opaque black card slides into the frame from the right, completely blocking the
    view of the bowl. The card stays in place for a moment, then slides back out to the right. No cut,
    no scene change. STOP.
  camera_WM: The dry ice is sublimating rapidly in the warm water, and the size of the solid block is
    visibly shrinking. A large opaque black card slides into the frame from the right, completely blocking
    the view of the bowl. The card stays in place for a moment, then slides back out to the right. No
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a beige ceramic bowl sitting on a wooden table. Inside the
    bowl is clear water and a large, rough, rectangular block of dry ice. Thick white fog and mist are
    emanating vigorously from the bowl, spilling over the rim and spreading onto the wooden surface.
  init2final_edit_prompt: Edit the given image to make the central block of dry ice significantly smaller
    in size, appearing eroded and diminished in volume. Maintain the presence of the white mist and fog
    around the bowl. Keep the beige bowl and the wooden table background exactly as they are.
  rationale: The video prompt describes a continuous physical process of sublimation accelerated by warm
    water. Even though the view is temporarily occluded by a black card, the sublimation process continues
    during this unobserved period. Therefore, when the card is removed, the dry ice block must be visibly
    smaller (reduced mass/volume) than it was in the initial frame. The fog should persist as long as
    sublimation is occurring.
