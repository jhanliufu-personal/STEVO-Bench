id: alka_seltzer_fizz_02
level: 1
category: scalar_state
tags: []
variant_of: alka_seltzer_fizz
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off.
changes:
  occlusion_method: Scene lighting turns off completely (pitch black).
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The effervescent tablet contacts the water at the bottom of the glass. The tablet contains
    citric acid and sodium bicarbonate which react in water to produce carbon dioxide gas. The reaction
    is exothermic and vigorous. Suddenly, all lights in the room turn off, plunging the scene into total
    pitch blackness where nothing is visible. The darkness lasts for several seconds. Then the lights
    turn back on, illuminating the scene exactly as before. No zoom, no cut, no scene change. STOP.
  camera_WM: The effervescent tablet contacts the water at the bottom of the glass. The tablet contains
    citric acid and sodium bicarbonate which react in water to produce carbon dioxide gas. The reaction
    is exothermic and vigorous. Suddenly, all lights in the room turn off, plunging the scene into total
    pitch blackness where nothing is visible. The darkness lasts for several seconds. Then the lights
    turn back on, illuminating the scene exactly as before. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A clear glass filled with water sits on a white table in a bright kitchen setting.
    A white, round effervescent tablet is suspended in mid-air directly above the center of the glass
    rim. The background is a blurred kitchen interior with warm lighting.
  init2final_edit_prompt: Edit the given image to show the white tablet submerged inside the water at
    the bottom of the glass. Remove the tablet from the air above the glass. Fill the water with numerous
    small white bubbles and fizz rising from the submerged tablet. The water should appear cloudy and
    effervescent due to the active chemical reaction.
  rationale: The video prompt describes the tablet falling into the water and reacting. During the period
    of darkness (occlusion), the physical process of the tablet falling and the chemical reaction (effervescence)
    continues. When the lights turn back on, the tablet must be inside the glass (having fallen due to
    gravity) and actively dissolving, producing visible bubbles (carbon dioxide) in the water. The scene
    must be fully illuminated again, matching the initial lighting conditions.
  questions:
  - id: tablet_submerged
    question: Is the white tablet now located inside the water within the glass?
    answer_type: yes_no
    notes_for_judge: The tablet should no longer be in the air; it should be submerged.
  - id: tablet_removed_from_air
    question: Is the space directly above the glass rim free of the floating tablet?
    answer_type: yes_no
    notes_for_judge: Check that the tablet has been removed from its initial position in the air.
  - id: bubbles_presence
    question: Are there visible bubbles or fizz in the water that were not present initially?
    answer_type: yes_no
    notes_for_judge: Look for effervescence, foam, or cloudiness indicating a reaction.
  - id: water_clarity_change
    question: Does the water appear cloudier or more agitated than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The reaction creates turbulence and opacity.
  - id: lighting_restored
    question: Is the scene clearly illuminated, rather than being pitch black?
    answer_type: yes_no
    notes_for_judge: The prompt states the lights turn back on.
  - id: glass_consistency
    question: Is the glass still standing in the same position on the table?
    answer_type: yes_no
    notes_for_judge: The glass should not have moved, only its contents changed.
