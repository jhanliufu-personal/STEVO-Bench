id: lava_cool_08
level: 1
category: scalar_state
tags: []
variant_of: lava_cool
variation_type: combined
variation_description: Cold inert rock combined with smoke occlusion.
changes:
  occlusion_method: Thick smoke blocks view.
  dynamic_conditions: Rock is cold/black.
  expected_outcome_change: Rock remains black.
prompts:
  init_frame_edit_prompt: Edit the image to show the volcanic rock as completely black, solidified, and
    dull, sitting on a cold metal tray with no glow.
  video_WM: A cold, black volcanic rock sits on a metal tray. Thick grey smoke rolls in from the side,
    completely obscuring the rock and tray from view, then clears away slowly until the rock is visible
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: A cold, black volcanic rock sits on a metal tray. Thick grey smoke rolls in from the side,
    completely obscuring the rock and tray from view, then clears away slowly until the rock is visible
    again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, dark, textured chunk of black volcanic rock or coal sits centrally
    on a dirty, rusted metal baking sheet. The rock has a rough, porous surface and is completely black
    with no glowing areas. The background is a dark, blurry industrial setting.
  init2final_edit_prompt: Edit the given image to show the black volcanic rock fully visible on the metal
    tray. Remove any thick grey smoke to restore the clear view of the rock and tray. The rock must remain
    black and cold, with no glowing red or orange sections. Keep the camera angle, framing, and background
    identical to the original image.
  rationale: The video prompt describes a temporary occlusion event where smoke covers a cold rock and
    then dissipates. Since the rock is explicitly described as 'cold' and 'black' initially, and no heating
    action is mentioned, it must remain cold and black throughout the sequence. The rollout concludes
    with the smoke clearing, restoring the visibility of the original rock. Therefore, the final frame
    should be visually nearly identical to the initial frame, confirming the rock's permanence and the
    removal of the smoke.
