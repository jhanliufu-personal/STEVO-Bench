id: evaporating_alcohol_pool
level: 1
category: scalar_state
tags: []
prompts:
  image_gen_prompt: A small puddle of clear rubbing alcohol sits on a warm metal plate surface. The metal plate has a temperature indicator showing it is warm but not extremely hot. The alcohol puddle is roughly circular with clearly defined edges.
  video_WM: The alcohol puddle sits on the warm metal surface. Heat from the plate causes rapid evaporation of the volatile liquid. The puddle boundary visibly recedes inward as the alcohol evaporates into the air. The area covered by the liquid decreases steadily, with the edges of the puddle moving toward the center. The puddle becomes noticeably smaller. The camera rotates right at constant speed until the metal plate completely exits the view to the right. The camera continues rotating right for several seconds while the alcohol continues evaporating off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the metal plate back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The alcohol puddle sits on the warm metal surface. Heat from the plate causes rapid evaporation of the volatile liquid. The puddle boundary visibly recedes inward as the alcohol evaporates into the air. The area covered by the liquid decreases steadily, with the edges of the puddle moving toward the center. The puddle becomes noticeably smaller during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
