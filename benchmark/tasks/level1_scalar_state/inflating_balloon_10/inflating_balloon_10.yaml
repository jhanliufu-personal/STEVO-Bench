id: inflating_balloon_10
level: 1
category: scalar_state
tags: []
variant_of: inflating_balloon
variation_type: combined
variation_description: High pressure inflation while camera physically moves away.
changes:
  occlusion_method: Camera moves backward physically.
  dynamic_conditions: Valve wide open (rapid inflation).
  expected_outcome_change: Balloon grows much larger/faster.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A white balloon is connected to a helium tank with the valve wide open, allowing gas to rush
    in rapidly. The camera physically moves backward away from the scene until the balloon is barely visible,
    then moves forward returning to the original position. No cut, no scene change. STOP.
  camera_WM: A white balloon is connected to a helium tank with the valve wide open, allowing gas to rush
    in rapidly. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a green gas cylinder labeled 'HELIUM' sitting
    in a grassy field. A deflated, cream-colored or white balloon is attached to the brass nozzle of the
    tank. A gloved hand is visible at the top of the tank, gripping the valve handle. The background shows
    a blurred grassy landscape with hills in the distance under a bright sky.
  init2final_edit_prompt: Edit the given image to show the white balloon significantly inflated. The balloon
    should appear much larger, rounder, and taut, expanded with gas, rather than lying flat and deflated
    on the grass. The balloon should extend outwards or upwards from the nozzle due to the pressure and
    buoyancy of the helium. Keep the green helium tank, the gloved hand, and the grassy background identical
    to the original image.
  rationale: The prompt describes a continuous action where the valve is opened and gas rushes into the
    balloon. While the camera moves away and then returns to the original position, time passes, allowing
    the balloon to fill with helium. Since the camera returns to the start point, the final view is identical
    to the initial view, but the state of the balloon has changed from deflated to inflated. The balloon
    should be larger and rounder due to the gas accumulation.
