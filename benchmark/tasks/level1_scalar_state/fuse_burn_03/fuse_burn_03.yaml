id: fuse_burn_03
level: 1
category: scalar_state
tags: []
variant_of: fuse_burn
variation_type: occlusion_method
variation_description: Occlusion by zooming out until details are lost
changes:
  occlusion_method: Camera zooms out to a high aerial view where the fuse is indistinguishable, then zooms
    back in
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fuse is burning rapidly, and the length of the black cord is visibly shortening as the
    spark moves along it. The burning continues at a fast, constant rate. The camera rapidly zooms out,
    pulling back until the floor becomes a distant texture and the fuse is too small to see. The camera
    then zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: The fuse is burning rapidly, and the length of the black cord is visibly shortening as the
    spark moves along it. The burning continues at a fast, constant rate. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up, high-angle shot of a thick, textured rope fuse lying on a concrete
    floor. The fuse begins at the bottom left and curves towards the right background. The tip of the
    fuse on the bottom left is ignited, displaying a bright orange flame and sparks with smoke rising.
    The unburnt portion of the rope has a braided, brownish-grey appearance.
  init2final_edit_prompt: Edit the given image to show the fuse having burned further along its length.
    Move the bright orange spark and flame further to the right along the path of the rope. Render the
    section of the rope to the left of the new spark position as black, charred ash. Ensure the remaining
    unburnt section of the rope ahead of the spark is shorter than in the original image. Maintain the
    concrete floor background and the original path of the rope.
  rationale: The video prompt describes a continuous burning process occurring while the camera zooms
    out and back in. Since the camera returns to the original framing without a scene cut, the final frame
    must show the same scene at a later point in time. The fuse burns at a constant rate, so the spark
    must have traveled along the rope, consuming a portion of it and leaving charred residue behind, thereby
    reducing the length of the unburnt fuse.
