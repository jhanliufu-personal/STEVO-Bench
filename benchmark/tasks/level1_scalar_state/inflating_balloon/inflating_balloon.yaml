id: balloon_inflate
level: 1
category: scalar_state
scalar_variable: Balloon size
prompts:
  image_gen_prompt: A limp white latex weather balloon attached to a green helium tank nozzle on a grassy
    field. The tank valve is visibly turned to the 'Open' position.
