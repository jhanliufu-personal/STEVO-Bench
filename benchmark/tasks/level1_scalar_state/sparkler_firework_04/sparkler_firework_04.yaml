evaluation:
  init_frame_description: A close-up shot against a black background showing a human hand holding an unlit
    sparkler. The sparkler consists of a straight wire coated with a thick, grey, granular metallic substance.
    The handle is a thin bare wire. The lighting highlights the rough texture of the combustible coating.
  init2final_edit_prompt: Edit the given image to show the sparkler remaining completely unlit and intact.
    The grey granular coating should cover the same length of the wire as in the original image. Do not
    add any sparks, flames, smoke, or signs of burning. The hand should still be holding the sparkler
    in the same position against the black background.
  rationale: The prompt explicitly states the sparkler is unlit, cold, and not ignited, although oxygen
    is available. No ignition source (like a lighter or match) or ignition action is described in the
    prompt. The camera rotates away and then returns to the original view. According to physical causality,
    without an ignition event, the sparkler must remain unlit and unconsumed during the elapsed time.
    Therefore, the final frame should show the sparkler in its original state, testing the model's ability
    to avoid hallucinating spontaneous combustion.
