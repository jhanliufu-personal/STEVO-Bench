id: deflating_air_mattress_10
level: 1
category: scalar_state
tags: []
variant_of: deflating_air_mattress
variation_type: combined
variation_description: Tiny pinhole leak (very slow deflation) with fog occlusion.
changes:
  occlusion_method: Thick fog fills the room.
  dynamic_conditions: Valve closed but tiny pinhole leak exists.
  expected_outcome_change: Very slow deflation (minimal change).
prompts:
  init_frame_edit_prompt: Edit the image to show the valve closed, but add a small patch with a visible
    pinhole leak on the side of the mattress.
  video_WM: The air mattress valve is closed, but a tiny pinhole leak on the side is hissing quietly.
    Thick white fog rolls into the room, completely obscuring the mattress from view. The fog slowly clears
    to reveal the room again. No zoom, no cut, no scene change. STOP.
  camera_WM: The air mattress valve is closed, but a tiny pinhole leak on the side is hissing quietly.
    Thick white fog rolls into the room, completely obscuring the mattress from view. The fog slowly clears
    to reveal the room again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a blue, flocked-top air mattress on
    a wooden floor. The mattress is fully inflated, appearing taut and smooth with defined ridges on the
    top surface. A black valve cap is visible on the side panel near the bottom left, along with a small
    circular patch or detail nearby. The lighting creates highlights on the inflated curves.
  init2final_edit_prompt: Edit the given image to make the blue air mattress look partially deflated.
    The surface of the mattress should appear sagging, loose, and wrinkled, losing its initial tautness.
    The overall height of the mattress should be lower, and the sides should appear less rigid and slightly
    collapsed due to the loss of air pressure. Keep the wooden floor and background unchanged.
  rationale: The prompt establishes a leak in the mattress and introduces a period of occlusion (fog)
    that implies the passage of time. During this interval, the continuous leak causes the air mattress
    to lose air volume. Therefore, in the final frame, the mattress must exhibit physical signs of deflation
    such as reduced height, a sagging surface, and increased wrinkling compared to the fully inflated
    initial state.
