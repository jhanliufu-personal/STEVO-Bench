evaluation:
  init_frame_description: A large, irregular chunk of black volcanic rock sits in the center of a weathered
    metal baking sheet. The rock has a rough, porous texture with many small holes, typical of scoria
    or basalt. The metal tray is stained with rust and dark burnt residues. The background is a dimly
    lit, cluttered industrial workshop with blurred metal structures and shelves.
  init2final_edit_prompt: Edit the given image to show the exact same scene as the original. The black
    volcanic rock should sit on the metal tray in the center, appearing completely black, solid, and cold.
    Ensure there is absolutely no red glow, orange heat, fire, or smoke emanating from the rock. The texture
    of the rock and the details of the dirty metal tray should remain identical to the start.
  rationale: The video prompt describes a camera movement that pans the view away from the rock and then
    returns to the original position. Crucially, the prompt specifies that the rock is cold, at room temperature,
    and there is no heat source. Therefore, despite the 'volcanic' nature of the object, no physical state
    change (such as heating, glowing, or melting) should occur. The rock must remain black and inert throughout
    the occlusion. The final frame should be visually identical to the initial frame, testing the model's
    ability to maintain object permanence and state stability without hallucinating heat or fire.
