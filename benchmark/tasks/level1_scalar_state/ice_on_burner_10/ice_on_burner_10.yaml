id: ice_on_burner_10
level: 1
category: scalar_state
tags: []
variant_of: ice_on_burner
variation_type: combined
variation_description: Chocolate (melting) with fog/smoke occlusion.
changes:
  occlusion_method: Thick smoke/fog fills the view.
  dynamic_conditions: Object is a piece of dark chocolate.
  expected_outcome_change: Chocolate melts into dark brown liquid.
prompts:
  init_frame_edit_prompt: Edit the image to replace the ice cube with a square piece of dark chocolate.
  video_WM: A square of dark chocolate sits on top of an electric cooktop burner. The cooktop display
    shows it is turned on. Thick white smoke begins to fill the frame, quickly becoming so dense that
    the burner and chocolate are completely obscured. The smoke swirls for several seconds, blocking all
    visibility. The smoke then clears rapidly, restoring the clear view of the burner.
  camera_WM: A square of dark chocolate sits on top of an electric cooktop burner. The cooktop display
    shows it is turned on. Thick white smoke begins to fill the frame, quickly becoming so dense that
    the burner and chocolate are completely obscured. The smoke swirls for several seconds, blocking all
    visibility. The smoke then clears rapidly, restoring the clear view of the burner.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a black glass electric cooktop. A glowing red
    spiral heating element is active in the center. A square piece of dark chocolate sits directly on
    the heating element. To the right, a digital display shows the text 'ON' and 'HIGH' in red LEDs. Wisps
    of steam or smoke are already rising from the chocolate.
  init2final_edit_prompt: Edit the given image to show the chocolate square melted into a spreading, bubbling
    dark puddle. The chocolate should appear flattened and liquefied, having lost its sharp square edges
    and distinct cubic shape. Remove any smoke or steam to ensure a clear, sharp view of the melted chocolate
    and the glowing red heating element. Keep the 'ON HIGH' display and the surrounding cooktop surface
    unchanged.
  rationale: The burner is set to 'HIGH', subjecting the chocolate to intense heat. During the period
    where the view is occluded by smoke, the chocolate undergoes a phase change from solid to liquid.
    It melts, loses its rigid square structure, and spreads out across the burner surface, likely bubbling
    due to the high temperature. The final frame reveals this melted state after the smoke has cleared,
    showing the aftermath of the heating process.
  questions:
  - id: chocolate_melted
    question: Does the chocolate appear melted or liquefied compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The chocolate should look like a puddle or amorphous mass, not a solid square.
  - id: shape_deformation
    question: Has the chocolate lost its distinct square shape and sharp edges?
    answer_type: yes_no
    notes_for_judge: The initial square shape should be deformed or gone.
  - id: surface_area_spread
    question: Is the chocolate spread out over a larger area of the burner than initially?
    answer_type: yes_no
    notes_for_judge: Melting causes spreading.
  - id: height_reduction
    question: Is the height of the chocolate mass lower or flatter than the initial square?
    answer_type: yes_no
    notes_for_judge: The puddle should be flatter than the block.
  - id: bubbling_texture
    question: Does the surface of the chocolate show signs of bubbling or boiling?
    answer_type: yes_no
    notes_for_judge: High heat usually causes bubbling in melted chocolate.
  - id: smoke_cleared
    question: Is the view of the burner clear of the thick smoke described in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the smoke clears rapidly.
  - id: burner_state_consistency
    question: Is the heating element still glowing red?
    answer_type: yes_no
    notes_for_judge: The burner remains on.
  - id: display_consistency
    question: Is the 'ON HIGH' text still visible on the display?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
