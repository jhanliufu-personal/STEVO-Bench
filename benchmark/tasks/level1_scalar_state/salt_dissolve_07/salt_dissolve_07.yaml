id: salt_dissolve_07
level: 1
category: scalar_state
tags: []
variant_of: salt_dissolve
variation_type: combined
variation_description: Insoluble granite block (Condition) + Fog occlusion (Method).
changes:
  occlusion_method: Thick fog fills the room, obscuring the view.
  dynamic_conditions: Block is insoluble granite.
  expected_outcome_change: No dissolution.
prompts:
  init_frame_edit_prompt: Edit the image to change the white salt lick into a grey, textured granite stone
    block of the same size. Keep the turbulent water.
  video_WM: A solid granite stone block is submerged in a turbulent water tank. Thick white fog rapidly
    fills the room, completely obscuring the tank from view. After a duration, the fog dissipates, revealing
    the tank again. No zoom, no cut, no scene change. STOP.
  camera_WM: A solid granite stone block is submerged in a turbulent water tank. Thick white fog rapidly
    fills the room, completely obscuring the tank from view. After a duration, the fog dissipates, revealing
    the tank again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A rectangular block with a speckled grey and black texture, resembling granite,
    sits at the bottom of a clear glass tank filled with water. The water is agitated, with significant
    turbulence and bubbles rising around the block, particularly from the base. To the right, black pipes
    and a heating element are submerged vertically. The background shows a window with a blurred urban
    view.
  init2final_edit_prompt: Edit the given image to show the scene after a period of time. The granite block
    must remain exactly the same size, shape, and texture, showing no signs of dissolution or erosion.
    The water should remain turbulent with bubbles distributed dynamically around the block. The view
    should be clear, with no fog obscuring the tank, and the water level should remain constant.
  rationale: The prompt explicitly identifies the submerged object as a 'solid granite stone block'. Granite
    is an insoluble igneous rock that does not dissolve in water and is highly resistant to erosion over
    short timescales, even with turbulence. Therefore, despite the task ID suggesting dissolution, the
    correct physical simulation is for the block to remain unchanged in mass, volume, and shape. The fog
    mentioned in the prompt acts as a temporary occlusion but dissipates by the final frame, returning
    the scene to a clear view of the undissolved block.
  questions:
  - id: block_size_preservation
    question: Is the granite block approximately the same size as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The block is granite and should not dissolve.
  - id: block_shape_integrity
    question: Does the block retain its original rectangular shape with sharp edges?
    answer_type: yes_no
    notes_for_judge: Granite should not erode or round off significantly.
  - id: block_texture_visibility
    question: Is the speckled grey and black texture of the block still clearly visible?
    answer_type: yes_no
    notes_for_judge: The surface should not be smoothed or obscured by dissolution byproducts.
  - id: block_volume_conservation
    question: Does the block appear to have maintained its full volume?
    answer_type: yes_no
    notes_for_judge: Check for shrinkage.
  - id: no_dissolution_signs
    question: Is the block free from any visible signs of dissolving or crumbling?
    answer_type: yes_no
    notes_for_judge: The block should look solid.
  - id: water_turbulence_presence
    question: Is the water still turbulent with visible bubbles?
    answer_type: yes_no
    notes_for_judge: Secondary check for environment consistency.
  - id: pipes_visibility
    question: Are the black pipes on the right side still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
