id: wire_spool_01
level: 1
category: scalar_state
scalar_variable: Spool radius
prompts:
  image_gen_prompt: A motorized metal spindle winding bright yellow electrical wire onto a black core.
    The wire layer is currently thin, and the spindle is spinning rapidly.
  video_WM: A motorized spindle winds yellow wire. The spool diameter is visibly growing. The camera rotates
    right until the spindle completely exits the view, then rotates toward the left smoothly at the same
    rate until the spool is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A motorized spindle winds yellow wire onto a core. The diameter of the wire layers is visibly
    increasing as it spins. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up industrial scene showing a metal lathe or winding machine. On the
    left is a grey, weathered motor housing or headstock. In the center, a rotating spindle holds a cylindrical
    object wrapped in a coil of bright yellow wire or filament. To the right of the yellow coil is a black
    cylindrical section of the spindle. Sparks are flying from the point where the wire is being manipulated.
    Below the spindle, the machine bed is covered in metal shavings and debris. The background is blurred,
    showing workshop elements.
  init2final_edit_prompt: Edit the image to show the coil of yellow wire on the spindle with a significantly
    larger diameter. The layer of yellow wire should appear thicker and more voluminous, extending further
    outward from the central axis, while the surrounding machine parts, metal shavings, and background
    remain unchanged.
  rationale: 'The video prompt describes a continuous winding action where the spool diameter visibly
    grows. The camera pans away (occlusion) and then returns to the original framing. During the time
    the camera is looking away, the machine continues to wind the wire. Therefore, when the view returns
    to the initial angle, the physical state of the spool must have changed: the yellow wire coil must
    be thicker (larger diameter) due to the accumulation of material over time.'
  questions:
  - id: q1_diameter_growth
    question: Is the diameter of the yellow wire coil larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical thickness of the yellow section relative to the black spindle
      parts.
  - id: q2_wire_volume
    question: Does the yellow coil appear to contain more wire layers than the initial frame?
    answer_type: yes_no
    notes_for_judge: The yellow section should look bulkier or thicker.
  - id: q3_coil_thickness
    question: Is the yellow section thicker relative to the black cylinder on its right compared to the
      start?
    answer_type: yes_no
    notes_for_judge: 'Relational check: the ratio of yellow diameter to black diameter should increase.'
  - id: q4_machine_presence
    question: Is the grey machine headstock on the left still visible?
    answer_type: yes_no
    notes_for_judge: Consistency check for the camera returning to the original view.
  - id: q5_shavings_consistency
    question: Are the metal shavings on the machine bed still present?
    answer_type: yes_no
    notes_for_judge: Consistency check for the environment.
  - id: q6_spindle_centering
    question: Is the yellow spool positioned centrally in the frame, similar to the initial view?
    answer_type: yes_no
    notes_for_judge: Verifies the camera returned to the starting angle.
  - id: q7_visual_growth
    question: Has the overall size of the yellow wound section increased?
    answer_type: yes_no
    notes_for_judge: Primary state change check.
