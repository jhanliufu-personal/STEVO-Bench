prompts:
  init_frame_edit_prompt: Edit the image to place a thick wooden coaster underneath the blue crayon, separating
    the crayon from the black hot plate surface.
  video_WM: The crayon sits on a thick wooden coaster, which rests on the hot plate surface. The plate
    is actively heating. Wood is a poor thermal conductor, insulating the crayon from the direct heat
    of the plate. The camera rotates right at constant speed until the hot plate completely exits the
    view to the right. The camera continues rotating right for several seconds while off-screen. Then
    the camera rotates left smoothly at the same rate back to the original viewpoint. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The crayon sits on a thick wooden coaster, which rests on the hot plate surface. The plate
    is actively heating. Wood is a poor thermal conductor, insulating the crayon from the direct heat
    of the plate. STOP.
