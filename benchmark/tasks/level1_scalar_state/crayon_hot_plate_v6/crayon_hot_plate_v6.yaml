  Genie: null
evaluation:
  init_frame_description: A close-up shot of a black electric hot plate with a red indicator light glowing,
    labeled 'HEATING'. A thick, circular wooden coaster (a slice of a log) rests on the burner. A blue
    crayon stands vertically in the center of the wooden coaster. The background is a dark kitchen environment.
  init2final_edit_prompt: Edit the given image to show the scene after a short duration. The blue crayon
    must remain standing upright and solid on the wooden coaster, retaining its original height and shape
    without melting. The red indicator light on the hot plate should remain glowing. Ensure the wooden
    coaster and the hot plate surface appear unchanged. The crayon should not look melted or deformed.
  rationale: The prompt describes a camera rotation that leaves the scene and returns to the original
    viewpoint, meaning the final frame should match the initial composition. Physically, the prompt explicitly
    states that the wood acts as an insulator. Due to the low thermal conductivity of the thick wooden
    coaster and the short duration of the event ('several seconds'), the heat from the plate will not
    reach the crayon in sufficient quantity to cause a phase change. Therefore, the correct physical outcome
    is for the crayon to remain unmelted and standing, demonstrating the insulating property of the wood.
