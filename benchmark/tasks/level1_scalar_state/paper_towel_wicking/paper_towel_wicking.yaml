  image_gen_prompt: A white paper towel strip hangs vertically from a clip or stand. The bottom edge of the paper towel just touches the surface of blue-dyed water in a shallow clear dish below. The paper towel is currently dry and white.
  video_WM: The paper towel remains in contact with the blue water. Through capillary action, the colored water begins wicking upward into the paper fibers. A distinct blue line advances up the white paper towel, leaving a saturated blue section below and dry white paper above. The blue region steadily climbs higher as more liquid is absorbed. The camera rotates right at constant speed until the paper towel setup completely exits the view to the right. The camera continues rotating right for several seconds while the water continues wicking upward off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the paper towel back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The paper towel remains in contact with the blue water. Through capillary action, the colored water begins wicking upward into the paper fibers. A distinct blue line advances up the white paper towel, leaving a saturated blue section below and dry white paper above. The blue region steadily climbs higher as more liquid is absorbed during the occlusion period. STOP.
