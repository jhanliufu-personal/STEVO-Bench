id: salt_dissolve_03
level: 1
category: scalar_state
tags: []
variant_of: salt_dissolve
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to extreme camera zoom out.
changes:
  occlusion_method: Camera zooms out until the tank is too small to see details, then zooms back in.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A salt lick is submerged in a turbulent water tank and is dissolving. The camera zooms out
    rapidly until the tank becomes a tiny, indistinguishable dot in the distance. Then, the camera zooms
    back in to the original framing. No cut, no scene change. STOP.
  camera_WM: A salt lick is submerged in a turbulent water tank and is dissolving. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A clear glass tank filled with turbulent water. Inside the tank, a large, rough,
    white cubic block (a salt lick) is submerged. The water is agitated, creating bubbles and white foam
    around the block, particularly at the top and sides. To the right, there are black vertical heater
    or filter tubes. To the left, black piping is visible outside the tank. The background shows a window
    with a view of a building.
  init2final_edit_prompt: Edit the given image to show the white salt block significantly dissolved. The
    block should be smaller in volume with eroded, rounded edges and a reduced overall mass compared to
    the original state. The water should remain turbulent with bubbles. Maintain the exact same camera
    angle, tank structure, pipes, and background details.
  rationale: The video prompt describes a salt lick dissolving in turbulent water while the camera performs
    a long zoom-out and zoom-in maneuver. This camera trajectory implies a significant passage of time
    while the tank is effectively unobservable (too small to see details). When the camera returns to
    the initial framing, the physical process of dissolution must have progressed. Therefore, the final
    state should show the salt block as smaller, eroded, and having lost mass due to the water's action
    during the elapsed time.
