prompts:
  init_frame_edit_prompt: Edit the image to make the matchstick wood look soaked in oil, appearing darker
    and glistening.
  video_WM: The matchstick is soaked in highly flammable accelerant and burns intensely. A gloved hand
    comes from behind the camera and covers the lens completely, blocking all light. The hand covers the
    lens for several seconds. Then the hand is removed, revealing the scene again. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The matchstick is soaked in highly flammable accelerant and burns intensely. A gloved hand
    comes from behind the camera and covers the lens completely, blocking all light. The hand covers the
    lens for several seconds. Then the hand is removed, revealing the scene again. No zoom, no cut, no
    scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up side view of a dirty, bare human hand holding a burning matchstick.
    The match head is completely charred black, and the flame is active near the top of the stick. The
    upper portion of the wooden shaft is blackened, while the lower portion remains light-colored unburnt
    wood. The background is a plain, out-of-focus beige or grey surface.
  init2final_edit_prompt: Edit the given image to show the matchstick after it has burned for several
    more seconds. The blackened, charred texture should extend significantly further down the wooden shaft
    towards the fingers holding it. The flame should be positioned lower on the stick, closer to the hand,
    or the stick should appear more consumed by fire. The section of unburnt, light-colored wood should
    be noticeably shorter than in the original image.
  rationale: 'The prompt specifies that the matchstick is soaked in accelerant and burns intensely for
    several seconds while the camera is occluded. This implies a rapid chemical reaction where the fire
    travels down the stick. When the view is restored, the physical state of the match must reflect this
    elapsed time: the charred region must be longer, the unburnt wood shorter, and the flame (if still
    present) positioned closer to the fingers.'
