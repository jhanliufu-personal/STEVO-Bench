evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden kitchen counter. In the center, a rustic
    wooden tray holds a clear glass apothecary jar filled about halfway with white powder (baking soda).
    A glass stopper sits in the neck of the jar. To the left of the tray is a bottle of vinegar. Above
    the tray, a hand holds a clear glass pitcher containing liquid, tilted slightly as if preparing to
    pour.
  init2final_edit_prompt: Edit the given image to show the chemical reaction between vinegar and baking
    soda. Remove the glass stopper from the jar. Render a large amount of white, fizzy foam rising rapidly
    out of the mouth of the jar and overflowing down the sides onto the wooden tray. The foam should be
    bubbly and voluminous, occupying significantly more space than the initial white powder. The pitcher
    should be tilted further or appear to have poured liquid into the jar.
  rationale: The prompt describes pouring vinegar (acetic acid) into baking soda (sodium bicarbonate).
    This triggers a rapid acid-base reaction that releases carbon dioxide gas, creating a large volume
    of foam. The physical rollout involves the removal of the stopper (implied by the act of pouring into
    the container) and the immediate expansion of the mixture. The key scalar change is the massive increase
    in volume and height of the substance in the jar as it converts from static powder and liquid into
    expanding foam.
