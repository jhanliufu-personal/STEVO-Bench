evaluation:
  init_frame_description: A close-up view of a wooden wall cavity during construction. Two vertical wooden
    studs frame the shot. Inside the cavity, a mound of wet, yellow spray foam insulation is adhering
    to the backing board. A spray gun nozzle is visible in the upper right corner, directing a stream
    of foam onto the mound. The floor is covered in sawdust and wood shavings.
  init2final_edit_prompt: Edit the given image so that the mound of yellow spray foam insulation inside
    the wall cavity is significantly larger and more voluminous. The foam should appear to have expanded,
    filling more of the space between the vertical wooden studs and reaching higher up the wall backing.
    Maintain the bubbly texture of the foam. Ensure the wooden studs, the floor with sawdust, and the
    general lighting remain consistent with the original scene, but show the foam mass as having grown
    in size.
  rationale: The video prompt describes the foam expanding rapidly. Although a plywood sheet temporarily
    occludes the view, the underlying physical process of expansion continues. Therefore, when the plywood
    slides away to reveal the scene again in the final frame, the primary change must be a noticeable
    increase in the volume and coverage of the yellow foam insulation compared to the initial frame. The
    camera position returns to the original view, so the background structure remains constant.
