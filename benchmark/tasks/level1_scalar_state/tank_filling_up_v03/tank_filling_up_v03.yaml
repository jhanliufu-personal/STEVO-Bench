id: tank_filling_up_v03
level: 1
category: scalar_state
tags: []
variant_of: tank_filling_up
variation_type: occlusion_method
variation_description: Occlusion changed from camera panning to thick industrial steam/fog filling the
  room.
changes:
  occlusion_method: Fog/Smoke
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts or zoom. Camera is static, centered on the pipe and water
    tank. Water flows continuously. Suddenly, thick white industrial steam rapidly fills the room, completely
    obscuring the tank and pipe from view. The steam swirls for several seconds, hiding the scene. Then,
    the steam dissipates quickly, clearing the view. STOP.
  camera_WM: Single continuous take, no cuts or zoom. Camera is static, centered on the pipe and water
    tank. Water flows continuously. Suddenly, thick white industrial steam rapidly fills the room, completely
    obscuring the tank and pipe from view. The steam swirls for several seconds, hiding the scene. Then,
    the steam dissipates quickly, clearing the view. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A static wide shot of a warehouse interior featuring a large, clear cylindrical
    tank in the center. The tank has red measurement markings on its front surface, with scales for grams
    (g) on the left and liters (L or lt) on the right. The current water level is approximately at the
    140 L mark. A metal pipe enters from the top right, pouring a stream of water into the tank, causing
    splashing and bubbles at the surface. The background shows industrial shelving, pallets, and equipment.
  init2final_edit_prompt: Edit the given image to show the water level in the cylindrical tank significantly
    higher than it is currently. The water surface should be raised to a higher position on the red measurement
    scale, reflecting the accumulation of water. Maintain the stream of water pouring from the pipe and
    the splashing effect at the new, higher surface level. Ensure the background, tank position, and lighting
    remain unchanged.
  rationale: The video prompt describes a continuous action of water flowing into the tank. Although the
    view is temporarily obscured by steam, the physical process of filling continues during this time.
    Therefore, when the steam dissipates and the view is restored, the tank must contain a larger volume
    of water, resulting in a higher water level than in the initial frame. The camera is static, so the
    environment remains consistent.
  questions:
  - id: q1_water_level
    question: Is the water level in the tank higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the height of the water surface against the red markings.
  - id: q2_volume_increase
    question: Is there more water in the tank compared to the start?
    answer_type: yes_no
    notes_for_judge: The volume of water should have increased.
  - id: q3_surface_proximity
    question: Is the water surface closer to the top of the tank than in the initial view?
    answer_type: yes_no
    notes_for_judge: The gap between the water and the top rim should be smaller.
  - id: q4_empty_space
    question: Is the empty space at the top of the tank smaller than before?
    answer_type: yes_no
    notes_for_judge: As water fills the tank, the empty volume decreases.
  - id: q5_markings_check
    question: Is the water level clearly above the starting position on the measurement scale?
    answer_type: yes_no
    notes_for_judge: The level started around the 140 mark; it should be noticeably above this.
  - id: q6_steam_cleared
    question: Is the view clear of the thick white steam mentioned in the description?
    answer_type: yes_no
    notes_for_judge: The final state should be clear, not obscured.
  - id: q7_pipe_consistency
    question: Is the metal pipe still visible in the same position?
    answer_type: yes_no
    notes_for_judge: The pipe structure should not change.
