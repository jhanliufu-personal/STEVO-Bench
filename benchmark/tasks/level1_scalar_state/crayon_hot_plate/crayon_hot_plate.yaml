  - id: shape_deformation
    question: Has the crayon lost its original perfect cylindrical shape?
    answer_type: yes_no
    notes_for_judge: The object should look deformed, slumped, or liquefied.
  - id: wax_spread_area
    question: Does the blue wax cover a wider area on the black plate than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Melting causes the material to spread out.
  - id: state_change_melting
