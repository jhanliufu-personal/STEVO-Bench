evaluation:
  init_frame_description: A close-up, eye-level shot of a black electric hot plate with a circular heating
    element. A blue crayon is standing upright in the center of the heating coils. A red indicator light
    labeled 'HEATING' is illuminated on the front panel. Faint steam or smoke is visible rising from the
    hot plate area. The background is dark and out of focus, suggesting a kitchen counter.
  init2final_edit_prompt: Edit the given image to show the blue crayon significantly melted. The crayon
    should be much shorter, deformed, or collapsed into a pool of blue liquid wax on the center of the
    black heating element. Ensure the blue wax is spread out on the surface rather than standing tall.
    Keep the red heating indicator light illuminated.
  rationale: 'The initial frame establishes that the crayon is standing on an active hot plate (indicated
    by the red light and steam). The prompt describes a camera movement that pans away and then returns
    to the original view after a duration of time. During this occlusion, the heat from the plate will
    cause the paraffin wax of the crayon to melt. Therefore, when the camera returns to the initial viewpoint,
    the crayon must exhibit signs of melting: reduced height, loss of cylindrical shape, and the formation
    of a liquid wax pool on the surface.'
