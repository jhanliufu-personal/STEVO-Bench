id: crayon_hot_plate
level: 1
category: scalar_state
tags: []
prompts:
  image_gen_prompt: A bright blue crayon stands vertically upright on a black electric hot plate. The hot plate indicator light shows it is actively heating. The crayon is intact and solid.
  video_WM: The crayon stands on the hot plate surface. Heat from the plate causes the crayon to soften at the base where it contacts the hot surface. The bottom of the crayon begins melting, forming a small puddle of colored wax that spreads outward on the plate. The crayon gradually loses height as more wax melts and adds to the growing blue puddle. The camera rotates right at constant speed until the hot plate completely exits the view to the right. The camera continues rotating right for several seconds while the crayon continues melting off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the hot plate and melting crayon back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The crayon stands on the hot plate surface. Heat from the plate causes the crayon to soften at the base where it contacts the hot surface. The bottom of the crayon begins melting, forming a small puddle of colored wax that spreads outward on the plate. The crayon gradually loses height as more wax melts and adds to the growing blue puddle during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
