prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts or zoom. Camera is fixed on the funnel and jar. Sand flows
    continuously through the glass funnel into the jar. Suddenly, thick white steam begins to fill the
    room, quickly becoming dense enough to completely obscure the funnel and jar. The steam swirls for
    several seconds. Then the steam dissipates and clears, revealing the scene again. Lighting and objects
    remain consistent and realistic.
  camera_WM: Single continuous take, no cuts or zoom. Camera is fixed on the funnel and jar. Sand flows
    continuously through the glass funnel into the jar. Suddenly, thick white steam begins to fill the
    room, quickly becoming dense enough to completely obscure the funnel and jar. The steam swirls for
    several seconds. Then the steam dissipates and clears, revealing the scene again. Lighting and objects
    remain consistent and realistic.
