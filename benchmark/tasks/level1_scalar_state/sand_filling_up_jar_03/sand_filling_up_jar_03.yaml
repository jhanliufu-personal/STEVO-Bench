evaluation:
  init_frame_description: A clear glass jar sits on a rustic wooden table with a glass funnel resting
    in its mouth. Sand is visible inside the funnel and is actively pouring in a thin stream into the
    jar below. Inside the jar, a conical pile of sand has formed at the bottom. The background consists
    of blurred wooden planks.
  init2final_edit_prompt: Edit the given image to show the pile of sand inside the glass jar as significantly
    larger and taller, filling more of the jar's internal volume. Maintain the position of the jar and
    funnel on the wooden table.
  rationale: 'The video prompt describes a continuous process of sand flowing into the jar, interrupted
    by a temporary visual occlusion (steam). While the view is obscured, the physical process of sand
    accumulation continues. Therefore, when the scene is revealed again, the state of the world must reflect
    the passage of time: the pile of sand in the destination jar must have grown in size and height due
    to the constant flow.'
