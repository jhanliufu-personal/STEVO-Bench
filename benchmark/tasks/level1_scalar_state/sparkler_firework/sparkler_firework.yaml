  init2final_edit_prompt: Edit the given image to show the sparkler has burned further down the stick.
    Move the bright glowing ignition point and the cluster of sparks significantly closer to the hand
    holding the stick. Shorten the length of the unburnt gray coating between the sparks and the fingers.
