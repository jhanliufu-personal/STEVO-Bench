id: smoke_jar_filling_06
level: 1
category: scalar_state
tags: []
variant_of: smoke_jar_filling
variation_type: dynamic_condition
variation_description: A strong wind blows horizontally, pushing smoke away from the jar opening.
changes:
  occlusion_method: null
  dynamic_conditions: Strong horizontal wind/draft
  expected_outcome_change: Smoke is blown sideways and does not enter the jar; jar remains clear
prompts:
  init_frame_edit_prompt: Edit the image to show the smoke plume blowing sharply and horizontally to the
    left, indicating a strong cross-wind.
  video_WM: The incense stick burns at the jar opening. A strong fan is blowing horizontally from right
    to left across the jar opening. The wind force acts on the lightweight smoke. The camera rotates right
    at constant speed until the jar completely exits the view to the right. The camera continues rotating
    right for several seconds while off-screen. Then the camera rotates left smoothly at the same rate
    back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The incense stick burns at the jar opening. A strong fan is blowing horizontally from right
    to left across the jar opening. The wind force acts on the lightweight smoke during the occlusion
    period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A clear glass jar sits on a dark wooden surface in front of a window. An incense
    stick enters the frame from the top right, with its burning tip positioned near the jar's opening.
    Wisps of white smoke are currently curling inside the jar, filling it with a hazy texture, and some
    smoke is drifting gently out to the left.
  init2final_edit_prompt: Edit the given image to make the interior of the glass jar clear and transparent,
    removing the accumulated smoke. Render the smoke trail from the incense stick blowing straight horizontally
    to the left above the jar opening, indicating a strong wind, without entering the jar.
  rationale: 'The prompt introduces a strong horizontal fan blowing from right to left. Physically, this
    creates two effects: first, the new smoke generated by the incense stick is immediately blown to the
    left and prevented from entering the jar. Second, the fast-moving air across the jar opening creates
    a low-pressure zone (Bernoulli''s principle) that draws the existing smoke out of the jar. Since the
    camera looks away for several seconds, there is sufficient time for the jar to clear. Upon the camera''s
    return, the jar should be empty of smoke, and the smoke plume should be a horizontal stream.'
  questions:
  - id: smoke_volume_decrease
    question: Is there less smoke inside the jar compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The jar should be clearer or empty due to the wind sucking the smoke out.
  - id: smoke_direction
    question: Is the smoke from the incense stick blowing horizontally to the left?
    answer_type: yes_no
    notes_for_judge: The strong fan forces the smoke into a horizontal stream.
  - id: jar_clarity
    question: Is the interior of the glass jar clearer than it was in the starting image?
    answer_type: yes_no
    notes_for_judge: The haze inside the jar should be reduced or gone.
  - id: smoke_entry
    question: Does the smoke plume mostly bypass the interior of the jar?
    answer_type: yes_no
    notes_for_judge: New smoke should be blown away before it can curl inside.
  - id: stick_presence
    question: Is the incense stick still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: jar_position
    question: Is the jar in the same position on the wooden surface?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check; the camera returned to the original view.
