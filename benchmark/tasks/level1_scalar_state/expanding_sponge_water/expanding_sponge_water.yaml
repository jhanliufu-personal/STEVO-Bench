prompts:
  image_gen_prompt: A compressed dry sponge sits flat in a shallow white dish. The sponge is thin and compact in its dehydrated state. A hand holds a pitcher of water positioned above the sponge, about to pour.
  video_WM: The hand tilts the pitcher and pours water over the compressed sponge. The water flows onto the sponge surface. Immediately upon contact with water, the sponge begins absorbing the liquid through its porous structure. The sponge rapidly swells and expands in thickness and volume as it becomes saturated. The flat compressed sponge transforms into a thick, plump, fully expanded sponge filled with water. The camera rotates right at constant speed until the dish and sponge completely exit the view to the right. The camera continues rotating right for several seconds while the sponge continues absorbing water and expanding off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the dish and sponge back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand tilts the pitcher and pours water over the compressed sponge. The water flows onto the sponge surface. Immediately upon contact with water, the sponge begins absorbing the liquid through its porous structure. The sponge rapidly swells and expands in thickness and volume as it becomes saturated. The flat compressed sponge transforms into a thick, plump, fully expanded sponge filled with water during the occlusion period. STOP.
