id: fuse_burn_08
level: 1
category: scalar_state
tags: []
variant_of: fuse_burn
variation_type: combined
variation_description: Gunpowder trail (fast burn) occluded by a falling object
changes:
  occlusion_method: A large cardboard box falls over the scene
  dynamic_conditions: Loose gunpowder (fast burn)
  expected_outcome_change: Burn is instantaneous
prompts:
  init_frame_edit_prompt: Edit the image to replace the braided rope fuse with a loose, granular trail
    of black gunpowder.
  video_WM: The gunpowder trail ignites with a bright flash, the flame racing along the path. A large
    cardboard box falls from above, landing directly over the trail and blocking the view. The box is
    then lifted away. No zoom, no cut, no scene change. STOP.
  camera_WM: The gunpowder trail ignites with a bright flash, the flame racing along the path. A large
    cardboard box falls from above, landing directly over the trail and blocking the view. The box is
    then lifted away. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A high-angle shot of a concrete floor with a curved trail of black gunpowder
    granules. The trail starts at the bottom left and curves towards the right background. A bright orange
    flame with sparks is igniting the very beginning of the trail at the bottom left, emitting wisps of
    smoke.
  init2final_edit_prompt: Edit the given image to show the gunpowder trail having burned significantly
    further along its path. The bright orange flame and sparks should be located further down the curved
    trail, towards the middle or right side of the image. The original ignition point at the bottom left
    should now show burnt residue, ash, or scorch marks instead of unburnt black granules. Smoke should
    be rising from the new location of the flame.
  rationale: The video prompt describes a continuous burning process that is temporarily occluded by a
    box. When the box is lifted, the state of the world must reflect the passage of time and the physical
    action of the fire consuming the fuel. The flame front moves along the trail, converting the black
    powder (mass) into ash and gas. The primary scalar changes are the position of the flame (distance
    traveled along the path) and the reduction in the amount of unburnt gunpowder.
  questions:
  - id: flame_position
    question: Has the active flame moved further along the gunpowder trail compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The flame should be located further down the curve, not at the starting point.
  - id: powder_reduction
    question: Is there less unburnt black powder visible than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The trail of black granules should be shorter as the fire consumes it.
  - id: burnt_residue
    question: Is the area where the flame started (bottom left) now burnt out or ashy?
    answer_type: yes_no
    notes_for_judge: The starting point should no longer have a pile of fresh black powder.
  - id: flame_advancement
    question: Is the fire closer to the right side of the image than it was initially?
    answer_type: yes_no
    notes_for_judge: Assuming the trail curves right, the flame should have moved in that direction.
  - id: trail_continuity
    question: Does the remaining unburnt powder still follow the original curved path?
    answer_type: yes_no
    notes_for_judge: The unburnt section should not have moved, only the burning front moves.
  - id: floor_consistency
    question: Is the concrete floor texture consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The background environment should remain unchanged.
  - id: smoke_presence
    question: Is there smoke visible near the current location of the flame?
    answer_type: yes_no
    notes_for_judge: Burning gunpowder produces smoke.
