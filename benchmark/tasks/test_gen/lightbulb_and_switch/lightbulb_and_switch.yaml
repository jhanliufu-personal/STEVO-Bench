  init_frame_description: A dimly lit, empty room with textured, concrete-like walls and ceiling. A single
    unlit lightbulb hangs from a fixture in the center of the ceiling. The bulb is dark, appearing as
    a silhouette against the slightly lighter ceiling. To the left, there is a dark vertical area suggesting
    a doorway or corner.
  init2final_edit_prompt: Edit the given image to show the hanging lightbulb turned on. The bulb itself
    should be glowing brightly with a warm light. The surrounding ceiling and walls should be illuminated
    by the light source, casting realistic shadows and making the room significantly brighter than the
    dark initial state.
  rationale: The video prompt establishes that the light is functioning and controlled by a switch. The
    initial frame shows the light is off. The camera pans away, and while the light is out of view, the
    switch is toggled to the opposite position. Since it started off, toggling it turns it on. The camera
    then returns to the original viewpoint. Therefore, the final frame must show the lightbulb illuminated
    and the room lit.
