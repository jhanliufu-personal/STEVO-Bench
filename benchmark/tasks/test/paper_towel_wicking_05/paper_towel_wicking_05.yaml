id: paper_towel_wicking_05
level: 1
category: scalar_state
tags: []
variant_of: paper_towel_wicking
variation_type: combined
variation_description: The paper towel is replaced with a non-porous plastic strip, and the occlusion
  method is changed to the lights turning off.
changes:
  occlusion_method: The lab lights turn off, making the scene completely black, and then turn back on
    after a period.
  dynamic_conditions: The porous paper towel is replaced with a non-porous, hydrophobic plastic strip
    of the same dimensions.
  expected_outcome_change: No wicking occurs. The blue liquid does not climb the strip.
prompts:
  init_frame_edit_prompt: Edit the image to change the texture of the white strip from a porous paper
    towel to a smooth, slightly glossy white plastic. The part of the strip that was blue from wicking
    should now be white, so the entire strip is uniformly white.
  video_WM: The white plastic strip edge remains in contact with the blue water. The strip is made of
    a smooth, non-porous, hydrophobic polymer. The water is blue-dyed. The lights in the room turn off,
    plunging the scene into complete darkness for several seconds. Then, the lights turn back on, revealing
    the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The white plastic strip edge remains in contact with the blue water. The strip is made of
    a smooth, non-porous, hydrophobic polymer. The state of the liquid on the strip is observed after
    the period of darkness. STOP.
