    and ice cube completely exit the frame to the right. The camera continues moving right for several
    seconds. Then the camera moves left at the same constant speed back to the original viewpoint, bringing
    the burner back into view. STOP.
  camera_WM: Camera moves right until object exits frame, then moves left back to center.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
