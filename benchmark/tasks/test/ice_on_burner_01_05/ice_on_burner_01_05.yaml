id: ice_on_burner_01_05
level: 1
category: scalar_state
tags: []
variant_of: ice_on_burner_01
variation_type: combined
variation_description: Burner is off (cold) and occlusion is achieved by zooming out.
changes:
  occlusion_method: Camera zoom out
  dynamic_conditions: Burner is OFF (cold surface)
  expected_outcome_change: Ice remains frozen/solid
prompts:
  init_frame_edit_prompt: Edit the image to turn the heating element OFF. Make the coil black and dark
    grey instead of glowing red. Remove all steam and smoke rising from the ice.
  video_WM: Single continuous shot, no cuts. Camera starts centered on the cold, black burner and ice
    cube. The camera zooms out continuously until the stove is just a small speck in the distance and
    details are no longer visible. The camera holds this wide shot for several seconds. Then the camera
    zooms back in to the original close-up framing of the burner. STOP.
  camera_WM: Camera zooms out until the scene is indistinguishable, then zooms back in.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
