    is a clear, visible gap between the bottom edge of the paper towel and the surface of the liquid.
    The paper towel itself should be completely white, with no blue coloration at its base.
  video_WM: The paper towel is held by a clamp with its bottom edge suspended just above the surface of
    the blue water, not in contact with it. The paper towel has a porous cellulose fiber structure. The
    water is blue-dyed. The camera rotates right at constant speed until the paper towel setup completely
    exits the view to the right. The camera continues rotating right for several seconds while off-screen.
    Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the
    paper towel back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The paper towel's bottom edge is suspended just above the surface of the blue water, not
    touching it. The setup is observed after the occlusion period. STOP.
camera_control:
