id: frayed_rope_snap_04
level: 4
category: structural_transformation
tags: []
variant_of: frayed_rope_snap
variation_type: dynamic_condition
variation_description: The winches reverse direction to release tension instead of pulling.
changes:
  occlusion_method: null
  dynamic_conditions: Winches reverse direction to feed rope out.
  expected_outcome_change: Rope becomes slack and sags instead of snapping.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The winches reverse direction, slowly feeding the rope out to reduce tension. The pulling
    force is replaced by a gradual release. The camera rotates right until the rope completely exits the
    view, then rotates toward the left smoothly at the same rate until the center point between the winches
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The winches reverse direction, slowly feeding the rope out to reduce tension. The pulling
    force is replaced by a gradual release. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a thick, weathered rope stretched horizontally
    between two rusty metal winches positioned on the left and right edges. The rope is under high tension,
    forming a straight line. In the center, the rope is severely frayed and damaged, with a mass of broken
    fibers splayed out and a thinner core section bearing the load. The background is a blurred, neutral-colored
    industrial or outdoor surface.
  init2final_edit_prompt: Edit the given image so that the rope is slack and sagging downwards between
    the winches. The rope should form a visible downward curve (catenary) instead of a straight line,
    indicating a release of tension. The central frayed section should hang lower than the winch attachment
    points. The loose strands at the frayed area should appear relaxed, bunched, or hanging down rather
    than being pulled horizontally taut. The winches and background should remain unchanged.
  rationale: The prompt explicitly directs the winches to reverse and feed the rope out to reduce tension.
    This physical action causes the previously taut rope to slacken and sag under gravity, forming a curved
    shape. The camera rotation serves as a transition period, but the view returns to the original center
    point, meaning the final framing is identical to the initial one. The rope remains connected but is
    no longer under stress; the frayed fibers relax and the rope droops.
  questions:
  - id: rope_sagging
    question: Is the rope sagging downwards between the winches?
    answer_type: yes_no
    notes_for_judge: The rope should no longer be straight but should droop due to gravity.
  - id: rope_curve
    question: Does the rope form a visible downward curve?
    answer_type: yes_no
    notes_for_judge: Check for a catenary shape.
  - id: center_lower
    question: Is the central frayed section positioned lower than the winch attachment points?
    answer_type: yes_no
    notes_for_judge: In the initial frame it is level; now it should be lower.
  - id: less_taut
    question: Is the rope clearly less taut than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the tension/straightness.
  - id: rope_connected
    question: Is the rope still connected as a single piece between the winches?
    answer_type: yes_no
    notes_for_judge: The prompt specifies a release of tension, not a snap. The rope should remain intact.
  - id: winches_visible
    question: Are the two winches still visible on the left and right sides?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
