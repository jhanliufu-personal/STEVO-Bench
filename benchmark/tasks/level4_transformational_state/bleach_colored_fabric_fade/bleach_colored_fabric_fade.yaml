  image_gen_prompt: A square of dark blue cotton fabric lies flat on a white plastic tray. A bottle of household bleach is held above the fabric, tilted and ready to pour. The fabric color is a rich, saturated dark blue.
  video_WM: The bleach bottle tips and pours liquid bleach onto the dark blue fabric surface. Household bleach contains sodium hypochlorite which is a strong oxidizing agent that reacts with organic dye molecules. The chemical oxidation process is irreversible at room temperature. The bleach continues to contact and saturate the fabric fibers. The camera rotates right at constant speed until the tray and fabric completely exit the view to the right. The camera continues rotating right for several seconds while the bleach remains in contact with the fabric off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the tray and fabric back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The bleach bottle tips and pours liquid bleach onto the dark blue fabric surface. Household bleach contains sodium hypochlorite which is a strong oxidizing agent that reacts with organic dye molecules. The chemical oxidation process is irreversible at room temperature. The bleach continues to contact and saturate the fabric fibers during the occlusion period. STOP.
