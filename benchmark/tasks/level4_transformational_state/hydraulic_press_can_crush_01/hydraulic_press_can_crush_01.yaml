id: hydraulic_press_can_crush_01
level: 4
category: structural_transformation
tags: []
variant_of: hydraulic_press_can_crush
variation_type: occlusion_method
variation_description: Occlusion by a safety door sliding in front of the camera instead of camera rotation.
changes:
  occlusion_method: A metal safety door slides in to block the view.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (can crushed).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hydraulic press plate continues to move downward with immense force onto the soda can.
    The crushing action is active. A heavy metal safety door slides from the left to completely cover
    the view of the press area. After a moment, the safety door slides back to the left. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The hydraulic press plate continues to move downward with immense force onto the soda can.
    The crushing action is active. A heavy metal safety door slides from the left to completely cover
    the view of the press area. After a moment, the safety door slides back to the left. No zoom, no cut,
    no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A silver aluminum beverage can standing upright on the bottom metal plate of
    a hydraulic press. The top metal plate is positioned directly above the can. The background features
    industrial machinery details, including hydraulic hoses, a pressure gauge on the right, and vertical
    metal support beams.
  init2final_edit_prompt: Edit the given image to show the hydraulic press after crushing the object.
    The top metal plate should be positioned significantly lower, reducing the vertical gap between the
    plates. The silver aluminum can should be flattened, crumpled, and compressed into a short disc or
    puck shape between the plates. Keep the background machinery, hoses, and bottom plate identical to
    the original view.
  rationale: The video prompt describes a hydraulic press action where the plate moves downward to crush
    the can. A safety door temporarily occludes the scene, implying that the crushing action continues
    or completes during this occlusion. When the door slides back, revealing the scene, the physical state
    of the can must be irreversibly changed (crushed) and the press mechanism must be in a lower position
    corresponding to the compression.
  questions:
  - id: can_height_reduction
    question: Is the aluminum can significantly shorter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical height of the can. It should be compressed.
  - id: can_deformation
    question: Does the can appear crumpled, flattened, or structurally deformed?
    answer_type: yes_no
    notes_for_judge: Look for loss of the smooth cylindrical shape.
  - id: press_plate_position
    question: Is the top metal plate of the press lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The gap between the top and bottom plates should be smaller.
  - id: structural_integrity
    question: Has the can lost its original cylindrical structural integrity?
    answer_type: yes_no
    notes_for_judge: The can should no longer be a perfect cylinder.
  - id: gap_reduction
    question: Is the vertical space between the top and bottom plates reduced compared to the start?
    answer_type: yes_no
    notes_for_judge: Direct consequence of the press moving down.
  - id: background_consistency_gauge
    question: Is the pressure gauge in the background still visible?
    answer_type: yes_no
    notes_for_judge: Check for the circular gauge on the right side.
  - id: background_consistency_hoses
    question: Are the black hydraulic hoses in the background still present?
    answer_type: yes_no
    notes_for_judge: Ensure background elements remain consistent.
