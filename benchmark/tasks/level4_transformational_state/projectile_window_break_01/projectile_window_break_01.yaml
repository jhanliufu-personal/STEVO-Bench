id: projectile_window_break_01
level: 4
category: structural_transformation
tags: []
variant_of: projectile_window_break
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a wooden shutter closing.
changes:
  occlusion_method: A wooden shutter swings closed to block the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The high-speed metal BB projectile strikes the center of the glass pane. Suddenly, a wooden
    shutter swings closed from the right, completely blocking the window from view. After a moment, the
    shutter swings open to the right. No zoom, no cut, no scene change. STOP.
  camera_WM: The high-speed metal BB projectile strikes the center of the glass pane. Suddenly, a wooden
    shutter swings closed from the right, completely blocking the window from view. After a moment, the
    shutter swings open to the right. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view through a wooden window frame looking out at a green garden
    and a wooden house. A copper-colored projectile (bullet or BB) is frozen in mid-air in the center
    of the frame, moving towards the glass with visible air distortion or shockwaves around it. The glass
    pane is currently intact.
  init2final_edit_prompt: Edit the given image to show the glass pane shattered with a hole or spiderweb
    cracks in the center. Remove the floating projectile and the air distortion trails. Keep the wooden
    window frame and the outdoor background identical, but viewed through the damaged glass.
  rationale: The video prompt describes a high-speed projectile striking the glass. This is an irreversible
    physical event that will cause the glass to break, crack, or shatter. The shutter temporarily blocks
    the view, allowing the impact to occur while occluded, but then opens to reveal the aftermath. In
    the final state, the projectile will have passed through or fallen, and the glass will permanently
    display structural damage (cracks or a hole).
