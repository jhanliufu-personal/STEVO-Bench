id: sandcastle_wave_impact_03
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: occlusion_method
variation_description: Occlusion changed to camera tilting up towards the sky.
changes:
  occlusion_method: Camera tilt up
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. The camera
    tilts upward towards the sky until the sandcastle and wave are completely out of the frame. The camera
    then tilts back down smoothly to the original angle. No zoom, no cut, no scene change. STOP.
  camera_WM: The ocean wave crashes directly onto the sandcastle. The impact force is applied to the structure.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed sandcastle stands on a sandy beach, featuring multiple towers with
    conical roofs, a bridge connecting sections, and seashells lining the base. Behind the sandcastle,
    a massive, translucent green wave is curling over, poised to crash directly onto the structure. The
    sky is overcast and grey.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The sandcastle
    structure should be collapsed, eroded, or flattened into a mound of wet sand. The tall towers and
    bridge should be destroyed or missing. The large curling wave in the background should be replaced
    by turbulent foam, mist, or receding water. The sand surface should appear soaked and disturbed.
  rationale: The prompt describes a large wave crashing onto the sandcastle while the camera tilts up
    (occluding the scene) and then back down. During the occlusion, the physical force of the water impacts
    the fragile sand structure. When the camera returns to the original angle, the sandcastle must be
    significantly damaged or destroyed, representing an irreversible transformation from a structured
    form to a disordered, eroded state.
  questions:
  - id: sandcastle_collapsed
    question: Is the sandcastle structure significantly collapsed or flattened compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The structure should no longer be tall and pristine; it should look damaged or leveled.
  - id: towers_destroyed
    question: Are the tall towers visible in the first frame now destroyed or missing?
    answer_type: yes_no
    notes_for_judge: The specific architectural features (towers) should be gone or reduced to stumps.
  - id: bridge_broken
    question: Is the bridge connecting the sandcastle sections broken or gone?
    answer_type: yes_no
    notes_for_judge: The bridge is a delicate feature that should not survive the wave.
  - id: sand_wetness
    question: Does the sand where the castle stood appear wetter than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The wave crash should leave the sand soaked.
  - id: wave_crashed
    question: Is the large curling wave from the initial frame no longer standing?
    answer_type: yes_no
    notes_for_judge: The wave must have crashed; the background should show foam or receding water, not
      the pre-crash curl.
  - id: detail_erosion
    question: Has the intricate detail of the sandcastle (windows, battlements) been eroded or smoothed
      out?
    answer_type: yes_no
    notes_for_judge: Water erodes fine details; they should not be sharp anymore.
  - id: height_reduction
    question: Is the overall height of the sand structure lower than it was initially?
    answer_type: yes_no
    notes_for_judge: Destruction implies a loss of height.
  - id: debris_scattered
    question: Are the seashells or sand debris displaced from their original neat arrangement?
    answer_type: yes_no
    notes_for_judge: The force of the water should disturb loose items.
