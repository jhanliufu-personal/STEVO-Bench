evaluation:
  init_frame_description: A close-up outdoor shot showing a thick, textured wooden log resting on a wooden
    sawhorse. A hand saw is positioned in a shallow groove (kerf) on top of the log, with its handle pointing
    upwards and to the left. There is a small amount of sawdust visible on the log around the cut. The
    background features a blurred forest with trees.
  init2final_edit_prompt: Edit the given image to show the hand saw blade positioned deeper into the wooden
    log, reflecting a significantly deepened cut. Add a noticeable amount of fresh sawdust accumulating
    on the log's surface around the blade and falling onto the sawhorse structure below. Ensure the saw
    handle sits lower relative to the top of the log to correspond with the deeper blade position.
  rationale: The prompt describes active sawing, which is a subtractive process that irreversibly removes
    material from the log. As the action progresses, the primary state changes are the deepening of the
    cut (kerf) into the wood and the generation of additional sawdust. The saw blade must physically descend
    further into the log as the cut deepens. The log's structure is permanently altered by the incision.
