id: ceramic_plate_impact_v08
level: 4
category: structural_transformation
tags: []
variant_of: ceramic_plate_impact
variation_type: combined
variation_description: Metal plate (condition) + Blocking object (occlusion).
changes:
  occlusion_method: Opaque board blocks view.
  dynamic_conditions: Plate is stainless steel.
  expected_outcome_change: Plate dents/intact, no shatter.
prompts:
  init_frame_edit_prompt: Edit the image to change the white ceramic plate into a silver stainless steel
    plate.
  video_WM: The heavy steel hammer swings down forcefully toward the metal plate. At the moment of impact,
    a large opaque wooden board slides in from the right, completely blocking the view. The board remains
    in place for a few seconds, then slides back to the right to reveal the scene. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The heavy steel hammer swings down forcefully toward the metal plate. At the moment of impact,
    a large opaque wooden board slides in from the right, completely blocking the view. The board remains
    in place for a few seconds, then slides back to the right to reveal the scene. No zoom, no cut, no
    scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A high-angle shot of a shiny, circular metal plate resting on a cracked concrete
    floor. A heavy sledgehammer with a wooden handle and steel head is positioned in the upper right,
    mid-swing or poised above the plate. The lighting is natural, casting soft shadows on the textured
    ground.
  init2final_edit_prompt: Edit the given image to show the metal plate significantly dented, bent, or
    deformed in the center. The smooth reflective surface should appear crushed or concave at the impact
    point, indicating forceful damage. The hammer should be visible near the plate or pulled back, and
    the wooden board mentioned in the context must be absent, revealing the damaged plate on the unchanged
    concrete floor.
  rationale: The video depicts a physical impact event where a heavy hammer strikes a metal plate. Although
    the moment of impact is occluded by a sliding board, the physical consequence of a steel hammer hitting
    a metal plate is plastic deformation. Therefore, when the board slides away, the plate must exhibit
    a permanent dent, bend, or crush mark. The concrete floor should remain unchanged, and the board should
    no longer be visible in the final state.
  questions:
  - id: plate_deformation_1
    question: Is the metal plate dented or deformed?
    answer_type: yes_no
    notes_for_judge: Look for a change in the plate's shape, specifically a depression or bend in the
      center.
  - id: plate_surface_2
    question: Is the center of the plate no longer flat and smooth?
    answer_type: yes_no
    notes_for_judge: The initial plate is smooth; the final plate should be distorted or crushed.
  - id: structural_change_3
    question: Has the plate undergone visible structural damage?
    answer_type: yes_no
    notes_for_judge: Any visible damage (denting, bending, crushing) counts as yes.
  - id: reflection_distortion_4
    question: Are the reflections on the plate distorted due to surface deformation?
    answer_type: yes_no
    notes_for_judge: Deformation of the metal should warp the light reflections.
  - id: board_absence_5
    question: Is the view free of the wooden board that occluded the scene?
    answer_type: yes_no
    notes_for_judge: The prompt states the board slides back to reveal the scene.
  - id: floor_consistency_6
    question: Is the concrete floor texture largely consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The floor should not change; only the plate is acted upon.
  - id: damage_visibility_7
    question: Is the damage to the plate clearly visible in the center?
    answer_type: yes_no
    notes_for_judge: The impact point is central.
