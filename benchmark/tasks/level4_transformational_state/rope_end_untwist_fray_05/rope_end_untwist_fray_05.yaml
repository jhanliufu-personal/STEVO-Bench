    right for several seconds while the hands remain off-screen holding the rope. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands hold the rope steadily on the workbench. The fingers maintain a static grip without
    applying any twisting or pulling force. The rope structure remains undisturbed and the strands sit
    naturally without manipulation. The hands remain motionless during the occlusion period. STOP.
