id: sandcastle_wave_impact_09
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: combined
variation_description: Protective bucket condition + Umbrella occlusion.
changes:
  occlusion_method: Beach umbrella blowing by
  dynamic_conditions: 'Protection: None -> Plastic bucket covering castle'
  expected_outcome_change: Sandcastle remains intact under bucket
prompts:
  init_frame_edit_prompt: Edit the image to place a large, clear plastic bucket upside-down over the sandcastle,
    fully covering it.
  video_WM: The large ocean wave crashes down over the plastic bucket protecting the sandcastle. A large
    beach umbrella blows across the foreground, completely blocking the view of the castle and wave for
    a moment, then blows away to reveal the scene. No cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down over the plastic bucket protecting the sandcastle. A large
    beach umbrella blows across the foreground, completely blocking the view of the castle and wave for
    a moment, then blows away to reveal the scene. No cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed sandcastle with towers and walls sits on a sandy beach, encased under
    a clear, upside-down plastic bucket. Behind the bucket, a large, dark green ocean wave is curling
    and about to crash. The sky is overcast with grey clouds. The foreground sand is relatively dry with
    some sea foam at the edges.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The large standing
    wave in the background should be replaced by turbulent white foam and rushing water covering the beach.
    The sand in the foreground should be soaked and submerged. The clear plastic bucket should be knocked
    over, displaced, or washed aside by the water, and the sandcastle should be collapsed, flattened,
    or eroded into a pile of wet sand.
  rationale: 'The video prompt describes a large ocean wave crashing down on the bucket and sandcastle.
    Physically, a wave of this magnitude would easily dislodge a light plastic bucket and flood the area,
    destroying or significantly damaging the sandcastle inside. The umbrella acts as an occluder to mask
    the moment of impact, but the final state must reflect the irreversible consequences of the crash:
    a flooded beach, a displaced bucket, and a destroyed sandcastle.'
  questions:
  - id: wave_crashed
    question: Is the large curling wave from the initial frame gone, replaced by foam or water?
    answer_type: yes_no
    notes_for_judge: The standing wave should have crashed.
  - id: ground_wetness
    question: Is the ground significantly wetter or covered in more foam than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The area should be flooded or awash with foam.
  - id: sandcastle_damage
    question: Has the sandcastle lost its detailed structure (collapsed, flattened, or eroded)?
    answer_type: yes_no
    notes_for_judge: Given the size of the wave, the castle should be destroyed. If it is pristine, answer
      No.
  - id: bucket_displaced
    question: Is the plastic bucket knocked over, moved, or no longer covering the sandcastle upright?
    answer_type: yes_no
    notes_for_judge: The force of the wave should displace the light bucket.
  - id: umbrella_gone
    question: Is the view clear of the beach umbrella?
    answer_type: yes_no
    notes_for_judge: The prompt states the umbrella blows away to reveal the scene.
  - id: structural_change
    question: Does the scene show evidence of irreversible physical change (destruction, flooding) compared
      to the start?
    answer_type: yes_no
    notes_for_judge: General check for the transformation.
