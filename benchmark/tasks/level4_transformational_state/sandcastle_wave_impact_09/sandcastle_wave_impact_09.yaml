id: sandcastle_wave_impact_09
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: combined
variation_description: Intensified storm condition combined with camera physical retreat.
changes:
  occlusion_method: Camera physically retreats backward
  dynamic_conditions: Wave intensified to storm surge
  expected_outcome_change: Total destruction/area flooded
prompts:
  init_frame_edit_prompt: Edit the image to make the wave look darker, larger, and more chaotic, resembling
    a dangerous storm surge.
  video_WM: The massive storm surge crashes down violently towards the sandcastle. The camera physically
    moves backward rapidly to retreat from the incoming water, moving so far back that the castle is lost
    in the distance and spray. The camera moves back forward to the original position. No cut, no scene
    change. STOP.
  camera_WM: The massive storm surge crashes down violently towards the sandcastle. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed, multi-towered sandcastle sits on a wet sandy beach. The castle features
    intricate walls, turrets, a bridge, and shell decorations. Behind it, a massive, dark, ominous wave
    is curling over, poised to crash directly onto the castle. The sky is dark and stormy, and the sea
    is turbulent.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. Render the
    sandcastle as a collapsed ruin or a flattened mound of wet sand, removing the defined towers, walls,
    and bridge. Replace the looming wave crest with turbulent foam, spray, and receding water on the beach
    surface, indicating the wave has already crashed and washed over the area.
  rationale: The prompt describes a massive wave crashing violently onto a sandcastle. While the camera
    retreats and returns, the physical action of the wave hitting the sand structure occurs. Sandcastles
    are fragile and cannot withstand the force of a crashing storm surge. Therefore, the return to the
    original view must show the irreversible destruction of the castle (flattening, erosion, collapse)
    and the progression of the wave from a looming crest to turbulent wash/foam.
  questions:
  - id: castle_structure_damage
    question: Has the sandcastle suffered significant structural damage compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The castle should look smashed, flattened, or eroded, not intact.
  - id: towers_collapsed
    question: Are the tall towers of the sandcastle collapsed or missing?
    answer_type: yes_no
    notes_for_judge: The vertical elements should be gone or significantly reduced in height.
  - id: flattened_form
    question: Is the sandcastle significantly flatter or lower in height than it was initially?
    answer_type: yes_no
    notes_for_judge: Check for loss of height due to the wave impact.
  - id: bridge_integrity
    question: Is the bridge connecting the castle sections broken or washed away?
    answer_type: yes_no
    notes_for_judge: The specific bridge structure should be destroyed.
  - id: wave_state_change
    question: Has the looming wave crest crashed or dissipated into foam?
    answer_type: yes_no
    notes_for_judge: The wave should no longer be a perfect curling wall of water; it should have crashed.
  - id: debris_scatter
    question: Are there signs of debris or scattered sand where the castle stood?
    answer_type: yes_no
    notes_for_judge: Look for the spread of the material.
  - id: environment_consistency
    question: Does the sky remain dark and stormy?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
