prompts:
  image_gen_prompt: A ball of bright blue Play-Doh modeling compound sits inside the chamber of a metal garlic press. The press handles are open and spread apart. Two hands grip the handles ready to squeeze them together.
  video_WM: The hands begin squeezing the garlic press handles together with progressive force. The garlic press chamber has a perforated bottom plate with multiple small circular holes. The plunger descends and applies pressure to the Play-Doh. Play-Doh is a modeling compound with plastic flow properties under pressure. The material flows under sufficient applied force. The only available path is through the holes in the perforated plate. Material that exits through the holes cannot reintegrate with the mass remaining in the chamber. The hands continue applying squeezing force to the press. The camera rotates right at constant speed until the garlic press completely exits the view to the right. The camera continues rotating right for several seconds while the hands remain off-screen continuing to squeeze. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the garlic press back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin squeezing the garlic press handles together with progressive force. The garlic press chamber has a perforated bottom plate with multiple small circular holes. The plunger descends and applies pressure to the Play-Doh. Play-Doh is a modeling compound with plastic flow properties under pressure. The material flows under sufficient applied force. The only available path is through the holes in the perforated plate. Material that exits through the holes cannot reintegrate with the mass remaining in the chamber. The hands continue applying squeezing force to the press during the occlusion period. STOP.
