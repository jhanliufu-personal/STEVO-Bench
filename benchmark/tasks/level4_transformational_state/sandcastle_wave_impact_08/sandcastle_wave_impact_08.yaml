id: sandcastle_wave_impact_08
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: combined
variation_description: Solid stone castle condition + Camera zoom occlusion.
changes:
  occlusion_method: Camera zoom out
  dynamic_conditions: 'Material: Sand -> Solid Stone'
  expected_outcome_change: Structure remains intact
prompts:
  init_frame_edit_prompt: Edit the image to change the castle texture to solid grey rock, while keeping
    the wave the same.
  video_WM: The large ocean wave crashes down with force directly onto the solid stone castle sculpture.
    The camera zooms out rapidly until the castle becomes a tiny indistinguishable dot in the distance,
    then zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the solid stone castle sculpture.
    The impact force is applied to the structure. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A detailed miniature castle sculpture with a stone-like texture, featuring multiple
    towers, walls, and a bridge, sits on a sandy beach. A massive, translucent green ocean wave is curling
    high above it from the left, poised to crash directly onto the structure. To the right, the beach
    extends into the distance with several people standing near the shoreline under a cloudy sky.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The stone castle
    sculpture should be structurally damaged, collapsed, or broken into rubble, with its towers toppled
    or destroyed. The large curling wave should be gone, replaced by turbulent white foam, splashing water,
    or wet sand covering the area where the wave impacted.
  rationale: 'The video prompt describes a forceful wave impact occurring during a camera zoom-out and
    zoom-in sequence. This camera maneuver implies a passage of time sufficient for the wave to crash
    and the water to settle or recede. Upon returning to the original framing, the physical state of the
    world must reflect the high-energy impact: the sculpture should be broken or destroyed (irreversible
    transformation), and the wave should have dissipated into foam or water (state change).'
