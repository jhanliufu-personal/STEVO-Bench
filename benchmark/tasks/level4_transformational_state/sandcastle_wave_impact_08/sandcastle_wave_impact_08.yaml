id: sandcastle_wave_impact_08
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: combined
variation_description: Stone material condition combined with zoom occlusion.
changes:
  occlusion_method: Camera zooms out to sky
  dynamic_conditions: Structure material changed from sand to stone
  expected_outcome_change: Structure remains intact
prompts:
  init_frame_edit_prompt: Edit the image so the castle looks like it is made of solid grey carved stone
    or concrete, rather than loose sand.
  video_WM: The large ocean wave crashes down with force directly onto the stone castle sculpture. The
    camera immediately zooms out rapidly and tilts up towards the cloudy sky until the beach is completely
    out of frame. The camera tilts back down and zooms in to the original framing. No cut, no scene change.
    STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the stone castle sculpture. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A detailed sandcastle sculpture resembling a stone fortress with multiple turrets,
    walls, and a bridge, situated on a sandy beach. The sculpture has seashells embedded in its base.
    To the left, a massive, translucent green ocean wave is curling over, about to crash directly onto
    the castle. The sky is cloudy and grey. In the background on the right, several people are standing
    on the shoreline.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The castle
    sculpture should be destroyed, appearing as a flattened mound of wet sand, scattered debris, or eroded
    ruins with no tall towers left standing. The large curling green wave should be gone, replaced by
    wet sand, sea foam, or shallow receding water on the beach surface. The background sky and distant
    people should remain consistent.
  rationale: The video prompt describes a forceful wave impact followed by a camera movement that looks
    away and returns. During the time the camera is pointed at the sky, the wave crashes onto the sculpture,
    destroying its structure due to the force of the water. When the camera returns to the original framing,
    the wave will have receded or dissipated, and the sculpture will be irreversibly damaged, flattened,
    or washed away. The state change is the transition from an intact structure to a destroyed one.
  questions:
  - id: castle_destroyed
    question: Is the castle sculpture significantly collapsed or flattened compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The structure should no longer be intact; towers should be fallen or eroded.
  - id: towers_gone
    question: Are the tall turrets and towers of the castle missing or ruined?
    answer_type: yes_no
    notes_for_judge: The vertical elements should be destroyed by the wave.
  - id: wave_gone
    question: Is the large curling green wave gone from the scene?
    answer_type: yes_no
    notes_for_judge: The wave should have crashed and receded; it should not be frozen in the air.
  - id: wet_sand_remains
    question: Is the area where the castle stood now wet, foamy, or covered in debris?
    answer_type: yes_no
    notes_for_judge: Evidence of the wave washing over the area.
  - id: structural_integrity_loss
    question: Has the sculpture lost its defined architectural shape?
    answer_type: yes_no
    notes_for_judge: It should look like a pile of sand or ruins, not a castle.
  - id: background_consistency_people
    question: Are the people in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency_sky
    question: Is the sky still cloudy?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
