evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a workshop table covered with a clear
    plastic sheet that has patterns of dried, off-white foam on it. In the center stands a vertical, rusty
    steel pipe section. A person's hand, wearing a grey and black work glove, holds a can of 'Great Stuff'
    expanding foam spray. The red straw nozzle of the can is positioned directly over the opening of the
    steel pipe. In the background, out of focus, there is a hammer, some wooden planks, and a window letting
    in natural light.
  init2final_edit_prompt: Edit the given image to show a large, puffy mass of yellow expanding foam rising
    out of and overflowing the top of the rusty steel pipe. The foam should appear as a chaotic, bubbly
    solid mass that has expanded significantly above the pipe's rim. Ensure the lighting is fully bright
    and natural, matching the original scene, with no darkness. Keep the rusty pipe intact and cylindrical.
    Maintain the position of the gloved hand, the can, and the background tools exactly as they are.
  rationale: The prompt describes dispensing expanding foam into a rigid steel pipe that cannot deform.
    During the period of darkness (occlusion), the foam continues to expand. Since the pipe walls are
    rigid and have high tensile strength, the foam cannot burst the pipe. Instead, it must follow the
    path of least resistance, which is upwards and out of the open top of the pipe. Therefore, the final
    frame must show the pipe intact but topped with a significant volume of expanded foam that has risen
    above the rim. The lighting returns to normal after the blackout.
