prompts:
  init_frame_edit_prompt: Edit the image to replace the paper cup with a rusty steel pipe section of the
    same diameter standing vertically on the plastic sheet.
  video_WM: The hand presses the trigger and expanding foam begins dispensing into the vertical steel
    pipe. The steel pipe has extremely high tensile strength and rigid walls that cannot deform. The foam
    expands rapidly, seeking the path of least resistance. Suddenly, the workshop lights cut out, plunging
    the entire scene into pitch black darkness. The darkness lasts for several seconds while the foam
    continues expanding inside the rigid pipe. The lights then flick back on, instantly illuminating the
    scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses the trigger and expanding foam begins dispensing into the vertical steel
    pipe. The steel pipe has extremely high tensile strength and rigid walls that cannot deform. The foam
    expands rapidly, seeking the path of least resistance. Suddenly, the workshop lights cut out, plunging
    the entire scene into pitch black darkness. The darkness lasts for several seconds while the foam
