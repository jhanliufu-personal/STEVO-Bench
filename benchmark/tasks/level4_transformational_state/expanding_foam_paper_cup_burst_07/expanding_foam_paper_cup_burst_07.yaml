id: expanding_foam_paper_cup_burst_07
level: 4
category: structural_transformation
tags: []
variant_of: expanding_foam_paper_cup_burst
variation_type: combined
variation_description: Steel pipe container (condition) with lights turning off (occlusion).
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Rigid steel pipe container.
  expected_outcome_change: Vertical overflow instead of burst
prompts:
  init_frame_edit_prompt: Edit the image to replace the paper cup with a rusty steel pipe section of the
    same diameter standing vertically on the plastic sheet.
  video_WM: The hand presses the trigger and expanding foam begins dispensing into the vertical steel
    pipe. The steel pipe has extremely high tensile strength and rigid walls that cannot deform. The foam
    expands rapidly, seeking the path of least resistance. Suddenly, the workshop lights cut out, plunging
    the entire scene into pitch black darkness. The darkness lasts for several seconds while the foam
    continues expanding inside the rigid pipe. The lights then flick back on, instantly illuminating the
    scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses the trigger and expanding foam begins dispensing into the vertical steel
    pipe. The steel pipe has extremely high tensile strength and rigid walls that cannot deform. The foam
    expands rapidly, seeking the path of least resistance. Suddenly, the workshop lights cut out, plunging
    the entire scene into pitch black darkness. The darkness lasts for several seconds while the foam
    continues expanding inside the rigid pipe. The lights then flick back on, instantly illuminating the
    scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a workshop table covered with a clear
    plastic sheet that has patterns of dried, off-white foam on it. In the center stands a vertical, rusty
    steel pipe section. A person's hand, wearing a grey and black work glove, holds a can of 'Great Stuff'
    expanding foam spray. The red straw nozzle of the can is positioned directly over the opening of the
    steel pipe. In the background, out of focus, there is a hammer, some wooden planks, and a window letting
    in natural light.
  init2final_edit_prompt: Edit the given image to show a large, puffy mass of yellow expanding foam rising
    out of and overflowing the top of the rusty steel pipe. The foam should appear as a chaotic, bubbly
    solid mass that has expanded significantly above the pipe's rim. Ensure the lighting is fully bright
    and natural, matching the original scene, with no darkness. Keep the rusty pipe intact and cylindrical.
    Maintain the position of the gloved hand, the can, and the background tools exactly as they are.
  rationale: The prompt describes dispensing expanding foam into a rigid steel pipe that cannot deform.
    During the period of darkness (occlusion), the foam continues to expand. Since the pipe walls are
    rigid and have high tensile strength, the foam cannot burst the pipe. Instead, it must follow the
    path of least resistance, which is upwards and out of the open top of the pipe. Therefore, the final
    frame must show the pipe intact but topped with a significant volume of expanded foam that has risen
    above the rim. The lighting returns to normal after the blackout.
  questions:
  - id: foam_presence
    question: Is there yellow expanding foam visible rising out of the top of the pipe?
    answer_type: yes_no
    notes_for_judge: Check for the presence of new foam material protruding from the pipe.
  - id: foam_expansion_vertical
    question: Does the foam extend vertically above the upper rim of the rusty pipe?
    answer_type: yes_no
    notes_for_judge: The foam should have expanded upwards, breaching the top boundary of the pipe.
  - id: foam_volume_increase
    question: Is the volume of visible foam significantly greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the amount of foam; initially there was none or very little in the pipe,
      now there should be a large mass.
  - id: pipe_integrity
    question: Is the rusty steel pipe still structurally intact?
    answer_type: yes_no
    notes_for_judge: The pipe must not be burst, cracked, or fragmented. It should look like the same
      solid cylinder.
  - id: pipe_shape_conservation
    question: Does the pipe retain its original cylindrical shape without deformation?
    answer_type: yes_no
    notes_for_judge: The prompt explicitly states the walls cannot deform.
  - id: lighting_restored
    question: Is the scene fully illuminated?
    answer_type: yes_no
    notes_for_judge: The lights flicked back on, so the image should not be dark.
  - id: background_consistency
    question: Are the hammer and wooden planks in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for background objects.
