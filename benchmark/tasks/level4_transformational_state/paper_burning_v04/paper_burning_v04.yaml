id: paper_burning_v04
level: 4
category: transformational_state_change
tags: []
variant_of: paper_burning
variation_type: dynamic_condition
variation_description: The open flame is removed, leaving only smoldering ash.
changes:
  occlusion_method: null
  dynamic_conditions: Paper is already extinguished/smoldering, not actively flaming.
  expected_outcome_change: The paper will not be consumed further; it will remain as charred debris rather
    than turning completely to ash.
prompts:
  init_frame_edit_prompt: Edit the image to remove the bright orange flames. The paper should look charred,
    black, and burnt, with wisps of grey smoke rising from it, but no active fire.
  video_WM: Single continuous take, no cuts or zoom. Camera starts centered on the plate and smoldering
    charred paper. Then the camera smoothly moves to the right at constant speed until the plate leaves
    the frame to the left and become completely invisible. The camera continues moving right across the
    room for several seconds. Then the camera moves left at the same speed back to the original viewpoint,
    bringing the plate back into view naturally. Lighting and objects remain consistent and realistic.
  camera_WM: A piece of charred, smoldering paper sits on a plate. Lighting and objects remain consistent
    and realistic. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a rustic wooden table with a ceramic plate holding a rolled
    piece of paper. The paper is actively smoldering, with significant charring, blackened edges, and
    white smoke rising from it. The paper retains a rough cylindrical shape but looks fragile. A window
    sill and blurry outdoor view are visible in the background.
  init2final_edit_prompt: Edit the given image to show the paper in a more advanced state of burning and
    decomposition. The paper roll should appear more collapsed, flattened, or disintegrated than in the
    original image. Increase the amount of visible black and grey ash on the plate and around the paper.
    The texture of the paper should look more brittle and consumed, with expanded charred areas.
  rationale: The video depicts a continuous smoldering process. When the camera pans away and returns
    after several seconds, the physical process of burning must have progressed. This is an irreversible
    transformation; the paper cannot un-burn or remain in a frozen state while unobserved. The final frame
    must show the cumulative effect of the fire during the occlusion, manifested as increased structural
    degradation, more ash accumulation, and further collapse of the paper roll.
