evaluation:
  init_frame_description: A close-up, eye-level shot of a metal box grater standing on a scratched wooden
    cutting board. A hand enters from the right, holding a thick orange carrot horizontally and pressing
    its tip against the side of the grater with large holes. A small amount of grated carrot shreds is
    already visible on the board at the base of the grater. The background features a blurred window with
    a white frame.
  init2final_edit_prompt: Edit the given image to show the carrot significantly reduced in length, appearing
    shorter with a flattened or rough tip where it contacts the metal surface. Increase the quantity of
    orange carrot shreds on the wooden cutting board at the base of the grater, creating a larger and
    more spread-out pile of debris. Position the hand closer to the face of the grater to account for
    the missing length of the carrot. Maintain the original lighting, background, and the position of
    the metal grater.
  rationale: The video prompt describes a continuous grating action that persists through a period of
    darkness. Grating is an irreversible physical transformation that reduces the mass of the object (the
    carrot) and produces debris (shreds). Therefore, the final state must show the carrot physically shorter
    due to material removal and a corresponding increase in the pile of grated material on the cutting
    board. The hand holding the carrot must have moved closer to the grater as the object shortened.
