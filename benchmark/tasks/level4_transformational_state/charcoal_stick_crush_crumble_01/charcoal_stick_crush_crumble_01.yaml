prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. Suddenly, the studio lights turn off completely, plunging the scene into absolute
    pitch black darkness where nothing is visible. The squeezing action continues in the dark for several
    seconds. Then the lights turn back on, revealing the scene again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. Suddenly, the studio lights turn off completely, plunging the scene into absolute
