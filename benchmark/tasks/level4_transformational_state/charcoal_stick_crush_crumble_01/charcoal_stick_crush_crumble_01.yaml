evaluation:
  init_frame_description: A close-up view of a dirty hand holding a thick, cylindrical stick of black
    artist's charcoal. The charcoal has a highly porous, textured surface. The hand is stained with black
    dust, particularly around the fingertips and palm. The background is a blurred studio workspace featuring
    a wooden table, sketches on paper, and other drawing implements.
  init2final_edit_prompt: Edit the given image to show the charcoal stick crushed and broken within the
    hand. The single cylindrical form should be fractured into smaller chunks, shards, and dust. The fingers
    should be clenched tighter or curled further inward, reflecting the collapse of the object's structure.
    Add visible charcoal debris and dust on the fingers and palm to indicate the material has crumbled.
  rationale: The prompt describes the application of crushing force to a brittle material (charcoal).
    While the specific moment of fracture is occluded by darkness, the continued squeezing ensures that
    the material will fail structurally. Upon the return of the lights, the charcoal must be broken, crumbled,
    or snapped, representing an irreversible transformation. The hand's posture should reflect the loss
    of the object's volume (closing tighter), and the material degradation should be evidenced by fragments
    and dust.
