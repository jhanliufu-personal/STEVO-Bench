evaluation:
  init_frame_description: A close-up, eye-level shot of a workbench covered in clear plastic sheeting
    with dried foam residue. A gloved hand (wearing a grey and black work glove) holds a can of 'Great
    Stuff' polyurethane foam on the right side. The red dispensing tube from the can is inserted into
    a small, empty brown paper cup sitting in the center of the frame. In the background, there is a wooden
    structure, a hammer, and other tools.
  init2final_edit_prompt: Edit the given image to show the paper cup completely filled and overflowing
    with a large, bulbous mass of yellowish expanded polyurethane foam. The foam should appear to have
    expanded significantly in volume, rising well above the rim of the cup and spilling down the sides
    onto the plastic sheeting. The structure of the paper cup should appear distorted, torn, or burst
    open due to the internal pressure of the expanding foam. The lighting should be bright and identical
    to the original scene.
  rationale: The video prompt describes the dispensing of expanding foam into a confined paper cup, followed
    by a period of darkness. During the occlusion, the chemical reaction causes the foam to expand 30-50
    times its original volume. Given the limited structural integrity of a paper cup, the expanding mass
    will fill the cup, overflow, and exert enough outward pressure to tear or burst the paper walls. When
    the lights return, the scene must show this irreversible structural damage and the massive increase
    in foam volume.
