id: expanding_foam_paper_cup_burst_02
level: 4
category: structural_transformation
tags: []
variant_of: expanding_foam_paper_cup_burst
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to the lights turning off.
changes:
  occlusion_method: The workshop lights turn off, plunging the scene into darkness.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand presses the trigger and expanding foam begins dispensing into the paper cup. Polyurethane
    foam undergoes rapid chemical expansion as it cures, increasing in volume by 30-50 times within seconds.
    The foam expands in all directions exerting outward pressure on any containing walls. The paper cup
    has limited structural strength and a tensile tear threshold. The foam continues expanding in the
    confined space. Suddenly, the workshop lights cut out, plunging the entire scene into pitch black
    darkness where nothing is visible. The darkness lasts for several seconds while the foam continues
    expanding unseen. The lights then flick back on, instantly illuminating the scene again. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The hand presses the trigger and expanding foam begins dispensing into the paper cup. Polyurethane
    foam undergoes rapid chemical expansion as it cures, increasing in volume by 30-50 times within seconds.
    The foam expands in all directions exerting outward pressure on any containing walls. The paper cup
    has limited structural strength and a tensile tear threshold. The foam continues expanding in the
    confined space. Suddenly, the workshop lights cut out, plunging the entire scene into pitch black
    darkness where nothing is visible. The darkness lasts for several seconds while the foam continues
    expanding unseen. The lights then flick back on, instantly illuminating the scene again. No zoom,
    no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a workbench covered in clear plastic sheeting
    with dried foam residue. A gloved hand (wearing a grey and black work glove) holds a can of 'Great
    Stuff' polyurethane foam on the right side. The red dispensing tube from the can is inserted into
    a small, empty brown paper cup sitting in the center of the frame. In the background, there is a wooden
    structure, a hammer, and other tools.
  init2final_edit_prompt: Edit the given image to show the paper cup completely filled and overflowing
    with a large, bulbous mass of yellowish expanded polyurethane foam. The foam should appear to have
    expanded significantly in volume, rising well above the rim of the cup and spilling down the sides
    onto the plastic sheeting. The structure of the paper cup should appear distorted, torn, or burst
    open due to the internal pressure of the expanding foam. The lighting should be bright and identical
    to the original scene.
  rationale: The video prompt describes the dispensing of expanding foam into a confined paper cup, followed
    by a period of darkness. During the occlusion, the chemical reaction causes the foam to expand 30-50
    times its original volume. Given the limited structural integrity of a paper cup, the expanding mass
    will fill the cup, overflow, and exert enough outward pressure to tear or burst the paper walls. When
    the lights return, the scene must show this irreversible structural damage and the massive increase
    in foam volume.
  questions:
  - id: foam_presence
    question: Is there a visible mass of expanded foam inside or coming out of the cup?
    answer_type: yes_no
    notes_for_judge: Check for the presence of the yellowish foam material described in the prompt.
  - id: foam_volume_expansion
    question: Has the volume of the material in the cup increased significantly compared to the initial
      empty state?
    answer_type: yes_no
    notes_for_judge: The foam should be voluminous, occupying much more space than the initial empty cup.
  - id: cup_overflow
    question: Is the foam spilling over the top rim or sides of the paper cup?
    answer_type: yes_no
    notes_for_judge: The foam should not be contained solely within the cup; it should be overflowing.
  - id: structural_damage
    question: Does the paper cup appear torn, split, or burst open?
    answer_type: yes_no
    notes_for_judge: Look for rips in the paper or the cup losing its cylindrical shape due to internal
      pressure.
  - id: cup_distortion
    question: Is the shape of the cup distorted or bulging outward compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The cup should no longer be a perfect cylinder.
  - id: foam_texture
    question: Does the new material have a bubbly or irregular texture consistent with expanded foam?
    answer_type: yes_no
    notes_for_judge: The generated substance should look like foam, not liquid or solid block.
  - id: glove_consistency
    question: Is the grey and black work glove still visible holding the can?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the wooden elements and tools in the background still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
