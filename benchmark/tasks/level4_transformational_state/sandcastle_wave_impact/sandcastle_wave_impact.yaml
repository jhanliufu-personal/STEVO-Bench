id: sandcastle_wave_impact
level: 4
category: structural_transformation
transformation_type: structural_collapse
prompts:
  image_gen_prompt: A detailed sandcastle sits on a beach. A large ocean wave is cresting and just about
    to crash directly onto the castle.
  video_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. The water
    engulfs the castle. The camera rotates right until the wave impact site completely exits the view,
    then rotates toward the left smoothly at the same rate until the sandcastle location is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ocean wave crashes directly onto the sandcastle. The impact force is applied to the structure.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A detailed sandcastle with multiple towers, turrets, a bridge, and shell decorations
    sits on the wet sand of a beach. A massive, green ocean wave is curling over and is about to crash
    directly onto the sandcastle from the left side. The background shows a cloudy sky and people standing
    on the beach in the distance.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. Replace the
    detailed sandcastle structure with a flattened, shapeless mound of wet sand and scattered shells,
    indicating structural collapse. Remove the large curling wave and replace it with turbulent whitewater,
    foam, or receding water on the ocean surface, showing that the wave has already crashed and dissipated.
  rationale: The prompt describes a forceful wave impact on a fragile sandcastle. The camera rotation
    away and back introduces a time delay, ensuring the viewer sees the result of the action rather than
    the action itself. Physically, a large wave crashing on a sandcastle causes irreversible destruction,
    flattening the structure and washing away details. The wave itself is a transient fluid state; the
    looming curl must be gone, replaced by the chaotic aftermath of the crash (foam/whitewater).
