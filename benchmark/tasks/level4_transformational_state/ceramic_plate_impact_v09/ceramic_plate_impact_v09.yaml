id: ceramic_plate_impact_v09
level: 4
category: structural_transformation
tags: []
variant_of: ceramic_plate_impact
variation_type: combined
variation_description: Paper plate (condition) + Smoke fill (occlusion).
changes:
  occlusion_method: Thick smoke fills frame.
  dynamic_conditions: Plate is paper.
  expected_outcome_change: Plate crumples, no shatter.
prompts:
  init_frame_edit_prompt: Edit the image to change the ceramic plate into a flimsy white disposable paper
    plate.
  video_WM: The heavy steel hammer swings down forcefully toward the paper plate. Upon impact, thick opaque
    smoke instantly fills the frame, obscuring everything. The smoke dissipates over several seconds until
    the scene is visible again. No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy steel hammer swings down forcefully toward the paper plate. Upon impact, thick
    opaque smoke instantly fills the frame, obscuring everything. The smoke dissipates over several seconds
    until the scene is visible again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A high-angle shot showing a white disposable paper plate resting on a cracked
    concrete floor. A heavy metal sledgehammer head is positioned in the air above the plate, poised to
    strike. A window frame is visible in the background.
  init2final_edit_prompt: Edit the given image to show the aftermath of the hammer striking the plate.
    The paper plate should appear crushed, flattened, crumpled, or torn, losing its original pristine
    shape. The hammer head should be positioned lower, resting on the damaged plate or the concrete floor.
    Ensure the scene is visible and clear of the thick smoke, focusing on the structural damage to the
    plate.
  rationale: The prompt describes a forceful impact where a hammer strikes a paper plate. This action
    causes irreversible structural deformation (crushing, flattening, or tearing) to the plate. The thick
    smoke acts as a temporary occluder during the transformation but dissipates by the end of the video.
    The final state must show the permanent damage to the plate and the hammer in a resting position after
    the swing.
