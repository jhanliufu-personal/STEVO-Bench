  dynamic_conditions: Hand holds bottle gently.
  expected_outcome_change: No deformation
prompts:
  init_frame_edit_prompt: Edit the image to show the hand gripping the bottle very loosely, with fingers
    relaxed.
  video_WM: The hand rests gently around the plastic bottle. The fingers are relaxed and apply no compressive
    force, merely holding the bottle in place. The plastic structure remains under no stress. Suddenly,
    the lights in the room turn off, resulting in total darkness. The hand remains in position holding
    the bottle gently in the dark. After several seconds, the lights turn back on, restoring full visibility.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The hand rests gently around the plastic bottle. The fingers are relaxed and apply no compressive
    force, merely holding the bottle in place. The plastic structure remains under no stress. Suddenly,
    the lights in the room turn off, resulting in total darkness. The hand remains in position holding
    the bottle gently in the dark. After several seconds, the lights turn back on, restoring full visibility.
    No zoom, no cut, no scene change. STOP.
