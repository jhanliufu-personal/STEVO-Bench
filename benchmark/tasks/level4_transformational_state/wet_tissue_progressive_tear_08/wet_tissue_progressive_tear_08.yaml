evaluation:
  init_frame_description: A close-up, eye-level shot of two hands holding a wet, white, loose-weave fabric
    (resembling gauze or cheesecloth) over a stainless steel kitchen sink. The cloth is sagging in a U-shape
    between the hands, and water is dripping from the bottom of the curve. A chrome faucet is visible
    in the background.
  init2final_edit_prompt: Edit the image to show the hands pulling the white cloth outward with strong
    force. The cloth should appear pulled taut and straight horizontally between the hands, exhibiting
    high tension. Crucially, the cloth must remain structurally intact and connected, with no tears, rips,
    or fraying. The weave pattern should appear stretched but unbroken. Maintain the background sink and
    faucet exactly as they are.
  rationale: The text prompt explicitly identifies the object as a 'woven cotton washcloth' and states
    that its 'interlocking weave prevents tearing under manual force,' contrasting it with paper. Despite
    the visual appearance of the cloth (which resembles gauze) and the 'wet tissue' task ID, the physical
    properties defined in the prompt text are the ground truth. Therefore, the simulation must show the
    cloth resisting the pulling force. The final state should depict the cloth under high tension (taut
    and straight) but structurally intact, having undergone elastic deformation without fracturing.
