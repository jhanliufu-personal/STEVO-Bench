prompts:
  init_frame_edit_prompt: Edit the image to change the paper tissue into a thick, woven cotton washcloth.
  video_WM: The hands begin applying outward pulling tension to the wet washcloth. Woven cotton fabric
    has extremely high tensile strength compared to paper fibers. Even when wet, the interlocking weave
    prevents tearing under manual force. The hands continue applying strong pulling force. Suddenly, the
    bathroom lights turn off, plunging the scene into total darkness. The sounds of effort continue in
    the dark. After several seconds, the lights turn back on, revealing the scene. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The hands begin applying outward pulling tension to the wet washcloth. Woven cotton fabric
    has extremely high tensile strength compared to paper fibers. Even when wet, the interlocking weave
    prevents tearing under manual force. The hands continue applying strong pulling force. Suddenly, the
    bathroom lights turn off, plunging the scene into total darkness. The sounds of effort continue in
    the dark. After several seconds, the lights turn back on. STOP.
