  lens.
changes:
  occlusion_method: A large sheet of plywood slides into view, blocking the scene.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Hot air from the heat gun flows toward the plastic cup. The cup is made from polystyrene plastic
    which has a glass transition temperature around 212°F. When thermoplastic polymers are heated above
    their glass transition point, the polymer chains gain mobility and the material loses structural rigidity.
    The material is subject to gravitational forces and internal stresses. Thermoplastics retain the shape
    they have when cooled back below glass transition temperature. The heat gun continues directing hot
    air at the cup. Suddenly, a large sheet of plywood slides from the left, completely blocking the view
    of the cup and heat gun. The plywood remains in place for several seconds while the heat continues
    being applied behind it. Then the plywood slides back to the left, revealing the scene again. No zoom,
    no cut, no scene change. STOP.
  camera_WM: Hot air from the heat gun flows toward the plastic cup. The cup is made from polystyrene
    plastic which has a glass transition temperature around 212°F. When thermoplastic polymers are heated
    above their glass transition point, the polymer chains gain mobility and the material loses structural
    rigidity. The material is subject to gravitational forces and internal stresses. Thermoplastics retain
    the shape they have when cooled back below glass transition temperature. The heat gun continues directing
    hot air at the cup. Suddenly, a large sheet of plywood slides from the left, completely blocking the
    view of the cup and heat gun. The plywood remains in place for several seconds while the heat continues
    being applied behind it. Then the plywood slides back to the left, revealing the scene again. No zoom,
    no cut, no scene change. STOP.
