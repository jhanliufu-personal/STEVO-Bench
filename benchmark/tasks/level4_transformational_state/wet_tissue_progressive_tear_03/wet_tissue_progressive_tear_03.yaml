evaluation:
  init_frame_description: A close-up view of two hands holding a saturated, white wet tissue paper over
    a stainless steel kitchen sink. The tissue is sagging under its own weight and water content, appearing
    translucent and delicate. A chrome faucet is visible in the background.
  init2final_edit_prompt: Edit the given image so that the wet tissue paper is torn or ripped. Show a
    visible tear, hole, or complete separation in the tissue material between the hands, with ragged,
    fibrous edges characteristic of wet paper. The hands should be holding the damaged or separated pieces
    of the tissue. Keep the background sink and faucet unchanged.
  rationale: The video prompt describes hands applying outward tension to a wet tissue, which has very
    low tensile strength. As the pulling force continues, the saturated fibers will inevitably separate,
    leading to a tear. The occlusion event (person walking by) hides the intermediate process, but the
    physical action persists. Therefore, in the final frame, the tissue must exhibit irreversible structural
    damage, such as a rip or separation, resulting from the applied tension.
