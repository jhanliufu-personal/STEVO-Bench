id: projectile_window_break_04
level: 4
category: structural_transformation
tags: []
variant_of: projectile_window_break
variation_type: dynamic_condition
variation_description: Projectile changed from metal BB to soft foam ball.
changes:
  occlusion_method: null
  dynamic_conditions: Projectile is a soft foam ball instead of metal.
  expected_outcome_change: The ball bounces off the glass; the glass remains intact.
prompts:
  init_frame_edit_prompt: Edit the image to replace the metal bullet with a soft, orange foam toy ball.
  video_WM: The soft orange foam ball strikes the center of the glass pane. The camera rotates right until
    the window frame completely exits the view, then rotates toward the left smoothly at the same rate
    until the window frame is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The soft orange foam ball strikes the center of the glass pane. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A view from inside a room looking out through a wooden window frame at a green
    garden and a rustic wooden house. In the center of the view, a soft orange foam ball is suspended
    in mid-air near the glass pane, trailing a cloud of orange dust or particles to its right, indicating
    motion towards the glass.
  init2final_edit_prompt: Edit the given image to show the window glass pane cracked and damaged in the
    center where the ball was. Remove the orange ball and the orange dust trail completely. Ensure the
    wooden window frame and the outdoor scenery of the house and garden remain visible and unchanged in
    position, but seen through the now-broken glass.
  rationale: The video prompt describes a projectile striking the glass. Given the Level 4 focus on irreversible
    transformations and the task ID, the impact causes the glass to crack or shatter. The camera rotation
    (panning the window out of view and then back) implies a passage of time sufficient for the ball to
    fall away due to gravity or bounce off, and for the dust trail to dissipate. Consequently, the final
    frame must show the permanent structural damage to the window without the transient objects (ball
    and dust) suspended in mid-air.
