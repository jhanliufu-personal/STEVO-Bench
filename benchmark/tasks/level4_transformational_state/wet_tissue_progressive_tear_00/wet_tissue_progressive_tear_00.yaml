id: wet_tissue_progressive_tear_00
level: 4
category: structural_transformation
tags: []
variant_of: wet_tissue_progressive_tear
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When
    tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material
    loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural
    integrity is severely compromised by water infiltration between fibers. The hands continue applying
    slow, steady pulling force. Camera remains stationary throughout. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When
    tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material
    loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural
    integrity is severely compromised by water infiltration between fibers. The hands continue applying
    slow, steady pulling force. Camera remains stationary throughout. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A pair of hands holding a rectangular sheet of white, wet tissue paper over
    a stainless steel kitchen sink. The tissue is saturated, translucent, and sagging in the middle, with
    a water droplet falling from the lowest point. A faucet is visible in the background.
  init2final_edit_prompt: Edit the given image so that the wet tissue paper is torn in the center. Show
    a distinct, ragged vertical tear or large hole in the middle of the tissue sheet where the tension
    was applied. The hands should be holding the sides of the now-damaged tissue, and the edges of the
    tear should appear fibrous and wet. Maintain the background sink and faucet exactly as they are.
  rationale: The prompt describes applying outward tension to a wet tissue, which has significantly reduced
    tensile strength compared to dry tissue. Under this tension, the cellulose bonds fail, leading to
    an irreversible structural break. The rollout represents the progression of this force, resulting
    in the tissue tearing, likely down the middle where the stress is concentrated. The final state must
    show visible tearing or separation of the material.
  questions:
  - id: tear_existence
    question: Is the tissue paper torn or ripped in the final frame?
    answer_type: yes_no
    notes_for_judge: Look for a visible break, hole, or separation in the material that was not there
      initially.
  - id: structural_integrity
    question: Has the structural continuity of the tissue sheet been broken?
    answer_type: yes_no
    notes_for_judge: The tissue should no longer be a single pristine sheet; it should show damage.
  - id: gap_visibility
    question: Is there a visible gap or hole in the tissue that reveals the background behind it?
    answer_type: yes_no
    notes_for_judge: The tear should likely expose the sink or space behind the tissue.
  - id: ragged_edges
    question: Do the edges of the damaged area appear ragged or fibrous?
    answer_type: yes_no
    notes_for_judge: Torn wet tissue typically has uneven, fibrous edges.
  - id: material_separation
    question: Are the parts of the tissue held by the left and right hands less connected than in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: They should be separated by a tear or hole.
  - id: damage_progression
    question: Is the tissue more damaged in the final frame than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the state of the material; it must show progression of damage.
  - id: invariant_background
    question: Is the kitchen faucet still visible in the background?
    answer_type: yes_no
    notes_for_judge: The background environment should remain stable.
  - id: invariant_hands
    question: Are the hands still holding the tissue (or the torn pieces of it)?
    answer_type: yes_no
    notes_for_judge: The hands should not disappear or let go completely.
