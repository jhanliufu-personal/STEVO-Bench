evaluation:
  init_frame_description: A pair of hands holding a rectangular sheet of white, wet tissue paper over
    a stainless steel kitchen sink. The tissue is saturated, translucent, and sagging in the middle, with
    a water droplet falling from the lowest point. A faucet is visible in the background.
  init2final_edit_prompt: Edit the given image so that the wet tissue paper is torn in the center. Show
    a distinct, ragged vertical tear or large hole in the middle of the tissue sheet where the tension
    was applied. The hands should be holding the sides of the now-damaged tissue, and the edges of the
    tear should appear fibrous and wet. Maintain the background sink and faucet exactly as they are.
  rationale: The prompt describes applying outward tension to a wet tissue, which has significantly reduced
    tensile strength compared to dry tissue. Under this tension, the cellulose bonds fail, leading to
    an irreversible structural break. The rollout represents the progression of this force, resulting
    in the tissue tearing, likely down the middle where the stress is concentrated. The final state must
    show visible tearing or separation of the material.
