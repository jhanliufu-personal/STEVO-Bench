evaluation:
  init_frame_description: A close-up view of a metal box grater standing on a wooden cutting board. A
    person's hand is holding a rectangular block of yellow cheddar cheese against the side of the grater.
    A pile of shredded cheese is already present at the base of the grater. A window is visible in the
    background.
  init2final_edit_prompt: Edit the given image to show the block of cheese significantly reduced in size,
    appearing smaller or shorter as if it has been grated down. Increase the volume and height of the
    pile of shredded cheese at the base of the grater, adding more shreds to the existing mound. Ensure
    the hand is holding the now smaller remnant of the cheese block. Maintain the position of the grater,
    the wooden surface, and the background.
  rationale: The prompt describes a grating action that continues for several seconds, even while the
    view is occluded by a board. Grating is an irreversible process that transforms the solid block into
    shreds. Therefore, the final state must show a conservation of mass where the solid block has lost
    volume and the pile of shreds has gained volume. The occlusion is temporary and removed by the end,
    restoring the original view.
