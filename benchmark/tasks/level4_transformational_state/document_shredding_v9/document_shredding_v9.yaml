id: document_shredding_v9
level: 4
category: structural_transformation
tags: []
variant_of: document_shredding
variation_type: combined
variation_description: Feeding a stack too thick for the machine, occluded by camera zoom out.
changes:
  occlusion_method: Camera zoom out.
  dynamic_conditions: Object is a very thick stack of 50 papers (exceeds capacity).
  expected_outcome_change: Machine jams immediately or stops feeding.
prompts:
  init_frame_edit_prompt: Edit the image to replace the single sheet of paper with a very thick stack
    of papers (at least 2 inches thick) being held over the slot.
  video_WM: A thick ream of paper, exceeding the machine's capacity, is forced into the shredder slot.
    The motor strains. The camera zooms out rapidly until the office scene is small and distant, then
    zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: A thick ream of paper, exceeding the machine's capacity, is forced into the shredder slot.
    The motor strains. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a transparent-top paper shredder in
    an office setting. A hand is holding a very thick stack of white paper, positioned directly above
    the shredder's feed slot but not yet fully inserted. The shredder's metal cutting blades are visible
    through the clear plastic housing. The waste bin below contains a pile of previously shredded white
    paper strips. In the background, there is a blurred office environment with desks, monitors, and people.
  init2final_edit_prompt: Edit the given image to show the thick stack of paper physically pushed and
    jammed into the shredder slot. The bottom of the paper stack should appear crinkled, bent, or unevenly
    torn where it meets the cutting blades, indicating it has been forced into the mechanism. The overall
    height of the stack extending above the machine should be lower than in the original image. The paper
    should look stuck or engaged with the blades rather than hovering neatly above them.
  rationale: The prompt describes a thick ream of paper being forced into a shredder that cannot handle
    the capacity, causing the motor to strain. Physically, this results in the paper jamming, crinkling,
    and deforming at the entry point rather than shredding smoothly. The camera motion (zoom out and back
    in) serves as a passage of time during which this forcing action occurs. Upon returning to the original
    framing, the paper stack should be lower (pushed in) and show visible structural damage (crumpling/tearing)
    at the interface with the blades, reflecting the irreversible physical deformation caused by the jam.
  questions:
  - id: paper_contact
    question: Is the bottom of the paper stack now touching or inserted into the shredder slot?
    answer_type: yes_no
    notes_for_judge: The paper should no longer be hovering; it must be in contact with the mechanism.
  - id: paper_deformation
    question: Does the bottom of the paper stack show signs of crinkling, bending, or damage?
    answer_type: yes_no
    notes_for_judge: Look for structural deformation at the point of contact with the blades.
  - id: stack_height
    question: Is the top of the paper stack lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Since the paper has been forced in, the visible portion above the machine should
      be shorter.
  - id: jam_evidence
    question: Does the paper appear to be stuck or jammed in the machine rather than passing through smoothly?
    answer_type: yes_no
    notes_for_judge: The prompt implies exceeding capacity; the paper should look bunched or stuck.
  - id: integrity_loss
    question: Has the neat rectangular shape of the paper stack been compromised at the bottom edge?
    answer_type: yes_no
    notes_for_judge: The bottom edge should no longer be a straight, clean line.
  - id: shredder_presence
    question: Is the shredder machine still visible in the frame?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: hand_presence
    question: Is the hand or arm holding the paper still visible?
    answer_type: yes_no
    notes_for_judge: Consistency check; the prompt does not imply the person left.
