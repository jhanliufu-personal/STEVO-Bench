id: photograph_tearing_04
level: 4
category: structural_transformation
tags: []
variant_of: photograph_tearing
variation_type: dynamic_condition
variation_description: Force direction changed from pulling (tearing) to pushing (crumpling).
changes:
  occlusion_method: null
  dynamic_conditions: Hands push inward to compress the paper instead of pulling outward.
  expected_outcome_change: The photograph is crumpled/folded instead of torn.
prompts:
  init_frame_edit_prompt: Edit the image so the hands are gripping the side edges of the photograph, positioned
    to push inward rather than pull outward.
  video_WM: The two hands push inward from the sides against the photograph. Compressive force is applied
    to the paper material. The camera rotates right until the hands and photo completely exit the view,
    then rotates toward the left smoothly at the same rate until the space between the hands is back in
    the center of view. No zoom, no cut, no scene change. The camera returns to the original viewpoint.
    STOP.
  camera_WM: The two hands push inward from the sides against the photograph. Compressive force is applied
    to the paper material. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up shot of two hands holding a glossy photograph of a sunset beach scene.
    The left hand, wearing a silver ring on the ring finger, holds the left edge, and the right hand holds
    the right edge. The photograph is held horizontally and is slightly curved but largely smooth. The
    background is dark and out of focus.
  init2final_edit_prompt: Edit the given image to show the photograph significantly crumpled, buckled,
    or folded in the center. The two hands should be positioned closer together, compressing the photo
    between them. The glossy surface of the paper should show distinct creases, ridges, or bends indicating
    structural deformation from the compressive force.
  rationale: The video prompt describes the hands pushing inward, applying compressive force to the photograph.
    Physically, this action causes the paper to buckle, fold, or crumple (irreversible structural change).
    The camera pans away and then returns to the original viewpoint. Therefore, in the final frame, the
    hands must be closer together than in the initial frame, and the photograph must exhibit visible deformation
    such as creases or a large buckle, reflecting the force applied during the occlusion.
  questions:
  - id: deformation_presence
    question: Does the photograph show visible buckling, creasing, or crumpling that was not present initially?
    answer_type: yes_no
    notes_for_judge: Look for structural damage to the paper surface like folds or bends.
  - id: hands_proximity
    question: Are the two hands closer to each other than they were in the initial frame?
    answer_type: yes_no
    notes_for_judge: The action was pushing inward, so the distance between hands must decrease.
  - id: structural_integrity
    question: Has the smooth surface of the photograph been disrupted by folds or bends?
    answer_type: yes_no
    notes_for_judge: The initial photo was smooth; the final should be deformed.
  - id: paper_width
    question: Is the visible horizontal width of the photograph shorter due to bending or folding?
    answer_type: yes_no
    notes_for_judge: Buckling reduces the projected width.
  - id: irreversible_change
    question: Does the object appear to have undergone irreversible structural deformation?
    answer_type: yes_no
    notes_for_judge: Paper creasing is irreversible.
  - id: ring_consistency
    question: Is the silver ring still visible on the left hand?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: content_consistency
    question: Is the sunset scene on the photograph still recognizable despite the deformation?
    answer_type: yes_no
    notes_for_judge: The content of the photo should not change, only its shape.
