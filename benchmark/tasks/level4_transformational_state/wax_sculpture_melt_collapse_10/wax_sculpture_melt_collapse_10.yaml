id: wax_sculpture_melt_collapse_10
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: combined
variation_description: Cooling fan instead of heat gun, occlusion by steam/fog.
changes:
  occlusion_method: Thick steam fills the room.
  dynamic_conditions: Heat gun replaced by electric cooling fan.
  expected_outcome_change: The wax bird remains solid (or cools down).
prompts:
  init_frame_edit_prompt: Edit the image to replace the heat gun with a small electric desk fan facing
    the bird.
  video_WM: An electric fan blows cool air onto the wax bird. Suddenly, thick steam fills the room, completely
    obscuring the view of the workbench. The steam dissipates, revealing the scene again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: An electric fan blows cool air onto the wax bird. Suddenly, thick steam fills the room, completely
    obscuring the view of the workbench. The steam dissipates, revealing the scene again. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a workbench featuring an amber-colored wax sculpture
    of a bird standing on a square metal plate. The bird has detailed feather textures, a beak, and eyes,
    with small puddles of melted wax already visible at its feet. To the left, the wire grille of an electric
    fan is visible in the foreground, angled towards the bird. The background is slightly blurred, showing
    workshop tools such as a hammer, pliers, and a wooden box on a shelf.
  init2final_edit_prompt: Edit the given image to show the wax bird in a significantly melted and deformed
    state. The bird's posture should be slumped and compressed downwards, losing its original upright
    height. The fine details of the feathers and face should be smoothed out and indistinct, with a glossy,
    softened texture. The wax puddles at the base should be expanded, spreading further across the metal
    plate. Keep the electric fan, background tools, and workbench environment unchanged.
  rationale: The video prompt introduces 'thick steam' filling the room. While the fan blows cool air,
    the presence of thick steam implies a high-temperature environment (100°C+) and high humidity that
    overwhelms the local cooling effect. This thermal shock causes the wax bird to undergo irreversible
    structural changes, including melting, slumping, and loss of surface detail. The occlusion by the
    steam covers the time duration required for this transformation to occur.
  questions:
  - id: melt_slump
    question: Is the wax bird's posture more slumped or compressed than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for a reduction in height or a loss of upright structural integrity.
  - id: detail_loss
    question: Are the feather details on the bird's body smoother and less distinct?
    answer_type: yes_no
    notes_for_judge: The sharp texture of the feathers should be smoothed out by melting.
  - id: puddle_expansion
    question: Has the area of melted wax at the base of the bird expanded?
    answer_type: yes_no
    notes_for_judge: Compare the size of the wax pool on the metal plate.
  - id: beak_definition
    question: Is the bird's beak less sharp and defined compared to the start?
    answer_type: yes_no
    notes_for_judge: The beak should be blunted or deformed.
  - id: structural_integrity
    question: Does the bird appear to have lost its original solid form due to melting?
    answer_type: yes_no
    notes_for_judge: Check for general deformation and loss of the bird shape.
  - id: fan_consistency
    question: Is the electric fan still visible in the foreground?
    answer_type: yes_no
    notes_for_judge: The fan should remain as a static object.
  - id: background_tools
    question: Are the hammer and tools in the background unchanged?
    answer_type: yes_no
    notes_for_judge: Background objects should not be affected by the melting.
