evaluation:
  init_frame_description: A close-up, eye-level shot of a vintage metal pencil sharpener clamped to the
    edge of a wooden workbench. A long, unpainted wooden pencil is inserted into the sharpening mechanism,
    extending horizontally to the left. A person's hand is visible on the right, grasping the crank handle
    of the sharpener. The sharpener has a transparent lower compartment containing a small pile of wood
    shavings. The background shows a workshop setting with tools and shelves, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the wooden pencil significantly shorter in length,
    as if it has been ground down by the sharpener. The portion of the pencil shaft extending out of the
    machine should be reduced. Increase the volume of wood shavings visible inside the transparent collection
    bin, making the pile larger and higher. Ensure the hand remains grasping the crank handle. Maintain
    the original lighting, background, and camera angle.
  rationale: The video prompt describes a mechanical sharpening process where the crank is turned, driving
    blades that shave material off the pencil. This is an irreversible subtraction of material. While
    the scene is occluded by plywood, the action continues for several seconds. Therefore, when the view
    is restored, the pencil must be physically shorter (as it is fed into the blades) and the waste container
    must contain more shavings, reflecting the conservation of mass where the lost pencil length becomes
    waste material.
