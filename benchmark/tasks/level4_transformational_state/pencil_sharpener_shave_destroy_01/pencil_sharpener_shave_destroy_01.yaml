id: pencil_sharpener_shave_destroy_01
level: 4
category: structural_transformation
tags: []
variant_of: pencil_sharpener_shave_destroy
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large plywood sheet blocking the view.
changes:
  occlusion_method: A large plywood sheet slides in front of the camera.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (pencil sharpens).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains
    cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates
    inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material
    is physically separated from the main pencil body, it cannot reattach. The hand continues cranking
    the sharpener mechanism. A large sheet of plywood slides into the foreground from the left, completely
    blocking the view of the sharpener, pencil, and hand. The plywood remains in place for several seconds
    while the hand remains behind it continuing to turn the crank. Then the plywood slides away to the
    right, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains
    cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates
    inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material
    is physically separated from the main pencil body, it cannot reattach. The hand continues cranking
    the sharpener mechanism. A large sheet of plywood slides into the foreground from the left, completely
    blocking the view of the sharpener, pencil, and hand. The plywood remains in place for several seconds
    while the hand remains behind it continuing to turn the crank. Then the plywood slides away to the
    right, revealing the scene again. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a vintage metal pencil sharpener clamped to the
    edge of a wooden workbench. A long, unpainted wooden pencil is inserted into the sharpening mechanism,
    extending horizontally to the left. A person's hand is visible on the right, grasping the crank handle
    of the sharpener. The sharpener has a transparent lower compartment containing a small pile of wood
    shavings. The background shows a workshop setting with tools and shelves, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the wooden pencil significantly shorter in length,
    as if it has been ground down by the sharpener. The portion of the pencil shaft extending out of the
    machine should be reduced. Increase the volume of wood shavings visible inside the transparent collection
    bin, making the pile larger and higher. Ensure the hand remains grasping the crank handle. Maintain
    the original lighting, background, and camera angle.
  rationale: The video prompt describes a mechanical sharpening process where the crank is turned, driving
    blades that shave material off the pencil. This is an irreversible subtraction of material. While
    the scene is occluded by plywood, the action continues for several seconds. Therefore, when the view
    is restored, the pencil must be physically shorter (as it is fed into the blades) and the waste container
    must contain more shavings, reflecting the conservation of mass where the lost pencil length becomes
    waste material.
  questions:
  - id: pencil_length_reduction
    question: Is the visible portion of the pencil shaft shorter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the length of the pencil sticking out of the sharpener. It should be shorter
      in the final frame.
  - id: shavings_increase
    question: Is the amount of wood shavings in the transparent container greater than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Look at the pile of shavings inside the sharpener's bin. It should be larger/higher.
  - id: pencil_consumed
    question: Has the pencil undergone a reduction in length due to the sharpening process?
    answer_type: yes_no
    notes_for_judge: The pencil should appear consumed/shortened.
  - id: waste_accumulation
    question: Is the level of debris inside the collection bin higher than before?
    answer_type: yes_no
    notes_for_judge: The waste level should have risen.
  - id: material_subtraction
    question: Is there less of the original pencil object remaining visible?
    answer_type: yes_no
    notes_for_judge: Refers to the pencil body length.
  - id: sharpener_stability
    question: Is the metal sharpener body still clamped to the workbench in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: hand_presence
    question: Is the hand still visible grasping the sharpener crank?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
