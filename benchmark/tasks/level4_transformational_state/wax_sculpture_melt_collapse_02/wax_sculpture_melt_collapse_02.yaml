id: wax_sculpture_melt_collapse_02
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: occlusion_method
variation_description: Replaces camera rotation with the room lights turning off completely.
changes:
  occlusion_method: The workshop lights turn off, creating pitch blackness, then turn back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The heat gun activates, directing intense heat toward the wax bird. Suddenly, the workshop
    lights turn off, plunging the entire scene into complete pitch blackness where nothing is visible.
    After a moment, the lights turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The heat gun activates, directing intense heat toward the wax bird. Suddenly, the workshop
    lights turn off, plunging the entire scene into complete pitch blackness where nothing is visible.
    After a moment, the lights turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture shaped like a bird standing on a square
    metal plate. To the left, the nozzle of a heat gun (silver and orange) is pointed directly at the
    bird. The bird has detailed feather textures. There is a small amount of melted wax pooling around
    the bird's feet. The background shows a workshop workbench with tools like a hammer and pliers, slightly
    out of focus.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture in a significantly melted
    and deformed state. The bird's overall shape should be drooping, slumped, or partially collapsed due
    to heat. The detailed feather textures should appear smoothed out, blurred, or lost. The pool of melted
    wax at the base of the sculpture on the metal plate should be noticeably larger and spread further
    outward. The wax surface should look glossier and softer. Keep the heat gun, the metal plate, and
    the workshop background unchanged.
  rationale: 'The prompt initiates a heating process on a wax object. The period of darkness (lights off)
    acts as a temporal occlusion during which the heat gun continues to affect the wax. When the lights
    return, the physical state of the wax must reflect the accumulated thermal energy: the sculpture should
    exhibit signs of melting, such as loss of structural definition, slumping, smoothing of details, and
    an increase in the volume of liquid wax at the base. The camera and background remain static.'
