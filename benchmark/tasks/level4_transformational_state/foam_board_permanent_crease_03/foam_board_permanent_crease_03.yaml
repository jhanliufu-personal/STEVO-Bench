id: foam_board_permanent_crease_03
level: 4
category: structural_transformation
tags: []
variant_of: foam_board_permanent_crease
variation_type: occlusion_method
variation_description: Occlusion changed to camera zooming out until details are lost.
changes:
  occlusion_method: Camera zooms out to a wide shot where the board is too small to see state changes.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands begin bending the foam board by bringing the ends closer together. Foam board consists
    of a polystyrene foam core sandwiched between paper facings. The foam core has an elastic limit beyond
    which permanent plastic deformation occurs. The paper facing has a tensile strength limit. The material
    structure does not allow return to original shape after exceeding plastic deformation thresholds.
    The hands continue applying progressive bending force. The camera rapidly zooms out, pulling back
    until the hands and board are tiny, indistinguishable specks in the distance, making detail visibility
    impossible. The camera holds this distant view for several seconds. Then the camera zooms back in
    smoothly to the original viewpoint. No cut, no scene change. STOP.
  camera_WM: The hands begin bending the foam board by bringing the ends closer together. Foam board consists
    of a polystyrene foam core sandwiched between paper facings. The foam core has an elastic limit beyond
    which permanent plastic deformation occurs. The paper facing has a tensile strength limit. The material
    structure does not allow return to original shape after exceeding plastic deformation thresholds.
    The hands continue applying progressive bending force during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a person's hands holding a flat, rectangular sheet of white
    foam board horizontally over a wooden workbench. The person is wearing a black t-shirt. The hands
    grip the left and right sides of the board with thumbs on top and fingers underneath. The background
    shows a workshop setting with tools and a pegboard.
  init2final_edit_prompt: Edit the given image to show the white foam board bent significantly in the
    middle. Render a visible vertical crease, fold, or fracture line down the center of the board where
    the material has buckled. Adjust the angle of the left and right sides of the board to form a V-shape
    or curve, indicating that the ends have been brought closer together and the board is no longer flat.
  rationale: The video prompt describes a bending action applied to a foam board, a material that undergoes
    permanent plastic deformation (creasing or snapping) when bent beyond a certain point. The camera
    zooms out to a distance where the object is effectively invisible (occlusion by distance) and then
    returns. The world model must infer that the bending force continued or the damage persisted during
    the time the object was not clearly visible. Therefore, upon the camera's return, the board must appear
    bent, creased, or broken, rather than reverting to its original flat state.
  questions:
  - id: board_bent
    question: Is the foam board bent or curved in the middle?
    answer_type: yes_no
    notes_for_judge: The board should no longer be a flat plane; it should show a distinct bend.
  - id: crease_visible
    question: Is there a visible crease, fold, or fracture line on the foam board?
    answer_type: yes_no
    notes_for_judge: Look for a line of deformation in the center where the material has failed.
  - id: structural_integrity
    question: Has the foam board lost its original flat, uniform shape?
    answer_type: yes_no
    notes_for_judge: Compare to the initial perfectly flat rectangle.
  - id: ends_closer
    question: Are the left and right ends of the board closer to each other than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Bending the board brings the hands/ends closer together spatially.
  - id: surface_continuity
    question: Is the surface of the board interrupted by a deformation or break?
    answer_type: yes_no
    notes_for_judge: The smooth white surface should be broken by the bend/crease.
  - id: hands_holding_bent
    question: Are the hands holding the object in a bent or angled configuration?
    answer_type: yes_no
    notes_for_judge: The grip should reflect the new shape of the board.
  - id: shirt_consistency
    question: Is the person still wearing a black shirt?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: workbench_visible
    question: Is the wooden workbench still visible in the foreground?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
