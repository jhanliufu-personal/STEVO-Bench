id: expanding_foam_paper_cup_burst_10
level: 4
category: structural_transformation
tags: []
variant_of: expanding_foam_paper_cup_burst
variation_type: combined
variation_description: Wide bowl (condition) with fog occlusion.
changes:
  occlusion_method: Thick smoke/fog.
  dynamic_conditions: Wide bowl container.
  expected_outcome_change: Mound formation instead of burst
prompts:
  init_frame_edit_prompt: Edit the image to replace the paper cup with a wide, shallow plastic mixing
    bowl.
  video_WM: The hand presses the trigger and expanding foam begins dispensing into the wide, shallow mixing
    bowl. The bowl's open geometry allows lateral spreading of the expanding material. Suddenly, thick
    white smoke billows into the frame, completely obscuring the view of the workbench and bowl. The smoke
    remains dense and opaque for several seconds while the foam continues expanding in the bowl. The smoke
    then clears rapidly, restoring visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses the trigger and expanding foam begins dispensing into the wide, shallow
    mixing bowl. The bowl's open geometry allows lateral spreading of the expanding material. Suddenly,
    thick white smoke billows into the frame, completely obscuring the view of the workbench and bowl.
    The smoke remains dense and opaque for several seconds while the foam continues expanding in the bowl.
    The smoke then clears rapidly, restoring visibility. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a workbench covered in a plastic sheet. A gloved hand holds
    a can of 'Great Stuff' expanding foam with a red straw nozzle directed into a clear plastic mixing
    bowl. The bowl contains a small, initial amount of yellowish-white foam. In the background, there
    is a hammer, a clamp, wooden boards, and a window.
  init2final_edit_prompt: Edit the given image to show the clear plastic bowl containing a significantly
    larger volume of yellowish-white expanding foam. The foam should appear puffy and risen, filling more
    of the bowl's capacity than in the original image. Keep the gloved hand, the spray can, the background
    tools, and the workbench environment identical to the original view.
  rationale: The prompt specifies that foam is dispensed and continues expanding while the view is obscured
    by smoke. Expanding foam increases in volume rapidly as it is dispensed and cures. Therefore, when
    the smoke clears, the primary physical change must be a noticeable increase in the amount and volume
    of foam inside the bowl. The surrounding environment and tools should remain unchanged.
  questions:
  - id: foam_volume_increase
    question: Is the volume of foam inside the clear bowl significantly larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the amount of yellowish material in the bowl between the two frames.
  - id: bowl_fullness
    question: Is the clear plastic bowl fuller than it was in the initial image?
    answer_type: yes_no
    notes_for_judge: The level of foam should be higher or cover more area.
  - id: foam_expansion
    question: Does the foam appear to have expanded or risen compared to the start?
    answer_type: yes_no
    notes_for_judge: Look for evidence of the material growing in size.
  - id: foam_accumulation
    question: Is there more foam material visible in the bowl now than before?
    answer_type: yes_no
    notes_for_judge: Direct comparison of quantity.
  - id: hammer_consistency
    question: Is the hammer in the background still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: hand_can_consistency
    question: Is the gloved hand still holding the can of expanding foam?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
