evaluation:
  init_frame_description: A close-up shot of a workbench covered in a plastic sheet. A gloved hand holds
    a can of 'Great Stuff' expanding foam with a red straw nozzle directed into a clear plastic mixing
    bowl. The bowl contains a small, initial amount of yellowish-white foam. In the background, there
    is a hammer, a clamp, wooden boards, and a window.
  init2final_edit_prompt: Edit the given image to show the clear plastic bowl containing a significantly
    larger volume of yellowish-white expanding foam. The foam should appear puffy and risen, filling more
    of the bowl's capacity than in the original image. Keep the gloved hand, the spray can, the background
    tools, and the workbench environment identical to the original view.
  rationale: The prompt specifies that foam is dispensed and continues expanding while the view is obscured
    by smoke. Expanding foam increases in volume rapidly as it is dispensed and cures. Therefore, when
    the smoke clears, the primary physical change must be a noticeable increase in the amount and volume
    of foam inside the bowl. The surrounding environment and tools should remain unchanged.
