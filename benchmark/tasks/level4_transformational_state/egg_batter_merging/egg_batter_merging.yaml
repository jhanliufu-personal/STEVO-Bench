id: egg_batter_merging
level: 4
category: structural_transformation
transformation_type: merging (identity loss)
prompts:
  image_gen_prompt: A bowl contains dry flour and three distinct raw eggs cracked on top. A metal whisk
    is positioned in the bowl.
  video_WM: The whisk begins rapidly stirring the eggs into the flour. The distinct entities of the eggs
    and flour are being combined into a single batter. The camera rotates right until the bowl completely
    exits the view, then rotates toward the left smoothly at the same rate until the bowl is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The eggs and flour are rapidly whisked together to combine them into a batter. The mixing
    process continues. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A top-down view of a ceramic mixing bowl sitting on a wooden table. Inside the
    bowl is a ring of white flour surrounding a well containing four raw eggs with bright yellow yolks
    and clear whites. A metal balloon whisk rests in the bowl, with the handle extending towards the top
    right. A linen cloth is visible on the right side of the frame.
  init2final_edit_prompt: Edit the given image to show the ingredients inside the bowl mixed into a batter.
    The distinct round egg yolks must be broken and blended with the white flour, creating a lumpy or
    smooth pale yellow mixture. The clear egg whites should be incorporated into the flour. The whisk
    wires should appear coated with the batter mixture. Keep the bowl, table, and cloth in their original
    positions.
  rationale: The video prompt describes a stirring action that occurs while the camera pans away and then
    returns. Stirring is an irreversible physical transformation that mixes distinct ingredients (eggs
    and flour) into a homogeneous substance (batter). When the camera returns to the initial viewpoint,
    the primary change must be the loss of the distinct structural integrity of the egg yolks and the
    incorporation of the flour into a mixture. The yolks should no longer be intact spheres, and the flour
    should be wetted and clumped.
