variation_description: The hand pulls the carrot away from the grater.
changes:
  occlusion_method: null
  dynamic_conditions: Motion is away from the grater, not against it.
  expected_outcome_change: No shredding; carrot moves away from the tool.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand, initially touching the grater with the carrot, begins to pull the carrot backward,
    away from the metal surface. The motion creates distance between the vegetable and the cutting edges.
    The camera rotates right at constant speed until the grater and carrot completely exit the view to
    the right. The camera continues rotating right for several seconds while the hand continues to retract
    off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The hand, initially touching the grater with the carrot, begins to pull the carrot backward,
    away from the metal surface. The motion creates distance between the vegetable and the cutting edges.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal box grater standing on a wooden cutting
    board. A hand enters from the right side, holding a large orange carrot horizontally against the side
    of the grater. A pile of orange carrot shreds is visible on the board at the base of the grater. A
    window is visible in the blurred background on the left.
  init2final_edit_prompt: Edit the given image to completely remove the hand and the carrot. The metal
    box grater should be fully visible and unobstructed, revealing the grating holes that were previously
    covered. Inpaint the background area where the hand and arm were to show the wooden cutting board
    and the blurred wall/window sill behind. The pile of shredded carrot pieces on the board must remain
    visible and unchanged. Maintain the original lighting and perspective.
  rationale: The video prompt describes the hand pulling the carrot away from the grater and continuing
    to retract off-screen. The camera rotates right (panning away) and then rotates left back to the original
    viewpoint. During the time the camera is looking away, the hand and carrot fully retract out of the
    scene. Therefore, the final frame returns to the initial camera angle but shows the scene without
    the hand or carrot. The static environment (grater, board, shreds) remains unchanged.
