id: photograph_tearing_02
level: 4
category: structural_transformation
tags: []
variant_of: photograph_tearing
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off.
changes:
  occlusion_method: The environment lights turn off, creating pitch blackness.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The two hands pull firmly in opposite directions on the photograph. Tension is applied to
    the paper material to initiate a tear. The lights in the room turn off completely, plunging the scene
    into pitch blackness, then turn back on after a moment. No zoom, no cut, no scene change. The camera
    returns to the original viewpoint. STOP.
  camera_WM: The two hands pull firmly in opposite directions on the photograph. Tension is applied to
    the paper material to initiate a tear. The lights in the room turn off completely, plunging the scene
    into pitch blackness, then turn back on after a moment. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of two hands holding a glossy photograph. The photograph depicts
    a sunset over a beach with dark foreground and orange sky. The hands are holding the left and right
    sides of the photo. The background is dark and out of focus.
  init2final_edit_prompt: Edit the given image to show the photograph being torn. Introduce a visible,
    jagged vertical rip or tear in the paper, likely starting from the top edge and extending downwards.
    Show the edges of the tear separated slightly, indicating the paper has been pulled apart.
  rationale: The video prompt describes hands pulling firmly to initiate a tear, followed by a period
    of darkness (occlusion) and then a return to the original lighting. During the blackout, the tension
    applied by the hands causes the paper to rip. Therefore, in the final frame, the photograph must exhibit
    visible structural damage (a tear) resulting from the pulling force.
