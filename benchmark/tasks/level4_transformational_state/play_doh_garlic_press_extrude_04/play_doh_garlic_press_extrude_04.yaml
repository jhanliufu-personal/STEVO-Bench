id: play_doh_garlic_press_extrude_04
level: 4
category: structural_transformation
tags: []
variant_of: play_doh_garlic_press_extrude
variation_type: dynamic_condition
variation_description: Hands hold the press but do not apply any squeezing force.
changes:
  occlusion_method: null
  dynamic_conditions: Hands hold the press statically without applying force.
  expected_outcome_change: No change in state (Play-Doh remains a ball inside the open press).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands hold the garlic press handles in the current open position. The garlic press chamber
    contains a ball of Play-Doh. The hands maintain a static grip on the handles without applying any
    squeezing pressure. The plunger remains poised above the material but does not descend. No force is
    exerted on the Play-Doh. The hands hold the press completely still. The camera rotates right at constant
    speed until the garlic press completely exits the view to the right. The camera continues rotating
    right for several seconds while the hands remain off-screen holding the press still. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The hands hold the garlic press handles in the current open position. The garlic press chamber
    contains a ball of Play-Doh. The hands maintain a static grip on the handles without applying any
    squeezing pressure. The plunger remains poised above the material but does not descend. No force is
    exerted on the Play-Doh. The hands hold the press completely still during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up view of a pair of hands holding a vintage metal garlic press over
    a wooden countertop. The garlic press is in the open position. Inside the press's chamber sits a smooth,
    spherical ball of blue Play-Doh. The plunger of the press is raised above the chamber, not touching
    the Play-Doh. The background features a blurred kitchen window and a utensil jar.
  init2final_edit_prompt: Edit the given image to maintain the exact original state of the objects. The
    blue Play-Doh ball must remain completely spherical and uncompressed within the garlic press chamber.
    The metal handles must remain in the same open position, with the plunger poised above the Play-Doh
    without making contact. Ensure there is no evidence of squeezing, flattening, or extrusion. The scene
    should look identical to the start.
  rationale: The video prompt explicitly instructs that the hands hold the press 'completely still' and
    'no force is exerted' on the Play-Doh. Although the camera pans away to occlude the object and then
    returns, the physical state of the garlic press and the Play-Doh must remain unchanged. This task
    tests the model's ability to adhere to negative constraints (do not squeeze) and maintain object permanence/state
    stability during occlusion, resisting the bias to predict the typical action (squeezing) associated
    with the tool.
  questions:
  - id: q1
    question: Is the blue Play-Doh still shaped like a round ball?
    answer_type: yes_no
    notes_for_judge: The prompt specifies no force is exerted, so the ball should not be flattened.
  - id: q2
    question: Are the handles of the garlic press still in the open position?
    answer_type: yes_no
    notes_for_judge: The press should not be closed.
  - id: q3
    question: Is the plunger still positioned above the Play-Doh without pressing into it?
    answer_type: yes_no
    notes_for_judge: Check for separation between the metal plunger and the blue clay.
  - id: q4
    question: Does the Play-Doh appear uncompressed and free of deformation?
    answer_type: yes_no
    notes_for_judge: The surface should remain smooth and convex.
  - id: q5
    question: Is the Play-Doh free of any extrusion marks or material coming out of the press holes?
    answer_type: yes_no
    notes_for_judge: Since no squeezing occurred, no extrusion should be visible.
  - id: q6
    question: Is the full volume of the Play-Doh ball still contained within the chamber?
    answer_type: yes_no
    notes_for_judge: It should not be squished out the sides or bottom.
  - id: q7
    question: Do the hands appear to be holding the press in the same static grip as the initial frame?
    answer_type: yes_no
    notes_for_judge: The prompt specifies a static grip.
