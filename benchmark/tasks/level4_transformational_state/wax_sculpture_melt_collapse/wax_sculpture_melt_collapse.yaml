id: wax_sculpture_melt_collapse
level: 4
category: structural_transformation
transformation_type: structural_collapse (phase change)
prompts:
  image_gen_prompt: A detailed wax sculpture of a bird sitting on a metal plate. A high-powered industrial
    heat gun is aimed directly at the sculpture from a close distance.
  video_WM: The heat gun is turned on high and aimed at the wax bird. Intense heat hits the sculpture,
    causing immediate melting and structural failure. The camera rotates right until the sculpture completely
    exits the view, then rotates toward the left smoothly at the same rate until the metal plate is back
    in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: Intense heat from the gun is applied to the wax sculpture, initiating rapid melting and structural
    collapse. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture shaped like a bird standing on a square
    metal plate. A heat gun with a silver body and orange nozzle is positioned on the left, aimed directly
    at the bird. The bird shows initial signs of melting with some wax pooling at its feet. The background
    is a workshop workbench with tools like a hammer, pliers, and bottles visible.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture in a state of advanced melting
    and structural collapse. The bird's distinct features such as the head, beak, and wings should be
    heavily distorted, drooping, or completely lost. The main body of the sculpture should appear shorter
    and wider as it slumps down. The pool of melted wax on the metal plate should be significantly larger
    and more spread out than in the original image.
  rationale: The prompt specifies that a heat gun is turned on high, causing immediate melting and structural
    failure. The camera rotates away and then returns to the original view. This implies a passage of
    time during which the heat is applied. Therefore, upon the camera's return, the wax bird must exhibit
    significant physical degradation—melting, loss of form, and collapsing under its own weight—compared
    to the initial frame. The surrounding environment remains stable.
