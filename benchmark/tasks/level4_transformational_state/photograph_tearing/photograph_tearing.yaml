id: photograph_tearing
level: 4
category: structural_transformation
transformation_type: tearing (topology change)
prompts:
  image_gen_prompt: A single glossy photograph held by two hands. The hands are beginning to pull the
    sides of the photo in opposite directions, creating slight tension at the top edge.
  video_WM: The two hands pull firmly in opposite directions on the photograph. Tension is applied to
    the paper material to initiate a tear. The camera rotates right until the hands and photo completely
    exit the view, then rotates toward the left smoothly at the same rate until the space between the
    hands is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: Opposite tension force is applied by the hands to the photograph to begin tearing it. The
    pulling force continues. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of two hands holding a glossy photograph of a sunset over a
    beach. The left hand holds the left side and the right hand holds the right side. There is a small
    stress mark or tiny crease visible at the top center edge of the photo. The background is dark and
    out of focus.
  init2final_edit_prompt: Edit the given image so that the photograph is visibly torn. Introduce a distinct
    vertical rip extending from the top edge downwards through the center of the photo, separating the
    paper material. The edges of the tear should look jagged and expose the white inner fibers of the
    paper. The hands should remain in place holding the torn sides of the photograph.
  rationale: The video prompt describes hands pulling firmly to initiate a tear, followed by a camera
    rotation away and back. During the period of occlusion (when the camera is looking away), the physical
    force applied to the paper causes the material to fail. When the camera returns to the initial view,
    the photograph must show evidence of this irreversible structural change, appearing torn or ripped
    where the tension was applied.
  questions:
  - id: tear_visible
    question: Is there a visible tear or rip in the photograph?
    answer_type: yes_no
    notes_for_judge: Look for a distinct separation in the paper material.
  - id: structural_damage
    question: Has the structural integrity of the photograph been compromised compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The photo should no longer be a single pristine piece.
  - id: tear_location
    question: Is the damage located in the area between the two hands?
    answer_type: yes_no
    notes_for_judge: The tear should be where the tension was applied.
  - id: material_separation
    question: Are the edges of the paper separated or jagged, indicating a rip?
    answer_type: yes_no
    notes_for_judge: Check for white fibers or jagged edges typical of torn paper.
  - id: damage_progression
    question: Is the damage to the photo more extensive than the small crease seen in the initial frame?
    answer_type: yes_no
    notes_for_judge: The tear should have progressed beyond the initial state.
  - id: hands_present
    question: Are the hands still holding the photograph?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: content_recognizable
    question: Is the sunset image on the photograph still recognizable despite the damage?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
