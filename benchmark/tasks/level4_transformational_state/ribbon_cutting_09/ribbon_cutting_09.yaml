id: ribbon_cutting_09
level: 4
category: structural_transformation
tags: []
variant_of: ribbon_cutting
variation_type: combined
variation_description: Slack ribbon (condition) with zoom out occlusion.
changes:
  occlusion_method: Camera zoom out.
  dynamic_conditions: Ribbon is loose and slack.
  expected_outcome_change: Ribbon folds/bends instead of cutting.
prompts:
  init_frame_edit_prompt: Edit the image to make the red ribbon look loose and slack, laying wavy on the
    table instead of taut.
  video_WM: The blades of the sharp scissors begin to close slowly and steadily around the loose, slack
    red ribbon. The closing action begins. The camera zooms out rapidly until the scissors and ribbon
    are too small to distinguish, then zooms back in until the scene fills the frame again. The camera
    returns to the original viewpoint. No cut, no scene change. STOP.
  camera_WM: The blades of the sharp scissors begin to close slowly and steadily around the loose, slack
    red ribbon. The closing action begins. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A high-angle close-up shot of a wooden table surface. A pair of vintage metal
    scissors lies diagonally across the frame, with its blades open. A strip of red satin ribbon runs
    horizontally across the table, passing directly between the open blades of the scissors. The ribbon
    is slack and continuous. In the background, out of focus, is a white window frame.
  init2final_edit_prompt: Edit the given image so that the metal scissors are fully closed, with the blades
    touching each other. The red ribbon is severed into two separate pieces at the point where the scissors
    are located. Show the cut ends of the ribbon slightly separated or resting near the closed blades,
    indicating a completed cut.
  rationale: 'The prompt initiates the mechanical action of the scissors closing around the ribbon. The
    rapid zoom out and subsequent zoom in acts as a temporal bridge, obscuring the exact moment of the
    cut but implying that time has passed for the action to complete. Upon returning to the original viewpoint,
    the physical consequence of the action should be manifest: the scissors should be closed, and the
    ribbon should be irreversibly cut into two pieces.'
