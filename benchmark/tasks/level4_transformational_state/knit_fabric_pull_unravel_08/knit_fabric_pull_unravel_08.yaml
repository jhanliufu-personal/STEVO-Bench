evaluation:
  init_frame_description: A close-up, high-angle shot showing a wooden table surface. On the right, a
    section of chunky, cream-colored knit fabric lies flat. On the left, a hand holds the end of a thick
    yarn strand connected to the fabric. The yarn between the hand and the fabric is loose, forming a
    drooping curve with significant slack, indicating a lack of tension. The edge of the fabric shows
    open loops where the yarn is attached, appearing vulnerable to unraveling but currently static.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it was initially, preserving
    the state of all objects. Ensure the yarn between the hand and the fabric retains its loose, drooping
    curve with visible slack. The knit fabric must remain in its original position and condition, with
    no additional unraveling or structural changes. The lighting should be bright and fully illuminate
    the scene.
  rationale: The prompt explicitly states that the hand holds the yarn loosely and applies no tension
    ('No tension is applied', 'without pulling'). While there is a lighting change (lights off then on),
    the physical action required to cause unraveling is explicitly negated. Therefore, the world state
    regarding the fabric's structure and the yarn's tension must remain invariant. The final frame should
    be visually identical to the initial frame in terms of object configuration, showing the yarn still
    slack and the fabric intact.
