id: paper_burning_v01
level: 4
category: transformational_state_change
tags: []
variant_of: paper_burning
variation_type: occlusion_method
variation_description: Occlusion changed from camera panning to a person blocking the view.
changes:
  occlusion_method: A person walks between the camera and the table, completely blocking the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts. Camera remains static centered on the plate and burning paper.
    A person wearing a dark shirt walks into the frame from the right, moving close to the camera until
    they completely block the view of the table and plate. The person stands there for several seconds.
    Then the person walks out of frame to the left, revealing the table again. Lighting and objects remain
    consistent and realistic.
  camera_WM: Single continuous take, no cuts. Camera remains static centered on the plate and burning
    paper. A person wearing a dark shirt walks into the frame from the right, moving close to the camera
    until they completely block the view of the table and plate. The person stands there for several seconds.
    Then the person walks out of frame to the left, revealing the table again. Lighting and objects remain
    consistent and realistic.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a rustic ceramic plate resting on a wooden table.
    On the plate sits a rolled piece of thick, textured white paper. The paper is actively burning; a
    small flame is visible on the front edge, consuming the paper. There is visible smoke rising from
    the burning area. The edges of the paper near the flame are charred black and brown. The background
    shows a window sill and blurred outdoor scenery.
  init2final_edit_prompt: Edit the given image to show the paper after it has burned for several more
    seconds. The area of white unburnt paper should be significantly reduced. The amount of black char
    and grey ash on the plate should be increased. The structure of the paper roll should appear more
    collapsed, fragmented, or consumed by the fire. The flame may have moved further along the paper or
    changed shape, but the primary focus is on the increased structural damage and accumulation of ash.
    Keep the plate, table, and background identical to the original.
  rationale: 'The video prompt describes a static camera shot where a person temporarily blocks the view
    for several seconds. During this occlusion, the fire continues to burn the paper. Fire causes irreversible
    structural transformation. Therefore, when the person leaves and the view is restored, the paper must
    be in a more advanced state of decomposition: less white paper remaining, more ash/char present, and
    a more collapsed structure. The environment (table, plate) remains unchanged.'
  questions:
  - id: paper_consumed
    question: Is the area of white unburnt paper smaller than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the surface area of the white paper. It should have decreased due to burning.
  - id: ash_increase
    question: Is there more visible ash or charred material on the plate compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for black or grey residue replacing the white paper.
  - id: structural_degradation
    question: Does the paper appear more collapsed or fragmented than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The structural integrity should be compromised by the fire.
  - id: char_extension
    question: Has the blackened, charred edge of the paper expanded compared to the start?
    answer_type: yes_no
    notes_for_judge: The burn line should have progressed further into the paper.
  - id: plate_visibility
    question: Is the ceramic plate visible again?
    answer_type: yes_no
    notes_for_judge: The person blocking the view must have left.
  - id: table_consistency
    question: Is the wooden table surface visible and unchanged in appearance?
    answer_type: yes_no
    notes_for_judge: Check for background consistency.
  - id: irreversible_change
    question: Does the object show clear signs of irreversible material loss or damage compared to the
      start?
    answer_type: yes_no
    notes_for_judge: Burning is irreversible; the paper cannot look 'healed' or identical.
