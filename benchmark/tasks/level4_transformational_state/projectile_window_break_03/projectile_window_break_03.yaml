camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view through a wooden window frame looking out at a green garden
    and a rustic wooden house. A copper-colored bullet or BB projectile is frozen in mid-air, positioned
    just in front of the right-hand glass pane, about to strike it. The glass is currently intact with
    minor dust specks.
  init2final_edit_prompt: Edit the given image to show the glass pane shattered with a spiderweb pattern
    of cracks and a central impact hole where the projectile was positioned. Remove the floating projectile
    from the air. Ensure the background garden and wooden house are clearly visible again, with no delivery
    truck or vehicle blocking the view.
  rationale: The prompt describes a sequence where the projectile strikes the glass, causing irreversible
    structural damage (shattering). Simultaneously, a truck passes by, temporarily occluding the scene.
    The prompt explicitly states the truck continues until the view is clear again. Therefore, the final
    state must show the aftermath of the impact—broken glass—with the occlusion removed, revealing the
    original background.
