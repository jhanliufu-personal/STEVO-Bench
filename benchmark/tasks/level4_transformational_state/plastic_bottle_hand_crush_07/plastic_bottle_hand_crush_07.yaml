id: plastic_bottle_hand_crush_07
level: 4
category: structural_transformation
tags: []
variant_of: plastic_bottle_hand_crush
variation_type: combined
variation_description: Thick glass bottle (condition) + Fog occlusion (method).
changes:
  occlusion_method: Thick steam fills the room.
  dynamic_conditions: Bottle is thick glass (rigid).
  expected_outcome_change: No deformation
prompts:
  init_frame_edit_prompt: Edit the image to change the plastic bottle into a thick, clear glass bottle
    of the same shape.
  video_WM: The hand grips the thick glass bottle and begins applying squeezing force. Glass is a rigid
    material that does not yield or deform under manual compression. The hand maintains steady pressure.
    Suddenly, thick white steam begins to fill the kitchen, rapidly obscuring the view. Within moments,
    the fog is so dense that the hand and bottle are completely hidden from sight. The squeezing action
    continues unseen within the fog. After several seconds, the steam dissipates quickly, clearing the
    view completely. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand grips the thick glass bottle and begins applying squeezing force. Glass is a rigid
    material that does not yield or deform under manual compression. The hand maintains steady pressure.
    Suddenly, thick white steam begins to fill the kitchen, rapidly obscuring the view. Within moments,
    the fog is so dense that the hand and bottle are completely hidden from sight. The squeezing action
    continues unseen within the fog. After several seconds, the steam dissipates quickly, clearing the
    view completely. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table surface. A clear bottle filled
    with water and capped with a blue lid stands in the center; it has a contoured shape with a narrower
    waist. To the left, a human arm extends into the frame with the hand open, reaching towards the bottle
    but not yet touching it. Two circular water ring stains are visible on the table surface near the
    bottle. The background shows a blurred kitchen interior with a window and appliances.
  init2final_edit_prompt: Edit the image to show the hand firmly gripping the bottle. The fingers should
    be wrapped tightly around the bottle's waist. Crucially, the bottle must retain its original shape
    and volume; it should appear rigid and completely uncrushed, with no dents, buckling, or deformation,
    consistent with thick glass. The water inside should remain visible. The steam mentioned in the context
    has fully dissipated, so the view is clear. The table surface, water rings, and background remain
    unchanged.
  rationale: The prompt explicitly defines the object as a 'thick glass bottle' and states that it 'does
    not yield or deform under manual compression'. This overrides the visual appearance of the bottle
    (which resembles plastic). While the hand applies force during the occluded period, the material properties
    dictate that the bottle remains structurally intact and uncrushed. The final state must show the hand
    gripping the bottle, but the bottle itself must show no signs of the deformation that would occur
    if it were plastic. The steam obscures the action but dissipates completely by the end.
  questions:
  - id: hand_grip_01
    question: Is the hand currently gripping the bottle?
    answer_type: yes_no
    notes_for_judge: The hand should be wrapped around the bottle, not just reaching for it.
  - id: bottle_integrity_01
    question: Does the bottle retain its original cylindrical shape without deformation?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the bottle is rigid glass and does not deform. If the bottle
      is crushed or dented, the answer is No.
  - id: bottle_integrity_02
    question: Is the bottle free from visible crushing or buckling?
    answer_type: yes_no
    notes_for_judge: Verifies that the model respected the 'rigid glass' constraint over the visual 'plastic
      bottle' bias.
  - id: bottle_integrity_03
    question: Does the bottle appear structurally intact?
    answer_type: yes_no
    notes_for_judge: The bottle should not be broken or bent.
  - id: visibility_01
    question: Is the view clear of the steam or fog mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the steam dissipates completely.
  - id: consistency_01
    question: Is the blue cap still visible on the bottle?
    answer_type: yes_no
    notes_for_judge: Object permanence check.
  - id: consistency_02
    question: Are the circular water stains on the table still visible?
    answer_type: yes_no
    notes_for_judge: Background consistency check.
