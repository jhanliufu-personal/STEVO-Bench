prompts:
  image_gen_prompt: A red plastic Solo cup sits on a table surface next to a heat gun that is turned on and blowing hot air. The heat gun nozzle is positioned approximately 6 inches from the cup pointing toward it. The cup is initially intact with straight walls and circular rim.
  video_WM: Hot air from the heat gun flows toward the plastic cup. The cup is made from polystyrene plastic which has a glass transition temperature around 212°F. When thermoplastic polymers are heated above their glass transition point, the polymer chains gain mobility and the material loses structural rigidity. The material is subject to gravitational forces and internal stresses. Thermoplastics retain the shape they have when cooled back below glass transition temperature. The heat gun continues directing hot air at the cup. The camera rotates right at constant speed until the cup and heat gun completely exit the view to the right. The camera continues rotating right for several seconds while the heat continues being applied off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the cup and heat gun back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: Hot air from the heat gun flows toward the plastic cup. The cup is made from polystyrene plastic which has a glass transition temperature around 212°F. When thermoplastic polymers are heated above their glass transition point, the polymer chains gain mobility and the material loses structural rigidity. The material is subject to gravitational forces and internal stresses. Thermoplastics retain the shape they have when cooled back below glass transition temperature. The heat gun continues directing hot air at the cup during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
