id: projectile_window_break_06
level: 4
category: structural_transformation
tags: []
variant_of: projectile_window_break
variation_type: dynamic_condition
variation_description: Glass changed to reinforced wire mesh security glass.
changes:
  occlusion_method: null
  dynamic_conditions: Window pane is reinforced with wire mesh.
  expected_outcome_change: The glass may crack or spiderweb but will not shatter or break open.
prompts:
  init_frame_edit_prompt: Edit the image to show a wire mesh grid embedded within the glass pane, indicating
    reinforced security glass.
  video_WM: The high-speed metal BB projectile strikes the center of the reinforced wire-mesh security
    glass. The camera rotates right until the window frame completely exits the view, then rotates toward
    the left smoothly at the same rate until the window frame is back in the center of view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The high-speed metal BB projectile strikes the center of the reinforced wire-mesh security
    glass. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view through a wooden-framed window containing reinforced wire-mesh
    glass. A copper-colored bullet or projectile is frozen in mid-air, just contacting or about to penetrate
    the center of the glass. Small cracks are already visible radiating from the impact point. The background
    shows a blurry green garden and a house.
  init2final_edit_prompt: Edit the given image to show the aftermath of the projectile impact. Remove
    the suspended bullet from the scene. Create a distinct hole or severe impact crater in the center
    of the wire-mesh glass where the projectile struck. Add extensive spider-web cracks radiating outward
    from the center across the entire pane of glass. Show the wire mesh grid as bent, broken, or distorted
    at the impact site. Keep the wooden window frame and the outdoor background scenery consistent with
    the initial view.
  rationale: The video prompt describes a high-speed projectile striking the glass, followed by a camera
    rotation that removes the window from view and then returns. During the occlusion caused by the camera
    panning away, the physical impact event concludes. When the camera returns to the initial angle, the
    projectile will have passed through or bounced off, meaning it should no longer be suspended in mid-air.
    The glass, previously intact or just starting to break, must now show significant irreversible structural
    damage, such as a hole, shattered patterns, and deformed wire mesh, reflecting the completed impact.
