camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A wooden table with a clear plastic ziplock bag containing a single, intact
    rectangular graham cracker. A human hand is hovering palm-down just above the bag, positioned to press
    on the cracker. In the background, a window and part of a chair are visible.
  init2final_edit_prompt: Edit the given image so that the hand is pressing firmly down onto the plastic
    bag. The graham cracker inside the bag should be crushed into broken fragments and crumbs, losing
    its original rectangular shape. The plastic bag should appear flattened and compressed under the pressure
    of the hand.
  rationale: The prompt describes a destructive physical action where a hand applies force to a brittle
    object (graham cracker). The expected evolution is the transition from a hovering hand to a pressing
    hand, and the transformation of the cracker from a solid sheet into broken pieces and crumbs due to
    the applied stress. The final state must show the hand in contact with the bag and the cracker in
    a fragmented state.
  questions:
  - id: cracker_broken
    question: Is the graham cracker broken into smaller pieces or crumbs?
    answer_type: yes_no
    notes_for_judge: Look for evidence of fracture, fragmentation, or crumbs replacing the solid sheet.
  - id: hand_contact
    question: Is the hand pressing down on the plastic bag?
    answer_type: yes_no
    notes_for_judge: The hand should be in contact with the bag, not hovering above it.
  - id: shape_destroyed
    question: Has the original rectangular shape of the cracker been disrupted or destroyed?
    answer_type: yes_no
    notes_for_judge: The straight edges and uniform rectangular form should be compromised.
  - id: fragments_visible
    question: Are there visible fragments or crumbs of the cracker inside the bag?
    answer_type: yes_no
    notes_for_judge: Check for small particles or broken sections.
  - id: bag_compressed
    question: Does the plastic bag appear flattened or compressed under the hand?
    answer_type: yes_no
    notes_for_judge: The bag should conform to the hand and the crushed contents.
  - id: structural_integrity
    question: Does the cracker appear less structurally intact than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the solid initial state to the damaged final state.
  - id: invariant_table
    question: Is the wooden table surface still visible?
    answer_type: yes_no
    notes_for_judge: The background environment should remain consistent.
  - id: invariant_bag_presence
    question: Is the plastic bag still present?
    answer_type: yes_no
    notes_for_judge: The bag itself should not disappear, though its shape changes.
