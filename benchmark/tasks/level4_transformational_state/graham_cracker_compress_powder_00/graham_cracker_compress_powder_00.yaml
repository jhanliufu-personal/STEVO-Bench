changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand presses down on the cracker through the plastic bag with progressive force. Graham
    crackers are baked goods with brittle structure that fractures easily under compression. The hand
    applies grinding and pressing motions to distribute force across the cracker surface. The material
    is dry and has low fracture toughness typical of baked wheat products. Camera remains stationary throughout.
    The hand remains fully visible while continuing to apply pressure and grinding motion. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The hand presses down on the cracker through the plastic bag with progressive force. Graham
    crackers are baked goods with brittle structure that fractures easily under compression. The hand
    applies grinding and pressing motions to distribute force across the cracker surface. The material
    is dry and has low fracture toughness typical of baked wheat products. Camera remains stationary throughout.
    The hand remains fully visible while continuing to apply pressure and grinding motion. No zoom, no
