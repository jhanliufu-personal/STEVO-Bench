id: paper_burning_v03
level: 4
category: transformational_state_change
tags: []
variant_of: paper_burning
variation_type: occlusion_method
variation_description: Occlusion changed from camera panning to camera tilting up to the ceiling.
changes:
  occlusion_method: Camera tilts upward until the table is out of view, then tilts back down.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts. Camera starts centered on the plate and burning paper. Then
    the camera smoothly tilts upward at a constant speed until the table and plate leave the bottom of
    the frame and only the ceiling and upper window frame are visible. The camera holds on the ceiling
    for several seconds. Then the camera tilts down at the same speed back to the original viewpoint.
    Lighting and objects remain consistent and realistic.
  camera_WM: A piece of paper burns on a plate. Lighting and objects remain consistent and realistic.
    STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a rolled piece of thick, textured off-white
    paper resting on a rustic ceramic plate. The plate sits on a wooden table. The paper is currently
    burning, with a visible orange flame and blue base on the right side of the roll. Smoke is rising
    from the burning area. The edge of the paper near the flame is blackened and charred. A window with
    a white frame is visible in the background.
  init2final_edit_prompt: Edit the given image to show the paper in a more advanced state of burning.
    Significantly increase the size of the blackened, charred area on the paper. Show more ash and structural
    degradation where the fire has consumed the material. Reduce the total surface area of unburnt white
    paper. Keep the plate, table, and background identical to the original image.
  rationale: 'The video prompt describes a camera movement that tilts up away from the subject, holds
    for several seconds, and then tilts back down. During the time the paper is out of view, the fire
    continues to burn. Burning is an irreversible chemical reaction. Therefore, when the camera returns
    to the initial viewpoint, the paper must show increased damage: a larger charred area, more ash, and
    less remaining unburnt material. The surrounding static objects (plate, table) should remain unchanged.'
