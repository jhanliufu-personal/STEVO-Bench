id: dry_autumn_leaf_crumble_03
level: 4
category: structural_transformation
tags: []
variant_of: dry_autumn_leaf_crumble
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to dense fog/steam filling the view.
changes:
  occlusion_method: Thick white fog/steam fills the environment.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands begin applying progressive crushing pressure to the dried brittle leaf. The leaf
    is severely dehydrated with very low moisture content typical of autumn leaves that have been dried
    for weeks. The brittle organic structure has lost all flexibility. The hands continue applying compressive
    force. Dense white steam rapidly fills the frame, reducing visibility to zero and completely obscuring
    the hands and leaf. The steam swirls thickly for several seconds. Then the steam dissipates quickly,
    restoring clear visibility to the scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin applying progressive crushing pressure to the dried brittle leaf. The leaf
    is severely dehydrated with very low moisture content typical of autumn leaves that have been dried
    for weeks. The brittle organic structure has lost all flexibility. The hands continue applying compressive
    force. Dense white steam rapidly fills the frame, reducing visibility to zero and completely obscuring
    the hands and leaf. The steam swirls thickly for several seconds. Then the steam dissipates quickly,
    restoring clear visibility to the scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, top-down view of two weathered hands holding a large, dry, brown
    autumn leaf against a textured beige fabric background. The leaf is currently intact, displaying a
    complex network of veins and a distinct multi-lobed shape. The thumbs are positioned on top of the
    leaf surface.
  init2final_edit_prompt: Edit the given image to show the dry leaf crushed and crumbled. The leaf should
    be broken into fragments, cracks, and debris, losing its original intact shape. The hands should be
    positioned closer together or clenched, grasping the damaged remains of the leaf. The texture of the
    leaf should appear fractured and destroyed compared to the smooth surface in the original image.
  rationale: 'The video prompt describes a physical action of crushing a brittle, dry leaf. This is an
    irreversible transformation where the leaf''s structure breaks down into fragments. The prompt includes
    a period of occlusion by steam, but explicitly states that the steam dissipates to restore clear visibility
    by the end. Therefore, the final frame must show the aftermath of the crushing action: a damaged,
    crumbled leaf held in the hands, with no steam obscuring the view.'
  questions:
  - id: leaf_structural_damage
    question: Does the leaf appear crumbled, cracked, or broken?
    answer_type: yes_no
    notes_for_judge: The leaf should no longer be a single intact sheet; it should show signs of structural
      failure.
  - id: leaf_fragmentation
    question: Are there loose fragments or pieces of the leaf visible?
    answer_type: yes_no
    notes_for_judge: Look for debris or separated pieces resulting from the crushing.
  - id: leaf_shape_change
    question: Has the leaf lost its original distinct multi-lobed shape?
    answer_type: yes_no
    notes_for_judge: The outline should be distorted or compressed due to crushing.
  - id: hand_position_compression
    question: Do the hands appear to be applying pressure or holding the object more tightly than in the
      start frame?
    answer_type: yes_no
    notes_for_judge: The hands should reflect the action of crushing, likely being closer together or
      fingers curled in.
  - id: surface_integrity
    question: Is the surface of the leaf significantly more textured with cracks or folds than the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The smooth dry surface should now be rugged and broken.
  - id: visibility_clear
    question: Is the view clear of the dense white steam mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the steam dissipates; the final frame should not be obscured.
  - id: background_consistency
    question: Is the textured beige fabric background still visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: irreversible_change
    question: Does the object look like it has undergone permanent damage?
    answer_type: yes_no
    notes_for_judge: The change should not look like simple folding that can be undone; it should look
      like breakage.
