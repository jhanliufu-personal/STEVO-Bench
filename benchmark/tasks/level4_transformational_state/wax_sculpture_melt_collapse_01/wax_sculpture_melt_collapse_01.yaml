id: wax_sculpture_melt_collapse_01
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: occlusion_method
variation_description: Replaces camera rotation with a large metal sheet sliding in front of the view.
changes:
  occlusion_method: A large opaque metal sheet slides in front of the camera, blocking the view, then
    slides away.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The heat gun is turned on high and aimed at the wax bird, blasting it with hot air. A large
    opaque metal sheet slides in from the right side, completely blocking the view of the workbench and
    the sculpture. The sheet pauses, then slides back out to the right. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The heat gun is turned on high and aimed at the wax bird, blasting it with hot air. A large
    opaque metal sheet slides in from the right side, completely blocking the view of the workbench and
    the sculpture. The sheet pauses, then slides back out to the right. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture of a bird standing on a square metal
    plate. The bird has detailed feather textures. To the left, a heat gun with an orange and silver nozzle
    is held by a gloved hand, pointed directly at the bird. There is a small amount of melted wax pooling
    at the bird's feet. The background shows a workshop workbench with tools and a vice.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture significantly melted and
    deformed. The intricate feather details should be smoothed out, blurred, and runny. The overall shape
    of the bird should appear sagging, drooping, or partially collapsed. The pool of melted wax on the
    metal plate at the base should be noticeably larger and spread out more than in the original image.
    Keep the heat gun and background unchanged.
  rationale: The video prompt describes a heat gun blasting hot air at a wax sculpture while the view
    is temporarily occluded by a metal sheet. Wax has a low melting point, so the continuous application
    of heat during the occlusion will cause the sculpture to melt further. When the occlusion is removed,
    the bird should exhibit significant structural degradation, such as loss of surface detail (feathers
    smoothing out), sagging of the overall form, and an increase in the volume of the melted wax pool
    at the base. The transformation is irreversible.
