id: knit_fabric_pull_unravel
level: 4
category: structural_transformation
transformation_type: stitch_separation_unraveling
tags: []
prompts:
  image_gen_prompt: The edge of a knitted fabric piece (sweater or scarf) is visible with a loose yarn
    end protruding from the edge. The knit structure shows interlocked loops of yarn. A hand grips the
    loose yarn end ready to pull.
  video_WM: The hand begins pulling steadily on the loose yarn end. Knitted fabric is constructed from
    a single continuous strand of yarn formed into interlocking loops. Each loop passes through the loops
    of the previous row creating a stable but mechanically separable structure. Tension applied to the
    yarn end acts to pull loops through their neighboring loops. The interlocked structure cannot spontaneously
    reform once loops are separated. The hand continues pulling the yarn with steady tension. The camera
    rotates right at constant speed until the fabric and hand completely exit the view to the right. The
    camera continues rotating right for several seconds while the hand remains off-screen continuing to
    pull the yarn. Then the camera rotates left smoothly at the same rate back to the original viewpoint,
    bringing the fabric back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins pulling steadily on the loose yarn end. Knitted fabric is constructed from
    a single continuous strand of yarn formed into interlocking loops. Each loop passes through the loops
    of the previous row creating a stable but mechanically separable structure. Tension applied to the
    yarn end acts to pull loops through their neighboring loops. The interlocked structure cannot spontaneously
    reform once loops are separated. The hand continues pulling the yarn with steady tension during the
    occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a piece of chunky, cream-colored knitted fabric
    resting on a rustic wooden table. The knitting features a stockinette stitch pattern with large, distinct
    loops. A hand (visible on the left) holds a loose end of the yarn that extends from the edge of the
    fabric. The yarn is thick and textured. The lighting is natural, casting soft shadows on the wood
    grain.
  init2final_edit_prompt: Edit the given image to show the knitted fabric significantly unraveled. Reduce
    the overall surface area of the fabric piece, removing several rows of loops from the edge where the
    yarn was attached, to simulate material loss. Render the edge of the fabric as loose and ragged where
    the loops have come undone. Depict a long, crinkled strand of unraveled yarn leading from the fabric
    edge off towards the right side of the frame. Remove the hand from the view, implying it has moved
    off-screen to the right to pull the long strand of yarn.
  rationale: 'The action involves pulling a loose thread from a knitted structure, which causes the loops
    to separate and the fabric to unravel. This is an irreversible structural change; the fabric cannot
    spontaneously re-knit itself. Since the action continues while the camera is looked away, the final
    state must show a progression of this unraveling: the fabric piece should be physically smaller (having
    lost rows of knitting), and the unraveled yarn should be longer and crinkled (retaining the memory
    of the loops). The hand, having pulled the yarn continuously, would likely be further away (off-screen)
    to accommodate the length of the unraveled strand.'
