id: knit_fabric_pull_unravel
level: 4
category: structural_transformation
transformation_type: stitch_separation_unraveling
tags: []
prompts:
  image_gen_prompt: The edge of a knitted fabric piece (sweater or scarf) is visible with a loose yarn end protruding from the edge. The knit structure shows interlocked loops of yarn. A hand grips the loose yarn end ready to pull.
  video_WM: The hand begins pulling steadily on the loose yarn end. Knitted fabric is constructed from a single continuous strand of yarn formed into interlocking loops. Each loop passes through the loops of the previous row creating a stable but mechanically separable structure. Tension applied to the yarn end acts to pull loops through their neighboring loops. The interlocked structure cannot spontaneously reform once loops are separated. The hand continues pulling the yarn with steady tension. The camera rotates right at constant speed until the fabric and hand completely exit the view to the right. The camera continues rotating right for several seconds while the hand remains off-screen continuing to pull the yarn. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the fabric back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins pulling steadily on the loose yarn end. Knitted fabric is constructed from a single continuous strand of yarn formed into interlocking loops. Each loop passes through the loops of the previous row creating a stable but mechanically separable structure. Tension applied to the yarn end acts to pull loops through their neighboring loops. The interlocked structure cannot spontaneously reform once loops are separated. The hand continues pulling the yarn with steady tension during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
