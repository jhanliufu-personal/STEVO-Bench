evaluation:
  init_frame_description: A close-up, eye-level shot of a pair of hands holding a vintage metal garlic
    press over a wooden countertop. A smooth, spherical ball of blue Play-Doh sits in the open hopper
    of the press. The upper handle with the plunger is raised, and the lower handle is held stationary.
    In the background, a whisk, a spoon, and a window are visible but out of focus.
  init2final_edit_prompt: Edit the given image to show the garlic press handles squeezed tightly together
    in a closed position. The blue Play-Doh ball inside the hopper must be crushed and flattened. Show
    bright blue strands of Play-Doh extruded and hanging from the perforated bottom of the press, resembling
    spaghetti. The hands should be gripping the handles firmly in this compressed state.
  rationale: The video prompt describes a squeezing action that continues while the scene is occluded
    by darkness. The physical properties of the Play-Doh and the garlic press dictate that the force applied
    to the handles will drive the plunger down, crushing the ball and forcing the material through the
    holes (extrusion). This is an irreversible structural change. When the lights return, the press must
    be closed and the Play-Doh must be extruded, as the action was not reversed.
