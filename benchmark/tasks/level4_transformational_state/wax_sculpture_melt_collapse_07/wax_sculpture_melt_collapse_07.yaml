id: wax_sculpture_melt_collapse_07
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: combined
variation_description: Heat gun is off and occlusion is done by a blocking object.
changes:
  occlusion_method: A large cardboard sheet blocks the view.
  dynamic_conditions: Heat gun is off.
  expected_outcome_change: The wax bird remains solid and unchanged.
prompts:
  init_frame_edit_prompt: Edit the image to make the heat gun look powered down, removing any heat distortion
    or glow.
  video_WM: The heat gun sits next to the wax bird, switched off and cold. A large piece of cardboard
    is placed in front of the camera lens, blocking the view entirely, then is removed. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The heat gun sits next to the wax bird, switched off and cold. A large piece of cardboard
    is placed in front of the camera lens, blocking the view entirely, then is removed. No zoom, no cut,
    no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a brownish-orange wax bird sculpture standing
    on a dirty metal plate. The bird features intricate feather details and a distinct beak. At its base,
    there are existing puddles of solidified wax. To the left, the nozzle of a silver and orange heat
    gun is pointed towards the bird. The background shows a workshop environment with tools like a hammer
    and pliers, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it appeared initially. The
    wax bird must remain completely intact with sharp feather details and no additional melting or deformation.
    The wax puddle at the base should not increase in size. The heat gun and background objects should
    remain in their original positions and states.
  rationale: The video prompt explicitly states that the heat gun is 'switched off and cold'. This is
    a negative constraint that overrides the visual suggestion of a melting setup. Consequently, no thermal
    energy is applied, and the wax bird must not undergo any physical transformation such as melting,
    collapsing, or losing detail. The occlusion by the cardboard is a temporary event; once removed, the
    scene should return to its initial state, verifying the model's ability to maintain object permanence
    and adhere to the text condition preventing the expected physics (melting).
