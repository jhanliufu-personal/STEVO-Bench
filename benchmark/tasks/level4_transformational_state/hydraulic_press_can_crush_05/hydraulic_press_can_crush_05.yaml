id: hydraulic_press_can_crush_05
level: 4
category: structural_transformation
tags: []
variant_of: hydraulic_press_can_crush
variation_type: dynamic_condition
variation_description: The press is moving upward (retracting) instead of downward.
changes:
  occlusion_method: null
  dynamic_conditions: Press plate is moving UP, not down.
  expected_outcome_change: The can remains uncrushed; the gap between the plate and can increases.
prompts:
  init_frame_edit_prompt: Edit the image to show the hydraulic press plate slightly raised, with a visible
    gap between the plate and the top of the soda can.
  video_WM: The hydraulic press plate moves upward, retracting away from the soda can. The release action
    is active. The camera rotates right until the press completely exits the view, then rotates toward
    the left smoothly at the same rate until the press plate area is back in the center of view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The hydraulic press plate moves upward, retracting away from the soda can. The release action
    is active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a silver aluminum soda can standing vertically
    on the dirty metal bed of a hydraulic press. The massive upper metal plate of the press is lowered
    and resting directly on the top rim of the can, making contact. In the background, there are vertical
    metal structural beams, black hydraulic hoses, and a pressure gauge visible on the right side.
  init2final_edit_prompt: Edit the given image to raise the upper metal plate of the hydraulic press significantly,
    creating a clear vertical gap of empty space between the top of the soda can and the bottom of the
    press plate. The soda can should remain standing on the bottom platform, completely intact, cylindrical,
    and uncrushed. Keep the background, lighting, and camera angle identical to the original.
  rationale: The video prompt specifies that the press plate moves upward (retracting) and the release
    action is active. Although the camera rotates away and then returns to the center, the physical action
    occurring during this time is the separation of the press plate from the can. Therefore, in the final
    frame, the plate must be higher than in the initial frame, and the can must remain uncrushed as the
    pressure has been relieved rather than applied.
