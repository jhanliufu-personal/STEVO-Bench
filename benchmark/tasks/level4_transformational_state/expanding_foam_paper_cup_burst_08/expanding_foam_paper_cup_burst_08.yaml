evaluation:
  init_frame_description: A close-up shot of a workshop table covered with a clear plastic sheet. A small
    brown paper cup sits in the center. A gloved hand enters from the right, holding a can of 'Great Stuff'
    expanding foam with a red straw nozzle positioned inside the rim of the cup. The cup appears empty.
    There are dried patches of yellow foam on the table surface. In the background, a wooden windowsill,
    a hammer, and a clamp are visible.
  init2final_edit_prompt: Edit the given image to show the paper cup partially filled with fresh, yellow
    expanding foam. The foam should appear as a bubbly, wet mound inside the cup. The paper cup itself
    must remain structurally intact and cylindrical, maintaining its original shape without bursting or
    tearing. Keep the hand, the can, the red straw, and the background details exactly as they are.
  rationale: The video prompt describes a 'slow, thin trickle' of foam being dispensed into the cup for
    several seconds, explicitly stating that there is 'no rapid pressure buildup.' This implies that while
    the cup fills with the expanding material (an irreversible state change), it does not burst or deform
    violently. The occlusion hides the dispensing process, so the final frame reveals the cup containing
    the accumulated foam. The foam expands as it cures, so visible volume should be present inside the
    cup.
