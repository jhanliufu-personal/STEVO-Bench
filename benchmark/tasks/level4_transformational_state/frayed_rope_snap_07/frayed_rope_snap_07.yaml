id: frayed_rope_snap_07
level: 4
category: structural_transformation
tags: []
variant_of: frayed_rope_snap
variation_type: combined
variation_description: New intact rope (condition) with lights turning off (occlusion).
changes:
  occlusion_method: Lights turn off leaving pitch blackness.
  dynamic_conditions: Rope is new, strong, and not frayed.
  expected_outcome_change: Rope remains intact and taut.
prompts:
  init_frame_edit_prompt: Edit the image to show a brand new, high-strength rope that is completely intact
    with no fraying or damage in the center.
  video_WM: The winches continue to pull the strong, new rope tighter. High tension is applied to the
    intact fibers. Suddenly, all lights in the facility cut out, plunging the scene into total pitch-black
    darkness. After a moment, the lights flicker and turn back on fully. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The winches continue to pull the strong, new rope tighter. High tension is applied to the
    intact fibers. Suddenly, all lights in the facility cut out, plunging the scene into total pitch-black
    darkness. After a moment, the lights flicker and turn back on fully. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, horizontal view of a thick, braided natural fiber rope stretched
    taut between two heavy industrial winches located on the left and right edges. The rope is the central
    focus, showing detailed texture of twisted fibers. The winches are dark, rusty metal with cables wound
    around them. The background is a blurred, out-of-focus industrial setting with concrete or stone textures
    and visible dust motes floating in the air.
  init2final_edit_prompt: Edit the given image to show that the rope has snapped in the center. The rope
    should be severed into two distinct pieces with frayed, unraveled ends where the break occurred. The
    two segments should appear slack or recoiled towards the left and right winches, no longer forming
    a straight taut line. Maintain the original lighting and background.
  rationale: The prompt describes winches pulling the rope tighter under high tension, followed by a blackout.
    Given the task focus on irreversible transformation and the specific ID 'frayed_rope_snap', the physical
    implication is that the rope reaches its breaking point during the occlusion. When the lights return,
    the rope should be snapped, exhibiting structural failure (separation) and material damage (fraying),
    with the tension released.
  questions:
  - id: rope_broken_01
    question: Is the rope broken into two separate pieces?
    answer_type: yes_no
    notes_for_judge: Look for a complete separation or gap in the rope.
  - id: rope_frayed_02
    question: Do the ends of the rope appear frayed or unraveled?
    answer_type: yes_no
    notes_for_judge: The break point should show loose fibers, not a clean cut.
  - id: rope_continuity_03
    question: Has the rope lost its continuous, straight horizontal form?
    answer_type: yes_no
    notes_for_judge: It should no longer be a single taut line.
  - id: rope_slack_04
    question: Do the rope segments appear slack or recoiled compared to the initial taut state?
    answer_type: yes_no
    notes_for_judge: If the rope snapped, the tension should be released, causing the ends to drop or
      pull back.
  - id: structural_integrity_05
    question: Is the structural integrity of the rope visibly compromised?
    answer_type: yes_no
    notes_for_judge: Check for severe damage, tearing, or snapping.
  - id: gap_presence_06
    question: Is there a visible gap between the left and right sections of the rope?
    answer_type: yes_no
    notes_for_judge: There should be empty space where the rope used to be connected.
  - id: winches_visible_07
    question: Are the winches still visible on the left and right sides of the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: lighting_restored_08
    question: Is the scene clearly illuminated?
    answer_type: yes_no
    notes_for_judge: The prompt states the lights turn back on fully.
