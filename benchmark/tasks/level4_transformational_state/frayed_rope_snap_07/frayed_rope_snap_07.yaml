evaluation:
  init_frame_description: A close-up, horizontal view of a thick, braided natural fiber rope stretched
    taut between two heavy industrial winches located on the left and right edges. The rope is the central
    focus, showing detailed texture of twisted fibers. The winches are dark, rusty metal with cables wound
    around them. The background is a blurred, out-of-focus industrial setting with concrete or stone textures
    and visible dust motes floating in the air.
  init2final_edit_prompt: Edit the given image to show that the rope has snapped in the center. The rope
    should be severed into two distinct pieces with frayed, unraveled ends where the break occurred. The
    two segments should appear slack or recoiled towards the left and right winches, no longer forming
    a straight taut line. Maintain the original lighting and background.
  rationale: The prompt describes winches pulling the rope tighter under high tension, followed by a blackout.
    Given the task focus on irreversible transformation and the specific ID 'frayed_rope_snap', the physical
    implication is that the rope reaches its breaking point during the occlusion. When the lights return,
    the rope should be snapped, exhibiting structural failure (separation) and material damage (fraying),
    with the tension released.
