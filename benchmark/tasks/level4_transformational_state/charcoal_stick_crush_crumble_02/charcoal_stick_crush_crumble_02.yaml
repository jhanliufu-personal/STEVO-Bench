id: charcoal_stick_crush_crumble_02
level: 4
category: structural_transformation
tags: []
variant_of: charcoal_stick_crush_crumble
variation_type: occlusion_method
variation_description: Uses a large sketchpad to block the view instead of moving the camera.
changes:
  occlusion_method: A large opaque sketchpad moves into the foreground to block the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. A large, opaque artist's sketchpad moves into the foreground from the left, completely
    blocking the view of the hand and charcoal. The sketchpad remains in place for several seconds while
    the squeezing continues behind it. The sketchpad then moves away to the right, revealing the scene
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. A large, opaque artist's sketchpad moves into the foreground from the left, completely
    blocking the view of the hand and charcoal. The sketchpad remains in place for several seconds while
    the squeezing continues behind it. The sketchpad then moves away to the right, revealing the scene
    again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up first-person view of a left hand holding a thick, cylindrical stick
    of black artist's charcoal. The charcoal has a highly porous, textured surface with visible pits.
    The hand is stained with black charcoal dust, particularly on the fingertips and palm. The background
    is a blurred wooden table surface with white papers containing charcoal sketches, drawing tools like
    a knife and blending stumps, and a window in the upper left providing natural light.
  init2final_edit_prompt: Edit the given image to show the charcoal stick crushed and crumbled within
    the hand. The single solid cylinder must be fractured into multiple jagged chunks, smaller fragments,
    and loose black dust. The fingers should be clenched closer together, gripping the broken remains
    of the charcoal. The hand should appear significantly dirtier, covered in fresh black dust and debris
    from the crushed material. The original cylindrical form of the stick should be destroyed.
  rationale: The prompt specifies that the charcoal is a brittle, porous material subject to progressive
    squeezing pressure. Unlike malleable materials that deform, brittle charcoal fractures and crumbles
    under compression. The occlusion hides the duration of the squeezing, but the instruction implies
    a continuous application of force. Therefore, upon the removal of the occlusion, the charcoal stick
    should have undergone irreversible structural failure, appearing broken, fragmented, or crumbled rather
    than intact.
  questions:
  - id: structural_integrity_loss
    question: Is the charcoal stick broken into multiple pieces, fragments, or crumbs?
    answer_type: yes_no
    notes_for_judge: The object should no longer be a single solid cylinder.
  - id: shape_change
    question: Has the original cylindrical shape of the charcoal been destroyed or significantly deformed?
    answer_type: yes_no
    notes_for_judge: The smooth cylindrical form should be replaced by irregular broken shapes.
  - id: debris_presence
    question: Are there visible loose crumbs, dust, or small fragments that were not present initially?
    answer_type: yes_no
    notes_for_judge: Look for small particles resulting from the crushing.
  - id: finger_position
    question: Are the fingers clenched closer together than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the object crumbles, the grip should tighten/collapse inward.
  - id: material_state
    question: Does the object appear to have lost its structural cohesion compared to the start?
    answer_type: yes_no
    notes_for_judge: It should look like a pile of debris or broken parts held in the hand.
  - id: background_consistency
    question: Do the art supplies and papers in the background remain in the same relative position?
    answer_type: yes_no
    notes_for_judge: Secondary check for scene consistency.
