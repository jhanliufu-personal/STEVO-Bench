variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, first-person perspective shot of a left hand holding a thick, cylindrical
    stick of black artist's charcoal. The charcoal has a highly porous, textured surface. The hand is
    visibly stained with black charcoal dust, particularly on the fingertips and palm. The fingers are
    wrapped around the stick in a loose grip. The background is a blurred wooden table surface with white
    paper containing charcoal sketches, other charcoal sticks, and art supplies.
  init2final_edit_prompt: Edit the given image so that the charcoal stick appears crushed and broken within
    the hand. The single cylindrical form should be fractured into multiple irregular pieces, crumbs,
    or dust. The structural integrity of the stick should be visibly destroyed, with cracks and fragmentation
    replacing the solid shape. The fingers should be clenched tighter, compressing the broken fragments.
    Ensure the background and lighting remain unchanged.
  rationale: The prompt describes the application of progressive squeezing pressure on a brittle, porous
    charcoal stick. Physically, this material has low tensile and compressive strength. As force increases,
    the charcoal will exceed its yield point and fracture, likely snapping or crumbling into smaller pieces
    and dust. The final state must reflect this irreversible structural failure, showing the stick broken
    and the hand closing in on the void left by the collapsing material.
  questions:
  - id: structural_integrity_01
    question: Is the charcoal stick broken, fractured, or crumbled compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for loss of the solid cylindrical shape.
  - id: fragmentation_01
    question: Are there multiple separate pieces or fragments of charcoal visible now?
    answer_type: yes_no
    notes_for_judge: The object should no longer be a single unit.
  - id: deformation_01
    question: Has the original cylindrical shape of the charcoal been deformed or destroyed?
    answer_type: yes_no
    notes_for_judge: The outline should be irregular due to crushing.
  - id: debris_01
    question: Is there visible charcoal dust or small crumbs that were not present initially?
    answer_type: yes_no
    notes_for_judge: Crushing brittle material produces debris.
  - id: grip_tightness_01
    question: Do the fingers appear to be clenched tighter or pressing further inward than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: As the object collapses, the grip should tighten.
  - id: irreversibility_01
    question: Does the object show signs of irreversible damage (cracks, breaks, disintegration)?
    answer_type: yes_no
    notes_for_judge: The change must be destructive.
  - id: background_consistency_01
    question: Are the art supplies in the background (paper, other sticks) still in the same relative
      position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
