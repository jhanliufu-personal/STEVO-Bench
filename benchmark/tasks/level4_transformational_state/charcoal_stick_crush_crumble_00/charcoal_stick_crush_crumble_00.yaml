evaluation:
  init_frame_description: A close-up, first-person perspective shot of a left hand holding a thick, cylindrical
    stick of black artist's charcoal. The charcoal has a highly porous, textured surface. The hand is
    visibly stained with black charcoal dust, particularly on the fingertips and palm. The fingers are
    wrapped around the stick in a loose grip. The background is a blurred wooden table surface with white
    paper containing charcoal sketches, other charcoal sticks, and art supplies.
  init2final_edit_prompt: Edit the given image so that the charcoal stick appears crushed and broken within
    the hand. The single cylindrical form should be fractured into multiple irregular pieces, crumbs,
    or dust. The structural integrity of the stick should be visibly destroyed, with cracks and fragmentation
    replacing the solid shape. The fingers should be clenched tighter, compressing the broken fragments.
    Ensure the background and lighting remain unchanged.
  rationale: The prompt describes the application of progressive squeezing pressure on a brittle, porous
    charcoal stick. Physically, this material has low tensile and compressive strength. As force increases,
    the charcoal will exceed its yield point and fracture, likely snapping or crumbling into smaller pieces
    and dust. The final state must reflect this irreversible structural failure, showing the stick broken
    and the hand closing in on the void left by the collapsing material.
