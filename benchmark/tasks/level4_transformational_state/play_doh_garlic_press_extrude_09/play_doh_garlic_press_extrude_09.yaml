prompts:
  init_frame_edit_prompt: Edit the image to remove the blue Play-Doh ball completely, showing an empty
    metal garlic press chamber.
  video_WM: The hands begin squeezing the garlic press handles together. The chamber is empty, containing
    no material. The mechanism moves freely with no resistance. Thick white smoke begins to billow into
    the frame, quickly becoming so dense that the hands and press are completely obscured. The smoke swirls
    and blocks all visibility for several seconds while the hands continue to operate the press within
    the cloud. The smoke then dissipates and clears away, revealing the scene again. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The hands begin squeezing the garlic press handles together. The chamber is empty, containing
    no material. The mechanism moves freely with no resistance. Thick white smoke begins to billow into
    the frame, quickly becoming so dense that the hands and press are completely obscured. The smoke swirls
    and blocks all visibility for several seconds while the hands continue to operate the press within
