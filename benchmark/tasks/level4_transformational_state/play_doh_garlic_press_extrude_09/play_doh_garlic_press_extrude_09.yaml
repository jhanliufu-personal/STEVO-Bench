evaluation:
  init_frame_description: A close-up shot of a pair of hands holding a vintage metal garlic press over
    a wooden surface. The press is in an open position with the top handle raised and the plunger visible
    above the empty chamber. A metal whisk and a spoon are visible in the background on the left.
  init2final_edit_prompt: Edit the given image to show the garlic press in a fully closed position. The
    top handle should be lowered and squeezed against the bottom handle. The plunger should be fully inserted
    into the chamber. The hands should be gripping the handles tightly together. Do not add any smoke.
    Do not add any extruded material or food; the press should remain empty.
  rationale: The video prompt describes the hands squeezing the garlic press handles together. Although
    smoke obscures the action, the physical result of squeezing an empty press is that the mechanism closes.
    Since the prompt explicitly states the chamber is empty, no material is extruded or deformed. The
    final state is simply the press in a closed configuration with the handles brought together.
