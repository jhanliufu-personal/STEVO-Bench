evaluation:
  init_frame_description: A close-up, eye-level shot of a pair of hands holding a metal garlic press over
    a wooden countertop. The press is open, with the top lever arm raised. A smooth, spherical ball of
    blue Play-Doh sits inside the press's chamber, protruding above the rim. The hands appear to be dusted
    with white flour. In the background, slightly out of focus, are a wire whisk, a spoon, a wooden cutting
    board, and kitchen utensils in a crock near a window.
  init2final_edit_prompt: Edit the given image so that the handles of the garlic press are squeezed significantly
    closer together. The blue Play-Doh ball inside the chamber must appear compressed, flattened, and
    pushed down by the plunger. Show distinct blue strands of Play-Doh extruding from the bottom of the
    press basket. The hands should be gripping the handles in a closed or nearly closed position.
  rationale: The video prompt describes a squeezing action where the plunger applies pressure to the Play-Doh.
    Since Play-Doh is a plastic material, it will deform under this pressure. The prompt specifies that
    the material flows through the holes, creating an extrusion effect. Therefore, the final state must
    show the handles closed, the source ball flattened/consumed, and the material emerging as strands
    from the bottom, representing an irreversible structural transformation.
