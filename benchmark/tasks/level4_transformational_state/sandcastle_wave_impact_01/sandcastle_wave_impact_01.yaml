id: sandcastle_wave_impact_01
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to thick sea spray/mist obscuring the view.
changes:
  occlusion_method: Thick sea spray/mist fills the frame
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. The impact
    throws up a massive cloud of thick sea spray and mist that completely fills the frame, obscuring all
    vision of the beach. The mist slowly dissipates and clears. No cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. The
    impact throws up a massive cloud of thick sea spray and mist that completely fills the frame, obscuring
    all vision of the beach. The mist slowly dissipates and clears. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed sandcastle with multiple towers, a bridge, and shell decorations
    sits on a sandy beach. A massive, green ocean wave is curling directly behind and over the sandcastle,
    poised to crash. In the background to the right, people are standing on the shore. The sky is cloudy.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The elaborate
    sandcastle structure should be destroyed, appearing as a flattened, shapeless mound of wet sand or
    completely washed away. The distinct towers, walls, and bridge should be collapsed or missing. The
    large looming wave should be gone, replaced by receding white foam, shallow water, or wet sand covering
    the area where the castle stood. The sand surface should appear wet and smooth.
  rationale: The video prompt describes a large wave crashing directly onto the sandcastle with force.
    Physically, a wave of that magnitude impacting a fragile sand structure will result in its destruction.
    The rollout includes a period of total occlusion by mist/spray, during which the destruction occurs.
    When the mist clears, the irreversible transformation (collapse and erosion of the sandcastle) must
    be visible. The wave itself will have dissipated into foam or receded, leaving the sand wet.
  questions:
  - id: sandcastle_destroyed
    question: Is the elaborate structure of the sandcastle (towers, walls) significantly damaged or destroyed?
    answer_type: yes_no
    notes_for_judge: The sandcastle should no longer be a pristine structure; it should be flattened,
      collapsed, or washed away.
  - id: height_reduction
    question: Is the height of the sand structure significantly lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The pile of sand remaining should be much shorter than the original towers.
  - id: towers_collapsed
    question: Are the pointed towers of the sandcastle collapsed or missing?
    answer_type: yes_no
    notes_for_judge: Specific structural features like the towers should be gone.
  - id: wave_dissipated
    question: Has the large curling wave from the initial frame dissipated or receded?
    answer_type: yes_no
    notes_for_judge: The looming wall of water should be gone, replaced by foam, water, or wet sand.
  - id: sand_wetness
    question: Does the sand around the castle area appear wetter or smoother than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Evidence of the water washing over the area.
  - id: bridge_gone
    question: Is the bridge connecting the sandcastle sections collapsed or missing?
    answer_type: yes_no
    notes_for_judge: Check for the specific bridge structure.
  - id: structural_integrity
    question: Has the sandcastle lost its defined architectural form (windows, battlements)?
    answer_type: yes_no
    notes_for_judge: The sharp details should be smoothed out or destroyed.
  - id: background_consistency
    question: Are the beach and sky in the background still recognizable?
    answer_type: yes_no
    notes_for_judge: The setting should remain consistent despite the destruction of the foreground object.
