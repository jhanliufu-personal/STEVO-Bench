variation_description: Occlusion changed to water splashing the camera lens.
changes:
  occlusion_method: Sea spray/water splashes lens
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. Immediately
    upon impact, a massive splash of sea spray and foam hits the camera lens, completely obscuring the
    view with water droplets and white noise. The water slowly drips off and clears to reveal the scene
    again. No cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. Immediately
    upon impact, a massive splash of sea spray and foam hits the camera lens, completely obscuring the
    view with water droplets and white noise. The water slowly drips off and clears to reveal the scene
    again. No cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed sandcastle with multiple towers, walls, a bridge, and shell decorations
    sits on a sandy beach. A massive, green ocean wave is curling and looming directly behind and over
    the sandcastle, about to crash. The sky is overcast and stormy. The sand around the castle is textured
    and relatively dry in the foreground.
  init2final_edit_prompt: Edit the given image to show the aftermath of the wave crashing. The intricate
    sandcastle structure must be destroyed, appearing as a flattened, eroded mound of wet sand or completely
    washed away, leaving only smooth wet sand and scattered debris. The large looming wave in the background
    should be replaced by receding white foam, mist, and turbulent water on the beach surface. The sand
    in the foreground should appear significantly wetter and smoother than in the original image.
  rationale: The video prompt describes a large wave crashing directly onto the sandcastle, followed by
    a splash that obscures the view and then clears. Physically, a sandcastle cannot withstand the direct
    impact of a wave of this magnitude. Therefore, the final state must show the irreversible destruction
    of the sandcastle structure (flattening, erosion, collapse). The wave itself will have transitioned
    from a potential energy state (looming curl) to a kinetic/dissipated state (foam and receding water).
    The camera remains in the same position, revealing the damage after the occlusion clears.
