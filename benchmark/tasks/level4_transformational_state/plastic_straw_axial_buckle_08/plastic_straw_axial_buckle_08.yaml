prompts:
  init_frame_edit_prompt: Edit the image to replace the translucent plastic straw with a solid, shiny
    steel rod of the same diameter.
  video_WM: The hands begin moving toward each other, applying axial compression force along the length
    of the steel rod. Solid metal cylinders possess extremely high flexural rigidity and a critical buckling
    load far exceeding human strength. The material behaves elastically with high resistance to deformation.
    The hands continue applying progressive compressive force. Suddenly, a large wooden board slides in
    from the left, completely blocking the view of the hands and rod. The board remains stationary for
    several seconds while the compression attempt continues behind it. Then the board slides back out
    to the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin moving toward each other, applying axial compression force along the length
