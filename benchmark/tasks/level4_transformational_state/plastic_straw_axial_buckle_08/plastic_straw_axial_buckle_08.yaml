evaluation:
  init_frame_description: A close-up, eye-level shot showing a pair of hands holding a vertical, silver-colored
    metal rod (resembling a steel cylinder) against a plain light-brown wooden table background. The hands
    grasp the rod at the very top and bottom ends. The rod is perfectly straight, shiny, and reflects
    light, indicating a hard metallic material.
  init2final_edit_prompt: Edit the given image to show the steel rod remaining perfectly straight and
    unbent. The hands should continue to grasp the ends of the rod firmly. Ensure the rod exhibits absolutely
    no buckling, bending, kinking, or deformation, reflecting its high structural rigidity. The scene
    should look visually identical to the initial state regarding the rod's linear shape and integrity.
  rationale: The video prompt explicitly identifies the object as a 'solid metal cylinder' (steel rod)
    and states that its critical buckling load 'far exceeds human strength'. It further notes that the
    material behaves elastically. Therefore, despite the description of hands applying compressive force,
    the physics dictated by the prompt ensure that the rod will NOT buckle, bend, or break. The correct
    final state is a rod that remains perfectly straight and intact, as human force is insufficient to
    deform a solid steel cylinder of this geometry. The occlusion serves to hide the duration of the effort,
    but the outcome is determined by the material properties described.
