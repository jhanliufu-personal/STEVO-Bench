id: graham_cracker_compress_powder_07
level: 4
category: structural_transformation
tags: []
variant_of: graham_cracker_compress_powder
variation_type: combined
variation_description: Soft bread material combined with object blocking occlusion.
changes:
  occlusion_method: Object blocking (kitchen towel)
  dynamic_conditions: 'Material change: Soft bread'
  expected_outcome_change: Object flattens/compresses plastically
prompts:
  init_frame_edit_prompt: Edit the image to replace the graham cracker inside the bag with a slice of
    soft white bread.
  video_WM: The hand presses down on the slice of white bread through the plastic bag with progressive
    force. White bread is a soft, porous foam structure that deforms plastically under compression but
    does not fracture. The hand applies pressing motions to distribute force across the bread surface.
    A large opaque kitchen towel is placed over the plastic bag and hand, completely blocking the view.
    The hand continues to apply pressure underneath the towel. Then the towel is removed to reveal the
    scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses down on the slice of white bread through the plastic bag with progressive
    force. White bread is a soft, porous foam structure that deforms plastically under compression but
    does not fracture. The hand applies pressing motions to distribute force across the bread surface.
    A large opaque kitchen towel is placed over the plastic bag and hand, completely blocking the view.
    The hand continues to apply pressure underneath the towel. Then the towel is removed to reveal the
    scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A slice of white sandwich bread is enclosed inside a clear plastic ziplock bag
    lying flat on a wooden table. A human hand is positioned directly above the bag, hovering or lightly
    touching the plastic surface. The bread appears soft, fluffy, and porous with a visible crust. The
    background shows the wooden table surface and a window in the distance.
  init2final_edit_prompt: Edit the given image so that the slice of white bread inside the plastic bag
    appears significantly flattened and compressed. The bread should look squished, thin, and dense, having
    lost its original fluffy height and porous texture. The plastic bag should appear wrinkled and pressed
    flat against the deformed bread.
  rationale: The video describes a physical interaction where a hand compresses a slice of white bread.
    White bread is a foam that undergoes plastic deformation when pressed; it collapses and does not spring
    back to its original shape. The occlusion by the towel hides the continuous pressing action. When
    the towel is removed, the bread remains in its compressed, flattened state due to the irreversible
    nature of the deformation. The final frame should show the bread with significantly reduced volume
    and a denser texture.
  questions:
  - id: bread_flattened
    question: Does the slice of bread appear significantly flatter than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the apparent thickness/volume of the bread. It should look squished or compressed.
  - id: bread_compressed_texture
    question: Does the bread look denser and less fluffy compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The texture should change from porous/fluffy to smooth/dense due to compression.
  - id: bread_deformation
    question: Has the bread been visibly squished or deformed from its original shape?
    answer_type: yes_no
    notes_for_judge: Look for signs of plastic deformation like spreading or indentation.
  - id: bag_conforms
    question: Is the plastic bag pressed more tightly against the bread than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The bag should conform to the flattened shape of the bread.
  - id: bread_integrity
    question: Is the bread still a single cohesive piece rather than crumbled into fragments?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the bread deforms but does not fracture. It should be flattened,
      not broken.
  - id: table_visible
    question: Is the wooden table surface still visible in the background?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: bag_presence
    question: Is the bread still contained within the plastic bag?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
