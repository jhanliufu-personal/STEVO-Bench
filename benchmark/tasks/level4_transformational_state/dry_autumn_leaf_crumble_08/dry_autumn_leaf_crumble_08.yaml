evaluation:
  init_frame_description: A close-up, top-down view of a pair of hands gently holding a large, dry, brown
    autumn leaf against a neutral, textured fabric background. The leaf is brittle with prominent veins
    and jagged edges. The hands hold the leaf by its sides and near the stem base, with fingers slightly
    curled but not squeezing. The leaf is fully intact with no visible cracks or missing pieces.
  init2final_edit_prompt: Edit the given image to ensure the dry autumn leaf remains completely intact
    and structurally unchanged. The leaf should retain its full original shape, size, and surface texture
    without any signs of crumbling, cracking, tearing, or fragmentation. The hands should continue to
    hold the leaf in the same gentle position.
  rationale: The video prompt explicitly instructs that the hands maintain a gentle grip and that the
    delicate structure of the leaf is preserved throughout the sequence. Although a wooden board temporarily
    occludes the view, the prompt dictates that no crushing force is applied and the leaf remains unharmed.
    Therefore, the final state must show the leaf exactly as it was initially—intact and unbroken—testing
    the model's ability to follow negative constraints against the physical bias of brittle objects crumbling.
  questions:
  - id: leaf_intact
    question: Is the dry leaf still completely intact?
    answer_type: yes_no
    notes_for_judge: The leaf should not show any signs of breaking or crumbling.
  - id: leaf_shape_preserved
    question: Does the leaf retain its original shape without any missing pieces?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame; the outline should be identical.
  - id: no_crumbling
    question: Is the leaf free from any visible crumbling or fragmentation?
    answer_type: yes_no
    notes_for_judge: There should be no small debris or broken fragments.
  - id: no_cracks
    question: Is the surface of the leaf free from new cracks or fractures?
    answer_type: yes_no
    notes_for_judge: The texture should remain continuous as in the first frame.
  - id: structural_integrity
    question: Is the leaf's structural integrity maintained compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The leaf should look solid and not damaged.
  - id: hands_gentle
    question: Do the hands appear to be holding the leaf gently without crushing it?
    answer_type: yes_no
    notes_for_judge: Fingers should not be clenched into the leaf.
  - id: visibility
    question: Is the leaf fully visible again?
    answer_type: yes_no
    notes_for_judge: The occluding board should have been removed.
