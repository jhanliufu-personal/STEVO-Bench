  dynamic_conditions: Gentle grip, no crushing force.
  expected_outcome_change: Leaf remains intact.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands hold the dried brittle leaf with extreme care. The fingers maintain a static, gentle
    grip without exerting any crushing force whatsoever. The delicate structure is preserved. A large,
    opaque wooden board slides into the frame from the left, completely blocking the hands and leaf from
    view. The board remains stationary for several seconds while the hands continue to hold the leaf gently
    behind it. Then the board slides back out to the left, revealing the scene again. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The hands hold the dried brittle leaf with extreme care. The fingers maintain a static, gentle
    grip without exerting any crushing force whatsoever. The delicate structure is preserved. A large,
    opaque wooden board slides into the frame from the left, completely blocking the hands and leaf from
    view. The board remains stationary for several seconds while the hands continue to hold the leaf gently
