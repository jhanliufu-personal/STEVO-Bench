id: plastic_cup_heat_source_warp_02
level: 4
category: structural_transformation
tags: []
variant_of: plastic_cup_heat_source_warp
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to the lights turning off.
changes:
  occlusion_method: The workshop lights turn off, plunging the scene into darkness.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Hot air from the heat gun flows toward the plastic cup. The cup is made from polystyrene plastic
    which has a glass transition temperature around 212°F. When thermoplastic polymers are heated above
    their glass transition point, the polymer chains gain mobility and the material loses structural rigidity.
    The material is subject to gravitational forces and internal stresses. Thermoplastics retain the shape
    they have when cooled back below glass transition temperature. The heat gun continues directing hot
    air at the cup. Suddenly, the workshop lights turn off completely, leaving the scene in pitch black
    darkness. The darkness persists for several seconds while the heat gun continues running audibly in
    the dark. Then the lights turn back on, illuminating the scene again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: Hot air from the heat gun flows toward the plastic cup. The cup is made from polystyrene
    plastic which has a glass transition temperature around 212°F. When thermoplastic polymers are heated
    above their glass transition point, the polymer chains gain mobility and the material loses structural
    rigidity. The material is subject to gravitational forces and internal stresses. Thermoplastics retain
    the shape they have when cooled back below glass transition temperature. The heat gun continues directing
    hot air at the cup. Suddenly, the workshop lights turn off completely, leaving the scene in pitch
    black darkness. The darkness persists for several seconds while the heat gun continues running audibly
    in the dark. Then the lights turn back on, illuminating the scene again. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A red plastic Solo cup sits on a light-colored wooden workbench on the left.
    To the right, an orange heat gun is mounted on a stand, pointing its metallic nozzle directly at the
    cup. The background is a workshop environment with various tools like chisels and screwdrivers lying
    on the table out of focus. The cup appears to have a white interior rim.
  init2final_edit_prompt: Edit the given image to show the red plastic cup significantly warped, melted,
    and deformed. The side of the cup facing the heat gun should appear shriveled, sagging, or collapsed
    due to heat exposure. The cup's shape should be irregular and distorted, losing its smooth cylindrical
    form. Keep the heat gun, the wooden table, and the background tools exactly as they are.
  rationale: The heat gun directs hot air at the thermoplastic cup, raising its temperature above the
    glass transition point. This causes the polymer chains to relax, releasing internal manufacturing
    stresses and causing the material to soften and deform under gravity and airflow. The period of darkness
    acts as a temporal occlusion where the heating process continues unseen. When the lights return, the
    cup should exhibit significant cumulative deformation (melting, shrinking, or warping) that occurred
    during the elapsed time.
  questions:
  - id: deformation_visible
    question: Is the red plastic cup visibly deformed compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for any change in shape from the original cylinder.
  - id: melting_facing_source
    question: Does the side of the cup facing the heat gun show signs of melting, shriveling, or warping?
    answer_type: yes_no
    notes_for_judge: The damage should be concentrated or most visible on the side nearest the heat source.
  - id: loss_of_symmetry
    question: Has the cup lost its original symmetrical cylindrical shape?
    answer_type: yes_no
    notes_for_judge: The cup should no longer look like a perfect cylinder.
  - id: rim_distortion
    question: Is the rim of the cup distorted or uneven?
    answer_type: yes_no
    notes_for_judge: The top edge should likely be warped.
  - id: structural_collapse
    question: Does the cup appear to have sagged or collapsed due to loss of rigidity?
    answer_type: yes_no
    notes_for_judge: Check if the cup looks shorter or slumped.
  - id: heat_gun_presence
    question: Is the orange heat gun still present and pointing at the cup?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_tools_consistency
    question: Are the tools in the background still in their original positions?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
