  image_gen_prompt: A cut end of three-strand twisted rope is visible with the individual strands clearly distinguished. Two hands hold the rope, with fingers positioned to grip individual strands and pull them apart. The rope end shows the helical twist structure of braided fibers.
  video_WM: The fingers begin pulling and untwisting the individual rope strands away from each other. Braided rope consists of three separate fiber bundles twisted together in a helical pattern. The structural integrity depends on the strands remaining intertwined under twisting tension. The fingers apply force to unwind and separate the twisted structure. The fingers continue progressive untwisting and separation of the strands. The camera rotates right at constant speed until the hands and rope completely exit the view to the right. The camera continues rotating right for several seconds while the hands remain off-screen continuing to untwist the rope. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the hands and rope back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The fingers begin pulling and untwisting the individual rope strands away from each other. Braided rope consists of three separate fiber bundles twisted together in a helical pattern. The structural integrity depends on the strands remaining intertwined under twisting tension. The fingers apply force to unwind and separate the twisted structure. The fingers continue progressive untwisting and separation of the strands during the occlusion period. STOP.
