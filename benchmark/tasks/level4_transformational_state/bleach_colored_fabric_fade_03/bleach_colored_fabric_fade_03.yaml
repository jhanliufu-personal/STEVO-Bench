id: bleach_colored_fabric_fade_03
level: 4
category: structural_transformation
tags: []
variant_of: bleach_colored_fabric_fade
variation_type: occlusion_method
variation_description: Replaces camera rotation with an extreme zoom out until details are lost.
changes:
  occlusion_method: Camera zooms out rapidly until the tray is a tiny dot, then zooms back in.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (bleached spot appears).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The bleach bottle tips and pours liquid bleach onto the dark blue fabric surface. Household
    bleach contains sodium hypochlorite which is a strong oxidizing agent that reacts with organic dye
    molecules. The chemical oxidation process is irreversible at room temperature. The bleach continues
    to contact and saturate the fabric fibers. The camera zooms out rapidly and continuously, moving backward
    until the tray becomes a tiny, indistinguishable speck in the distance. The camera holds this distant
    position for several seconds while the bleach remains in contact with the fabric. Then, the camera
    zooms in smoothly back to the original framing. No cut, no scene change. STOP.
  camera_WM: The bleach bottle tips and pours liquid bleach onto the dark blue fabric surface. Household
    bleach contains sodium hypochlorite which is a strong oxidizing agent that reacts with organic dye
    molecules. The chemical oxidation process is irreversible at room temperature. The bleach continues
    to contact and saturate the fabric fibers during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
  Genie: null
evaluation:
  init_frame_description: A top-down view of a white plastic tray containing a square piece of wrinkled
    dark blue fabric. A hand is holding a white Clorox bleach bottle in the upper right corner, tilted
    downward with droplets of liquid bleach beginning to fall towards the center of the fabric.
  init2final_edit_prompt: Edit the given image to show a visible, irregular discolored stain on the center
    of the dark blue fabric. The stain should appear lighter than the surrounding fabric, taking on an
    orange, pink, or whitish hue typical of bleach damage on dark dye. The fabric surface in the stained
    area should appear wet and saturated.
  rationale: The video depicts liquid bleach being poured onto dark blue fabric. Bleach (sodium hypochlorite)
    acts as a strong oxidizing agent, irreversibly breaking down the chemical bonds of the dye molecules
    (chromophores). This reaction causes the dark blue color to fade or shift to orange, pink, or white.
    The camera zooms out and holds for several seconds, allowing time for this chemical reaction to occur
    and become visually apparent. When the camera zooms back in, the fabric must show this permanent discoloration
    where the bleach made contact.
  questions:
  - id: bleach_stain_visible
    question: Is there a visible discolored spot on the fabric that was not present in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for a lighter area (orange, pink, white, or light blue) on the dark fabric.
  - id: bleach_color_change
    question: Is the discolored area lighter in color than the surrounding dark blue fabric?
    answer_type: yes_no
    notes_for_judge: The bleach should remove the dark dye, resulting in a lighter tone.
  - id: bleach_hue_shift
    question: Does the fabric show signs of chemical bleaching, such as an orange, pink, or white stain?
    answer_type: yes_no
    notes_for_judge: Bleach often turns dark blue fabric to these colors.
  - id: fabric_wetness
    question: Does the fabric appear wet or saturated in the central area?
    answer_type: yes_no
    notes_for_judge: The prompt describes pouring liquid and saturation.
  - id: irreversible_change
    question: Has the uniform dark blue color of the fabric been permanently altered in the center?
    answer_type: yes_no
    notes_for_judge: Check for loss of the original color uniformity.
  - id: tray_consistency
    question: Is the white plastic tray still visible beneath the fabric?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: fabric_position
    question: Is the fabric still positioned centrally on the tray?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
