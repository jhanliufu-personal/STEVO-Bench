id: aluminum_foil_crumple_ball_09
level: 4
category: structural_transformation
tags: []
variant_of: aluminum_foil_crumple_ball
variation_type: combined
variation_description: Tissue paper (condition) + Thick fog (occlusion).
changes:
  occlusion_method: Thick fog fills the room.
  dynamic_conditions: Tissue paper (soft/fibrous).
  expected_outcome_change: Crumples into soft ball.
prompts:
  init_frame_edit_prompt: Edit the image to replace the aluminum foil with a thin sheet of white tissue
    paper.
  video_WM: The hands begin gathering the edges of the tissue paper inward. Tissue paper is a soft, fibrous
    material with very low structural integrity. It compresses easily with minimal force and does not
    hold sharp, rigid creases like metal foil. Thick, opaque white fog rapidly fills the room, obscuring
    the table and hands completely until visibility is zero. The hands continue compressing the paper
    within the fog. After several seconds, the fog clears rapidly, restoring visibility to the original
    viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin gathering the edges of the tissue paper inward. Tissue paper is a soft, fibrous
    material with very low structural integrity. It compresses easily with minimal force and does not
    hold sharp, rigid creases like metal foil. Thick, opaque white fog rapidly fills the room, obscuring
    the table and hands completely until visibility is zero. The hands continue compressing the paper
    within the fog. After several seconds, the fog clears rapidly, restoring visibility to the original
    viewpoint. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A top-down view of a wooden table with a rectangular sheet of white, semi-translucent
    tissue paper laid flat in the center. The paper has visible crease lines from previous folding. Two
    male hands are resting on the table, with fingers touching the left and right edges of the paper.
    A window is visible in the upper left corner.
  init2final_edit_prompt: Edit the given image to show the sheet of tissue paper crumpled into a soft,
    compressed ball or irregular mass in the center of the table. The paper should occupy a significantly
    smaller surface area than the original flat sheet and exhibit a highly textured, wrinkled appearance
    typical of soft fibrous material. The hands should be positioned closer together, cupping or holding
    the crumpled paper mass.
  rationale: The video prompt describes a process of crumpling tissue paper that continues while the scene
    is obscured by fog. Since the hands continue compressing the paper during the occlusion, the final
    state upon the fog clearing must show the paper transformed from a flat sheet into a crumpled ball
    or mass. The material is specified as tissue paper, implying soft, irregular compression rather than
    sharp, rigid geometric creases. The hands must have moved inward to facilitate this compression.
  questions:
  - id: state_change_crumpled
    question: Is the paper crumpled into a ball or irregular mass instead of lying flat?
    answer_type: yes_no
    notes_for_judge: The paper should no longer be a flat rectangular sheet.
  - id: state_change_area
    question: Does the paper occupy a significantly smaller area on the table compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Crumpling reduces the visible surface area.
  - id: state_change_texture
    question: Does the paper exhibit a complex, wrinkled texture that was not present in the initial flat
      sheet?
    answer_type: yes_no
    notes_for_judge: Look for high-frequency wrinkles and folds indicative of crumpling.
  - id: state_change_hands_position
    question: Are the hands positioned closer to the center of the table than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The hands must move inward to crumple the paper.
  - id: state_change_form
    question: Has the paper lost its original rectangular outline?
    answer_type: yes_no
    notes_for_judge: The straight edges should be distorted or gathered inward.
  - id: consistency_table
    question: Is the wooden table texture still visible?
    answer_type: yes_no
    notes_for_judge: The background environment should remain consistent.
  - id: consistency_window
    question: Is the window in the upper left corner still visible?
    answer_type: yes_no
    notes_for_judge: Background elements should not disappear.
