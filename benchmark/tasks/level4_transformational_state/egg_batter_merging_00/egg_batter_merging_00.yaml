id: egg_batter_merging_00
level: 4
category: structural_transformation
tags: []
variant_of: egg_batter_merging
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The whisk begins rapidly stirring the eggs into the flour. Camera remains stationary throughout.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The whisk begins rapidly stirring the eggs into the flour. Camera remains stationary throughout.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A ceramic bowl sits on a wooden table, containing a ring of white flour surrounding
    a pool of raw eggs with four distinct bright yellow yolks. A metal whisk rests in the bowl, partially
    submerged in the eggs. To the left of the bowl, there is scattered flour on the table. To the right,
    a linen cloth is visible. In the background, a window frame is out of focus.
  init2final_edit_prompt: Edit the given image to show the contents of the bowl after being stirred. The
    distinct round egg yolks should be broken and streaked into the whites and flour. The neat ring of
    flour should be disrupted and partially incorporated into the liquid, creating a messy, lumpy, yellowish
    batter texture. The wires of the whisk should be coated with the sticky mixture.
  rationale: The video prompt describes a rapid stirring action. This is an irreversible physical transformation
    where distinct ingredients (flour, egg yolks, egg whites) are mechanically combined into a single
    mixture (batter). In the final state, the structural integrity of the individual yolks must be destroyed,
    and the clear boundary between the dry flour and wet eggs must be disrupted as they blend together.
    The whisk, being the active tool, will naturally become coated in the developing mixture.
  questions:
  - id: yolks_broken
    question: Are the distinct, round shapes of the egg yolks broken or disrupted?
    answer_type: yes_no
    notes_for_judge: In the initial frame, yolks are perfect circles. In the final frame, they should
      be smeared, broken, or blended.
  - id: flour_mixed
    question: Is the clear boundary between the white flour ring and the eggs less distinct than in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: The stirring action mixes the two, blurring the line between dry and wet.
  - id: batter_texture
    question: Does the substance in the bowl look like a lumpy mixture or batter rather than separate
      ingredients?
    answer_type: yes_no
    notes_for_judge: Check for the formation of a composite substance.
  - id: whisk_coated
    question: Are the wires of the whisk coated with the egg and flour mixture?
    answer_type: yes_no
    notes_for_judge: The tool used for stirring should show evidence of contact with the mixture.
  - id: yolk_color_spread
    question: Has the bright yellow color of the yolks spread into the surrounding white flour or egg
      whites?
    answer_type: yes_no
    notes_for_judge: Mixing causes the pigment to disperse.
  - id: flour_disturbance
    question: Is the surface of the flour inside the bowl disturbed or uneven compared to the initial
      smooth ring?
    answer_type: yes_no
    notes_for_judge: The mechanical action of the whisk disrupts the pile of flour.
  - id: bowl_stationary
    question: Is the ceramic bowl in the same position on the table?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: table_flour_consistent
    question: Is the scattered flour on the wooden table to the left of the bowl still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check; the stirring is inside the bowl.
