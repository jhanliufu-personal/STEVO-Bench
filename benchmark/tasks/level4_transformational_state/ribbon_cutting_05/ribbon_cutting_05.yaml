id: ribbon_cutting_05
level: 4
category: structural_transformation
tags: []
variant_of: ribbon_cutting
variation_type: dynamic_condition
variation_description: Scissors remain stationary instead of closing.
changes:
  occlusion_method: null
  dynamic_conditions: Scissors do not move; no closing force is applied.
  expected_outcome_change: The ribbon remains intact and uncut.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The sharp scissors remain completely stationary around the taut red ribbon. No movement occurs.
    The camera rotates right until the scissors and ribbon completely exit the view, then rotates toward
    the left smoothly at the same rate until the center of the ribbon is back in the center of view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The sharp scissors remain completely stationary around the taut red ribbon. No movement occurs.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, high-angle shot of a pair of open metal scissors positioned on a
    wooden table. A wide red satin ribbon runs horizontally across the frame, passing between the open
    blades of the scissors. The ribbon is taut and intact. The scissors are oriented diagonally with the
    blades surrounding the ribbon but not touching or cutting it. The wooden surface has a visible grain
    and rustic texture.
  init2final_edit_prompt: Edit the given image to show the red ribbon remaining completely intact and
    uncut. Ensure the scissors are in the exact same open position relative to the ribbon, with the blades
    separated and the ribbon passing between them undamaged. Do not change the position of the objects
    or the continuity of the ribbon.
  rationale: 'The video prompt explicitly imposes a negative constraint: ''The sharp scissors remain completely
    stationary'' and ''No movement occurs.'' Although the camera rotates the objects out of view and then
    returns to the original framing, the physical state of the objects must remain invariant. The scissors
    do not close, and the ribbon is not cut. The final frame must demonstrate object permanence by showing
    the ribbon still intact and the scissors still open, exactly as they were initially.'
