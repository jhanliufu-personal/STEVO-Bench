id: ribbon_cutting_08
level: 4
category: structural_transformation
tags: []
variant_of: ribbon_cutting
variation_type: combined
variation_description: Stationary scissors (condition) with lights off occlusion.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Scissors do not move.
  expected_outcome_change: Ribbon remains intact.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The sharp scissors remain completely stationary around the taut red ribbon. No movement occurs.
    The lights in the room turn off completely, plunging the scene into total darkness. After a moment,
    the lights turn back on to reveal the scene again. The camera returns to the original viewpoint. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The sharp scissors remain completely stationary around the taut red ribbon. No movement occurs.
    The lights in the room turn off completely, plunging the scene into total darkness. After a moment,
    the lights turn back on to reveal the scene again. The camera returns to the original viewpoint. No
    zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, high-angle shot showing a pair of open metal scissors positioned
    around a taut red ribbon. The ribbon runs horizontally across a rustic wooden surface made of planks.
    The scissors are angled diagonally, with the red ribbon resting between the open blades, ready to
    be cut but currently intact. In the background, a white window frame is visible.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it was initially, with the
    red ribbon remaining fully intact and continuous. Ensure the scissors are in the exact same open position
    relative to the ribbon, with no movement or cutting having occurred. The lighting should be bright
    and match the initial frame.
  rationale: The video prompt explicitly states that the scissors remain stationary and no movement occurs.
    Although the lights turn off and then back on, the physical state of the objects (scissors and ribbon)
    must remain unchanged. The camera returns to the original viewpoint. Therefore, the final frame should
    be visually identical to the initial frame, with the ribbon uncut and the scissors in their original
    position. The evaluation tests the model's ability to adhere to the 'no movement' instruction despite
    the visual affordance for cutting.
