id: charcoal_stick_crush_crumble_07
level: 4
category: structural_transformation
tags: []
variant_of: charcoal_stick_crush_crumble
variation_type: combined
variation_description: Changes material to soft clay (plastic deformation) and uses zoom occlusion.
changes:
  occlusion_method: Camera zooms out.
  dynamic_conditions: Material changed to soft modeling clay.
  expected_outcome_change: Object flattens/squishes permanently (plastic deformation) rather than crumbling.
prompts:
  init_frame_edit_prompt: Edit the image to replace the charcoal stick with a cylinder of soft, gray modeling
    clay.
  video_WM: The fingers begin applying progressive squeezing pressure to the stick of modeling clay. Clay
    is a soft, plastic material that is highly malleable and deforms permanently under light compression.
    It does not fracture but changes shape easily. The fingers continue increasing compressive force.
    The camera rapidly zooms out until the hand and clay are too small to discern details. The camera
    holds this distant view for several seconds while the pressure continues. Then the camera zooms back
    in smoothly to the original framing. No cut, no scene change. STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the stick of modeling clay.
    Clay is a soft, plastic material that is highly malleable and deforms permanently under light compression.
    It does not fracture but changes shape easily. The fingers continue increasing compressive force during
    the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up first-person view of a dirty hand holding a smooth, gray cylindrical
    stick of modeling clay. The hand has charcoal or graphite smudges on the skin. The background is a
    blurred wooden table surface with art supplies, including sketches on paper and charcoal sticks.
  init2final_edit_prompt: Edit the given image to show the gray clay stick significantly deformed and
    squished by the hand's grip. The clay should appear compressed, with deep indentations where the fingers
    and thumb are pressing into it. The cylindrical shape should be distorted, appearing flattened or
    narrowed in the middle section due to the squeezing force. The hand's position should reflect a tighter
    grip around the now-deformed clay. Maintain the original lighting, background, and camera angle.
  rationale: The prompt specifies that the object is soft modeling clay which deforms permanently under
    pressure and does not fracture. The action is progressive squeezing. The camera zooms out and back
    in, creating a temporal gap where the deformation occurs. Upon returning to the initial view, the
    clay must exhibit plastic deformation (squishing, indentations, loss of cylindrical form) caused by
    the hand's pressure during the unobserved period. It should not be broken or crumbled, but reshaped.
