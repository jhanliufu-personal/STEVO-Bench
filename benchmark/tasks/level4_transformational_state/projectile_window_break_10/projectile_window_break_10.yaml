id: projectile_window_break_10
level: 4
category: structural_transformation
tags: []
variant_of: projectile_window_break
variation_type: combined
variation_description: Water balloon projectile combined with truck blocking occlusion.
changes:
  occlusion_method: A large delivery truck drives past outside.
  dynamic_conditions: Projectile is a red water balloon.
  expected_outcome_change: Balloon bursts, wetting the glass; glass remains intact.
prompts:
  init_frame_edit_prompt: Edit the image to replace the metal bullet with a red water balloon.
  video_WM: The red water balloon strikes the center of the glass pane. At that moment, a large delivery
    truck drives past in the garden outside, completely blocking the view through the window. The truck
    continues forward until the window view is clear again. No zoom, no cut, no scene change. STOP.
  camera_WM: The red water balloon strikes the center of the glass pane. At that moment, a large delivery
    truck drives past in the garden outside, completely blocking the view through the window. The truck
    continues forward until the window view is clear again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view from inside a room looking out through a wooden-framed window.
    A red water balloon is captured in mid-air, pressed against the center of the glass pane, surrounded
    by a spray of water droplets indicating the moment of impact. Through the glass, a blurred outdoor
    scene shows a green garden with trees and a house in the background.
  init2final_edit_prompt: Edit the given image to show the aftermath of the impact. Remove the intact
    red balloon. Render the glass pane as shattered, with a large hole in the center surrounded by jagged
    shards and cracks. Add water residue and wet spots on the wooden window sill and remaining glass.
    Place small pieces of torn red rubber debris on the sill or stuck to the glass edges. Ensure the view
    of the garden and house outside is visible through the broken window and is not blocked by any vehicle.
  rationale: The video prompt describes a high-velocity impact of a water balloon against glass, implying
    a destructive event. The 'window break' task ID confirms the intended outcome is the shattering of
    the pane. The occlusion by the truck serves to mask the complex physics of the breaking process, allowing
    the model to jump to the resultant state. When the truck clears, the irreversible transformation (broken
    glass, burst balloon) must be evident, and the transient occluder (truck) must be gone.
