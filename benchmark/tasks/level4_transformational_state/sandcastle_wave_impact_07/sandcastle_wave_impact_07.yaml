id: sandcastle_wave_impact_07
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: combined
variation_description: Small ripple condition combined with fog occlusion.
changes:
  occlusion_method: Thick fog rolls in
  dynamic_conditions: Wave energy reduced to minimal ripple
  expected_outcome_change: Sandcastle remains intact
prompts:
  init_frame_edit_prompt: Edit the image to replace the large looming wave with a very small, gentle ripple
    of water just inches high, barely reaching the sandcastle.
  video_WM: The small gentle ripple of water washes slowly towards the base of the sandcastle. Suddenly,
    a dense bank of sea fog rolls in rapidly, completely whitening out the view and hiding the beach.
    The fog slowly lifts. No cut, no scene change. STOP.
  camera_WM: The small gentle ripple of water washes slowly towards the base of the sandcastle. Suddenly,
    a dense bank of sea fog rolls in rapidly, completely whitening out the view and hiding the beach.
    The fog slowly lifts. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, elaborate sandcastle stands on a sandy beach near the water's edge.
    The castle features multiple towers with pointed roofs, fortified walls, a bridge, and decorative
    seashells placed along the lower perimeter. The sand is dark and packed. To the left, the ocean has
    small waves and ripples. The sky is overcast with heavy, dark clouds. In the background to the right,
    several people are standing or walking on the beach.
  init2final_edit_prompt: Edit the given image to show the sandcastle after being washed by a gentle wave.
    The base of the sandcastle, particularly on the left side facing the ocean, should appear eroded,
    smoothed, and melted. The sharp architectural details of the lower walls and moat area should be softened
    or lost due to water contact. The sand surrounding the base should look very wet, flattened, and spread
    out. Some of the shells near the bottom may be displaced or partially buried in wet sludge. The upper
    towers should remain mostly standing but may show slight sagging or loss of crisp definition.
  rationale: 'The prompt describes a ripple of water moving towards the sandcastle, followed by a period
    of occlusion caused by fog. Physically, when water contacts a sand structure, it causes irreversible
    erosion, smoothing, and loss of form (melting). The fog serves as a transition period. When the view
    clears, the sandcastle must show the aftermath of this interaction: it should not be pristine. The
    base should be eroded and the sand wet, reflecting the irreversible structural damage caused by the
    water.'
  questions:
  - id: erosion_visible
    question: Does the sandcastle show visible signs of erosion or water damage?
    answer_type: yes_no
    notes_for_judge: Look for smoothing, melting, or collapse of the sand structure.
  - id: base_smoothing
    question: Is the base of the sandcastle smoother and less defined than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The sharp edges at the bottom should be washed out.
  - id: detail_loss
    question: Have the sharp architectural details of the lower walls been softened or lost?
    answer_type: yes_no
    notes_for_judge: Compare the crispness of the initial walls to the final state.
  - id: wet_sand_spread
    question: Is the sand at the immediate base of the castle wetter or more spread out than initially?
    answer_type: yes_no
    notes_for_judge: Water contact creates a slurry of wet sand at the base.
  - id: structural_compromise
    question: Has the structural integrity of the sandcastle been compromised compared to the start?
    answer_type: yes_no
    notes_for_judge: It should look damaged, not perfect.
  - id: water_side_damage
    question: Are the parts of the sandcastle facing the water more degraded than the top towers?
    answer_type: yes_no
    notes_for_judge: The damage should be concentrated where the water hit (the base/side).
  - id: invariant_horizon
    question: Is the horizon line consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera angle should not have shifted significantly.
  - id: invariant_location
    question: Is the sandcastle in the same general location on the beach?
    answer_type: yes_no
    notes_for_judge: It should not have moved, only eroded in place.
