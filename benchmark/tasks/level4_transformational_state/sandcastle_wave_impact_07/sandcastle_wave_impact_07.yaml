  video_WM: A small, gentle ripple of water washes slowly towards the sandcastle. Suddenly, a thick bank
    of white sea fog rolls in rapidly, completely obscuring the entire scene in white mist. The fog slowly
    clears to reveal the view again. No cut, no scene change. STOP.
  camera_WM: A small, gentle ripple of water washes slowly towards the sandcastle. Suddenly, a thick bank
    of white sea fog rolls in rapidly, completely obscuring the entire scene in white mist. The fog slowly
    clears to reveal the view again. No cut, no scene change. STOP.
