prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands begin gathering the edges of the foil inward and applying compressive force. Aluminum
    foil is a thin metal sheet that undergoes plastic deformation when bent beyond its yield strength.
    Unlike elastic materials, aluminum has a very low yield threshold and cannot return to original shape
    after plastic deformation. Bending causes permanent atomic-level rearrangement in the metal structure.
    The hands continue progressive compression. The camera zooms out rapidly and continuously until the
    table and hands appear as a tiny, distant speck, making details impossible to see. The hands continue
    compressing the foil while distant. Then the camera zooms back in smoothly to the original framing.
    No cut, no scene change. STOP.
  camera_WM: The hands begin gathering the edges of the foil inward and applying compressive force. Aluminum
    foil is a thin metal sheet that undergoes plastic deformation when bent beyond its yield strength.
    Unlike elastic materials, aluminum has a very low yield threshold and cannot return to original shape
    after plastic deformation. Bending causes permanent atomic-level rearrangement in the metal structure.
    The hands continue progressive compression during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A top-down view of a rectangular sheet of silver aluminum foil lying flat on
    a rustic wooden table. Two male hands are positioned on the left and right sides of the foil, resting
    on the table surface and the edges of the foil. The foil has minor surface wrinkles but is largely
    uncompressed. The wooden table has visible grain, cracks, and some small crumbs.
  init2final_edit_prompt: Edit the given image to show the aluminum foil transformed into a crumpled,
    irregular ball or compact mass in the center of the frame. Position the hands closer together, cupping
    or holding the crumpled foil mass. Reveal the wooden table surface that was previously covered by
    the flat sheet, showing the wood grain where the foil used to be.
  rationale: The video prompt describes a continuous physical action of compressing aluminum foil, which
    undergoes plastic deformation. The camera zooms out and then back in to the original framing, serving
    as a temporal bridge during which the action progresses. Upon returning to the initial view, the foil
    must be significantly crumpled and reduced in surface area (irreversible change), and the hands must
    be closer together reflecting the motion of gathering the material.
