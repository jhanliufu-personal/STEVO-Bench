    the paper material. The lights in the room switch off, leaving the scene in darkness, and then switch
    back on. No zoom, no cut, no scene change. The camera returns to the original viewpoint. STOP.
  camera_WM: The two hands hold the photograph loosely without applying force. No tension is applied to
    the paper material. The lights in the room switch off, leaving the scene in darkness, and then switch
    back on. No zoom, no cut, no scene change. STOP.
