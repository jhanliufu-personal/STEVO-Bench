id: photograph_tearing_09
level: 4
category: structural_transformation
tags: []
variant_of: photograph_tearing
variation_type: combined
variation_description: Combined lights off occlusion with gentle holding.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Hands hold gently, no force.
  expected_outcome_change: No change in state.
prompts:
  init_frame_edit_prompt: Edit the image to show the hands holding the photograph loosely with relaxed
    fingers, removing the small tear at the top edge.
  video_WM: The two hands hold the photograph loosely without applying force. No tension is applied to
    the paper material. The lights in the room switch off, leaving the scene in darkness, and then switch
    back on. No zoom, no cut, no scene change. The camera returns to the original viewpoint. STOP.
  camera_WM: The two hands hold the photograph loosely without applying force. No tension is applied to
    the paper material. The lights in the room switch off, leaving the scene in darkness, and then switch
    back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of two hands holding a glossy rectangular photograph depicting
    a sunset over a beach with waves. The left hand holds the left edge and the right hand holds the right
    edge, with thumbs on the front surface. The photograph is slightly curved but structurally intact
    and whole. The background is dimly lit and out of focus.
  init2final_edit_prompt: Edit the given image to show the photograph remaining completely intact and
    whole. Ensure the paper has no tears, rips, or structural damage. The hands should continue holding
    the photograph in the same position without any separation of the material. The scene should be illuminated,
    matching the lighting of the original image.
  rationale: The video prompt explicitly states that the hands hold the photograph loosely without applying
    force and that no tension is applied to the paper material. Although the lights turn off and back
    on, the lack of physical force or tension dictates that the photograph must not tear or sustain damage.
    Therefore, the final state should show the photograph in its original, intact condition, identical
    to the start except for potential minor lighting variations from the switch event.
  questions:
  - id: integrity_check_01
    question: Is the photograph still a single, continuous piece of paper?
    answer_type: yes_no
    notes_for_judge: The prompt specifies no tension/force, so the photo must not be torn.
  - id: integrity_check_02
    question: Does the image on the photograph remain uninterrupted by any rips or tears?
    answer_type: yes_no
    notes_for_judge: Check for visual continuity of the sunset scene.
  - id: integrity_check_03
    question: Is the paper material free from visible structural damage?
    answer_type: yes_no
    notes_for_judge: The object should not show signs of breaking or tearing.
  - id: integrity_check_04
    question: Are the left and right sides of the photograph still connected?
    answer_type: yes_no
    notes_for_judge: The photo should not be separated into pieces.
  - id: integrity_check_05
    question: Does the photograph appear as a solid, unfragmented object?
    answer_type: yes_no
    notes_for_judge: Verify no fragmentation occurred.
  - id: consistency_check_01
    question: Are the hands holding the photograph in the same position as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary check for pose consistency.
  - id: consistency_check_02
    question: Is the lighting in the room turned on?
    answer_type: yes_no
    notes_for_judge: The prompt states the lights switch back on.
