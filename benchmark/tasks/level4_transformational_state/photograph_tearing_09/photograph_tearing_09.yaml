evaluation:
  init_frame_description: A close-up view of two hands holding a glossy rectangular photograph depicting
    a sunset over a beach with waves. The left hand holds the left edge and the right hand holds the right
    edge, with thumbs on the front surface. The photograph is slightly curved but structurally intact
    and whole. The background is dimly lit and out of focus.
  init2final_edit_prompt: Edit the given image to show the photograph remaining completely intact and
    whole. Ensure the paper has no tears, rips, or structural damage. The hands should continue holding
    the photograph in the same position without any separation of the material. The scene should be illuminated,
    matching the lighting of the original image.
  rationale: The video prompt explicitly states that the hands hold the photograph loosely without applying
    force and that no tension is applied to the paper material. Although the lights turn off and back
    on, the lack of physical force or tension dictates that the photograph must not tear or sustain damage.
    Therefore, the final state should show the photograph in its original, intact condition, identical
    to the start except for potential minor lighting variations from the switch event.
