id: frayed_rope_snap_09
level: 4
category: structural_transformation
tags: []
variant_of: frayed_rope_snap
variation_type: combined
variation_description: Thick steel cable (condition) occluded by camera zoom (occlusion).
changes:
  occlusion_method: Camera zooms out until scene is indistinct.
  dynamic_conditions: Rope replaced by thick steel cable.
  expected_outcome_change: Cable withstands tension without breaking.
prompts:
  init_frame_edit_prompt: Edit the image to replace the frayed rope with a thick, heavy-duty twisted steel
    cable.
  video_WM: The winches pull with extreme force on the heavy-duty steel cable. The cable is under immense
    tension. The camera zooms out continuously until the winches and cable are too small to see clearly,
    then zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: The winches pull with extreme force on the heavy-duty steel cable. The cable is under immense
    tension. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A close-up, eye-level shot of a thick, multi-strand steel cable stretched horizontally
    between two heavy-duty, rusty metal winches. The cable appears taut and structurally intact, running
    continuously from the left winch to the right winch. The background is blurred, showing indistinct
    concrete or stone textures.
  init2final_edit_prompt: Edit the given image to show the steel cable snapped in the middle. Create a
    visible gap separating the cable into two distinct segments. The broken ends should appear frayed,
    jagged, and uneven, indicating a violent structural failure. The cable should no longer form a continuous
    line across the frame.
  rationale: The video prompt describes extreme force and tension applied to the cable, implying a trajectory
    toward structural failure. The camera zooms out and then back in, providing a temporal window for
    the transformation to occur while obscuring the exact moment of breaking. Given the Level 4 focus
    on irreversible transformation and the task ID 'frayed_rope_snap', the logical final state upon returning
    to the original view is that the cable has succumbed to the tension and snapped, leaving visible damage
    and separation.
  questions:
  - id: q1
    question: Is the steel cable broken or snapped?
    answer_type: yes_no
    notes_for_judge: Look for a break in the continuity of the cable.
  - id: q2
    question: Is there a visible gap separating the left and right sections of the cable?
    answer_type: yes_no
    notes_for_judge: The cable should not be continuous.
  - id: q3
    question: Do the ends of the cable appear frayed, jagged, or damaged?
    answer_type: yes_no
    notes_for_judge: Check for texture indicating a break (unraveled strands).
  - id: q4
    question: Has the cable lost its original continuous structural form?
    answer_type: yes_no
    notes_for_judge: Compare to the intact cable in the first frame.
  - id: q5
    question: Are the two pieces of the cable physically disconnected from each other?
    answer_type: yes_no
    notes_for_judge: Ensure the material is separated.
  - id: q6
    question: Are the rusty winches still visible on the left and right sides of the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: q7
    question: Is the background environment consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
