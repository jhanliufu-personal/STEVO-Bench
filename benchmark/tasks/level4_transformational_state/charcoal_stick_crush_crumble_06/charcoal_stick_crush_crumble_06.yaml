id: charcoal_stick_crush_crumble_06
level: 4
category: structural_transformation
tags: []
variant_of: charcoal_stick_crush_crumble
variation_type: dynamic_condition
variation_description: Changes the action from squeezing to gently holding, preventing breakage.
changes:
  occlusion_method: null
  dynamic_conditions: Applied force changed from squeezing pressure to gentle support.
  expected_outcome_change: The charcoal remains intact (no crumbling).
prompts:
  init_frame_edit_prompt: Edit the image to show the hand holding the charcoal stick loosely and gently,
    with relaxed fingers that are not pressing into the material.
  video_WM: The fingers hold the charcoal stick with a gentle, delicate grip. The hand remains relaxed,
    applying no compressive force to the material. The charcoal is porous and brittle, but no pressure
    is being exerted to test its structural limits. The camera rotates right until the hand and charcoal
    completely exit the view to the right. The camera continues rotating right for several seconds while
    the hand remains off-screen maintaining the gentle hold. Then the camera rotates left smoothly at
    the same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The fingers hold the charcoal stick with a gentle, delicate grip. The hand remains relaxed,
    applying no compressive force to the material. The charcoal is porous and brittle, but no pressure
    is being exerted to test its structural limits. The hand maintains the gentle hold during the occlusion
    period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A close-up, first-person perspective of a dirty hand holding a thick, black,
    cylindrical stick of charcoal vertically. The charcoal has a porous, wood-like texture. The hand is
    stained with black dust, and the thumb and fingers are wrapped gently around the stick. The background
    is a blurred workspace with a wooden table, white paper with charcoal sketches, and drawing tools.
  init2final_edit_prompt: Edit the given image to show the charcoal stick remaining completely intact
    and unbroken. The hand should be holding the charcoal in the same position and orientation as the
    original image. Ensure the charcoal retains its original cylindrical shape with no cracks, crumbling,
    or fragmentation. The fingers should maintain the same gentle grip without compressing the material.
    The background and lighting should remain unchanged.
  rationale: The video prompt explicitly states that the grip remains gentle and delicate throughout the
    sequence, applying no compressive force. Although the camera rotates away and back, the prompt specifies
    that the gentle hold is maintained while off-screen. Therefore, unlike typical tasks in this category,
    no structural transformation or damage should occur. The charcoal stick must return to the view in
    its original, intact state.
  questions:
  - id: integrity_check_1
    question: Is the charcoal stick still completely intact?
    answer_type: yes_no
    notes_for_judge: The prompt specifies a gentle hold with no force, so the stick should not break.
  - id: integrity_check_2
    question: Does the charcoal stick retain its original cylindrical shape?
    answer_type: yes_no
    notes_for_judge: Check for deformation or crushing.
  - id: integrity_check_3
    question: Is the charcoal stick free from any new cracks or breaks?
    answer_type: yes_no
    notes_for_judge: No damage should be visible.
  - id: integrity_check_4
    question: Does the charcoal stick appear solid rather than crumbled or fragmented?
    answer_type: yes_no
    notes_for_judge: The texture should remain consistent with the initial frame.
  - id: grip_check
    question: Is the hand holding the charcoal without visibly crushing it?
    answer_type: yes_no
    notes_for_judge: The fingers should not be pressing deeply into the material.
  - id: structural_preservation
    question: Is the charcoal stick's structural integrity preserved compared to the start?
    answer_type: yes_no
    notes_for_judge: Compare with initial frame; should be identical structurally.
  - id: background_consistency
    question: Is the background (table and papers) consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
