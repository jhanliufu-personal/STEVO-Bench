  video_WM: The fingers hold the charcoal stick with a gentle, delicate grip. The hand remains relaxed,
    applying no compressive force to the material. The charcoal is porous and brittle, but no pressure
    is being exerted to test its structural limits. The camera rotates right until the hand and charcoal
    completely exit the view to the right. The camera continues rotating right for several seconds while
    the hand remains off-screen maintaining the gentle hold. Then the camera rotates left smoothly at
    the same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The fingers hold the charcoal stick with a gentle, delicate grip. The hand remains relaxed,
    applying no compressive force to the material. The charcoal is porous and brittle, but no pressure
    is being exerted to test its structural limits. The hand maintains the gentle hold during the occlusion
    period. STOP.
