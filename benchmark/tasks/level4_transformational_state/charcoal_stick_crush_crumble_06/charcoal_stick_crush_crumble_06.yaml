evaluation:
  init_frame_description: A close-up, first-person perspective of a dirty hand holding a thick, black,
    cylindrical stick of charcoal vertically. The charcoal has a porous, wood-like texture. The hand is
    stained with black dust, and the thumb and fingers are wrapped gently around the stick. The background
    is a blurred workspace with a wooden table, white paper with charcoal sketches, and drawing tools.
  init2final_edit_prompt: Edit the given image to show the charcoal stick remaining completely intact
    and unbroken. The hand should be holding the charcoal in the same position and orientation as the
    original image. Ensure the charcoal retains its original cylindrical shape with no cracks, crumbling,
    or fragmentation. The fingers should maintain the same gentle grip without compressing the material.
    The background and lighting should remain unchanged.
  rationale: The video prompt explicitly states that the grip remains gentle and delicate throughout the
    sequence, applying no compressive force. Although the camera rotates away and back, the prompt specifies
    that the gentle hold is maintained while off-screen. Therefore, unlike typical tasks in this category,
    no structural transformation or damage should occur. The charcoal stick must return to the view in
    its original, intact state.
