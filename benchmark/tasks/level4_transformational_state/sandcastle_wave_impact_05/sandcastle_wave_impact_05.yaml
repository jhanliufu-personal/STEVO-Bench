id: sandcastle_wave_impact_05
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: dynamic_condition
variation_description: Sandcastle material changed to solid stone.
changes:
  occlusion_method: null
  dynamic_conditions: 'Material: Sand -> Solid Stone'
  expected_outcome_change: Structure remains intact (no deformation)
prompts:
  init_frame_edit_prompt: Edit the image to change the castle texture to solid grey rock, while keeping
    the wave the same.
  video_WM: The large ocean wave crashes down with force directly onto the solid stone castle sculpture.
    The water engulfs the stone structure. The camera rotates right until the castle completely exits
    the view, then rotates toward the left smoothly at the same rate until the castle is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the solid stone castle sculpture.
    The impact force is applied to the structure. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A detailed castle sculpture, resembling a sandcastle but described as solid
    stone, sits on a sandy beach. It features multiple towers, walls, and a bridge. A massive, translucent
    green ocean wave is curling directly over the castle, poised to crash down. The water is textured
    with foam and spray. In the background on the right, people are standing on the beach near the water's
    edge under a cloudy sky.
  init2final_edit_prompt: Edit the given image to show the aftermath of the large wave crashing. The looming
    green wall of water has collapsed and is no longer visible in its original form. Instead, the foreground
    is filled with turbulent white sea foam and rushing water surrounding the castle. The stone castle
    sculpture remains standing but is now thoroughly drenched, darker in color due to wetness, and its
    base is engulfed by the swirling foam and water. The sand around the castle is wet and disturbed.
  rationale: The prompt describes a forceful wave impact on a 'solid stone' structure. While visually
    resembling a sandcastle, the text constraint 'solid stone' implies structural resilience, so the castle
    should not dissolve or flatten like sand but may be displaced or eroded. The primary irreversible
    transformation is the collapse of the wave (from potential energy to kinetic foam) and the state change
    of the castle (dry to wet/engulfed). The camera rotation serves as a time-skip for the impact duration,
    returning to reveal the wet, foam-surrounded aftermath.
