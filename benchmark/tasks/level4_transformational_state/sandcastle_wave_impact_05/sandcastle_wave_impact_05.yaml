id: sandcastle_wave_impact_05
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: dynamic_condition
variation_description: Sandcastle material changed to solid stone/concrete.
changes:
  occlusion_method: null
  dynamic_conditions: Structure material changed from sand to stone
  expected_outcome_change: Structure remains intact despite wave impact
prompts:
  init_frame_edit_prompt: Edit the image so the castle looks like it is made of solid grey carved stone
    or concrete, rather than loose sand.
  video_WM: The large ocean wave crashes down with force directly onto the stone castle sculpture. The
    water engulfs the structure. The camera rotates right until the impact site completely exits the view,
    then rotates toward the left smoothly at the same rate until the castle location is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the stone castle sculpture. The
    impact force is applied to the structure. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A detailed sandcastle or sand sculpture resembling a stone castle sits on a
    wet beach. It features multiple turrets with conical roofs, brick-textured walls, a bridge, and shell
    decorations along the base. To the left and behind the castle, a massive, translucent green ocean
    wave is curling over, poised to crash directly onto the structure. In the far background on the right,
    a few people are standing on the shore under a cloudy sky.
  init2final_edit_prompt: Edit the given image to show the aftermath of the large wave crashing. The castle
    structure should be significantly damaged, collapsed, or eroded, appearing as a ruined mound of wet
    sand with broken turrets and smoothed features. The large curling wave in the background should be
    replaced by turbulent white foam, mist, or receding water on the beach surface. The sand surrounding
    the ruins should appear soaked and disturbed.
  rationale: The video prompt describes a large wave crashing with force onto the structure and engulfing
    it. The camera rotates away during the impact and returns afterwards. Given the magnitude of the wave
    and the fragile nature of the structure (visually a sandcastle), the return of the camera should reveal
    irreversible structural damage, such as collapse, erosion, or flattening. The wave itself will have
    progressed from a breaking curl to dissipated foam or wash.
  questions:
  - id: castle_damage_structural
    question: Is the castle structure significantly damaged, collapsed, or eroded compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The structure should no longer be pristine; it should show signs of destruction from
      the wave.
  - id: turrets_missing
    question: Are the tall turrets or towers from the initial frame broken, missing, or flattened?
    answer_type: yes_no
    notes_for_judge: The vertical elements should be compromised.
  - id: wave_dissipated
    question: Has the large curling wave from the initial frame dissipated into foam or receding water?
    answer_type: yes_no
    notes_for_judge: The wave should no longer be a standing wall of water; it should have crashed.
  - id: shape_integrity
    question: Has the castle lost its sharp, defined architectural edges and details?
    answer_type: yes_no
    notes_for_judge: The impact should smooth out or destroy the detailed brickwork and edges.
  - id: height_reduction
    question: Is the overall height of the castle structure lower than it was initially due to collapse?
    answer_type: yes_no
    notes_for_judge: Collapse implies a reduction in height.
  - id: debris_scatter
    question: Is the material of the castle spread out or washed around the base more than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The sand/material should be displaced by the water.
  - id: background_consistency
    question: Is the general beach environment (sand and sky) still recognizable?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
