id: dry_autumn_leaf_crumble_10
level: 4
category: structural_transformation
tags: []
variant_of: dry_autumn_leaf_crumble
variation_type: combined
variation_description: Soggy wet leaf (condition) + Camera zoom out (occlusion).
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: Leaf is soggy and wet.
  expected_outcome_change: Leaf squishes into wet lump.
prompts:
  init_frame_edit_prompt: Edit the image to make the leaf appear dark, soggy, and wet, as if it has been
    soaking in a puddle.
  video_WM: The hands begin applying progressive crushing pressure to the soggy, wet leaf. The leaf is
    saturated with water and has lost its structural rigidity, becoming limp and mushy. The hands continue
    applying compressive force. The camera zooms out rapidly and continuously until the hands and leaf
    are barely visible dots in the distance, making detail indiscernible. The camera remains zoomed out
    for several seconds. Then the camera zooms back in smoothly to the original framing. No cut, no scene
    change. STOP.
  camera_WM: The hands begin applying progressive crushing pressure to the soggy, wet leaf. The leaf is
    saturated with water and has lost its structural rigidity, becoming limp and mushy. The hands continue
    applying compressive force during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot showing a pair of elderly hands holding a large,
    wet, brown, decaying autumn leaf. The leaf is spread out flat, exhibiting a soggy texture with visible
    veins and wet patches. The background is a light-colored, textured fabric surface, possibly a tablecloth
    or clothing, with some dark wet spots visible on the fabric near the leaf.
  init2final_edit_prompt: Edit the given image to show the wet leaf crumpled and compressed within the
    hands. The leaf should appear mushed, folded, or torn into a smaller, irregular mass, losing its original
    flat, spread-out shape. Maintain the wet, soggy texture of the leaf material. Keep the hands, background
    fabric, and lighting consistent with the original image.
  rationale: The video prompt describes hands applying crushing pressure to a soggy, wet leaf. Unlike
    a dry leaf that would shatter into dust, a wet leaf undergoes plastic deformation, becoming crumpled,
    torn, and compressed into a mushy ball. The camera zooms out and back in, covering the duration of
    this action. When the camera returns to the initial framing, the leaf must show clear evidence of
    this irreversible structural change, appearing as a compressed mass rather than a flat sheet.
  questions:
  - id: leaf_crumpled
    question: Does the leaf appear significantly more crumpled or compressed than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The leaf should no longer be flat; it should look squeezed or folded.
  - id: lost_flatness
    question: Has the leaf lost its original flat, spread-out shape?
    answer_type: yes_no
    notes_for_judge: The initial leaf was largely flat; the final state should be deformed.
  - id: reduced_area
    question: Is the visible surface area of the leaf smaller than it was initially due to compression?
    answer_type: yes_no
    notes_for_judge: Crushing the leaf should reduce its apparent size in the frame.
  - id: structural_damage
    question: Does the leaf show signs of irreversible structural change, such as tearing, mushing, or
      heavy folding?
    answer_type: yes_no
    notes_for_judge: Look for loss of the original leaf integrity.
  - id: hands_holding_mass
    question: Are the hands holding a compressed mass or clump of leaf material?
    answer_type: yes_no
    notes_for_judge: The object in the hands should look like a ball or clump of wet debris.
  - id: background_consistency
    question: Is the textured fabric background still visible and consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: hands_presence
    question: Are the hands still present in the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
