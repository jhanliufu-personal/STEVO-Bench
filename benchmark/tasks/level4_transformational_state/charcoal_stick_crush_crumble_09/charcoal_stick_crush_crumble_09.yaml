evaluation:
  init_frame_description: A close-up, first-person or side view of a hand holding a thick, cylindrical
    stick of black charcoal. The charcoal has a rough, porous, matte texture. The hand holds the stick
    vertically with a gentle grip, fingers curled loosely around it. The background is a wooden workspace
    featuring sheets of white paper with charcoal sketches, smudges, and other drawing tools like pencils
    or charcoal pieces scattered out of focus.
  init2final_edit_prompt: Edit the given image to show the charcoal stick remaining completely intact
    and unbroken. The charcoal must retain its original cylindrical shape, rough texture, and solid form,
    with no cracks, crumbling, or fragmentation. The hand should maintain the same gentle, relaxed grip
    on the object. The large black folder mentioned in the context must not be visible; the scene should
    be clearly revealed again with the object in its original state.
  rationale: The video prompt explicitly emphasizes a 'gentle, delicate grip' and states that 'no compressive
    force' is applied. It further clarifies that 'no pressure is being exerted to test its structural
    limits.' Although an occlusion event occurs with the folder, there is no instruction indicating a
    change in action (like squeezing) or a change in the object's state (like crushing) during the occlusion.
    Therefore, the correct rollout must show the charcoal stick structurally unchanged and intact, testing
    the model's ability to adhere to negative constraints regarding physical transformation.
