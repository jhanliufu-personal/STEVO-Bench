evaluation:
  init_frame_description: A close-up, eye-level shot of a vintage metal garlic press held by two hands
    over a wooden countertop. The press is in an open position with the upper handle raised, exposing
    the empty cylindrical chamber and the plunger. The metal has a worn, matte finish. In the background,
    slightly out of focus, are a wire whisk, a metal spoon, and the handle of a knife resting on the wood
    surface. A window and kitchen items are visible in the blurred background.
  init2final_edit_prompt: Edit the given image to show the garlic press in a fully closed position. Bring
    the upper handle down so it touches or nearly touches the lower handle. The plunger should be fully
    inserted into the chamber. Ensure there is no garlic, play-doh, or extruded material visible coming
    out of the press; the mechanism should look clean and empty. Maintain the original background, lighting,
    and position of the hands relative to the closed handles.
  rationale: The prompt explicitly states that the garlic press chamber is completely empty and contains
    no material. Therefore, the action of squeezing the handles results only in the mechanical closing
    of the device without any extrusion or material transformation. The camera rotates away and returns
    to the original viewpoint, meaning the final frame should look identical to the initial frame in terms
    of composition and background, but with the press handles squeezed shut. The primary change is the
    geometric configuration of the tool (open to closed).
