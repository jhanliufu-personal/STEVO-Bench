id: ceramic_plate_impact_v02
level: 4
category: structural_transformation
tags: []
variant_of: ceramic_plate_impact
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large wooden board sliding in front
  of the view.
changes:
  occlusion_method: A large opaque board slides in to block the view, then slides away.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The heavy steel hammer swings down forcefully toward the ceramic plate. At the exact moment
    of impact, a large opaque wooden board slides in from the right side, completely blocking the view
    of the floor and plate. The board remains in place for several seconds, then slides back to the right
    to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy steel hammer swings down forcefully toward the ceramic plate. At the exact moment
    of impact, a large opaque wooden board slides in from the right side, completely blocking the view
    of the floor and plate. The board remains in place for several seconds, then slides back to the right
    to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A white round ceramic plate rests on a rough, cracked concrete floor. Above
    it, a sledgehammer with a wooden handle and a heavy metal head is suspended in mid-air, angled downwards
    as if about to strike the plate. In the background, the bottom of a window frame and a wall are visible.
  init2final_edit_prompt: Edit the given image to show the white ceramic plate shattered into multiple
    broken shards and fragments scattered on the concrete floor. The hammer head should be positioned
    lower than in the original image, resting on or near the debris, consistent with having struck the
    plate. The view should be clear of any obstructions.
  rationale: 'The video prompt describes a forceful hammer swing targeting a fragile ceramic plate. Although
    the moment of impact is occluded by a board, the board is removed to reveal the aftermath. The physical
    interaction (heavy steel on ceramic) necessitates an irreversible transformation: the plate must be
    shattered. The final state should show the plate in pieces and the hammer having completed its downward
    trajectory.'
  questions:
  - id: plate_broken
    question: Is the ceramic plate broken into pieces?
    answer_type: yes_no
    notes_for_judge: Look for structural discontinuity and fragmentation of the white plate.
  - id: fragments_visible
    question: Are there visible shards or fragments of the plate on the floor?
    answer_type: yes_no
    notes_for_judge: ''
  - id: shape_destroyed
    question: Has the plate lost its original intact circular shape?
    answer_type: yes_no
    notes_for_judge: ''
  - id: hammer_position
    question: Is the hammer head positioned lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The hammer should have moved down towards the floor/debris.
  - id: structural_integrity
    question: Is the structural integrity of the plate compromised?
    answer_type: yes_no
    notes_for_judge: ''
  - id: debris_scatter
    question: Is the plate material more spread out or scattered compared to the initial compact circle?
    answer_type: yes_no
    notes_for_judge: ''
  - id: background_consistency
    question: Is the window frame in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
