    of the floor and plate. The board remains in place for several seconds, then slides back to the right
    to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The heavy steel hammer swings down forcefully toward the ceramic plate. At the exact moment
    of impact, a large opaque wooden board slides in from the right side, completely blocking the view
    of the floor and plate. The board remains in place for several seconds, then slides back to the right
    to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A white round ceramic plate rests on a rough, cracked concrete floor. Above
    it, a sledgehammer with a wooden handle and a heavy metal head is suspended in mid-air, angled downwards
    as if about to strike the plate. In the background, the bottom of a window frame and a wall are visible.
  init2final_edit_prompt: Edit the given image to show the white ceramic plate shattered into multiple
    broken shards and fragments scattered on the concrete floor. The hammer head should be positioned
    lower than in the original image, resting on or near the debris, consistent with having struck the
    plate. The view should be clear of any obstructions.
  rationale: 'The video prompt describes a forceful hammer swing targeting a fragile ceramic plate. Although
    the moment of impact is occluded by a board, the board is removed to reveal the aftermath. The physical
    interaction (heavy steel on ceramic) necessitates an irreversible transformation: the plate must be
    shattered. The final state should show the plate in pieces and the hammer having completed its downward
    trajectory.'
