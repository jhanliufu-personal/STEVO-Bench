evaluation:
  init_frame_description: A red plastic Solo cup sits on a light wooden workbench on the left side of
    the frame. To the right, an orange heat gun is propped up on its stand, with its metal nozzle pointing
    directly at the side of the cup. The cup shows some minor initial denting on the side facing the heat
    gun. In the background, out of focus, are various tools like screwdrivers and pliers.
  init2final_edit_prompt: Edit the given image to show the red plastic cup significantly melted and deformed.
    The side of the cup facing the heat gun should be collapsed, shriveled, or warped inward due to the
    heat. The cup should appear to have lost its structural rigidity, potentially sagging or leaning.
    Do not move the heat gun or change the background tools.
  rationale: The heat gun is directing hot air at a thermoplastic cup. As the temperature exceeds the
    glass transition point of the plastic, the material will soften and lose its shape. Gravity and the
    force of the air will cause the cup to collapse, warp, or melt, particularly on the side facing the
    heat source. This is an irreversible structural change. The camera and other objects remain static.
