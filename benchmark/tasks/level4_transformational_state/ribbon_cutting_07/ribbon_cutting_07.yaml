id: ribbon_cutting_07
level: 4
category: structural_transformation
tags: []
variant_of: ribbon_cutting
variation_type: combined
variation_description: Rusty scissors (condition) with hand blocking occlusion.
changes:
  occlusion_method: Hand blocking the lens.
  dynamic_conditions: Scissors are old, rusty, and dull.
  expected_outcome_change: Ribbon folds/jams instead of cutting.
prompts:
  init_frame_edit_prompt: Edit the image to make the scissors look old, rusty, and dull, with pitted metal
    blades.
  video_WM: The blades of the old, rusty scissors begin to close slowly and steadily around the taut red
    ribbon. The attempt to cut begins. A hand moves in front of the lens, completely blocking the view.
    The hand remains there for a moment, then moves away to reveal the scene again. The camera returns
    to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The blades of the old, rusty scissors begin to close slowly and steadily around the taut
    red ribbon. The attempt to cut begins. A hand moves in front of the lens, completely blocking the
    view. The hand remains there for a moment, then moves away to reveal the scene again. The camera returns
    to the original viewpoint. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A pair of old, rusty metal scissors lies on a wooden surface. The blades of
    the scissors are open, positioned around a flat, taut red ribbon that runs horizontally across the
    frame. The background shows a blurred window sill.
  init2final_edit_prompt: Edit the given image to show the rusty scissors in a closed position. The red
    ribbon must be severed at the point where the scissor blades meet, showing a clear break or gap in
    the material. The two cut ends of the ribbon should be visible near the closed blades.
  rationale: 'The video prompt describes the scissors closing to cut the ribbon, followed by an occlusion.
    During the occlusion, the physical action of cutting is completed. Therefore, in the final frame,
    the irreversible transformation (the cutting of the ribbon) must be visible: the scissors should be
    closed, and the ribbon should be severed into two pieces.'
  questions:
  - id: ribbon_severed
    question: Is the red ribbon severed into two separate pieces?
    answer_type: yes_no
    notes_for_judge: Look for a break in the continuity of the ribbon at the location of the scissors.
  - id: scissors_closed
    question: Are the blades of the scissors closed or nearly closed?
    answer_type: yes_no
    notes_for_judge: Compare the angle of the blades to the initial open state.
  - id: ribbon_continuity_broken
    question: Is there a visible gap or break in the red ribbon where the scissors are located?
    answer_type: yes_no
    notes_for_judge: The ribbon should no longer be a single continuous strip.
  - id: structural_change
    question: Has the ribbon undergone a structural change (being cut) compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for evidence of cutting/tearing.
  - id: blades_position
    question: Are the tips of the scissor blades closer together than they were in the initial frame?
    answer_type: yes_no
    notes_for_judge: Verifies the mechanical action of the scissors.
  - id: background_consistency
    question: Is the wooden surface texture still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: object_permanence
    question: Are the rusty scissors still present in the scene?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
