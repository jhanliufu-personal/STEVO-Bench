evaluation:
  init_frame_description: A close-up view of a thick, twisted natural fiber rope being held by two hands
    over a wooden workbench. The rope has a distinct helical braided structure consisting of multiple
    fiber bundles twisted together. The background is slightly blurred, showing wooden surfaces and tools
    like pliers. The hands are gripping the rope, with fingers positioned to manipulate the strands.
  init2final_edit_prompt: Edit the given image so that the section of rope held by the hands is significantly
    untwisted and unraveled. The previously tight helical braid must be separated into distinct, loose
    strands that are splayed apart. The fibers should appear frayed, voluminous, and less organized than
    the original tight twist, showing a clear disruption of the rope's structural integrity. The hands
    should be holding these separated, unraveled strands.
  rationale: The video prompt describes a continuous action of untwisting the rope strands. A temporary
    occlusion by a wooden board blocks the view, but the prompt explicitly states the action continues
    behind the occlusion. Therefore, when the view is restored, the rope must exhibit a state of advanced
    unraveling compared to the initial frame. The transformation is structural, moving from a tight helical
    braid to separated, loose strands. The final state reflects the cumulative effect of the manipulation
    that occurred both before and during the occlusion.
