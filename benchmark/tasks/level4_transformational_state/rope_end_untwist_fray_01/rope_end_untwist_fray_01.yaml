id: rope_end_untwist_fray_01
level: 4
category: structural_transformation
tags: []
variant_of: rope_end_untwist_fray
variation_type: occlusion_method
variation_description: Occlusion by a large wooden board blocking the view instead of camera rotation.
changes:
  occlusion_method: A large wooden board slides in front of the camera, blocking the view completely,
    then slides away.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fingers begin pulling and untwisting the individual rope strands away from each other.
    Braided rope consists of three separate fiber bundles twisted together in a helical pattern. The structural
    integrity depends on the strands remaining intertwined under twisting tension. The fingers apply force
    to unwind and separate the twisted structure. The fingers continue progressive untwisting and separation
    of the strands. A large wooden board slides from the left into the foreground, completely blocking
    the hands and rope from view. The board remains in place for several seconds while the hands continue
    untwisting behind it. Then the wooden board slides back to the left, revealing the scene again. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The fingers begin pulling and untwisting the individual rope strands away from each other.
    Braided rope consists of three separate fiber bundles twisted together in a helical pattern. The structural
    integrity depends on the strands remaining intertwined under twisting tension. The fingers apply force
    to unwind and separate the twisted structure. The fingers continue progressive untwisting and separation
    of the strands. A large wooden board slides from the left into the foreground, completely blocking
    the hands and rope from view. The board remains in place for several seconds while the hands continue
    untwisting behind it. Then the wooden board slides back to the left, revealing the scene again. No
    zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of a thick, twisted natural fiber rope being held by two hands
    over a wooden workbench. The rope has a distinct helical braided structure consisting of multiple
    fiber bundles twisted together. The background is slightly blurred, showing wooden surfaces and tools
    like pliers. The hands are gripping the rope, with fingers positioned to manipulate the strands.
  init2final_edit_prompt: Edit the given image so that the section of rope held by the hands is significantly
    untwisted and unraveled. The previously tight helical braid must be separated into distinct, loose
    strands that are splayed apart. The fibers should appear frayed, voluminous, and less organized than
    the original tight twist, showing a clear disruption of the rope's structural integrity. The hands
    should be holding these separated, unraveled strands.
  rationale: The video prompt describes a continuous action of untwisting the rope strands. A temporary
    occlusion by a wooden board blocks the view, but the prompt explicitly states the action continues
    behind the occlusion. Therefore, when the view is restored, the rope must exhibit a state of advanced
    unraveling compared to the initial frame. The transformation is structural, moving from a tight helical
    braid to separated, loose strands. The final state reflects the cumulative effect of the manipulation
    that occurred both before and during the occlusion.
  questions:
  - id: rope_untwisted_01
    question: Is the helical structure of the rope less defined or more disrupted than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Compare the tightness of the twist. The final frame should show a looser or broken
      pattern.
  - id: strands_separated_02
    question: Are the individual strands or fiber bundles of the rope more separated from each other than
      initially?
    answer_type: yes_no
    notes_for_judge: Look for gaps or space between the main bundles that make up the rope.
  - id: rope_width_03
    question: Does the manipulated section of the rope appear wider or more voluminous due to unraveling?
    answer_type: yes_no
    notes_for_judge: Untwisting usually causes the rope to splay out and take up more space.
  - id: structural_integrity_04
    question: Has the rope lost its tight braided form in the area held by the hands?
    answer_type: yes_no
    notes_for_judge: The original form is a tight braid; the new form should be loose fibers/strands.
  - id: fraying_visible_05
    question: Are loose fibers or frayed ends more visible now than in the starting image?
    answer_type: yes_no
    notes_for_judge: Mechanical separation often exposes inner fibers.
  - id: hands_holding_strands_06
    question: Are the hands holding separated strands rather than a single solid rope body?
    answer_type: yes_no
    notes_for_judge: The grip should interact with the separated components.
  - id: invariant_tools_07
    question: Are the tools or background objects on the workbench still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for the background.
  - id: invariant_hands_08
    question: Are the hands still present in the frame?
    answer_type: yes_no
    notes_for_judge: The hands should not disappear.
