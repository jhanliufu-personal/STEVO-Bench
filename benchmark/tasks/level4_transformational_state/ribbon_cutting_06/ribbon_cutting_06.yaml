id: ribbon_cutting_06
level: 4
category: structural_transformation
tags: []
variant_of: ribbon_cutting
variation_type: dynamic_condition
variation_description: Ribbon is loose and slack instead of taut.
changes:
  occlusion_method: null
  dynamic_conditions: Ribbon is loose and slack.
  expected_outcome_change: The ribbon will likely fold between the blades rather than being cut.
prompts:
  init_frame_edit_prompt: Edit the image to make the red ribbon look loose and slack, laying wavy on the
    table instead of taut.
  video_WM: The blades of the sharp scissors begin to close slowly and steadily around the loose, slack
    red ribbon. The closing action begins. The camera rotates right until the scissors and ribbon completely
    exit the view, then rotates toward the left smoothly at the same rate until the center of the ribbon
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The blades of the sharp scissors begin to close slowly and steadily around the loose, slack
    red ribbon. The closing action begins. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table surface. A pair of vintage metal
    scissors is positioned centrally, with the blades open. A wide red satin ribbon passes horizontally
    between the open blades. The ribbon is slack and curved, not taut. In the background, out of focus,
    is a white window frame.
  init2final_edit_prompt: Edit the given image so that the metal scissors are fully closed, with the blades
    touching. The red ribbon must be completely severed at the point where the scissors are positioned,
    showing a clear cut or gap that divides the ribbon into two separate pieces. The cut ends of the ribbon
    should remain lying on the table near the closed blades.
  rationale: The prompt initiates a cutting action ('blades... begin to close') and then introduces a
    camera rotation that occludes the subject for a duration before returning. Given the physical nature
    of scissors closing on a ribbon and the time elapsed during the camera movement, the logical state
    progression is that the scissors complete the closing action and the ribbon is successfully cut. The
    final state should reflect this irreversible structural change (severed ribbon) and the completed
    action state (closed scissors).
  questions:
  - id: ribbon_severed
    question: Is the red ribbon severed into two separate pieces?
    answer_type: yes_no
    notes_for_judge: Look for a clear break, cut, or discontinuity in the ribbon material where the scissors
      are.
  - id: scissors_closed
    question: Are the blades of the scissors closed together?
    answer_type: yes_no
    notes_for_judge: The blades should be touching or overlapping, not open as in the initial frame.
  - id: structural_discontinuity
    question: Is there a visible discontinuity in the ribbon at the cutting point?
    answer_type: yes_no
    notes_for_judge: Tests for the loss of material integrity.
  - id: cut_ends_visible
    question: Are the cut ends of the ribbon visible near the scissors?
    answer_type: yes_no
    notes_for_judge: Checks if the separation is distinct enough to see edges.
  - id: action_completion
    question: Does the object state indicate that the cutting action has occurred?
    answer_type: yes_no
    notes_for_judge: Infer from the closed scissors and broken ribbon.
  - id: table_consistency
    question: Is the wooden table surface still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: window_consistency
    question: Is the window frame in the background still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
