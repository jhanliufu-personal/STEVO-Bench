evaluation:
  init_frame_description: A close-up, eye-level shot of a clear-topped paper shredder in a busy office
    environment. A hand enters from the top right, holding a white sheet of paper vertically above the
    shredder's feed slot. The shredder has a transparent plastic housing revealing metal cylindrical blades.
    Below the mechanism, a grey bin contains a pile of previously shredded white paper strips. In the
    background, blurred office workers are seated at desks with computer monitors.
  init2final_edit_prompt: Edit the given image to show the white sheet of paper partially fed into the
    shredder slot. The visible portion of the paper remaining above the machine should be significantly
    shorter than in the original image, as the bottom section has been pulled into the blades. Ensure
    the bottom edge of the paper is no longer visible as it disappears into the mechanism. Depict new
    paper shreds falling from the blades into the bin below.
  rationale: The action involves feeding paper into a shredder, which is an irreversible transformation.
    As the video progresses, the paper is pulled downwards by the blades. The key state changes are the
    downward motion of the paper, the reduction of the visible intact surface area above the slot, and
    the conversion of the solid sheet into strips (shreds) below the mechanism. The hand likely maintains
    its grip or moves slightly down, but the paper itself must physically enter the machine.
