id: wax_sculpture_melt_collapse_09
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: combined
variation_description: Wooden bird and occlusion via zoom out.
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: Object material is wood.
  expected_outcome_change: The wooden bird does not melt.
prompts:
  init_frame_edit_prompt: Edit the image to change the material of the bird sculpture from wax to carved
    oak wood.
  video_WM: The heat gun blows hot air onto the wooden bird sculpture. The camera zooms out rapidly until
    the workbench is a distant speck and the bird is no longer distinguishable, then zooms back in to
    the original framing. No cut, no scene change. STOP.
  camera_WM: The heat gun blows hot air onto the wooden bird sculpture. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up shot of a workbench featuring a heat gun on the left with an orange
    and silver nozzle pointing towards a small bird sculpture on the right. The bird has a carved wood-grain
    texture and is perched on a square, tarnished metal plate. In the background, out of focus, are various
    workshop tools including a hammer, a white bottle, and a blue vise.
  init2final_edit_prompt: Edit the given image so that the bird sculpture appears melted and structurally
    collapsed. The sculpture should look deformed, with its original shape sagging and features like the
    wings and beak becoming indistinct or distorted. Show pooled material gathered at the base of the
    sculpture on the metal plate, indicating it has melted down. Maintain the original position of the
    heat gun and the background details.
  rationale: The video prompt describes a heat gun blowing hot air onto the sculpture, followed by a camera
    zoom sequence that implies the passage of time. Although the prompt describes the bird as 'wooden',
    the task ID 'wax_sculpture_melt_collapse' indicates the object is likely a wax simulation or prop
    designed to melt. Therefore, the physical interaction results in the sculpture melting, losing its
    structural integrity, and collapsing into a pool of material on the plate by the time the camera returns
    to the original framing.
  questions:
  - id: structural_deformation
    question: Is the bird sculpture significantly deformed compared to its initial shape?
    answer_type: yes_no
    notes_for_judge: The bird should look melted, sagging, or collapsed.
  - id: loss_of_height
    question: Is the height of the bird sculpture lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Melting causes the object to collapse downwards.
  - id: pooled_material
    question: Is there pooled material visible on the metal plate at the base of the sculpture?
    answer_type: yes_no
    notes_for_judge: Melted wax or material should pool at the bottom.
  - id: feature_loss
    question: Have the distinct features of the bird (such as the beak or wing feathers) become less defined
      or smoothed out?
    answer_type: yes_no
    notes_for_judge: Melting reduces sharp details.
  - id: structural_integrity
    question: Has the sculpture lost its original upright structural integrity?
    answer_type: yes_no
    notes_for_judge: It should not be standing perfectly formed anymore.
  - id: heat_gun_presence
    question: Is the heat gun still visible on the left side of the frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the background tools (hammer, vise) still present and unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: material_state
    question: Does the sculpture appear to have undergone a phase change (melting) or severe structural
      damage?
    answer_type: yes_no
    notes_for_judge: Check for signs of melting or collapse.
