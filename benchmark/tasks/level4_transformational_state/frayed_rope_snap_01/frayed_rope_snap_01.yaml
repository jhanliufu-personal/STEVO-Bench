evaluation:
  init_frame_description: A close-up view of a thick, weathered rope under extreme tension between two
    rusty metal winches. The center of the rope is severely frayed, held together by only a few thin strands
    that look ready to snap. Dust and small fibers are floating in the air around the stress point. The
    background is a blurred industrial setting.
  init2final_edit_prompt: Edit the given image to show that the rope has snapped completely in the center.
    Remove the thin connecting strands so there is a clear empty gap between the left and right sections
    of the rope. The frayed ends should be separated and recoiled slightly away from the center, indicating
    a complete structural failure. Keep the winches and background unchanged.
  rationale: 'The initial image shows a rope at the breaking point under high tension. The prompt describes
    the winches pulling tighter, applying extreme tension to the weak point. The occlusion by the safety
    shutter provides a temporal window for the inevitable physical outcome: the rope snapping. When the
    shutter lifts, the irreversible transformation (the break) should be complete, resulting in two separated
    rope ends.'
