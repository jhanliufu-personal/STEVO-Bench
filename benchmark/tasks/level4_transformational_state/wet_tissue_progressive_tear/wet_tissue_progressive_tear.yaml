prompts:
  image_gen_prompt: A white tissue paper is held at both edges by two hands. The tissue is visibly wet and saturated with water, sagging in the middle under its own weight. Water droplets are visible on the surface. The tissue appears weakened and fragile.
  video_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural integrity is severely compromised by water infiltration between fibers. The hands continue applying slow, steady pulling force. The camera rotates right at constant speed until the hands and tissue completely exit the view to the right. The camera continues rotating right for several seconds while the hands remain off-screen continuing to pull. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the hands and tissue back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural integrity is severely compromised by water infiltration between fibers. The hands continue applying slow, steady pulling force during the occlusion period. STOP.
