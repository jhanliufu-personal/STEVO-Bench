id: wet_tissue_progressive_tear
level: 4
category: structural_transformation
transformation_type: saturated_material_rupture
tags: []
prompts:
  image_gen_prompt: A white tissue paper is held at both edges by two hands. The tissue is visibly wet
    and saturated with water, sagging in the middle under its own weight. Water droplets are visible on
    the surface. The tissue appears weakened and fragile.
  video_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When
    tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material
    loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural
    integrity is severely compromised by water infiltration between fibers. The hands continue applying
    slow, steady pulling force. The camera rotates right at constant speed until the hands and tissue
    completely exit the view to the right. The camera continues rotating right for several seconds while
    the hands remain off-screen continuing to pull. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the hands and tissue back into view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When
    tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material
    loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural
    integrity is severely compromised by water infiltration between fibers. The hands continue applying
    slow, steady pulling force during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot showing a pair of hands holding a wet, white tissue
    sheet over a stainless steel kitchen sink. The tissue is saturated with water, appearing translucent
    and sagging in the center, with a water droplet hanging from the bottom edge. A chrome faucet is visible
    in the background, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the wet tissue torn vertically down the center.
    Render the tissue as separated into two distinct, ragged pieces, with one piece held by the left hand
    and the other by the right hand. Show a visible gap of empty space between the two torn halves where
    the material has failed. Ensure the torn edges look fibrous and uneven, consistent with wet paper
    tearing. Keep the hands and the background sink and faucet unchanged.
  rationale: The video prompt establishes that the tissue is wet (weakening its bonds) and that the hands
    are applying outward tension. The camera pans away, occluding the object, while the pulling action
    continues for several seconds. Given the material properties of wet tissue, the sustained pulling
    force during the occlusion will inevitably cause the tissue to tear or completely separate. When the
    camera returns, the single sheet must be visibly ripped or divided into fragments, representing an
    irreversible structural change.
  questions:
  - id: tear_visible
    question: Is the tissue torn or ripped?
    answer_type: yes_no
    notes_for_judge: Look for a visible tear, rip, or separation in the material.
  - id: structural_continuity
    question: Has the tissue lost its structural continuity compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial frame shows a single continuous sheet. The final frame should show a
      break in this continuity.
  - id: separation_gap
    question: Is there a visible gap or empty space separating parts of the tissue?
    answer_type: yes_no
    notes_for_judge: Check if the material has been pulled apart to reveal the background between the
      pieces.
  - id: ragged_edges
    question: Do the edges of the tissue appear ragged or fibrous where the damage occurred?
    answer_type: yes_no
    notes_for_judge: Torn wet tissue leaves uneven, fibrous edges, not clean cuts.
  - id: two_pieces
    question: Are the hands now holding separate fragments or halves of the tissue?
    answer_type: yes_no
    notes_for_judge: The left hand should hold one part and the right hand another, with a disconnect
      between them.
  - id: material_integrity
    question: Is the material integrity of the tissue compromised?
    answer_type: yes_no
    notes_for_judge: Compromised means broken, torn, or shredded.
  - id: sink_visible
    question: Is the stainless steel sink still visible in the background?
    answer_type: yes_no
    notes_for_judge: Consistency check for the background.
  - id: hands_present
    question: Are the hands still present in the frame?
    answer_type: yes_no
    notes_for_judge: Consistency check for the actors.
