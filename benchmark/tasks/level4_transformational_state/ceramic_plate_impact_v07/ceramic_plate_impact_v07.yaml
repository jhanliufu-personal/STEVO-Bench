evaluation:
  init_frame_description: A white circular ceramic plate rests on a rough, cracked concrete floor. A large
    black rubber mallet with a wooden handle is suspended in the air above the plate, positioned to strike
    it. Natural light illuminates the scene from a window on the left.
  init2final_edit_prompt: Edit the given image to show the white ceramic plate shattered into multiple
    broken shards and fragments scattered on the concrete floor. Position the head of the black rubber
    mallet lower, resting on or near the broken ceramic pieces. Ensure the lighting is bright and matches
    the initial frame, showing the aftermath of the impact clearly.
  rationale: The prompt describes a forceful swing of a heavy mallet onto a fragile ceramic plate. Although
    the moment of impact is obscured by darkness, the physical interaction necessitates that the plate
    will shatter. When the lights return, the irreversible structural damage (broken plate) must be visible,
    and the mallet will have completed its downward trajectory, resting on the floor or debris.
