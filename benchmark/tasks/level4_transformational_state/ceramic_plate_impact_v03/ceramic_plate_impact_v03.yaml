prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The heavy steel hammer swings down forcefully toward the ceramic plate. Upon impact, a burst
    of thick, opaque white smoke instantly fills the frame, completely obscuring the floor and objects.
    The smoke slowly dissipates over several seconds until the visibility is clear again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The heavy steel hammer swings down forcefully toward the ceramic plate. Upon impact, a burst
    of thick, opaque white smoke instantly fills the frame, completely obscuring the floor and objects.
    The smoke slowly dissipates over several seconds until the visibility is clear again. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A white ceramic dinner plate sits in the center of a cracked concrete floor.
    A heavy sledgehammer with a wooden handle and metal head is positioned mid-air, angled downwards from
    the right, poised to strike the plate. Natural light illuminates the scene from a window on the left.
  init2final_edit_prompt: Edit the given image to show the ceramic plate shattered into multiple broken
    shards and fragments scattered on the concrete floor where the intact plate previously sat. Position
    the hammer head lower, resting on or among the ceramic debris, consistent with having just struck
    the object.
  rationale: 'The video prompt describes a forceful impact that creates a temporary visual obstruction
    (smoke) which then clears. The physical interaction (hammer hitting ceramic) results in the irreversible
    destruction of the plate. Therefore, the final frame must show the aftermath: the plate broken into
    pieces and the hammer in a post-impact position (lower/resting), with the smoke sufficiently dissipated
    to reveal the structural damage.'
