    projectile was aimed. Render a hole or impact crater in the glass with small shards of debris. The
    projectile should be removed from its original mid-air position, implying it has passed through or
    impacted the surface.
  rationale: The video depicts a high-speed impact event. Within the timeframe, the projectile will strike
    the glass surface, causing an immediate brittle failure. This results in irreversible structural damage
    to the window pane, specifically shattering, cracking, and the creation of an impact hole. The projectile
    continues its trajectory or embeds, leaving the glass permanently altered.
