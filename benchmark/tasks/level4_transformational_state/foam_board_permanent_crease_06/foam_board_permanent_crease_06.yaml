variation_description: Force application changed to gentle holding below yield limit.
changes:
  occlusion_method: null
  dynamic_conditions: Hands hold the board gently without applying bending force.
  expected_outcome_change: No deformation occurs; board remains flat.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands hold the foam board gently by the edges without bringing the ends closer together.
    The foam core has an elastic limit, but no bending moment is applied to the structure. The stress
    on the material remains negligible and well below the threshold for plastic deformation or failure.
    The hands maintain this gentle, static grip. The camera rotates right at constant speed until the
    hands and board completely exit the view to the right. The camera continues rotating right for several
    seconds while the hands remain off-screen holding the board. Then the camera rotates left smoothly
    at the same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands hold the foam board gently by the edges without bringing the ends closer together.
    The foam core has an elastic limit, but no bending moment is applied to the structure. The stress
    on the material remains negligible and well below the threshold for plastic deformation or failure.
    The hands maintain this gentle, static grip during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a person's hands holding a rectangular white foam
    board. The hands, belonging to a person with light skin and arm hair, grip the left and right edges
    of the board. The board is perfectly flat, pristine, and unbent. The background shows a blurred workshop
    environment with a wooden workbench in the foreground and tools hanging on a pegboard in the rear.
  init2final_edit_prompt: 'Edit the given image to show the foam board in exactly the same state as the
    original: completely flat, unbent, and pristine. Ensure there are no creases, folds, or signs of damage
    on the white surface. The hands should remain holding the edges in the same position without compressing
    the board. The scene should appear identical to the initial frame.'
  rationale: The video prompt explicitly states that the hands hold the board gently without applying
    any bending moment or bringing the ends closer together. It emphasizes that the stress is negligible
    and below the limit for deformation. The camera pans away and returns to the original view. Therefore,
    the correct physical outcome is that the board remains structurally unchanged—flat, uncreased, and
    intact. This task tests the model's ability to maintain object state stability and avoid hallucinating
    damage or transformation when the causal action (bending) is absent.
