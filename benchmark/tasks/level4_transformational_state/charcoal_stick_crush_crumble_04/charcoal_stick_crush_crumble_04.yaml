id: charcoal_stick_crush_crumble_04
level: 4
category: structural_transformation
tags: []
variant_of: charcoal_stick_crush_crumble
variation_type: dynamic_condition
variation_description: Changes material to steel, which should not break under hand pressure.
changes:
  occlusion_method: null
  dynamic_conditions: Material changed from brittle charcoal to rigid steel.
  expected_outcome_change: The object remains intact (no crumbling).
prompts:
  init_frame_edit_prompt: Edit the image to replace the charcoal stick with a solid, polished steel cylinder
    of the same size and shape.
  video_WM: The fingers begin applying progressive squeezing pressure to the steel cylinder. Steel is
    a rigid metal alloy with extremely high structural integrity and resistance to compression. The material
    is dense and hard. The fingers continue increasing compressive force. The camera rotates right until
    the hand and cylinder completely exit the view to the right. The camera continues rotating right for
    several seconds while the hand remains off-screen continuing to apply pressure. Then the camera rotates
    left smoothly at the same rate back to the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the steel cylinder. Steel is
    a rigid metal alloy with extremely high structural integrity and resistance to compression. The material
    is dense and hard. The fingers continue increasing compressive force during the occlusion period.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
evaluation:
  init_frame_description: A close-up view of a dirty human hand holding a shiny, silver-colored steel
    cylinder. The hand is covered in black soot or charcoal dust. The cylinder is polished, reflective,
    and perfectly cylindrical with straight edges. The background shows a wooden table with charcoal drawings
    and art supplies.
  init2final_edit_prompt: Edit the given image to show the steel cylinder held in the hand. The cylinder
    must remain perfectly rigid, straight, and intact, showing absolutely no signs of deformation, bending,
    crushing, or damage, reflecting the properties of solid steel. The surface should remain smooth and
    reflective. The hand should maintain a firm grip on the object.
  rationale: The prompt explicitly defines the object as a steel cylinder with high structural integrity
    and resistance to compression. While the fingers apply squeezing force, human grip strength is insufficient
    to deform or crush a solid steel cylinder. Therefore, unlike a charcoal stick, the steel object must
    resist all deformation. The camera pans away and returns to the original view, but the object's state
    must remain physically unchanged (no crumbling, bending, or breaking).
  questions:
  - id: structural_integrity
    question: Does the steel cylinder retain its original straight, cylindrical shape?
    answer_type: yes_no
    notes_for_judge: The object is steel and should not deform under hand pressure.
  - id: no_deformation
    question: Is the surface of the cylinder free from visible dents, bends, or compression?
    answer_type: yes_no
    notes_for_judge: Check for any signs of the metal giving way.
  - id: no_fragmentation
    question: Is the object free of any crumbling, fragmentation, or loose pieces?
    answer_type: yes_no
    notes_for_judge: Unlike charcoal, steel should not crumble.
  - id: surface_continuity
    question: Does the metal surface appear smooth and continuous?
    answer_type: yes_no
    notes_for_judge: The surface should not be broken or cracked.
  - id: solidity
    question: Does the cylinder appear to be a single, solid, unbroken piece?
    answer_type: yes_no
    notes_for_judge: It should not be snapped or separated.
  - id: reflection_integrity
    question: Are the reflections on the cylinder relatively undistorted by structural damage?
    answer_type: yes_no
    notes_for_judge: Damage would warp the reflections significantly.
  - id: hand_presence
    question: Is the hand still holding the cylinder?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
