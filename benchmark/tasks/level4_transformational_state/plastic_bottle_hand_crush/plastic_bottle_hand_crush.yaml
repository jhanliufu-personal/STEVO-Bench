  camera_WM: The hand grips the bottle and begins applying progressive squeezing force. Thin plastic bottles are made from PET polymer with relatively low resistance to deformation. The thin walls have an elastic limit beyond which permanent plastic deformation occurs. The material cannot spontaneously return to original shape after exceeding this threshold. The hand continues increasing compressive force during the occlusion period. STOP.
