evaluation:
  init_frame_description: A close-up shot of a metal box grater standing on a wooden cutting board. A
    hand is holding a large, whole orange carrot horizontally against the side of the grater with large
    holes. There is a small amount of shredded carrot already present on the cutting board at the base
    of the grater. The background shows a window sill.
  init2final_edit_prompt: Edit the given image to show the carrot significantly shorter in length, appearing
    partially grated down. Increase the quantity of shredded carrot pieces on the wooden cutting board
    at the base of the grater, creating a larger pile of orange shavings. Adjust the hand's position to
    be closer to the grater surface, holding the remaining shorter segment of the carrot.
  rationale: The video prompt describes a grating action that continues behind an occluding towel. Grating
    is a destructive process that irreversibly reduces the size of the object being grated (the carrot)
    and produces debris (shreds). Therefore, the final state must show the carrot with reduced mass/length
    and a corresponding accumulation of grated material on the cutting board.
