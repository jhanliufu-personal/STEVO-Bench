evaluation:
  init_frame_description: A whole, rectangular brown graham cracker is placed inside a clear plastic ziplock
    bag lying flat on a light-colored wooden table. A human hand is positioned directly above the bag,
    palm facing down, hovering slightly or just making contact with the plastic surface.
  init2final_edit_prompt: Edit the given image to show the graham cracker inside the bag crushed into
    broken fragments and crumbs. The original rectangular shape should be destroyed and replaced by a
    flattened pile of debris and coarse powder. The hand should be pressing down on the bag over the crushed
    contents.
  rationale: The prompt describes a destructive physical interaction where a brittle object (graham cracker)
    is subjected to compressive force and grinding. The period of darkness serves as a temporal gap during
    which the irreversible structural breakdown occurs. When the scene is revealed again, the cracker
    must be fractured into pieces or powder, as it cannot recover its original form after being crushed.
    The hand remains the active agent applying force.
  questions:
  - id: structural_change_1
    question: Does the graham cracker appear broken, fractured, or crushed?
    answer_type: yes_no
    notes_for_judge: Look for evidence that the single solid piece has broken into smaller parts.
  - id: structural_change_2
    question: Are there visible crumbs or loose fragments inside the bag?
    answer_type: yes_no
    notes_for_judge: The presence of debris or powder indicates the material has been ground or crushed.
  - id: structural_change_3
    question: Has the original rectangular shape of the cracker been disrupted or destroyed?
    answer_type: yes_no
    notes_for_judge: The outline should no longer be a perfect rectangle.
  - id: structural_change_4
    question: Is the material inside the bag more fragmented than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the integrity of the object between frames.
  - id: structural_change_5
    question: Does the object inside the bag show signs of irreversible damage?
    answer_type: yes_no
    notes_for_judge: Crushing is irreversible.
  - id: consistency_1
    question: Is the plastic bag still visible?
    answer_type: yes_no
    notes_for_judge: The container should remain.
  - id: consistency_2
    question: Is the wooden table surface still visible in the background?
    answer_type: yes_no
    notes_for_judge: The environment should be consistent.
