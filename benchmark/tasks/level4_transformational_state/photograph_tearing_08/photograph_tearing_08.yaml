id: photograph_tearing_08
level: 4
category: structural_transformation
tags: []
variant_of: photograph_tearing
variation_type: combined
variation_description: Combined object blocking occlusion with rigid material.
changes:
  occlusion_method: A large folder blocks the view.
  dynamic_conditions: Material is rigid plastic.
  expected_outcome_change: The object remains intact.
prompts:
  init_frame_edit_prompt: Edit the image to change the photograph into a thick, rigid plastic ID card
    with a glossy surface, removing the small tear at the top edge.
  video_WM: The two hands pull firmly in opposite directions on the thick rigid plastic card. Tension
    is applied to the durable material. A large opaque manila folder slides into view, covering the hands
    and card completely, then slides away. No zoom, no cut, no scene change. The camera returns to the
    original viewpoint. STOP.
  camera_WM: The two hands pull firmly in opposite directions on the thick rigid plastic card. Tension
    is applied to the durable material. A large opaque manila folder slides into view, covering the hands
    and card completely, then slides away. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of two hands holding a rectangular, glossy object that appears
    to be a photograph or a rigid plastic card with a sunset beach scene printed on it. The left hand
    holds the left edge and the right hand holds the right edge. The background is dark and out of focus.
  init2final_edit_prompt: Edit the given image so that the card is torn or snapped vertically down the
    middle. Show a jagged tear line or break separating the card into two distinct pieces or halves. The
    image of the sunset on the card should be split by this damage. The hands should be holding the separated
    or partially separated fragments, potentially pulled slightly further apart.
  rationale: The prompt describes hands pulling firmly in opposite directions on a rigid card, implying
    a force sufficient to break or tear it. The occlusion by the manila folder covers the moment of structural
    failure. Upon the folder's removal, the irreversible transformation (the card snapping or tearing)
    should be visible, resulting in a damaged object.
  questions:
  - id: is_torn_or_broken
    question: Does the card show a visible tear, crack, or break?
    answer_type: yes_no
    notes_for_judge: Look for a vertical separation, jagged edge, or snap line in the material.
  - id: image_discontinuity
    question: Is the sunset image printed on the card interrupted by a structural break?
    answer_type: yes_no
    notes_for_judge: The visual content of the card should be split or discontinuous due to the damage.
  - id: structural_integrity
    question: Has the card lost its original single-piece rectangular form?
    answer_type: yes_no
    notes_for_judge: It should be in two pieces or deeply cracked.
  - id: separation_of_parts
    question: Are the parts of the card held by the left and right hands separated or pulling apart?
    answer_type: yes_no
    notes_for_judge: The hands should be pulling the fragments away from each other.
  - id: damage_location
    question: Is the damage located roughly in the center between the two hands?
    answer_type: yes_no
    notes_for_judge: The break should occur where the tension was applied.
  - id: hands_visible
    question: Are the hands still visible holding the object?
    answer_type: yes_no
    notes_for_judge: Consistency check.
  - id: background_consistency
    question: Is the background still dark and out of focus?
    answer_type: yes_no
    notes_for_judge: Consistency check.
