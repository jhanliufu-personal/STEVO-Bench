id: bleach_colored_fabric_fade_04
level: 4
category: structural_transformation
tags: []
variant_of: bleach_colored_fabric_fade
variation_type: dynamic_condition
variation_description: Changes the liquid from bleach to water (negative control).
changes:
  occlusion_method: null
  dynamic_conditions: Liquid is now water (inert) instead of bleach (reactive).
  expected_outcome_change: No bleaching occurs; fabric appears wet (darker blue) but does not turn white/pink.
prompts:
  init_frame_edit_prompt: Edit the image to remove the Clorox logo and change the text on the bottle label
    to read 'WATER' in large blue letters.
  video_WM: The bottle labeled 'WATER' tips and pours clear water onto the dark blue fabric surface. Water
    is a neutral solvent (H2O) that wets fibers but does not possess oxidizing properties to break down
    dye molecules. It creates a wet spot but does not cause a chemical color change. The water continues
    to contact and saturate the fabric fibers. The camera rotates right at constant speed until the tray
    and fabric completely exit the view to the right. The camera continues rotating right for several
    seconds while the water remains in contact with the fabric off-screen. Then the camera rotates left
    smoothly at the same rate back to the original viewpoint, bringing the tray and fabric back into view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The bottle labeled 'WATER' tips and pours clear water onto the dark blue fabric surface.
    Water is a neutral solvent (H2O) that wets fibers but does not possess oxidizing properties to break
    down dye molecules. It creates a wet spot but does not cause a chemical color change. The water continues
    to contact and saturate the fabric fibers during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A white plastic bottle labeled 'WATER' in blue text is held by a hand, tipping
    to pour a clear liquid stream onto a dark blue square of crinkled fabric placed on a white tray. A
    small, dark wet spot is forming where the water hits the fabric.
  init2final_edit_prompt: Edit the given image to show the dark blue fabric with a significantly larger
    and more saturated wet spot in the center. The wet area must appear darker blue than the surrounding
    dry fabric to indicate water saturation, but it must strictly retain its original deep blue hue without
    any whitening, orange discoloration, or bleaching. The texture of the wet area should appear flattened
    and soaked. Keep the bottle, hand, and white tray unchanged.
  rationale: The prompt explicitly states that the liquid is water, a neutral solvent that wets fibers
    but does not cause chemical bleaching or color change. During the occlusion (camera rotation), the
    water continues to pour and saturate the fabric. Therefore, the final state must show a larger area
    of wetness. Wet fabric appears darker due to optical saturation, but because no bleach is present,
    the dye molecules are not broken down, and no white or orange discoloration should occur.
