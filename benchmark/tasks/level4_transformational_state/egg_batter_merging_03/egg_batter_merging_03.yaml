    and flour are being combined into a single batter. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A ceramic mixing bowl sits on a wooden table, containing a ring of white flour
    surrounding four raw eggs with distinct yellow yolks and clear whites. A metal whisk rests in the
    bowl, with its handle pointing towards the top right. A linen cloth lies to the right of the bowl,
    and scattered flour is visible on the table to the left. A window is in the background.
  init2final_edit_prompt: Edit the given image to show the eggs and flour inside the bowl mixed into a
    batter. The distinct round egg yolks and the clean ring of flour must be blended together into a lumpy,
    yellowish dough or batter mixture. The whisk should remain in the bowl, embedded in or coated by the
    mixture. Ensure the bowl, table, and background remain unchanged.
  rationale: 'The video prompt describes a rapid stirring action that combines distinct ingredients (eggs
    and flour) into a single batter. The camera zooms out and then back in to the original framing, implying
    a duration of time has passed while the action occurred. Consequently, the final frame must show the
    result of this irreversible physical transformation: the destruction of the distinct egg yolks and
    flour ring, replaced by a mixed or partially mixed batter.'
