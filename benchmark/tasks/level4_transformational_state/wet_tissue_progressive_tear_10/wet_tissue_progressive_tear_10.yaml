id: wet_tissue_progressive_tear_10
level: 4
category: structural_transformation
tags: []
variant_of: wet_tissue_progressive_tear
variation_type: combined
variation_description: Extremely degraded tissue combined with a cardboard box blocking the view.
changes:
  occlusion_method: A large cardboard box moves in front of the camera.
  dynamic_conditions: Tissue is already disintegrating/soaking wet.
  expected_outcome_change: Rapid and total disintegration.
prompts:
  init_frame_edit_prompt: Edit the image to make the tissue look extremely soggy, partially falling apart,
    with heavy water dripping profusely.
  video_WM: The hands hold a piece of tissue that is completely saturated and already losing structural
    integrity. The paper is mushy and barely holding together under its own weight, let alone tension.
    The hands apply a very slight outward pull. A large cardboard box is lifted into the frame from the
    bottom, completely blocking the view of the sink area. The box remains in front of the camera for
    several seconds while the hands continue their action behind it. The box is then lowered out of the
    frame, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands hold a piece of tissue that is completely saturated and already losing structural
    integrity. The paper is mushy and barely holding together under its own weight, let alone tension.
    The hands apply a very slight outward pull. A large cardboard box is lifted into the frame from the
    bottom, completely blocking the view of the sink area. The box remains in front of the camera for
    several seconds while the hands continue their action behind it. The box is then lowered out of the
    frame. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of two hands holding a rectangular sheet of wet, white tissue
    paper over a stainless steel sink. The tissue is saturated, translucent, and already shows signs of
    structural weakness with small holes and thinning areas. Water droplets are dripping from the bottom
    edge of the tissue. A faucet is visible in the background.
  init2final_edit_prompt: Edit the given image to show the wet tissue torn apart. Create a large, ragged
    vertical tear or complete separation in the center of the tissue sheet where the tension was applied.
    The hands should be holding the separated or heavily torn remnants of the tissue, with the torn edges
    looking wet and fibrous.
  rationale: The tissue is described as saturated and barely holding together. The prompt specifies a
    continuous outward pull by the hands. Although a box occludes the view for several seconds, the physical
    action (pulling) continues on the fragile material. Wet tissue has very low tensile strength; therefore,
    the continuous tension will inevitably cause the tissue to rip or separate completely. The final frame,
    after the box is removed, must show the irreversible structural failure of the tissue.
  questions:
  - id: tissue_torn
    question: Is the tissue visibly torn or separated into pieces?
    answer_type: yes_no
    notes_for_judge: Look for a major structural break, rip, or separation that was not present in the
      initial frame.
  - id: structural_continuity
    question: Is the structural continuity of the tissue sheet broken compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial tissue was mostly one piece; the final state should show a significant
      break in that continuity.
  - id: tear_size
    question: Is the damaged area or gap in the tissue significantly larger than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial frame has small holes; the final frame should have a large tear or separation.
  - id: material_failure
    question: Does the tissue show evidence of material failure (shredding, ripping) due to tension?
    answer_type: yes_no
    notes_for_judge: Check for ragged edges consistent with torn wet paper.
  - id: connection_reduced
    question: Is the connection between the left and right sides of the tissue reduced or eliminated?
    answer_type: yes_no
    notes_for_judge: The tissue should be holding together less than before.
  - id: box_removed
    question: Is the view of the sink and hands unobstructed by the cardboard box?
    answer_type: yes_no
    notes_for_judge: The box should have been lowered out of frame, revealing the scene again.
  - id: hands_present
    question: Are the hands still present in the frame holding the tissue remnants?
    answer_type: yes_no
    notes_for_judge: The hands should not have disappeared.
