id: projectile_window_break
level: 4
category: structural_transformation
transformation_type: fracture (high velocity)
prompts:
  image_gen_prompt: A pristine pane of glass in a window frame. A small metal BB projectile is visible
    mid-air, traveling at high speed just inches away from the glass surface.
  video_WM: The high-speed metal BB projectile strikes the center of the glass pane. The impact is instantaneous.
    The camera rotates right until the window frame completely exits the view, then rotates toward the
    left smoothly at the same rate until the window frame is back in the center of view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: The high-speed projectile impacts the glass window pane. The collision occurs. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A view through a wooden window frame looking out at a blurred green garden and
    a wooden house. A copper-colored bullet or projectile is frozen in mid-air, positioned centrally against
    the glass pane, with visible air distortion trails indicating high speed. The glass pane appears intact.
  init2final_edit_prompt: Edit the given image to show the glass pane shattered or cracked, with a spiderweb
    pattern of fractures radiating from the center where the projectile was aiming. Remove the floating
    projectile from the air. Keep the wooden window frame and the outdoor background scenery of the house
    and trees consistent, but render the glass surface as visibly broken.
  rationale: 'The prompt describes a projectile striking the glass, which is an irreversible physical
    transformation. The camera rotates away (occluding the window) and then returns to the original view.
    During the elapsed time of the camera movement, the impact will have occurred, causing the brittle
    glass to shatter, crack, or break. The final state must show the aftermath of this impact: damaged
    glass and the absence of the projectile in its original flight position.'
