id: sandcastle_wave_impact_06
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: dynamic_condition
variation_description: Wave trajectory changed to miss the castle.
changes:
  occlusion_method: null
  dynamic_conditions: 'Trajectory: Direct hit -> Miss (background)'
  expected_outcome_change: Sandcastle remains dry and intact
prompts:
  init_frame_edit_prompt: Edit the image so the wave is breaking far in the background distance, leaving
    the sand around the castle dry and calm.
  video_WM: The wave breaks in the distance behind the sandcastle, not reaching the structure itself.
    The camera rotates right until the sandcastle completely exits the view, then rotates toward the left
    smoothly at the same rate until the sandcastle is back in the center of view. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The wave breaks in the distance behind the sandcastle, not reaching the structure itself.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A detailed sandcastle sits on a sandy beach in the foreground. The sandcastle
    features multiple towers with conical roofs, a central keep, a bridge or archway connecting sections,
    and decorative white shells placed along the walls and base. The sand is tan and textured. In the
    background, a large, menacing ocean wave with a green face and white crest is curling and about to
    break. The sky above is dark and overcast with grey storm clouds.
  init2final_edit_prompt: Edit the given image to show the large wave in the background has crashed into
    white foam or dissipated. The sandcastle in the foreground must remain exactly as it was in the original
    image, completely intact with no structural damage, no missing towers, and no water touching it. The
    composition and lighting should remain consistent with the initial view.
  rationale: 'The video prompt explicitly states that the wave breaks in the distance and does not reach
    the sandcastle. The camera rotates away (occlusion) and then returns to the original view. Therefore,
    the physical state of the sandcastle must remain invariant (object permanence and stability), showing
    no damage or erosion. However, the background environment must evolve: the looming wave seen in the
    initial frame would have crashed and dissipated during the time elapsed for the camera movement.'
  questions:
  - id: sandcastle_intact
    question: Is the sandcastle structure still standing and intact?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the wave does not reach the structure, so it should be undamaged.
  - id: wave_state_change
    question: Has the large curling wave in the background crashed or dissipated?
    answer_type: yes_no
    notes_for_judge: Time has passed, so the wave should no longer be in the exact moment of breaking.
  - id: towers_standing
    question: Are the pointed towers of the sandcastle still vertical?
    answer_type: yes_no
    notes_for_judge: Check for structural integrity of the vertical elements.
  - id: bridge_integrity
    question: Is the sand bridge or archway connecting the castle parts still intact?
    answer_type: yes_no
    notes_for_judge: Specific structural detail check.
  - id: no_water_damage
    question: Is the sandcastle free from visible water damage or flooding?
    answer_type: yes_no
    notes_for_judge: The prompt says the wave did not reach the structure.
  - id: shells_present
    question: Are the decorative shells still visible on the sandcastle?
    answer_type: yes_no
    notes_for_judge: Check for fine detail preservation.
  - id: object_permanence
    question: Is the sandcastle visible in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera rotated back to the center view.
