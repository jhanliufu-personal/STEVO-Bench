prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A person begins vigorously moving the hand saw back and forth across the wooden log. The sawing
    action to cut through the log is active. A thick cloud of white smoke blows across the scene, completely
    obscuring the log and saw from view. The smoke eventually dissipates, revealing the scene again. No
    zoom, no cut, no scene change. STOP.
  camera_WM: A person begins vigorously moving the hand saw back and forth across the wooden log. The
    sawing action to cut through the log is active. A thick cloud of white smoke blows across the scene,
    completely obscuring the log and saw from view. The smoke eventually dissipates, revealing the scene
    again. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up outdoor shot of a thick wooden log resting horizontally on a rustic
    wooden sawhorse (X-shaped support). A hand saw with a wooden handle and metal blade is resting in
    a shallow cut (kerf) on the top of the log. There is a small amount of sawdust around the cut. The
    background shows a blurred forest with trees.
  init2final_edit_prompt: Edit the given image to show the metal saw blade positioned significantly deeper
    into the wooden log, indicating that the cutting action has progressed. Add a noticeable amount of
    fresh sawdust on the top of the log around the cut and on the wooden sawhorse structure below. The
    groove in the log should appear deeper and more pronounced.
  rationale: 'The prompt describes vigorous sawing action that continues while the scene is obscured by
    smoke. When the smoke clears, the physical state of the log must reflect the work done during that
    time. This implies an irreversible structural change: the cut (kerf) in the log must be deeper, the
    saw blade should be situated lower within the wood, and there should be an accumulation of fresh sawdust
    resulting from the material removal.'
