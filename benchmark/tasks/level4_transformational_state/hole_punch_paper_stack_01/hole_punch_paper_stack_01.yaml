prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand begins pressing the lever downward with progressive force. The hole punch contains
    cylindrical cutting blades that advance toward the paper when the lever is depressed. The paper stack
    consists of standard copy paper with typical fiber structure and tensile strength. The mechanism is
    designed to drive blades through the paper thickness. Suddenly, the room lights turn off completely,
    plunging the scene into absolute darkness for several seconds while the hand continues pressing the
    lever. The lights turn back on, restoring the original lighting conditions. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The hand begins pressing the lever downward with progressive force. The hole punch contains
    cylindrical cutting blades that advance toward the paper when the lever is depressed. The paper stack
    consists of standard copy paper with typical fiber structure and tensile strength. The mechanism is
    designed to drive blades through the paper thickness. Suddenly, the room lights turn off completely,
