id: ribbon_cutting
level: 4
category: structural_transformation
transformation_type: cutting (topology change)
prompts:
  image_gen_prompt: A continuous length of red satin ribbon is pulled taut horizontally. A pair of sharp
    open scissors is positioned around the center of the ribbon, blades ready to close.
  video_WM: The blades of the sharp scissors begin to close slowly and steadily around the taut red ribbon.
    The cutting action begins. The camera rotates right until the scissors and ribbon completely exit
    the view, then rotates toward the left smoothly at the same rate until the center of the ribbon is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The scissors close on the taut red ribbon, beginning the cutting action. The blades continue
    to close. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, high-angle shot of a smooth red ribbon lying horizontally across
    a rustic wooden table. A pair of open, vintage metal scissors is positioned diagonally, with the ribbon
    placed between the open blades, ready to be cut. The background shows a blurred window frame.
  init2final_edit_prompt: Edit the given image so that the metal scissors are fully closed. The red ribbon
    must be severed into two separate pieces at the point where the scissor blades meet, creating a visible
    break in the ribbon's continuity.
  rationale: 'The video prompt describes the scissors closing to cut the ribbon while the camera pans
    away and then returns. This implies that during the occlusion (the time the camera is looking away),
    the physical action of cutting proceeds. When the camera returns to the initial view, the irreversible
    transformation should be evident: the scissors should be closed (or significantly more closed), and
    the ribbon should be cut into two distinct segments.'
  questions:
  - id: ribbon_continuity
    question: Is the red ribbon severed into two separate pieces?
    answer_type: yes_no
    notes_for_judge: Check if the ribbon is no longer a single continuous strip.
  - id: scissor_state
    question: Are the blades of the scissors closed or significantly closer together than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The blades should have moved to complete the cutting action.
  - id: structural_change
    question: Is there a visible gap or break in the ribbon where the scissors are located?
    answer_type: yes_no
    notes_for_judge: Look for a discontinuity in the material.
  - id: action_progress
    question: Does the image show evidence that the cutting action has occurred?
    answer_type: yes_no
    notes_for_judge: Evidence includes a cut ribbon and closed scissors.
  - id: material_separation
    question: Are the two ends of the ribbon at the cut point separated?
    answer_type: yes_no
    notes_for_judge: The ribbon should not be connected at the cut site.
  - id: wood_visibility
    question: Is the wooden surface visible between the severed ends of the ribbon?
    answer_type: yes_no
    notes_for_judge: If the ribbon is cut, the table underneath might be visible in the gap.
  - id: background_consistency
    question: Is the window frame in the background still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: object_permanence
    question: Is the red ribbon still the primary object on the table?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
