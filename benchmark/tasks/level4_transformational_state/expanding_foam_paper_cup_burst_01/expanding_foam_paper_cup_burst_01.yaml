evaluation:
  init_frame_description: A close-up shot of a gloved hand holding a can of 'Great Stuff' polyurethane
    foam. The can has a red dispensing straw/nozzle attached. The nozzle is inserted into a small, brown
    paper cup sitting on a table covered with a plastic sheet. There are dried patterns of foam on the
    plastic sheet. In the background, there are wooden planks, a hammer, a clamp, and a window.
  init2final_edit_prompt: Edit the given image to show the paper cup overflowing and burst open with a
    large, irregular mass of expanded yellow polyurethane foam. Render the foam as having significantly
    increased in volume, spilling over the rim and through tears in the cup's sides onto the table surface.
    Make the paper cup appear structurally damaged, ripped, or deformed due to the internal pressure of
    the expanded foam.
  rationale: 'The prompt describes the dispensing of expanding foam into a confined container (a paper
    cup) followed by an occlusion. Polyurethane foam expands rapidly (30-50x volume) and exerts significant
    pressure. Given the weak structural integrity of a paper cup, the foam will inevitably fill the cup,
    overflow, and likely tear or burst the cup walls during the occlusion period. The final state must
    show the irreversible results of this expansion: a large mass of cured/curing foam and a damaged container.'
