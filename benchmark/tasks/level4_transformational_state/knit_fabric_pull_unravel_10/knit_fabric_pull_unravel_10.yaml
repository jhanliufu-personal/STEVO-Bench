id: knit_fabric_pull_unravel_10
level: 4
category: structural_transformation
tags: []
variant_of: knit_fabric_pull_unravel
variation_type: combined
variation_description: Occlusion by camera moving away AND yarn material changed to slippery nylon.
changes:
  occlusion_method: Camera physically moves backward away from the scene.
  dynamic_conditions: Material is smooth slippery nylon cord.
  expected_outcome_change: Fabric unravels much faster and more smoothly due to low friction.
prompts:
  init_frame_edit_prompt: Edit the image to change the yarn texture from wool to a shiny, smooth, slippery
    nylon cord.
  video_WM: The hand begins pulling steadily on the yarn end. The fabric is knitted from smooth, low-friction
    nylon cord. Low friction materials allow loops to slide past each other with minimal resistance. The
    hand continues pulling the yarn with steady tension. The camera physically moves backward, retreating
    from the table until the scene is distant and details are lost. The camera remains at a distance for
    several seconds while the hand continues pulling. Then the camera moves forward, returning to the
    exact original position. STOP.
  camera_WM: The hand begins pulling steadily on the yarn end. The fabric is knitted from smooth, low-friction
    nylon cord. Low friction materials allow loops to slide past each other with minimal resistance. The
    hand continues pulling the yarn with steady tension. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a chunky beige knitted fabric made of thick,
    twisted nylon cord resting on a rustic wooden table. A hand on the left holds a loose end of the cord,
    which is connected to the edge of the knit. The loops at the edge of the fabric are large and distinct.
  init2final_edit_prompt: Edit the given image to show the knitted fabric significantly unraveled. The
    loose end of the cord held by the hand should be much longer, extending further across the table or
    hanging down, indicating a substantial length has been pulled free. The main body of the knitted fabric
    should be smaller in area, with the edge where the cord connects appearing receded or deconstructed
    compared to the original state. The wooden table surface should be visible in the space where the
    fabric has been pulled away.
  rationale: 'The prompt describes a continuous pulling action on a low-friction knitted cord. This physical
    action causes the loops to slide and the fabric to unravel, which is a structural deconstruction.
    The camera moves away and then returns to the exact original position. During the time the camera
    is distant, the hand continues pulling, so when the view returns, the state of the object must have
    progressed: the loose yarn should be longer and the fabric piece smaller due to unraveling.'
