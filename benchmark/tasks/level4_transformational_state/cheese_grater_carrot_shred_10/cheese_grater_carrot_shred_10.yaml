id: cheese_grater_carrot_shred_10
level: 4
category: structural_transformation
tags: []
variant_of: cheese_grater_carrot_shred
variation_type: combined
variation_description: Very slow grating motion combined with steam occlusion.
changes:
  occlusion_method: Steam/fog.
  dynamic_conditions: Very slow motion (minimal progress).
  expected_outcome_change: Minimal shredding (very small change compared to original).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand pushes the carrot downward along the grater surface in extremely slow motion, barely
    advancing the vegetable against the blades. The pressure is light. Thick steam from a nearby pot rolls
    into the frame, completely obscuring the grater and hand in a dense white fog. The fog remains for
    several seconds while the slow, minimal movement continues hidden within. The steam dissipates to
    reveal the scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand pushes the carrot downward along the grater surface in extremely slow motion, barely
    advancing the vegetable against the blades. The pressure is light. Thick steam from a nearby pot rolls
    into the frame, completely obscuring the grater and hand in a dense white fog. The fog remains for
    several seconds while the slow, minimal movement continues hidden within. The steam dissipates to
    reveal the scene. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a metal box grater standing on a worn wooden cutting
    board. A Caucasian male hand enters from the right, holding a whole orange carrot horizontally and
    pressing its tip against the large holes on the side of the grater. A pile of orange carrot shreds
    is already visible on the board at the base of the grater. A window with a white frame is visible
    in the blurred background.
  init2final_edit_prompt: Edit the given image to show the aftermath of a brief, slow grating action.
    Add a small amount of fresh orange carrot shreds to the pile on the wooden cutting board at the base
    of the grater. Slightly shorten or blunt the tip of the carrot where it contacts the metal surface
    to reflect minor material consumption. Ensure the scene is completely clear of any steam, fog, or
    visual obstruction, maintaining the original lighting and clarity.
  rationale: The action describes a slow, light downward push of the carrot against the grater, obscured
    by steam which then clears. While the movement is minimal ('barely advancing'), the physical interaction
    between the carrot and the blades creates irreversible structural change. The carrot must lose some
    material, resulting in a slightly worn tip and an increase in the pile of shreds on the board. The
    final state is clear of the steam that temporarily occluded the view.
  questions:
  - id: shreds_quantity
    question: Is the quantity of carrot shreds on the cutting board greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for an increase in the pile of orange fragments at the base of the grater.
  - id: carrot_wear
    question: Does the tip of the carrot contacting the grater appear worn or slightly shorter?
    answer_type: yes_no
    notes_for_judge: The carrot should show signs of material loss at the contact point.
  - id: new_fragments
    question: Are there new fragments of carrot visible that were not present in the initial image?
    answer_type: yes_no
    notes_for_judge: Check for fresh debris added to the pile.
  - id: pile_size
    question: Is the pile of grated material larger than it was initially?
    answer_type: yes_no
    notes_for_judge: Compare the volume/area of the shredded carrot pile.
  - id: material_loss
    question: Has the carrot undergone irreversible material reduction?
    answer_type: yes_no
    notes_for_judge: The carrot cannot be whole again; parts of it are now shreds.
  - id: steam_cleared
    question: Is the scene clear of the thick steam described in the prompt?
    answer_type: yes_no
    notes_for_judge: The final state must be revealed after the steam dissipates.
  - id: grater_position
    question: Is the metal grater still standing in the same position on the board?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: hand_presence
    question: Is the hand still visible holding the carrot?
    answer_type: yes_no
    notes_for_judge: The prompt implies the action continues or pauses, but the hand does not leave.
