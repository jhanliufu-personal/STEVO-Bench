id: charcoal_stick_crush_crumble
level: 4
category: structural_transformation
transformation_type: porous_solid_fragmentation
tags: []
prompts:
  image_gen_prompt: A stick of black artist charcoal is held vertically between the thumb and fingers
    of one hand. The charcoal is a porous carbon material with matte black appearance. The fingers are
    positioned to apply crushing force.
  video_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. The camera rotates right at constant speed until the hand and charcoal completely
    exit the view to the right. The camera continues rotating right for several seconds while the hand
    remains off-screen continuing to apply pressure. Then the camera rotates left smoothly at the same
    rate back to the original viewpoint, bringing the hand back into view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up view of a hand holding a thick, black, cylindrical stick of artist
    charcoal. The charcoal has a porous, textured surface. The hand is stained with black charcoal dust.
    The background is a wooden table with drawing supplies, including white paper with charcoal sketches
    and other drawing tools.
  init2final_edit_prompt: Edit the given image to show the charcoal stick crushed and crumbled in the
    hand. The original solid cylinder should be broken into fragments, chunks, and dust. The hand should
    be clenched tighter around the debris, and there should be more black charcoal dust on the fingers
    and palm.
  rationale: The prompt specifies that the hand applies progressive squeezing pressure to a brittle charcoal
    stick. As the camera rotates away, the hand continues to apply pressure off-screen. Charcoal is a
    fragile material that fractures under compression. Therefore, when the camera returns to the initial
    view, the charcoal stick must be structurally compromised—broken, crumbled, or shattered—rather than
    remaining a solid, intact cylinder. This represents an irreversible physical transformation.
