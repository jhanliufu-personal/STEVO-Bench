  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A red plastic disposable cup sits on a light-colored wooden workbench on the
    left side of the frame. Inside the cup, there appears to be ice. To the right, an orange and black
    heat gun is propped up on its stand, with its metal nozzle pointed directly at the side of the cup.
    In the background, various tools including screwdrivers and a hammer are visible but out of focus
    on the workbench.
  init2final_edit_prompt: Edit the given image to show the red plastic cup standing upright with its original
    shape fully preserved. The cup must not show any melting, shrinking, warping, or heat damage. The
    orange heat gun remains stationary on the right. The background and table surface should remain visible
    and unchanged.
  rationale: The video prompt explicitly states that the heat gun is operating in 'Cool' mode with room-temperature
    air, which is insufficient to melt the plastic. It also specifies that the cup retains its rigidity.
    Although an occlusion (plywood sheet) temporarily blocks the view, the physical interaction (cool
    air) causes no structural change. Therefore, the final state should be visually identical to the initial
    state, serving as a control to verify that the model does not hallucinate melting based solely on
    the presence of a heat gun.
