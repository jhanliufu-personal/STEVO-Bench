id: plastic_cup_heat_source_warp_07
level: 4
category: structural_transformation
tags: []
variant_of: plastic_cup_heat_source_warp
variation_type: combined
variation_description: Heat gun set to cool mode AND occlusion changed to a blocking object.
changes:
  occlusion_method: A large sheet of plywood slides into view.
  dynamic_conditions: Heat gun blows ambient temperature air.
  expected_outcome_change: The cup remains unchanged.
prompts:
  init_frame_edit_prompt: Edit the image to change the heat gun settings switch to a blue 'Cool' icon
    or position, and remove any visual heat distortion.
  video_WM: Air from the heat gun flows toward the plastic cup. The heat gun is running in 'Cool' mode,
    circulating room-temperature air without heat. The temperature is well below the threshold required
    to soften polystyrene plastic. The cup retains its rigidity. Suddenly, a large sheet of plywood slides
    from the left, completely blocking the view of the cup and heat gun. The plywood remains in place
    for several seconds while the cool air continues blowing behind it. Then the plywood slides back to
    the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: Air from the heat gun flows toward the plastic cup. The heat gun is running in 'Cool' mode,
    circulating room-temperature air without heat. The temperature is well below the threshold required
    to soften polystyrene plastic. The cup retains its rigidity. Suddenly, a large sheet of plywood slides
    from the left, completely blocking the view of the cup and heat gun. The plywood remains in place
    for several seconds while the cool air continues blowing behind it. Then the plywood slides back to
    the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
