evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture of a bird standing on a square metal
    plate. A heat gun with an orange and silver nozzle is positioned on the left, pointed directly at
    the bird. The wax bird has detailed feather textures but shows signs of melting at the base, with
    small puddles of yellow-brown wax forming on the plate. A gloved hand holds the heat gun. In the background,
    there is a workbench with tools like a hammer and pliers, and a blurred shelf unit.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture significantly melted and
    deformed. The bird should appear shorter and slumped, with its features like the beak, head, and feathers
    smoothed out, distorted, or completely lost due to heat. The puddle of melted wax at the base should
    be much larger and spread further across the metal plate, indicating structural collapse.
  rationale: The heat gun applies intense heat to the wax sculpture, causing a phase transition from solid
    to liquid. The presence of thick smoke implies rapid heating, likely causing the wax to lose its structural
    integrity and slump under gravity. During the occlusion, the bird melts down, losing its defined shape
    and height. When the smoke clears, the sculpture will be irreversibly deformed, appearing as a melted
    lump or a significantly shorter, smoother version of the original bird, with a larger pool of wax
    at the base.
