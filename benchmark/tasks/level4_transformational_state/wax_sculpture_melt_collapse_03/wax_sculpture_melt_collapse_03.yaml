id: wax_sculpture_melt_collapse_03
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: occlusion_method
variation_description: Replaces camera rotation with thick smoke filling the room.
changes:
  occlusion_method: Thick smoke fills the workspace, obscuring the view, then clears.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The heat gun is running on high, pointing at the wax sculpture. Thick white smoke begins to
    fill the workspace, rapidly becoming opaque and completely hiding the bird and heat gun from view.
    The smoke slowly dissipates until the air is clear again. No zoom, no cut, no scene change. STOP.
  camera_WM: The heat gun is running on high, pointing at the wax sculpture. Thick white smoke begins
    to fill the workspace, rapidly becoming opaque and completely hiding the bird and heat gun from view.
    The smoke slowly dissipates until the air is clear again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture of a bird standing on a square metal
    plate. A heat gun with an orange and silver nozzle is positioned on the left, pointed directly at
    the bird. The wax bird has detailed feather textures but shows signs of melting at the base, with
    small puddles of yellow-brown wax forming on the plate. A gloved hand holds the heat gun. In the background,
    there is a workbench with tools like a hammer and pliers, and a blurred shelf unit.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture significantly melted and
    deformed. The bird should appear shorter and slumped, with its features like the beak, head, and feathers
    smoothed out, distorted, or completely lost due to heat. The puddle of melted wax at the base should
    be much larger and spread further across the metal plate, indicating structural collapse.
  rationale: The heat gun applies intense heat to the wax sculpture, causing a phase transition from solid
    to liquid. The presence of thick smoke implies rapid heating, likely causing the wax to lose its structural
    integrity and slump under gravity. During the occlusion, the bird melts down, losing its defined shape
    and height. When the smoke clears, the sculpture will be irreversibly deformed, appearing as a melted
    lump or a significantly shorter, smoother version of the original bird, with a larger pool of wax
    at the base.
  questions:
  - id: melted_state_check
    question: Does the wax sculpture appear significantly more melted than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the solidity of the bird. It should look softer, wetter, or deformed.
  - id: puddle_expansion
    question: Is the pool of melted wax on the metal plate larger than it was initially?
    answer_type: yes_no
    notes_for_judge: Check the surface area of the melted wax at the base.
  - id: height_reduction
    question: Is the vertical height of the sculpture reduced compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Melting causes the object to slump and lose height.
  - id: detail_loss
    question: Are the fine details of the bird, such as feather textures or facial features, less distinct
      or smoothed out?
    answer_type: yes_no
    notes_for_judge: Heat smooths out carved details.
  - id: structural_collapse
    question: Does the sculpture show signs of structural collapse or deformation?
    answer_type: yes_no
    notes_for_judge: Look for slumping, leaning, or loss of the bird silhouette.
  - id: shape_integrity
    question: Is the overall shape of the bird less recognizable than in the starting image?
    answer_type: yes_no
    notes_for_judge: The form should be degraded.
  - id: plate_presence
    question: Is the metal plate still visible beneath the wax?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the background tools (hammer/pliers) still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
