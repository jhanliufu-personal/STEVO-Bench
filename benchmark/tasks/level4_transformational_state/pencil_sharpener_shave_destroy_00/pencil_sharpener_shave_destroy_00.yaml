evaluation:
  init_frame_description: A close-up shot of a vintage-style manual pencil sharpener clamped to a wooden
    workbench. The sharpener is metal with a transparent plastic shavings bin underneath, which already
    contains some wood shavings. A long, unsharpened wooden pencil is inserted into the sharpener, extending
    horizontally to the left. A person's hand is visible on the right, grasping the crank handle of the
    sharpener. The background shows a workshop setting with tools, shelves, and a window.
  init2final_edit_prompt: Edit the given image to show the result of sharpening the pencil. Make the visible
    portion of the wooden pencil shaft significantly shorter, as if it has been fed into the machine.
    Increase the volume of wood shavings inside the transparent collection bin below the mechanism, showing
    a larger pile of debris.
  rationale: The video prompt describes the action of cranking a pencil sharpener. This mechanical action
    engages internal blades that shave material off the pencil. Consequently, the physical length of the
    pencil must decrease as it is consumed by the sharpener, and the waste material (shavings) must accumulate
    in the collection bin. These are irreversible structural changes to the pencil and the contents of
    the bin.
