id: pencil_sharpener_shave_destroy
level: 4
category: structural_transformation
transformation_type: progressive_material_removal
tags: []
prompts:
  image_gen_prompt: A long unsharpened wooden pencil with a blunt end is inserted into a manual rotary pencil sharpener mounted on a table edge. A hand grips the sharpener crank handle ready to turn. The pencil is full length and unsharpened.
  video_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material is physically separated from the main pencil body, it cannot reattach. The hand continues cranking the sharpener mechanism. The camera rotates right at constant speed until the sharpener and pencil completely exit the view to the right. The camera continues rotating right for several seconds while the hand remains off-screen continuing to turn the crank. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the sharpener and pencil back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material is physically separated from the main pencil body, it cannot reattach. The hand continues cranking the sharpener mechanism during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
