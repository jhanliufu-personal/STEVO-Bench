id: pencil_sharpener_shave_destroy
level: 4
category: structural_transformation
transformation_type: progressive_material_removal
tags: []
prompts:
  image_gen_prompt: A long unsharpened wooden pencil with a blunt end is inserted into a manual rotary
    pencil sharpener mounted on a table edge. A hand grips the sharpener crank handle ready to turn. The
    pencil is full length and unsharpened.
  video_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains
    cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates
    inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material
    is physically separated from the main pencil body, it cannot reattach. The hand continues cranking
    the sharpener mechanism. The camera rotates right at constant speed until the sharpener and pencil
    completely exit the view to the right. The camera continues rotating right for several seconds while
    the hand remains off-screen continuing to turn the crank. Then the camera rotates left smoothly at
    the same rate back to the original viewpoint, bringing the sharpener and pencil back into view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains
    cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates
    inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material
    is physically separated from the main pencil body, it cannot reattach. The hand continues cranking
    the sharpener mechanism during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a vintage metal pencil sharpener clamped to the
    edge of a wooden workbench. A long wooden pencil is inserted into the sharpener's intake. A person's
    arm and hand are visible on the right side, gripping the handle of the crank. The sharpener features
    a transparent plastic receptacle at the bottom, which contains a small pile of wood shavings. The
    background is a workshop environment with blurred tools, shelves, and a window.
  init2final_edit_prompt: Edit the given image to make the wooden pencil shaft significantly shorter,
    reducing the length of the portion extending from the sharpener. Increase the volume of wood shavings
    inside the transparent collection bin at the bottom of the sharpener, showing a higher fill level
    of debris. Keep the hand positioned on the crank handle. Ensure the workbench, clamp, and background
    environment remain unchanged.
  rationale: 'The video prompt describes a continuous sharpening action that occurs while the camera pans
    away and then returns. The hand continues to turn the crank off-screen, which drives the blades to
    shave material from the pencil. This process is irreversible: the pencil physically loses length as
    it is converted into shavings. Therefore, in the final frame, the visible pencil shaft must be shorter,
    and the collection bin must contain a greater volume of wood shavings accumulated from the sharpening
    process.'
