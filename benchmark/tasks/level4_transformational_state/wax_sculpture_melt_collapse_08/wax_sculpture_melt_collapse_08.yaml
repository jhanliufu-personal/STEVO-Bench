  dynamic_conditions: Heat gun aimed away.
  expected_outcome_change: The wax bird remains solid.
prompts:
  init_frame_edit_prompt: Edit the image to rotate the heat gun so the nozzle points away from the wax
    bird.
  video_WM: The heat gun blasts hot air into the background, clearly missing the wax bird. The room lights
    flicker and turn off completely, leaving the scene in pitch blackness. The lights then turn back on.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The heat gun blasts hot air into the background, clearly missing the wax bird. The room lights
    flicker and turn off completely, leaving the scene in pitch blackness. The lights then turn back on.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up of a brown wax bird sculpture standing on a dirty metal sheet. The
    bird features detailed feather textures on its wings and a pointed beak. A puddle of previously melted
    wax surrounds its feet. To the left, the orange and silver nozzle of a heat gun is visible, pointing
    generally toward the right. In the background, a workbench is visible with tools like a wooden-handled
    hammer and pliers, slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it was initially, ensuring
    the wax bird remains completely intact and unmelted. Do not alter the shape, texture, or posture of
    the bird. Ensure the lighting is on and the background tools remain visible and unchanged.
  rationale: The video prompt explicitly states that the heat gun 'clearly misses' the wax bird. This
    is a negative constraint task where the expected physical transformation (melting) must NOT occur
    despite the visual setup. The lighting changes (flickering and turning off) are temporary, and the
    lights turn back on before the end. Therefore, the final state should show the wax sculpture with
    its structural integrity fully preserved, identical to the initial frame.
