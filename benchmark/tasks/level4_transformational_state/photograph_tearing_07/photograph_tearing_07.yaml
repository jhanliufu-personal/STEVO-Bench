id: photograph_tearing_07
level: 4
category: structural_transformation
tags: []
variant_of: photograph_tearing
variation_type: combined
variation_description: Combined fog occlusion with compressive force.
changes:
  occlusion_method: Thick fog fills the scene.
  dynamic_conditions: Hands push inward to compress/crumple.
  expected_outcome_change: The photograph is crumpled/folded.
prompts:
  init_frame_edit_prompt: Edit the image so the hands are gripping the side edges of the photograph, positioned
    to push inward rather than pull outward.
  video_WM: The two hands push inward from the sides against the photograph. Compressive force is applied
    to the paper material. Thick white fog rolls in, completely obscuring the hands and photograph, and
    then slowly dissipates. No zoom, no cut, no scene change. The camera returns to the original viewpoint.
    STOP.
  camera_WM: The two hands push inward from the sides against the photograph. Compressive force is applied
    to the paper material. Thick white fog rolls in, completely obscuring the hands and photograph, and
    then slowly dissipates. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of two hands holding a landscape photograph. The
    photograph depicts a sunset over a beach with a dark horizon line. The hands are holding the left
    and right edges of the photo. The paper is slightly curved but largely intact, with a small imperfection
    or nick visible at the top center edge. The background is dark and out of focus.
  init2final_edit_prompt: Edit the given image so that the photograph is significantly buckled, bent,
    or crumpled in the middle, appearing compressed. The hands should be positioned closer together horizontally,
    holding the deformed photograph. The image on the photo should be distorted consistent with the paper
    being folded or curved inward.
  rationale: The prompt describes a compressive force where hands push inward on the photograph. Physically,
    this action causes a stiff sheet of paper to buckle, bend, or crumple. The fog acts as an occlusion
    mask, allowing the simulation to skip the complex dynamics of the deformation process. When the fog
    dissipates, the hands should be closer together (having moved inward), and the photograph should exhibit
    significant geometric deformation (buckling or creasing) resulting from the compression.
