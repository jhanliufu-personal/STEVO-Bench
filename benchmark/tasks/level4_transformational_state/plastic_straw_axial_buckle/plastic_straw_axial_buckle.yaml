id: plastic_straw_axial_buckle
level: 4
category: structural_transformation
transformation_type: compression_buckling_instability
tags: []
prompts:
  image_gen_prompt: A straight plastic drinking straw is held vertically between two hands. One hand holds the bottom end while the other hand is positioned at the top end. The straw is initially perfectly straight and aligned vertically.
  video_WM: The hands begin moving toward each other, applying axial compression force along the length of the straw. Thin-walled cylindrical structures under axial compression are subject to Euler buckling instability when load exceeds a critical threshold. The plastic straw has very low resistance to lateral bending compared to its axial strength. The structure is sensitive to slight asymmetries or imperfections. Plastic deformation beyond the elastic limit is permanent. The hands continue applying progressive compressive force. The camera rotates right at constant speed until the hands and straw completely exit the view to the right. The camera continues rotating right for several seconds while the hands remain off-screen continuing to apply compression. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the hands and straw back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin moving toward each other, applying axial compression force along the length of the straw. Thin-walled cylindrical structures under axial compression are subject to Euler buckling instability when load exceeds a critical threshold. The plastic straw has very low resistance to lateral bending compared to its axial strength. The structure is sensitive to slight asymmetries or imperfections. Plastic deformation beyond the elastic limit is permanent. The hands continue applying progressive compressive force during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
  Genie: null
