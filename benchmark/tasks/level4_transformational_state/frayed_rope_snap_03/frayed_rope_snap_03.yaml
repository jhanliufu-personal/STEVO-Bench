evaluation:
  init_frame_description: A close-up, eye-level shot of a thick, weathered rope stretched horizontally
    between two rusty metal winches. The rope is under high tension. The center of the rope is severely
    frayed, with the majority of the strands broken, leaving only a thin, precarious connection holding
    the two sides together. Dust particles are visible in the air against a blurred industrial background.
  init2final_edit_prompt: Edit the given image to show the rope completely snapped in the center. Remove
    the thin connecting strands so there is a clear, visible gap between the left and right sections of
    the rope. The severed ends should appear frayed and separated, no longer touching. Maintain the appearance
    of the rusty winches on the left and right, but ensure the rope is no longer a single continuous piece.
  rationale: The prompt describes applying extreme tension to an already critically weakened rope. Physically,
    this leads to structural failure. The steam occlusion serves as a transition period during which the
    snap occurs. When the steam dissipates and the view clears, the irreversible transformation (the snapping
    of the rope) should be complete. Therefore, the final frame must show the rope severed into two pieces
    with a visible gap, rather than the tenuous connection seen in the initial frame.
