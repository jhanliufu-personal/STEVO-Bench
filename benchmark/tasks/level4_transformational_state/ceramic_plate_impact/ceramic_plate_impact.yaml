id: ceramic_plate_impact
level: 4
category: structural_transformation
transformation_type: fracture
prompts:
  image_gen_prompt: A pristine white ceramic dinner plate sitting on a concrete floor. A heavy steel hammer
    is mid-swing, inches away from striking the center of the plate.
  video_WM: The heavy steel hammer swings down forcefully and makes hard contact with the center of the
    ceramic plate. The impact is forceful. The camera rotates right until the plate completely exits the
    view, then rotates toward the left smoothly at the same rate until the area where the plate sat is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hammer swings down and strikes the center of the ceramic plate with force. The impact
    event occurs. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A white, round ceramic plate sits in the center of a textured, cracked concrete
    floor. A heavy sledgehammer with a steel head and wooden handle is positioned mid-air, just above
    the plate, poised to strike it.
  init2final_edit_prompt: Edit the given image to show the white ceramic plate shattered into multiple
    broken shards and fragments scattered on the concrete floor where the intact plate previously sat.
    The hammer head should be positioned near or among the debris, consistent with having just struck
    the object.
  rationale: The video prompt describes a forceful impact between a heavy hammer and a brittle ceramic
    plate. Upon impact, the plate will structurally fail and shatter into pieces. The camera rotates away
    and then returns to the original view. During the occlusion, the debris settles. When the view returns,
    the plate must be visibly broken, demonstrating an irreversible state change from intact to shattered.
