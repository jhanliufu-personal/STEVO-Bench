evaluation:
  init_frame_description: An orange electric heat gun rests on its stand on the right side of a wooden
    workbench, with its nozzle pointing towards the left. A glazed ceramic mug with brown and green earth
    tones sits on the left side of the frame, positioned in front of the heat gun. Faint steam or heat
    shimmer is visible rising from the mug. The background contains blurred workshop tools and wood pieces.
  init2final_edit_prompt: Edit the given image to show the scene after a cloud of smoke has cleared. The
    ceramic mug must appear completely intact, retaining its original shape, height, and structure without
    any signs of melting, warping, or deformation. The orange heat gun remains in its original position
    on the right. The wooden workbench surface is clearly visible again.
  rationale: The prompt specifies that the target object is a ceramic mug, which is a material impervious
    to the temperatures produced by a standard heat gun. Unlike plastic, the ceramic will not melt, soften,
    or warp. Therefore, despite the heat gun running and the occlusion by smoke, the final state must
    show the mug structurally unchanged. The primary evaluation criteria is the preservation of the mug's
    shape and integrity, verifying that the model correctly distinguishes material properties (ceramic
    vs. plastic).
