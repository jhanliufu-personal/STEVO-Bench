prompts:
  init_frame_edit_prompt: Edit the image to replace the red plastic cup with a ceramic mug.
  video_WM: Hot air from the heat gun flows toward the ceramic mug. The ceramic material is impervious
    to the heat levels generated by the gun and will not soften or change shape. Suddenly, thick white
    smoke from a nearby source billows into the frame, completely obscuring the view of the workbench.
    The smoke swirls and blocks visibility for several seconds while the heat gun continues running hidden
    within the cloud. Then the smoke clears rapidly, revealing the workbench again. No zoom, no cut, no
    scene change. STOP.
  camera_WM: Hot air from the heat gun flows toward the ceramic mug. The ceramic material is impervious
