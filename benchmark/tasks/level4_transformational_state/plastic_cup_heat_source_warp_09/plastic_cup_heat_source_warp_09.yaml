id: plastic_cup_heat_source_warp_09
level: 4
category: structural_transformation
tags: []
variant_of: plastic_cup_heat_source_warp
variation_type: combined
variation_description: Target is a ceramic mug AND occlusion changed to smoke filling the room.
changes:
  occlusion_method: Thick smoke fills the room.
  dynamic_conditions: Material changed to ceramic.
  expected_outcome_change: The mug remains unchanged.
prompts:
  init_frame_edit_prompt: Edit the image to replace the red plastic cup with a ceramic mug.
  video_WM: Hot air from the heat gun flows toward the ceramic mug. The ceramic material is impervious
    to the heat levels generated by the gun and will not soften or change shape. Suddenly, thick white
    smoke from a nearby source billows into the frame, completely obscuring the view of the workbench.
    The smoke swirls and blocks visibility for several seconds while the heat gun continues running hidden
    within the cloud. Then the smoke clears rapidly, revealing the workbench again. No zoom, no cut, no
    scene change. STOP.
  camera_WM: Hot air from the heat gun flows toward the ceramic mug. The ceramic material is impervious
    to the heat levels generated by the gun and will not soften or change shape. Suddenly, thick white
    smoke from a nearby source billows into the frame, completely obscuring the view of the workbench.
    The smoke swirls and blocks visibility for several seconds while the heat gun continues running hidden
    within the cloud. Then the smoke clears rapidly, revealing the workbench again. No zoom, no cut, no
    scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: An orange electric heat gun rests on its stand on the right side of a wooden
    workbench, with its nozzle pointing towards the left. A glazed ceramic mug with brown and green earth
    tones sits on the left side of the frame, positioned in front of the heat gun. Faint steam or heat
    shimmer is visible rising from the mug. The background contains blurred workshop tools and wood pieces.
  init2final_edit_prompt: Edit the given image to show the scene after a cloud of smoke has cleared. The
    ceramic mug must appear completely intact, retaining its original shape, height, and structure without
    any signs of melting, warping, or deformation. The orange heat gun remains in its original position
    on the right. The wooden workbench surface is clearly visible again.
  rationale: The prompt specifies that the target object is a ceramic mug, which is a material impervious
    to the temperatures produced by a standard heat gun. Unlike plastic, the ceramic will not melt, soften,
    or warp. Therefore, despite the heat gun running and the occlusion by smoke, the final state must
    show the mug structurally unchanged. The primary evaluation criteria is the preservation of the mug's
    shape and integrity, verifying that the model correctly distinguishes material properties (ceramic
    vs. plastic).
  questions:
  - id: mug_integrity_shape
    question: Does the ceramic mug retain its original shape without sagging or warping?
    answer_type: yes_no
    notes_for_judge: The mug should not look melted or deformed.
  - id: mug_integrity_melting
    question: Is the mug free from any visible signs of melting or material degradation?
    answer_type: yes_no
    notes_for_judge: Ceramic should not melt; look for smooth, unaltered surfaces.
  - id: mug_rim_structure
    question: Is the rim of the mug still circular and level?
    answer_type: yes_no
    notes_for_judge: The top edge should not be wavy or collapsed.
  - id: mug_handle_integrity
    question: Is the handle of the mug still attached and undeformed?
    answer_type: yes_no
    notes_for_judge: The handle should not droop or detach.
  - id: visibility_restored
    question: Is the wooden workbench surface visible again?
    answer_type: yes_no
    notes_for_judge: The smoke must have cleared.
  - id: heat_gun_presence
    question: Is the orange heat gun still visible in its original position?
    answer_type: yes_no
    notes_for_judge: The tool should remain stationary.
  - id: overall_structural_preservation
    question: Does the mug appear structurally identical to the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for overall consistency in form.
