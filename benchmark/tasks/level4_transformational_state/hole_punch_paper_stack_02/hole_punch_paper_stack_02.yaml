changes:
  occlusion_method: A person carrying a large stack of files walks past, blocking the camera view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand begins pressing the lever downward with progressive force. The hole punch contains
    cylindrical cutting blades that advance toward the paper when the lever is depressed. The paper stack
    consists of standard copy paper with typical fiber structure and tensile strength. A person carrying
    a large stack of files walks closely in front of the camera from left to right, completely blocking
    the view of the hole punch for several seconds. The hand continues pressing the lever while hidden
    behind the person. The person exits the frame to the right, revealing the desk again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The hand begins pressing the lever downward with progressive force. The hole punch contains
    cylindrical cutting blades that advance toward the paper when the lever is depressed. The paper stack
    consists of standard copy paper with typical fiber structure and tensile strength. A person carrying
    a large stack of files walks closely in front of the camera from left to right, completely blocking
    the view of the hole punch for several seconds. The hand continues pressing the lever while hidden
