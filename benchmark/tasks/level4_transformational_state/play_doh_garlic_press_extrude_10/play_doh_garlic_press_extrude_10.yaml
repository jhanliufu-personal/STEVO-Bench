id: play_doh_garlic_press_extrude_10
level: 4
category: structural_transformation
tags: []
variant_of: play_doh_garlic_press_extrude
variation_type: combined
variation_description: Fast squeezing action combined with zoom out occlusion.
changes:
  occlusion_method: Camera zooms out to wide shot.
  dynamic_conditions: Squeezing is extremely rapid and forceful.
  expected_outcome_change: Extrusion happens much faster/more violently.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands grip the garlic press handles aggressively. The chamber contains soft blue Play-Doh.
    The hands begin to squeeze with maximum speed and force, intending to crush the material instantly.
    The camera immediately zooms out rapidly to a very distant wide shot where the hands are barely visible
    dots. The scene remains zoomed out for several seconds while the rapid squeezing action occurs in
    the distance. The camera then zooms back in quickly to the original close-up view. No cut, no scene
    change. STOP.
  camera_WM: The hands grip the garlic press handles aggressively. The chamber contains soft blue Play-Doh.
    The hands begin to squeeze with maximum speed and force, intending to crush the material instantly.
    STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a pair of hands holding a metal garlic press over a wooden
    table. The press is open, and a smooth, spherical ball of blue Play-Doh sits in the chamber (basket)
    of the press. A metal whisk and a spoon are visible on the table in the background, along with a window
    and kitchen utensils.
  init2final_edit_prompt: Edit the given image to show the garlic press handles squeezed tightly together,
    significantly reducing the gap between them. The blue Play-Doh ball should be crushed inside the chamber
    and no longer visible as a round sphere. Show blue Play-Doh extruded as thin strands or noodles emerging
    from the bottom of the garlic press basket.
  rationale: The video prompt describes a forceful squeezing action applied to the garlic press. During
    the time the camera is zoomed out, the hands compress the handles, driving the plunger into the basket.
    This physical force crushes the soft Play-Doh and forces it through the small holes of the press (extrusion).
    When the camera returns to the close-up, the handles should be closed, the ball shape destroyed, and
    the material transformed into extruded strands.
  questions:
  - id: handles_closed
    question: Are the handles of the garlic press closer together than they were in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the gap between the top and bottom handles has decreased, indicating a squeezing
      action.
  - id: playdoh_deformed
    question: Has the blue Play-Doh ball lost its original spherical shape?
    answer_type: yes_no
    notes_for_judge: The ball should be crushed or flattened inside the press.
  - id: extrusion_visible
    question: Are there strands or 'noodles' of blue Play-Doh visible coming out of the press?
    answer_type: yes_no
    notes_for_judge: Look for the characteristic spaghetti-like shape of extruded material.
  - id: structural_change
    question: Has the blue material undergone a structural transformation from a solid block to fragmented
      strands?
    answer_type: yes_no
    notes_for_judge: Focus on the change in topology/form of the Play-Doh.
  - id: ball_gone
    question: Is the smooth top surface of the blue ball no longer intact?
    answer_type: yes_no
    notes_for_judge: The plunger should have mashed the top of the ball.
  - id: whisk_consistency
    question: Is the metal whisk still visible on the table in the background?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for background objects.
  - id: spoon_consistency
    question: Is the spoon on the table still in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
