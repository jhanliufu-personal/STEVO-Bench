variation_description: Silicone rubber mat (condition) + Blocking board (occlusion).
changes:
  occlusion_method: Wooden board blocks view.
  dynamic_conditions: Silicone rubber mat (elastic).
  expected_outcome_change: Mat springs back or resists permanent crumpling.
prompts:
  init_frame_edit_prompt: Edit the image to replace the aluminum foil with a grey silicone rubber mat.
  video_WM: The hands begin gathering the edges of the silicone mat inward and applying compressive force.
    Silicone rubber is an elastomer that undergoes elastic deformation. Unlike metal, it stores energy
    when bent and possesses a memory of its original flat shape. It resists permanent creasing and tends
    to spring back when force is removed. A large wooden cutting board slides into the foreground from
    the left, completely blocking the view of the table and hands. The hands continue their work behind
    the board. After several seconds, the board slides back out to the left, revealing the scene from
    the original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin gathering the edges of the silicone mat inward and applying compressive force.
    Silicone rubber is an elastomer that undergoes elastic deformation. Unlike metal, it stores energy
    when bent and possesses a memory of its original flat shape. It resists permanent creasing and tends
    to spring back when force is removed. A large wooden cutting board slides into the foreground from
    the left, completely blocking the view of the table and hands. The hands continue their work behind
    the board. After several seconds, the board slides back out to the left, revealing the scene from
    the original viewpoint. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A top-down view of a gray, rectangular silicone mat lying flat on a rustic wooden
    table. Two hands, belonging to a fair-skinned person, are resting on the left and right edges of the
    mat, palms down with fingers slightly spread.
  init2final_edit_prompt: Edit the image to show the hands grasping the edges of the silicone mat and
    pushing them inward, compressing the material. The mat should appear bunched up and gathered between
    the hands, exhibiting smooth, wave-like elastic folds and buckling, rather than sharp, jagged creases.
    The hands should be positioned closer together, actively holding the compressed mat.
  rationale: The prompt specifies the material is silicone rubber, which is an elastomer that resists
    permanent creasing and stores energy when bent. The action describes the hands applying compressive
    force and continuing this work behind an occlusion. Therefore, when the view is revealed, the hands
    should be seen holding the mat in a compressed, gathered state. Unlike aluminum foil, the mat will
    not retain a crumpled shape on its own but will show smooth, rounded deformations (elastic buckling)
    while being held by the hands.
