evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a silver heavy-duty hole punch on a
    wooden desk. A thick stack of white paper is inserted into the punching slot. A person's right hand
    and forearm are visible, gripping the black handle of the lever, which is currently in an elevated,
    diagonal position roughly 45 degrees from the horizontal. In the background, slightly out of focus,
    are a black wire pencil holder with pens, a black document tray, another black hole punch, and a window
    with daylight coming through.
  init2final_edit_prompt: Edit the given image to show the hole punch lever pressed downwards. The hand
    and arm should be positioned lower, consistent with having pushed the handle down towards the base
    of the machine. The silver lever arm should be closer to a horizontal orientation relative to the
    desk. The mechanism connecting the lever to the cutting blades should appear compressed or lowered.
    Keep the background objects and the paper stack in place, but the paper may appear slightly compressed
    by the mechanism.
  rationale: The video prompt describes a continuous action of applying downward force to the lever. This
    mechanical action causes the lever to rotate downwards around its pivot, driving the cutting blades
    into the paper. Consequently, the final state must show the lever in a depressed position (lower than
    the initial state) and the hand following this trajectory. This represents the progression of the
    irreversible punching process, even if the resulting holes are currently occluded by the mechanism.
