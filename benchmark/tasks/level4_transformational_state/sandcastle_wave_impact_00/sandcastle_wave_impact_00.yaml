id: sandcastle_wave_impact_00
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. The water
    engulfs the castle. Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The large ocean wave crashes down with force directly onto the sandcastle structure. The
    water engulfs the castle. Camera remains stationary throughout. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed sandcastle with multiple towers, walls, a bridge, and decorative
    shells sits on the beach. A massive, green ocean wave is curling high above it, poised to crash directly
    onto the structure from the left. The sky is overcast and grey.
  init2final_edit_prompt: Edit the given image to show the aftermath of the large wave crashing down.
    The sandcastle structure should be destroyed, flattened, or completely engulfed by turbulent white
    foam and rushing water. The distinct towers and walls should no longer be standing intact. The foreground
    should be dominated by the churning water and foam where the castle stood.
  rationale: The initial frame depicts a wave with significant potential energy immediately prior to impact.
    The prompt specifies that the wave crashes and engulfs the castle. Physically, the force of a wave
    of this magnitude will destroy the structural integrity of a sandcastle, flattening it or washing
    it away. The final state represents the moment of impact or immediate aftermath, where the wave form
    has collapsed into turbulence and the castle is no longer a coherent structure.
  questions:
  - id: wave_crashed
    question: Has the large curling wave collapsed or crashed down compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The wave should no longer be a high, smooth curl; it should be breaking or have broken.
  - id: castle_damage
    question: Is the sandcastle structure significantly damaged, flattened, or submerged?
    answer_type: yes_no
    notes_for_judge: The castle should not look pristine; it must show signs of destruction or be hidden
      by water.
  - id: towers_gone
    question: Are the tall towers of the sandcastle no longer standing intact?
    answer_type: yes_no
    notes_for_judge: The vertical structures should be knocked down or covered.
  - id: water_coverage
    question: Is the area where the castle stood covered by more water or foam than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The water should have advanced to cover the castle's position.
  - id: foam_increase
    question: Is there more white turbulent foam visible in the foreground than initially?
    answer_type: yes_no
    notes_for_judge: A crashing wave generates significant foam.
  - id: structural_loss
    question: Has the intricate detail of the sandcastle (e.g., windows, bridge) been lost or obscured?
    answer_type: yes_no
    notes_for_judge: Fine details should be washed away or hidden.
  - id: sky_consistency
    question: Does the sky remain overcast and grey?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
