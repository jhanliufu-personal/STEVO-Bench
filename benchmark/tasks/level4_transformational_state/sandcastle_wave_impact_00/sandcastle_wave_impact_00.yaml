  init_frame_description: A detailed sandcastle with multiple towers, walls, a bridge, and decorative
    shells sits on the beach. A massive, green ocean wave is curling high above it, poised to crash directly
    onto the structure from the left. The sky is overcast and grey.
  init2final_edit_prompt: Edit the given image to show the aftermath of the large wave crashing down.
    The sandcastle structure should be destroyed, flattened, or completely engulfed by turbulent white
    foam and rushing water. The distinct towers and walls should no longer be standing intact. The foreground
    should be dominated by the churning water and foam where the castle stood.
  rationale: The initial frame depicts a wave with significant potential energy immediately prior to impact.
    The prompt specifies that the wave crashes and engulfs the castle. Physically, the force of a wave
    of this magnitude will destroy the structural integrity of a sandcastle, flattening it or washing
    it away. The final state represents the moment of impact or immediate aftermath, where the wave form
    has collapsed into turbulence and the castle is no longer a coherent structure.
