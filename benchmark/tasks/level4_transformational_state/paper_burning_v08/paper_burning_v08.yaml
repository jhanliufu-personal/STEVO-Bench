id: paper_burning_v08
level: 4
category: transformational_state_change
tags: []
variant_of: paper_burning
variation_type: combined
variation_description: Glass jar covering the fire combined with lights turning off.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Oxygen limited by glass jar.
  expected_outcome_change: Fire dies out due to lack of oxygen; darkness obscures the process.
prompts:
  init_frame_edit_prompt: Edit the image to place a clear glass bell jar upside down over the burning
    paper on the plate. The fire is inside the glass.
  video_WM: Single continuous take, no cuts. Camera remains static centered on the plate where paper burns
    inside a glass bell jar. Suddenly, all ambient lights in the room turn off, plunging the scene into
    darkness. The scene remains dark for several seconds. Then the lights turn back on, fully illuminating
    the scene again. Lighting and objects remain consistent and realistic.
  camera_WM: Single continuous take, no cuts. Camera remains static centered on the plate where paper
    burns inside a glass bell jar. Suddenly, all ambient lights in the room turn off, plunging the scene
    into darkness. The scene remains dark for several seconds. Then the lights turn back on, fully illuminating
    the scene again. Lighting and objects remain consistent and realistic.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a wooden table featuring a ceramic plate covered by a glass
    bell jar. Inside the jar, a roll of textured paper is actively burning, with a visible orange flame
    and rising smoke. The paper shows signs of charring with black edges where the fire has consumed the
    material. The background includes a window providing natural daylight.
  init2final_edit_prompt: Edit the given image to show the paper significantly more burnt and degraded.
    Expand the area of black charring and ash, reducing the visible amount of white unburnt paper. The
    paper roll should look more consumed by the fire. Ensure the scene is fully illuminated with bright
    lighting identical to the start, maintaining the position of the glass jar, plate, and table.
  rationale: The video prompt describes a sequence where the lights turn off for several seconds while
    the paper is burning, then turn back on. During the period of darkness, the physical process of combustion
    continues irreversibly. Therefore, the final frame must show the paper in a more advanced state of
    burning (more char, less fuel) than the initial frame, while the lighting conditions must return to
    the initial bright state.
