id: photograph_tearing_01
level: 4
category: structural_transformation
tags: []
variant_of: photograph_tearing
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a hand covering the lens.
changes:
  occlusion_method: A hand moves in front of the camera lens to block the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The two hands pull firmly in opposite directions on the photograph. Tension is applied to
    the paper material to initiate a tear. A third hand moves close to the camera lens, completely blocking
    the view, covers the frame for a duration, and then moves away. No zoom, no cut, no scene change.
    The camera returns to the original viewpoint. STOP.
  camera_WM: The two hands pull firmly in opposite directions on the photograph. Tension is applied to
    the paper material to initiate a tear. A third hand moves close to the camera lens, completely blocking
    the view, covers the frame for a duration, and then moves away. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of two hands holding a glossy photograph of a sunset over a
    beach. The left hand, wearing a silver ring on the ring finger, holds the left side, and the right
    hand holds the right side. The photograph is slightly bent, showing a reflection on its glossy surface.
    The background is dark and out of focus.
  init2final_edit_prompt: Edit the given image so that the photograph appears torn. Introduce a visible,
    jagged rip or separation in the paper material, extending from the top edge downwards or across the
    photo. The image content on the photograph (the sunset) should be disrupted by this physical break.
    The hands should remain holding the damaged photograph.
  rationale: The video prompt describes hands pulling firmly in opposite directions to initiate a tear,
    followed by an occlusion. This physical action applies tension exceeding the material's strength,
    causing an irreversible structural failure. When the occlusion clears, the photograph must exhibit
    a visible tear, rip, or separation of the paper material, reflecting the damage caused by the pulling
    action.
