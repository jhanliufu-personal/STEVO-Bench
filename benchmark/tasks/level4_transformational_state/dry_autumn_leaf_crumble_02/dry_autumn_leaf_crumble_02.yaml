evaluation:
  init_frame_description: A close-up, top-down view of two elderly hands holding a large, dry, brown maple
    leaf. The leaf is positioned centrally against a textured beige fabric background. The leaf appears
    brittle with visible veins and minor natural imperfections, but it is structurally whole and intact.
    The hands are gently gripping the edges of the leaf.
  init2final_edit_prompt: Edit the given image to show the dry leaf crushed into a pile of broken fragments
    and debris. The leaf should no longer be a single whole structure but should appear crumbled and disintegrated
    into smaller brittle pieces held by the hands. Maintain the original background fabric and lighting.
  rationale: The video prompt describes the application of crushing pressure to a brittle, dry leaf. Due
    to the lack of moisture, the leaf will not bend or fold elastically but will instead fracture and
    crumble (irreversible structural transformation). The occlusion by the wooden board hides the duration
    of the crushing action, but the prompt specifies that force continues, implying that by the time the
    board is removed, the leaf will have lost its structural integrity and broken into fragments.
