id: dry_autumn_leaf_crumble_02
level: 4
category: structural_transformation
tags: []
variant_of: dry_autumn_leaf_crumble
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a large opaque board blocking the view.
changes:
  occlusion_method: A large opaque board slides in front of the camera.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands begin applying progressive crushing pressure to the dried brittle leaf. The leaf
    is severely dehydrated with very low moisture content typical of autumn leaves that have been dried
    for weeks. The brittle organic structure has lost all flexibility. The hands continue applying compressive
    force. A large, opaque wooden board slides into the frame from the left, completely blocking the hands
    and leaf from view. The board remains stationary for several seconds while the action continues behind
    it. Then the board slides back out to the left, revealing the scene again. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The hands begin applying progressive crushing pressure to the dried brittle leaf. The leaf
    is severely dehydrated with very low moisture content typical of autumn leaves that have been dried
    for weeks. The brittle organic structure has lost all flexibility. The hands continue applying compressive
    force. A large, opaque wooden board slides into the frame from the left, completely blocking the hands
    and leaf from view. The board remains stationary for several seconds while the action continues behind
    it. Then the board slides back out to the left, revealing the scene again. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, top-down view of two elderly hands holding a large, dry, brown maple
    leaf. The leaf is positioned centrally against a textured beige fabric background. The leaf appears
    brittle with visible veins and minor natural imperfections, but it is structurally whole and intact.
    The hands are gently gripping the edges of the leaf.
  init2final_edit_prompt: Edit the given image to show the dry leaf crushed into a pile of broken fragments
    and debris. The leaf should no longer be a single whole structure but should appear crumbled and disintegrated
    into smaller brittle pieces held by the hands. Maintain the original background fabric and lighting.
  rationale: The video prompt describes the application of crushing pressure to a brittle, dry leaf. Due
    to the lack of moisture, the leaf will not bend or fold elastically but will instead fracture and
    crumble (irreversible structural transformation). The occlusion by the wooden board hides the duration
    of the crushing action, but the prompt specifies that force continues, implying that by the time the
    board is removed, the leaf will have lost its structural integrity and broken into fragments.
  questions:
  - id: leaf_fragmentation
    question: Is the leaf broken into multiple smaller pieces or fragments?
    answer_type: yes_no
    notes_for_judge: The leaf should no longer be a single continuous object.
  - id: structural_integrity
    question: Has the structural integrity of the leaf been compromised compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for signs of breaking, tearing, or crumbling.
  - id: loss_of_form
    question: Has the original whole shape of the leaf been destroyed?
    answer_type: yes_no
    notes_for_judge: The recognizable outline of a maple leaf should be disrupted or gone.
  - id: debris_presence
    question: Are there visible crumbs, flakes, or dust from the leaf?
    answer_type: yes_no
    notes_for_judge: Crushing a dry leaf produces small debris.
  - id: crumbled_appearance
    question: Does the leaf material appear to be crumbled or crushed?
    answer_type: yes_no
    notes_for_judge: The texture should look damaged and compressed.
  - id: board_absence
    question: Is the wooden board mentioned in the prompt absent from the final view?
    answer_type: yes_no
    notes_for_judge: The prompt states the board slides back out, revealing the scene.
  - id: hands_visibility
    question: Are the hands still visible in the frame?
    answer_type: yes_no
    notes_for_judge: The hands should remain to hold the debris.
  - id: background_consistency
    question: Is the textured beige fabric background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
