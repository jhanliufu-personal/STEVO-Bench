id: charcoal_stick_crush_crumble_10
level: 4
category: structural_transformation
tags: []
variant_of: charcoal_stick_crush_crumble
variation_type: combined
variation_description: Changes material to white chalk (brittle) and uses fog occlusion.
changes:
  occlusion_method: Thick fog obscures view.
  dynamic_conditions: Material changed to white chalk.
  expected_outcome_change: Object crumbles into white dust (vs black dust).
prompts:
  init_frame_edit_prompt: Edit the image to replace the black charcoal stick with a white stick of chalkboard
    chalk.
  video_WM: The fingers begin applying progressive squeezing pressure to the white chalk stick. Chalk
    is a porous calcium carbonate material with low structural strength and tendency to fracture under
    compression. The material is brittle with weak bonds. The fingers continue increasing compressive
    force. Suddenly, a dense cloud of white fog fills the area, completely obscuring the hand and chalk
    from view. The fog swirls thickly for several seconds while the squeezing continues hidden within
    it. The fog then dissipates and clears, revealing the scene again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the white chalk stick. Chalk
    is a porous calcium carbonate material with low structural strength and tendency to fracture under
    compression. The material is brittle with weak bonds. The fingers continue increasing compressive
    force. Suddenly, a dense cloud of white fog fills the area, completely obscuring the hand and chalk
    from view. The fog swirls thickly for several seconds while the squeezing continues hidden within
    it. The fog then dissipates and clears, revealing the scene again. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up view of a dirty human hand holding a thick, intact cylinder of white
    chalk or pastel. The hand is covered in dark smudges, likely charcoal or graphite dust. The background
    is a blurred wooden table surface with drawing papers, charcoal sticks, and other art supplies visible.
  init2final_edit_prompt: Edit the given image to show the white chalk stick crushed and crumbled into
    multiple broken fragments and dust within the hand. The structural integrity of the cylinder should
    be destroyed, with jagged pieces varying in size held by the fingers. Keep the hand pose and background
    identical, but reflect the aftermath of crushing the brittle material.
  rationale: The prompt describes a physical action of squeezing a brittle material (chalk) which is prone
    to fracture under compression. The action continues while obscured by fog. Therefore, when the fog
    clears, the logical physical consequence is that the chalk stick has succumbed to the pressure and
    is now broken, crushed, or crumbled. The state change is irreversible structural damage.
  questions:
  - id: chalk_broken
    question: Is the white chalk stick broken into multiple fragments or pieces?
    answer_type: yes_no
    notes_for_judge: The chalk should no longer be a single perfect cylinder.
  - id: structural_integrity
    question: Has the structural integrity of the white cylinder been compromised?
    answer_type: yes_no
    notes_for_judge: Look for cracks, breaks, or crumbling.
  - id: shape_change
    question: Is the original cylindrical shape of the chalk significantly altered or destroyed?
    answer_type: yes_no
    notes_for_judge: The smooth cylindrical form should be gone or heavily damaged.
  - id: debris_presence
    question: Are there small crumbs, dust, or debris from the white object visible on the hand?
    answer_type: yes_no
    notes_for_judge: Crushing chalk produces dust and small particles.
  - id: hand_holding_remains
    question: Is the hand still holding the remains of the white object?
    answer_type: yes_no
    notes_for_judge: The object should not have disappeared completely, just changed form.
  - id: background_consistency
    question: Is the background workspace (table and papers) still visible and consistent with the start?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
