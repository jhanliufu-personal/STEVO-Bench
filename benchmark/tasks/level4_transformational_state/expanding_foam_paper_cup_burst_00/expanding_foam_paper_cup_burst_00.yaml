evaluation:
  init_frame_description: A close-up, eye-level shot of a workbench covered in a clear plastic sheet.
    A gloved hand (wearing a grey work glove) holds a silver can of 'Great Stuff' polyurethane foam sealant
    with a red dispensing trigger and nozzle. The red nozzle is inserted into a small, empty brown paper
    cup sitting on the plastic. The plastic sheet has existing dried, abstract patterns of light-colored
    foam on it. In the background, slightly out of focus, are wooden boards, a hammer, and other workshop
    tools.
  init2final_edit_prompt: Edit the given image to show the paper cup filled and overflowing with a large,
    chaotic mass of expanded yellow polyurethane foam. The foam should appear voluminous, rising significantly
    above the rim of the cup and bulging outwards. The paper cup should appear deformed, bulging, or torn
    due to the internal pressure of the expanding foam. The red nozzle should be partially submerged or
    touching the expanding foam mass.
  rationale: The prompt describes the activation of expanding foam within a confined paper cup. Polyurethane
    foam expands 30-50 times its volume rapidly. As the foam dispenses, it will fill the cup and, due
    to the cup's limited structural integrity mentioned in the prompt, the foam will overflow and exert
    outward pressure, causing the cup to bulge, deform, or burst. The final state represents the aftermath
    of this rapid expansion, showing a significant increase in material volume and structural alteration
    of the container.
