changes:
  occlusion_method: Thick white steam fills the frame, obscuring the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand begins pulling steadily on the loose yarn end. Knitted fabric is constructed from
    a single continuous strand of yarn formed into interlocking loops. Each loop passes through the loops
    of the previous row creating a stable but mechanically separable structure. Tension applied to the
    yarn end acts to pull loops through their neighboring loops. The interlocked structure cannot spontaneously
    reform once loops are separated. The hand continues pulling the yarn with steady tension. Thick white
    steam from a nearby iron begins to fill the frame, quickly becoming opaque and completely obscuring
    the fabric and hand. The steam swirls for several seconds while the hand continues pulling the yarn.
    Then the steam dissipates rapidly, clearing the view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins pulling steadily on the loose yarn end. Knitted fabric is constructed from
    a single continuous strand of yarn formed into interlocking loops. Each loop passes through the loops
    of the previous row creating a stable but mechanically separable structure. Tension applied to the
    yarn end acts to pull loops through their neighboring loops. The interlocked structure cannot spontaneously
    reform once loops are separated. The hand continues pulling the yarn with steady tension. Thick white
    steam from a nearby iron begins to fill the frame, quickly becoming opaque and completely obscuring
    the fabric and hand. The steam swirls for several seconds while the hand continues pulling the yarn.
    Then the steam dissipates rapidly, clearing the view. No zoom, no cut, no scene change. STOP.
