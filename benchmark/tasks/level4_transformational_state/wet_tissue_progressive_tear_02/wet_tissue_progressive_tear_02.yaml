evaluation:
  init_frame_description: A first-person point-of-view shot showing two male hands holding a rectangular
    sheet of wet, white tissue paper over a stainless steel kitchen sink. The tissue is saturated with
    water, appearing translucent and sagging in the middle under its own weight. A droplet of water is
    falling from the lowest point of the tissue. The background features a blurred kitchen faucet and
    sink area. The tissue is currently intact with no rips or tears.
  init2final_edit_prompt: Edit the image to show the wet tissue paper torn vertically into two distinct
    pieces or significantly ripped down the center. The edges of the tear should appear ragged, uneven,
    and fibrous, characteristic of wet paper separating. The hands should be holding the separated fragments,
    maintaining the same grip but with the material between them severed. The tissue should no longer
    be a single continuous sheet.
  rationale: The video prompt establishes that the tissue is wet, which significantly lowers its tensile
    strength. The action describes applying outward tension which continues even while the scene is occluded
    by darkness. Given the material properties and the duration of the applied force, the tissue will
    inevitably tear or separate into pieces. When the lights return, the visual state must reflect this
    irreversible structural damage (tearing) that occurred during the blackout.
