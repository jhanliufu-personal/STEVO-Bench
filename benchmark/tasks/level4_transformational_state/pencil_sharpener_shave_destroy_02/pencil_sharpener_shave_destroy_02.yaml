changes:
  occlusion_method: Room lights turn off completely (pitch black).
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (pencil sharpens).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains
    cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates
    inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material
    is physically separated from the main pencil body, it cannot reattach. The hand continues cranking
    the sharpener mechanism. Suddenly, the workshop lights turn off completely, plunging the scene into
    absolute pitch blackness where nothing is visible. The cranking action continues in the dark for several
    seconds. Then the lights turn back on, illuminating the scene again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The hand begins turning the sharpener crank in a circular motion. The rotary sharpener contains
    cylindrical cutting blades positioned to contact the pencil wood and graphite as the pencil rotates
    inside the mechanism. The cutting blades have sharp edges designed to shave material. Once material
    is physically separated from the main pencil body, it cannot reattach. The hand continues cranking
    the sharpener mechanism. Suddenly, the workshop lights turn off completely, plunging the scene into
    absolute pitch blackness where nothing is visible. The cranking action continues in the dark for several
    seconds. Then the lights turn back on, illuminating the scene again. STOP.
