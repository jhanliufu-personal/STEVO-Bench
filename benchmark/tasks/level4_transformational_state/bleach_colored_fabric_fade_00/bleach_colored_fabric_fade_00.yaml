id: bleach_colored_fabric_fade_00
level: 4
category: structural_transformation
tags: []
variant_of: bleach_colored_fabric_fade
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The bleach bottle tips and pours liquid bleach onto the dark blue fabric surface. Household
    bleach contains sodium hypochlorite which is a strong oxidizing agent that reacts with organic dye
    molecules. The chemical oxidation process is irreversible at room temperature. The bleach continues
    to contact and saturate the fabric fibers. Camera remains stationary throughout. The tray and fabric
    remain fully visible within the frame. No zoom, no cut, no scene change. STOP.
  camera_WM: The bleach bottle tips and pours liquid bleach onto the dark blue fabric surface. Household
    bleach contains sodium hypochlorite which is a strong oxidizing agent that reacts with organic dye
    molecules. The chemical oxidation process is irreversible at room temperature. The bleach continues
    to contact and saturate the fabric fibers. Camera remains stationary throughout. The tray and fabric
    remain fully visible within the frame. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A top-down view of a white plastic tray containing a square piece of wrinkled
    dark blue fabric. A hand holds a white Clorox bleach bottle in the upper right corner, tilted downwards
    with a few drops of clear liquid just beginning to fall from the spout.
  init2final_edit_prompt: Edit the given image to show a continuous stream of liquid pouring from the
    bleach bottle onto the center of the dark blue fabric. Create a noticeable wet, saturated area on
    the fabric where the liquid hits. Change the color of the fabric within this wet area to a significantly
    lighter shade (such as white, pale pink, or light orange) to simulate the bleaching and discoloration
    of the dye. Tilt the bleach bottle slightly more to align with the pouring stream.
  rationale: The prompt describes pouring bleach onto a dyed fabric. Physically, the liquid flows from
    the bottle to the cloth, creating a wet spot. Chemically, the sodium hypochlorite in the bleach oxidizes
    the dye molecules, causing an irreversible loss of color (fading) in the saturated area. The final
    state must show both the physical presence of the liquid (wetness/stream) and the chemical effect
    (discoloration/whitening) to distinguish the fluid from water.
  questions:
  - id: bleach_stream_visible
    question: Is there a stream of liquid connecting the bottle to the fabric?
    answer_type: yes_no
    notes_for_judge: Checks for the pouring action.
  - id: fabric_wet_spot
    question: Is there a visible wet or saturated spot on the fabric?
    answer_type: yes_no
    notes_for_judge: Checks for physical contact of the liquid.
  - id: color_change_occurred
    question: Has the fabric changed color in the area where the liquid was poured?
    answer_type: yes_no
    notes_for_judge: 'Primary transformation check: the dye should react.'
  - id: spot_is_lighter
    question: Is the affected spot on the fabric lighter in color than the surrounding dark blue fabric?
    answer_type: yes_no
    notes_for_judge: 'Directional check: bleach removes color, making it lighter/white/pink.'
  - id: discoloration_visible
    question: Does the fabric show signs of bleaching or discoloration (e.g., turning white, pink, or
      orange)?
    answer_type: yes_no
    notes_for_judge: Specific check for the chemical effect of bleach.
  - id: bottle_tilted
    question: Is the bleach bottle tilted downwards to allow pouring?
    answer_type: yes_no
    notes_for_judge: Action consistency.
  - id: tray_consistency
    question: Is the white tray still visible and intact?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: fabric_integrity
    question: Is the fabric still a single piece, despite the color change?
    answer_type: yes_no
    notes_for_judge: Bleach fades color but doesn't immediately disintegrate the cloth in seconds.
