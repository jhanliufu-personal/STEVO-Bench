id: wood_log_sawing
level: 4
category: structural_transformation
transformation_type: cutting (material removal)
prompts:
  image_gen_prompt: A thick wooden log is secured on a sawhorse. A sharp hand saw is resting on the top
    of the log, ready to begin cutting on a marked line.
  video_WM: A person begins vigorously moving the hand saw back and forth across the wooden log. The sawing
    action to cut through the log is active. The camera rotates right until the log and saw completely
    exit the view, then rotates toward the left smoothly at the same rate until the cut site on the log
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand saw is moved vigorously back and forth to cut through the wooden log. The sawing
    action continues. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
