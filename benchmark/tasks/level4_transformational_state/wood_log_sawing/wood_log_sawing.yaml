id: wood_log_sawing
level: 4
category: structural_transformation
transformation_type: cutting (material removal)
prompts:
  image_gen_prompt: A thick wooden log is secured on a sawhorse. A sharp hand saw is resting on the top
    of the log, ready to begin cutting on a marked line.
  video_WM: A person begins vigorously moving the hand saw back and forth across the wooden log. The sawing
    action to cut through the log is active. The camera rotates right until the log and saw completely
    exit the view, then rotates toward the left smoothly at the same rate until the cut site on the log
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand saw is moved vigorously back and forth to cut through the wooden log. The sawing
    action continues. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up outdoor shot of a thick, textured wooden log resting on a wooden
    sawhorse in a forest. A hand saw with a wooden handle is positioned in a shallow cut (kerf) on the
    top of the log. There is a small amount of sawdust visible around the cut. The background features
    blurred trees and foliage.
  init2final_edit_prompt: Edit the given image to show the saw blade positioned significantly deeper into
    the wooden log, indicating that the cut has progressed. The handle of the saw should be lower, closer
    to the log's surface. Add a noticeable accumulation of fresh sawdust on the log around the cut and
    on the ground or sawhorse below. The cut itself should appear deeper and more pronounced.
  rationale: 'The video prompt describes a vigorous sawing action that continues while the camera pans
    away and returns. Sawing is a subtractive, irreversible process. Therefore, upon the camera''s return,
    the state of the log must show progress: the saw blade should be deeper within the wood, the cut (kerf)
    should be more extensive, and there should be an increase in sawdust (swarf) generated by the material
    removal.'
  questions:
  - id: saw_depth
    question: Is the saw blade positioned deeper into the log than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the position of the saw's teeth and handle relative to the top of the log.
      The blade should be buried deeper.
  - id: sawdust_increase
    question: Is there more sawdust visible on the log or sawhorse than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for fresh piles of wood dust around the cut site or falling below.
  - id: cut_progression
    question: Does the cut in the log appear deeper or more advanced than at the start?
    answer_type: yes_no
    notes_for_judge: The slit in the wood should be deeper.
  - id: handle_position
    question: Is the handle of the saw closer to the log surface compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the saw cuts deeper, the handle moves downward.
  - id: structural_change
    question: Has the log undergone material removal visible as a deeper incision?
    answer_type: yes_no
    notes_for_judge: Check for irreversible structural change (cutting).
  - id: background_consistency
    question: Are the trees in the background consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change, only the log state.
  - id: sawhorse_integrity
    question: Is the wooden sawhorse structurally intact and recognizable?
    answer_type: yes_no
    notes_for_judge: The support structure should remain unchanged.
