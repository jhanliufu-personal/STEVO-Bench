id: projectile_window_break_08
level: 4
category: structural_transformation
tags: []
variant_of: projectile_window_break
variation_type: combined
variation_description: Paper airplane projectile combined with smoke occlusion.
changes:
  occlusion_method: Thick smoke fills the scene.
  dynamic_conditions: Projectile is a paper airplane.
  expected_outcome_change: The plane glances off; glass remains intact.
prompts:
  init_frame_edit_prompt: Edit the image to replace the metal bullet with a folded white paper airplane.
  video_WM: The lightweight paper airplane glides into the center of the glass pane. A sudden, thick cloud
    of white smoke rises, completely obscuring the window. The smoke slowly dissipates until the window
    is visible again. No zoom, no cut, no scene change. STOP.
  camera_WM: The lightweight paper airplane glides into the center of the glass pane. A sudden, thick
    cloud of white smoke rises, completely obscuring the window. The smoke slowly dissipates until the
    window is visible again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A view through a wooden-framed window looking out at a green garden and a rustic
    wooden house. In the center of the frame, a white paper airplane is in mid-flight, gliding towards
    the glass. The paper airplane is sharp and distinct, with a pointed nose and wide wings. The window
    glass has some minor reflections and dust but is intact. The background shows trees, grass, and a
    building in soft focus.
  init2final_edit_prompt: Edit the given image to show the paper airplane lying crumpled on the wooden
    window sill at the bottom of the frame. The airplane's nose should be bent and its wings distorted
    to indicate impact. Remove the flying airplane from the center. Ensure the window glass remains intact
    and unbroken, and that the view is clear with no smoke visible.
  rationale: The prompt describes a 'lightweight paper airplane' hitting a glass pane. Physically, a paper
    airplane lacks the mass and hardness to break a window, so the irreversible transformation must occur
    to the projectile itself (crumpling/deformation) rather than the target. The smoke acts as a temporary
    occluder to mask the impact dynamics. After the smoke dissipates, gravity dictates the crumpled plane
    will have fallen to the window sill or bottom frame, while the glass remains intact.
  questions:
  - id: plane_crumpled
    question: Does the paper airplane appear crumpled or bent?
    answer_type: yes_no
    notes_for_judge: Look for structural deformation like a bent nose or distorted wings.
  - id: plane_on_sill
    question: Is the paper airplane resting on the window sill or bottom frame?
    answer_type: yes_no
    notes_for_judge: The plane should no longer be in the air.
  - id: nose_damaged
    question: Is the nose of the paper airplane deformed?
    answer_type: yes_no
    notes_for_judge: The sharp point should be blunted or bent.
  - id: not_flying
    question: Is the paper airplane no longer flying in the center of the window?
    answer_type: yes_no
    notes_for_judge: Check that the original flying instance is gone.
  - id: shape_change
    question: Has the paper airplane lost its smooth aerodynamic shape?
    answer_type: yes_no
    notes_for_judge: Compare to the initial perfect fold.
  - id: window_intact
    question: Is the window glass still intact?
    answer_type: yes_no
    notes_for_judge: Paper airplanes should not break glass; check for absence of cracks.
  - id: smoke_cleared
    question: Is the view through the window clear of smoke?
    answer_type: yes_no
    notes_for_judge: The prompt states the smoke dissipates.
