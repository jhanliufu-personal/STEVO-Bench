evaluation:
  init_frame_description: A close-up, high-angle shot showing a pair of hands holding a thick, twisted
    natural fiber rope over a wooden workbench. The rope has a tight, helical braided structure made of
    fibrous strands. The hands are gripping the rope firmly. The background is a blurred wooden surface
    containing tools, specifically a pair of pliers, and some loose fibers or string.
  init2final_edit_prompt: Edit the given image to show the rope significantly unraveled and untwisted
    between the hands. The previously tight helical braid structure should be separated into distinct,
    loose strands and fiber bundles. The rope in the manipulated area should appear wider, more voluminous,
    and frayed due to the separation of the strands. The hands should be holding these separated strands
    apart, maintaining the same camera angle and background.
  rationale: The prompt describes a continuous physical action of untwisting and separating the rope strands.
    A period of total darkness (occlusion) occurs, during which the prompt specifies the action continues.
    Therefore, upon the restoration of light, the state of the rope must have progressed significantly
    from a tight braid to a loosened, unraveled structure. This is an irreversible structural change where
    the order of the braid is destroyed to increase entropy (disorder/fraying).
