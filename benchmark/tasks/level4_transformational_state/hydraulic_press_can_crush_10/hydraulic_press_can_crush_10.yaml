id: hydraulic_press_can_crush_10
level: 4
category: structural_transformation
tags: []
variant_of: hydraulic_press_can_crush
variation_type: combined
variation_description: Sponge instead of can AND occlusion via steam/fog.
changes:
  occlusion_method: Steam filling the chamber.
  dynamic_conditions: Object is a soft sponge.
  expected_outcome_change: Object compresses extremely flat.
prompts:
  init_frame_edit_prompt: Edit the image to replace the soda can with a yellow kitchen sponge standing
    vertically.
  video_WM: The hydraulic press plate moves downward onto the kitchen sponge. The compressing action is
    active. Thick white steam fills the chamber, completely obscuring the sponge and press. The steam
    then dissipates. No zoom, no cut, no scene change. STOP.
  camera_WM: The hydraulic press plate moves downward onto the kitchen sponge. The compressing action
    is active. Thick white steam fills the chamber, completely obscuring the sponge and press. The steam
    then dissipates. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A yellow rectangular kitchen sponge standing vertically on the metal platform
    of a hydraulic press. A heavy metal press plate is positioned above the sponge with a visible gap.
    The background features industrial machinery components, including hydraulic hoses and a pressure
    gauge.
  init2final_edit_prompt: Edit the given image to show the top metal plate of the hydraulic press in a
    significantly lower position, pressing down on the sponge. The yellow sponge should appear flattened
    and squashed between the top and bottom plates, with its vertical height greatly reduced. The gap
    between the press plates should be much smaller than in the original view.
  rationale: The prompt describes a hydraulic press moving downward and actively compressing the sponge.
    Although steam temporarily obscures the view, it dissipates by the end, revealing the physical consequences
    of the action. The final state should show the press plate in a lowered position and the sponge significantly
    deformed (flattened) by the compressive force. The 'active' compression implies the press has not
    retracted, so the sponge remains in a squashed state.
  questions:
  - id: press_plate_lowered
    question: Is the top metal plate lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The plate should have moved down to compress the object.
  - id: sponge_compressed
    question: Is the yellow sponge flattened or squashed compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The sponge should show signs of significant vertical compression.
  - id: sponge_height_reduced
    question: Is the vertical height of the sponge significantly less than it was initially?
    answer_type: yes_no
    notes_for_judge: Check for reduction in height due to crushing.
  - id: plate_gap_smaller
    question: Is the gap between the top and bottom plates smaller than in the starting image?
    answer_type: yes_no
    notes_for_judge: The space between the plates must be reduced.
  - id: sponge_visible_after_steam
    question: Is the sponge visible again (not obscured by steam)?
    answer_type: yes_no
    notes_for_judge: The prompt states the steam dissipates, so the object should be visible.
  - id: contact_maintained
    question: Is the top plate in contact with the sponge?
    answer_type: yes_no
    notes_for_judge: Since the compressing action is active, the plate should be touching/crushing the
      sponge.
  - id: gauge_consistency
    question: Is the pressure gauge in the background still present?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
