evaluation:
  init_frame_description: A high-angle, eye-level shot of a large, rectangular stainless steel baking
    sheet resting on a rustic wooden table. The sheet has a flat, reflective interior surface and raised,
    rolled rims. Two hands, belonging to a light-skinned person, are visible entering from the left and
    right edges of the frame, grasping the side rims of the baking sheet. The lighting is natural and
    diffuse, highlighting the metallic texture of the sheet and the wood grain of the table.
  init2final_edit_prompt: Edit the given image to show the scene after a period of physical exertion.
    The stainless steel sheet must remain completely flat, rigid, and uncrumpled, retaining its original
    rectangular shape and smooth reflective surface without any bends, dents, or folds. The hands should
    remain grasping the edges of the tray, potentially showing tension, but the metal object itself must
    appear undeformed and structurally intact. The lighting should be fully illuminated and natural, matching
    the initial appearance.
  rationale: 'The prompt explicitly defines the material as ''thick stainless steel'' with ''high yield
    strength'' that acts as a ''rigid body'' and ''resists deformation.'' It states that the material
    properties ''prevent the hands from bending or crumpling the sheet.'' Therefore, despite the implied
    application of force during the blackout, the physical outcome is null: the sheet must not crumple.
    The final state should show the sheet exactly as it was initially—flat and rigid. This tests the model''s
    adherence to explicit material constraints against the common bias to crumple sheet-like objects when
    force is applied.'
