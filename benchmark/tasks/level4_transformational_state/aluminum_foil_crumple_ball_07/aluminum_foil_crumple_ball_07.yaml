prompts:
  init_frame_edit_prompt: Edit the image to replace the aluminum foil with a thick, rigid stainless steel
    baking sheet.
  video_WM: The hands grasp the edges of the thick stainless steel sheet and attempt to apply compressive
    force. Thick stainless steel is a rigid material with extremely high yield strength. Unlike thin foil,
    it acts as a rigid body under manual force and resists deformation. The material properties prevent
    the hands from bending or crumpling the sheet. Suddenly, the lights in the room turn off completely,
    plunging the scene into pitch black darkness. The audio implies the hands continue to apply force
    in the dark. After several seconds, the lights turn back on, illuminating the scene from the original
    viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands grasp the edges of the thick stainless steel sheet and attempt to apply compressive
