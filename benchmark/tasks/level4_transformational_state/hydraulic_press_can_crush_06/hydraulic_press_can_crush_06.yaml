id: hydraulic_press_can_crush_06
level: 4
category: structural_transformation
tags: []
variant_of: hydraulic_press_can_crush
variation_type: dynamic_condition
variation_description: The soda can is replaced by a rubber ball.
changes:
  occlusion_method: null
  dynamic_conditions: Object is elastic rubber instead of plastic/metal.
  expected_outcome_change: The object squashes flat elastically rather than crumpling permanently.
prompts:
  init_frame_edit_prompt: Edit the image to replace the soda can with a large, colorful rubber ball.
  video_WM: The hydraulic press plate moves downward onto the rubber ball. The compressing action is active.
    The camera rotates right until the press completely exits the view, then rotates toward the left smoothly
    at the same rate until the press plate area is back in the center of view. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The hydraulic press plate moves downward onto the rubber ball. The compressing action is
    active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A colorful, swirled rubber ball (red, blue, yellow, green) is centered between
    the top and bottom metal plates of a hydraulic press. The top plate is positioned just above the ball.
    In the background, there are hydraulic hoses, pipes, and pressure gauges mounted on a dirty, industrial
    wall.
  init2final_edit_prompt: Edit the given image to show the hydraulic press top plate lowered significantly,
    crushing the rubber ball. The ball should appear flattened into a wide, compressed shape between the
    two plates, with its vertical height greatly reduced and its horizontal width expanded.
  rationale: The prompt specifies that the hydraulic press plate moves downward and the compressing action
    is active. While the camera rotates away and then returns to the original view, the press continues
    to exert force. Therefore, in the final frame, the top plate must be lower, and the rubber ball must
    be significantly compressed, flattened, or crushed between the plates due to the continuous downward
    motion during the occluded period.
