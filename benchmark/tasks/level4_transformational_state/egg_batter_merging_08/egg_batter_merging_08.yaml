id: egg_batter_merging_08
level: 4
category: structural_transformation
tags: []
variant_of: egg_batter_merging
variation_type: combined
variation_description: Gentle folding action AND occlusion by a blocking object.
changes:
  occlusion_method: A large recipe book blocks the view.
  dynamic_conditions: Slow, gentle folding.
  expected_outcome_change: Mixture is less integrated/streaky.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The whisk gently folds the eggs into the flour with slow, deliberate movements. A large recipe
    book moves into the frame, completely blocking the view of the bowl, then moves away to reveal the
    bowl again. No zoom, no cut, no scene change. STOP.
  camera_WM: The whisk gently folds the eggs into the flour with slow, deliberate movements. A large recipe
    book moves into the frame, completely blocking the view of the bowl, then moves away to reveal the
    bowl again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A top-down view of a ceramic mixing bowl on a wooden table. Inside the bowl,
    there is a mound of white flour with a well in the center containing four raw egg yolks and egg whites.
    A metal balloon whisk rests in the bowl, with the wires partially submerged in the eggs and resting
    on the flour. To the right of the bowl is a crumpled linen cloth. Scattered flour dusts the wooden
    table surface.
  init2final_edit_prompt: Edit the given image to show the ingredients in the bowl partially mixed together.
    The distinct round egg yolks should be broken and disrupted, streaked into the white flour. The contents
    of the bowl should look like a lumpy, uneven mixture where the yellow liquid and white powder are
    beginning to combine into a dough or batter, losing the clean separation seen in the original image.
  rationale: The video prompt describes a whisk folding eggs into flour. This is an irreversible mixing
    process. Although the action is occluded by a book, the state of the world must advance during this
    time. When the view is restored, the pristine separation of ingredients (intact yolks, dry flour ring)
    must be disturbed. The yolks should be broken and partially incorporated into the flour, resulting
    in a messier, lumpy texture indicative of the early stages of batter formation.
