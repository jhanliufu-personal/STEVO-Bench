id: charcoal_stick_crush_crumble_03
level: 4
category: structural_transformation
tags: []
variant_of: charcoal_stick_crush_crumble
variation_type: occlusion_method
variation_description: Uses camera zoom out to make the object too small to see details, serving as occlusion.
changes:
  occlusion_method: Camera zooms out until the hand is a tiny dot, then zooms back in.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force. The camera rapidly zooms out until the hand and charcoal are too small to discern
    any details or state changes. The camera holds this distant view for several seconds while the pressure
    continues. Then the camera zooms back in smoothly to the original framing. No cut, no scene change.
    STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the charcoal stick. Artist charcoal
    is a highly porous carbon material with low structural strength and tendency to fracture under compression.
    The material is brittle with weak bonds between carbon particles. The fingers continue increasing
    compressive force during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
  Genie: null
evaluation:
  init_frame_description: A close-up first-person view of a hand holding a thick, cylindrical stick of
    black artist's charcoal. The charcoal has a porous, textured surface with visible small holes. The
    hand is slightly dirty with charcoal dust. The background is a blurred wooden table with white papers
    containing charcoal sketches and other art supplies.
  init2final_edit_prompt: Edit the given image to show the charcoal stick crushed and crumbled within
    the hand. The single solid cylinder should be fractured into multiple broken chunks, shards, and coarse
    black powder. The hand should be gripping these broken fragments, with increased charcoal dust smudged
    on the fingers and palm. The structural integrity of the stick is destroyed, replacing the clean cylindrical
    form with a pile of debris held in the fingers.
  rationale: The prompt describes applying squeezing pressure to a brittle charcoal stick. Charcoal has
    low tensile strength and fractures easily under compression. While the camera zooms out and back in,
    the pressure continues, causing the stick to snap, crumble, or shatter. Upon the return to the original
    framing, the stick must be visibly broken or crumbled, representing an irreversible structural change
    from a solid cylinder to fragments.
  questions:
  - id: structural_integrity
    question: Is the charcoal stick no longer a single, intact cylinder?
    answer_type: yes_no
    notes_for_judge: The object should be broken, cracked, or crumbled, not a perfect cylinder.
  - id: fragmentation
    question: Are there visible cracks, fractures, or separate pieces of charcoal?
    answer_type: yes_no
    notes_for_judge: Look for lines of separation or distinct chunks.
  - id: debris_presence
    question: Is there loose charcoal dust, crumbs, or debris visible that was not present initially?
    answer_type: yes_no
    notes_for_judge: Crushing charcoal creates fine debris.
  - id: form_change
    question: Has the overall shape of the charcoal been distorted or flattened due to crushing?
    answer_type: yes_no
    notes_for_judge: The shape should no longer be a uniform cylinder.
  - id: hand_interaction
    question: Does the hand appear to be gripping broken remnants or a damaged object?
    answer_type: yes_no
    notes_for_judge: The grip should reflect holding pieces rather than a solid stick.
  - id: irreversibility
    question: Does the charcoal show signs of irreversible damage compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Damage that cannot be undone (breaking/crushing).
  - id: background_consistency
    question: Are the blurred papers and table in the background consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
