camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture of a bird standing on a metal plate
    on a workbench. To the left, a heat gun with a silver body and orange nozzle is pointed directly at
    the bird. The bird has detailed feather textures. There is a small amount of melted wax already pooling
    at the bird's feet. In the background, out of focus, are various tools including a hammer, pliers,
    and a bottle.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture significantly melted and
    deformed. The detailed feather textures should appear smoothed out or liquefied. The overall shape
    of the bird should be sagging, collapsing, or losing its distinct form, with the head or wings drooping.
    The pool of melted liquid wax on the metal plate at the base of the sculpture should be much larger
    and spreading further outward than in the original image.
  rationale: The heat gun applies intense heat to the wax, causing a phase change from solid to liquid.
    This results in an irreversible loss of structural integrity. Gravity causes the liquefied wax to
    flow downwards, increasing the size of the pool at the base and causing the bird's form to sag, smooth
    out, and eventually collapse. The transformation is progressive, moving from surface smoothing to
    structural failure.
