id: wax_sculpture_melt_collapse_00
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The heat gun is turned on high and aimed at the wax bird. Intense heat hits the sculpture.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
  camera_WM: The heat gun is turned on high and aimed at the wax bird. Intense heat hits the sculpture.
    Camera remains stationary throughout. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a brown wax sculpture of a bird standing on a metal plate
    on a workbench. To the left, a heat gun with a silver body and orange nozzle is pointed directly at
    the bird. The bird has detailed feather textures. There is a small amount of melted wax already pooling
    at the bird's feet. In the background, out of focus, are various tools including a hammer, pliers,
    and a bottle.
  init2final_edit_prompt: Edit the given image to show the wax bird sculpture significantly melted and
    deformed. The detailed feather textures should appear smoothed out or liquefied. The overall shape
    of the bird should be sagging, collapsing, or losing its distinct form, with the head or wings drooping.
    The pool of melted liquid wax on the metal plate at the base of the sculpture should be much larger
    and spreading further outward than in the original image.
  rationale: The heat gun applies intense heat to the wax, causing a phase change from solid to liquid.
    This results in an irreversible loss of structural integrity. Gravity causes the liquefied wax to
    flow downwards, increasing the size of the pool at the base and causing the bird's form to sag, smooth
    out, and eventually collapse. The transformation is progressive, moving from surface smoothing to
    structural failure.
  questions:
  - id: melt_pool_expansion
    question: Is the pool of melted wax on the metal plate larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the surface area of the liquid wax at the base. It should be visibly expanded.
  - id: structural_deformation
    question: Does the wax bird appear more deformed or collapsed compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Look for sagging, drooping, or loss of the upright posture.
  - id: texture_loss
    question: Are the detailed feather textures on the bird less distinct or smoother than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Melting causes sharp details to smooth out into liquid surfaces.
  - id: form_integrity
    question: Has the bird lost definition in its specific features (like the beak, eyes, or wing edges)
      compared to the start?
    answer_type: yes_no
    notes_for_judge: Features should be melting away or becoming amorphous.
  - id: vertical_height
    question: Is the height of the bird sculpture lower or sagging downwards compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As the base melts and structure softens, the object should sink.
  - id: liquid_presence
    question: Is there more visible liquid wax flowing or dripping than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for new drips or a wetter appearance on the sculpture's surface.
  - id: heat_gun_presence
    question: Is the heat gun still visible on the left side of the frame?
    answer_type: yes_no
    notes_for_judge: 'Invariant check: The tool causing the heat should remain.'
  - id: background_consistency
    question: Are the background tools (hammer, pliers) still present and unchanged?
    answer_type: yes_no
    notes_for_judge: 'Invariant check: The background should not be affected by the localized heat.'
