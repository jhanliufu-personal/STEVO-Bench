evaluation:
  init_frame_description: A close-up, top-down view of a pair of elderly hands holding a large, dry, brown
    autumn leaf against a neutral, textured fabric background. The leaf is brittle with visible veins
    and some existing cracks. The thumbs are positioned on the central part of the leaf, holding it flat.
  init2final_edit_prompt: Edit the given image to show the dry autumn leaf crushed and crumbled. The leaf
    should be broken into fragments, shards, and smaller pieces, losing its original intact, flat shape.
    The hands should be positioned as if they have compressed the material, holding the crumpled remains.
    The texture of the leaf should appear shattered and destroyed, with debris visible.
  rationale: The video prompt describes a continuous crushing action applied to a brittle, dry leaf. Although
    a period of darkness occurs, the prompt explicitly states that the hands continue applying pressure
    during this time. Therefore, when the lights return, the leaf must have undergone significant irreversible
    structural failure, transitioning from a flat, intact sheet to a crumbled, fragmented state. The hands
    would likely be closer together or cupped around the debris.
