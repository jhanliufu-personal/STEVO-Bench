id: ribbon_cutting_10
level: 4
category: structural_transformation
tags: []
variant_of: ribbon_cutting
variation_type: combined
variation_description: Plastic safety scissors (condition) with fog occlusion.
changes:
  occlusion_method: Thick fog fills the scene.
  dynamic_conditions: Scissors are plastic safety scissors (dull).
  expected_outcome_change: Ribbon bends but does not cut.
prompts:
  init_frame_edit_prompt: Edit the image to change the metal scissors into colorful plastic safety scissors
    with rounded tips.
  video_WM: The blades of the plastic safety scissors begin to close slowly around the taut red ribbon.
    The closing action begins. Thick white fog fills the scene, completely obscuring the view. The fog
    swirls and then clears to reveal the scene again. The camera returns to the original viewpoint. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The blades of the plastic safety scissors begin to close slowly around the taut red ribbon.
    The closing action begins. Thick white fog fills the scene, completely obscuring the view. The fog
    swirls and then clears to reveal the scene again. The camera returns to the original viewpoint. No
    zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A taut red ribbon lies horizontally across a wooden table surface. A pair of
    blue and red plastic safety scissors is positioned with its blades open, straddling the ribbon, poised
    to cut it. A white window frame is visible in the background.
  init2final_edit_prompt: Edit the given image to show the red ribbon severed into two separate pieces.
    The scissors blades should be fully closed. There should be a visible gap or cut line in the ribbon
    exactly where the scissors blades are located, indicating the ribbon has been snipped.
  rationale: The video prompt describes the scissors beginning to close around the ribbon, followed by
    a period of occlusion (fog). The physical implication of scissors closing on a ribbon is a cutting
    action. Therefore, when the view returns, the irreversible transformation (the cut) should be complete
    or clearly visible, with the ribbon severed and the scissors in a closed state.
