id: frayed_rope_snap
level: 4
category: structural_transformation
transformation_type: severing (tension)
prompts:
  image_gen_prompt: A thick, heavily frayed hemp rope is being pulled taut between two winches. The central
    frayed section is visibly thinning under extreme tension.
  video_WM: The winches continue to pull the frayed rope tighter. Extreme tension is applied to the weakened
    central section of the rope. The camera rotates right until the rope completely exits the view, then
    rotates toward the left smoothly at the same rate until the center point between the winches is back
    in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: Extreme mechanical tension is applied to the frayed rope by the winches. The pulling force
    continues to increase. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
