variation_description: Gentle touch force combined with lighting occlusion.
changes:
  occlusion_method: Lighting change (lights off)
  dynamic_conditions: 'Force change: Gentle touch'
  expected_outcome_change: No change to the cracker
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand rests gently on the cracker through the plastic bag. The hand applies negligible
    weight, merely maintaining contact without exerting compressive force on the brittle structure. The
    lights in the room turn off completely, plunging the scene into pitch blackness. The hand maintains
    gentle contact in the dark without increasing pressure. Then the lights turn back on to reveal the
    scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand rests gently on the cracker through the plastic bag. The hand applies negligible
    weight, merely maintaining contact without exerting compressive force on the brittle structure. The
    lights in the room turn off completely, plunging the scene into pitch blackness. The hand maintains
    gentle contact in the dark without increasing pressure. Then the lights turn back on to reveal the
    scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A rectangular brown graham cracker is enclosed in a clear plastic ziplock bag
    resting on a wooden table. A human hand is placed flat on top of the bag, covering the upper portion
    of the cracker. The fingers are extended and relaxed. The cracker appears whole and unbroken with
    a textured surface.
  init2final_edit_prompt: Edit the given image to show the graham cracker inside the bag remaining completely
    intact and unbroken. The hand should be resting on the bag in the same position. The cracker must
    retain its full rectangular shape with no cracks, crumbs, or structural damage. The scene should be
    fully illuminated.
  rationale: 'The video prompt explicitly states that the hand applies ''negligible weight'' and exerts
    ''no compressive force'' on the cracker, merely maintaining contact. Although the lights turn off
    and on, the physical interaction is static and gentle, meaning no structural transformation or damage
    should occur. Therefore, the final state must show the cracker exactly as it was initially: whole,
    uncrushed, and intact.'
  questions:
  - id: cracker_intact
    question: Is the graham cracker still a single unbroken piece?
    answer_type: yes_no
    notes_for_judge: The cracker should not be broken into multiple pieces.
  - id: cracker_shape
    question: Does the cracker retain its original rectangular form?
    answer_type: yes_no
    notes_for_judge: The shape should not be distorted or crushed.
  - id: no_cracks
    question: Is the cracker free from visible cracks or fractures?
    answer_type: yes_no
    notes_for_judge: There should be no lines of breakage visible.
  - id: no_powder
    question: Is the cracker free from crumbling, powder, or loose fragments?
    answer_type: yes_no
    notes_for_judge: The prompt specifies no compressive force, so no crumbs should be generated.
  - id: structural_integrity
    question: Does the cracker appear structurally identical to the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare with the initial frame; it should look the same.
  - id: hand_position
    question: Is the hand still visible resting on the bag?
    answer_type: yes_no
    notes_for_judge: The hand maintains contact throughout.
  - id: lighting_on
    question: Is the scene fully illuminated?
    answer_type: yes_no
    notes_for_judge: The lights turn back on at the end.
