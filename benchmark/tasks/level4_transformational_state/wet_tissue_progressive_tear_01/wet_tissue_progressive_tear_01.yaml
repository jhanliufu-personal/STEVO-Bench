id: wet_tissue_progressive_tear_01
level: 4
category: structural_transformation
tags: []
variant_of: wet_tissue_progressive_tear
variation_type: occlusion_method
variation_description: Replaces camera rotation with thick steam rising from the sink to obscure the view.
changes:
  occlusion_method: Thick steam rises from the bottom of the frame, obscuring the hands and tissue.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When
    tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material
    loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural
    integrity is severely compromised by water infiltration between fibers. The hands continue applying
    slow, steady pulling force. Suddenly, thick white steam begins to rise rapidly from the sink below,
    filling the frame and completely obscuring the view of the hands and tissue. The steam swirls densely
    for several seconds while the hands remain hidden, continuing to pull. The steam then dissipates and
    clears away, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin applying gentle outward pulling tension to the wet tissue at the edges. When
    tissue paper becomes saturated with water, the cellulose fiber bonds weaken dramatically and the material
    loses most of its tensile strength. Wet tissue tears much more easily than dry tissue. The structural
    integrity is severely compromised by water infiltration between fibers. The hands continue applying
    slow, steady pulling force. Suddenly, thick white steam begins to rise rapidly from the sink below,
    filling the frame and completely obscuring the view of the hands and tissue. The steam swirls densely
    for several seconds while the hands remain hidden, continuing to pull. The steam then dissipates and
    clears away. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot showing a pair of male hands holding a rectangular
    sheet of white, wet tissue paper over a stainless steel kitchen sink. The tissue is saturated, translucent,
    and sagging in the middle, with a water droplet hanging from the lowest point. A chrome faucet is
    visible in the background, slightly out of focus.
  init2final_edit_prompt: Edit the given image so that the wet tissue is torn apart. Show a large, distinct
    vertical rip or separation in the center of the material, with ragged, fibrous edges visible where
    the structure has failed. The hands should be holding the separated pieces or the torn sides of the
    tissue, positioned slightly further apart than in the original image to reflect the pulling action.
    Ensure the background sink and faucet remain consistent and the view is clear.
  rationale: The prompt establishes that the tissue is wet and structurally weak, and that the hands apply
    a continuous pulling force. Although the action is obscured by steam, the prompt specifies that the
    hands continue to pull while hidden. Given the fragility of wet tissue described in the prompt, the
    continued tension must result in the material tearing or separating. The final state reveals the aftermath
    of this irreversible structural failure once the steam clears.
  questions:
  - id: tear_visible
    question: Is the tissue torn or ripped?
    answer_type: yes_no
    notes_for_judge: Look for a visible break, hole, or separation in the material.
  - id: structural_integrity
    question: Has the tissue lost its structural integrity compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The initial frame shows a continuous sheet; the final frame should show damage.
  - id: separation
    question: Is there a visible gap or separation between parts of the tissue?
    answer_type: yes_no
    notes_for_judge: The pulling action should create a gap.
  - id: ragged_edges
    question: Are there ragged or fibrous edges visible where the tissue has been damaged?
    answer_type: yes_no
    notes_for_judge: Torn wet tissue typically has irregular, fibrous edges.
  - id: pieces_held
    question: Are the hands holding separated fragments or torn sides of the tissue?
    answer_type: yes_no
    notes_for_judge: The hands should still be holding the material, but it should be damaged.
  - id: steam_cleared
    question: Is the view clear of the steam that was described in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the steam dissipates; the final frame should be clear like the
      start.
  - id: hands_visible
    question: Are the hands visible again?
    answer_type: yes_no
    notes_for_judge: The hands were obscured but should be revealed.
