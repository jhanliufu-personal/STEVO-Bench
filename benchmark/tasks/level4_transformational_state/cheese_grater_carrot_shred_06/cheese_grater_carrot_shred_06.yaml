  dynamic_conditions: Object is soft cheese instead of hard carrot.
  expected_outcome_change: Pile of cheese shreds instead of carrot shreds; cheese block deforms differently.
prompts:
  init_frame_edit_prompt: Edit the image to replace the carrot with a rectangular block of yellow cheddar
    cheese.
  video_WM: The hand begins pushing the block of yellow cheddar cheese downward along the rough grater
    surface with repeated strokes. Box graters have sharp raised edges that shave off soft dairy products
    easily. The cheese is malleable and dense. Progressive strokes force the cheese against the sharp
    edges. The camera rotates right at constant speed until the grater and cheese completely exit the
    view to the right. The camera continues rotating right for several seconds while the hand remains
    off-screen grating the cheese. Then the camera rotates left smoothly at the same rate back to the
    original viewpoint. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand begins pushing the block of yellow cheddar cheese downward along the rough grater
    surface with repeated strokes. Box graters have sharp raised edges that shave off soft dairy products
    easily. The cheese is malleable and dense. Progressive strokes force the cheese against the sharp
    edges. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot showing a metal box grater standing vertically on
    a worn wooden cutting board. A hand enters from the right, holding a rectangular block of yellow cheddar
    cheese against the side of the grater. A pile of shredded yellow cheese is already visible at the
    base of the grater on the wooden board. In the background, a window with a white frame allows natural
    light to illuminate the scene.
  init2final_edit_prompt: Edit the given image to show the result of grating the cheese. Make the rectangular
    block of yellow cheese held by the hand noticeably smaller and shorter, reducing its volume to indicate
    material loss. Increase the size and height of the pile of shredded cheese at the base of the grater,
    adding more cheese strands to the existing mound. Keep the metal grater, the wooden board, and the
    background window unchanged. Maintain the original camera angle and lighting.
  rationale: The video prompt describes a continuous grating action that persists even while the camera
    pans away. When the camera returns to the original viewpoint, the physical state of the objects must
    reflect the accumulated work done during the elapsed time. Grating is an irreversible process where
    the solid block is consumed to produce shreds. Therefore, the final frame must show a smaller block
    of cheese and a correspondingly larger pile of grated cheese compared to the initial frame.
