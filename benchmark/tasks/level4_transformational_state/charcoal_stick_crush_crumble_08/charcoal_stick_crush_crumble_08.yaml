variation_description: Changes material to steel (no break) and uses lights off occlusion.
changes:
  occlusion_method: Lights turn off completely.
  dynamic_conditions: Material changed to rigid steel.
  expected_outcome_change: Object remains intact (no crumbling).
prompts:
  init_frame_edit_prompt: Edit the image to replace the charcoal stick with a solid, polished steel cylinder.
  video_WM: The fingers begin applying progressive squeezing pressure to the steel cylinder. Steel is
    a rigid metal alloy with extremely high structural integrity and resistance to compression. The material
    is dense and hard. The fingers continue increasing compressive force. Suddenly, the studio lights
    turn off completely, plunging the scene into absolute pitch black darkness. The squeezing action continues
    in the dark for several seconds. Then the lights turn back on, revealing the scene again. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The fingers begin applying progressive squeezing pressure to the steel cylinder. Steel is
    a rigid metal alloy with extremely high structural integrity and resistance to compression. The material
    is dense and hard. The fingers continue increasing compressive force. Suddenly, the studio lights
    turn off completely, plunging the scene into absolute pitch black darkness. The squeezing action continues
    in the dark for several seconds. Then the lights turn back on, revealing the scene again. No zoom,
    no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, first-person perspective shot of a left hand holding a polished
    steel cylinder vertically. The cylinder is highly reflective, showing distorted reflections of a window
    and the room. The hand is covered in dark smudges, likely charcoal dust. The fingers are wrapped around
    the cylinder. The background shows a wooden table with charcoal drawings on paper and some drawing
    tools.
  init2final_edit_prompt: Edit the given image to show the hand squeezing the steel cylinder tightly.
    The fingers should appear to be exerting significant force, with the finger pads flattened against
    the metal and the skin around the knuckles appearing taut or slightly whiter due to pressure. The
    steel cylinder itself must remain perfectly rigid and unchanged in shape, retaining its straight cylindrical
    form and smooth, reflective surface without any dents, bending, or deformation. Keep the lighting,
    background, and camera angle identical to the original image.
  rationale: The video prompt explicitly defines the object as a 'steel cylinder' with 'extremely high
    structural integrity' and 'resistance to compression'. Physically, a human hand cannot deform or crush
    a solid steel cylinder. Therefore, despite the description of 'progressive squeezing pressure' and
    the blackout transition, the correct final state must show the object completely intact and undeformed.
    The 'transformation' in this case is the application of force (visible in the hand's tension) which
    fails to alter the object's geometry, serving as a negative test for material property adherence.
    The model must not hallucinate crushing or crumbling simply because the action is 'squeezing'.
