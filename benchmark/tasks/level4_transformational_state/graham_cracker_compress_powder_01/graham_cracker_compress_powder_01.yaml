prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The hand presses down on the cracker through the plastic bag with progressive force. Graham
    crackers are baked goods with brittle structure that fractures easily under compression. The hand
    applies grinding and pressing motions to distribute force across the cracker surface. The material
    is dry and has low fracture toughness typical of baked wheat products. A large opaque kitchen towel
    is placed over the plastic bag and hand, completely blocking the view. The hand continues to apply
    pressure and grinding motion underneath the towel. Then the towel is removed to reveal the scene.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses down on the cracker through the plastic bag with progressive force. Graham
    crackers are baked goods with brittle structure that fractures easily under compression. The hand
    applies grinding and pressing motions to distribute force across the cracker surface. The material
    is dry and has low fracture toughness typical of baked wheat products. A large opaque kitchen towel
