id: paper_burning_v09
level: 4
category: transformational_state_change
tags: []
variant_of: paper_burning
variation_type: combined
variation_description: Paper doused in accelerant (intense fire) combined with camera moving backward
  away from scene.
changes:
  occlusion_method: Camera moves backward/away until scene is lost.
  dynamic_conditions: Accelerant increases burn rate and intensity.
  expected_outcome_change: Paper is consumed much faster and more violently.
prompts:
  init_frame_edit_prompt: Edit the image to add a pool of liquid lighter fluid on the plate around the
    paper. Make the flames significantly larger, taller, and more intense.
  video_WM: Single continuous take, no cuts. Camera starts centered on the plate with the intensely burning
    paper. The camera moves backward, retreating away from the table and through a doorway until the table
    is no longer visible. The camera holds this position for several seconds. Then the camera moves forward,
    returning to the original close-up viewpoint. Lighting and objects remain consistent and realistic.
  camera_WM: A piece of paper burns intensely in a pool of lighter fluid on a plate. Lighting and objects
    remain consistent and realistic. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a rustic wooden table. In the center
    sits a round, earth-toned ceramic plate. On the plate is a rolled piece of white paper that is actively
    burning. Bright orange and yellow flames are consuming the right side and top of the paper roll. Smoke
    is rising from the fire. Portions of the paper are already blackened and charred, while the left side
    of the roll remains white and intact.
  init2final_edit_prompt: Edit the given image to show the paper in a significantly more advanced state
    of burning. Reduce the amount of visible white paper, replacing it with black charred material, gray
    ash, and crumbling fragments. Show the structure of the paper roll as collapsed or disintegrated due
    to the fire. The flames may be smaller or shifted to consume remaining fuel, or replaced by smoldering
    embers. Ensure the ceramic plate and wooden table remain unchanged in appearance and position.
  rationale: 'The video prompt describes a camera moving away, holding for several seconds, and then returning.
    During this elapsed time, the fire physically consumes the paper. Burning is an irreversible transformation.
    Therefore, the final frame must show the paper in a more degraded state than the initial frame: less
    unburnt white paper, more char/ash, and a loss of the original rolled structure. The surrounding environment
    (plate, table) is static and should remain consistent.'
  questions:
  - id: paper_consumed
    question: Is the amount of white unburnt paper visible less than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the surface area of white paper. It should be reduced due to burning.
  - id: charring_increase
    question: Is there more black charred material or ash visible on the plate compared to the start?
    answer_type: yes_no
    notes_for_judge: The burning process creates char and ash; this should be more prevalent.
  - id: structural_degradation
    question: Has the cylindrical shape of the paper roll collapsed or deformed further?
    answer_type: yes_no
    notes_for_judge: Fire compromises structural integrity; the roll should look less defined or broken.
  - id: fragmentation
    question: Are there signs of the paper breaking apart or fragmenting into ash?
    answer_type: yes_no
    notes_for_judge: Look for crumbling edges or pieces of ash separated from the main body.
  - id: burning_progression
    question: Does the object appear more consumed by fire than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: General assessment of the irreversible state change.
  - id: plate_consistency
    question: Is the ceramic plate still present and recognizable?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: table_consistency
    question: Is the wooden table surface consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
