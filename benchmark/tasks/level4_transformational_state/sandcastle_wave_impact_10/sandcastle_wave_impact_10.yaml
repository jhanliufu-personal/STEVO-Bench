id: sandcastle_wave_impact_10
level: 4
category: structural_transformation
tags: []
variant_of: sandcastle_wave_impact
variation_type: combined
variation_description: No wave condition + Camera pan occlusion.
changes:
  occlusion_method: Camera 360 turn
  dynamic_conditions: 'Wave: Present -> Absent (Calm day)'
  expected_outcome_change: No change to sandcastle
prompts:
  init_frame_edit_prompt: Edit the image to remove the wave entirely, showing calm flat water and dry
    sand around the castle.
  video_WM: The scene is calm with no wave approaching. The camera rotates 180 degrees to face away from
    the ocean towards the beach dunes, then rotates back 180 degrees to face the sandcastle again. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The scene is calm with no wave approaching. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A detailed, multi-tiered sandcastle stands on a sandy beach. It features a central
    cluster of tall towers with conical roofs, a bridge connecting the main structure to a smaller outpost,
    and a surrounding fortified wall. The base of the castle is decorated with a row of white seashells.
    The surrounding sand is smooth and tan. In the background, a calm ocean meets a cloudy, grey-blue
    sky.
  init2final_edit_prompt: Edit the given image to show the sandcastle completely intact and unchanged.
    Ensure all towers, the bridge, and the outer walls remain standing and structurally sound. The seashells
    along the base must be present in their original positions. The sand around the castle should appear
    dry and undisturbed, with no signs of water erosion or flattening. The ocean background should remain
    calm.
  rationale: The video prompt explicitly states that the scene is calm and no wave is approaching. The
    camera action involves rotating 180 degrees away to the dunes and then returning to the sandcastle.
    Since no destructive force (like a wave or wind) is described and the duration of a simple pan is
    short, the physical state of the sandcastle must remain invariant. This task tests object permanence
    and the model's ability to maintain structural integrity during occlusion without hallucinating a
    destructive event based on context.
