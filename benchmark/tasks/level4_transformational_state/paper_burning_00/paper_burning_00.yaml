id: paper_burning_00
level: 4
category: transformational_state_change
tags: []
variant_of: paper_burning
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous take, no cuts or zoom. Camera remains stationary throughout. The frame is
    centered on the plate and burning paper. Lighting and objects remain consistent and realistic.
  camera_WM: Single continuous take, no cuts or zoom. Camera remains stationary throughout. The frame
    is centered on the plate and burning paper. Lighting and objects remain consistent and realistic.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table with a round, earth-toned ceramic
    plate. On the plate sits a roll of textured, off-white paper. The paper is currently burning; a small
    orange flame is visible on the lower right edge of the roll, and grey smoke is rising. The paper shows
    black charring around the burning area. In the background, a window with a white frame looks out onto
    a blurred outdoor scene.
  init2final_edit_prompt: Edit the given image to show the paper in a more advanced state of burning.
    Significantly increase the area of black char and ash on the paper roll, extending the damage further
    along the roll or deepening the existing burn. Reduce the visible surface area of unburnt white paper.
    The edges of the paper where the fire is active should appear more ragged, crumbled, or consumed.
    Maintain the presence of a flame and smoke, but allow for natural variation in their shape. Keep the
    ceramic plate, wooden table, and window background identical to the original.
  rationale: The video depicts a continuous shot of paper burning. The primary physical process is combustion,
    which is an irreversible transformation. Over the course of the video, the fire will consume more
    of the paper material, converting the white paper into black char and ash. The flame will persist
    or propagate, causing the charred area to expand and the unburnt area to shrink. The structural integrity
    of the paper will degrade, leading to ragged edges or crumbling ash. The camera is stationary, so
    the environment (table, plate, window) remains static.
  questions:
  - id: char_area_increase
    question: Is the area of blackened or charred paper larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the surface area of black/burnt material. It should have increased.
  - id: white_paper_decrease
    question: Is there less unburnt white paper visible compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The fire consumes the paper, so the white area must decrease.
  - id: structural_degradation
    question: Does the paper show increased signs of disintegration, such as more ragged edges or crumbling,
      compared to the start?
    answer_type: yes_no
    notes_for_judge: Look for structural damage caused by the fire progressing.
  - id: burn_progression
    question: Has the burn damage extended further along the paper roll than in the initial image?
    answer_type: yes_no
    notes_for_judge: The damage should spread from the initial burn site.
  - id: ash_accumulation
    question: Is there evidence of more ash or burnt residue on the paper or plate?
    answer_type: yes_no
    notes_for_judge: Burning produces ash; look for accumulation.
  - id: plate_consistency
    question: Is the ceramic plate in the same position and orientation as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The plate is a static object and should not move.
  - id: background_consistency
    question: Is the window frame and background visibility consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The camera is stationary; the background should not change.
