evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table with a round, earth-toned ceramic
    plate. On the plate sits a roll of textured, off-white paper. The paper is currently burning; a small
    orange flame is visible on the lower right edge of the roll, and grey smoke is rising. The paper shows
    black charring around the burning area. In the background, a window with a white frame looks out onto
    a blurred outdoor scene.
  init2final_edit_prompt: Edit the given image to show the paper in a more advanced state of burning.
    Significantly increase the area of black char and ash on the paper roll, extending the damage further
    along the roll or deepening the existing burn. Reduce the visible surface area of unburnt white paper.
    The edges of the paper where the fire is active should appear more ragged, crumbled, or consumed.
    Maintain the presence of a flame and smoke, but allow for natural variation in their shape. Keep the
    ceramic plate, wooden table, and window background identical to the original.
  rationale: The video depicts a continuous shot of paper burning. The primary physical process is combustion,
    which is an irreversible transformation. Over the course of the video, the fire will consume more
    of the paper material, converting the white paper into black char and ash. The flame will persist
    or propagate, causing the charred area to expand and the unburnt area to shrink. The structural integrity
    of the paper will degrade, leading to ragged edges or crumbling ash. The camera is stationary, so
    the environment (table, plate, window) remains static.
