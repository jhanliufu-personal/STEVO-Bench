id: egg_batter_merging_10
level: 4
category: structural_transformation
tags: []
variant_of: egg_batter_merging
variation_type: combined
variation_description: Whisk is motionless AND occlusion by zooming out.
changes:
  occlusion_method: Camera zooms out.
  dynamic_conditions: Whisk is stationary.
  expected_outcome_change: No change in state.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The whisk sits motionless in the bowl of eggs and flour. Nothing moves. The camera zooms out
    continuously until the bowl is too small to see any details, then zooms back in to the original framing.
    No cut, no scene change. STOP.
  camera_WM: The whisk sits motionless in the bowl of eggs and flour. Nothing moves. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A high-angle close-up shows a ceramic mixing bowl on a wooden table. Inside
    the bowl is a mound of white flour with a well in the center containing several raw eggs with distinct
    bright yellow yolks and clear whites. A metal balloon whisk rests in the bowl, with the wires partially
    submerged in the eggs and the handle extending towards the upper right. To the left of the bowl, there
    is some scattered flour on the wooden surface. To the right, a textured linen cloth is visible. In
    the background, a window frame is softly out of focus.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it appeared originally. The
    raw eggs in the center of the bowl must remain completely unmixed with distinct, intact yellow yolks.
    The white flour must remain a separate mound surrounding the eggs, with no signs of blending or batter
    formation. The metal whisk must be in the exact same resting position. The scattered flour on the
    table and the linen cloth must remain undisturbed. The image should look identical to the initial
    state.
  rationale: The video prompt explicitly states that 'Nothing moves' and the whisk is 'motionless'. The
    camera performs a zoom-out followed by a zoom-in back to the original framing. This is a stability
    and object permanence test (a negative control for transformation). Despite the presence of tools
    and ingredients implying potential action, the correct simulation must result in a final state that
    is visually identical to the initial state, with no mixing, blending, or structural changes to the
    eggs or flour.
