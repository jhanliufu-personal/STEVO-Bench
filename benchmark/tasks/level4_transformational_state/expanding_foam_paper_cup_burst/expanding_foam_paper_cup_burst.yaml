prompts:
  image_gen_prompt: A small paper cup sits on a protected surface. A can of expanding polyurethane foam is positioned above the cup with the nozzle inserted into the cup opening. A hand is ready to press the foam dispenser trigger.
  video_WM: The hand presses the trigger and expanding foam begins dispensing into the paper cup. Polyurethane foam undergoes rapid chemical expansion as it cures, increasing in volume by 30-50 times within seconds. The foam expands in all directions exerting outward pressure on any containing walls. The paper cup has limited structural strength and a tensile tear threshold. The foam continues expanding in the confined space. The camera rotates right at constant speed until the cup and foam can completely exit the view to the right. The camera continues rotating right for several seconds while the foam continues expanding off-screen. Then the camera rotates left smoothly at the same rate back to the original viewpoint, bringing the cup area back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses the trigger and expanding foam begins dispensing into the paper cup. Polyurethane foam undergoes rapid chemical expansion as it cures, increasing in volume by 30-50 times within seconds. The foam expands in all directions exerting outward pressure on any containing walls. The paper cup has limited structural strength and a tensile tear threshold. The foam continues expanding in the confined space during the occlusion period. STOP.
