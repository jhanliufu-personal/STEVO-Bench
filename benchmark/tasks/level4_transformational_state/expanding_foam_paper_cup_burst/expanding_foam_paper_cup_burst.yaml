id: expanding_foam_paper_cup_burst
level: 4
category: structural_transformation
transformation_type: expansion_induced_rupture
tags: []
prompts:
  image_gen_prompt: A small paper cup sits on a protected surface. A can of expanding polyurethane foam
    is positioned above the cup with the nozzle inserted into the cup opening. A hand is ready to press
    the foam dispenser trigger.
  video_WM: The hand presses the trigger and expanding foam begins dispensing into the paper cup. Polyurethane
    foam undergoes rapid chemical expansion as it cures, increasing in volume by 30-50 times within seconds.
    The foam expands in all directions exerting outward pressure on any containing walls. The paper cup
    has limited structural strength and a tensile tear threshold. The foam continues expanding in the
    confined space. The camera rotates right at constant speed until the cup and foam can completely exit
    the view to the right. The camera continues rotating right for several seconds while the foam continues
    expanding off-screen. Then the camera rotates left smoothly at the same rate back to the original
    viewpoint, bringing the cup area back into view. No zoom, no cut, no scene change. STOP.
  camera_WM: The hand presses the trigger and expanding foam begins dispensing into the paper cup. Polyurethane
    foam undergoes rapid chemical expansion as it cures, increasing in volume by 30-50 times within seconds.
    The foam expands in all directions exerting outward pressure on any containing walls. The paper cup
    has limited structural strength and a tensile tear threshold. The foam continues expanding in the
    confined space during the occlusion period. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A gloved hand holds a can of Great Stuff expanding polyurethane foam with its
    red nozzle tube inserted into a small, empty brown paper cup. The cup sits on a workbench covered
    with a clear plastic sheet, which has some existing dried foam patterns on it. In the background,
    there is a wooden structure, a window, a hammer, and clamps.
  init2final_edit_prompt: Edit the image to show the paper cup completely filled and overflowing with
    a large, bulbous mass of yellow expanding foam. The foam should rise significantly above the rim of
    the cup and spill over the sides onto the plastic sheet. The paper cup itself should appear structurally
    compromised, visibly bulging, distorted, or torn open due to the internal pressure of the expanded
    foam.
  rationale: 'The video prompt describes the dispensing of expanding foam into a weak paper cup, followed
    by a camera pan away and back. Expanding foam increases in volume by 30-50 times, creating significant
    internal pressure. While the camera is panned away (occlusion), the foam continues to expand and cure.
    Given the limited structural integrity of a paper cup, the foam will inevitably fill the cup, overflow,
    and likely deform or burst the cup walls. When the camera returns to the initial view, the scene must
    show the aftermath: a massive volume of hardened foam and a damaged or overflowing cup.'
