    the divider. The divider slides away to the right, revealing the scene again. No zoom, no cut, no
    scene change. STOP.
  camera_WM: The hand grips the lever from underneath and begins pulling upward. The mechanism is designed
    to retract blades when lifted. A large opaque office divider slides into the frame from the left,
    completely obscuring the hole punch and hand from view. The hand continues the lifting motion behind
