evaluation:
  init_frame_description: A clear, empty plastic water bottle with a blue cap stands upright on a wooden
    table. A human arm and hand extend from the left side of the frame, with fingers spread open, reaching
    towards the bottle but not yet touching it. The background shows a blurred kitchen setting with a
    window, counter, and appliances.
  init2final_edit_prompt: Edit the given image to show the hand tightly gripping the middle of the plastic
    bottle. The fingers should be wrapped around the bottle's waist. The bottle must appear crushed and
    deformed, with the clear plastic walls buckled, dented, and compressed inward under the force of the
    hand. The middle section of the bottle should be significantly narrower due to the squeeze.
  rationale: The video prompt describes a sequence where the hand grabs the bottle and applies squeezing
    force. Since PET plastic has low resistance, the expected result is significant structural deformation.
    The final frame should depict the hand actively gripping the bottle, causing the thin plastic walls
    to buckle and collapse inward (plastic deformation). The bottle will no longer be cylindrical in the
    middle but will be distorted by the grip.
