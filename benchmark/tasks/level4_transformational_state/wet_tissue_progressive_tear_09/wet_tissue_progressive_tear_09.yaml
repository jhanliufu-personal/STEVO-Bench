variant_of: wet_tissue_progressive_tear
variation_type: combined
variation_description: Aluminum foil (inelastic) combined with fog occlusion.
changes:
  occlusion_method: Dense fog fills the room.
  dynamic_conditions: Material is aluminum foil.
  expected_outcome_change: Foil rips or crinkles but does not dissolve/mush.
prompts:
  init_frame_edit_prompt: Edit the image to change the tissue into a sheet of silver aluminum foil.
  video_WM: The hands begin applying outward pulling tension to the sheet of aluminum foil. Metal foil
    has no elasticity; it is rigid until it reaches its failure point. It does not stretch like plastic
    or dissolve like wet paper. The hands continue applying steady pulling force. Suddenly, dense grey
    fog rolls into the room, obscuring the sink and hands completely. The fog swirls thickly for several
    seconds, hiding the state of the foil as the hands continue to pull. The fog then slowly lifts and
    clears, restoring visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin applying outward pulling tension to the sheet of aluminum foil. Metal foil
    has no elasticity; it is rigid until it reaches its failure point. It does not stretch like plastic
    or dissolve like wet paper. The hands continue applying steady pulling force. Suddenly, dense grey
    fog rolls into the room, obscuring the sink and hands completely. The fog swirls thickly for several
    seconds, hiding the state of the foil as the hands continue to pull. The fog then slowly lifts and
    clears. STOP.
