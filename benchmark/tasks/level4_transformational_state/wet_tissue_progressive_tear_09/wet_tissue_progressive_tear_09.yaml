id: wet_tissue_progressive_tear_09
level: 4
category: structural_transformation
tags: []
variant_of: wet_tissue_progressive_tear
variation_type: combined
variation_description: Aluminum foil (inelastic) combined with fog occlusion.
changes:
  occlusion_method: Dense fog fills the room.
  dynamic_conditions: Material is aluminum foil.
  expected_outcome_change: Foil rips or crinkles but does not dissolve/mush.
prompts:
  init_frame_edit_prompt: Edit the image to change the tissue into a sheet of silver aluminum foil.
  video_WM: The hands begin applying outward pulling tension to the sheet of aluminum foil. Metal foil
    has no elasticity; it is rigid until it reaches its failure point. It does not stretch like plastic
    or dissolve like wet paper. The hands continue applying steady pulling force. Suddenly, dense grey
    fog rolls into the room, obscuring the sink and hands completely. The fog swirls thickly for several
    seconds, hiding the state of the foil as the hands continue to pull. The fog then slowly lifts and
    clears, restoring visibility. No zoom, no cut, no scene change. STOP.
  camera_WM: The hands begin applying outward pulling tension to the sheet of aluminum foil. Metal foil
    has no elasticity; it is rigid until it reaches its failure point. It does not stretch like plastic
    or dissolve like wet paper. The hands continue applying steady pulling force. Suddenly, dense grey
    fog rolls into the room, obscuring the sink and hands completely. The fog swirls thickly for several
    seconds, hiding the state of the foil as the hands continue to pull. The fog then slowly lifts and
    clears. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A pair of hands holding a crumpled sheet of silver aluminum foil over a kitchen
    sink. The foil is heart-shaped with a water droplet hanging from the bottom tip. The background shows
    a blurred stainless steel faucet and sink basin.
  init2final_edit_prompt: Edit the given image to show the sheet of aluminum foil torn into two separate
    pieces. Create a jagged, vertical rip down the center of the foil, resulting in a visible gap of empty
    space between the left fragment held by the left hand and the right fragment held by the right hand.
    Ensure the torn edges look irregular and metallic. Keep the hands and background sink environment
    consistent with the original view.
  rationale: The prompt specifies that hands apply outward tension to aluminum foil, a material that is
    rigid and inelastic. Unlike rubber or plastic, foil does not stretch; it fails structurally by tearing
    when tension is applied. The action continues while the scene is obscured by fog, ensuring that by
    the time visibility is restored, the foil has undergone an irreversible transformation (tearing) due
    to the sustained pulling force. The final state must show the foil ripped apart or separated.
  questions:
  - id: tear_visible
    question: Is the sheet of aluminum foil torn?
    answer_type: yes_no
    notes_for_judge: Look for a rip, tear, or separation in the material.
  - id: structural_separation
    question: Is there a visible gap or separation between the parts of the foil?
    answer_type: yes_no
    notes_for_judge: The foil should no longer be a single continuous sheet.
  - id: jagged_edges
    question: Do the edges of the foil appear jagged or ripped?
    answer_type: yes_no
    notes_for_judge: Torn foil leaves irregular, sharp edges.
  - id: two_pieces
    question: Are the hands now holding separate fragments of the foil?
    answer_type: yes_no
    notes_for_judge: The single sheet should be divided into at least two distinct parts held by the hands.
  - id: integrity_loss
    question: Has the foil lost its original continuous structural form?
    answer_type: yes_no
    notes_for_judge: Compare to the initial intact heart shape.
  - id: background_consistency
    question: Is the faucet still visible in the background?
    answer_type: yes_no
    notes_for_judge: The background environment should remain unchanged.
  - id: hand_presence
    question: Are both hands still visible holding the foil pieces?
    answer_type: yes_no
    notes_for_judge: The hands should remain in the frame holding the remnants.
