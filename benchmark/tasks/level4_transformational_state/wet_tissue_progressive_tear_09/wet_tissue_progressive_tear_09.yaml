evaluation:
  init_frame_description: A pair of hands holding a crumpled sheet of silver aluminum foil over a kitchen
    sink. The foil is heart-shaped with a water droplet hanging from the bottom tip. The background shows
    a blurred stainless steel faucet and sink basin.
  init2final_edit_prompt: Edit the given image to show the sheet of aluminum foil torn into two separate
    pieces. Create a jagged, vertical rip down the center of the foil, resulting in a visible gap of empty
    space between the left fragment held by the left hand and the right fragment held by the right hand.
    Ensure the torn edges look irregular and metallic. Keep the hands and background sink environment
    consistent with the original view.
  rationale: The prompt specifies that hands apply outward tension to aluminum foil, a material that is
    rigid and inelastic. Unlike rubber or plastic, foil does not stretch; it fails structurally by tearing
    when tension is applied. The action continues while the scene is obscured by fog, ensuring that by
    the time visibility is restored, the foil has undergone an irreversible transformation (tearing) due
    to the sustained pulling force. The final state must show the foil ripped apart or separated.
