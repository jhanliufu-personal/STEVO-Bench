id: wax_sculpture_melt_collapse_06
level: 4
category: structural_transformation
tags: []
variant_of: wax_sculpture_melt_collapse
variation_type: dynamic_condition
variation_description: The bird is made of wood instead of wax.
changes:
  occlusion_method: null
  dynamic_conditions: Object material is wood (high melting point/flammable) instead of wax (low melting
    point).
  expected_outcome_change: The bird does not melt; it might darken or smoke but retains structural integrity.
prompts:
  init_frame_edit_prompt: Edit the image to change the material of the bird sculpture from translucent
    wax to carved oak wood with visible grain.
  video_WM: The heat gun is turned on high and aimed directly at the wooden bird sculpture. The camera
    rotates right until the sculpture completely exits the view, then rotates toward the left smoothly
    at the same rate until the metal plate is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The heat gun is turned on high and aimed directly at the wooden bird sculpture. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a carved bird sculpture with a wood-grain texture
    standing on a square, tarnished metal plate. A gloved hand holds a heat gun on the left, with the
    nozzle aimed directly at the bird. The background is a blurred workshop workbench with tools like
    a hammer and pliers visible.
  init2final_edit_prompt: Edit the given image to show the bird sculpture significantly melted and deformed.
    The sculpture should appear collapsed or sagging, with the original sharp details of the feathers,
    beak, and eyes smoothed out or distorted. The material should look like it has softened and pooled
    slightly at the base on the metal plate due to intense heat.
  rationale: The task ID 'wax_sculpture_melt_collapse' indicates that the object, while resembling wood,
    is made of a meltable material like wax. The heat gun is turned on high and aimed at the object while
    the camera pans away and back. During the occlusion, the intense heat will cause the sculpture to
    melt, lose its structural integrity, and collapse. The final frame should show the bird in a deformed,
    melted state, verifying the irreversible physical transformation.
  questions:
  - id: deformation_check
    question: Is the bird sculpture significantly deformed compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: The bird should look melted, sagging, or collapsed.
  - id: detail_loss
    question: Have the sharp details of the bird's carving (feathers, eyes) become smoothed or indistinct?
    answer_type: yes_no
    notes_for_judge: Melting should blur or erase the fine carved lines.
  - id: structural_collapse
    question: Does the sculpture appear shorter or to be sagging downwards?
    answer_type: yes_no
    notes_for_judge: Check for loss of height or structural slump.
  - id: material_pooling
    question: Is there evidence of the material spreading or pooling at the base of the sculpture?
    answer_type: yes_no
    notes_for_judge: Look for wax/material spreading on the metal plate.
  - id: beak_integrity
    question: Is the bird's beak less defined or misshapen compared to the start?
    answer_type: yes_no
    notes_for_judge: The beak is a thin part and should melt/deform early.
  - id: plate_presence
    question: Is the square metal plate still visible under the sculpture?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Are the workshop tools in the background (e.g., hammer handle) still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
