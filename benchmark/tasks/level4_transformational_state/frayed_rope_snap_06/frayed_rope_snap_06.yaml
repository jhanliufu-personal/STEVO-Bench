id: frayed_rope_snap_06
level: 4
category: structural_transformation
tags: []
variant_of: frayed_rope_snap
variation_type: dynamic_condition
variation_description: The winches hold the rope partially taut but stop moving.
changes:
  occlusion_method: null
  dynamic_conditions: Winches stop moving and hold position.
  expected_outcome_change: No change in state; rope remains frayed and taut but does not snap.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The winches stop rotating and hold the frayed rope in a fixed position. The tension remains
    constant but does not increase. The camera rotates right until the rope completely exits the view,
    then rotates toward the left smoothly at the same rate until the center point between the winches
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The winches stop rotating and hold the frayed rope in a fixed position. The tension remains
    constant but does not increase. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a thick, fibrous rope stretched horizontally under high tension
    between two rusty metal winches. The center of the rope is severely frayed, with many individual strands
    snapped and splayed outward, leaving a thinner, precarious section connecting the two sides. Dust
    particles are visible in the air around the rope. The background is blurred and out of focus.
  init2final_edit_prompt: Edit the given image to show the rope in the exact same state as the original.
    The rope must remain connected but severely frayed in the center, with loose strands splayed out.
    The rope should appear taut between the two winches. Do not snap the rope or repair the fraying; the
    structural integrity and visual appearance should be identical to the starting image.
  rationale: 'The video generation prompt explicitly states that the winches stop rotating and hold the
    rope in a fixed position with constant tension. Although the rope is frayed and looks ready to snap,
    the instructions dictate that the physical action pauses. The camera pans away (occlusion) and then
    returns to the original view. Therefore, the correct final state requires object permanence: the rope
    must remain in its specific frayed but connected configuration, neither snapping (which would violate
    the ''fixed position'' instruction) nor healing (which would violate physics).'
  questions:
  - id: rope_connected
    question: Is the rope still connected in the center?
    answer_type: yes_no
    notes_for_judge: The rope should not be snapped into two separate pieces.
  - id: fraying_visible
    question: Is the severe fraying in the center of the rope still visible?
    answer_type: yes_no
    notes_for_judge: The damage should not be healed; the messy strands should be present.
  - id: tension_maintained
    question: Does the rope appear to be held taut between the winches?
    answer_type: yes_no
    notes_for_judge: The rope should not be sagging.
  - id: strands_splayed
    question: Are the loose, broken strands of the rope still splayed out?
    answer_type: yes_no
    notes_for_judge: Check for the specific texture of the damage.
  - id: structural_integrity
    question: Is the rope structurally intact enough to connect the two winches?
    answer_type: yes_no
    notes_for_judge: It should be one continuous object, despite the damage.
  - id: winch_presence
    question: Are the rusty winches still visible on the sides?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
