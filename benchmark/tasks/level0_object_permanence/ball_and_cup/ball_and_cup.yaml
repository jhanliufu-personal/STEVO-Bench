prompts:
  image_gen_prompt: A bright red ball sits on a wooden table. An opaque blue plastic cup is held by a
    hand directly above the ball.
  video_WM: The hand lowers the blue cup until it completely covers the red ball, then slides the cup
    12 inches to the right. After the movement, the hand lifts the cup straight up 6 inches. The camera
    rotates right until the cup completely exits the view, then rotates toward the left smoothly at the
    same rate until the table surface where the cup was moved is back in the center of view. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The blue cup covers the red ball, moves to a new location, and is then lifted to reveal the
    contents. STOP.
