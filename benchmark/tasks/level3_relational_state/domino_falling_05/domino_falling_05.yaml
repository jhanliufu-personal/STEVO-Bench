id: domino_falling_05
level: 3
category: relational_state
tags: []
variant_of: domino_falling
variation_type: dynamic_condition
variation_description: The finger retracts without pushing, so no physics are initiated.
changes:
  occlusion_method: null
  dynamic_conditions: The finger pulls away instead of pushing.
  expected_outcome_change: No dominoes fall; the entire row remains standing.
prompts:
  init_frame_edit_prompt: Edit the image so the finger is hovering slightly above and pulling back from
    the first domino, clearly not touching it.
  video_WM: Single continuous shot, no cuts or zoom. Camera starts centered on the domino row. The finger
    hovers near the first domino but then retracts away without touching it. While the scene continues,
    the camera smoothly moves to the right at constant speed until the row exits the frame. The camera
    continues moving right across the table for several seconds. Then the camera moves left at the same
    speed back to the original framing. STOP.
  camera_WM: A finger hovers near the first domino but retracts without touching it. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A high-angle close-up of a wooden table with a long, winding row of wooden dominoes
    standing upright. A hand enters from the left, with an index finger pointing at the first domino,
    poised to push it. The background features a window, potted plants, and a stack of books.
  init2final_edit_prompt: Edit the given image to show the hand retracted away from the dominoes or removed
    from the frame entirely. Ensure that every single domino remains standing upright in its original
    position. The winding pattern of the dominoes must be preserved exactly as it was, with no dominoes
    fallen or tipped over. The lighting and background objects should remain unchanged.
  rationale: The prompt explicitly states that the finger retracts without touching the dominoes. Therefore,
    the causal trigger for the chain reaction never occurs. Despite the camera panning away and returning
    (creating occlusion), the physical state of the dominoes must remain static (standing) due to the
    lack of applied force. This tests the model's ability to handle counterfactuals to implied motion
    (not hallucinating a fall just because it looks like one is about to happen) and object permanence
    during occlusion.
  questions:
  - id: domino_state_1
    question: Is the first domino in the chain still standing upright?
    answer_type: yes_no
    notes_for_judge: The first domino is the one the finger was pointing at. It must be vertical.
  - id: domino_state_2
    question: Does the entire row of dominoes appear to be standing upright?
    answer_type: yes_no
    notes_for_judge: Check both foreground and background dominoes. None should be lying flat.
  - id: configuration_preservation
    question: Is the winding shape/path of the domino row identical to the initial frame?
    answer_type: yes_no
    notes_for_judge: The spatial arrangement relative to the table should not have changed.
  - id: hand_position
    question: Is the hand either removed from the frame or further away from the dominoes than in the
      initial image?
    answer_type: yes_no
    notes_for_judge: The prompt says the finger retracts.
  - id: no_fallen_pieces
    question: Is the table surface free of any fallen or flat-lying dominoes?
    answer_type: yes_no
    notes_for_judge: If any dominoes are flat on the table, the answer is NO.
  - id: background_consistency
    question: Are the books and plants in the background in the same position as the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
