tags: []
variant_of: silhouette_rotation_disk
variation_type: occlusion_method
variation_description: Occlusion changed to thick fog filling the room.
changes:
  occlusion_method: Thick fog fills the room obscuring the view, then dissipates
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The motorized base begins to rotate the flat circular disk slowly and steadily by exactly
    90 degrees around its vertical axis. The spotlight and screen remain fixed in place. Dense white fog
    rapidly fills the space, becoming thick enough to completely obscure the disk and the screen. The
    fog then gradually dissipates until the air is clear again. No zoom, no cut, no scene change. STOP.
  camera_WM: The motorized base begins to rotate the flat circular disk slowly and steadily by exactly
    90 degrees around its vertical axis. The spotlight and screen remain fixed in place. Dense white fog
    rapidly fills the space, becoming thick enough to completely obscure the disk and the screen. The
    fog then gradually dissipates until the air is clear again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A studio setup with a spotlight on the left, a white screen on the right, and
    a motorized turntable in the center holding a large, flat, circular metal disk. The disk is oriented
    edge-on to the camera and face-on to the light, appearing as a thick vertical strip. It casts a sharp,
    perfect circular shadow onto the white screen.
  init2final_edit_prompt: Edit the given image to show the central metal disk rotated 90 degrees so that
    its flat circular face is facing directly towards the camera, appearing as a large circle. Correspondingly,
    change the shadow on the white screen from a circle to a thin vertical line, representing the shadow
    of the disk's edge. Ensure the scene is clear and free of fog.
  rationale: The prompt specifies a 90-degree rotation of the disk. In the initial frame, the disk is
    edge-to-camera and face-to-light (casting a circular shadow). Rotating it 90 degrees makes it face-to-camera
    (appearing as a circle) and edge-to-light (casting a thin line shadow). The fog occlusion forces the
    model to calculate this geometric state change without showing the motion.
