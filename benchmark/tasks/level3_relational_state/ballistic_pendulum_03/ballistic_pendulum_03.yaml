evaluation:
  init_frame_description: A large, rectangular, weathered wooden block is suspended by two braided metal
    cables in an industrial room with pipes and a concrete ceiling. A shiny, cylindrical metal projectile
    is frozen in mid-air, positioned just to the left of the block, flying towards the block's left face.
    A small puff of dust or debris is visible at the point of imminent impact on the wood.
  init2final_edit_prompt: Edit the given image to show the wooden block displaced to the right and slightly
    upwards, as if swinging from the impact. The suspension cables should be angled to the right, following
    the block's movement. The metal projectile should be removed from the air, as it is now embedded inside
    the wood. A visible entry hole or impact damage should be present on the left face of the wooden block
    where the projectile struck.
  rationale: The video prompt describes a ballistic pendulum experiment. The projectile undergoes an inelastic
    collision with the wooden block, embedding itself. According to the conservation of momentum, the
    transfer of momentum from the projectile to the block causes the block to swing upwards and to the
    right. The fog occlusion allows time for the impact to occur and the swing to initiate. When the view
    clears, the projectile should be inside the block (invisible), and the block should be displaced from
    its equilibrium position in the direction of the projectile's flight.
