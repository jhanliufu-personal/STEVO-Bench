id: parallel_mirror_infinity
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: Two large mirrors are placed exactly parallel and facing each other. A person is holding
    a bright orange flashlight between them, creating a long corridor of diminishing orange lights in
    both directions.
  video_WM: The person begins to tilt the flashlight 45 degrees toward the ceiling. The mirrors remain
    perfectly parallel. The camera rotates right until the flashlight and person completely exit the view,
    then rotates toward the left smoothly at the same rate until the surface of one mirror is back in
    the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The flashlight held between the parallel mirrors is tilted upward. The recursive reflection
    corridor is maintained. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A person stands in the center of a dimly lit industrial room, holding a flashlight
    with a bright orange beam pointing directly forward toward the camera. Two large rectangular mirrors
    stand on the left and right sides of the person, angled to create an infinity mirror effect. The reflections
    in the mirrors show the person's side profile and the flashlight beam. The background consists of
    a concrete wall with pipes and conduits.
  init2final_edit_prompt: Edit the given image to show the person tilting the flashlight approximately
    45 degrees upward toward the ceiling. The beam of light should point diagonally upwards instead of
    forwards. Ensure that all visible reflections of the person in the mirrors on the left and right are
    updated to show the flashlight tilted upward at the same angle, maintaining consistent geometry between
    the real object and its reflections.
  rationale: The user prompt specifies that the person tilts the flashlight 45 degrees upward. The camera
    rotates away (pan right) and then returns (pan left) to view the mirrors. The primary state change
    is the orientation of the flashlight and the light beam. Crucially, because the scene involves mirrors,
    the reflections must be coupled to the real object; if the real flashlight tilts up, the reflections
    must also show the flashlight tilted up. The mirrors themselves are described as remaining parallel
    (stationary), so the environment geometry should not change.
