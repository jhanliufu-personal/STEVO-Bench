id: silhouette_rotation_disk_06
level: 3
category: relational_state
tags: []
variant_of: silhouette_rotation_disk
variation_type: dynamic_condition
variation_description: Object changed from circular disk to square plate. Final shadow (after 90 deg rotation)
  should be a thin vertical line.
changes:
  occlusion_method: null
  dynamic_conditions: Object changed to a square plate
  expected_outcome_change: Initial shadow is square; final shadow is a line (similar outcome to disk but
    different start)
prompts:
  init_frame_edit_prompt: Edit the image to replace the flat circular disk with a flat square metal plate
    of similar size and texture, positioned upright on the motorized base.
  video_WM: The motorized base begins to rotate the flat square plate slowly and steadily by exactly 90
    degrees around its vertical axis. The spotlight and screen remain fixed in place. The camera rotates
    right until the plate completely exits the view, then rotates toward the left smoothly at the same
    rate until the white screen is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The motorized base begins to rotate the flat square plate slowly and steadily by exactly
    90 degrees around its vertical axis. The spotlight and screen remain fixed in place. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A studio setting featuring a spotlight on a stand to the left, a motorized turntable
    with a vertical square metal plate in the center, and a large white diffusion screen to the right.
    The spotlight is illuminated, casting a beam from left to right. The square plate is oriented with
    its broad face perpendicular to the light beam, casting a large, dark, square shadow onto the white
    screen.
  init2final_edit_prompt: Edit the given image to show the square metal plate rotated 90 degrees around
    its vertical axis. The plate should now be oriented edge-on to the spotlight beam coming from the
    left. Consequently, the shadow cast on the white screen must change from a large square to a thin
    vertical line. Ensure the plate's appearance reflects this rotation, showing its edge or profile instead
    of its broad face.
  rationale: The video prompt specifies a 90-degree rotation of the plate. In the initial frame, the plate
    casts a full square shadow, indicating it is perpendicular to the light source. Rotating it 90 degrees
    will align the plate parallel to the light beam (edge-on). Physically, this must result in the shadow
    collapsing from a wide square into a thin vertical line. The camera movement serves as a transition,
    but the final state is determined by this geometric relationship between the light, the object, and
    the screen.
