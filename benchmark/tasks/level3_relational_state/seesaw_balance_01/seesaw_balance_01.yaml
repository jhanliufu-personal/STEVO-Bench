id: seesaw_balance_01
level: 3
category: relational_state
tags: []
variant_of: seesaw_balance
variation_type: occlusion_method
variation_description: A large maintenance truck drives past, blocking the view instead of camera rotation.
changes:
  occlusion_method: A large maintenance truck drives between the camera and the seesaw.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A person begins lifting the left sandbag and its seat off the ground. The motion continues.
    A large maintenance truck drives slowly from the right, passing between the camera and the seesaw,
    completely blocking the view of the playground. The truck continues driving until it has cleared the
    frame, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: A person begins lifting the left sandbag and its seat off the ground. The motion continues.
    A large maintenance truck drives slowly from the right, passing between the camera and the seesaw,
    completely blocking the view of the playground. The truck continues driving until it has cleared the
    frame, revealing the scene again. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A wooden playground seesaw situated on wood chips. The seesaw is tilted heavily
    to the left, with the left seat resting on or very close to the ground. A burlap sack labeled '20
    KG SAND' sits on the left seat. The right seat is elevated high in the air. In the background, there
    are trees and a climbing frame structure.
  init2final_edit_prompt: Edit the given image to show the seesaw tilted in the opposite direction. The
    left seat with the sandbag should be raised high in the air, significantly above its original position.
    The right seat should be lowered down, positioned close to the ground. Ensure the sandbag remains
    on the left seat.
  rationale: 'The video prompt describes a person lifting the heavy left side (the sandbag) and the motion
    continuing. Due to the mechanical coupling of the seesaw around its fulcrum, lifting the left side
    necessitates that the right side moves downwards. The occlusion by the truck hides the intermediate
    motion, but the final state must reflect the result of this action: the left side is now elevated
    and the right side is lowered, reversing or significantly altering the initial tilt.'
  questions:
  - id: seesaw_left_height
    question: Is the left seat (with the sandbag) higher above the ground than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The left side started on the ground; it should now be lifted.
  - id: seesaw_right_height
    question: Is the right seat lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Due to the pivot, if the left goes up, the right must go down.
  - id: seesaw_coupling
    question: Does the change in the right seat's position correspond mechanically to the lifting of the
      left seat (i.e., did it move down as the left moved up)?
    answer_type: yes_no
    notes_for_judge: Checks for coupled motion around the fulcrum.
  - id: sandbag_persistence
    question: Is the sandbag still visible on the left seat?
    answer_type: yes_no
    notes_for_judge: Object persistence check.
  - id: truck_cleared
    question: Is the view clear of the maintenance truck mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the truck clears the frame.
  - id: tilt_change
    question: Is the slope of the seesaw beam different from the initial downward-left slope?
    answer_type: yes_no
    notes_for_judge: It should be less steep to the left, horizontal, or tilted to the right.
