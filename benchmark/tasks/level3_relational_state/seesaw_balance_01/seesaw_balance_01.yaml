evaluation:
  init_frame_description: A wooden playground seesaw situated on wood chips. The seesaw is tilted heavily
    to the left, with the left seat resting on or very close to the ground. A burlap sack labeled '20
    KG SAND' sits on the left seat. The right seat is elevated high in the air. In the background, there
    are trees and a climbing frame structure.
  init2final_edit_prompt: Edit the given image to show the seesaw tilted in the opposite direction. The
    left seat with the sandbag should be raised high in the air, significantly above its original position.
    The right seat should be lowered down, positioned close to the ground. Ensure the sandbag remains
    on the left seat.
  rationale: 'The video prompt describes a person lifting the heavy left side (the sandbag) and the motion
    continuing. Due to the mechanical coupling of the seesaw around its fulcrum, lifting the left side
    necessitates that the right side moves downwards. The occlusion by the truck hides the intermediate
    motion, but the final state must reflect the result of this action: the left side is now elevated
    and the right side is lowered, reversing or significantly altering the initial tilt.'
