variation_description: Cart mass increased significantly (1kg -> 50kg), implying much slower acceleration.
changes:
  occlusion_method: null
  dynamic_conditions: Cart mass is now 50kg instead of 1kg.
  expected_outcome_change: The system accelerates much slower due to increased inertia; the cart moves
