id: compass_deflection_10
level: 3
category: relational_state
tags: []
variant_of: compass_deflection
variation_type: combined
variation_description: Magnet polarity reversed + occlusion by zoom out.
changes:
  occlusion_method: Camera zooms out.
  dynamic_conditions: Magnet polarity is reversed (Red end closer).
  expected_outcome_change: Needle deflects in the opposite direction.
prompts:
  init_frame_edit_prompt: Edit the image to swap the colors on the bar magnet so the red end is closest
    to the compass (swapping the red and blue sections).
  video_WM: A hand begins moving the reversed bar magnet steadily closer to the side of the compass housing.
    The magnet remains oriented in the same direction. The camera zooms out until the scene details are
    indistinguishable, then zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: A hand begins moving the reversed bar magnet steadily closer to the side of the compass housing.
    STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A close-up, high-angle shot of a brass compass open on a wooden table. The compass
    needle has a red tip pointing roughly northwest and a white tip pointing roughly southeast. To the
    right, a hand holds a rectangular bar magnet with the red end (North pole) facing the compass and
    the blue end (South pole) facing away. A wooden ruler lies in the foreground.
  init2final_edit_prompt: Edit the given image to show the hand and bar magnet positioned significantly
    closer to the compass housing, reducing the distance between them. Maintain the magnet's orientation
    with the red end facing the compass. Rotate the compass needle counter-clockwise so that it aligns
    horizontally, with the white tip pointing directly towards the red end of the magnet and the red tip
    pointing directly away to the left.
  rationale: The video prompt describes a hand moving a bar magnet closer to a compass while maintaining
    its orientation. In the initial frame, the magnet's red end (North pole) faces the compass, and the
    compass needle's red tip (North-seeking pole) is pointing somewhat away from it, indicating repulsion.
    As the magnet moves closer during the occluded zoom sequence, its magnetic field strength at the compass
    location increases, overpowering the Earth's background magnetic field. This increased force causes
    the compass needle to align more strictly with the magnet's field lines. Consequently, the needle
    rotates counter-clockwise to align its axis with the magnet, with the white (South) tip attracted
    to the red (North) end of the magnet.
  questions:
  - id: magnet_proximity
    question: Is the bar magnet positioned closer to the compass than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the distance between the magnet and the compass housing in both frames.
  - id: needle_alignment_white
    question: Is the white tip of the compass needle pointing more directly towards the magnet than in
      the initial frame?
    answer_type: yes_no
    notes_for_judge: The needle should rotate so the white tip points at the attracting red magnet pole.
  - id: needle_rotation_direction
    question: Has the compass needle rotated counter-clockwise relative to its starting position?
    answer_type: yes_no
    notes_for_judge: 'Initial: ~NW/SE diagonal. Final: Should be roughly horizontal (W/E).'
  - id: needle_repulsion_red
    question: Is the red tip of the compass needle pointing away from the red end of the magnet?
    answer_type: yes_no
    notes_for_judge: The red tip (North) should be repelled by the red magnet end (North).
  - id: magnet_orientation_conserved
    question: Is the red end of the magnet still the end facing the compass?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the magnet remains oriented in the same direction.
  - id: ruler_consistency
    question: Is the wooden ruler still present in the foreground?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
