id: seesaw_balance_05
level: 3
category: relational_state
tags: []
variant_of: seesaw_balance
variation_type: dynamic_condition
variation_description: The sandbag is labeled 500 KG. The person tries to lift it but fails.
changes:
  occlusion_method: null
  dynamic_conditions: Sandbag weight increased to 500 KG.
  expected_outcome_change: No movement; the seesaw stays in the initial position.
prompts:
  init_frame_edit_prompt: Edit the image to change the text on the sandbag to '500 KG' and make the bag
    appear larger and fuller.
  video_WM: A person attempts to lift the left sandbag and its seat with one hand, pulling upwards. The
    camera rotates right until the see-saw completely exits the view, then rotates toward the left smoothly
    at the same rate until the center pivot is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A person attempts to lift the left sandbag and its seat with one hand, pulling upwards. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A wooden playground seesaw on a bed of wood chips. The seesaw is tilted with
    the left side touching the ground and the right side elevated in the air. A large burlap sack labeled
    '500 KG SAND' sits on the left seat, weighing it down. The right seat is empty. In the background,
    there are trees and other playground structures.
  init2final_edit_prompt: Edit the given image to show the seesaw remaining in its original position,
    with the left side containing the 500kg sandbag resting on the ground and the right side elevated
    in the air, maintaining the same tilt angle as the initial view.
  rationale: The sandbag is labeled as 500 kg, which is far too heavy for a human to lift with one hand.
    Consequently, the attempt to lift the seat fails to move the object, and the physical state of the
    seesaw remains unchanged (left side down, right side up). The camera movement pans away and then returns
    to center the pivot, restoring the original viewpoint. Therefore, the final frame should look physically
    identical to the initial frame regarding the seesaw's configuration.
  questions:
  - id: seesaw_orientation_1
    question: Is the left side of the seesaw still touching or resting near the ground?
    answer_type: yes_no
    notes_for_judge: The weight is too heavy to be lifted by the described action, so the left side should
      remain down.
  - id: seesaw_orientation_2
    question: Is the right side of the seesaw elevated higher than the left side?
    answer_type: yes_no
    notes_for_judge: The seesaw should maintain its initial tilt with the empty side up.
  - id: sandbag_position
    question: Is the 500kg sandbag positioned lower than the central pivot point?
    answer_type: yes_no
    notes_for_judge: The bag should remain on the ground.
  - id: state_conservation
    question: Does the seesaw appear to have remained stationary despite the lifting attempt?
    answer_type: yes_no
    notes_for_judge: 500kg cannot be lifted by one hand; the state should be conserved.
  - id: relative_height
    question: Is the empty seat on the right vertically higher than the sandbag on the left?
    answer_type: yes_no
    notes_for_judge: Checks for correct relative positioning of the coupled ends.
  - id: tilt_consistency
    question: Is the angle of the seesaw consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The angle should not change.
