id: concave_mirror_inversion_10
level: 3
category: relational_state
tags: []
variant_of: concave_mirror_inversion
variation_type: combined
variation_description: Candle moving away condition combined with zoom occlusion.
changes:
  occlusion_method: Camera zooms out until scene is unclear instead of rotation.
  dynamic_conditions: Candle moves away from the bowl instead of closer.
  expected_outcome_change: Reflection remains inverted and gets smaller.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The candle is moved steadily backward, away from the silver bowl. The flame remains lit. The
    camera zooms out rapidly until the bowl and candle are indistinguishable dots in the distance, then
    zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: The candle is moved steadily backward, away from the silver bowl. The flame remains lit.
    STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up view of a large silver bowl in the foreground with a reflective concave
    interior. Inside the bowl, a reflection of a candle flame is visible. In the blurred background, a
    wooden room is visible with a table and a real lit candle standing on it to the right. Windows and
    wooden furniture are present in the background.
  init2final_edit_prompt: Edit the given image to move the real candle in the background significantly
    further away from the foreground bowl, making it appear smaller and deeper in the room. Correspondingly,
    make the reflection of the candle flame inside the silver bowl smaller to consistent with the increased
    distance of the object. Ensure the flame remains lit in both the object and reflection. Keep the bowl,
    table, and room environment in the same position and framing as the original.
  rationale: 'The video describes a continuous action where the candle moves away from the mirror while
    the camera performs a zoom-out and zoom-in maneuver. The camera returns to the original framing, so
    the static environment (bowl, table, room) should appear unchanged in position. However, the state
    of the candle has changed: it is now further away. According to the optics of concave mirrors, as
    an object moves further away (beyond the center of curvature), its inverted reflection becomes smaller.
    The final frame must depict this coupled change: a more distant real candle and a smaller reflection.'
