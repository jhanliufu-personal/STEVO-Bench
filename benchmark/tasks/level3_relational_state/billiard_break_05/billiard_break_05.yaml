id: billiard_break_05
level: 3
category: relational_state
tags: []
variant_of: billiard_break
variation_type: dynamic_condition
variation_description: A heavy obstacle is placed between the cue ball and the rack.
changes:
  occlusion_method: null
  dynamic_conditions: A cinder block obstructs the path of the cue ball.
  expected_outcome_change: The cue ball hits the block and stops; the rack remains undisturbed.
prompts:
  init_frame_edit_prompt: Edit the image to place a large, heavy cinder block on the table, positioned
    directly between the cue ball and the rack of balls.
  video_WM: The white cue ball is struck with high force toward the rack, but its path is obstructed by
    a heavy cinder block sitting on the table. The camera rotates right until the table completely exits
    the view, then rotates toward the left smoothly at the same rate until the center of the table is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The white cue ball is struck with high force toward the rack, but its path is obstructed
    by a heavy cinder block sitting on the table. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A pool table with green felt. In the foreground, a rack of colored billiard
    balls is arranged in a tight triangle. In the middle of the table, a large grey cinder block is placed
    upright. Behind the cinder block, a white cue ball is visible. The background features a fireplace,
    wood paneling, and pool cues on the wall.
  init2final_edit_prompt: Edit the given image to show the white cue ball moved to a new position on the
    felt, such as to the side or rebounded slightly back, indicating it struck the cinder block. Keep
    the triangular rack of colored balls exactly as it is in the original image, undisturbed and tightly
    packed. Keep the cinder block in its original location and orientation. Maintain the background and
    lighting exactly as they are.
  rationale: The video prompt describes the cue ball being struck towards the rack but obstructed by a
    heavy cinder block. Due to the significant mass difference between the cue ball and the cinder block,
    the block will act as a shield. The cue ball will bounce off the block, but the block will not move
    enough to hit the rack, nor will the ball pass through it. Therefore, the primary relational state
    to preserve is that the rack of balls remains completely undisturbed while the cue ball changes position.
