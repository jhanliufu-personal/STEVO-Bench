id: balloon_suction_jar_01
level: 3
category: relational_state
relational_type: pneumatic_coupling
prompts:
  image_gen_prompt: "An inflated red balloon is tied and placed inside a large glass bell jar. The jar is connected to a powerful vacuum pump that is currently off."
  video_WM: "The technician activates the vacuum pump, which begins to evacuate the air from the bell jar at a constant rate. The jar remains sealed. The camera rotates right until the vacuum pump completely exits the view, then rotates toward the left smoothly at the same rate until the balloon inside the jar is back in the center of view. No zoom, no cut, no scene change. STOP."
  camera_WM: "The vacuum pump is active and evacuating air from the sealed bell jar containing the balloon. The suction is steady. STOP."
camera_control:
  HY-WorldPlay: "s-3, right-30, left-30"