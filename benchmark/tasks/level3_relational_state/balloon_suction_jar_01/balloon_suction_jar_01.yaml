id: balloon_suction_jar_01
level: 3
category: relational_state
tags: []
variant_of: balloon_suction_jar
variation_type: occlusion_method
variation_description: Occlusion by a large object blocking the view instead of camera rotation.
changes:
  occlusion_method: A large opaque safety screen moves in front of the camera.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The technician activates the vacuum pump, which begins to evacuate the air from the bell jar
    at a constant rate. The jar remains sealed. A large opaque safety screen slides into the foreground,
    completely blocking the view of the apparatus. After a duration equal to the evacuation process, the
    screen slides away. No zoom, no cut, no scene change. STOP.
  camera_WM: The technician activates the vacuum pump, which begins to evacuate the air from the bell
    jar at a constant rate. The jar remains sealed. A large opaque safety screen slides into the foreground,
    completely blocking the view of the apparatus. After a duration equal to the evacuation process, the
    screen slides away. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A laboratory setup on a wooden table featuring a clear glass bell jar containing
    a red inflated balloon tied to a string. The bell jar is connected via a beige hose to a vacuum pump
    with a pressure gauge and cooling fins on the right. The background is a blurred white wall.
  init2final_edit_prompt: Edit the given image to show the red balloon inside the bell jar significantly
    expanded in size. The balloon should appear much larger, occupying a greater volume of the jar's interior,
    with its surface looking more stretched and taut. Keep the bell jar, vacuum pump, hose, and table
    exactly as they are.
  rationale: The vacuum pump evacuates air from the bell jar, lowering the pressure surrounding the balloon.
    As the external pressure decreases, the air trapped inside the balloon expands (Boyle's Law), causing
    the balloon to increase in volume and stretch. The final frame reveals this expanded state after the
    occlusion is removed.
