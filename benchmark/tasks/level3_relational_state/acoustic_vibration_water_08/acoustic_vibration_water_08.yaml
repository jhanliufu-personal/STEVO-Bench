id: acoustic_vibration_water_08
level: 3
category: relational_state
tags: []
variant_of: acoustic_vibration_water
variation_type: combined
variation_description: Combined blocking occlusion with direct physical contact between fork and water.
changes:
  occlusion_method: Opaque wooden board blocks view
  dynamic_conditions: Tuning fork tines submerged in water
  expected_outcome_change: Violent splashing or spraying
prompts:
  init_frame_edit_prompt: Edit the image so the tuning fork is positioned lower, with the tips of the
    tines submerged in the water.
  video_WM: A rubber mallet strikes the tuning fork while its tines are submerged in the water. A large
    wooden board moves into the frame, completely obscuring the bowl and fork from view. The board then
    moves away, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: A rubber mallet strikes the tuning fork while its tines are submerged in the water. A large
    wooden board moves into the frame, completely obscuring the bowl and fork from view. The board then
    moves away, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot showing a metal tuning fork clamped to a rough wooden
    block on the left. The fork's two tines extend horizontally over a clear glass bowl filled with water,
    positioned on the right. The tines are positioned just above or at the surface of the water. A rubber
    mallet with a wooden handle lies on the dark table surface in the foreground. In the background, a
    window and a radiator are visible.
  init2final_edit_prompt: Edit the given image to show the aftermath of the tuning fork vibrating in the
    water. Add scattered water droplets and small splashes on the dark table surface surrounding the glass
    bowl. Render water droplets clinging to the metal tines of the tuning fork. Add ripples to the water
    surface in the bowl to indicate disturbance. Maintain the position of the wooden block, clamp, and
    bowl.
  rationale: 'The video prompt describes a physical interaction where a tuning fork is struck and vibrates
    while in contact with water. Physics dictates that the mechanical energy of the vibrating fork is
    transferred to the water, causing it to spray and splash (a phenomenon known as a tuning fork splash).
    The occlusion by the board hides the duration of this event. When the scene is revealed, the relational
    state must reflect this interaction: the water should be disturbed (ripples) and displaced (droplets
    on the table and fork), demonstrating the coupling between the vibrating tines and the fluid.'
  questions:
  - id: q1_primary_splash_table
    question: Are there water droplets or splashes visible on the table surface that were not present
      initially?
    answer_type: yes_no
    notes_for_judge: Look for new water spots on the dark surface around the bowl.
  - id: q2_primary_wet_tines
    question: Do the tines of the tuning fork appear wet or have droplets clinging to them?
    answer_type: yes_no
    notes_for_judge: The tines should show evidence of contact with splashing water.
  - id: q3_primary_ripples
    question: Is the surface of the water in the bowl disturbed or rippled?
    answer_type: yes_no
    notes_for_judge: Compare to the smooth surface in the initial frame.
  - id: q4_primary_coupling
    question: Does the scene show evidence that the water reacted to the tuning fork?
    answer_type: yes_no
    notes_for_judge: 'This is a relational check: did the fork''s state (vibration) affect the water''s
      state (displacement)?'
  - id: q5_secondary_invariant_clamp
    question: Is the C-clamp still holding the tuning fork to the wooden block?
    answer_type: yes_no
    notes_for_judge: The mechanism holding the fork should remain stable.
  - id: q6_secondary_invariant_bowl
    question: Is the glass bowl still positioned under the tuning fork tines?
    answer_type: yes_no
    notes_for_judge: The bowl should not have moved significantly.
  - id: q7_secondary_conservation
    question: Does the bowl still contain the majority of the water?
    answer_type: yes_no
    notes_for_judge: While some splashes out, the bowl should not be empty.
