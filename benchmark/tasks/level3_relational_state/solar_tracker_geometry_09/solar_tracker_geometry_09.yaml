id: solar_tracker_geometry_09
level: 3
category: relational_state
tags: []
variant_of: solar_tracker_geometry
variation_type: combined
variation_description: Broken tracker (static) occluded by a truck.
changes:
  occlusion_method: 'Object blocking: Truck.'
  dynamic_conditions: 'Mechanism failure: Disconnected power.'
  expected_outcome_change: No change in panel angle.
prompts:
  init_frame_edit_prompt: Edit the image to show a dangling, severed power cable hanging from the motor
    box.
  video_WM: The power cable to the tracker is severed and sparking; the motor is dead and the panel is
    completely stationary. A maintenance truck drives into the frame, parking directly in front of the
    camera and blocking the view of the solar array. A door slams (audio implied), then the truck drives
    away to the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The power cable to the tracker is severed and sparking; the motor is dead and the panel is
    completely stationary. A maintenance truck drives into the frame, parking directly in front of the
    camera and blocking the view of the solar array. A door slams (audio implied), then the truck drives
    away to the left, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, rectangular solar panel array mounted on a heavy metal framework with
    a prominent gear mechanism, situated in a sandy desert landscape during sunset. A thick black power
    cable connects from the ground to the machinery at the base of the tracker.
  init2final_edit_prompt: Edit the given image to show the thick black power cable at the base of the
    structure severed and physically disconnected, with bright electrical sparks emitting from the broken
    ends. Ensure the solar panel array, the gear mechanism, and the entire metal framework remain in the
    exact same position, tilt, and orientation as the original image. The scene must be clear of any vehicles
    or obstructions.
  rationale: The prompt explicitly states that the motor is dead and the panel is completely stationary
    due to the severed power cable. Although a truck enters and leaves during the sequence (causing occlusion),
    the physical state of the solar tracker's orientation must remain invariant because it has lost the
    power required to move. The final state must reflect the damage (severed cable, sparks) and the absence
    of the truck, while strictly conserving the geometric pose of the tracker relative to the environment.
  questions:
  - id: cable_severed
    question: Is the thick black power cable at the base visibly severed or disconnected?
    answer_type: yes_no
    notes_for_judge: The cable connecting the ground to the machine should be broken.
  - id: sparks_visible
    question: Are there electrical sparks visible near the broken cable ends?
    answer_type: yes_no
    notes_for_judge: The prompt specifies the cable is sparking.
  - id: panel_orientation_invariant
    question: Is the tilt and orientation of the solar panel unchanged relative to the horizon compared
      to the initial frame?
    answer_type: yes_no
    notes_for_judge: The panel must be stationary; it should not have moved.
  - id: gear_position_conserved
    question: Is the rotational position of the large gear mechanism conserved from the initial frame?
    answer_type: yes_no
    notes_for_judge: Since the motor is dead, the gears should not have turned.
  - id: truck_absence
    question: Is the view clear of the maintenance truck mentioned in the prompt?
    answer_type: yes_no
    notes_for_judge: The truck drives away, revealing the scene.
  - id: structure_ground_relation
    question: Is the relative position of the metal framework's feet on the ground consistent with the
      initial frame?
    answer_type: yes_no
    notes_for_judge: The structure should not have shifted location.
