evaluation:
  init_frame_description: A large, rectangular solar panel array mounted on a heavy metal framework with
    a prominent gear mechanism, situated in a sandy desert landscape during sunset. A thick black power
    cable connects from the ground to the machinery at the base of the tracker.
  init2final_edit_prompt: Edit the given image to show the thick black power cable at the base of the
    structure severed and physically disconnected, with bright electrical sparks emitting from the broken
    ends. Ensure the solar panel array, the gear mechanism, and the entire metal framework remain in the
    exact same position, tilt, and orientation as the original image. The scene must be clear of any vehicles
    or obstructions.
  rationale: The prompt explicitly states that the motor is dead and the panel is completely stationary
    due to the severed power cable. Although a truck enters and leaves during the sequence (causing occlusion),
    the physical state of the solar tracker's orientation must remain invariant because it has lost the
    power required to move. The final state must reflect the damage (severed cable, sparks) and the absence
    of the truck, while strictly conserving the geometric pose of the tracker relative to the environment.
