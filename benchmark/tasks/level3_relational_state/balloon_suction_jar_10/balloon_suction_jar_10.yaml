id: balloon_suction_jar_10
level: 3
category: relational_state
tags: []
variant_of: balloon_suction_jar
variation_type: combined
variation_description: Camera moves physically away, combined with a very weak/slow pump setting.
changes:
  occlusion_method: Camera physically moves backward.
  dynamic_conditions: Pump set to 'Low' power mode.
  expected_outcome_change: Balloon expands much slower/less than original.
prompts:
  init_frame_edit_prompt: Edit the image to show a dial on the pump turned to a setting labeled 'LOW POWER'.
  video_WM: The technician sets the vacuum pump to its lowest power setting and activates it. The evacuation
    of air begins but at a very slow, trickle pace. The camera moves backward, retreating from the table
    until the apparatus is distant and hard to see details. The camera then moves forward, returning to
    the original close-up position. No cut, no scene change. STOP.
  camera_WM: The technician sets the vacuum pump to its lowest power setting and activates it. The evacuation
    of air begins but at a very slow, trickle pace. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A laboratory setup on a wooden table featuring a clear glass bell jar containing
    a red balloon tied to a string. To the right, a vacuum pump with a pressure gauge is connected to
    the bell jar via a beige hose. The balloon is currently at a normal, resting size.
  init2final_edit_prompt: Edit the given image to show the red balloon inside the glass bell jar significantly
    expanded in size. The balloon should appear larger, more inflated, and occupy a greater volume of
    the jar's interior compared to the original image. Maintain the original camera angle, the position
    of the bell jar, the connecting hose, and the vacuum pump exactly as they are.
  rationale: The vacuum pump removes air from the bell jar, lowering the pressure surrounding the balloon.
    As the external pressure decreases, the air trapped inside the balloon expands (Boyle's Law), causing
    the balloon to grow in size. The time elapsed during the camera's retreat and return allows this slow
    process to result in a visibly larger balloon by the final frame.
  questions:
  - id: balloon_size_increase
    question: Is the red balloon larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the diameter/volume of the balloon in the final frame to the initial frame.
  - id: balloon_volume_fraction
    question: Does the balloon occupy a greater portion of the bell jar's interior volume than before?
    answer_type: yes_no
    notes_for_judge: The balloon should take up more space inside the glass dome.
  - id: balloon_inflation_state
    question: Does the balloon appear more inflated or taut compared to the initial image?
    answer_type: yes_no
    notes_for_judge: Look for signs of expansion.
  - id: balloon_containment
    question: Is the red balloon still contained within the glass bell jar?
    answer_type: yes_no
    notes_for_judge: The balloon should not have clipped through the glass.
  - id: pump_presence
    question: Is the vacuum pump still visible on the right side of the image?
    answer_type: yes_no
    notes_for_judge: Check for the machinery on the right.
  - id: hose_connection
    question: Is the hose connecting the pump to the bell jar still visible?
    answer_type: yes_no
    notes_for_judge: The connection should remain intact.
  - id: table_consistency
    question: Is the wooden table surface visible beneath the apparatus?
    answer_type: yes_no
    notes_for_judge: Context consistency check.
  - id: balloon_color_consistency
    question: Is the balloon still red?
    answer_type: yes_no
    notes_for_judge: Object identity check.
