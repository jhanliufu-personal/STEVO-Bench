prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous shot, no cuts, no zoom, no scene transitions. Camera remains stationary
    centered on the hand holding the pitcher, the pouring water stream, and the empty glass. The hand
    continues holding the pitcher in the same tilted position so that water keeps pouring continuously.
    A large, opaque menu board slides into the frame from the right, completely blocking the view of the
    pitcher and glass. The board remains in place for several seconds. Then the board slides back to the
    right, revealing the scene again.
  camera_WM: Single continuous shot, no cuts, no zoom, no scene transitions. Camera remains stationary
    centered on the hand holding the pitcher, the pouring water stream, and the empty glass. The hand
    continues holding the pitcher in the same tilted position so that water keeps pouring continuously.
    A large, opaque menu board slides into the frame from the right, completely blocking the view of the
