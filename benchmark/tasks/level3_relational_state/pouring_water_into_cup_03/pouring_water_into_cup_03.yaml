id: pouring_water_into_cup_03
level: 3
category: relational_state
tags: []
variant_of: pouring_water_into_cup
variation_type: occlusion_method
variation_description: Occlusion by dense steam filling the frame.
changes:
  occlusion_method: Thick steam/fog fills the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous shot, no cuts, no zoom, no scene transitions. Camera remains stationary
    centered on the hand holding the pitcher, the pouring water stream, and the empty glass. The hand
    continues holding the pitcher in the same tilted position so that water keeps pouring continuously.
    Suddenly, thick white steam rapidly fills the frame, completely obscuring the pitcher, glass, and
    table. The steam swirls for several seconds, hiding the pouring action. Then the steam dissipates,
    clearing the view to reveal the scene again.
  camera_WM: Single continuous shot, no cuts, no zoom, no scene transitions. Camera remains stationary
    centered on the hand holding the pitcher, the pouring water stream, and the empty glass. The hand
    continues holding the pitcher in the same tilted position so that water keeps pouring continuously.
    Suddenly, thick white steam rapidly fills the frame, completely obscuring the pitcher, glass, and
    table. The steam swirls for several seconds, hiding the pouring action. Then the steam dissipates,
    clearing the view to reveal the scene again.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a glass pitcher held by a hand, tilted to pour water into
    a clear glass sitting on a wooden table. The pitcher is about half-full, and a steady stream of water
    is flowing into the glass. The glass currently contains a small amount of water at the bottom. The
    background shows a blurred window with natural light.
  init2final_edit_prompt: Edit the given image to show the glass filled with a significantly higher level
    of water, appearing nearly full. Correspondingly reduce the water level inside the pitcher to reflect
    the volume transferred to the glass. Maintain the stream of water pouring from the pitcher into the
    glass. Keep the wooden table, the hand holding the pitcher, and the background window unchanged.
  rationale: 'The video prompt describes a continuous pouring action that persists while the scene is
    occluded by steam. Because the action continues during the occlusion, the physical state of the system
    must evolve according to conservation laws. When the steam clears, the water that left the pitcher
    must be present in the glass. Therefore, the final frame must show a coupled state change: the glass
    level must be higher and the pitcher level must be lower.'
  questions:
  - id: glass_level_increase
    question: Is the water level in the glass significantly higher than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the water level in the glass between the first and last frame. It should
      be much higher.
  - id: pitcher_level_decrease
    question: Is the water level inside the pitcher lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the water line in the source pitcher has gone down.
  - id: coupled_transfer
    question: Does the scene show a transfer of water where the glass is fuller and the pitcher is emptier?
    answer_type: yes_no
    notes_for_judge: This tests the coupled relationship; both changes should be present.
  - id: glass_fuller_relative
    question: Is the glass fuller relative to its initial state?
    answer_type: yes_no
    notes_for_judge: Directional check on the destination container.
  - id: pitcher_emptier_relative
    question: Is the pitcher emptier relative to its initial state?
    answer_type: yes_no
    notes_for_judge: Directional check on the source container.
  - id: stream_presence
    question: Is the stream of water connecting the pitcher and the glass still visible?
    answer_type: yes_no
    notes_for_judge: The prompt implies continuous pouring, so the stream should persist.
  - id: table_consistency
    question: Is the wooden table texture consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency
    question: Is the blurred window background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
