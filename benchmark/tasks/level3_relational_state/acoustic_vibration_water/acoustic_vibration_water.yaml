id: acoustic_vibration_water
level: 3
category: relational_state
relational_type: resonant_coupling
prompts:
  image_gen_prompt: A large metal tuning fork is mounted to a wooden block. Next to it sits a glass bowl
    filled to the brim with clear water, the surface of which is perfectly still.
  video_WM: A rubber mallet strikes the tuning fork, causing it to vibrate with a loud, continuous hum.
    The fork is positioned inches away from the glass. The camera rotates right until the fork completely
    exits the view, then rotates toward the left smoothly at the same rate until the surface of the water
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The tuning fork is struck and continues to vibrate near the glass of water. The resonance
    is active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a physics experiment setup on a dark table. On the left,
    a large, rusty metal tuning fork is clamped horizontally to a wooden block. The fork's tines extend
    towards the right. On the right, a clear glass bowl filled with water sits on the table. The tips
    of the tuning fork are positioned close to the rim of the glass bowl but are not touching it. The
    water surface is calm and reflective. The background shows a blurred window with daylight coming through.
  init2final_edit_prompt: Edit the given image to show the tuning fork vibrating and the water reacting.
    Apply a strong motion blur effect to the tines of the tuning fork to simulate rapid oscillation. Add
    a pattern of ripples and surface disturbance to the water in the glass bowl, indicating mechanical
    vibration transferred through the table. Ensure the tuning fork does not touch the bowl or the water;
    maintain the gap between them. The water surface should look disturbed, not calm.
  rationale: The prompt describes a mallet striking the tuning fork, which initiates a state of vibration.
    This vibration persists as a 'loud, continuous hum'. Although the fork does not touch the water, the
    mechanical energy is typically transferred through the clamp and table (coupling), causing the water
    surface to ripple (cymatics). The camera rotates away and then returns to the original view, meaning
    the final frame should show the ongoing vibration (blurred tines) and the resulting disturbance on
    the water surface, while maintaining the spatial relationship (gap) between the objects.
