id: compass_deflection_09
level: 3
category: relational_state
tags: []
variant_of: compass_deflection
variation_type: combined
variation_description: Magnet stationary + occlusion by fog.
changes:
  occlusion_method: Thick fog obscures view.
  dynamic_conditions: Magnet is stationary.
  expected_outcome_change: Needle remains static.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand holds the bar magnet completely stationary near the side of the compass housing. Dense
    white fog rapidly fills the area, completely obscuring the compass and magnet from view. The fog then
    clears away. No zoom, no cut, no scene change. STOP.
  camera_WM: A hand holds the bar magnet completely stationary near the side of the compass housing. Dense
    white fog rapidly fills the area, completely obscuring the compass and magnet from view. The fog then
    clears away. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a wooden table. On the left, a brass compass
    is open, revealing its dial and needle. The needle is deflected, with the silver/white tip pointing
    towards the bottom-right and the red tip pointing towards the top-left. On the right, a hand holds
    a rectangular bar magnet horizontally. The magnet has a red pole (left, facing the compass) and a
    blue pole (right). A wooden ruler lies horizontally in the foreground.
  init2final_edit_prompt: 'Edit the given image to show the exact same scene with no changes to the object
    positions. The hand continues to hold the red and blue bar magnet stationary on the right, with the
    red pole facing the compass. The brass compass on the left remains open with its needle maintained
    in the same deflected orientation: the silver tip pointing towards the magnet and the red tip pointing
    away. The wooden ruler and table texture remain identical.'
  rationale: The video prompt specifies that the magnet is held 'completely stationary' throughout the
    duration of the video. The fog serves as a temporary visual occlusion but does not interact physically
    with the objects. Since the position of the magnet (the source of the magnetic field) does not change,
    the magnetic force acting on the compass needle remains constant. Therefore, the compass needle must
    maintain its initial deflection angle and orientation. The final state should be visually identical
    to the initial state, preserving the coupled relationship between the magnet's pole and the needle's
    alignment.
  questions:
  - id: magnet_presence
    question: Is the bar magnet visible on the right side of the image?
    answer_type: yes_no
    notes_for_judge: Tests object permanence of the magnet.
  - id: magnet_orientation
    question: Is the red pole of the magnet positioned closer to the compass than the blue pole?
    answer_type: yes_no
    notes_for_judge: Tests state persistence of the magnet's orientation.
  - id: needle_silver_direction
    question: Is the silver/white tip of the compass needle pointing generally towards the red pole of
      the magnet?
    answer_type: yes_no
    notes_for_judge: Tests the physical relationship (magnetic attraction) between the South-seeking needle
      tip and the North (red) magnet pole.
  - id: needle_red_direction
    question: Is the red tip of the compass needle pointing generally away from the red pole of the magnet?
    answer_type: yes_no
    notes_for_judge: Tests the physical relationship (magnetic repulsion) between the North-seeking needle
      tip and the North (red) magnet pole.
  - id: needle_stability
    question: Does the compass needle appear to be in the same orientation as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Tests that the coupled state remained constant as the driver (magnet) was stationary.
  - id: ruler_presence
    question: Is the wooden ruler still visible in the foreground?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for static objects.
