id: mirror_reflection_00
level: 3
category: relational_state
tags: []
variant_of: mirror_reflection
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand pushes the red ball directly toward the mirror at a steady speed. The ball remains
    on the surface of the table. Camera remains stationary throughout. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A hand pushes the red ball directly toward the mirror at a steady speed. The ball remains
    on the surface of the table. Camera remains stationary throughout. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A red billiard ball with the number '3' inside a white circle rests on a wooden
    surface in the foreground. Behind it stands a framed mirror. The mirror reflects the red ball (showing
    its side/back without the number clearly visible) and a room background featuring a green pool table.
    The camera angle is slightly elevated, looking down at the ball and the mirror.
  init2final_edit_prompt: Edit the given image to show the red billiard ball positioned significantly
    closer to the wooden frame of the mirror, having been pushed forward. Correspondingly, position the
    reflection of the red ball inside the mirror closer to the bottom edge of the glass, so that the real
    ball and its reflection appear closer to each other than before. Include a human hand visible in the
    frame, positioned as if it has just pushed the ball toward the mirror. Ensure the background reflection
    of the pool table remains stationary.
  rationale: The video prompt describes a hand pushing the ball toward the mirror. Physically, as an object
    approaches a plane mirror, its virtual image also approaches the mirror plane. Visually, this means
    the real ball moves 'up' in the frame toward the mirror base, and the reflected ball moves 'down'
    in the mirror toward the same base. The final state must show the ball and its reflection in closer
    proximity to the mirror surface (and thus each other) to satisfy the geometric relationship of reflection.
