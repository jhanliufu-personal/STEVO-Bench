camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene featuring a mechanical setup clamped to a wooden workbench.
    On the left, a small wooden pulley with a crank handle is operated by a person's hand; the handle
    is currently positioned in the upper-left quadrant (roughly 10 or 11 o'clock). A black rubber belt
    connects this small driver pulley to a large wooden color wheel on the right. The color wheel is divided
    into 12 colored segments, with the segment labeled 'Yellow' positioned exactly at the top vertical
    center (12 o'clock). The belt is taut connecting the two components.
  init2final_edit_prompt: Edit the given image to show the result of rotating the crank handle 180 degrees
    clockwise. The person's hand and the wooden crank handle should be repositioned to the bottom-right
    quadrant (approximately 4 or 5 o'clock). The large color wheel should be rotated slightly clockwise,
    shifting the 'Yellow' segment from the top position to the right (approximately the 1 o'clock position),
    causing the yellow-green segment to move into the top position. Ensure the belt remains taut and connected.
  rationale: The user specifies a half-rotation (180 degrees) of the crank handle. This is a coupled belt-drive
    system. As the crank (driver) turns clockwise, it pulls the top section of the belt to the right,
    causing the large color wheel (driven) to also rotate clockwise. Due to the large difference in diameter
    between the small crank pulley and the large color wheel (roughly a 1:6 ratio), the color wheel will
    rotate a much smaller angular distance than the crank. While the crank turns 180 degrees, the wheel
    will likely turn only about 30 degrees (shifting by one color segment). The hand must follow the crank
    to its new position.
