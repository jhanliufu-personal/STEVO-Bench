id: ink_dilution
level: 3
category: relational_state
relational_type: concentration_coupling
scalar_variable: Fluid transparency
prompts:
  image_gen_prompt: A glass beaker is half-full of dark, opaque purple ink. A pitcher of clear water is
    tilted over the beaker, beginning to pour in a steady stream.
  video_WM: The clear water is poured into the dark ink. The total volume of liquid is rising. The pouring
    continues. The camera rotates right until the beaker completely exits the view, then rotates toward
    the left smoothly at the same rate until the beaker is back in the center of view. No zoom, no cut,
    no scene change. STOP.
  camera_WM: Water continues to pour into the ink.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
