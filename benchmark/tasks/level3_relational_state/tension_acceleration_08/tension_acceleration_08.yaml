id: tension_acceleration_08
level: 3
category: relational_state
tags: []
variant_of: tension_acceleration
variation_type: combined
variation_description: Lighting occlusion combined with locked wheels (high friction).
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Cart wheels are locked/braked.
  expected_outcome_change: Cart does not move due to friction exceeding tension.
prompts:
  init_frame_edit_prompt: Edit the image to show a red mechanical brake clamped onto the cart's wheels.
  video_WM: The suspended 5kg weight is released. The cart's wheels are locked by a mechanical brake,
    creating high friction. The room lights turn off completely, leaving the scene in darkness, then turn
    back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The suspended 5kg weight is released. The cart's wheels are locked by a mechanical brake,
    creating high friction. The room lights turn off completely, leaving the scene in darkness, then turn
    back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A physics lab setup on a wooden table. A metal pulley is clamped to the front-left
    edge of the table. A white string runs over the pulley, connecting a 5kg silver metal weight hanging
    below the table edge to a white plastic cart labeled '1KG' sitting on the table surface to the right.
    Inside the cart are red mechanical clamps. A wooden meter stick and a silver stopwatch lie on the
    table behind the cart. In the background, there are lab stools and other tables.
  init2final_edit_prompt: Edit the given image to show the white plastic cart moved significantly to the
    left, positioned closer to the metal pulley clamp. Position the hanging 5kg weight lower in the frame,
    extending the vertical segment of the string. Shorten the horizontal segment of the string between
    the pulley and the cart to maintain tautness and connection. Keep the ruler, stopwatch, and background
    background stationary and unchanged.
  rationale: 'The 5kg hanging mass exerts a gravitational force of approximately 49N. Even with the cart''s
    wheels locked to create high friction, the opposing friction force (likely under 20N given the light
    mass of the cart and typical friction coefficients) is insufficient to counteract the weight. Consequently,
    the system accelerates: the weight drops, pulling the cart to the left across the table. The blackout
    period covers the duration of this motion, resulting in a final state where the cart is closer to
    the pulley and the weight is lower.'
