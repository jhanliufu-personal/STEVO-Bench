id: bellows_pressure_system_08
level: 3
category: relational_state
tags: []
variant_of: bellows_pressure_system
variation_type: combined
variation_description: Lights off occlusion combined with reverse action (deflation).
changes:
  occlusion_method: Lighting change (lights off).
  dynamic_conditions: 'Initial state: Inflated/Compressed. Action: Pull apart.'
  expected_outcome_change: The balloon deflates.
prompts:
  init_frame_edit_prompt: Edit the image to show the wooden handles of the bellows pressed fully together,
    and the blue balloon fully inflated into a large spherical shape.
  video_WM: A mechanical press begins pulling the handles of the bellows apart, expanding the chamber
    at a constant speed. The hose connection is secure. Suddenly, the workshop lights turn off, plunging
    the scene into complete darkness. After a few seconds, the lights turn back on to reveal the scene
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: A mechanical press begins pulling the handles of the bellows apart, expanding the chamber
    at a constant speed. The hose connection is secure. Suddenly, the workshop lights turn off, plunging
    the scene into complete darkness. After a few seconds, the lights turn back on to reveal the scene
    again. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A wooden bellows with leather sides lies on a workbench, its handles compressed
    close together. A black rubber hose connects the nozzle of the bellows to a large, fully inflated
    blue balloon. Various woodworking tools, including chisels and a hammer, are visible on the workbench
    in the background.
  init2final_edit_prompt: Edit the given image so that the handles of the wooden bellows are pulled wide
    apart, creating a large gap between them and stretching the leather chamber open. Correspondingly,
    make the blue balloon appear significantly deflated and smaller, with a shriveled or less round shape,
    as if air has been drawn out of it. Keep the black hose securely connected between the bellows and
    the balloon, and ensure the background tools and workbench remain unchanged.
  rationale: The prompt describes the bellows handles being pulled apart. In a coupled pneumatic system
    where a bellows is connected to an inflated balloon, expanding the bellows chamber increases its internal
    volume, creating a pressure differential (suction) that draws air out of the balloon. Therefore, as
    the bellows expands (handles move apart), the balloon must deflate (shrink) to conserve the total
    air mass within the closed system. The blackout serves as a transition period for this state change
    to occur.
