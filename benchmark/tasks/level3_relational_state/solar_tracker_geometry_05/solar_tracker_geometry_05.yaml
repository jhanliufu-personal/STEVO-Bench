id: solar_tracker_geometry_05
level: 3
category: relational_state
tags: []
variant_of: solar_tracker_geometry
variation_type: dynamic_condition
variation_description: Changed time of day to noon; panel tracks upward/horizontal instead of down.
changes:
  occlusion_method: null
  dynamic_conditions: 'Time of day: High noon. Target angle: Horizontal.'
  expected_outcome_change: Panel tilts UP toward horizontal position rather than down.
prompts:
  init_frame_edit_prompt: Edit the image to change the lighting to bright, harsh midday sun directly overhead,
    with very short shadows on the ground.
  video_WM: The motorized tracker is active under the high noon sun. The solar panel begins tilting upward,
    reducing its angle to become flat and parallel with the ground to catch the overhead rays. The camera
    rotates right until the panel completely exits the view, then rotates toward the left smoothly at
    the same rate until the location of the panel is back in the center of view. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The motorized tracker is active under the high noon sun. The solar panel begins tilting upward,
    reducing its angle to become flat and parallel with the ground to catch the overhead rays. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, rectangular solar panel array mounted on a mechanical tracker in a
    desert environment. The panel is supported by a metal truss structure featuring a large circular gear
    mechanism. The panel is currently tilted at a significant angle relative to the ground, facing somewhat
    towards the camera and left. The ground is reddish sand with scattered rocks, and the sky is clear
    blue.
  init2final_edit_prompt: Edit the given image to show the large solar panel array in a horizontal position,
    parallel to the ground. The panel should no longer be tilted diagonally but should lie flat, as if
    facing the sun directly overhead. Adjust the metal framework and the large gear mechanism to align
    with this flat orientation. Keep the desert background, lighting, and camera perspective identical
    to the original image.
  rationale: The video prompt describes a physical transformation where the solar panel rotates from a
    tilted position to a flat, horizontal position to face the overhead sun. While this happens, the camera
    pans away and then returns to the original viewing angle. Therefore, the final frame must depict the
    scene from the original perspective, but with the solar panel's state advanced to the 'flat' orientation
    described. The mechanism (gears/struts) must physically update to support this new pose.
