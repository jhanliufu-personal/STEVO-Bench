camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Two large plastic syringes lying on a metal tray lined with a white cloth. The
    left syringe is partially filled with a red liquid, and its plunger is pulled back to around the 50ml
    mark. The right syringe is empty, with its plunger fully depressed. A clear flexible plastic tube
    connects the nozzles of the two syringes, and the tube is filled with the same red liquid.
  init2final_edit_prompt: Edit the given image to show the plunger of the left syringe pushed significantly
    further into the barrel, with the level of red liquid inside it lowered. Correspondingly, show the
    plunger of the right syringe extended further out of its barrel, with the barrel now containing the
    red liquid that was transferred from the left syringe. Maintain the connection tube filled with red
    liquid.
  rationale: The setup represents a closed hydraulic system. As the mechanical finger presses the plunger
    of the left syringe, the incompressible red liquid is forced out of the left barrel, through the connecting
    tube, and into the right barrel. Because the system is sealed, the volume of liquid lost from the
    left syringe must equal the volume gained in the right syringe. Consequently, the plunger of the right
    syringe must move outwards to accommodate the incoming fluid. The final state should show the left
    plunger depressed, the left liquid level lower, the right plunger extended, and the right syringe
    partially filled with red liquid.
