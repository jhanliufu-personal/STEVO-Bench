id: tension_acceleration_04
level: 3
category: relational_state
tags: []
variant_of: tension_acceleration
variation_type: dynamic_condition
variation_description: Hanging mass reduced significantly (5kg -> 50g), implying much slower acceleration.
changes:
  occlusion_method: null
  dynamic_conditions: Hanging mass is now 50g instead of 5kg.
  expected_outcome_change: The system accelerates much slower; the cart moves a shorter distance during
    occlusion.
prompts:
  init_frame_edit_prompt: Edit the image to change the engraved text on the hanging metal weight from
    '5KG' to '50g' and make the weight look smaller and lighter.
  video_WM: The suspended 50g weight is released from a stationary state. The string is taut and the cart's
    wheels are frictionless. The camera rotates right until the pulley completely exits the view, then
    rotates toward the left smoothly at the same rate until the cart's starting position is back in the
    center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The suspended 50g weight is released from a stationary state. The string is taut and the
    cart's wheels are frictionless. The gravitational force on the small falling mass drives the coupled
    system. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A physics lab setup on a wooden table showing a plastic cart labeled '1KG' with
    black wheels. The cart is connected by a white string to a metal pulley clamped to the left edge of
    the table. A 50g brass weight hangs from the string below the pulley. A wooden meter stick and a silver
    stopwatch are placed on the table near the cart. In the background, there are lab stools and other
    tables.
  init2final_edit_prompt: Edit the given image to position the plastic cart significantly to the left
    of its original location, placing it closer to the pulley clamp. Shorten the visible horizontal segment
    of the string between the cart and the pulley. Lower the position of the hanging 50g weight so it
    appears further down. Ensure the meter stick, stopwatch, and background furniture remain in their
    original positions.
  rationale: The system is released from rest, allowing gravity to pull the 50g weight downwards. Because
    the objects are coupled by a taut string, the downward motion of the weight causes the cart to accelerate
    to the left across the table. The camera motion (panning away and back) implies a duration of time
    has passed, allowing the cart to travel a significant distance towards the pulley and the weight to
    drop correspondingly. The camera returns to the initial framing, so the static environment remains
    unchanged while the coupled objects have moved.
  questions:
  - id: cart_displacement
    question: Is the plastic cart positioned to the left of its location in the initial frame?
    answer_type: yes_no
    notes_for_judge: The cart should have moved towards the pulley (left).
  - id: cart_pulley_distance
    question: Is the distance between the cart and the pulley smaller than in the initial frame?
    answer_type: yes_no
    notes_for_judge: 'Relational check: as the cart moves left, the gap decreases.'
  - id: weight_height
    question: Is the hanging 50g weight lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The weight falls due to gravity.
  - id: string_length
    question: Is the horizontal segment of the string (on the table) shorter than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the cart approaches the pulley, the horizontal string length decreases.
  - id: coupled_motion
    question: Do the cart and weight show coupled motion (cart moves left AND weight moves down)?
    answer_type: yes_no
    notes_for_judge: Both changes must be present for the physics to be consistent.
  - id: static_objects
    question: Are the stopwatch and meter stick in the same positions as in the initial frame?
    answer_type: yes_no
    notes_for_judge: These objects are not connected to the system and should not move.
  - id: background_consistency
    question: Are the lab stools and background tables unchanged?
    answer_type: yes_no
    notes_for_judge: The camera returns to the original view; the background should be stable.
