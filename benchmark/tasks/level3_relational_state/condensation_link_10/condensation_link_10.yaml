id: condensation_link_10
level: 3
category: relational_state
tags: []
variant_of: condensation_link
variation_type: combined
variation_description: Water boiling violently (fast steam) and occlusion is steam cloud.
changes:
  occlusion_method: A thick cloud of steam fills the view.
  dynamic_conditions: Water is boiling violently with high heat.
  expected_outcome_change: Condensation forms faster/heavier than original.
prompts:
  init_frame_edit_prompt: Edit the image to show the water boiling violently with large bubbles and a
    dense, heavy column of steam rising rapidly.
  video_WM: The glass pane is held over a violently boiling pot. A heavy column of steam blasts upward
    against the glass. The steam production increases rapidly until a thick white fog completely fills
    the camera view, obscuring the pot and glass entirely. The fog then dissipates, revealing the scene
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: The glass pane is held over a violently boiling pot. A heavy column of steam blasts upward
    against the glass. The steam production increases rapidly until a thick white fog completely fills
    the camera view, obscuring the pot and glass entirely. The fog then dissipates, revealing the scene
    again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a metal pot filled with violently boiling water on a stovetop.
    A hand holds a rectangular clear glass pane horizontally above the pot. The glass pane already has
    some small water droplets and condensation on its surface. Steam is rising from the pot, partially
    obscuring the view through the glass. The background shows a kitchen counter and wooden cabinets.
  init2final_edit_prompt: Edit the given image to show the glass pane covered in a much heavier and denser
    layer of water droplets and condensation. The glass surface should appear significantly wetter, with
    larger beads of water and streaks running down, distorting the view through the glass more than in
    the original image. The water in the pot should continue to show vigorous boiling bubbles. Keep the
    hand holding the glass and the kitchen background unchanged.
  rationale: 'The video prompt describes a continuous exposure of the glass pane to a heavy blast of steam
    from the boiling water. During the period where the view is obscured by fog, the steam condenses rapidly
    on the cooler glass surface. When the fog dissipates, the physical consequence of this interaction
    must be visible: the glass will have accumulated significantly more liquid water (condensation) due
    to the phase change of the steam. The water in the pot remains boiling, maintaining the source of
    the steam.'
