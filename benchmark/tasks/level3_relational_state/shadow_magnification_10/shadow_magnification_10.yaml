id: shadow_magnification_10
level: 3
category: relational_state
tags: []
variant_of: shadow_magnification
variation_type: combined
variation_description: Dinosaur moves sideways (parallel to wall) + Camera zoom occlusion.
changes:
  occlusion_method: Camera zooms out until details are lost, then zooms in.
  dynamic_conditions: Object moves laterally (parallel to wall).
  expected_outcome_change: Shadow position shifts sideways, but size remains constant.
prompts:
  init_frame_edit_prompt: Edit the image to orient the slider tracks left-to-right (parallel to the wall)
    instead of front-to-back.
  video_WM: A mechanical arm begins sliding the dinosaur pedestal laterally to the right, maintaining
    the same distance from the light and the wall. The light remains fixed. The camera zooms out rapidly
    until the room is a distant speck, then zooms back in to the original framing. No cut, no scene change.
    STOP.
  camera_WM: A mechanical arm begins sliding the dinosaur pedestal laterally to the right, maintaining
    the same distance from the light and the wall. The light remains fixed. STOP.
camera_control:
  HY-WorldPlay: s-31, w-32
evaluation:
  init_frame_description: A toy T-Rex dinosaur stands on a wooden pedestal in a dimly lit room. To the
    right, a large studio light with barn doors is positioned on a stand, casting a beam of light towards
    the dinosaur. A sharp shadow of the dinosaur is projected onto the wall on the left. In the foreground,
    a black camera slider track runs horizontally across the bottom of the frame. The background consists
    of a textured, dark wall.
  init2final_edit_prompt: Edit the given image to show the dinosaur and its wooden pedestal positioned
    further to the right side of the frame. Since the dinosaur has moved closer to the fixed light source
    on the right, make the shadow cast on the left wall significantly larger and more magnified. Ensure
    the studio light stand, the camera slider track, and the background wall remain in their original
    positions and appearance.
  rationale: The video prompt describes the pedestal sliding laterally to the right. In the scene, the
    light source is fixed on the right side. Moving the object to the right brings it physically closer
    to the light source while the projection surface (the wall on the left) remains fixed. According to
    the laws of optics, decreasing the distance between an object and a point light source increases the
    magnification of the cast shadow. Therefore, the final state must show the dinosaur shifted to the
    right and its shadow on the wall significantly larger. The camera movement (zoom out/in) is a temporary
    excursion that returns to the original framing, so the static environment (light stand, track, wall)
    should appear unchanged.
  questions:
  - id: primary_position_change
    question: Is the dinosaur pedestal positioned further to the right than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The object must have moved to the right.
  - id: primary_shadow_size
    question: Is the shadow of the dinosaur on the wall larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Moving closer to the light source (right) must magnify the shadow on the wall (left).
  - id: relational_shadow_magnification
    question: Does the shadow appear more magnified relative to the dinosaur's size compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Checks for the correct relational change between object and shadow.
  - id: primary_proximity_light
    question: Is the dinosaur closer to the studio light fixture on the right than before?
    answer_type: yes_no
    notes_for_judge: Inferred from the rightward movement towards the visible light source.
  - id: consistency_light_stand
    question: Is the studio light stand in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The light is fixed.
  - id: consistency_slider_track
    question: Is the camera slider track in the foreground unchanged?
    answer_type: yes_no
    notes_for_judge: Static object.
  - id: consistency_wall_texture
    question: Is the background wall texture consistent with the initial frame?
    answer_type: yes_no
    notes_for_judge: The environment should not change.
  - id: relational_shadow_visibility
    question: Is the shadow still visible on the wall to the left of the dinosaur?
    answer_type: yes_no
    notes_for_judge: The shadow should not disappear, though it may be larger.
