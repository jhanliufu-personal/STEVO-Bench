id: pulley_counterweight
level: 3
category: relational_state
relational_type: tension_coupling
prompts:
  image_gen_prompt: Generate an image that shows a single pulley mounted to a ceiling. A rope passes through it, with a 5kg iron weight
    hanging from each end. The weights are currently at the same height.
  video_WM: A hand begins pulling the left weight downward at a constant speed. The rope remains taut
    across the pulley. The motion continues steadily. The camera rotates right until the pulley system
    completely exits the view, then rotates toward the left smoothly at the same rate until the pulley
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The left weight is pulled down. The rope is not very extensible. The steady motion continues.
    STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A rustic workshop interior featuring a single fixed metal pulley suspended from
    a wooden beam. A thick rope runs over the pulley, connecting two identical cylindrical iron weights
    labeled '5 KG IRON'. In this initial state, the two weights hang at approximately the same height
    above the concrete floor. The background includes a workbench with tools, a window with natural light,
    and wooden structural elements.
  init2final_edit_prompt: Edit the given image to show the left iron weight positioned significantly lower
    than its original height and the right iron weight positioned significantly higher than its original
    height. The left weight must be clearly lower than the right weight. Maintain the appearance of the
    taut rope connecting them through the pulley, ensuring the rope length appears conserved (one side
    shortens as the other lengthens).
  rationale: The video prompt describes a hand pulling the left weight downward. In a fixed pulley system
    with a fixed-length rope, pulling one side down mechanically forces the other side up by an equal
    distance. The camera rotates away and then returns to the original view. Therefore, the final frame
    must depict the system in a new state where the left weight is displaced downward and the right weight
    is displaced upward relative to their initial equilibrium positions.
