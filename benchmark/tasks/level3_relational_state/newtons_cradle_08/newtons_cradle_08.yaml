evaluation:
  init_frame_description: A close-up, eye-level shot of a Newton's Cradle on a wooden desk. The apparatus
    features a brass frame and five textured, grey clay balls suspended by strings. The far-left ball
    is pulled back and held in a raised position to the left, creating a significant gap between it and
    the four stationary balls hanging in the center. The background is a dimly lit study with a leather
    chair and books.
  init2final_edit_prompt: Edit the given image to show the state after the left ball has swung down and
    struck the others. Place the far-left clay ball at the bottom, hanging vertically and touching the
    central group of balls. Move the far-right clay ball so it is swinging outwards and upwards to the
    right, reaching a height similar to the initial height of the left ball, mirroring the action. Ensure
    the lighting and background remain identical to the original.
  rationale: 'The prompt describes the release of the raised left ball in a Newton''s Cradle setup. Physically,
    the ball will swing down under gravity and strike the stationary line of balls. Due to the conservation
    of momentum and energy characteristic of a Newton''s Cradle (even with hardened clay/ceramic balls),
    the momentum will transfer through the stationary balls, causing the far-right ball to swing outwards
    to the right. The ''blackout'' period covers the duration of the swing, so the final frame should
    show the result of this collision: the left ball down and the right ball displaced.'
