evaluation:
  init_frame_description: A wooden table featuring a long, winding chain of wooden dominoes standing upright.
    A hand enters from the left, with a finger touching the first domino, poised to push it. In the background,
    there are books, potted plants, a window, and a chair.
  init2final_edit_prompt: Edit the given image so that the winding chain of wooden dominoes is lying flat
    on the table. The dominoes should be toppled over, overlapping one another in a sequence along the
    original curved path. The hand should be removed or resting on the table. The background objects,
    including the books and plants, must remain unchanged.
  rationale: The video prompt describes the finger pushing the first domino, initiating a chain reaction.
    Although the fog obscures the process, the physical coupling of the dominoes ensures that the fall
    propagates through the chain. The duration of 'several seconds' described in the prompt is sufficient
    for a chain of this length to fall completely. Therefore, when the fog clears, the final state should
    show the dominoes toppled over along their original path.
