id: domino_falling_03
level: 3
category: relational_state
tags: []
variant_of: domino_falling
variation_type: occlusion_method
variation_description: Occlusion by thick fog filling the room.
changes:
  occlusion_method: Thick white fog fills the room, obscuring the table.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous shot, no cuts. The finger pushes the first domino forward as interaction
    continues. As the chain reaction begins, thick white fog rapidly fills the room, completely obscuring
    the table and dominoes from view. The fog swirls densely for several seconds. Then the fog clears
    rapidly, restoring visibility of the table. STOP.
  camera_WM: Single continuous shot, no cuts. The finger pushes the first domino forward as interaction
    continues. As the chain reaction begins, thick white fog rapidly fills the room, completely obscuring
    the table and dominoes from view. The fog swirls densely for several seconds. Then the fog clears
    rapidly, restoring visibility of the table. STOP.
camera_control:
  HY-WorldPlay: null
  Genie: null
evaluation:
  init_frame_description: A wooden table featuring a long, winding chain of wooden dominoes standing upright.
    A hand enters from the left, with a finger touching the first domino, poised to push it. In the background,
    there are books, potted plants, a window, and a chair.
  init2final_edit_prompt: Edit the given image so that the winding chain of wooden dominoes is lying flat
    on the table. The dominoes should be toppled over, overlapping one another in a sequence along the
    original curved path. The hand should be removed or resting on the table. The background objects,
    including the books and plants, must remain unchanged.
  rationale: The video prompt describes the finger pushing the first domino, initiating a chain reaction.
    Although the fog obscures the process, the physical coupling of the dominoes ensures that the fall
    propagates through the chain. The duration of 'several seconds' described in the prompt is sufficient
    for a chain of this length to fall completely. Therefore, when the fog clears, the final state should
    show the dominoes toppled over along their original path.
  questions:
  - id: domino_state_flat
    question: Are the wooden dominoes lying flat on the table?
    answer_type: yes_no
    notes_for_judge: The dominoes should no longer be standing upright.
  - id: propagation_start
    question: Is the first domino (closest to where the hand was) toppled over?
    answer_type: yes_no
    notes_for_judge: This checks if the trigger event occurred.
  - id: propagation_end
    question: Are the dominoes at the far end of the chain also toppled over?
    answer_type: yes_no
    notes_for_judge: This tests if the coupled state change propagated through the entire system.
  - id: path_conservation
    question: Do the fallen dominoes follow the same winding path shape as the initial upright chain?
    answer_type: yes_no
    notes_for_judge: The spatial configuration of the path should be conserved.
  - id: sequential_overlap
    question: Do the dominoes overlap each other?
    answer_type: yes_no
    notes_for_judge: Fallen dominoes typically overlap the next one in the chain.
  - id: fog_cleared
    question: Is the view clear of the thick white fog described in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the fog clears rapidly.
  - id: background_consistency
    question: Are the background plants and books in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: Unrelated objects should remain static.
