id: syringe_hydraulic_02
level: 3
category: relational_state
tags: []
variant_of: syringe_hydraulic
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off.
changes:
  occlusion_method: Room lights turn off completely (blackout).
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A mechanical finger begins pressing the plunger of the left syringe. The two syringes are
    connected. The pressing continues at a constant rate. Suddenly, the lights in the room turn off completely,
    plunging the scene into total darkness. After a moment, the lights turn back on, illuminating the
    tray again. No zoom, no cut, no scene change. STOP.
  camera_WM: A mechanical finger begins pressing the plunger of the left syringe. The two syringes are
    connected. The pressing continues at a constant rate. Suddenly, the lights in the room turn off completely,
    plunging the scene into total darkness. After a moment, the lights turn back on, illuminating the
    tray again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Two large plastic syringes resting on a metal tray lined with a white cloth.
    The left syringe is partially filled with a red liquid (approximately to the 40ml mark) and its plunger
    is extended. The right syringe is empty with its plunger fully depressed. A clear plastic tube connects
    the nozzle of the left syringe to the nozzle of the right syringe, forming a loop. The tube is filled
    with the same red liquid. The background shows a window frame with natural light.
  init2final_edit_prompt: Edit the given image to show the result of hydraulic fluid transfer. The plunger
    of the left syringe should be pushed significantly further into the barrel, and the level of red liquid
    inside it should be much lower. Correspondingly, the plunger of the right syringe should be pushed
    outwards, and the barrel of the right syringe should be partially filled with red liquid transferred
    from the left. Ensure the connecting tube remains attached and filled with red liquid.
  rationale: The prompt describes a hydraulic system where a mechanical finger presses the left plunger.
    Because the syringes are connected by a sealed tube filled with incompressible fluid, pressing the
    left plunger forces liquid into the right syringe. This transfer of mass must result in the left plunger
    moving in (volume decrease) and the right plunger moving out (volume increase) to accommodate the
    fluid. The total volume of red liquid is conserved. The occlusion (lights off) hides the process,
    but the final state must reflect this coupled physical change.
  questions:
  - id: left_plunger_in
    question: Is the plunger of the left syringe pushed further into the barrel compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Check if the left plunger has moved to the right/inwards.
  - id: right_plunger_out
    question: Is the plunger of the right syringe extended further out compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the right plunger has moved to the right/outwards.
  - id: liquid_transfer_presence
    question: Does the right syringe now contain red liquid?
    answer_type: yes_no
    notes_for_judge: The right syringe was initially empty; it should now have red liquid.
  - id: liquid_level_left
    question: Is the level of red liquid in the left syringe lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The amount of liquid in the source syringe must decrease.
  - id: coupled_motion
    question: Do the plunger movements correspond to a transfer of fluid from the left syringe to the
      right syringe?
    answer_type: yes_no
    notes_for_judge: Left in, Right out.
  - id: conservation_volume
    question: Does the decrease in liquid volume in the left syringe appear roughly proportional to the
      increase in the right syringe?
    answer_type: yes_no
    notes_for_judge: 'Relational check: liquid lost = liquid gained.'
  - id: tube_connection
    question: Is the tubing still connected to both syringes?
    answer_type: yes_no
    notes_for_judge: The physical connection must be maintained.
  - id: tube_content
    question: Does the connecting tube remain filled with red liquid?
    answer_type: yes_no
    notes_for_judge: The tube should not be empty or contain large air gaps.
