evaluation:
  init_frame_description: Two large plastic syringes resting on a metal tray lined with a white cloth.
    The left syringe is partially filled with a red liquid (approximately to the 40ml mark) and its plunger
    is extended. The right syringe is empty with its plunger fully depressed. A clear plastic tube connects
    the nozzle of the left syringe to the nozzle of the right syringe, forming a loop. The tube is filled
    with the same red liquid. The background shows a window frame with natural light.
  init2final_edit_prompt: Edit the given image to show the result of hydraulic fluid transfer. The plunger
    of the left syringe should be pushed significantly further into the barrel, and the level of red liquid
    inside it should be much lower. Correspondingly, the plunger of the right syringe should be pushed
    outwards, and the barrel of the right syringe should be partially filled with red liquid transferred
    from the left. Ensure the connecting tube remains attached and filled with red liquid.
  rationale: The prompt describes a hydraulic system where a mechanical finger presses the left plunger.
    Because the syringes are connected by a sealed tube filled with incompressible fluid, pressing the
    left plunger forces liquid into the right syringe. This transfer of mass must result in the left plunger
    moving in (volume decrease) and the right plunger moving out (volume increase) to accommodate the
    fluid. The total volume of red liquid is conserved. The occlusion (lights off) hides the process,
    but the final state must reflect this coupled physical change.
