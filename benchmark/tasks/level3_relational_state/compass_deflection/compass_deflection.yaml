id: compass_deflection
level: 3
category: relational_state
relational_type: field_coupling
prompts:
  image_gen_prompt: A magnetic compass sits on a wooden table, pointing North. A strong bar magnet is
    held six inches away from the compass, oriented perpendicular to it.
  video_WM: A hand begins moving the bar magnet steadily closer to the side of the compass housing. The
    magnet remains oriented in the same direction. The camera rotates right until the magnet completely
    exits the view, then rotates toward the left smoothly at the same rate until the compass face is back
    in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The bar magnet is moved closer to the compass. The magnetic field interaction between the
    two entities is the primary driver. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A brass compass with an open lid rests on a wooden table. The compass needle
    has a red tip pointing approximately to the 10 or 11 o'clock position and a silver tip pointing to
    the 4 or 5 o'clock position. To the right, a hand holds a rectangular bar magnet with its red pole
    facing the compass and blue pole facing away. A wooden ruler lies in the foreground.
  init2final_edit_prompt: Edit the given image to position the bar magnet significantly closer to the
    right side of the compass housing. Rotate the compass needle counter-clockwise so that it aligns horizontally,
    with the silver tip pointing directly toward the red pole of the magnet (3 o'clock) and the red tip
    pointing directly away to the left (9 o'clock).
  rationale: The video prompt describes the magnet moving steadily closer to the compass. Physically,
    the red end of the magnet (North pole) creates a magnetic field that repels the red tip of the compass
    needle (North) and attracts the silver tip (South). As the magnet gets closer, its magnetic field
    dominates the local environment, forcing the needle to align with the field lines. This causes the
    needle to rotate counter-clockwise until the silver tip points directly at the magnet and the red
    tip points away. The camera rotation serves as an occlusion event, but the final state is determined
    by the closer proximity of the magnet.
