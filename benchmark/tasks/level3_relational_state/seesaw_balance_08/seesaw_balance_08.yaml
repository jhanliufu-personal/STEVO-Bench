  init2final_edit_prompt: Edit the given image to show the seesaw in the exact same position as the original,
    with the left side resting on the ground and the right side elevated in the air. Ensure the 500 kg
    sandbag remains sitting on the left seat, unchanged in position.
  rationale: 'The video prompt describes a person attempting to lift a 500 kg sandbag with one hand. Physically,
    500 kg is far too heavy for a human to lift, especially with a single hand and poor leverage. Therefore,
    despite the attempt, the object will not move. The camera zooms out and back in to the original framing,
    meaning the final visual state should be identical to the initial state: the seesaw remains tipped
    to the left with the heavy load on the ground.'
