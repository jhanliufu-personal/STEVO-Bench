camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, high-angle shot of a wooden table surface. On the left, a brass
    pocket compass with its lid flipped open sits on the table; its needle is settled pointing towards
    the lower-left. To the right, a hand holds a rectangular wooden block. A wooden ruler lies horizontally
    in the foreground.
  init2final_edit_prompt: Edit the given image to show the wooden block positioned significantly closer
    to the side of the compass housing, reducing the gap between them. Rotate the compass needle to a
    clearly different angle compared to the original image, simulating a magnetic deflection caused by
    the block's proximity. Ensure the hand is still holding the block in its new position. Keep the ruler,
    table surface, and compass housing stationary.
  rationale: The task involves moving an object near a compass. Although the object appears to be a wooden
    block, the task ID 'compass_deflection' and the Level 3 focus on coupled systems imply a hidden magnetic
    interaction (e.g., a magnet inside the block). Therefore, the rollout must demonstrate a causal relationship
    where the proximity of the block causes the compass needle to deflect (rotate) from its initial bearing.
    The occlusion by the clipboard covers the transition, so the final frame must depict the block in
    a closer position and the needle in a new, deflected orientation.
