id: condensation_link_01
level: 3
category: relational_state
tags: []
variant_of: condensation_link
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off.
changes:
  occlusion_method: Lights turn off completely (pitch black) then turn back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The glass pane is lowered until it is directly in the path of the rising steam. The water
    continues to boil and produce vapor. Suddenly, the kitchen lights turn off, plunging the scene into
    complete darkness. After a moment, the lights turn back on to reveal the scene again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The glass pane is lowered until it is directly in the path of the rising steam. The water
    continues to boil and produce vapor. Suddenly, the kitchen lights turn off, plunging the scene into
    complete darkness. After a moment, the lights turn back on to reveal the scene again. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a stainless steel pot on a stove with water boiling
    inside, producing visible steam. A hand holds a rectangular piece of clear glass above the pot. The
    glass pane already has some small water droplets and condensation on its surface. The background shows
    a wooden kitchen counter and cabinets.
  init2final_edit_prompt: Edit the given image to position the hand and the glass pane lower, closer to
    the rim of the pot. Increase the amount of condensation on the glass pane, showing larger and more
    numerous water droplets covering the surface. Ensure the water in the pot continues to look agitated
    and boiling. Keep the lighting bright and the scene visible.
  rationale: The prompt specifies that the glass is lowered into the steam and held there while the water
    boils. Physically, the steam rising from the boiling water will condense upon contact with the cooler
    glass surface. Even though the lights turn off and on, the physical process of condensation continues
    or persists. Therefore, the final state must show the glass in a lower position relative to the pot
    and significantly more accumulated water droplets (condensation) than the initial frame due to the
    exposure to the steam.
  questions:
  - id: position_change
    question: Is the glass pane positioned lower relative to the pot's rim than it was in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical distance between the glass and the pot in both frames.
  - id: condensation_increase
    question: Are there more water droplets or heavier condensation on the glass pane compared to the
      initial frame?
    answer_type: yes_no
    notes_for_judge: Look for increased density, size, or coverage of water droplets on the glass surface.
  - id: boiling_state
    question: Does the water in the pot still appear to be boiling?
    answer_type: yes_no
    notes_for_judge: Check for bubbles or surface agitation in the water.
  - id: lighting_restored
    question: Is the scene fully illuminated, indicating the lights are back on?
    answer_type: yes_no
    notes_for_judge: The image should not be dark; details should be clearly visible.
  - id: hand_consistency
    question: Is the hand still holding the glass pane?
    answer_type: yes_no
    notes_for_judge: Verify object permanence of the hand holding the glass.
  - id: steam_effect_relation
    question: Does the glass pane appear wet or foggy, consistent with being held in steam?
    answer_type: yes_no
    notes_for_judge: This checks the causal relationship between the steam source and the glass state.
