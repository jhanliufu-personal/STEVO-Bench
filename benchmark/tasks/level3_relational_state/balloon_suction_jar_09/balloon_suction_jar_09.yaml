id: balloon_suction_jar_09
level: 3
category: relational_state
tags: []
variant_of: balloon_suction_jar
variation_type: combined
variation_description: Broken seal (leak) with fog occlusion.
changes:
  occlusion_method: Dense chemical fog fills the scene.
  dynamic_conditions: Bell jar is propped open (seal broken).
  expected_outcome_change: No change in balloon size (air enters through leak).
prompts:
  init_frame_edit_prompt: Edit the image to show the glass bell jar tilted slightly, propped up on a small
    wooden wedge at the bottom rim so it is not sealed against the base.
  video_WM: The vacuum pump activates, attempting to draw air from the jar. However, the jar is propped
    up on a wedge, creating a large gap at the base that breaks the seal. Dense white fog begins to fill
    the room, obscuring the entire workbench and apparatus until nothing is visible. The pump continues
    to run. The fog slowly dissipates until the scene is clear again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The vacuum pump activates, attempting to draw air from the jar. However, the jar is propped
    up on a wedge, creating a large gap at the base that breaks the seal. Dense white fog begins to fill
    the room, obscuring the entire workbench and apparatus until nothing is visible. The pump continues
    to run. The fog slowly dissipates until the scene is clear again. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A laboratory setup on a wooden table showing a silver and black vacuum pump
    connected by a beige hose to a large glass bell jar. Inside the jar is an inflated red balloon. The
    glass jar is propped up on one side by a small wooden wedge, creating a visible air gap between the
    jar's rim and the table surface.
  init2final_edit_prompt: Edit the given image to show the scene clearly. The red balloon inside the glass
    jar must remain exactly the same size and shape as in the original image, without expanding. The glass
    jar must remain propped up on the wooden wedge with the gap at the bottom visible. Ensure the scene
    is completely clear of any fog or smoke.
  rationale: The video prompt specifies that the jar is propped up on a wedge, which breaks the airtight
    seal necessary for a vacuum to form. Even though the pump activates, air flows freely into the jar
    through the gap, maintaining atmospheric pressure inside. Therefore, the balloon does not expand (as
    it would in a sealed vacuum). The fog acts as a temporary occlusion, and when it dissipates, the physical
    state of the balloon and jar should appear unchanged from the start.
  questions:
  - id: balloon_size_constancy
    question: Is the red balloon approximately the same size as it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The balloon should not have expanded because the jar is not sealed.
  - id: balloon_jar_relation
    question: Is the empty space between the balloon and the glass jar walls preserved relative to the
      initial frame?
    answer_type: yes_no
    notes_for_judge: If the balloon expanded, this space would decrease. It should remain constant.
  - id: wedge_presence
    question: Is the wooden wedge still visible under the rim of the glass jar?
    answer_type: yes_no
    notes_for_judge: The wedge must remain to explain the lack of vacuum.
  - id: gap_visibility
    question: Is the gap between the jar rim and the table surface still visible?
    answer_type: yes_no
    notes_for_judge: The seal must remain broken.
  - id: fog_dissipation
    question: Is the scene clear of the dense white fog described in the prompt?
    answer_type: yes_no
    notes_for_judge: The prompt states the fog dissipates.
  - id: balloon_shape_integrity
    question: Does the balloon retain its original shape without appearing stretched or distorted?
    answer_type: yes_no
    notes_for_judge: It should not look like it is filling the jar.
