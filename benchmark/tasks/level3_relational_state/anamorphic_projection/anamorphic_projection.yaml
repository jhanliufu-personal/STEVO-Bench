id: anamorphic_projection
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: A distorted, unrecognizable drawing is laid flat on a table. In the center of the
    drawing sits a perfectly reflective cylindrical mirror, which currently shows a recognizable image
    of a face in its reflection.
  video_WM: A hand begins rotating the flat drawing on the table around the base of the cylindrical mirror.
    The mirror remains stationary. The camera rotates right until the drawing completely exits the view,
    then rotates toward the left smoothly at the same rate until the surface of the cylindrical mirror
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The distorted drawing is rotated around the reflective cylinder. The geometric transformation
    in the mirror's reflection is maintained. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
