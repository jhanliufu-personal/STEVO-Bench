camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A photo of a physics experiment setup featuring a clear acrylic inclined rail
    labeled 'FRICTIONLESS RAIL' sloping downwards from left to right. Two cylindrical metal pucks are
    on the rail. The upper puck (left) is positioned on its edge like a wheel, with a red 'N' on its flat
    face pointing towards the camera. The lower puck (right) is lying flat on the rail, with a red 'N'
    on its top face. A whiteboard with physics equations is visible in the background.
  init2final_edit_prompt: Edit the given image to show the aftermath of the magnetic interaction. Move
    the upper puck (with the 'N' facing the camera) down the incline to approximately the position originally
    occupied by the lower puck. Move the lower puck (with the 'N' on top) significantly further down the
    rail to the right, near the bottom-right edge of the frame, creating a large gap between the two pucks.
    Ensure the 'N' on the first puck still faces the camera and the 'N' on the second puck remains on
    top.
  rationale: The setup describes a magnetic repulsion scenario on a frictionless incline. As the moving
    upper puck approaches the stationary lower puck, the significant magnetic repulsion acts as an elastic
    collision mechanism. Momentum is transferred from the moving puck to the stationary one. Consequently,
    the lower puck is propelled rapidly down the rail, while the upper puck slows down or momentarily
    stops near the point of impact (the lower puck's initial position). The final state should show the
    lower puck far down the track and the upper puck advanced to the middle, with a significantly increased
    separation distance between them.
