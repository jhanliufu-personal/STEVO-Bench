camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene showing a mechanical setup with a hand-cranked pulley system.
    On the left, a wooden crank mechanism is clamped to a workbench; a person's hand holds the handle
    near the top of its rotation (approximately 12 o'clock). A black belt connects the small crank pulley
    to a large, multi-colored wooden wheel on the right. The wheel has 12 colored segments, with the segment
    labeled 'Yellow' positioned at the top center (12 o'clock). To the left of 'Yellow' is a green segment,
    and to the right is an orange-yellow segment. The background features a window and a tool wall.
  init2final_edit_prompt: Edit the given image to show the wooden crank handle rotated 180 degrees, now
    positioned at the bottom of its cycle (pointing downwards), with the hand holding it in this lower
    position. Rotate the large color wheel slightly clockwise (approximately 30 degrees) so that the 'Yellow'
    segment is shifted to the right (around the 1 o'clock position) and the green segment previously at
    11 o'clock is now at the top center. Ensure the belt remains taut and connected between the pulleys.
  rationale: 'The prompt specifies a half-rotation (180 degrees) of the crank handle. Since the crank
    pulley is much smaller than the color wheel (approximately a 1:6 ratio), the wheel will rotate a correspondingly
    smaller amount (roughly 30 degrees, or one segment). The belt connects the tops of both pulleys, so
    a clockwise turn of the crank (top moving right) drives the wheel clockwise (top moving right). The
    occlusion hides the motion, but the final state must reflect these mechanical constraints: the handle
    at the bottom and the wheel rotated slightly clockwise.'
