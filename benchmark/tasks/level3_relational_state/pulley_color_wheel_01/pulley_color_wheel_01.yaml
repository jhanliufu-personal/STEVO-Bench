    blocking the view of the mechanism. The board remains for a moment, then slides back out to the right.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A hand turns the crank handle exactly half a rotation clockwise. The rubber belt is taut
    and moves without slipping. A large plywood board slides from the right into the foreground, completely
    blocking the view of the mechanism. The board remains for a moment, then slides back out to the right.
