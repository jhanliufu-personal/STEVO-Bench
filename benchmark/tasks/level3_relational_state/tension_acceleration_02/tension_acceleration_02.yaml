id: tension_acceleration_02
level: 3
category: relational_state
tags: []
variant_of: tension_acceleration
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off.
changes:
  occlusion_method: Room lights turn off completely, then turn back on.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The suspended 5kg weight is released from a stationary state. The string is taut and the cart's
    wheels are frictionless. Suddenly, the room lights turn off completely, plunging the scene into total
    darkness. After a moment, the lights turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The suspended 5kg weight is released from a stationary state. The string is taut and the
    cart's wheels are frictionless. Suddenly, the room lights turn off completely, plunging the scene
    into total darkness. After a moment, the lights turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A physics lab setup on a wooden table featuring a plastic dynamics cart labeled
    '1KG' with black wheels, connected by a white string to a hanging metal mass labeled '5KG'. The string
    runs over a metal pulley clamped to the left edge of the table. A wooden meter stick and a silver
    stopwatch lie on the table near the cart. In the background, there are lab stools, tables, and a whiteboard.
    The system is initially stationary with the cart positioned to the right, some distance away from
    the pulley, and the weight hanging high near the table edge.
  init2final_edit_prompt: Edit the given image to show the result of the weight falling. Move the '1KG'
    cart to the left so it is positioned immediately next to the pulley clamp at the edge of the table.
    Move the '5KG' hanging weight significantly lower in the frame, extending the vertical string downwards
    to match the new position. Ensure the string remains connected between the cart and the weight. Keep
    the meter stick, stopwatch, and background furniture stationary and unchanged.
  rationale: The system consists of a 1kg cart and a 5kg hanging mass connected by a pulley. Since the
    hanging mass (5kg) is significantly heavier than the cart (1kg), releasing the system creates a large
    net force that accelerates the cart rapidly toward the pulley and the weight downward. The 'lights
    out' period allows time for this motion to occur. In the final state, the cart must have moved to
    the left (towards the pulley) and the weight must have moved downward, maintaining the physical coupling
    of the string.
