id: newtons_cradle
level: 2
category: spatial_kinematics
prompts:
  image_gen_prompt: A Newton's Cradle with five steel balls. The ball on the far left is pulled back to
    a 45-degree angle and is currently stationary.
  video_WM: The far-left ball is released. It swings toward the remaining four stationary balls. The camera
    rotates right until the cradle completely exits the view, then rotates toward the left smoothly at
    the same rate until the entire cradle is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The left-most ball is released from its elevated position to impact the stationary line of
    balls. Elastic collision laws apply. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot of a Newton's Cradle on a wooden desk. The cradle
    consists of a brass frame and five silver metallic spheres suspended by strings. The far-left sphere
    is pulled back and raised high to the left side, held in a position of potential energy. The other
    four spheres are resting stationary in the center, touching each other in a horizontal line. The background
    features a blurred office setting with a window, curtain, and bookshelf.
  init2final_edit_prompt: 'Edit the given image to show the physical reaction of the Newton''s Cradle:
    position the far-left ball down so it is hanging in line with the central balls, and position the
    far-right ball so it is swung outward and upward to the right side, separated from the group.'
  rationale: The prompt describes the release of the raised left ball. According to the physics of a Newton's
    Cradle (conservation of momentum and energy), the left ball will swing down and strike the stationary
    pack. The momentum will transfer through the middle balls, causing the far-right ball to swing outward
    and upward. The camera movement (panning away and returning) provides a duration of time for this
    swing and impact to occur. Therefore, in the final frame, the left ball should be down (having released
    its energy) and the right ball should be displaced to the right (having received the momentum).
  questions:
  - id: left_ball_drop
    question: Is the far-left ball at a lower vertical position than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The left ball started high; it should now be down near the others.
  - id: right_ball_motion
    question: Has the far-right ball moved to the right compared to its initial position?
    answer_type: yes_no
    notes_for_judge: The right ball was initially stationary in the center; it should now be swung out.
  - id: right_ball_separation
    question: Is there a visible gap between the far-right ball and the middle group of balls?
    answer_type: yes_no
    notes_for_judge: Momentum transfer causes the right ball to separate from the pack.
  - id: left_ball_contact
    question: Is the far-left ball now closer to the central group of balls than it was initially?
    answer_type: yes_no
    notes_for_judge: It should have swung in to hit them.
  - id: right_ball_height
    question: Is the far-right ball elevated higher than the middle three balls?
    answer_type: yes_no
    notes_for_judge: It swings up as it swings out.
  - id: middle_balls_stability
    question: Are the middle three balls still roughly grouped together?
    answer_type: yes_no
    notes_for_judge: Ideally, the middle balls remain relatively stationary in a Newton's Cradle.
  - id: symmetry_change
    question: Is the configuration of the balls different from the initial state where only the left ball
      was raised?
    answer_type: yes_no
    notes_for_judge: Checks that the state has evolved and isn't identical to the start.
