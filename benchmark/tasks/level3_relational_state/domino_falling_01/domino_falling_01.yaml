prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous shot, no cuts. The finger pushes the first domino forward as interaction
    continues. While the dominoes interact, a large black board slides into the foreground from the right,
    completely blocking the view of the table and dominoes. The board remains in front of the camera for
    several seconds. Then the board slides back out to the right, revealing the table again. STOP.
  camera_WM: Single continuous shot, no cuts. The finger pushes the first domino forward as interaction
    continues. While the dominoes interact, a large black board slides into the foreground from the right,
    completely blocking the view of the table and dominoes. The board remains in front of the camera for
