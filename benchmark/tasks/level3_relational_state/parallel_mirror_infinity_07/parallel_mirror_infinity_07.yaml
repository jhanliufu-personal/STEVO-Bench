id: parallel_mirror_infinity_07
level: 3
category: relational_state
tags: []
variant_of: parallel_mirror_infinity
variation_type: combined
variation_description: Flashlight turned off (condition) + Object blocking view (occlusion).
changes:
  occlusion_method: Wooden board blocks view.
  dynamic_conditions: Flashlight switched off.
  expected_outcome_change: Reflections disappear/dark.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The person switches the flashlight off. The mirrors remain perfectly parallel. A large wooden
    board is lowered from above, completely blocking the view. The board is then raised back up to reveal
    the scene. No zoom, no cut, no scene change. STOP.
  camera_WM: The person switches the flashlight off. The mirrors remain perfectly parallel. A large wooden
    board is lowered from above, completely blocking the view. The board is then raised back up to reveal
    the scene. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A man stands in a dim industrial room between two large parallel mirrors, holding
    a lit flashlight that emits a bright orange glow. The mirrors create an infinite tunnel of reflections
    showing the man and the light repeating into the distance. The flashlight's glare is prominent in
    the center and in all reflected instances.
  init2final_edit_prompt: Edit the image to switch the flashlight off. Remove the bright orange glow and
    flare from the flashlight held by the man. Remove the corresponding orange glow and light flares from
    all the infinite reflections in the mirrors. The man and the mirrors should remain in the same position,
    but the scene should appear darker, lit only by ambient light, with the flashlight bulb appearing
    dark in both the real world and the reflections.
  rationale: The prompt specifies that the flashlight is switched off. Due to the laws of optics, extinguishing
    the primary light source must simultaneously extinguish the light in all reflections. The occlusion
    (wooden board) lowers and raises, returning the view to the original framing but with the new state
    (light off). The mirrors remain parallel, preserving the infinite regression geometry, but the lighting
    state is coupled across all reflections.
