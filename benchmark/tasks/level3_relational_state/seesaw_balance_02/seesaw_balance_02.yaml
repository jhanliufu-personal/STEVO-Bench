id: seesaw_balance_02
level: 3
category: relational_state
tags: []
variant_of: seesaw_balance
variation_type: occlusion_method
variation_description: Camera zooms out until the scene is indiscernible, then zooms back in.
changes:
  occlusion_method: Camera zoom out.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A person begins lifting the left sandbag and its seat off the ground. The motion continues.
    The camera zooms out rapidly and continuously until the playground is just a tiny, indiscernible dot
    in the distance. Then, the camera zooms back in smoothly to the exact original framing. No cut, no
    scene change. STOP.
  camera_WM: A person begins lifting the left sandbag and its seat off the ground. The motion continues.
    STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A playground scene featuring a wooden seesaw. On the left seat, which is resting
    on the ground, there is a burlap sack labeled '20 KG SAND'. The seesaw beam is tilted upwards from
    left to right. The right seat is empty and elevated in the air. The ground is covered in wood chips,
    and trees are visible in the background.
  init2final_edit_prompt: Edit the given image to show the seesaw tilted in the opposite direction. The
    left seat with the sandbag should be raised high in the air, and the right seat should be lowered
    down near the ground.
  rationale: The prompt describes a person lifting the left side of the seesaw (the side with the sandbag).
    The phrase 'the motion continues' implies that this lifting action is sustained or completed during
    the camera's zoom-out and zoom-in sequence. Due to the mechanical coupling of the seesaw, lifting
    the left side must cause the right side to descend. Therefore, in the final frame, the left seat should
    be elevated and the right seat should be lowered, reversing the initial state.
