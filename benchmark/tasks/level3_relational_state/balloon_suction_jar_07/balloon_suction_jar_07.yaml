  video_WM: The vacuum pump is connected to the sealed bell jar, but the power switch is in the OFF position.
    The system remains completely idle. Suddenly, the room lights turn off, leaving the scene in pitch
    blackness. After a duration, the lights turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The vacuum pump is connected to the sealed bell jar, but the power switch is in the OFF position.
    The system remains completely idle. Suddenly, the room lights turn off, leaving the scene in pitch
    blackness. After a duration, the lights turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A laboratory setup on a wooden table featuring a glass bell jar on the left
    containing an inflated red balloon. A hose connects the bell jar to a vacuum pump on the right. The
    pump has a silver metal casing with cooling fins, a pressure gauge on top, and a black power switch
    on the side which is in the OFF position.
  init2final_edit_prompt: Edit the given image to show the scene exactly as it was initially. The red
    balloon inside the bell jar must retain its original size, shape, and position. The vacuum pump switch
    must remain in the OFF position. Ensure the lighting and camera angle are identical to the original
    view.
  rationale: The prompt specifies that the system remains completely idle with the pump switch in the
    OFF position. The lighting change (lights off then on) serves as a passage of time but does not affect
    the physical state of the apparatus. Since the pump is never activated, the air pressure inside the
    bell jar remains constant. Consequently, the balloon does not expand or contract, preserving its initial
    volume and shape relative to the jar. The final state is visually identical to the initial state.
