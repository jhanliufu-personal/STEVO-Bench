id: billiard_break_04
level: 3
category: relational_state
tags: []
variant_of: billiard_break
variation_type: dynamic_condition
variation_description: Table surface changed from felt to shaggy carpet (high friction).
changes:
  occlusion_method: null
  dynamic_conditions: Surface is thick shaggy carpet instead of smooth felt, implying high friction.
  expected_outcome_change: The cue ball should slow down drastically or stop before reaching the rack,
    resulting in little to no scatter.
prompts:
  init_frame_edit_prompt: Edit the image to change the smooth green felt surface of the pool table to
    a thick, shaggy green carpet texture.
  video_WM: The white cue ball is struck with force, attempting to slide across the thick shaggy carpet
    toward the stationary triangle. The surface texture creates significant resistance. The camera rotates
    right until the table completely exits the view, then rotates toward the left smoothly at the same
    rate until the center of the table is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The white cue ball is struck with force, attempting to slide across the thick shaggy carpet
    toward the stationary triangle. The surface texture creates significant resistance. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A pool table covered in thick green shaggy carpet instead of felt. A standard
    triangle of pool balls is arranged at the far end. A white cue ball sits on the carpet closer to the
    camera. The room has wood paneling, a fireplace in the background, wall-mounted cues, and a three-shade
    overhead lamp illuminating the table.
  init2final_edit_prompt: Edit the given image to show the white cue ball has moved forward along the
    table and stopped closer to the triangle of colored balls. Keep the triangle of colored balls arranged
    in a tight group, appearing mostly undisturbed or only slightly shifted, reflecting the high resistance
    of the carpet surface. Ensure the camera angle and background elements remain identical to the original
    view.
  rationale: The prompt describes a physical action (striking the cue ball) occurring in a high-friction
    environment (shaggy carpet). Due to the significant resistance mentioned, the cue ball will lose momentum
    rapidly. While it will move forward during the time the camera is looked away, it is unlikely to possess
    enough energy to scatter the rack significantly upon impact, if it reaches it at all. Therefore, the
    correct final state shows the cue ball advanced but the rack largely intact, respecting the relationship
    between the surface texture and the physics of the collision.
  questions:
  - id: cue_ball_moved
    question: Has the white cue ball moved from its starting position towards the far end of the table?
    answer_type: yes_no
    notes_for_judge: The ball should be further away from the camera/closer to the rack.
  - id: cue_ball_distance
    question: Is the distance between the white cue ball and the triangle of colored balls smaller than
      in the initial frame?
    answer_type: yes_no
    notes_for_judge: 'Relational check: the gap should have closed.'
  - id: rack_integrity
    question: Does the triangle of colored balls remain mostly grouped together rather than widely scattered?
    answer_type: yes_no
    notes_for_judge: 'Physics constraint: The shaggy carpet prevents a high-energy scattering break. The
      balls should still be in or near a triangle formation.'
  - id: cue_ball_visibility
    question: Is the white cue ball clearly visible on the green surface?
    answer_type: yes_no
    notes_for_judge: Object permanence check.
  - id: background_consistency_fireplace
    question: Is the fireplace in the background still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: background_consistency_lamp
    question: Are the three overhead lamp shades still in the same position relative to the table?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
