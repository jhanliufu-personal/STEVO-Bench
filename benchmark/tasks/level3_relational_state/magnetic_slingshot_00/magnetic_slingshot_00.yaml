camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Two cylindrical metallic magnets resting on a clear, inclined acrylic rail labeled
    'FRICTIONLESS RAIL'. The rail slopes downwards from left to right. The magnets are positioned with
    their flat circular faces visible, each marked with a red letter 'N'. The upper magnet is positioned
    higher on the slope to the left, and the lower magnet is positioned further down the slope to the
    right. In the background, a whiteboard displays physics equations and a diagram of an inclined plane.
  init2final_edit_prompt: Edit the given image to show the magnets after a repulsive interaction. Move
    the lower magnet significantly further down the rail to the bottom right, near the end of the track.
    Move the upper magnet down the rail to a position approximately where the lower magnet was originally
    located. Ensure the gap between the two magnets is larger than in the original image.
  rationale: The prompt describes a magnetic repulsion scenario on a frictionless incline. The moving
    upper magnet approaches the stationary lower magnet. Due to the significant repulsion between the
    North poles, the magnets will not touch; instead, momentum will be transferred through the magnetic
    field (acting like a spring). The lower magnet will be propelled rapidly down the rail (gaining the
    momentum), while the upper magnet will decelerate significantly, likely stopping momentarily near
    the point of closest approach (roughly the lower magnet's initial position) before gravity eventually
    pulls it down again. The final state should show the lower magnet far down the track and the upper
    magnet having advanced to the lower magnet's previous zone, with a widened gap between them.
