evaluation:
  init_frame_description: A close-up shot of a clear glass on a wooden table, partially filled with hot
    water and emitting steam. A hand holds a speckled ceramic pitcher above the glass, pouring a dark,
    viscous liquid (concentrate) into the water. The dark liquid is swirling and diffusing within the
    clear water, creating a cloud-like effect. A window with natural light is visible in the background.
  init2final_edit_prompt: Edit the given image to show the glass containing a significantly darker, more
    opaque brownish-black liquid mixture. The liquid level in the glass should be visibly higher than
    in the original image. The ceramic pitcher should appear emptier, with less liquid remaining inside.
    Ensure the scene is fully illuminated with bright natural lighting matching the initial frame.
  rationale: The video prompt describes a pouring action that continues through a period of darkness.
    Conservation of volume dictates that as the pitcher empties, the glass must fill. The mixing process
    implies the water will become darker and more opaque. Since the lights turn back on at the end, the
    final frame must show the scene fully lit, with the accumulated changes in liquid volume and color
    state.
