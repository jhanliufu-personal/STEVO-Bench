id: hourglass_accumulation_05
level: 1
category: scalar_state
tags: []
variant_of: hourglass_accumulation
variation_type: dynamic_condition
variation_description: The hourglass is lying on its side, preventing flow.
changes:
  occlusion_method: null
  dynamic_conditions: Hourglass is horizontal.
  expected_outcome_change: No accumulation; sand remains settled on the side of the bulbs.
prompts:
  init_frame_edit_prompt: Edit the image so the hourglass is lying horizontally on its side on the table.
  video_WM: An hourglass lies on its side on the table. The camera rotates right until the hourglass completely
    exits the view, then rotates toward the left smoothly at the same rate until the hourglass is back
    in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: An hourglass lies on its side on the table. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A wooden hourglass lying horizontally on its side on a distressed wooden table.
    The hourglass has hexagonal wooden end-caps and three turned spindles connecting them. Inside the
    glass bulbs, sand is settled at the bottom (relative to gravity) of both the left and right chambers,
    with no sand flowing through the horizontal neck. To the left of the hourglass, there is a brass scale
    and a stack of books. In the background, a window with a wooden frame is visible, along with bookshelves
    filled with books.
  init2final_edit_prompt: Edit the given image to restore the scene exactly as it appears in the original
    frame. Ensure the hourglass remains lying on its side with the wooden end-caps oriented vertically.
    Keep the sand distribution inside the glass bulbs exactly the same, with the sand settled at the bottom
    of the horizontal bulbs and no sand flowing through the neck. Maintain the position of the brass scale,
    books, and the window background unchanged.
  rationale: The hourglass is resting on its side, meaning the channel connecting the two bulbs is horizontal.
    In this orientation, gravity acts perpendicular to the direction of flow, so the sand remains static
    in the bulbs and does not flow or accumulate. The camera pans away and then returns to the original
    position. Since no physical interaction occurs to upright the hourglass, the final state must be identical
    to the initial state, testing the model's ability to maintain a static scalar state (sand volume)
    and object permanence during occlusion.
