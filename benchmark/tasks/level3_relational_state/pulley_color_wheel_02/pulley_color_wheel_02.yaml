id: pulley_color_wheel_02
level: 3
category: relational_state
tags: []
variant_of: pulley_color_wheel
variation_type: occlusion_method
variation_description: The workshop lights turn off completely, plunging the scene into darkness.
changes:
  occlusion_method: Lighting change (pitch black)
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand turns the crank handle exactly half a rotation clockwise. The rubber belt is taut and
    moves without slipping. Suddenly, all lights in the workshop turn off, plunging the scene into complete
    pitch-black darkness where nothing is visible. After a moment, the lights turn back on to full brightness.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A hand turns the crank handle exactly half a rotation clockwise. The rubber belt is taut
    and moves without slipping. Suddenly, all lights in the workshop turn off, plunging the scene into
    complete pitch-black darkness where nothing is visible. After a moment, the lights turn back on to
    full brightness. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A workshop scene featuring a wooden mechanical setup clamped to a workbench.
    On the left, a small wooden crank mechanism with a handle is held by a person's hand; the handle is
    currently pointing upwards and to the left. A black rubber belt connects this small pulley to a much
    larger wooden wheel on the right. The large wheel has a color chart painted on its face with 12 segments
    (Yellow, Yellow-Orange, Orange, Red-Orange, Red, Red-Violet, Violet, Blue-Violet, Blue, Blue-Green,
    Green, Yellow-Green). In the initial state, the 'Yellow' segment is at the top (12 o'clock position).
    The background shows a window, a tool rack with chisels and screwdrivers, and a wooden shelf.
  init2final_edit_prompt: Edit the given image to show the wooden crank handle rotated 180 degrees clockwise,
    so it is now pointing downwards and to the right. Reposition the hand to hold the handle in this new
    location. Rotate the large color wheel clockwise by approximately 30 to 45 degrees, such that the
    'Yellow' segment is shifted to the right (around the 1 o'clock position) and the yellow-green segment
    is near the top center. Ensure the belt remains taut and connected to both pulleys.
  rationale: The prompt specifies that the crank handle is turned exactly half a rotation (180 degrees)
    clockwise. This action moves the handle from its initial up-left position to a down-right position.
    The belt connects the small crank pulley to the large color wheel. Since the belt is uncrossed, the
    large wheel also rotates clockwise. Due to the size difference (the crank pulley is significantly
    smaller than the color wheel, estimated ratio 1:4 to 1:6), the large wheel will rotate a smaller angle
    than the crank. A 180-degree turn of the crank corresponds to roughly 30-45 degrees (1 to 1.5 segments)
    of rotation on the large wheel. The lights turning off and on signifies a jump to the final state
    without showing the motion.
