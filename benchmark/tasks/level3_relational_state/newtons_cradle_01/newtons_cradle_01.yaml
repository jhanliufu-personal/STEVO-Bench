evaluation:
  init_frame_description: A close-up, eye-level shot of a Newton's Cradle on a wooden desk. The device
    consists of five metallic spheres suspended by strings from a metal frame. The far-left sphere is
    pulled back and raised to the left, creating a significant gap between it and the other four spheres,
    which are hanging vertically and touching each other in a central cluster. The background features
    a blurred green wall, a bookshelf, and a leather chair, with warm natural lighting coming from the
    left.
  init2final_edit_prompt: Edit the given image so that the far-left metal ball is hanging vertically and
    touching the left side of the central group of balls. Simultaneously, displace the far-right metal
    ball so that it is swung out to the right side and raised in the air, mirroring the height the left
    ball had initially. Ensure the three middle balls remain hanging vertically in the center.
  rationale: The video depicts the release of the raised left ball, which converts potential energy into
    kinetic energy. Upon impact with the stationary cluster, momentum is transferred through the middle
    balls to the far-right ball, causing it to swing outward and upward. The occlusion by the leather
    portfolio is a temporary event that passes; once the view is clear, the physical state of the system
    should reflect the post-collision dynamics where the left ball has come to rest (or is part of the
    swing cycle) and the right ball is in motion or raised, effectively mirroring the initial state.
