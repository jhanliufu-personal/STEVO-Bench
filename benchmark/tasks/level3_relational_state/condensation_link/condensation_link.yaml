id: condensation_link
level: 3
category: relational_state
relational_type: thermal_coupling
prompts:
  image_gen_prompt: A pot of water is boiling vigorously on a stove, producing a steady stream of steam.
    A clear, dry pane of cold glass is held six inches above the steam.
  video_WM: The glass pane is lowered until it is directly in the path of the rising steam. The water
    continues to boil and produce vapor. The camera rotates right until the stove completely exits the
    view, then rotates toward the left smoothly at the same rate until the surface of the glass pane is
    back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The cold glass pane is placed into the path of the rising steam. The thermal interaction
    between the vapor and the glass is active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A stainless steel pot filled with vigorously boiling water sits on a gas stove
    burner. Steam is rising from the water. A hand holds a rectangular clear glass pane above the pot.
    The glass pane already has some small water droplets (condensation) on its surface. The background
    features a kitchen interior with wooden cabinets.
  init2final_edit_prompt: Edit the given image to lower the glass pane significantly closer to the surface
    of the boiling water. Increase the density and size of water droplets on the glass pane to show heavy
    condensation accumulation, making the glass appear foggier and wetter. Ensure the water in the pot
    continues to show turbulent bubbles and boiling texture.
  rationale: The prompt specifies that the glass is lowered into the steam and held there while the camera
    pans away and back. This implies a passage of time where the physical process of condensation continues.
    Therefore, in the final frame, the glass must be physically lower relative to the pot than in the
    initial frame, and the amount of condensation (state of the coupled object) must have increased due
    to the continuous exposure to the steam source. The water must remain in a boiling state.
