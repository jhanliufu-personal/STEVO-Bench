prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The motorized base begins to rotate the mirror slowly clockwise. The laser pointer and the
    white screen remain fixed in place. Camera remains stationary throughout, keeping the mirror, laser
    pointer, and white screen fully in view. No zoom, no cut, no scene change. STOP.
  camera_WM: The motorized base begins to rotate the mirror slowly clockwise. The laser pointer and the
    white screen remain fixed in place. Camera remains stationary throughout, keeping the mirror, laser
    pointer, and white screen fully in view. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A physics lab setup featuring a green laser pointer mounted on a stand on the
    left, a square mirror mounted on a motorized rotational stage in the center, and a white projection
    screen on the right. A bright green laser beam travels from the pointer to the mirror, reflects off
    the mirror, and hits the screen, creating a bright green spot. A faint curved green trace is visible
    on the screen above the current beam path.
  init2final_edit_prompt: Edit the given image to show the laser spot on the white screen shifted to a
    new horizontal position, distinct from its original location. Re-draw the reflected green laser beam
    as a straight line connecting the central mirror to this new spot position. Ensure the laser pointer
    and the beam segment from the pointer to the mirror remain exactly in their original positions. Slightly
    rotate the appearance of the mirror holder to be consistent with the new reflection angle.
  rationale: The motorized base rotates the mirror, which changes the angle of incidence of the laser
    beam. According to the law of reflection, this causes the reflected beam to change direction, sweeping
    the laser spot to a new position on the screen. The laser source and the incident beam path (from
    source to mirror) remain stationary, while the reflected beam and the spot on the screen move in a
    coupled relationship.
