id: seesaw_balance_04
level: 3
category: relational_state
tags: []
variant_of: seesaw_balance
variation_type: dynamic_condition
variation_description: A heavy rock is added to the right seat. When the left sandbag is lifted, the right
  side should drop.
changes:
  occlusion_method: null
  dynamic_conditions: A heavy rock is placed on the raised right seat.
  expected_outcome_change: The right side of the seesaw drops down as the left is lifted.
prompts:
  init_frame_edit_prompt: Edit the image to place a large, heavy grey rock resting on the raised right
    seat of the seesaw.
  video_WM: A person lifts the sandbag and left seat upward, releasing the weight from that side. The
    camera rotates right until the see-saw completely exits the view, then rotates toward the left smoothly
    at the same rate until the center pivot is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A person lifts the sandbag and left seat upward, releasing the weight from that side. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A playground seesaw with a wooden beam. On the left seat, which is resting on
    the ground, sits a burlap sack labeled '20 KG SAND'. On the right seat, which is elevated in the air,
    sits a large grey rock. The seesaw pivots on a central wooden fulcrum. The background shows trees
    and a park setting.
  init2final_edit_prompt: Edit the given image to show the seesaw tipped in the opposite direction. Remove
    the sandbag from the left seat, leaving that seat empty and raised high in the air. Position the right
    side of the seesaw, which still holds the rock, down so it is resting on or near the ground. Ensure
    the beam remains straight and pivots correctly around the center.
  rationale: 'The video prompt describes lifting the left side and ''releasing the weight,'' which implies
    removing the sandbag or its downward force. In a coupled lever system, removing the weight from the
    lower side (left) causes the counterweight (rock) on the upper side (right) to drop due to gravity.
    The final state must show the seesaw inverted: the unweighted left side rises, and the weighted right
    side falls.'
