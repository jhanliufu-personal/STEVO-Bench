id: balloon_suction_jar
level: 3
category: relational_state
relational_type: pneumatic_coupling
prompts:
  image_gen_prompt: An inflated red balloon is tied and placed inside a large glass bell jar. The jar
    is connected to a powerful vacuum pump that is currently off.
  video_WM: The technician activates the vacuum pump, which begins to evacuate the air from the bell jar
    at a constant rate. The jar remains sealed. The camera rotates right until the vacuum pump completely
    exits the view, then rotates toward the left smoothly at the same rate until the balloon inside the
    jar is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The vacuum pump is active and evacuating air from the sealed bell jar containing the balloon.
    The suction is steady. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A clear glass bell jar sits on a wooden lab table. Inside the jar, a red balloon
    is tied with a string and rests on the bottom; it is inflated but not fully taut. To the right of
    the jar, a vacuum pump with a pressure gauge is connected to the jar's base by a thick hose.
  init2final_edit_prompt: Edit the given image to make the red balloon inside the glass bell jar significantly
    larger and more inflated. The balloon should appear expanded, occupying a much larger portion of the
    interior volume of the jar compared to the original size. Keep the glass jar, the hose connection,
    and the background identical to the original image.
  rationale: The vacuum pump evacuates air from the sealed bell jar, lowering the internal pressure. According
    to Boyle's Law, as the surrounding pressure drops, the gas inside the flexible balloon expands to
    equalize the pressure difference. This causes the balloon to grow significantly in volume. The camera
    pans right (causing the pump to exit the view on the left) and then pans back left to the original
    position, revealing the expanded balloon in the final frame.
