id: tension_acceleration_07
level: 3
category: relational_state
tags: []
variant_of: tension_acceleration
variation_type: combined
variation_description: Object blocking occlusion combined with a very heavy cart.
changes:
  occlusion_method: A person in a lab coat walks in front of the camera.
  dynamic_conditions: Cart mass is 100kg.
  expected_outcome_change: Cart accelerates very slowly due to high mass.
prompts:
  init_frame_edit_prompt: Edit the image to change the label on the cart to '100KG' and give the cart
    a dense, metallic appearance.
  video_WM: The suspended 5kg weight is released to pull the heavy 100kg cart. A person wearing a white
    lab coat walks directly in front of the camera, completely blocking the view of the table, then walks
    past to reveal the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The suspended 5kg weight is released to pull the heavy 100kg cart. A person wearing a white
    lab coat walks directly in front of the camera, completely blocking the view of the table, then walks
    past to reveal the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A wooden laboratory table featuring a silver metal cart labeled '100KG' positioned
    on the right side. A pulley mechanism is clamped to the front-left edge of the table. A white string
    connects the front of the cart, runs horizontally to the pulley, and suspends a hanging weight labeled
    '5KG' off the edge. A wooden meter stick and a silver stopwatch sit on the table surface near the
    cart.
  init2final_edit_prompt: Edit the given image to show the 100kg cart positioned significantly further
    to the left on the table, closer to the pulley clamp. Show the 5kg hanging weight positioned lower
    in the frame, suspended by a longer vertical section of string. Ensure the string remains taut, with
    the horizontal segment between the cart and pulley shortened corresponding to the cart's movement.
  rationale: The release of the 5kg weight creates a net force that accelerates the system. Although the
    cart is much heavier (100kg), the low-friction wheels allow it to accelerate towards the pulley (to
    the left) while the weight accelerates downwards. The occlusion by the person walking past covers
    the duration of this movement. In the final frame, the cart must be displaced to the left and the
    weight must be lower, maintaining the coupled relationship defined by the string length.
  questions:
  - id: cart_displacement
    question: Is the 100kg cart positioned further to the left than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The cart should have moved towards the pulley.
  - id: weight_drop
    question: Is the 5kg hanging weight lower vertically than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The weight falls as the cart moves.
  - id: string_horizontal_shortening
    question: Is the horizontal segment of the string (between cart and pulley) shorter than in the initial
      frame?
    answer_type: yes_no
    notes_for_judge: As the cart approaches the pulley, this length decreases.
  - id: string_vertical_lengthening
    question: Is the vertical segment of the string (holding the weight) longer than in the initial frame?
    answer_type: yes_no
    notes_for_judge: As the weight drops, this length increases.
  - id: coupled_motion_direction
    question: Did the cart move towards the pulley while the weight moved downwards?
    answer_type: yes_no
    notes_for_judge: Checks for the correct coupled directional change.
  - id: stopwatch_persistence
    question: Is the stopwatch still visible on the table?
    answer_type: yes_no
    notes_for_judge: Static object consistency.
  - id: meter_stick_persistence
    question: Is the wooden meter stick still visible on the table?
    answer_type: yes_no
    notes_for_judge: Static object consistency.
  - id: connection_maintained
    question: Does the string still appear to connect the cart to the hanging weight?
    answer_type: yes_no
    notes_for_judge: The system should remain intact.
