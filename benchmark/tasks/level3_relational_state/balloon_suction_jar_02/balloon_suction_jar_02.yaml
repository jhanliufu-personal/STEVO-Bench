variation_type: occlusion_method
variation_description: Occlusion by turning off the lights.
changes:
  occlusion_method: Room lights turn off completely (pitch black).
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The technician activates the vacuum pump, which begins to evacuate the air from the bell jar
    at a constant rate. The jar remains sealed. Suddenly, the laboratory lights turn off, plunging the
    entire scene into total darkness where nothing is visible. After a short duration, the lights turn
    back on, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The technician activates the vacuum pump, which begins to evacuate the air from the bell
    jar at a constant rate. The jar remains sealed. Suddenly, the laboratory lights turn off, plunging
    the entire scene into total darkness where nothing is visible. After a short duration, the lights
    turn back on, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A red balloon tied to a string sits inside a large, clear glass bell jar on
    a wooden laboratory table. To the right, a vacuum pump with a pressure gauge is connected to the base
    of the bell jar by a beige hose.
  init2final_edit_prompt: Edit the given image to show the red balloon inside the bell jar significantly
    expanded in size, making it appear much larger and more inflated so that it occupies a greater portion
    of the jar's interior volume.
  rationale: The prompt describes the activation of a vacuum pump, which removes air from the sealed bell
    jar. As the pressure inside the jar decreases, the air trapped inside the flexible balloon expands
    to equalize pressure (Boyle's Law). The period of darkness acts as a temporal occlusion, hiding the
    gradual expansion. When the scene becomes visible again, the balloon must be in a state of significantly
    increased volume relative to the initial frame.
