id: ballistic_pendulum
level: 3
category: relational_state
relational_type: energy_coupling
prompts:
  image_gen_prompt: A large, stationary block of wood is suspended by two long wires. A small metal projectile
    is mid-air, traveling at high velocity toward the center of the wooden block.
  video_WM: The metal projectile makes direct contact with the wooden block, embedding itself into the
    wood. The block is free to swing on its wire suspension. The camera rotates right until the block
    completely exits the view, then rotates toward the left smoothly at the same rate until the suspension
    pivot is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The high-velocity projectile impacts and embeds into the suspended wooden block. The transfer
    of kinetic energy to the coupled system is the active driver. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
