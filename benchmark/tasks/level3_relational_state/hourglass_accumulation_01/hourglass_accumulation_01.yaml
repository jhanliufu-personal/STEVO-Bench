id: hourglass_accumulation_01
level: 1
category: scalar_state
tags: []
variant_of: hourglass_accumulation
variation_type: occlusion_method
variation_description: Replaces camera rotation with a large book sliding in to block the view.
changes:
  occlusion_method: A large leather-bound book slides into the foreground, blocking the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Sand flows into the bottom of an hourglass. A large, leather-bound book slides from the right
    into the foreground, completely blocking the view of the hourglass. The book pauses for a moment,
    then slides back out to the right, revealing the hourglass again. No zoom, no cut, no scene change.
    STOP.
  camera_WM: Sand flows into the bottom of an hourglass. A large, leather-bound book slides from the right
    into the foreground, completely blocking the view of the hourglass. The book pauses for a moment,
    then slides back out to the right, revealing the hourglass again. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden hourglass standing on a worn wooden desk.
    The hourglass is centered. The top bulb is partially filled with white sand, and a stream of sand
    is falling into the bottom bulb, where a conical pile has already formed. To the left of the hourglass
    are stacks of old, leather-bound books. To the right, there are more books and a blurred bookshelf
    in the background. A window behind the hourglass provides natural backlighting.
  init2final_edit_prompt: Edit the given image to show the hourglass with a significantly larger pile
    of sand in the bottom bulb and a correspondingly lower level of sand in the top bulb. The sand pile
    in the bottom chamber should be taller and wider than in the original image. The sand level in the
    top chamber should be visibly reduced. Ensure the hourglass remains in the same position and the surrounding
    books and background remain unchanged.
  rationale: The video prompt describes a continuous physical process (sand flowing) that persists while
    the object is temporarily occluded by a book. The key state change is the transfer of mass from the
    top reservoir to the bottom reservoir. Although the view is blocked for a duration, the simulation
    must account for the passage of time. When the occluding book slides away, the final frame must reveal
    the hourglass with more sand accumulated at the bottom and less remaining at the top compared to the
    initial frame.
  questions:
  - id: sand_bottom_accumulation
    question: Is the pile of sand in the bottom bulb larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the height and width of the sand pile in the bottom glass bulb.
  - id: sand_top_depletion
    question: Is the level of sand in the top bulb lower than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check if the volume of sand in the upper reservoir has decreased.
  - id: sand_pile_height
    question: Is the peak of the sand pile in the bottom bulb higher than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Focus on the vertical growth of the sand pile.
  - id: hourglass_visibility
    question: Is the hourglass visible again after being occluded?
    answer_type: yes_no
    notes_for_judge: The occluding book should have moved out of the frame, revealing the hourglass.
  - id: sand_flow_direction
    question: Does the bottom bulb contain more sand than the initial frame?
    answer_type: yes_no
    notes_for_judge: Directional check for mass transfer.
  - id: background_consistency
    question: Are the books stacked to the left of the hourglass still in the same position?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check for static objects.
  - id: desk_consistency
    question: Is the wooden desk surface visible and unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
