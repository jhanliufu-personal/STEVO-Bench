id: parallel_mirror_infinity_10
level: 3
category: relational_state
tags: []
variant_of: parallel_mirror_infinity
variation_type: combined
variation_description: Person walks away (condition) + Camera zoom out (occlusion).
changes:
  occlusion_method: Camera zooms out until details are lost.
  dynamic_conditions: Person walks away from the mirrors.
  expected_outcome_change: Person and light are gone from the reflection corridor.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The person turns and walks away from the mirrors, exiting the space between them. The camera
    zooms out rapidly until the mirrors are small indistinguishable shapes in the distance, then zooms
    back in to the original framing. No cut, no scene change. STOP.
  camera_WM: The person turns and walks away from the mirrors, exiting the space between them. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A man stands in the center of a dim industrial room, positioned between two
    large, angled rectangular mirrors. He holds a bright orange light source (lantern or flashlight) which
    illuminates his face, jacket, and the concrete floor with a warm glow. The mirrors create an infinite
    regression of reflections (Droste effect), showing the man and the light repeated deep into the distance
    on both sides. The background features concrete walls, vertical pipes, and faint cool blue ambient
    lighting.
  init2final_edit_prompt: Edit the given image to remove the person standing in the center. Remove all
    reflections of the person from the mirrors on the left and right. The mirrors should now reflect the
    empty industrial room and the background wall behind where the person was standing. Remove the bright
    orange light source and the strong orange glow on the floor. The scene should be illuminated primarily
    by the dim, cool ambient light visible in the background. Maintain the position and angle of the mirror
    frames and the background architecture exactly as they are.
  rationale: The prompt describes the person walking away and exiting the space, followed by the camera
    zooming out and then back in to the original framing. Since the person has left the scene, the final
    frame must show the empty space between the mirrors. Crucially, because the person (the object) is
    gone, all coupled reflections of the person in the mirrors must also be gone. Additionally, since
    the person was holding the primary light source, the lighting in the final frame must shift from the
    warm orange glow to the dimmer, cooler ambient light of the room.
