variation_description: Combined lightweight foam block with curtain occlusion.
changes:
  occlusion_method: Curtain blocks view.
  dynamic_conditions: Target block is lightweight styrofoam.
  expected_outcome_change: Significant/fast swing due to low mass.
prompts:
  init_frame_edit_prompt: Edit the image to change the wooden block into a white styrofoam block.
  video_WM: The metal projectile makes direct contact with the lightweight styrofoam block, embedding
    itself into the foam. The block is free to swing on its wire suspension. A heavy dark curtain slides
    into the frame, completely obscuring the block and projectile. The curtain remains for a moment, then
    slides back out, revealing the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The metal projectile makes direct contact with the lightweight styrofoam block, embedding
    itself into the foam. The block is free to swing on its wire suspension. A heavy dark curtain slides
    into the frame, completely obscuring the block and projectile. The curtain remains for a moment, then
    slides back out, revealing the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A rectangular white styrofoam block suspended by two twisted metal cables. A
    cylindrical metal projectile is impacting the center of the block's face. A cloud of fine white debris
    and particles is spraying outwards to the left from the impact point. The background shows an industrial
    ceiling with pipes and a wall.
  init2final_edit_prompt: Edit the given image to show the styrofoam block displaced to the right side
    of the frame, with the suspension cables angled diagonally towards the right. The metal projectile
    should be fully embedded within the block, leaving only the entry hole or the rear face visible. Remove
    all flying white dust and debris particles to show clear air around the suspended block.
  rationale: The video describes a ballistic pendulum scenario where a projectile strikes and embeds into
    a suspended block. According to the conservation of momentum, the block must swing in the direction
    of the projectile's travel (to the right). The occlusion by the curtain allows time for the impact
    debris to settle and for the block to swing to a displaced position. Therefore, the final frame should
    show the block swung to the right with the projectile embedded and the air clear of dust.
