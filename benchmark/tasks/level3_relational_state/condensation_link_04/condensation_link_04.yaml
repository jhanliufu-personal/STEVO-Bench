id: condensation_link_04
level: 3
category: relational_state
tags: []
variant_of: condensation_link
variation_type: dynamic_condition
variation_description: Stove is off and water is still.
changes:
  occlusion_method: null
  dynamic_conditions: The water is cold and still; no steam is rising.
  expected_outcome_change: No condensation forms; glass remains clear.
prompts:
  init_frame_edit_prompt: Edit the image to show the water in the pot is completely still with no bubbles
    and no steam rising. Ensure the stove burner underneath appears inactive/off.
  video_WM: The glass pane is lowered over the pot of still, cold water. There is no steam rising from
    the surface. The camera rotates right until the stove completely exits the view, then rotates toward
    the left smoothly at the same rate until the surface of the glass pane is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The glass pane is suspended over a pot of still, cold water. There is no steam rising from
    the surface. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
evaluation:
  init_frame_description: A close-up, eye-level shot showing a rectangular glass pane held by a hand over
    a stainless steel pot. The glass pane is covered with significant condensation droplets. Through the
    glass, the interior of the pot is visible, containing water. The background features a wooden kitchen
    counter and cabinets.
  init2final_edit_prompt: Edit the given image to move the glass pane and the hand holding it vertically
    downwards, positioning the glass significantly closer to the rim of the pot. The vertical distance
    between the bottom edge of the glass and the water surface must be reduced. Preserve the exact pattern
    and amount of condensation droplets on the glass; do not add any new steam, fog, or mist. Ensure the
    water in the pot remains still and the background elements remain in their original positions.
  rationale: The prompt describes a physical action (lowering the glass) and a set of physical constraints
    (cold water, no steam). Because the water is cold, the thermodynamic relationship dictates that no
    new steam should be generated, and the existing condensation on the glass should not increase. The
    camera motion (panning away and back) acts as an occlusion interval to test object permanence. Upon
    returning, the glass should be in a new spatial relationship (closer to the pot) but retain its original
    surface state (droplets conserved, no new fogging).
  questions:
  - id: glass_position_relative
    question: Is the glass pane positioned closer to the pot rim than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical gap between the glass and the pot/water. It should be smaller
      in the final frame.
  - id: condensation_conservation
    question: Does the amount of condensation on the glass appear conserved relative to the initial frame
      (neither significantly increased nor disappeared)?
    answer_type: yes_no
    notes_for_judge: The water is cold, so condensation should not grow (no steam) and should not vanish
      instantly. It should look roughly the same.
  - id: no_steam_generation
    question: Is the air gap between the water surface and the glass free of visible steam or rising mist?
    answer_type: yes_no
    notes_for_judge: The prompt explicitly states 'no steam' and 'cold water'.
  - id: droplet_pattern_permanence
    question: Are the specific condensation droplets on the glass still visible and recognizable from
      the initial frame?
    answer_type: yes_no
    notes_for_judge: Tests object permanence of the texture/state on the glass.
  - id: glass_lower_in_frame
    question: Is the hand holding the glass visible in a lower vertical position within the frame compared
      to the start?
    answer_type: yes_no
    notes_for_judge: Assuming the camera pitch did not change, the object moving down should appear lower
      in pixel coordinates.
  - id: water_state_still
    question: Does the water surface in the pot appear still and flat?
    answer_type: yes_no
    notes_for_judge: 'Constraint check: ''still, cold water''.'
