prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The black concentrate is poured into the water. The pitcher is visibly emptying. The total
    volume of concentrate is conserved. Camera remains stationary throughout. No zoom, no cut, no scene
    change. STOP.
  camera_WM: The black concentrate is poured into the water. The pitcher is visibly emptying. The total
    volume of concentrate is conserved. Camera remains stationary throughout. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a clear glass on a wooden table, containing hot water with
    dark swirls of liquid beginning to mix. A small, speckled ceramic pitcher is held above the glass,
    pouring a steady stream of dark black concentrate into the water. Steam is rising from the glass.
    A window with a white frame is visible in the blurred background.
  init2final_edit_prompt: Edit the given image to show the result of continuing to pour the liquid. The
    level of black liquid remaining inside the ceramic pitcher should be visibly lower than in the original
    image. The liquid level in the glass should be higher than in the original image. The liquid inside
    the glass should appear significantly darker, more opaque, and more thoroughly mixed with the black
    concentrate.
  rationale: The prompt describes a pouring action where a dark concentrate is transferred from a pitcher
    to a glass of water. Physically, this requires the volume in the source (pitcher) to decrease and
    the volume in the destination (glass) to increase (conservation of volume). As the dark concentrate
    mixes with the water, the overall opacity and darkness of the liquid in the glass must increase (diffusion/mixing).
    The camera is stationary, so the background remains unchanged.
