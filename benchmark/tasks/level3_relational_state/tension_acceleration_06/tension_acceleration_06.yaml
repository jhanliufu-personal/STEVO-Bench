id: tension_acceleration_06
level: 3
category: relational_state
tags: []
variant_of: tension_acceleration
variation_type: dynamic_condition
variation_description: The string connecting the mass and cart is cut/disconnected.
changes:
  occlusion_method: null
  dynamic_conditions: String is severed/disconnected.
  expected_outcome_change: No movement of the cart; the hanging mass falls but does not pull the cart.
prompts:
  init_frame_edit_prompt: Edit the image so the string is cut and lying slack on the table surface, clearly
    disconnected from the pulley system.
  video_WM: The suspended 5kg weight is released. The string connecting it to the cart is severed and
    disconnected. The camera rotates right until the pulley completely exits the view, then rotates toward
    the left smoothly at the same rate until the cart's starting position is back in the center of view.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The suspended 5kg weight is released. The string connecting it to the cart is severed and
    disconnected. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A wooden laboratory table featuring a plastic cart labeled '1KG' with black
    wheels. A white string is attached to the front of the cart, running horizontally across the table
    to a metal pulley clamped to the edge of the table. The string passes over the pulley and hangs down.
    A wooden meter stick and a silver stopwatch are lying on the table near the string path. The background
    shows a classroom environment with stools and other lab tables.
  init2final_edit_prompt: Edit the given image to show the string connecting the cart to the pulley has
    been severed. The string on the table should appear slack, wavy, or disconnected, rather than a straight
    taut line. The cart labeled '1KG' must remain in its exact original position. The pulley should no
    longer have a taut string running over it connecting to the cart. Keep the stopwatch, meter stick,
    and background details identical to the original.
  rationale: The prompt describes the string being severed and disconnected. Physically, this removes
    the tension force that would otherwise pull the cart. Since the connection is broken, the cart does
    not accelerate and remains in its initial position. The camera movement pans away and then returns
    to the original view, so the final frame should show the scene from the same perspective but with
    the string slack or cut, indicating the decoupling of the system.
