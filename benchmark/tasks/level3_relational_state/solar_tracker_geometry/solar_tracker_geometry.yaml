id: solar_tracker_geometry
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: A large solar panel on a motorized tracker in a desert. The sun is low on the horizon,
    and the panel is currently tilted 45 degrees toward the sky.
  video_WM: The motorized tracker is active, and the solar panel begins tilting slowly and steadily further
    down toward the horizon. The sun remains bright and low in the sky. The camera rotates right until
    the panel completely exits the view, then rotates toward the left smoothly at the same rate until
    the shadow cast by the panel is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The motorized tracker tilts the solar panel further toward the horizon under the bright,
    low sun. The motion is constant. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A large, rectangular solar panel array mounted on a motorized tracker in a desert
    environment. The panel is supported by a metal truss structure and a large gear mechanism on a central
    pillar. The panel is currently tilted upwards, facing roughly towards the right where the sun is low
    on the horizon (sunset or sunrise). The sky is a gradient of orange and purple. A shadow is cast by
    the structure onto the sandy ground to the left.
  init2final_edit_prompt: Edit the given image to rotate the solar panel so it is tilted significantly
    further down towards the right horizon. The panel should appear more vertical, facing the sun on the
    right more directly than before. The top edge of the panel should be lower and shifted to the right,
    consistent with a clockwise rotation around the central gear hub. Adjust the shadow on the ground
    to correspond to this steeper, more vertical orientation of the panel.
  rationale: The video prompt describes the solar panel tilting 'down toward the horizon' (towards the
    sun) while the camera pans away and back. During the occlusion caused by the camera panning right
    and then left, the panel continues its slow steady motion. When the camera returns to center the shadow,
    the panel will have progressed in its trajectory, resulting in a steeper angle (more vertical) facing
    the sun. The camera framing is determined by the shadow's position, which keeps the view centered
    on the apparatus.
  questions:
  - id: panel_angle_steepness
    question: Is the solar panel oriented more vertically (steeper angle relative to the ground) than
      in the initial frame?
    answer_type: yes_no
    notes_for_judge: The panel should have rotated to face the horizon more directly, making it appear
      less flat/tilted up and more vertical.
  - id: panel_facing_sun
    question: Is the face of the solar panel directed more towards the sun (on the right) compared to
      the initial frame?
    answer_type: yes_no
    notes_for_judge: The rotation is described as 'down toward the horizon', meaning the normal vector
      points more towards the sun.
  - id: top_edge_position
    question: Is the top edge of the solar panel positioned lower relative to the central pivot than it
      was initially?
    answer_type: yes_no
    notes_for_judge: As the panel tilts down towards the right, the highest point (top left in 2D projection)
      should move down/right.
  - id: shadow_presence
    question: Is the shadow cast by the panel visible on the ground?
    answer_type: yes_no
    notes_for_judge: The camera movement explicitly returns to center the shadow.
  - id: structural_integrity
    question: Is the solar panel still physically connected to the central gear mechanism?
    answer_type: yes_no
    notes_for_judge: Tests for object permanence and relational constraints during the edit.
  - id: sun_position_consistency
    question: Is the sun still positioned low on the right horizon?
    answer_type: yes_no
    notes_for_judge: The environment should remain stable.
  - id: rotation_direction
    question: Does the change in the panel's position correspond to a rotation towards the right side
      of the image?
    answer_type: yes_no
    notes_for_judge: The tilt is towards the horizon (right).
