id: anamorphic_projection_02
level: 3
category: relational_state
tags: []
variant_of: anamorphic_projection
variation_type: occlusion_method
variation_description: Occlusion by turning off the lights (pitch black).
changes:
  occlusion_method: Room lights turn off completely.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (drawing rotates), different occlusion.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand begins rotating the flat drawing on the table around the base of the cylindrical mirror.
    The mirror remains stationary. Suddenly, the room lights turn off, plunging the scene into complete
    darkness. After a few seconds, the lights turn back on, illuminating the table again. No zoom, no
    cut, no scene change. STOP.
  camera_WM: A hand begins rotating the flat drawing on the table around the base of the cylindrical mirror.
    The mirror remains stationary. Suddenly, the room lights turn off, plunging the scene into complete
    darkness. After a few seconds, the lights turn back on, illuminating the table again. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A shiny cylindrical metal mirror stands vertically in the center of a white
    sheet of paper resting on a wooden table. The paper contains a distorted anamorphic drawing composed
    of swirling lines in blue, brown, black, and green. In the reflection of the cylinder, these distorted
    lines are optically corrected to show a clear, realistic image of a woman's face looking forward.
  init2final_edit_prompt: Edit the given image to show the sheet of paper rotated to a different angle
    around the stationary central cylinder. The pattern of swirling lines on the paper must appear rotated
    relative to the table. Consequently, update the reflection in the cylindrical mirror to show a different,
    distorted pattern of lines, ensuring the woman's face is no longer centered or clearly visible. Keep
    the table and cylinder position identical to the original, and ensure the scene is fully illuminated.
  rationale: The video prompt describes a rotation of the anamorphic drawing around the base of the stationary
    mirror. Anamorphic images rely on precise alignment between the distorted drawing, the mirror curvature,
    and the viewing angle. Rotating the paper breaks this alignment. Therefore, in the final state, the
    paper's pattern will be oriented differently, and the reflection in the mirror will no longer show
    the coherent face, but rather a distorted or shifted version of the drawing. The lighting returns
    to normal after the blackout.
