id: condensation_link_06
level: 3
category: relational_state
tags: []
variant_of: condensation_link
variation_type: dynamic_condition
variation_description: A lid is placed on the pot, blocking steam.
changes:
  occlusion_method: null
  dynamic_conditions: Pot is covered by a lid; steam is contained.
  expected_outcome_change: No condensation forms on the glass.
prompts:
  init_frame_edit_prompt: Edit the image to place a metal lid securely on top of the pot, covering the
    water completely so no steam escapes.
  video_WM: The glass pane is lowered over the covered pot. The metal lid contains the boiling water and
    prevents steam from rising to the glass. The camera rotates right until the stove completely exits
    the view, then rotates toward the left smoothly at the same rate until the surface of the glass pane
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The glass pane is lowered over the covered pot. The metal lid contains the boiling water
    and prevents steam from rising to the glass. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, eye-level shot of a large stainless steel stock pot with a matching
    metal lid sitting on a gas stove burner. The pot is centered in the lower foreground. To the left
    is a dark, reflective vertical surface, possibly an oven door or backsplash. The background features
    a wooden kitchen counter with a knife block, a toaster, jars, and other kitchen utensils, which are
    slightly out of focus. The lighting is warm and directional, creating highlights on the metal pot
    and lid.
  init2final_edit_prompt: Edit the given image to show the scene viewed through a newly added clear glass
    pane in the immediate foreground. The glass pane must be perfectly transparent and free of any condensation,
    fog, steam, or water droplets. The stainless steel pot and its metal lid should be seen clearly and
    sharply through the glass, appearing exactly as they did initially. The background and lighting remain
    unchanged.
  rationale: 'The video prompt describes a scenario where a glass pane is lowered over a pot of boiling
    water. However, a critical constraint is provided: the metal lid is on the pot and explicitly ''prevents
    steam from rising to the glass''. This establishes a causal relationship where the containment of
    the steam by the lid preserves the clarity of the glass pane. Despite the camera rotation and the
    passage of time, the final state must reflect this constraint. Therefore, the glass pane in the final
    frame should be clear and transparent, not foggy or covered in condensation, as the steam is trapped
    inside the pot.'
