id: silhouette_rotation_disk_01
level: 3
category: relational_state
tags: []
variant_of: silhouette_rotation_disk
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to lights turning off completely.
changes:
  occlusion_method: Lights turn off (pitch black) then turn back on
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The motorized base begins to rotate the flat circular disk slowly and steadily by exactly
    90 degrees around its vertical axis. The spotlight and screen remain fixed in place. Suddenly, the
    spotlight turns off completely, plunging the room into absolute darkness. After a brief pause, the
    spotlight turns back on to illuminate the scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: The motorized base begins to rotate the flat circular disk slowly and steadily by exactly
    90 degrees around its vertical axis. The spotlight and screen remain fixed in place. Suddenly, the
    spotlight turns off completely, plunging the room into absolute darkness. After a brief pause, the
    spotlight turns back on to illuminate the scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A studio setting featuring a large, flat, circular metal disk mounted vertically
    on a motorized turntable in the center. To the left, a spotlight is illuminated, pointing towards
    the disk. To the right, a large white diffusion screen captures the shadow of the disk. In this initial
    state, the disk is oriented edge-on to the camera (appearing as a thin vertical line), which means
    its flat face is perpendicular to the light beam, casting a perfect circular shadow on the screen.
  init2final_edit_prompt: Edit the given image to show the central metal disk rotated 90 degrees so that
    its flat circular face is fully visible to the camera. Correspondingly, change the shadow on the white
    screen from a large circle to a thin vertical line or narrow rectangular strip, representing the edge
    profile of the disk. Ensure the spotlight is on and the scene is illuminated.
  rationale: The prompt specifies a rotation of exactly 90 degrees. Geometrically, the disk starts edge-on
    to the camera and face-on to the light source (hence the circular shadow). A 90-degree rotation around
    the vertical axis places the disk face-on to the camera and edge-on to the light source. Therefore,
    the visual state must show the full circle of the disk and a shadow that has collapsed into a thin
    vertical strip. The blackout event is a distractor testing state permanence; the final frame must
    show the scene illuminated again with the completed rotation.
