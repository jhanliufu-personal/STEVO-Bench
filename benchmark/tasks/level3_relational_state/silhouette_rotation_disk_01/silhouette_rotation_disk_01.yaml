id: silhouette_rotation_disk_01
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: "A bright, stationary spotlight shines on a large white screen. Between them sits a solid, flat, circular metal disk standing vertically on its thin edge on a motorized rotating base. The current shadow cast on the screen is a large, perfect full circle."
  video_WM: "The motorized base begins to rotate the flat circular disk slowly and steadily by exactly 90 degrees around its vertical axis. The spotlight and screen remain fixed in place. The camera rotates right until the disk completely exits the view, then rotates toward the left smoothly at the same rate until the white screen is back in the center of view. No zoom, no cut, no scene change. STOP."
  camera_WM: "The flat circular disk rotates exactly 90 degrees on its vertical axis while positioned between the fixed light source and the screen. The geometric projection is maintained. STOP."
camera_control:
  HY-WorldPlay: "s-3, right-30, left-30"