id: anamorphic_projection_07
level: 3
category: relational_state
tags: []
variant_of: anamorphic_projection
variation_type: combined
variation_description: Static scene (no rotation) occluded by thick fog.
changes:
  occlusion_method: Thick fog obscures the view.
  dynamic_conditions: No movement.
  expected_outcome_change: No change in state.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The distorted drawing and cylindrical mirror sit motionless on the table. Thick white fog
    rolls across the table, completely obscuring the cylinder and drawing from view. The fog slowly dissipates,
    revealing the table again. No zoom, no cut, no scene change. STOP.
  camera_WM: The distorted drawing and cylindrical mirror sit motionless on the table. Thick white fog
    rolls across the table, completely obscuring the cylinder and drawing from view. The fog slowly dissipates,
    revealing the table again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A reflective metal cylinder stands vertically in the center of a piece of paper
    on a wooden table. The paper features a distorted, swirling anamorphic drawing of colored lines. The
    reflection on the curved surface of the cylinder optically corrects the distortion, revealing a clear
    image of a woman's face.
  init2final_edit_prompt: Edit the given image to show the scene clearly visible again. Ensure the cylindrical
    mirror remains in the exact same position on the paper. The reflection in the cylinder must still
    show the woman's face, maintaining the precise optical alignment and color consistency with the distorted
    drawing on the paper. The drawing and the table surface should be visible and unchanged.
  rationale: The prompt describes a static scene where objects are explicitly stated to be motionless.
    A temporary occlusion (fog) occurs and then clears. Therefore, the final state must be identical to
    the initial state, testing the model's ability to maintain object permanence and the complex relational
    constraint of the anamorphic reflection (the coupling between the distorted drawing and the corrected
    reflection) through a period of zero visibility.
