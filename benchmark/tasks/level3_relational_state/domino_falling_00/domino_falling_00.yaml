prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: Single continuous shot, no cuts or zoom. Camera is centered on the domino row. The finger
    pushes the first domino forward. Camera remains stationary throughout.
  camera_WM: Single continuous shot, no cuts or zoom. Camera is centered on the domino row. The finger
