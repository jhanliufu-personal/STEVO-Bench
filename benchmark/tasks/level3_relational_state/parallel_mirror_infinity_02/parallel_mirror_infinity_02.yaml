  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The person begins to tilt the flashlight 45 degrees toward the ceiling. The mirrors remain
    perfectly parallel. Suddenly, all lights in the room go out, plunging the scene into total darkness.
    After a moment, the lights turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: The person begins to tilt the flashlight 45 degrees toward the ceiling. The mirrors remain
    perfectly parallel. Suddenly, all lights in the room go out, plunging the scene into total darkness.
    After a moment, the lights turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A wide shot of a man standing in an industrial room between two large parallel
    mirrors. He is holding a flashlight that emits a bright orange glow, pointing it generally forward.
    The mirrors create an infinite reflection effect (mise en abyme), showing repeated reflections of
    the man and the glowing flashlight extending into the distance on both the left and right sides. The
    room has a concrete floor and dim ambient lighting.
  init2final_edit_prompt: Edit the given image to show the person holding the flashlight tilted upwards
    at a 45-degree angle toward the ceiling. Ensure that all reflections of the person in the mirrors
    on both the left and right sides are updated to show the flashlight tilted upwards at the same angle,
    maintaining consistent geometric perspective in the infinite corridor of reflections.
  rationale: The video prompt describes a sequence where the person changes their pose (tilting the flashlight)
    followed by a temporary blackout. The final state occurs after the lights have turned back on. Therefore,
    the final frame must show the scene fully illuminated again, but with the flashlight in its new upward-tilted
    position. Crucially, because the mirrors are coupled to the reality of the scene, the infinite reflections
    must all update to reflect this new angle, demonstrating that the world model understands the relational
    constraint of mirror reflection.
