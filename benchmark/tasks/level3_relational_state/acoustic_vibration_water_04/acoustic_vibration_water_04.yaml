  init_frame_description: A close-up, eye-level shot of a physics experiment setup on a dark table. A
    large, rusty tuning fork is clamped horizontally in a wooden block on the left side. A clear glass
    bowl filled with water is positioned on the right, with the fork's prongs extending near the bowl's
