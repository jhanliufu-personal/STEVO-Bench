    is calm and reflects the window light from the background.
  init2final_edit_prompt: Edit the given image to show the glass bowl of water as the central focus of
    the frame. The water surface must be completely smooth, glassy, and still, with absolutely no ripples
    or waves. The tuning fork and wooden block remain on the left side, appearing stationary and unchanged.
    The rubber mallet remains lying on the table in the foreground in its original position. The scene
    lighting and object arrangement are preserved, showing a static state.
  rationale: The video prompt explicitly states that the tuning fork is stationary and silent, and the
    mallet remains resting on the table. The camera pans away and then returns to center on the water,
    but no physical interaction occurs. The primary challenge is for the model to respect the negative
    constraint (no action) and maintain the conservation of the static state, specifically ensuring the
    water remains calm despite the camera motion and the presence of objects typically associated with
    vibration.
