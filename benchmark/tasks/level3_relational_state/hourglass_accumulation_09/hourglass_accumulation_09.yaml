id: hourglass_accumulation_09
level: 1
category: scalar_state
tags: []
variant_of: hourglass_accumulation
variation_type: combined
variation_description: Combines camera zoom occlusion with a blocked neck condition.
changes:
  occlusion_method: Camera zoom.
  dynamic_conditions: Neck blocked by pebble.
  expected_outcome_change: No accumulation.
prompts:
  init_frame_edit_prompt: Edit the image to show a small dark pebble stuck in the neck of the hourglass,
    preventing the sand in the top bulb from flowing down.
  video_WM: An hourglass stands on the table, but a pebble blocks the neck, stopping the sand flow. The
    camera zooms out rapidly until the hourglass is too small to distinguish details, merging into the
    background. Then, the camera zooms back in to the original framing. No cut, no scene change. STOP.
  camera_WM: An hourglass stands on the table, but a pebble blocks the neck, stopping the sand flow. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A close-up of a wooden hourglass on a desk. The top bulb is filled with white
    sand. The bottom bulb contains a small, static pile of sand. A dark pebble or rock is clearly lodged
    in the narrow neck of the hourglass, blocking the flow of sand. In the background, there are bookshelves
    filled with books and a window providing natural light.
  init2final_edit_prompt: Edit the given image to show the hourglass in the exact same state as the original.
    Ensure the dark pebble remains stuck in the neck. The volume of sand in the top bulb must remain unchanged,
    appearing full. The small pile of sand in the bottom bulb must remain the same height and size, with
    no new accumulation. Maintain the original lighting, background books, and desk details.
  rationale: The prompt explicitly states that a pebble blocks the neck and stops the sand flow. Although
    the camera zooms out and back in, implying the passage of time and a temporary loss of detail, the
    physical constraint (the blockage) dictates that the sand levels must not change. The correct final
    state is identical to the initial state regarding the sand volume in both bulbs, testing the model's
    ability to prioritize the text constraint over the visual prior of an hourglass flowing.
  questions:
  - id: top_sand_level_constant
    question: Is the amount of sand in the top bulb approximately the same as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The sand level should not have decreased because the flow is blocked.
  - id: bottom_sand_pile_size
    question: Is the pile of sand in the bottom bulb roughly the same size as it was initially?
    answer_type: yes_no
    notes_for_judge: The pile should not have grown.
  - id: pebble_presence
    question: Does the pebble still appear to block the neck of the hourglass?
    answer_type: yes_no
    notes_for_judge: The blockage must persist.
  - id: no_depletion_top
    question: Has the sand in the top bulb remained without noticeable depletion?
    answer_type: yes_no
    notes_for_judge: Check for conservation of the upper mass.
  - id: no_accumulation_bottom
    question: Is the bottom bulb free of significant new sand accumulation?
    answer_type: yes_no
    notes_for_judge: The pile should not be significantly higher.
  - id: relative_volume
    question: Is the top bulb still significantly fuller than the bottom bulb?
    answer_type: yes_no
    notes_for_judge: The ratio of sand top-to-bottom should remain high.
  - id: background_consistency_books
    question: Are the books on the shelf in the background still visible?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: hourglass_structure
    question: Is the wooden frame of the hourglass still intact?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
