id: billiard_break_07
level: 3
category: relational_state
tags: []
variant_of: billiard_break
variation_type: combined
variation_description: High friction surface combined with lights-off occlusion.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: High friction shaggy carpet surface.
  expected_outcome_change: Ball slows/stops due to friction.
prompts:
  init_frame_edit_prompt: Edit the image to change the smooth green felt surface of the pool table to
    a thick, shaggy green carpet texture.
  video_WM: The white cue ball is struck with force across the thick shaggy carpet toward the stationary
    triangle. The surface texture creates significant resistance. Suddenly, the room lights turn off completely,
    plunging the scene into pitch black darkness. After a few seconds, the lights turn back on, revealing
    the table again. No zoom, no cut, no scene change. STOP.
  camera_WM: The white cue ball is struck with force across the thick shaggy carpet toward the stationary
    triangle. The surface texture creates significant resistance. Suddenly, the room lights turn off completely,
    plunging the scene into pitch black darkness. After a few seconds, the lights turn back on, revealing
    the table again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A pool table covered in a thick, green shaggy carpet instead of felt. In the
    foreground, a full rack of 15 colored pool balls is arranged in a tight triangle. In the background,
    centered on the table, is a single white cue ball. Above the table hangs a three-shade lighting fixture.
    The room has wood paneling and a fireplace in the background.
  init2final_edit_prompt: Edit the given image to show the white cue ball having moved from the background
    to the foreground, now resting near or against the triangle of colored balls. The triangle of balls
    should be slightly disrupted, with the balls shifted relative to each other, breaking the perfect
    triangular formation. Ensure the lighting is fully on and the shaggy carpet texture is preserved.
  rationale: The cue ball is struck with force towards the rack. Due to the high friction of the shaggy
    carpet, the ball will decelerate rapidly but, given the applied force, should reach the rack. The
    impact will be dampened by the carpet, causing the rack to shift or crumble slightly rather than scattering
    widely. The lights turning off and on serves as a temporal occlusion, skipping the travel time. The
    final state should show the cue ball near the rack and the rack slightly disturbed.
