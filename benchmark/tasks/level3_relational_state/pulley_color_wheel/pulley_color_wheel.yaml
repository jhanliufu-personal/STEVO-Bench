id: pulley_color_wheel
level: 3
category: relational_state
relational_type: mechanical_coupling
prompts:
  image_gen_prompt: A hand-crank is connected by a tight rubber belt to a large color wheel three feet
    away. The color wheel is currently showing 'Yellow' at the 12 o'clock position.
  video_WM: A hand turns the crank handle exactly half a rotation clockwise. The rubber belt is taut and
    moves without slipping. The camera rotates right until the crank completely exits the view, then rotates
    toward the left smoothly at the same rate until the color wheel is back in the center of view. No
    zoom, no cut, no scene change. STOP.
  camera_WM: The crank is rotated half a turn, driving the connected color wheel via the belt. The mechanical
    link is active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: 'A workshop scene featuring a wooden hand-crank mechanism on the left and a
    large wooden color wheel on the right. A black rubber belt connects the small pulley on the crank
    to the outer rim of the color wheel. The color wheel has 12 painted segments, with the ''Yellow''
    segment currently at the top (12 o''clock) position. The segments are arranged clockwise: Yellow,
    Yellow-Orange, Orange, etc. To the left of Yellow is Yellow-Green. A person''s hand is holding the
    wooden crank handle, which is positioned near the top of its rotation.'
  init2final_edit_prompt: Edit the given image to show the result of the crank turning half a rotation
    clockwise. Rotate the crank handle 180 degrees so it points downwards. Reposition the hand to hold
    the handle in this new lower position. Rotate the large color wheel clockwise by approximately 30
    degrees (one segment). The 'Yellow' segment should shift from the top center to the right (approximately
    the 1 o'clock position). The 'Yellow-Green' segment should move into the top center position. Ensure
    the belt remains taut and connected.
  rationale: The crank turns 180 degrees clockwise. Since the belt connects the top of the crank pulley
    to the top of the color wheel, the clockwise motion (top moving right) is transmitted to the wheel,
    causing it to also rotate clockwise. Due to the significant size difference between the small crank
    pulley and the large color wheel (estimated ratio roughly 6:1), the wheel rotates a much smaller angle
    than the crank—approximately 30 degrees. This corresponds to a shift of one color segment. Consequently,
    the 'Yellow' segment moves from 12 o'clock to roughly 1 o'clock, and the segment to its left (Yellow-Green)
    moves to the top.
