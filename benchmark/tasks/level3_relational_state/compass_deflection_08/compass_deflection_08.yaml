id: compass_deflection_08
level: 3
category: relational_state
tags: []
variant_of: compass_deflection
variation_type: combined
variation_description: Magnet moves away + occlusion by lights turning off.
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Magnet moves away.
  expected_outcome_change: Needle returns toward North.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand begins moving the bar magnet steadily away from the side of the compass housing. Suddenly,
    all lights in the room turn off, plunging the scene into total darkness. After a brief period, the
    lights turn back on. No zoom, no cut, no scene change. STOP.
  camera_WM: A hand begins moving the bar magnet steadily away from the side of the compass housing. Suddenly,
    all lights in the room turn off, plunging the scene into total darkness. After a brief period, the
    lights turn back on. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a wooden table. On the left is a brass
    compass with its lid open; the needle is oriented horizontally with the white/silver tip pointing
    to the right and the red tip pointing to the left. On the right, a hand holds a rectangular bar magnet
    with the red (North) pole facing the compass and the blue (South) pole facing away. A wooden ruler
    lies in the foreground, and a window is visible in the background.
  init2final_edit_prompt: Edit the given image to move the hand and bar magnet significantly further to
    the right side of the frame, increasing the gap between the magnet and the compass. Edit the compass
    needle to rotate it to a new angle (e.g., pointing diagonally or vertically) so that it is no longer
    aligned horizontally with the magnet's previous position.
  rationale: The initial frame shows a compass needle strongly deflected by a nearby magnet (the red North
    pole of the magnet attracts the South-seeking white tip of the needle). As the prompt describes moving
    the magnet away, the magnetic force exerted on the needle decreases significantly. Consequently, the
    compass needle must rotate back towards alignment with the Earth's ambient magnetic field. The lights
    turning off and on serve as a transition to the new state where the magnet is further away and the
    needle has reoriented.
