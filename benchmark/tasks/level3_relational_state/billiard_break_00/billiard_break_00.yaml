camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A green pool table viewed from the foot end. In the immediate foreground, a
    set of 15 billiard balls is arranged in a tight triangular rack with the apex ball facing away from
    the camera. In the background, at the far end of the table, a white cue ball sits on the felt. The
    room features wood paneling, a fireplace on the right, a cue rack on the left, and a three-shade light
    fixture hanging above the table.
  init2final_edit_prompt: Edit the given image to show the aftermath of a pool break shot. The triangular
    formation of colored balls in the foreground must be completely scattered, with the balls dispersed
    randomly across the green felt surface in different directions. The white cue ball must be moved from
    its distant background position to a new location on the table, potentially amidst the scattered balls.
    The background room, fireplace, and lighting must remain exactly unchanged.
  rationale: The prompt describes a break shot, which is a high-energy collision event. The cue ball travels
    from the head of the table (background) to the foot (foreground), striking the stationary rack. Upon
    impact, the conservation of momentum and energy transfer causes the tightly packed object balls to
    scatter rapidly in all directions across the table surface. The final state represents a transition
    from a highly ordered state (the rack) to a disordered state (scattered balls), while the static environment
    remains constant.
