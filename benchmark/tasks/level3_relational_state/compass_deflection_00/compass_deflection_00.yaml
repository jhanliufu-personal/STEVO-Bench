evaluation:
  init_frame_description: A close-up, eye-level shot of a wooden table featuring a brass compass on the
    left and a bar magnet held by a hand on the right. The compass is open, revealing a needle with a
    red tip and a silver tip; the needle is currently oriented diagonally, with the red tip pointing roughly
    toward the upper-left and the silver tip toward the lower-right. To the right, a hand holds a rectangular
    bar magnet with a red half (left, facing the compass) and a blue half (right). A wooden ruler lies
    horizontally in the foreground. A window with a white frame is visible in the blurred background.
  init2final_edit_prompt: Edit the given image to show the bar magnet positioned significantly closer
    to the compass, with the red end of the magnet now located just near the right edge of the compass
    housing. Rotate the compass needle so that it aligns horizontally with the magnet, specifically with
    the silver tip pointing directly towards the red end of the magnet and the red tip pointing directly
    away to the left. Ensure the wooden ruler, table surface, and background window remain unchanged.
  rationale: The action involves moving a strong magnet closer to a compass. According to magnetic principles,
    the red end of a standard bar magnet is the North pole. The compass needle is a lightweight magnet
    where the red tip is North and the silver tip is South. Since opposite poles attract and like poles
    repel, the approaching North pole (red magnet end) will attract the South pole (silver needle tip)
    and repel the North pole (red needle tip). As the magnet gets closer and its field overpowers the
    Earth's ambient field, the needle will rotate to align itself with the magnet's field lines, pointing
    the silver tip directly at the magnet.
