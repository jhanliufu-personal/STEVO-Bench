prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A mechanical finger begins pressing the plunger of the left syringe. The two syringes are
    connected. The pressing continues at a constant rate. A large opaque medical clipboard moves into
    the foreground, completely blocking the view of the tray. It pauses briefly, then moves away to reveal
    the tray again. No zoom, no cut, no scene change. STOP.
  camera_WM: A mechanical finger begins pressing the plunger of the left syringe. The two syringes are
    connected. The pressing continues at a constant rate. A large opaque medical clipboard moves into
    the foreground, completely blocking the view of the tray. It pauses briefly, then moves away to reveal
    the tray again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: Two large plastic syringes lying on a metal tray lined with a white cloth. The
    left syringe is filled with red liquid, and its plunger is extended to approximately the 50ml mark.
    The right syringe is mostly empty, with its plunger fully pushed in. A clear flexible tube filled
    with red liquid connects the nozzles of the two syringes.
  init2final_edit_prompt: Edit the given image so that the plunger of the left syringe is pushed significantly
    further into the barrel, leaving much less red liquid inside. Correspondingly, edit the right syringe
    so that its plunger is pulled out/extended significantly, and its barrel is filled with the red liquid
    transferred from the left syringe. Keep the tubing connected and filled with red liquid.
  rationale: 'The prompt describes a hydraulic system where the left syringe is compressed. Because the
    system is connected and filled with incompressible fluid, pressing the left plunger forces the red
    liquid through the tube and into the right syringe. This hydraulic pressure forces the right plunger
    to extend. The final state must show the conservation of volume: the left syringe should be emptier
    (plunger in) and the right syringe should be fuller (plunger out).'
