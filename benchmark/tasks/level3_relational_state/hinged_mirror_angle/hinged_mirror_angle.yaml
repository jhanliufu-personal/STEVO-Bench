id: hinged_mirror_angle
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: Two mirrors are joined by a hinge at a 90-degree angle. A single red apple is placed
    in the corner between them, resulting in three visible reflections.
  video_WM: A mechanical arm grabs the edge of one mirror and begins slowly closing the hinge, decreasing
    the angle between the two mirrors. The apple remains stationary. The camera rotates right until the
    mirrors completely exit the view, then rotates toward the left smoothly at the same rate until the
    intersection of the two mirrors is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The angle between the two hinged mirrors is steadily decreased while the apple remains in
    place. The reflective geometry is active. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: Two rectangular mirrors joined by a vertical brass hinge standing on a wooden
    table. The mirrors are angled open, creating an obtuse or near-90-degree angle. A red apple sits on
    the table directly in front of the hinge. Reflections of the apple are visible in both mirror panels.
    The background shows a room with windows and white walls.
  init2final_edit_prompt: Edit the given image to show the two mirrors folded closer together, creating
    a significantly narrower, acute angle at the central hinge. The outer vertical edges of the mirrors
    should be positioned closer to the central apple. Ensure the apple remains stationary in the center
    of the table. The reflections in the mirrors should update to reflect the new, sharper angle.
  rationale: The video prompt describes an action where the hinge is closed, decreasing the angle between
    the mirrors. Although the camera pans away and then returns, the physical state of the mirrors must
    persist and evolve according to the action. Therefore, in the final frame, the mirrors must be in
    a more closed configuration (narrower angle) relative to the stationary apple.
