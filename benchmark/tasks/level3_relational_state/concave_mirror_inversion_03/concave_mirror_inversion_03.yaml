id: concave_mirror_inversion_03
level: 3
category: relational_state
tags: []
variant_of: concave_mirror_inversion
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to camera physically moving away.
changes:
  occlusion_method: Camera moves backward out of the room instead of rotating.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The candle is moved steadily closer to the silver bowl, passing through the focal point of
    the curvature. The flame remains lit. The camera physically moves backward away from the table until
    the bowl is too small to discern, then moves forward returning to the original position. No zoom,
    no cut, no scene change. STOP.
  camera_WM: The candle is moved steadily closer to the silver bowl, passing through the focal point of
    the curvature. The flame remains lit. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a large, polished silver bowl on a wooden table. The bowl
    acts as a concave mirror. In the center of the bowl's interior, there is a clear reflection of a lit
    candle. This reflection is inverted, with the flame pointing downwards. In the background, slightly
    out of focus, the wooden room and a window are visible. A real candlestick is visible in the background
    to the right.
  init2final_edit_prompt: Edit the given image to change the reflection inside the silver bowl. The reflection
    of the candle flame in the center of the bowl must now be upright (pointing upwards) and magnified,
    appearing larger than the original reflection. The reflection should no longer be inverted. Keep the
    bowl and the surrounding room environment unchanged.
  rationale: The silver bowl functions as a concave mirror. In the initial frame, the inverted reflection
    indicates the candle is positioned outside the focal point of the mirror. The prompt states the candle
    moves closer, passing through the focal point. According to the physics of concave mirrors, when an
    object moves inside the focal point (closer to the mirror), the image transitions from real and inverted
    to virtual, upright, and magnified. Therefore, in the final frame, the reflection of the flame must
    be upright.
