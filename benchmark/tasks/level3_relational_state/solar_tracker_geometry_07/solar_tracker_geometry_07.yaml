id: solar_tracker_geometry_07
level: 3
category: relational_state
tags: []
variant_of: solar_tracker_geometry
variation_type: combined
variation_description: Night setting (panel goes to sleep/horizontal) occluded by sandstorm.
changes:
  occlusion_method: 'Environmental occlusion: Sandstorm.'
  dynamic_conditions: 'Night mode: Panel returns to neutral horizontal rest position.'
  expected_outcome_change: Panel becomes horizontal.
prompts:
  init_frame_edit_prompt: Edit the image to make the scene look like twilight, with the sun having just
    set and the sky turning deep blue.
  video_WM: The sun has set and the system enters sleep mode. The panel begins tilting upward to a neutral
    horizontal rest position. Suddenly, a night sandstorm sweeps across the dunes, completely blocking
    the view with blowing dust. The storm rages for several seconds, then clears to reveal the scene again.
    No zoom, no cut, no scene change. STOP.
  camera_WM: The sun has set and the system enters sleep mode. The panel begins tilting upward to a neutral
    horizontal rest position. Suddenly, a night sandstorm sweeps across the dunes, completely blocking
    the view with blowing dust. The storm rages for several seconds, then clears to reveal the scene again.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A large, rectangular solar panel array mounted on a mechanical tracker in a
    desert environment. The panel is tilted at a steep angle towards the left horizon. A large circular
    gear mechanism and hydraulic struts support the panel. The ground is sandy with scattered rocks. The
    sky shows a twilight gradient from deep blue to a faint orange sunset on the horizon.
  init2final_edit_prompt: Edit the given image so that the solar panel array is rotated into a flat, horizontal
    position, with its surface parallel to the ground and facing directly upward toward the sky. Adjust
    the orientation of the large gear and the extension of the hydraulic struts to physically correspond
    to this new horizontal angle. Ensure the air is clear and visibility is restored to match the initial
    twilight atmosphere, with no sandstorm obscuring the view.
  rationale: The prompt describes a mechanical state change where the solar tracker moves to a 'sleep'
    or 'stow' position, which is explicitly defined as a 'neutral horizontal rest position'. This implies
    the panel rotates from its initial diagonal tilt to be parallel with the ground (facing zenith). The
    sandstorm acts as a temporal occlusion, hiding the motion, but the prompt states the storm clears,
    so the final frame must show the completed mechanical transformation in clear visibility. The key
    relational constraints are the coupling between the panel angle and the supporting gear/strut mechanism.
