id: billiard_break
level: 3
category: relational_state
relational_type: momentum_coupling
prompts:
  image_gen_prompt: A rack of fifteen colorful billiard balls arranged in a tight triangle on a green
    felt table. A single white cue ball is positioned three feet away, aligned with the lead ball of the
    triangle.
  video_WM: The white cue ball is struck with high force, causing it to slide rapidly toward the center
    of the stationary triangle. The table is level and the balls are perfectly spherical. The camera rotates
    right until the table completely exits the view, then rotates toward the left smoothly at the same
    rate until the center of the table is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: The cue ball is launched at high speed toward the stationary rack of balls. The resulting
    interaction is governed by elastic collision and momentum transfer laws. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a green pool table surface. In the foreground, a white cue
    ball is positioned centrally. Further back, a set of 15 object balls is arranged in a tight triangular
    rack formation. The balls are multicolored including solids and stripes. In the background, there
    is a second pool table, a fireplace with a mantelpiece, and wood-paneled walls. Overhead lights illuminate
    the table.
  init2final_edit_prompt: Edit the given image to show the aftermath of a pool break shot. The previously
    racked triangular formation of object balls must be completely broken, with the balls scattered randomly
    across the green felt surface. The white cue ball should be in a different position on the table,
    no longer at its starting point. Ensure the background room details, lighting, and the second table
    remain unchanged.
  rationale: 'The prompt describes a high-force break shot followed by a camera rotation that temporarily
    occludes the table. During the occlusion, the kinetic energy from the cue ball is transferred to the
    rack, causing the balls to scatter across the table (increasing entropy). When the camera returns
    to the original viewing angle, the physical state of the system must reflect this collision: the balls
    should no longer be racked but distributed across the playing surface.'
  questions:
  - id: triangle_broken
    question: Is the triangular formation of the object balls completely broken?
    answer_type: yes_no
    notes_for_judge: The balls should no longer be in a tight rack.
  - id: balls_scattered
    question: Are the object balls distributed across a wider area of the table than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for spatial distribution/scattering.
  - id: cue_ball_moved
    question: Is the white cue ball in a different position relative to the table center compared to the
      initial frame?
    answer_type: yes_no
    notes_for_judge: The cue ball must have moved from its starting spot.
  - id: entropy_increase
    question: Does the arrangement of the balls appear random rather than ordered?
    answer_type: yes_no
    notes_for_judge: Tests the transition from ordered state to disordered state.
  - id: balls_separated
    question: Are there visible gaps between most of the object balls?
    answer_type: yes_no
    notes_for_judge: In the initial frame, they are touching. In the final frame, they should be separated.
  - id: background_consistency
    question: Do the background elements (fireplace, second table) remain in the same position relative
      to the camera frame?
    answer_type: yes_no
    notes_for_judge: The camera returns to the center view, so the background should align with the initial
      frame.
  - id: surface_visible
    question: Is more of the green felt surface visible between the individual balls compared to the initial
      rack?
    answer_type: yes_no
    notes_for_judge: Scattering exposes the table surface between balls.
