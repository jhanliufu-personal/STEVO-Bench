id: concave_mirror_inversion
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: A large, polished silver bowl acts as a concave mirror. A lit candle is positioned
    far away from the bowl, showing a tiny, inverted reflection of the flame inside the curve.
  video_WM: The candle is moved steadily closer to the silver bowl, passing through the focal point of
    the curvature. The flame remains lit. The camera rotates right until the candle completely exits the
    view, then rotates toward the left smoothly at the same rate until the interior of the silver bowl
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The candle is moved toward the concave surface of the bowl. The optical relationship between
    the object and its curved reflection is maintained. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up view of a large silver bowl with a highly reflective concave interior.
    Inside the bowl, a small, inverted reflection of a candle flame is visible in the center. In the background,
    slightly out of focus, there is a wooden room with a window on the left and a lit candle standing
    on a table to the right. The lighting is warm and dim.
  init2final_edit_prompt: Edit the given image to show the reflection of the candle flame inside the silver
    bowl as significantly larger, brighter, and upright. The reflection should appear magnified, simulating
    the optical effect of the candle moving closer to the concave surface and entering its focal length.
    Keep the silver bowl centered and the background environment identical to the original image.
  rationale: The candle moves from a distance (outside the focal point) to a position very close to the
    silver bowl (inside the focal point). Optically, a concave mirror produces a real, inverted, and smaller
    image for distant objects, but a virtual, upright, and magnified image for objects within the focal
    length. Since the camera rotates away and then returns to the exact same viewing angle, the background
    and bowl position remain unchanged, but the reflection inside the bowl must update to show the magnified,
    upright state caused by the candle's proximity.
