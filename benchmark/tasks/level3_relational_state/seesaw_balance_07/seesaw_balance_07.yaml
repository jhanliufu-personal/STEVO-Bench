id: seesaw_balance_07
level: 3
category: relational_state
tags: []
variant_of: seesaw_balance
variation_type: combined
variation_description: Heavy rock on right + Truck blocking view.
changes:
  occlusion_method: Truck blocking view.
  dynamic_conditions: Heavy rock on right seat.
  expected_outcome_change: Right side drops down.
prompts:
  init_frame_edit_prompt: Edit the image to place a large, heavy grey rock resting on the raised right
    seat of the seesaw.
  video_WM: A person lifts the sandbag and left seat upward, releasing the weight from that side. A large
    maintenance truck drives slowly from the right, passing between the camera and the seesaw, completely
    blocking the view. The truck continues driving until it has cleared the frame, revealing the scene
    again. No zoom, no cut, no scene change. STOP.
  camera_WM: A person lifts the sandbag and left seat upward, releasing the weight from that side. A large
    maintenance truck drives slowly from the right, passing between the camera and the seesaw, completely
    blocking the view. The truck continues driving until it has cleared the frame, revealing the scene
    again. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A playground seesaw with a wooden beam. On the left side, the seat is lowered
    to the ground, and a burlap sack labeled '20 KG SAND' sits on it. On the right side, the seat is raised
    high in the air, and a large, rough grey rock sits on it. The background features trees and playground
    equipment.
  init2final_edit_prompt: Edit the given image so that the seesaw is tilted in the opposite direction.
    The right side with the large rock should be lowered, resting on or near the ground. The left side
    with the sandbag should be raised high in the air. Maintain the position of the fulcrum and the background
    environment.
  rationale: The prompt describes an action where the left side of the seesaw (with the sandbag) is lifted,
    releasing the downward force on that side. Given the physics of the system, once the left side is
    raised or the weight is relieved, the heavy rock on the right side will cause the seesaw to tip, dropping
    the right side to the ground. The truck occlusion masks the transition, and the final state reveals
    the seesaw in this new equilibrium (right down, left up).
