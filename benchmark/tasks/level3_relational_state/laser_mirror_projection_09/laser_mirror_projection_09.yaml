id: laser_mirror_projection_09
level: 3
category: relational_state
tags: []
variant_of: laser_mirror_projection
variation_type: combined
variation_description: Motor rotates rapidly and camera zooms out.
changes:
  occlusion_method: Camera zoom out.
  dynamic_conditions: Motor rotates at high speed.
  expected_outcome_change: Laser spot travels a much greater distance.
prompts:
  init_frame_edit_prompt: Edit the image to show the voltage dial on the motor controller turned fully
    clockwise to the 'MAX' position.
  video_WM: The motorized base begins to rotate the mirror rapidly clockwise. The laser pointer and the
    white screen remain fixed in place. The camera zooms out rapidly until the entire lab setup is a tiny,
    indistinguishable speck in the distance. The camera then zooms back in to the original framing. No
    cut, no scene change. STOP.
  camera_WM: The motorized base begins to rotate the mirror rapidly clockwise. The laser pointer and the
    white screen remain fixed in place. STOP.
camera_control:
  HY-WorldPlay: s-21, w-22
evaluation:
  init_frame_description: A physics lab setup on a dark table. On the left, a black laser pointer mounted
    on a metal stand emits a green laser beam. In the center, a square mirror is mounted on a silver motorized
    rotational stage. On the right, a white projection screen displays a bright green laser spot and a
    curved green trace. The laser beam travels from the pointer, reflects off the mirror, and hits the
    screen.
  init2final_edit_prompt: Edit the given image to show the reflected laser beam pointing in a different
    direction. The green beam should still originate from the laser pointer and hit the central mirror,
    but the reflected segment should strike a different location on the white screen. Rotate the central
    mirror mount visually to align with the new reflection path. Keep the background, table, and equipment
    placement otherwise unchanged.
  rationale: The video prompt describes the mirror rotating rapidly while the camera zooms out and back
    in. The rotation of the mirror changes the angle of incidence and reflection for the laser beam. Because
    the rotation is rapid and the camera view is interrupted by the zoom, the final state captures the
    system at a new, arbitrary angle of reflection. The physical coupling (laser -> mirror -> screen)
    remains invariant, but the specific state (beam angle and spot position) changes.
