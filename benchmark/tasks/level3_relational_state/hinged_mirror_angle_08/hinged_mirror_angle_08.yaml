evaluation:
  init_frame_description: A close-up shot of a hinged double mirror standing vertically on a wooden table.
    A red apple is positioned on the table directly in front of the brass hinge connecting the two mirror
    panels. The apple is reflected in both the left and right mirrors, and a secondary reflection is visible
    in the center corner. The background shows a bright room with windows.
  init2final_edit_prompt: Edit the given image to show the red apple positioned significantly further
    away from the central brass hinge, closer to the foreground of the table. Update the reflections in
    both the left and right mirror panels to match this new position, placing the reflected apples further
    outward from the central hinge line. Ensure the scene is fully illuminated with bright, natural lighting
    matching the original.
  rationale: The prompt describes the apple sliding away from the hinge. Geometrically, as an object moves
    away from the vertex of a corner mirror along the bisector, its primary reflections move away from
    the hinge line along the mirror surfaces. The lighting toggles off and then back on, so the final
    frame must be lit, not dark. The mirrors themselves remain stationary, so the background and mirror
    geometry should be preserved.
