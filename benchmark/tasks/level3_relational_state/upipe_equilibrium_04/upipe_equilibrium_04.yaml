id: upipe_equilibrium_04
level: 3
category: relational_state
tags: []
variant_of: upipe_equilibrium
variation_type: dynamic_condition
variation_description: Action changed from pushing down to pulling up. Piston starts lower to allow upward
  travel.
changes:
  occlusion_method: null
  dynamic_conditions: Force direction reversed (pulling up instead of pushing down)
  expected_outcome_change: Liquid level on the right side drops (suction) instead of rising.
prompts:
  init_frame_edit_prompt: Edit the image to show the black piston pushed significantly further down into
    the left tube, so it is roughly level with the liquid in the right tube.
  video_WM: A mechanical arm begins pulling the left piston upward out of the pipe. The movement is steady
    and continuous. The camera rotates right until the U-pipe completely exits the view, then rotates
    toward the left smoothly at the same rate until the pipe is back in the center of view. No zoom, no
    cut, no scene change. STOP.
  camera_WM: A mechanical arm begins pulling the left piston upward out of the pipe. The movement is steady
    and continuous. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A U-shaped glass tube (U-pipe) sits on a wooden table, partially filled with
    blue liquid. The left arm of the tube contains a black piston mechanism that is pushed down, depressing
    the liquid level on that side. The right arm is open to the air, and the blue liquid level is high,
    near the top of the tube, indicating displacement by the piston.
  init2final_edit_prompt: Edit the given image to show the black piston in the left tube raised to a significantly
    higher position. Correspondingly, raise the level of the blue liquid in the left tube and lower the
    level of the blue liquid in the right tube, so that the liquid levels in both arms are approximately
    equal in height.
  rationale: The video prompt describes a mechanical action where the piston is pulled upward. In the
    initial state, the piston is depressing the fluid on the left, forcing the level on the right to be
    high. As the piston is pulled up, the pressure is released (or suction is applied), causing the fluid
    to flow from the right arm back to the left arm to seek hydrostatic equilibrium. The camera rotation
    fully occludes the object during this process. When the camera returns, the piston should be higher,
    and the liquid levels should have equalized (left higher than before, right lower than before).
