evaluation:
  init_frame_description: A green pool table with a set of billiard balls arranged in a tight triangular
    rack in the foreground. A single white cue ball is positioned further back on the table near the far
    rail. The background features a fireplace, a cue rack, and overhead lighting.
  init2final_edit_prompt: Edit the given image to show the aftermath of a pool break shot. The triangular
    rack of colored balls in the foreground must be completely broken, with the balls scattered and spread
    out across the green felt in random positions. The white cue ball must be moved from its original
    background position to a new location on the table, appearing as if it has just impacted the group.
    Ensure the balls are separated and no longer form a neat triangle.
  rationale: 'The prompt describes a break shot, which is a high-energy collision event. The cue ball
    transfers momentum to the stationary rack, causing an irreversible transition from an ordered state
    (the triangle) to a disordered state (scattered balls). The occlusion hides the actual movement, but
    the final state must reflect the physical consequence of the collision: the balls must be dispersed
    across the table, and the cue ball must have changed position significantly.'
