evaluation:
  init_frame_description: A close-up shot of a hand holding a clear glass pitcher tilted downwards, pouring
    water into a clear glass tumbler sitting on a wooden table. The pitcher is partially full of water.
    A stream of water is flowing from the pitcher's spout into the glass. The glass is currently mostly
    empty, with the water just beginning to accumulate at the bottom. The background shows a blurred window
    with natural light.
  init2final_edit_prompt: Edit the given image to show the glass tumbler significantly fuller with water.
    The water level inside the pitcher must be visibly lower than in the original image. Maintain the
    stream of water flowing from the pitcher spout into the glass. Keep the hand, the position of the
    glass on the table, and the background identical to the original view.
  rationale: The video prompt describes a continuous pouring action where the hand maintains the tilt
    of the pitcher. Physically, this is a coupled system where mass is transferred from the pitcher to
    the glass. As time passes, the volume of water in the glass must increase (state variable A), and
    the volume of water in the pitcher must correspondingly decrease (state variable B) due to conservation
    of mass. The stream connecting them must remain visible as the action is continuous.
