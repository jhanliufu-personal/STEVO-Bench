id: shadow_magnification
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: A stationary spotlight is aimed at a white wall. A small plastic dinosaur is sitting
    on a pedestal halfway between the light and the wall, casting a sharp shadow.
  video_WM: A mechanical arm begins sliding the dinosaur pedestal slowly toward the spotlight and away
    from the wall. The light remains fixed. The camera rotates right until the dinosaur completely exits
    the view, then rotates toward the left smoothly at the same rate until the wall is back in the center
    of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The occluding object is moved closer to the fixed light source. The geometric projection
    of the shadow on the wall changes accordingly. STOP.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
