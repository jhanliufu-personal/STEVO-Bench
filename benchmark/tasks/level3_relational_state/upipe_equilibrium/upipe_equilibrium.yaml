id: upipe_equilibrium
level: 3
category: relational_state
relational_type: pressure_coupling
prompts:
  image_gen_prompt: A clear U-shaped glass pipe filled with blue water. A black rubber piston is inserted
    into the left opening. The water levels on both sides are currently equal.
  video_WM: A mechanical arm begins pushing the left piston down into the pipe. The movement is steady
    and continuous. The camera rotates right until the U-pipe completely exits the view, then rotates
    toward the left smoothly at the same rate until the pipe is back in the center of view. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The left piston is pushed down.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A U-shaped glass tube (U-pipe) sitting on a wooden table in a laboratory setting.
    The tube is partially filled with a clear blue liquid. The left arm of the tube is sealed with a black
    piston or stopper mechanism that sits directly on top of the liquid column. The right arm of the tube
    is open at the top, and the liquid level is visible. The background shows blurred laboratory equipment
    and a window.
  init2final_edit_prompt: Edit the given image so that the black piston on the left side of the U-tube
    is positioned significantly lower inside the glass tube. Correspondingly, lower the level of the blue
    liquid in the left arm to be directly beneath the lowered piston. Raise the level of the blue liquid
    in the right arm of the U-tube significantly higher than it was originally, reflecting the displacement
    of the fluid from the left side. Ensure the total volume of blue liquid appears conserved and the
    background remains unchanged.
  rationale: The video prompt describes a mechanical arm pushing the piston down on the left side of the
    U-pipe. According to Pascal's principle and the conservation of volume for an incompressible fluid,
    pushing the piston down displaces the liquid in the left arm, forcing it to flow into the right arm.
    Consequently, the liquid level on the left must drop (moving with the piston), and the liquid level
    on the right must rise. The camera rotation serves as a temporal transition; upon returning to the
    initial view, the system should show this new state of equilibrium or displacement.
