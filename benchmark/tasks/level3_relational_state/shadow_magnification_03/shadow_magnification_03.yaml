id: shadow_magnification_03
level: 3
category: relational_state
tags: []
variant_of: shadow_magnification
variation_type: occlusion_method
variation_description: Replaces camera rotation with thick fog filling the room.
changes:
  occlusion_method: Thick fog fills the room obscuring vision, then clears.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (shadow grows).
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A mechanical arm begins sliding the dinosaur pedestal slowly toward the spotlight and away
    from the wall. The light remains fixed. Rapidly, thick white fog fills the room until the scene is
    completely obscured. The fog then dissipates clearly to reveal the room again. No zoom, no cut, no
    scene change. STOP.
  camera_WM: A mechanical arm begins sliding the dinosaur pedestal slowly toward the spotlight and away
    from the wall. The light remains fixed. Rapidly, thick white fog fills the room until the scene is
    completely obscured. The fog then dissipates clearly to reveal the room again. No zoom, no cut, no
    scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A toy T-Rex dinosaur standing on a tall, rectangular wooden block pedestal.
    To the right, a black stage spotlight on a stand is illuminated, casting a beam of light towards the
    dinosaur. On the left, a sharp shadow of the dinosaur and pedestal is cast against a plain, textured
    grey wall.
  init2final_edit_prompt: Edit the given image to show the wooden pedestal and dinosaur shifted to the
    right, positioned closer to the spotlight. Render the shadow of the dinosaur on the wall significantly
    larger than it appears in the original image. Ensure the spotlight stand remains in its original fixed
    position.
  rationale: 'The prompt describes the object moving toward the light source. In optics, as an occluding
    object moves closer to a point light source (the spotlight) and further from the projection screen
    (the wall), the cast shadow increases in size (magnification). The fog acts as a transition to mask
    the motion, but the final state must reflect the new geometric relationship: the object is closer
    to the light, so the shadow must be larger.'
  questions:
  - id: shadow_size_change
    question: Is the shadow of the dinosaur on the wall larger than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The object moved closer to the light source, so the shadow must be magnified.
  - id: pedestal_position
    question: Is the wooden pedestal positioned closer to the spotlight than in the initial frame?
    answer_type: yes_no
    notes_for_judge: The prompt describes the pedestal sliding toward the spotlight.
  - id: shadow_magnification_relation
    question: Does the shadow appear magnified relative to the size of the dinosaur compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Tests the coupled relationship between object distance and shadow scale.
  - id: spotlight_invariant
    question: Is the spotlight fixture located in the same position as in the initial frame?
    answer_type: yes_no
    notes_for_judge: The prompt states the light remains fixed.
  - id: fog_dissipated
    question: Is the scene clear of the thick white fog described in the transition?
    answer_type: yes_no
    notes_for_judge: The prompt states the fog dissipates clearly.
  - id: dinosaur_upright
    question: Is the dinosaur still standing upright on the wooden pedestal?
    answer_type: yes_no
    notes_for_judge: Invariant check.
