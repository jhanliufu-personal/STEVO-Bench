id: bellows_pressure_system_00
level: 3
category: relational_state
tags: []
variant_of: bellows_pressure_system
variation_type: full_observability_baseline
variation_description: Fully observable baseline - camera remains stationary, no occlusion, always visible
changes:
  occlusion_method: No occlusion - camera remains stationary throughout
  dynamic_conditions: null
  expected_outcome_change: Same dynamics as original, but scene remains visible at all times
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A mechanical press begins squeezing the handles of the bellows together at a constant speed.
    The hose connection is secure. A blue balloon is visible in the view. Camera remains stationary throughout.
    No zoom, no cut, no scene change. STOP.
  camera_WM: A mechanical press begins squeezing the handles of the bellows together at a constant speed.
    The hose connection is secure. A blue balloon is visible in the view. Camera remains stationary throughout.
    No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A wooden hand bellows rests on a workbench, with its two wooden handles spread
    apart in an open position and the leather accordion sides expanded. A black rubber hose connects the
    nozzle of the bellows to a deflated blue balloon lying flat on the table. Woodworking tools like chisels
    and a hammer are visible in the background.
  init2final_edit_prompt: Edit the given image to show the wooden bellows in a compressed state, with
    the two handles squeezed closer together and the leather accordion sides collapsed. Correspondingly,
    show the blue balloon significantly inflated, appearing round, taut, and larger in volume than its
    initial flat state. Ensure the black hose remains connected between the bellows and the balloon, and
    keep the background tools and workbench unchanged.
  rationale: 'The prompt describes the mechanical action of squeezing the bellows handles. This action
    reduces the internal volume of the bellows, forcing air out through the nozzle. Because the nozzle
    is coupled to the balloon via the hose, the displaced air inflates the balloon. The final state must
    visually reflect this coupled relationship: as the bellows compress (volume loss), the balloon must
    expand (volume gain).'
