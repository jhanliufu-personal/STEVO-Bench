id: hinged_mirror_angle_06
level: 3
category: relational_state
tags: []
variant_of: hinged_mirror_angle
variation_type: dynamic_condition
variation_description: The object is changed to a green apple to test if reflections update with the correct
  object properties.
changes:
  occlusion_method: null
  dynamic_conditions: Object property changed (red apple -> green apple).
  expected_outcome_change: Reflections must show green apple instead of red.
prompts:
  init_frame_edit_prompt: Edit the image to change the red apple to a green apple.
  video_WM: A mechanical arm grabs the edge of one mirror and begins slowly closing the hinge, decreasing
    the angle between the two mirrors. The green apple remains stationary. The camera rotates right until
    the mirrors completely exit the view, then rotates toward the left smoothly at the same rate until
    the intersection of the two mirrors is back in the center of view. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A mechanical arm grabs the edge of one mirror and begins slowly closing the hinge, decreasing
    the angle between the two mirrors. The green apple remains stationary. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A hinged diptych mirror stands on a wooden table, with its two rectangular panels
    angled open. A green apple sits on the table directly in front of the brass hinge. Reflections of
    the apple are clearly visible in both mirror panels. The background features a bright room with white
    window frames and a radiator.
  init2final_edit_prompt: Edit the given image to show the two mirror panels folded significantly closer
    together, creating a narrower 'V' shape with a smaller angle between them. The mirrors should appear
    to be closing inward around the apple. Update the reflections of the green apple in the mirrors to
    correspond to this new, steeper angle. Keep the green apple stationary on the table and the background
    consistent.
  rationale: The video prompt describes a mechanical action that reduces the angle between the mirrors
    while the camera temporarily looks away. When the camera returns to the center, the primary state
    change is the geometric configuration of the mirrors (they are more closed). The apple remains a static
    reference point. The reflections in the mirrors are coupled to the mirror angle and must update physically
    to match the new orientation. The mechanical arm acts as the force provider but the key state to evaluate
    is the mirror configuration.
