id: billiard_break_06
level: 3
category: relational_state
tags: []
variant_of: billiard_break
variation_type: dynamic_condition
variation_description: Cue ball position changed to ensure a miss.
changes:
  occlusion_method: null
  dynamic_conditions: Cue ball is positioned to the side, aiming parallel to the rack rather than at it.
  expected_outcome_change: The cue ball passes the rack without touching it; the rack remains undisturbed.
prompts:
  init_frame_edit_prompt: Edit the image to move the white cue ball to the far right side of the table,
    so a straight path forward would clearly miss the rack of balls entirely.
  video_WM: The white cue ball is struck with high force in a straight line parallel to the side cushion,
    on a trajectory that avoids the stationary triangle. The camera rotates right until the table completely
    exits the view, then rotates toward the left smoothly at the same rate until the center of the table
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The white cue ball is struck with high force in a straight line parallel to the side cushion,
    on a trajectory that avoids the stationary triangle. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A green billiard table viewed from one end. In the foreground, a set of 15 colored
    billiard balls is arranged in a tight triangular rack (solids and stripes). To the right of the triangle,
    a white cue ball sits on the felt. In the background, there is a second pool table, wood paneled walls,
    a fireplace, and hanging green lamps.
  init2final_edit_prompt: Edit the given image to show the white cue ball in a different position on the
    table surface, likely further down the table or having rebounded, while keeping the triangle of colored
    balls exactly in their original, undisturbed racked formation. Do not change the camera angle or background.
  rationale: The video prompt describes the cue ball being struck on a trajectory that explicitly avoids
    the stationary triangle of balls. The camera pans away and then returns to the exact initial viewpoint.
    Therefore, in the final frame, the static environment (background, table) and the undisturbed object
    (the rack of balls) must appear identical to the initial frame (conservation of state for non-interacting
    objects). The cue ball, however, is a dynamic object that was subjected to force; it must have moved
    from its starting coordinates to a new location on the table.
