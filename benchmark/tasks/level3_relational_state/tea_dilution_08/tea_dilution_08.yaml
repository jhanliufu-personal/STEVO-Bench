id: tea_dilution_08
level: 3
category: relational_state
tags: []
variant_of: tea_dilution
variation_type: combined
variation_description: Immiscible oil pouring (Condition) + Lights off (Occlusion).
changes:
  occlusion_method: Lights turn off.
  dynamic_conditions: Pouring golden oil.
  expected_outcome_change: Oil forms bubbles; occlusion via darkness.
prompts:
  init_frame_edit_prompt: Edit the image to change the dark liquid in the pitcher and the stream to a
    golden yellow oil, and remove the dark swirling cloud in the water, replacing it with distinct golden
    oil bubbles.
  video_WM: Golden oil is poured into the water. The liquids are immiscible. The lights in the room turn
    off completely, plunging the scene into total darkness. After a moment, the lights turn back on. No
    zoom, no cut, no scene change. STOP.
  camera_WM: Golden oil is poured into the water. The liquids are immiscible. The lights in the room turn
    off completely, plunging the scene into total darkness. After a moment, the lights turn back on. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up shot of a clear glass sitting on a wooden table, partially filled
    with clear water. A ceramic pitcher is positioned above the glass, pouring a stream of golden oil
    into the water. Inside the glass, the immiscible oil has formed numerous spherical globules of varying
    sizes suspended in the water, with some oil beginning to accumulate at the surface. Steam or heat
    vapor is rising from the glass. A window with natural light is visible in the blurred background.
  init2final_edit_prompt: Edit the given image to show the glass containing a significantly larger volume
    of golden oil. Create a thick, distinct layer of oil floating on top of the water. Show the submerged
    oil globules rising towards the surface, resulting in a higher concentration of oil in the upper portion
    of the glass and fewer globules at the bottom, reflecting the separation of the two liquids.
  rationale: 'The prompt describes a pouring action followed by a period of darkness (time passing). During
    this time, two physical processes occur: more oil is added to the glass (accumulation), and the oil,
    being less dense and immiscible, rises to the surface (buoyancy/separation). The final frame must
    depict this advanced state where the oil layer is thicker and the suspended globules have migrated
    upwards, while the lighting returns to its initial bright state.'
  questions:
  - id: oil_accumulation
    question: Does the total amount of golden oil in the glass appear greater than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Check for an increase in the volume of the yellow/golden liquid.
  - id: oil_layer_thickness
    question: Is the layer of oil floating on top of the water thicker than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The top layer of oil should be more substantial due to accumulation.
  - id: buoyancy_distribution
    question: Are the submerged oil globules concentrated higher in the glass relative to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: Oil is lighter than water, so globules should rise over time.
  - id: immiscibility_separation
    question: Is there a clear visual separation between the golden oil and the clear water?
    answer_type: yes_no
    notes_for_judge: The liquids should not be mixed into a uniform color; distinct phases should be visible.
  - id: lighting_restoration
    question: Is the scene brightly lit, consistent with the lights being turned back on?
    answer_type: yes_no
    notes_for_judge: The image should not be dark; it should match the lighting of the initial frame.
  - id: globule_density_bottom
    question: Are there fewer oil globules at the very bottom of the glass compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: As oil rises, the bottom area should clear up.
