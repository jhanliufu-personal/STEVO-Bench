id: mirror_reflection
level: 3
category: relational_state
relational_type: geometric_coupling
prompts:
  image_gen_prompt: A large, vertical mirror sits on a tabletop. A red billiard ball is positioned three
    inches in front of the mirror, with its reflection clearly visible in the glass.
  video_WM: A hand pushes the red ball directly toward the mirror at a steady speed. The ball remains
    on the surface of the table. The camera rotates right until the real ball completely exits the view,
    then rotates toward the left smoothly at the same rate until the surface of the mirror is back in
    the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: The ball is pushed toward the mirror at a constant speed. The geometric relationship between
    the object and its reflection is maintained. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A red billiard ball with the number 3 is resting on a wooden surface in the
    foreground. Behind the ball stands a framed vertical mirror. The mirror reflects the back of the red
    ball and shows a green pool table in the background room.
  init2final_edit_prompt: Edit the given image to show the red billiard ball positioned significantly
    closer to the wooden frame of the mirror. Correspondingly, update the reflection in the mirror so
    that the reflected ball appears closer to the bottom edge of the mirror glass, reducing the visual
    gap between the real ball and its reflection. Ensure the background reflection of the pool table remains
    consistent.
  rationale: The prompt describes the ball being pushed toward the mirror. Physically, as an object approaches
    a flat mirror, its virtual image also approaches the mirror surface. Therefore, in the final frame,
    the real ball must be closer to the mirror frame, and the reflected ball must appear closer to the
    front of the mirror (the bottom edge of the glass), reducing the distance between the object and its
    image. The camera rotation returns to the center, restoring the original perspective.
