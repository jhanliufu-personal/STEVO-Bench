id: hinged_mirror_angle_09
level: 3
category: relational_state
tags: []
variant_of: hinged_mirror_angle
variation_type: combined
variation_description: No movement occurs (control condition) while scene is occluded by fog.
changes:
  occlusion_method: Thick fog fills the room.
  dynamic_conditions: No movement (static state).
  expected_outcome_change: State remains exactly the same.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The mirrors and the apple remain completely stationary in their initial positions. Thick white
    fog rolls into the room, becoming denser until the scene is completely white and visibility is zero.
    The fog slowly dissipates until the air is clear again. No zoom, no cut, no scene change. STOP.
  camera_WM: The mirrors and the apple remain completely stationary in their initial positions. Thick
    white fog rolls into the room, becoming denser until the scene is completely white and visibility
    is zero. The fog slowly dissipates until the air is clear again. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A red apple sits on a wooden table in front of two vertical mirrors connected
    by a central brass hinge. The mirrors are angled open towards the viewer. The apple is positioned
    centrally in front of the hinge. Reflections of the apple are clearly visible in both the left and
    right mirror panels. The mirrors also reflect the interior of a room with white walls and windows.
  init2final_edit_prompt: Edit the given image to show the scene in clear air with high visibility. The
    red apple should be on the wooden table in front of the hinged mirrors. The mirrors and apple must
    be in their exact original positions. The reflections of the apple must be visible in the mirror panels.
  rationale: The video prompt describes a full occlusion event where thick fog completely obscures the
    scene and then dissipates. Crucially, the prompt states that the mirrors and apple remain completely
    stationary throughout. Therefore, the final frame should be visually identical to the initial frame.
    This task tests the model's ability to maintain object permanence and coupled state relationships
    (the apple and its specific reflections) after a period of zero visibility.
