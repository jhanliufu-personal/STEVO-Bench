    cart to the pulley to match the cart's new position close to the edge.
  rationale: The system is a half-Atwood machine where a 5kg weight pulls a 1kg cart. Upon release, the
    unbalanced force from the heavy hanging weight causes rapid acceleration of the system. The weight
