prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: The person begins to tilt the flashlight 45 degrees toward the ceiling. The mirrors remain
    perfectly parallel. A large opaque sliding door moves from right to left, completely blocking the
    view of the scene. The door pauses, then slides back to the right to reveal the scene. No zoom, no
    cut, no scene change. STOP.
  camera_WM: The person begins to tilt the flashlight 45 degrees toward the ceiling. The mirrors remain
    perfectly parallel. A large opaque sliding door moves from right to left, completely blocking the
    view of the scene. The door pauses, then slides back to the right to reveal the scene. No zoom, no
    cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A man stands in the center of a dimly lit industrial room, positioned between
    two large parallel mirrors. He is holding a flashlight that emits a bright, warm orange glow, pointing
    it forward towards the viewer. The mirrors on his left and right create an infinity mirror effect,
    displaying multiple recursive reflections of the man and the glowing flashlight extending into the
    distance.
  init2final_edit_prompt: Edit the given image so that the man in the center is holding the flashlight
    tilted upwards at a 45-degree angle toward the ceiling. Ensure that all reflections of the man in
    the mirrors on both the left and right sides also show the flashlight tilted upwards at the same angle,
    maintaining consistent optical geometry. The light source should now illuminate more of the upper
    area or ceiling direction. Keep the position of the mirrors, the man's location, and the background
    unchanged.
  rationale: The prompt describes the person tilting the flashlight 45 degrees upward. An opaque door
    occludes the scene and then reveals it. During the occlusion, the action of tilting the flashlight
    is assumed to be completed and maintained. Upon the door opening, the physical state of the flashlight
    must be tilted upwards. Crucially, because this is a coupled optical system, the laws of reflection
    dictate that every reflection in the mirrors must instantaneously update to match the real object's
    new orientation. Therefore, all reflections must show the flashlight tilted upwards.
