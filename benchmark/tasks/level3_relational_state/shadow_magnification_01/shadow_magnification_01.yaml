id: shadow_magnification_01
level: 3
category: relational_state
tags: []
variant_of: shadow_magnification
variation_type: occlusion_method
variation_description: Replaces camera rotation with the spotlight turning off and on.
changes:
  occlusion_method: Spotlight turns off completely (pitch black), then turns back on.
  dynamic_conditions: null
  expected_outcome_change: Same dynamics (shadow grows), but observed through lighting change.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A mechanical arm begins sliding the dinosaur pedestal slowly toward the spotlight and away
    from the wall. The light remains fixed. Suddenly, the spotlight turns off, plunging the room into
    absolute darkness. After a few seconds, the spotlight turns back on. No zoom, no cut, no scene change.
    STOP.
  camera_WM: A mechanical arm begins sliding the dinosaur pedestal slowly toward the spotlight and away
    from the wall. The light remains fixed. Suddenly, the spotlight turns off, plunging the room into
    absolute darkness. After a few seconds, the spotlight turns back on. No zoom, no cut, no scene change.
    STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A toy T-Rex dinosaur standing on a rustic wooden pedestal in a dimly lit room.
    To the right, a black stage spotlight on a stand is turned on, shining a visible beam of light with
    dust motes towards the left. This light casts a sharp, dark shadow of the dinosaur onto the plain
    grey wall on the left side of the image.
  init2final_edit_prompt: Edit the given image to move the wooden pedestal and dinosaur to the right,
    positioning them significantly closer to the spotlight. Render the shadow on the left wall much larger
    and taller than in the original image, reflecting the optical magnification caused by the object's
    closer proximity to the light source. Ensure the spotlight remains on with a visible beam, and keep
    the background wall and spotlight stand fixed in their original locations.
  rationale: The prompt describes the pedestal moving toward the light source and away from the projection
    surface (the wall). Physically, as an object approaches a point light source, the shadow it casts
    becomes larger (magnification). The blackout serves as a temporal gap during which this motion occurs
    or completes. Therefore, in the final frame, the pedestal must be spatially closer to the light, and
    the shadow must be relationally larger compared to the initial state.
