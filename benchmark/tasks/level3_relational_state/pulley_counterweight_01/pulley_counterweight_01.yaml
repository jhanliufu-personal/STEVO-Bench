evaluation:
  init_frame_description: A low-angle view of a wooden beam ceiling with a central metal pulley. A thick
    rope runs through the pulley, suspending two identical bell-shaped weights labeled '5KG IRON'. The
    weights are hanging at approximately the same height, and the rope appears taut.
  init2final_edit_prompt: Edit the given image so that the left weight is positioned significantly lower
    than in the original image, and the right weight is positioned significantly higher, closer to the
    pulley. Ensure the rope remains taut connecting the two weights.
  rationale: 'The prompt describes a fixed pulley system where the left weight is pulled downward. Due
    to the mechanical coupling and conservation of rope length, pulling the left weight down must cause
    the right weight to rise by a corresponding distance. Although the motion is occluded, the final state
    must show this reciprocal displacement: the left weight lower and the right weight higher than their
    initial positions.'
