id: pulley_counterweight_01
level: 3
category: relational_state
tags: []
variant_of: pulley_counterweight
variation_type: occlusion_method
variation_description: Occlusion changed from camera rotation to a sliding opaque screen.
changes:
  occlusion_method: A large opaque screen slides in to block the view.
  dynamic_conditions: null
  expected_outcome_change: same dynamics
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand begins pulling the left weight downward at a constant speed. The rope remains taut
    across the pulley. The motion continues steadily. A large opaque screen slides in from the right,
    completely blocking the view of the pulley system. The screen slides away to the left to reveal the
    scene again. No zoom, no cut, no scene change. STOP.
  camera_WM: A hand begins pulling the left weight downward at a constant speed. The rope remains taut
    across the pulley. The motion continues steadily. A large opaque screen slides in from the right,
    completely blocking the view of the pulley system. The screen slides away to the left to reveal the
    scene again. No zoom, no cut, no scene change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A low-angle view of a wooden beam ceiling with a central metal pulley. A thick
    rope runs through the pulley, suspending two identical bell-shaped weights labeled '5KG IRON'. The
    weights are hanging at approximately the same height, and the rope appears taut.
  init2final_edit_prompt: Edit the given image so that the left weight is positioned significantly lower
    than in the original image, and the right weight is positioned significantly higher, closer to the
    pulley. Ensure the rope remains taut connecting the two weights.
  rationale: 'The prompt describes a fixed pulley system where the left weight is pulled downward. Due
    to the mechanical coupling and conservation of rope length, pulling the left weight down must cause
    the right weight to rise by a corresponding distance. Although the motion is occluded, the final state
    must show this reciprocal displacement: the left weight lower and the right weight higher than their
    initial positions.'
  questions:
  - id: primary_left_down
    question: Is the left weight positioned lower in the final frame than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the vertical position of the left weight relative to the background/beam.
  - id: primary_right_up
    question: Is the right weight positioned higher in the final frame than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The right weight should have moved up towards the pulley.
  - id: relational_height_diff
    question: Is the right weight positioned higher than the left weight in the final frame?
    answer_type: yes_no
    notes_for_judge: In the initial frame they are roughly equal; in the final frame, the right must be
      clearly higher than the left.
  - id: relational_pulley_proximity
    question: Is the right weight closer to the pulley than the left weight is?
    answer_type: yes_no
    notes_for_judge: The right weight moves up (closer to pulley), the left moves down (further away).
  - id: relational_separation
    question: Is the vertical distance between the two weights greater in the final frame than in the
      initial frame?
    answer_type: yes_no
    notes_for_judge: Initially they are side-by-side; finally they should be vertically separated.
  - id: constraint_tautness
    question: Does the rope appear taut between the pulley and the weights?
    answer_type: yes_no
    notes_for_judge: The rope should not be slack.
  - id: object_persistence
    question: Are both weights still recognizable as the '5KG IRON' weights?
    answer_type: yes_no
    notes_for_judge: Check for object consistency.
