id: syringe_hydraulic
level: 3
category: relational_state
relational_type: volumetric_coupling
prompts:
  image_gen_prompt: Two 50ml clear medical syringes are connected by a thin, transparent plastic tube
    filled with red liquid. The left syringe is full (50ml) and the right syringe is empty (0ml).
  video_WM: A mechanical finger begins pressing the plunger of the left syringe. The two syringes are
    connected. The pressing continues at a constant rate. The camera rotates right until both syringes
    completely exit the view, then rotates toward the left smoothly at the same rate until the right syringe
    is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: A mechanical finger begins pressing the plunger of the left syringe. The two syringes are
    connected. The pressing continues at a constant rate.
camera_control:
  HY-WorldPlay: s-3, right-30, left-30
