id: sympathetic_pendulum_05
level: 3
category: relational_state
tags: []
variant_of: sympathetic_pendulum
variation_type: dynamic_condition
variation_description: Pendulum B is shortened significantly, destroying the resonant frequency match.
changes:
  occlusion_method: null
  dynamic_conditions: Pendulum B string length is halved (frequency mismatch).
  expected_outcome_change: Pendulum B swings very little or chaotically (off-resonance).
prompts:
  init_frame_edit_prompt: Edit the image to shorten the string of Pendulum B so it is half the length
    of Pendulum A.
  video_WM: Pendulum A continues its wide, heavy swing. The significant difference in string lengths creates
    a mismatch in natural frequencies between the two systems. The camera rotates right until Pendulum
    A completely exits the view, then rotates toward the left smoothly at the same rate until Pendulum
    B is back in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: Pendulum A continues its wide, heavy swing. The significant difference in string lengths
    creates a mismatch in natural frequencies between the two systems. STOP.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: 'A workshop interior showing a horizontal wooden rod suspended by strings from
    the ceiling. Two pendulums hang from this rod: Pendulum A on the left has a long string and a metal
    spherical bob, while Pendulum B on the right has a significantly shorter string and a similar metal
    bob. The background is a dimly lit room with a window on the left and various tools.'
  init2final_edit_prompt: Edit the given image to show Pendulum B centered in the frame, hanging vertically
    and appearing stationary. Pendulum A, visible on the left side, should appear in the middle of a swing,
    showing displacement from the vertical or motion blur. The visual state should reflect that Pendulum
    B has not picked up the swinging motion of Pendulum A.
  rationale: The prompt specifies a significant difference in string lengths between the two pendulums.
    In physics, coupled pendulums only exchange energy efficiently (resonate) if their natural frequencies
    (determined by length) are matched. Since the lengths are mismatched, Pendulum B will not resonate
    with Pendulum A. Therefore, while Pendulum A continues its wide swing, Pendulum B should remain essentially
    stationary or have negligible amplitude, rather than swinging sympathetically. The camera motion serves
    to pass time and re-center on Pendulum B, but the key physical state is the lack of energy transfer.
