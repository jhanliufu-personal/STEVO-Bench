id: hourglass_accumulation
level: 1
category: scalar_state
scalar_variable: Bottom pile height
prompts:
  image_gen_prompt: Generate an image that shows a large wooden hourglass with white sand flowing through
    the narrow neck in a steady line. A small conical mound of sand is visible in the bottom bulb.
  video_WM: Sand flows into the bottom of an hourglass. The camera rotates right until the hourglass completely
    exits the view, then rotates toward the left smoothly at the same rate until the hourglass is back
    in the center of view. No zoom, no cut, no scene change. STOP.
  camera_WM: White sand is flowing through the neck of an hourglass.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a wooden hourglass standing on a wooden desk. The hourglass
    has three carved pillars and glass bulbs containing white sand. In this initial state, sand is actively
    flowing from the top bulb to the bottom bulb. The top bulb contains a significant amount of sand,
    while the bottom bulb has a conical pile of sand accumulating. The background features blurred bookshelves
    filled with books, a window with natural light, and other desk objects like a small bowl and stacked
    books.
  init2final_edit_prompt: Edit the given image to show the hourglass with a significantly larger and taller
    pile of white sand in the bottom bulb, and a reduced amount of sand remaining in the top bulb. Ensure
    the sand level in the top bulb is lower than in the original image. Maintain the exact same camera
    angle, lighting, and background details.
  rationale: 'The video prompt describes a continuous physical process (sand flowing) that persists while
    the camera rotates away and then returns. Although the hourglass is temporarily occluded by the camera''s
    field of view moving, the flow of sand does not stop. Therefore, when the camera returns to the initial
    framing, the state of the hourglass must have evolved: the bottom bulb must contain more sand (accumulated
    mass), and the top bulb must contain less sand (depleted mass).'
  questions:
  - id: bottom_pile_height
    question: Is the pile of sand in the bottom bulb taller than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the height of the sand cone in the bottom glass bulb. It should be higher.
  - id: top_sand_volume
    question: Is there less sand remaining in the top bulb compared to the initial frame?
    answer_type: yes_no
    notes_for_judge: Check the level of sand in the upper glass bulb. It should be lower.
  - id: bottom_accumulation
    question: Has the volume of sand in the bottom bulb increased?
    answer_type: yes_no
    notes_for_judge: The pile should appear more voluminous.
  - id: top_depletion
    question: Is the sand level in the top bulb lower than the starting level?
    answer_type: yes_no
    notes_for_judge: The top level must have dropped.
  - id: hourglass_position
    question: Is the hourglass positioned in the center of the frame?
    answer_type: yes_no
    notes_for_judge: The camera rotates back to the center, so the hourglass should be centered again.
  - id: background_consistency
    question: Are the books on the shelves in the background still visible and unchanged?
    answer_type: yes_no
    notes_for_judge: The environment should remain stable.
