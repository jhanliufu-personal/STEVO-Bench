id: mirror_reflection_08
level: 3
category: relational_state
tags: []
variant_of: mirror_reflection
variation_type: combined
variation_description: Ball pushed parallel to mirror + Person blocking occlusion.
changes:
  occlusion_method: Person blocking the view.
  dynamic_conditions: Direction of motion parallel to mirror.
  expected_outcome_change: Ball and reflection move parallel to mirror surface.
prompts:
  init_frame_edit_prompt: '[NO CHANGE]'
  video_WM: A hand pushes the red ball parallel to the face of the mirror, moving from left to right.
    A person walks between the camera and the table, completely blocking the view of the mirror and ball.
    The person continues walking and exits the frame, revealing the table again. No zoom, no cut, no scene
    change. STOP.
  camera_WM: A hand pushes the red ball parallel to the face of the mirror, moving from left to right.
    A person walks between the camera and the table, completely blocking the view of the mirror and ball.
    The person continues walking and exits the frame, revealing the table again. No zoom, no cut, no scene
    change. STOP.
camera_control:
  HY-WorldPlay: null
evaluation:
  init_frame_description: A close-up view of a wooden table with a red billiard ball (number 3) resting
    on it. Behind the ball is a rectangular mirror with a wooden frame, leaning or mounted vertically.
    The mirror reflects the red ball and the room behind the camera, which contains a green pool table,
    a window, and a framed picture on the wall.
  init2final_edit_prompt: Edit the given image to move the red billiard ball to the right along the wooden
    surface. Position the ball closer to the right edge of the frame. Correspondingly, shift the reflection
    of the red ball in the mirror to the right to maintain correct geometric alignment with the physical
    ball. Remove the ball and its reflection from their original positions. Ensure the background scene
    reflected in the mirror (the green pool table and room) remains exactly the same, as the camera angle
    has not changed.
  rationale: The video prompt describes a physical action (pushing the ball) that occurs or completes
    while the view is occluded by a person walking past. According to the prompt, the ball moves from
    left to right. Therefore, in the final frame, the ball must be located to the right of its initial
    position. Crucially, because this is a mirror scene, the reflection is a coupled state variable; the
    reflected ball must also move to the right to maintain physical consistency (laws of reflection).
    The background reflection remains static because the camera does not move.
  questions:
  - id: ball_position_shift
    question: Is the physical red ball positioned further to the right than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: Compare the horizontal position of the ball on the table.
  - id: reflection_position_shift
    question: Has the reflection of the red ball in the mirror moved to the right compared to the initial
      reflection?
    answer_type: yes_no
    notes_for_judge: The reflection must update corresponding to the object's movement.
  - id: ball_reflection_coupling
    question: Is the reflected ball horizontally aligned with the new position of the physical ball?
    answer_type: yes_no
    notes_for_judge: Check for vertical alignment between the object and its reflection, ensuring the
      physics of the mirror are preserved.
  - id: background_invariance
    question: Is the reflection of the green pool table in the background unchanged relative to the mirror
      frame?
    answer_type: yes_no
    notes_for_judge: The camera is static, so the static background reflection should not move.
  - id: ball_visibility
    question: Is the red ball visible on the table surface after the occlusion ends?
    answer_type: yes_no
    notes_for_judge: The ball should not disappear; it should just move.
  - id: mirror_frame_stability
    question: Is the position of the wooden mirror frame identical to the initial image?
    answer_type: yes_no
    notes_for_judge: The mirror itself should not move.
