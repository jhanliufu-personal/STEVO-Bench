evaluation:
  init_frame_description: A low-angle view of a room corner featuring a single bare light bulb mounted
    in the center of a textured beige ceiling. The light bulb is currently switched on and glowing brightly,
    casting a warm light that illuminates the ceiling and the grungy walls. To the left, a dark, rectangular
    doorway or opening is partially visible.
  init2final_edit_prompt: Edit the given image to turn the ceiling light off. The light bulb should appear
    dark, unlit, and gray instead of glowing white. The entire room should be significantly darker and
    shadowed, removing the bright radial illumination from the ceiling and walls, reflecting a state where
    the light source has been extinguished.
  rationale: The initial state shows the light bulb illuminated. The video prompt describes a camera pan
    that occludes the light, followed by a toggle of the controlling wall switch. Since the light was
    initially ON, toggling the switch changes the state to OFF. The camera then returns to the original
    viewpoint. Therefore, the final frame must show the exact same scene composition but with the light
    bulb unlit and the room consequently much darker.
