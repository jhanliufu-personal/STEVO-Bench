evaluation:
  init_frame_description: A low-angle shot of a ceiling light fixture in a dim, grungy room. The lightbulb
    is shattered, with jagged glass edges visible in the socket and the internal filament structure exposed.
    Sharp shards of glass are scattered and stuck to the surrounding concrete walls. The lighting is low-key
    and ambient, with the bulb itself being dark and unlit.
  init2final_edit_prompt: Edit the given image to keep the light bulb dark and unlit. The room must remain
    dimly lit with no new light sources. The bulb should remain shattered with jagged glass, and the filament
    must not be glowing. Ensure the scene appears identical to the initial state regarding lighting and
    object condition.
  rationale: The camera moves away and returns to the original viewpoint, so the framing is identical.
    The action performed is toggling the light switch to ON. However, the lightbulb in the fixture is
    physically shattered. In a realistic physical simulation, a broken incandescent bulb cannot emit light
    because the vacuum is lost and the filament is likely severed or would burn out instantly. Therefore,
    despite the switch being ON, the correct functional outcome is that the light remains OFF. The model
    must prioritize the physical state of the broken component over the generic causal association of
    'switch on -> light on'.
