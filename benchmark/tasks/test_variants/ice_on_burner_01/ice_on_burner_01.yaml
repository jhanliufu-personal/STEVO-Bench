  init2final_edit_prompt: Edit the given image to show the aftermath of the ice melting. The ice cube
    should be significantly smaller, deformed, and rounded, or completely reduced to a puddle of boiling
    water. Increase the amount of liquid water spreading on the glass surface around the heating element.
