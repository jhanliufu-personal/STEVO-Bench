id: plastic_bottle_hand_crush_curtain
level: 4
category: structural_transformation
transformation_type: plastic_container_deformation
tags: []
prompts:
  image_gen_prompt: An empty transparent plastic water bottle stands upright on a table. The bottle is
    made of thin flexible PET plastic with smooth cylindrical walls. A hand approaches the bottle ready
    to squeeze.
  video_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it; while the hand continues squeezing and the bottle deforms further, a heavy curtain drops from the ceiling between the camera and the bottle, completely blocking the hand and bottle from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A clear, empty plastic bottle stands upright on a wooden dining table. To the
    left, a person's arm and hand are reaching towards the bottle, with fingers extended but not yet touching
    the object. On the wooden surface, there are two circular water rings near the bottle. The background
    is a blurred kitchen scene featuring cabinets, a window letting in daylight, and various kitchen appliances.
  init2final_edit_prompt: Edit the image to show the hand firmly gripping the plastic bottle. The bottle
    should appear visibly crushed and deformed, with its sides buckled and crumpled inward under the pressure
    of the hand. The bottle's original smooth cylindrical shape must be distorted, showing creases and
    structural collapse. Ensure the lighting is fully restored to the brightness of the initial scene.
  rationale: The prompt describes a sequence where a hand grabs and crushes a plastic bottle. Plastic
    deformation is an irreversible structural change; once crushed, the bottle cannot return to its original
    smooth cylindrical shape. The occlusion (lights turning off) hides the duration of the squeezing,
    but when the lights return, the physical state of the bottle must reflect the applied force. Therefore,
    the final frame must show the bottle in a crumpled, distorted state held by the hand, contrasting
    with the pristine, untouched bottle in the initial frame.
