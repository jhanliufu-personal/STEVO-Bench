id: drinking_fountain_button
level: 5
category: causal_mechanism
prompts:
  image_gen_prompt: A drinking fountain spout extends from the basin. No water is flowing from the spout.
    The camera view is centered on the fountain spout and basin.
  video_WM: The camera rotates right at constant speed until the spout exits the view. While the fountain spout is out of view,
    a hand presses the push button on the side of the fountain. Then the camera rotates left smoothly at the same rate
    back to the original viewpoint, bringing the fountain spout back into view. Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: While the fountain spout is out of view, a hand presses the push button on the side of the fountain.
camera_control:
  HY-WorldPlay: s-1, right-15, left-15
  lingbot: s-1, right-15, left-15
evaluation:
  init_frame_description: A close-up, eye-level view of a stainless steel drinking fountain. The central
    focus is the metal spout (bubbler) rising from the circular basin. The spout is dry with no water
    flowing. The background consists of a beige or off-white tiled wall. The metal surfaces show some
    wear and mineral deposits.
  init2final_edit_prompt: Edit the given image to show a stream of water arcing out of the metal spout.
    The water should form a clear, curved stream typical of an active drinking fountain, flowing from
    the nozzle opening down into the basin. Ensure the water looks realistic with appropriate transparency
    and reflections. Keep the metal spout, basin, and tiled background exactly as they are in the original
    image, maintaining the original camera viewpoint.
  rationale: 'The video sequence describes a causal interaction where the camera pans to reveal a button,
    a hand presses it, and the camera pans back to the spout. The pressing of the button is the mechanical
    trigger for the water valve. Therefore, when the camera returns to the spout, the functional consequence
    of that action must be visible: the fountain should be active with water flowing. The final state
    represents the system in its ''on'' state immediately following the trigger event.'
