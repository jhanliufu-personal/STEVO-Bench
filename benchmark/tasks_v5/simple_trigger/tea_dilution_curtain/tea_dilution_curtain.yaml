id: tea_dilution_curtain
level: 3
category: relational_state
relational_type: concentration_coupling
prompts:
  image_gen_prompt: A small pitcher filled with pitch-black tea concentrate is being tilted over a large
    glass of clear boiling water.
  video_WM: A hand tilts a pitcher of hot water over a glass of concentrated tea, beginning to pour; while the pouring continues, a heavy curtain drops from the ceiling between the camera and the glass, completely blocking the glass and pitcher from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: A hand tilts a pitcher of hot water over a glass of concentrated tea, pouring water into
    the tea.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A glass of clear hot water sits on a wooden table with steam rising from it.
    A ceramic pitcher held by a hand is tilted over the glass, pouring a dark, concentrated liquid (like
    tea or coffee) into the clear water. Dark swirls are visible in the glass where the liquids are beginning
    to mix.
  init2final_edit_prompt: Edit the given image to show the glass filled with a dark brown liquid, significantly
    higher in volume than the initial clear water, indicating the dark liquid has been poured in and mixed.
    The liquid in the glass should look like diluted tea or coffee. The ceramic pitcher should remain
    in a similar position but appear to have less liquid inside or be finishing the pour. Ensure the liquid
    level in the glass is higher and the color is dark brown throughout.
  rationale: 'The initial image visually depicts a dark liquid being poured into a clear liquid, despite
    the text prompt''s confusing description (which swaps the contents). A correct physical rollout must
    respect the visual initial state: the dark liquid flows from the pitcher into the glass. During the
    occlusion, the pouring continues, causing mass transfer. Consequently, the glass must contain more
    liquid (volume increase) and the liquid must be darker (mixing of dark concentrate into clear water).
    The pitcher must contain less liquid (conservation of mass). The cereal box acts only as an occluder
    and is removed by the end.'
