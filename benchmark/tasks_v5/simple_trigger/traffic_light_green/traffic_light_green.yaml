id: traffic_light_green
level: 6
category: causal_mechanism
mechanism_type: signal_convention_logic
prompts:
  image_gen_prompt: A side-on view of several cars lined up and stopped at an intersection, waiting at
    the stop line. The cars are completely stationary. The traffic signal is not visible in frame.
  video_WM: The camera rotates left at constant speed until the stopped cars exit the view. While the
    cars are out of view, the traffic light changes from red to green. Then the camera rotates right smoothly
    at the same rate back to the original viewpoint, bringing the intersection back into view. Smooth,
    continuous evolution with no scene changes or cuts.
  camera_WM: While the cars are out of view, the traffic light changes from red to green.
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  lingbot: s-3, left-20, right-20
evaluation:
  init_frame_description: A side-on view of an urban intersection. Several cars are stopped in a row
    at the stop line, completely stationary with no motion blur. The traffic signal controlling the lane
    is not visible in the frame.
  init2final_edit_prompt: Edit the given image to show the cars in motion, having just started moving
    from a stop. The cars should appear to be pulling forward from the stop line, with the lead car
    clearly ahead of its original position. Add subtle motion blur to the vehicles consistent with
    initial acceleration. Keep the road, lane markings, and background consistent with the original image.
  rationale: The initial frame shows cars stopped at a red traffic light. The video describes a sequence
    where the camera pans to the traffic signal, which changes from red to green. Green means go is one
    of the most universally understood social conventions — drivers proceed when the signal turns green.
    When the camera returns, the cars must be in motion, having responded to the signal change.
