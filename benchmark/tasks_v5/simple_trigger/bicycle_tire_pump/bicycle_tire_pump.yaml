id: bicycle_tire_pump
level: 5
category: causal_mechanism
prompts:
  image_gen_prompt: A close-up view of a visibly flat bicycle tire resting on the ground. The tire sidewall
    is noticeably deflated and sagging. The floor pump is not visible in frame.
  video_WM: The camera rotates right at constant speed until the flat tire exits the view. While the tire
    is out of view, a hand pumps the bicycle floor pump repeatedly to inflate the tire. Then the camera
    rotates left smoothly at the same rate back to the original viewpoint, bringing the tire back into
    view. Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: While the tire is out of view, a hand pumps the bicycle floor pump repeatedly to inflate the tire.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up side view of a bicycle wheel resting on a flat surface. The tire
    is visibly deflated — the rubber sidewall is sagging and deformed under the weight of the rim, and
    there is noticeable flattening where the tire contacts the ground.
  init2final_edit_prompt: Edit the given image to show the bicycle tire fully inflated. The sidewall should
    appear round and taut with no sagging or deformation. The gap between the rim and the ground should
    increase to reflect proper tire pressure, and the contact patch with the ground should be narrow and
    firm. Keep the wheel, rim, and background exactly as in the original image.
  rationale: The initial frame shows a visibly flat bicycle tire. The video prompt describes a sequence
    where the camera rotates away and a hand operates a floor pump, forcing air through the valve stem
    into the inner tube. When the camera returns, the tire must appear fully inflated with a rounded,
    taut sidewall, as pumping air into the tube raises its internal pressure until the tire holds its
    proper shape.
