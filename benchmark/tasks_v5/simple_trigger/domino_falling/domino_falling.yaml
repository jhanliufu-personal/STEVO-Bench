id: domino_falling
level: 3
category: relational_state
tags: []
prompts:
  image_gen_prompt: A row of upright rectangular dominoes is arranged in a line on a flat table. A finger
    is positioned just behind the first domino in the row, about to push it.
  video_WM: A finger tips over the first domino in a long standing row; while the chain reaction continues
    to cascade through the row, the lights turn off, leaving the room in complete darkness and the dominoes
    completely invisible for a prolonged duration. After a pause, the lights turn back on. The camera
    remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution
    with only objects present in the initial scene.
  camera_WM: A finger tips over the first domino in a long standing row.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A high-angle shot of a wooden table featuring a long, winding chain of standing
    wooden dominoes. A person's hand is visible on the left side, with a finger positioned to push the
    first domino. The background includes a window, potted plants, a stack of books, and a leather chair.
  init2final_edit_prompt: Edit the given image so that the winding row of standing dominoes is now lying
    flat on the table, having fallen over in a chain reaction. The fallen dominoes should follow the exact
    same winding path as the original standing ones. The hand on the left should be visible but the dominoes
    near it must be toppled. Ensure the background objects, table texture, and lighting remain identical
    to the original state.
  rationale: 'The prompt initiates a physical chain reaction (domino effect) and then occludes the scene
    with darkness for a prolonged period. During this occlusion, the laws of physics dictate that the
    chain reaction continues to propagate. When the lights turn back on, the state of the system must
    reflect the passage of time and the causal interaction: the dominoes must have fallen along their
    path. The conservation of the objects means they are all still present, just changed in orientation
    from vertical to horizontal.'
