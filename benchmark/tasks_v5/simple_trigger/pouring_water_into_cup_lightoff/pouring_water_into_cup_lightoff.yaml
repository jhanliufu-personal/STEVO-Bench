id: pouring_water_into_cup_lightoff
level: 3
category: relational_state
tags: []
prompts:
  image_gen_prompt: A hand holds a clear glass pitcher tilted above an empty clear glass on a table. A
    stream of water is just beginning to pour from the pitcher's spout into the glass. The pitcher is
    near full, and the glass is near empty.
  video_WM: A hand tilts a pitcher over an empty glass, beginning to pour water into it; while the pouring continues, the lights turn off, leaving the room in complete darkness and the glass and pitcher completely invisible for a prolonged duration. After a pause, the lights turn back on. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: A hand tilts a pitcher over an empty glass, beginning to pour water into it.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up shot of a glass pitcher held by a hand, tilted in a pouring position
    over a clear, empty glass tumbler sitting on a wooden table. The pitcher contains water. The background
    shows a blurred window with natural light coming through.
  init2final_edit_prompt: Edit the given image to show the glass filled with water and the pitcher containing
    significantly less water. The water level in the glass must be high, indicating a prolonged pour,
    and the water level in the pitcher must be correspondingly lower. Maintain the exact position of the
    glass, the hand holding the pitcher, and the background details.
  rationale: The prompt describes a pouring action that continues for a prolonged duration while the view
    is occluded by a cereal box. Although the interaction is hidden from the camera, the physical process
    of fluid transfer persists. Therefore, in the final state after the occluder is removed, the glass
    must contain a significant volume of water, and the pitcher must have lost an equivalent volume, respecting
    the conservation of mass and the continuity of the action.
