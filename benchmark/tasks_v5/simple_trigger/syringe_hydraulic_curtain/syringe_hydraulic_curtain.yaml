id: syringe_hydraulic_curtain
level: 3
category: relational_state
relational_type: volumetric_coupling
prompts:
  image_gen_prompt: Two 50ml clear medical syringes are connected by a thin, transparent plastic tube
    filled with red liquid. The left syringe is full (50ml) and the right syringe is empty (0ml).
  video_WM: As a hand is pushing the plunger of the left syringe slowly, a heavy curtain drops from the ceiling between the camera and the syringes, completely blocking the syringes from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: A hand pushes the plunger of the left syringe slowly.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: Two large plastic syringes resting on a metal tray lined with a white cloth.
    The left syringe is filled with red liquid and its plunger is pulled out (extended). The right syringe
    is empty and its plunger is pushed all the way in. A clear plastic tube connects the nozzle of the
    left syringe to the nozzle of the right syringe, forming a closed hydraulic loop. The background shows
    a blurred window sill.
  init2final_edit_prompt: Edit the given image to show the result of hydraulic fluid transfer. Push the
    plunger of the left syringe further into the barrel, significantly reducing the amount of red liquid
    inside it. Correspondingly, extend the plunger of the right syringe outwards and fill its barrel with
    the red liquid transferred from the left syringe. Ensure the total volume of red liquid appears conserved
    between the two containers.
  rationale: The video describes a hydraulic action where the left plunger is pressed. Because the syringes
    are connected by a tube in a closed system, the conservation of volume requires that as fluid is forced
    out of the left syringe, it must flow into the right syringe. This causes the right plunger to extend
    (move outwards) as the barrel fills with red liquid. The camera motion temporarily occludes the scene,
    requiring the model to simulate this coupled state change over time without visual feedback, ensuring
    that when the view returns, the state reflects the accumulated fluid transfer.
  questions:
  - id: right_plunger_extension
    question: Is the plunger of the right syringe extended further out than it was in the initial frame?
    answer_type: yes_no
    notes_for_judge: The right plunger should have moved to the right (outwards) to accommodate the incoming
      fluid.
  - id: right_syringe_filled
    question: Does the right syringe now contain a significant amount of red liquid?
    answer_type: yes_no
    notes_for_judge: Initially empty, it should now be partially or mostly filled with red fluid.
  - id: left_plunger_depressed
    question: Is the plunger of the left syringe pushed further into the barrel compared to the initial
      frame?
    answer_type: yes_no
    notes_for_judge: The left plunger acts as the source of pressure and should have moved inwards.
  - id: left_syringe_level
    question: Is the volume of red liquid in the left syringe lower than in the initial frame?
    answer_type: yes_no
    notes_for_judge: Fluid must leave the left syringe to fill the right one.
  - id: conservation_relation
    question: Does the amount of liquid gained by the right syringe appear roughly proportional to the
      amount lost by the left syringe?
    answer_type: yes_no
    notes_for_judge: Tests conservation of volume in the coupled system.
  - id: connection_consistency
    question: Are the two syringes still connected by the clear tubing?
    answer_type: yes_no
    notes_for_judge: The mechanism relies on this connection remaining intact.
  - id: plunger_coordination
    question: Do the positions of the two plungers indicate a coordinated movement (one in, one out)?
    answer_type: yes_no
    notes_for_judge: Checks for the relational constraint of the hydraulic linkage.
