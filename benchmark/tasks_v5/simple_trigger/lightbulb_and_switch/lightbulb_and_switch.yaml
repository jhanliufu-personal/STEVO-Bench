id: lightbulb_and_switch
level: 5
category: causal_reasoning
tags: []
prompts:
  image_gen_prompt: A plain interior room viewed from slightly below. A single ceiling-mounted light fixture
    is centered in the frame — the bulb is off and unlit. The ceiling is white and the walls are bare.
    The room is dark due to the lack of lighting. The wall switch is not visible in frame.
  video_WM: The camera smoothly moves left at constant speed until the ceiling light exits the frame to the right. 
    While the light is out of view, a human hand toggles the wall switch. Then the camera moves right back to the 
    original viewpoint, bringing the ceiling light back into view. Smooth, continuous evolution with no scene changes or cuts.
  camera_WM: While the light is out of view, a human hand toggles the wall switch.
camera_control:
  HY-WorldPlay: s-3, left-20, right-20
  lingbot: s-3, left-20, right-20
  Genie: null
evaluation:
  init_frame_description: A low-angle shot of a dim, empty room with a wooden floor and white walls. A
    single light fixture with a bare bulb is mounted in the center of the ceiling. The room is poorly
    lit with heavy vignetting and shadows in the corners, and the light bulb appears clear and dark, indicating
    that the light is currently turned off.
  init2final_edit_prompt: Edit the given image to turn the ceiling light on. The light bulb should be
    glowing brightly with a white or warm light. The entire room, including the white walls and wooden
    floor, should be significantly brighter and well-illuminated by the central light source. The shadows
    in the corners should be reduced or softened consistent with the light being active.
  rationale: The initial frame displays a room with the light turned off. The video prompt describes a
    sequence where the camera pans away, a switch is toggled while the light is out of view, and the camera
    returns to the original viewpoint. Since the light starts in the OFF state, toggling the switch transitions
    the system to the ON state. Therefore, the final frame must depict the same scene but with the light
    bulb glowing and the room illuminated.
