id: tire_inflate_lightoff
level: 1
category: scalar_state
scalar_variable: Tire outer diameter
prompts:
  image_gen_prompt: A flat bicycle tire on a rim. A high-pressure air hose is attached to the valve, and
    the rubber is just starting to push outward.
  video_WM: Air is continuously pumped into the deflated tire through the pump nozzle; while the air pumping continues, the lights turn off, leaving the room in complete darkness and the tire completely invisible for a prolonged duration. After a pause, the lights turn back on. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: Air is getting pumped into the deflated tire through the pump nozzle.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up, low-angle shot of a bicycle wheel with a significantly deflated
    tire resting on a concrete floor. The bottom of the tire is flattened and compressed against the ground.
    A black air hose with a brass fitting is connected to the tire's valve stem. In the foreground, several
    metal wrenches lie on the stained concrete. In the background, a red air compressor and other workshop
    equipment are visible but slightly out of focus.
  init2final_edit_prompt: Edit the given image to show the bicycle tire in an inflated state. The bottom
    section of the tire, which was previously flattened against the concrete, should now be round and
    firm. The metal rim of the wheel should be elevated higher from the ground due to the tire's expansion.
    The tire sidewalls should appear taut rather than compressed. Maintain the exact position of the tools
    on the floor, the background compressor, and the air hose connected to the valve.
  rationale: The prompt describes a continuous action of pumping air into the tire. While the view is
    occluded by the toolbox, the inflation process continues, increasing the volume and pressure within
    the tire. When the toolbox is removed, the tire must appear significantly more inflated than in the
    initial frame. This manifests as the tire becoming rounder, the flattened contact patch shrinking,
    and the rim lifting away from the floor.
