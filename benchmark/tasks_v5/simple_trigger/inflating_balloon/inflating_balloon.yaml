id: inflating_balloon
level: 1
category: scalar_state
scalar_variable: Balloon size
prompts:
  image_gen_prompt: A limp white latex weather balloon attached to a green helium tank nozzle on a grassy
    field. The tank valve is visibly turned to the 'Open' position.
  video_WM: A hand opens the valve of the helium tank, and helium begins pumping into the balloon; while
    the balloon continues to inflate, a large box is placed in front of the balloon and tank, completely
    blocking them from the camera view, without touching or interacting with any object in the scene,
    for a prolonged duration. After a pause, the box is removed. The camera remains stationary; no scene
    cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present
    in the initial scene.
  camera_WM: A hand opens the valve of the helium tank, and helium is pumped into the balloon.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A green gas cylinder labeled 'HELIUM' sits on a grassy field. A gloved hand
    is positioned on the valve at the top of the tank. A deflated, cream-colored balloon is attached to
    the nozzle extending from the tank.
  init2final_edit_prompt: Edit the given image so that the cream-colored balloon attached to the nozzle
    is significantly inflated, appearing much larger, rounder, and filled with gas compared to the initial
    deflated state. Ensure the green helium tank and the grassy background remain unchanged.
  rationale: The video prompt describes the opening of a helium valve, which initiates the inflation of
    the balloon. Although a box occludes the scene for a duration, the physical process of inflation continues
    behind the occlusion. When the box is removed, the balloon should be in a state of increased volume
    (inflated) compared to the initial deflated state. The environment and tank remain static.
