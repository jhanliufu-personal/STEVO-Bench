id: hourglass_accumulation_lightoff
level: 1
category: scalar_state
scalar_variable: Bottom pile height
prompts:
  image_gen_prompt: Generate an image that shows a large wooden hourglass with white sand flowing through
    the narrow neck in a steady line. A small conical mound of sand is visible in the bottom bulb.
  video_WM: The room lights switch off, leaving the hourglass in complete darkness and completely invisible
    for a prolonged duration. After a pause, the lights switch back on. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A close-up shot of a wooden hourglass standing on a wooden desk. The hourglass
    is currently active, with white sand flowing from the top bulb to the bottom bulb. The top bulb is
    roughly half full of sand. The bottom bulb contains a conical pile of sand that is also roughly half
    full. To the left, there is a vintage balance scale and stacks of old books. In the background, there
    is a window and a bookshelf filled with books. The lighting is natural and soft.
  init2final_edit_prompt: Edit the given image to show the hourglass with significantly less sand in the
    top bulb and a correspondingly larger pile of sand in the bottom bulb. The sand level in the top chamber
    should be much lower, potentially near empty, and the sand pile in the bottom chamber should be taller
    and fuller, occupying more volume than before.
  rationale: The video prompt describes a prolonged period of darkness during which the scene is invisible.
    During this occlusion, the physical process of the hourglass continues uninterrupted by the lack of
    light; gravity causes the sand to continue flowing from the top chamber to the bottom chamber. Therefore,
    when the lights turn back on, the state of the hourglass must reflect the passage of time. The final
    frame must show the accumulation of sand in the bottom bulb and the depletion of sand from the top
    bulb.
