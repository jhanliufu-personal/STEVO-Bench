id: paper_burning
level: 4
category: transformational_state_change
tags: []
prompts:
  image_gen_prompt: A piece of paper rests on a heat-resistant plate on a table. One edge of the paper
    is lit with a small flame, just beginning to burn.
  video_WM: A dark curtain is drawn across the lens, completely blocking the scene from view for a prolonged
    duration. without touching or interacting with any object in the scene. After a pause, the cardboard
    is pulled away. The camera remains stationary; no scene cuts; no new people or objects enter the scene.
    Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A close-up, slightly high-angle shot of a rolled piece of thick, textured white
    paper resting on a rustic, round ceramic plate. The plate sits on a worn wooden table. In the background,
    a window with a white frame is visible. The paper roll is actively burning; a small flame is visible
    on the right side where the paper meets the plate, and smoke is rising. The edges of the paper near
    the flame are charred black and brown, indicating the fire has already begun to consume the material.
  init2final_edit_prompt: Edit the given image to show the paper in a significantly more advanced state
    of burning. The white paper should be largely consumed, replaced by black char and grey ash. The original
    rolled shape should appear collapsed or degraded due to the fire damage. Reduce the amount of visible
    white paper surface area significantly. Maintain the exact appearance of the ceramic plate, the wooden
    table surface, and the window background.
  rationale: 'The initial frame shows a piece of paper actively burning. The video prompt describes a
    prolonged occlusion event where the view is blocked. During this time, the physical process of combustion
    continues uninterrupted. Therefore, when the view is restored, the paper must be significantly more
    burnt than in the initial frame. This is an irreversible transformation: the paper turns to ash and
    char, its structure degrades, and the amount of unburnt material decreases. The surrounding environment
    (plate, table, window) remains static.'
