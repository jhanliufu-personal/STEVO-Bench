id: sandcastle_wave_impact_cardboard
level: 4
category: structural_transformation
transformation_type: structural_collapse
prompts:
  image_gen_prompt: A detailed sandcastle sits on a beach. A large ocean wave is cresting and just about
    to crash directly onto the castle.
  video_WM: A large opaque tarpaulin is held up between the camera and the sandcastle, completely blocking
    the sandcastle and beach from view, without touching or interacting with any object in the scene,
    for a prolonged duration. After a pause, the tarpaulin is lowered. The camera remains stationary;
    no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects
    present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A detailed, multi-tiered sandcastle sits on a sandy beach. The castle has multiple
    towers with conical roofs, arched bridges, and walls decorated with seashells. Behind the sandcastle,
    a massive, translucent green wave is curling and cresting, poised to crash directly onto the castle.
    The wave has white foam at its peak and base. The sky is overcast with grey clouds.
  init2final_edit_prompt: Edit the given image to show the aftermath of the large wave crashing. Flatten
    and erode the sandcastle structure significantly, leaving behind a shapeless, wet mound of sand or
    a smooth beach surface where the intricate towers stood. Replace the looming green curling wave with
    turbulent white foam, splashing water, or wet sand indicating the wave has washed over the area. Ensure
    the sand appears soaked and the structural details of the castle are destroyed.
  rationale: The initial image captures a sandcastle moments before a large wave crashes onto it. The
    video prompt describes a prolonged occlusion by a tarpaulin. During this prolonged period, the physics
    of the scene dictate that the looming wave must crash, releasing its energy onto the sandcastle. Sandcastles
    are structurally weak against water impact. Therefore, when the view is restored, the irreversible
    transformation of the sandcastle (destruction/erosion) must have occurred, and the wave itself will
    have transitioned from a curling crest to whitewater, foam, or receding wash.
