  init_frame_description: A close-up shot against a black background showing a hand on the right holding
    a burning sparkler. The sparkler extends diagonally towards the upper left. A bright cluster of white
    and gold sparks is emitting from an active ignition point on the wire. There is a visible length of
    unburnt gray coating between the burning point and the hand. Smoke is swirling around the sparks.
  init2final_edit_prompt: Edit the given image to show the sparkler has burned further down the stick.
    Move the bright glowing ignition point and the cluster of sparks significantly closer to the hand
    holding the stick. Shorten the length of the unburnt gray coating between the sparks and the fingers.
    Show a longer section of burnt, blackened wire or ash extending from the sparks towards the upper
    left where the fuel has been consumed.
  rationale: The video prompt describes a camera rotation that removes the sparkler from view for several
    seconds before returning to the exact original angle. During this period of occlusion, the sparkler
    continues to burn. Physically, a sparkler burns from the tip towards the handle (the hand). Therefore,
    in the final frame, the ignition point (source of sparks) must have traveled down the wire, closer
    to the hand, resulting in a shorter segment of unburnt fuel and a longer segment of burnt residue.
