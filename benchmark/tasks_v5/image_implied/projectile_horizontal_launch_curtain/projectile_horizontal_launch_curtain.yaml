id: projectile_horizontal_launch_curtain
level: 2
category: spatial_kinematics
kinematic_variable: Parabolic trajectory (x, y)
prompts:
  image_gen_prompt: A small spring-loaded cannon mounted on a table. A red ball has just been fired horizontally
    from the muzzle and is mid-air, traveling away from the table.
  video_WM: A heavy curtain drops from the ceiling between the camera and the ball and cannon, completely blocking the ball from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the curtain rises. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A brass cannon mounted on a wooden carriage sits on a wooden workbench. A red
    ball is in mid-air just to the right of the cannon muzzle, blurring from motion. A puff of white smoke
    is expanding from the muzzle. In the foreground, blueprints and a pencil lie on the table. In the
    background, an open door leads to a garage area with tools.
  init2final_edit_prompt: Edit the given image to remove the red ball and the white smoke cloud from the
    air. Show the background (doorway and garage) clearly where the smoke and ball were previously obscuring
    it. Keep the cannon, wooden carriage, workbench, blueprints, and room interior exactly as they are.
  rationale: The video prompt describes a camera movement that pans away to follow the ball and then returns
    to the initial centered view of the cannon. This sequence implies a duration of time has passed. During
    this interval, the high-velocity projectile (red ball) will have traveled significantly downrange
    (likely exiting the frame or landing in the distance) and the transient muzzle smoke will have dissipated.
    Therefore, the final frame should depict the static environment without the momentary dynamic elements
    of the launch.
  questions:
  - id: ball_moved
    question: Is the red ball absent from its initial position near the cannon muzzle?
    answer_type: yes_no
    notes_for_judge: The ball should have moved away due to its velocity.
  - id: ball_trajectory
    question: Has the red ball moved away from the area directly in front of the cannon?
    answer_type: yes_no
    notes_for_judge: It should not be hovering in the same spot.
  - id: smoke_dissipated
    question: Is the white smoke cloud gone from the space near the muzzle?
    answer_type: yes_no
    notes_for_judge: Smoke dissipates over time.
  - id: background_visibility
    question: Is the doorway background visible where the smoke was initially blocking it?
    answer_type: yes_no
    notes_for_judge: With smoke gone, the background should be clear.
  - id: empty_space
    question: Is the space immediately to the right of the cannon muzzle empty?
    answer_type: yes_no
    notes_for_judge: The projectile and smoke should be gone.
  - id: cannon_static
    question: Is the cannon still resting on the wooden workbench?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
  - id: blueprints_static
    question: Are the blueprints on the table unchanged?
    answer_type: yes_no
    notes_for_judge: Secondary consistency check.
