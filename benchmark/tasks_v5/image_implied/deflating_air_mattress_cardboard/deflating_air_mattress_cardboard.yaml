id: deflating_air_mattress_cardboard
level: 1
category: scalar_state
scalar_variable: Mattress height
prompts:
  image_gen_prompt: A fully inflated blue vinyl air mattress on a floor. The black air valve is wide open,
    and the mattress is just starting to show slight surface wrinkles.
  video_WM: A piece of cardboard is held up in front of the camera view, completely blocking the mattress from view, without touching or interacting with any object in the scene, for a prolonged duration. After a pause, the cardboard is lowered. The camera remains stationary; no scene cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
evaluation:
  init_frame_description: A blue, rectangular air mattress resting on a wooden floor. The mattress is
    fully inflated, appearing thick and taut with a smooth surface. In the foreground corner, a black
    air valve is visible; the cap is unplugged and hanging to the side, leaving the valve opening exposed
    to the air.
  init2final_edit_prompt: Edit the given image to show the blue air mattress in a deflated state. Reduce
    the vertical height of the mattress significantly so it sits lower on the wooden floor. Change the
    surface texture from smooth and taut to loose, wrinkled, and sagging to indicate loss of air pressure.
    The overall volume of the mattress should appear much smaller. Ensure the valve remains open and the
    surrounding room details and lighting remain unchanged.
  rationale: The initial frame shows the air mattress with its valve cap open. The video prompt describes
    a 'prolonged duration' passing while the room is in darkness. During this time, the air inside the
    inflated mattress will naturally escape through the open valve due to the pressure difference. Therefore,
    when the lights turn back on, the mattress should have lost a significant amount of volume, appearing
    deflated, flatter, and more wrinkled than in the initial state.
