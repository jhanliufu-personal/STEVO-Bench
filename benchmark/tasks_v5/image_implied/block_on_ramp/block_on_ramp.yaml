id: block_on_ramp
level: 2
category: kinematics
tags: []
prompts:
  image_gen_prompt: A small rectangular block rests near the top of a smooth inclined ramp placed on a
    flat tabletop. The ramp surface is visibly smooth and the block sits still against it.
  video_WM: A large opaque panel slides in front of the ramp from the side, completely blocking the block
    and ramp from the camera view, without touching or interacting with any object in the scene, for a
    prolonged duration. After a pause, the panel slides away. The camera remains stationary; no scene
    cuts; no new people or objects enter the scene. Smooth, continuous evolution with only objects present
    in the initial scene.
  camera_WM: ''
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A rectangular wooden block rests near the top of a smooth, stainless steel ramp
    (inclined plane). The ramp is positioned on a wooden table, sloping downwards from left to right.
    A small metal mechanism is visible behind the block at the top of the ramp. The background shows a
    laboratory setting with windows and cabinets.
  init2final_edit_prompt: Edit the given image to show the wooden block located at the bottom of the metal
    ramp. Remove the block from its original position at the top of the incline, leaving the metal surface
    there empty. Place the block resting at the lowest point of the ramp, near the table surface. Maintain
    the original lighting, background, and camera perspective.
  rationale: 'The initial frame sets up a classic physics scenario: a block on a smooth, steep inclined
    plane. Under the influence of gravity, and assuming the small stop behind it does not clamp it (implied
    by the kinematic focus of the task), the block will slide down the ramp. The ''prolonged duration''
    of the occlusion provides sufficient time for the block to accelerate and slide to the bottom of the
    ramp. Therefore, in the final state, the block should be found at the base of the incline.'
