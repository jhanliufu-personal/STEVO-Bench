id: hourglass_accumulation_00
level: 1
category: scalar_state
scalar_variable: Bottom pile height
prompts:
  image_gen_prompt: Generate an image that shows a large wooden hourglass with white sand flowing through the narrow neck
    in a steady line. A small conical mound of sand is visible in the bottom bulb.
  video_WM: ''
  camera_WM: ''
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A close-up shot of a wooden hourglass standing on a wooden desk. The hourglass has three carved
    pillars and glass bulbs containing white sand. In this initial state, sand is actively flowing from the top bulb to the
    bottom bulb. The top bulb contains a significant amount of sand, while the bottom bulb has a conical pile of sand accumulating.
    The background features blurred bookshelves filled with books, a window with natural light, and other desk objects like
    a small bowl and stacked books.
  init2final_edit_prompt: Edit the given image to show the hourglass with a significantly larger and taller pile of white
    sand in the bottom bulb, and a reduced amount of sand remaining in the top bulb. Ensure the sand level in the top bulb
    is lower than in the original image. Maintain the exact same camera angle, lighting, and background details.
  rationale: 'The video prompt describes a continuous physical process (sand flowing) that persists while the camera rotates
    away and then returns. Although the hourglass is temporarily occluded by the camera''s field of view moving, the flow
    of sand does not stop. Therefore, when the camera returns to the initial framing, the state of the hourglass must have
    evolved: the bottom bulb must contain more sand (accumulated mass), and the top bulb must contain less sand (depleted
    mass).'
