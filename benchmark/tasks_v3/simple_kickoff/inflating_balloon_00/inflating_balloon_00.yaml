id: inflating_balloon_00
level: 1
category: scalar_state
scalar_variable: Balloon size
prompts:
  image_gen_prompt: A limp white latex weather balloon attached to a green helium tank nozzle on a grassy field. The tank
    valve is visibly turned to the 'Open' position.
  video_WM: A hand opens the valve of the helium tank, and helium is pumped into the balloon.
  camera_WM: A hand opens the valve of the helium tank, and helium is pumped into the balloon.
camera_control:
  HY-WorldPlay: null
  lingbot: null
evaluation:
  init_frame_description: A green gas cylinder labeled 'HELIUM' sits on a grassy field with a fence and hills in the background.
    A deflated, cream-colored balloon is attached to the tank's brass nozzle and drapes limply onto the grass. A gloved hand
    is holding the valve handle at the top of the tank.
  init2final_edit_prompt: Edit the given image to show the cream-colored balloon significantly inflated. The balloon should
    appear expanded, rounder, and filled with gas, occupying more volume and extending outward or upward from the nozzle rather
    than hanging limp and flat on the grass. Keep the green helium tank, the gloved hand, and the grassy background unchanged.
  rationale: The prompt establishes that the balloon is connected to an open tank and is actively inflating. The camera rotates
    away and then returns, creating a period of occlusion. During this time, the inflation process continues. Therefore, in
    the final frame, the balloon must exhibit a scalar increase in volume (it should be larger and fuller) compared to the
    initial deflated state. The surrounding environment and the tank itself remain static.
