id: plastic_bottle_hand_crush
level: 4
category: structural_transformation
transformation_type: plastic_container_deformation
tags: []
prompts:
  image_gen_prompt: An empty transparent plastic water bottle stands upright on a table. The bottle is made of thin flexible
    PET plastic with smooth cylindrical walls. A hand approaches the bottle ready to squeeze.
  video_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it; while the hand continues squeezing and the bottle deforms further, the lights turn off, leaving the room in complete darkness and the hand and bottle completely invisible. After a pause, the lights turn back on.
  camera_WM: A hand grips a plastic bottle and squeezes it firmly, beginning to crush it.
camera_control:
  HY-WorldPlay: s-3, right-20, left-20
  lingbot: s-3, right-20, left-20
  Genie: null
evaluation:
  init_frame_description: A clear, empty plastic water bottle stands upright on a wooden table. To the left, a human arm and
    hand are visible, reaching towards the bottle with fingers extended as if about to grab it. Faint water rings are visible
    on the table surface near the bottle. The background shows a blurred kitchen interior with a window, cabinets, and appliances.
  init2final_edit_prompt: Edit the given image to show the hand firmly gripping the plastic bottle. The bottle must appear
    significantly crushed, crumpled, and deformed within the hand's grasp, showing irregular folds and buckling in the clear
    plastic material. The bottle should no longer be a smooth cylinder. Maintain the original background, lighting, and table
    texture.
  rationale: The prompt describes a physical interaction where a hand squeezes a thin plastic bottle. This material undergoes
    irreversible plastic deformation when the force exceeds its structural limit. Although the camera pans away during the
    action, the prompt specifies the squeezing continues and the camera returns. Therefore, the final state must show the
    bottle in a crushed, permanently deformed state held by the hand, rather than its original pristine cylindrical shape.
